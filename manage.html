.k2-sub{font-size:13px;color:var(--gt);line-height:1.45;}
.k2-act{display:flex;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);}
.k2-act .btn{width:auto !important;min-height:44px;padding:0 18px;border-radius:999px;font-weight:800;}
.k2-empty{background:var(--card);border:1.5px dashed var(--line-2);border-radius:20px;padding:28px;text-align:center;color:var(--gt);font-size:15px;}
.k2-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px;}
.k2-stat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;}
.k2-stat small{display:block;font-size:13px;color:var(--gt);font-weight:700;}
.k2-stat b{display:block;font-size:26px;font-weight:800;color:var(--td);margin-top:2px;font-variant-numeric:tabular-nums;}
.k2-stat span{display:block;font-size:12.5px;color:var(--gt);margin-top:2px;}
.k2-stat.click{cursor:pointer;}
.k2-stat.bad b{color:var(--bad);} .k2-stat.warn b{color:var(--warn);} .k2-stat.ok b{color:var(--ok);}
@media (max-width:600px){.k2-tabs-l{width:100%;}.k2-nav button{min-height:46px;padding:0 16px;font-size:15px;}.k2-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}.k2-stat{padding:12px;}.k2-stat b{font-size:22px;}.k2-stat span{display:none;}}
.k2-list{display:flex;flex-direction:column;gap:10px;}
.k2-row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--td);font-size:16px;font-weight:700;text-align:left;cursor:pointer;font-family:inherit;}
.k2-row.red{border-color:var(--bad-line);} .k2-row.yellow{border-color:var(--warn-line);}
.k2-dot{width:10px;height:10px;border-radius:50%;background:var(--gt);flex-shrink:0;}
.k2-row.red .k2-dot{background:var(--bad);} .k2-row.yellow .k2-dot{background:var(--warn);}
.k2-row-l{flex:1;min-width:0;}
.k2-row-n{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
.k2-row.red .k2-row-n{color:var(--bad);} .k2-row.yellow .k2-row-n{color:var(--warn);}
.k2-row svg{color:var(--gt);flex-shrink:0;}
.k2-sec{font-size:18px;font-weight:800;color:var(--td);margin:20px 2px 10px;display:flex;align-items:center;gap:8px;}

html.tab-ui .edit-sheet.nl-sheet{width:min(1080px,94vw);max-height:92vh;}
.nlf{display:flex;flex-direction:column;gap:14px;}
.nlf-card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;}
.nlf-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;font-weight:800;color:var(--td);margin-bottom:12px;}
.nlf-h .btn.sm{min-height:40px;}
.nlf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px;}
.nlf-grid .field{margin-bottom:0;}
.nlf .field .hint,.nlf .small-note{font-size:13px;line-height:1.45;}
.nlf-note{font-size:13px;color:var(--gt);line-height:1.45;margin:-4px 0 12px;}
.nlf-sw{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;}
.nlf-sw:first-of-type{border-top:none;padding-top:0;}
.nlf-sw > span{flex:1;min-width:0;}
.nlf-sw b{display:block;font-size:15px;color:var(--td);}
.nlf-sw small{display:block;font-size:13px;color:var(--gt);margin-top:2px;line-height:1.4;}
.nlf-sw input[type=checkbox]{appearance:none;-webkit-appearance:none;flex-shrink:0;width:52px;height:32px;border-radius:999px;background:var(--fill-2,#ddd);position:relative;cursor:pointer;transition:background .15s ease;margin:0;}
.nlf-sw input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s ease;}
.nlf-sw input[type=checkbox]:checked{background:var(--gd);}
.nlf-sw input[type=checkbox]:checked::after{transform:translateX(20px);}
.nlf-pkg{display:grid;grid-template-columns:minmax(120px,1.3fr) auto minmax(90px,1fr) minmax(90px,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);}
.nlf-pkg.field{margin-bottom:0;}
.nlf-pkg:first-child{border-top:none;padding-top:0;}
.nlf-pkg input,.nlf-pkg select{min-height:46px;width:100%;min-width:0;}
.nlf-pkg .nlf-eq{font-size:16px;font-weight:800;color:var(--gt);}
.nlf-pkg .pkg-out{grid-column:1 / -1;border-top:none;padding-top:0;margin-top:-2px;font-size:13px;}
@media (max-width:600px){
  .nlf-pkg{grid-template-columns:1fr 1fr auto;}
  .nlf-pkg input[id^=pkgName]{grid-column:1 / -1;}
  .nl-grid{grid-template-columns:1fr;}
  .nl-search{max-width:none;}
  .nlf-pkg .nlf-eq{display:none;}
}
.nlf-save{position:sticky;bottom:-26px;margin:0 -26px -26px;padding:14px 26px 20px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--bg) 30%);display:flex;justify-content:flex-end;}
.nlf-save .btn{width:auto;min-width:260px;min-height:52px;border-radius:999px;font-size:16px;font-weight:800;}
@media (max-width:600px){ .nlf-save{margin:0 -18px -24px;padding:14px 18px 20px;} .nlf-save .btn{width:100%;} }
.nlf .seg.nlf-seg{max-width:none;width:100%;margin-bottom:8px;overflow:visible;}
.nlf-seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:66px !important;white-space:normal;text-align:center;padding:10px 12px;}
.nlf-seg button b{font-size:15px;font-weight:800;}
.nlf-seg button small{font-size:12.5px;font-weight:500;color:var(--gt);line-height:1.3;}
.nlf-seg button.active small{color:var(--gm);}


/* ---------- [MỚI] TỒN THEO VỊ TRÍ — thẻ đối chiếu riêng, to & rõ hơn hẳn khối
   dùng chung .pkg-row (vốn cho form quy cách/định mức, không phải chỗ đếm-đặt-số
   quan trọng mỗi lần lệch kho). Viền trái đổi màu theo mức độ để lướt mắt là
   thấy ngay dòng nào đang có vấn đề, không phải đọc từng số. ---------- */
.ls-card{
  background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--line);
  border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh-1);
}
.ls-card.ls-lech{border-left-color:var(--warn);}
.ls-card.ls-neg{border-left-color:var(--bad);}
.ls-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.ls-name{font-size:17px;font-weight:800;color:var(--td);}
.ls-total-tag{font-size:12.5px;font-weight:700;color:var(--gm);background:var(--gl);padding:5px 12px;border-radius:999px;white-space:nowrap;}
.ls-current{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed var(--line-2);}
.ls-current-label{font-size:14px;color:var(--ink-2);}
.ls-current-val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--td);white-space:nowrap;}
.ls-current-val.ls-neg-val{color:var(--bad);}
.ls-input-row{display:flex;gap:10px;align-items:stretch;margin-bottom:10px;}
.ls-input-row input{flex:1;min-width:0;height:54px;font-size:21px;font-weight:800;
  border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font-variant-numeric:tabular-nums;}
.ls-input-row input:focus{border-color:var(--gd);outline:none;box-shadow:0 0 0 3px var(--gl);}
.ls-input-row .unit-tag{height:54px;padding:0 16px;font-size:15px;border-radius:14px;}
.ls-preview{font-size:14.5px;font-weight:650;color:var(--gm);}
.ls-warn{margin-top:12px;font-size:13.5px;line-height:1.65;color:#92400e;background:var(--warn-bg);border-radius:12px;padding:12px 14px;}

/* ==========================================================================
   11. DÒNG DANH SÁCH
   ========================================================================== */
.litem{
  background:var(--card);border:1px solid rgba(230,227,223,.8);
  border-radius:var(--r-md);padding:14px 15px;margin-bottom:9px;min-height:64px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  /* Cho phép XUỐNG DÒNG. Trước đây .li-r có flex-shrink:0 + nowrap còn .li-l chỉ
     min-width:0 — nên khi khối phải rộng hơn chỗ trống (ô 360px ở giao diện
     tablet, dòng có 4 nút) thì .li-l bị bóp về gần 0: chữ rớt mỗi dòng một từ,
     còn khối phải tràn ra ngoài thẻ, đè lên nhau. Giờ hết chỗ thì khối phải tự
     xuống hàng dưới, không món nào bị nghiền nữa. */
  flex-wrap:wrap;row-gap:8px;
  box-shadow:var(--sh-1);
  transition:box-shadow .16s ease,border-color .16s ease,transform .14s var(--ease-out);
}
.litem .li-l{min-width:0;flex:1 1 190px;}
.litem .li-l div:first-child{font-size:15.5px;font-weight:600;color:var(--td);line-height:1.35;}
.litem .li-l div:last-child{font-size:13.5px;color:var(--gt);margin-top:3px;line-height:1.45;}
.litem .li-r{
  font-size:15px;font-weight:650;text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:9px;flex-shrink:0;
  /* margin-left:auto để khi xuống hàng vẫn dính lề phải; flex-wrap để chính dãy
     nút cũng gãy được nếu thẻ hẹp hơn cả dãy nút. */
  margin-left:auto;flex-wrap:wrap;justify-content:flex-end;
}
/* Nút icon trong danh sách: TRÒN và CÓ MÀU theo hành động, thay cho một dãy
   nút xám vuông bo góc giống hệt nhau (trước đây phải đọc icon mới biết nút nào
   xoá, nút nào sửa). Màu gán tự động qua data-ic mà hàm ic() gắn vào mỗi SVG —
   không phải sửa hơn 40 chỗ gọi trong JS. Trình duyệt không hiểu :has() thì
   rơi về màu thương hiệu mặc định, vẫn tròn, vẫn có màu. */
.iconbtn{
  background:var(--gl);border-radius:50%;
  width:46px;height:46px;color:var(--gd);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s ease,color .15s ease,transform .12s var(--ease-out);
}
.iconbtn:active{transform:scale(.9);filter:brightness(.94);}
.iconbtn:has([data-ic="x"]),.iconbtn:has([data-ic="trash"]){background:var(--bad-bg);color:var(--bad);}
.iconbtn:has([data-ic="pencil"]){background:var(--bb);color:var(--bi);}
.iconbtn:has([data-ic="check"]){background:var(--ok-bg);color:var(--ok);}
.iconbtn:has([data-ic="pause"]),.iconbtn:has([data-ic="play"]){background:var(--warn-bg);color:var(--warn);}
.iconbtn:has([data-ic="clock"]){background:var(--fill);color:var(--ink-2);}
.iconbtn:has([data-ic="dots"]),
.iconbtn:has([data-ic="chevronUp"]),.iconbtn:has([data-ic="chevronDown"]),
.iconbtn:has([data-ic="arrowUp"]),.iconbtn:has([data-ic="arrowDown"]){background:var(--fill);color:var(--ink-2);}
/* Menu "..." — mục xoá cũng phải đỏ ngay từ icon */
.more-menu button.danger .ic-svg{color:var(--bad);}

/* ---------- Menu "..." (kiểu context menu iOS) ---------- */
.more-menu-wrap{position:relative;flex-shrink:0;}
.more-menu{
  display:none;position:absolute;right:0;top:52px;z-index:80;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--sh-pop);min-width:210px;overflow:hidden;
  transform-origin:top right;
}
.more-menu.open{display:block;animation:pi .18s var(--ease-out);}
.more-menu button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:13px 15px;min-height:48px;
  border-bottom:1px solid var(--line);font-size:15px;font-weight:550;color:var(--td);
  transition:background .12s ease;
}
.more-menu button:last-child{border-bottom:none;}
.more-menu button:active{background:var(--fill);}
.more-menu button.danger{color:var(--bad);}

/* ==========================================================================
   12. SHEET / HỘP THOẠI DÙNG CHUNG
   ========================================================================== */
#editSheetWrap{position:fixed;inset:0;z-index:200;visibility:hidden;}
#editSheetWrap.open{visibility:visible;}
.edit-sheet-backdrop{
  position:absolute;inset:0;background:rgba(23,21,26,.42);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity .24s ease;
}
#editSheetWrap.open .edit-sheet-backdrop{opacity:1;}
.edit-sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;
  background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .34s var(--ease);
  box-shadow:0 -10px 40px rgba(23,21,26,.22);
}
#editSheetWrap.open .edit-sheet{transform:translateY(0);}
/* Tay nắm kéo — dấu hiệu "kéo xuống để đóng" quen thuộc trên di động. */
.edit-sheet::before{
  content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:40px;height:5px;border-radius:99px;background:var(--line-2);
}
.edit-sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:22px 18px 12px;flex-shrink:0;border-bottom:1px solid var(--line);
  background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;
}
.edit-sheet-title{font-size:19px;font-weight:700;color:var(--td);letter-spacing:-.02em;min-width:0;}
.edit-sheet-x{
  background:var(--fill);border-radius:50%;width:40px;height:40px;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .15s ease,transform .12s var(--ease-out);
}
.edit-sheet-x:active{background:var(--fill-2);transform:scale(.92);}
.edit-sheet-body{
  overflow-y:auto;overscroll-behavior:contain;flex:1;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));
}

/* ==========================================================================
   13. BẢNG
   ========================================================================== */
table.kt{width:100%;border-collapse:collapse;font-size:14px;}
table.kt th{
  text-align:left;color:var(--gt);font-weight:650;font-size:12px;
  text-transform:uppercase;letter-spacing:.05em;
  padding:9px 7px;border-bottom:1px solid var(--line-2);
  position:sticky;top:0;background:var(--card);
}
table.kt td{padding:11px 7px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14px;color:var(--td);}
table.kt td:first-child{font-weight:550;}
table.kt tr:last-child td{border-bottom:none;}

/* ==========================================================================
   14. CHẨN ĐOÁN / MÔ PHỎNG / TOAST
   ========================================================================== */
.diag{background:var(--gl);border-radius:var(--r-md);padding:16px 17px;margin-top:6px;}
.diag div{
  font-size:14.5px;line-height:1.65;padding-left:18px;position:relative;
  margin-bottom:9px;color:var(--gm);
}
.diag div:last-child{margin-bottom:0;}
.diag div::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gd);}

.simres:empty{display:none;}
.simres{
  background:linear-gradient(140deg,#1E8A5E,var(--gd) 48%,#00513A);
  color:#fff;border-radius:var(--r-lg);padding:20px;margin-top:8px;
  box-shadow:0 10px 30px -12px rgba(0,98,65,.55);
}
.simres .sr-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14.5px;border-bottom:1px solid rgba(255,255,255,.22);}
.simres .sr-row:last-child{border-bottom:none;}
.simres .sr-row b{font-size:16px;font-variant-numeric:tabular-nums;color:#fff;}

.toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(12px) scale(.96);
  background:rgba(28,26,32,.92);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  color:#fff;padding:14px 22px;border-radius:var(--r-pill);
  font-size:14.5px;font-weight:600;z-index:999;
  opacity:0;pointer-events:none;max-width:min(92vw,460px);text-align:center;
  box-shadow:var(--sh-pop);
  transition:opacity .22s ease,transform .3s var(--ease);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}

/* Icon SVG inline (hàm ic()) */
.ic-svg{vertical-align:-.17em;flex-shrink:0;}
.iconbtn .ic-svg,.sidebar-item .ic-svg,.more-menu button .ic-svg,.hib .ic-svg,.hamburger-btn .ic-svg{vertical-align:middle;}
.sec-title .ic-svg,.card-h h3 .ic-svg{vertical-align:-.15em;}

/* ==========================================================================
   15. HAI MÀN BÊ TỪ POS — Khuyến mãi (#tg) & Quản lý Menu (#mn)
   --------------------------------------------------------------------------
   [HOÀN NGUYÊN theo yêu cầu] Hai màn này giữ ĐÚNG giao diện gốc bê từ POS —
   chủ quán quen mắt và thấy dễ dùng hơn bản viết lại. Toàn bộ rule bên dưới
   là bản chép nguyên từ POS, KHÔNG áp hệ thiết kế v4 lên.
   Ba khác biệt duy nhất so với bản gốc, đều là sửa lỗi chứ không đổi kiểu dáng:
     · 'Google Sans' không còn được nạp → dùng font kế thừa của app;
     · thêm @keyframes pi (ba popup vẫn gọi tới nhưng chưa từng tồn tại);
     · các rule .screen/.ftag/.toast trùng tên với hệ thiết kế chung thì bỏ,
       vì chúng là rule TOÀN CỤC chứ không riêng 2 màn này.
   ========================================================================== */
.tbb{flex:1;border:none;background:transparent;border-radius:24px;padding:10px 0;font-family:inherit;font-size:14px;font-weight:600;color:#888;cursor:pointer;transition:all .2s;}
.tbb.active{background:var(--gd);color:#fff;}
/* Nút đóng to */
.btn-close-screen{width:40px;height:40px;border-radius:50%;background:var(--gd);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* To Go Toggle */
.togo-toggle-wrap{display:flex;align-items:center;gap:8px;background:#f5f5f5;border-radius:20px;padding:5px 10px 5px 8px;cursor:pointer;user-select:none;transition:background .2s;}
.togo-toggle-wrap.active{background:#fff3cd;}
.togo-switch{width:36px;height:20px;background:#ccc;border-radius:10px;position:relative;transition:background .2s;flex-shrink:0;}
.togo-switch::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.togo-toggle-wrap.active .togo-switch{background:#f59e0b;}
.togo-toggle-wrap.active .togo-switch::after{left:18px;}
.togo-toggle-wrap.active .togo-label{color:#b45309;}
/* [FIX] CÔNG TẮC PHẢI NHÌN LÀ BIẾT ĐANG BẬT HAY TẮT.
   Hai lỗi cộng lại làm hai trạng thái trông y hệt nhau:
     1. Thẻ bọc bị style INLINE `background:#f0f0f0` ghi đè, nên luật
        `.togo-toggle-wrap.active{background:...}` không bao giờ có tác dụng.
     2. Chữ "Bật"/"Tắt" bị ghim cứng `color:#888` cho CẢ HAI trạng thái — khác nhau
        đúng một chữ nhỏ 11px cùng màu xám, đọc lướt không thể phân biệt.
   Giờ: bật = viền + nền + chữ + cần gạt đều XANH LÁ, tắt = xám nhạt. Xanh lá chứ
   không dùng màu thương hiệu (hồng đậm) — hồng đọc ra là "cảnh báo", không phải
   "đang chạy". */
.togo-toggle-wrap{border:1.5px solid #e3e0d6;}
.togo-toggle-wrap.active{background:#e9f8ef;border-color:#22c55e;}
.togo-toggle-wrap.active .togo-switch{background:#22c55e;}
.togo-status{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#8f8f8f;transition:color .2s;}
.togo-toggle-wrap.active .togo-status{color:#15803d;}
.tg-section{background:#fff;border-radius:20px;margin:0 16px 16px;padding:20px;}
.tg-input-row{display:flex;gap:10px;margin-bottom:12px;}
.tg-input-group{flex:1;background:#f5f5f5;border-radius:14px;padding:12px 14px;}
.tg-input-label{font-size:10px;font-weight:700;color:var(--gt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.tg-input-group input{width:100%;border:none;outline:none;font-family:inherit;font-size:18px;font-weight:700;color:var(--td);background:transparent;}
.tg-save-btn{width:100%;padding:14px;background:var(--gd);color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
.tg-toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.tg-toggle-label{font-size:14px;font-weight:600;color:var(--td);}

/* ---------- Biểu đồ cột "Bill theo giờ" (màn Hôm nay) ----------
   Một chuỗi số liệu duy nhất nên không cần chú giải: tiêu đề mục đã nói đang vẽ
   gì. Cột dùng đúng màu nhấn sẵn có của app, chữ dùng token chữ — không tô chữ
   theo màu cột. Trục và lưới để nhạt, số liệu là thứ duy nhất được phép đậm. */
.hchart{background:var(--card);border:1px solid rgba(230,227,223,.8);border-radius:var(--r-md);
  padding:16px 14px 12px;box-shadow:var(--sh-1);}
.hchart-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;padding:0 2px;}
.hchart-hero{font-size:26px;font-weight:800;color:var(--td);letter-spacing:-.02em;line-height:1;}
.hchart-hero span{font-size:13px;font-weight:600;color:var(--gt);letter-spacing:0;margin-left:4px;}
.hchart-note{font-size:12px;color:var(--gt);text-align:right;line-height:1.5;}
/* Cuộn ngang khi nhiều giờ hơn bề ngang màn — không bao giờ bóp cột nhỏ hơn ngón tay. */
.hchart-scroll{overflow-x:auto;scrollbar-width:none;}
.hchart-scroll::-webkit-scrollbar{display:none;}
.hbars{display:flex;align-items:flex-end;gap:2px;min-width:100%;}
.hbar{flex:1 0 30px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:default;}
.hbar-n{font-size:12px;font-weight:700;color:var(--td);line-height:1;margin-bottom:5px;font-variant-numeric:tabular-nums;}
.hbar-n.zero{color:var(--ink-4);font-weight:600;}
/* 4px bo tròn ở ĐẦU cột, vuông ở chân — chân cột phải nằm đúng trên đường nền. */
.hbar-fill{width:100%;max-width:24px;background:var(--gd);border-radius:4px 4px 0 0;min-height:2px;
  transition:filter .12s ease;}
.hbar-fill.empty{background:var(--fill);}
.hbar:hover .hbar-fill{filter:brightness(.92);}
.hbar-h{font-size:11px;color:var(--gt);margin-top:7px;line-height:1;font-variant-numeric:tabular-nums;}
.hbar.peak .hbar-h{color:var(--td);font-weight:700;}
.hchart-base{height:1px;background:var(--line-2);margin-top:0;}
.hchart-empty{padding:26px 8px;text-align:center;color:var(--gt);font-size:13.5px;}

/* ==========================================================================
   16. LỚP MÁY TÍNH BẢNG / MÀN LỚN  (html.tab-ui)
   --------------------------------------------------------------------------
   Tablet ở đây được dùng KÈM CHUỘT + BÀN PHÍM VẬT LÝ, nên khác điện thoại ở:
     · sidebar cắm cố định, luôn thấy — không phải mở drawer từng lần;
     · có trạng thái hover cho mọi thứ bấm được (chuột cần phản hồi trước khi bấm);
     · con trỏ, vòng focus, phím tắt (Esc / Ctrl+K / ↑↓) đều hoạt động;
     · danh sách trải nhiều cột thay vì một dải hẹp giữa màn;
     · popup là hộp thoại giữa màn, không phải sheet trượt từ đáy.
   Toàn bộ khối này chỉ chạy khi <html> có class .tab-ui → tắt class là về
   nguyên bản điện thoại, không để lại di chứng.
   ========================================================================== */

/* Trước khi JS kịp gắn class: màn rộng vẫn ra bố cục rộng thay vì dải 430px */
@media (min-width:900px){
  html:not(.phone-ui):not(.tab-ui) body{max-width:none;}
  html:not(.phone-ui):not(.tab-ui) .sidebar{position:sticky;transform:none;box-shadow:none;}
}

html.tab-ui body{max-width:none;font-size:15px;}
html.tab-ui .app-shell{max-width:none;}
html.tab-ui .main-col{max-width:none;padding-bottom:0;min-width:0;}

/* ---------- 16.1 Sidebar cố định ---------- */
html.tab-ui:not(.nav-off) .sidebar{
  position:sticky;top:0;height:100vh;width:288px;flex-shrink:0;
  transform:none;box-shadow:none;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  padding:18px 14px 24px;
}
html.tab-ui:not(.nav-off) .sidebar-backdrop{display:none !important;}
html.tab-ui.nav-off .sidebar{position:fixed;transform:translateX(-102%);}
html.tab-ui .sidebar-brand{padding:6px 10px 16px;}
html.tab-ui .sidebar-item{min-height:44px;padding:9px 12px;font-size:15px;}
html.tab-ui .sidebar-item.sub{min-height:40px;font-size:14.5px;padding:8px 12px;}
/* [SỬA] Trước dùng box-shadow inset 3px — bóng đổ CHỮ NHẬT nên ở hai đầu viên
   thuốc bo tròn nó thò ra hai góc vuông. Giờ là một viên nhỏ bo tròn, nằm gọn
   bên trong. */
html.tab-ui .sidebar-item{position:relative;}
html.tab-ui .sidebar-item.active::before{
  content:'';position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:99px;background:var(--gd);
}
html.tab-ui .nav-search .ns-kbd{display:block;}

/* ---------- 16.2 Thanh tiêu đề ---------- */
html.tab-ui .topbar{padding:12px 32px;}
html.tab-ui .topbar-row{max-width:1440px;margin:0 auto;min-height:56px;}
html.tab-ui #hdrTitle{font-size:26px !important;}
html.tab-ui #hdrKicker{font-size:12px;}
html.tab-ui .hamburger-btn{display:flex;}
html.tab-ui .sync{font-size:13px;}
html.tab-ui .sync span:last-child{display:inline;}

/* ---------- 16.3 Vùng nội dung ---------- */
html.tab-ui .wrap{padding:24px 32px 56px;max-width:1440px;margin:0 auto;width:100%;}
html.tab-ui .sec-title{font-size:13.5px;margin:30px 2px 12px;}
html.tab-ui .card{padding:22px 24px;border-radius:var(--r-xl);margin-bottom:16px;}
html.tab-ui .card-h h3{font-size:17px;}
html.tab-ui .row{font-size:15px;padding:12px 0;min-height:48px;}
html.tab-ui .muted{font-size:15px;}

/* ---------- 16.4 Lưới KPI ---------- */
html.tab-ui .kgrid{grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:16px;}
html.tab-ui .kcard{padding:20px 20px 18px;border-radius:var(--r-xl);}
html.tab-ui .kcard .kval{font-size:27px;}
/* [MỚI] Thẻ Doanh thu (kcard-wide) chiếm TRỌN chiều ngang màn Hôm nay ở chế độ
   tablet thay vì chỉ 2 cột trong lưới — đúng thẻ "hero" đầu trang, xứng đáng
   nổi bật nhất trên màn hình rộng. */
html.tab-ui .kcard.kcard-wide{grid-column:1 / -1;padding:28px 32px 26px;}
html.tab-ui .kcard.kcard-wide .kval{font-size:56px;}
html.tab-ui .kcard.kcard-wide .meter-bar{height:10px;}
html.tab-ui .kcard.kcard-plai{grid-column:1 / -1;padding:26px 30px 24px;}

/* [MỚI] Badge "Ca hiện tại" + check-in/out nhân viên — góc trên phải màn Hôm nay,
   bảng màu mới (vàng/xanh #0062AD/nền kem) vì đây là tính năng mới thêm. */
.shift-badge{cursor:pointer;text-align:right;padding:7px 14px;border-radius:var(--r-pill);
  background:var(--fill);color:#0062AD;font-size:12px;line-height:1.45;
  transition:background .15s ease,transform .12s var(--ease-out);}
.shift-badge:active{background:var(--fill-2);transform:scale(.97);}
.shift-badge-line1{font-weight:700;}
.shift-badge-line2{opacity:.75;}
.shift-badge-closed{font-weight:700;}
.shift-badge-live{background:#eef6fc;border:1px solid #b8d4e8;}
html.tab-ui .shift-badge{font-size:13.5px;padding:9px 18px;}

/* ---------- 16.5 Biểu mẫu: nhiều cột, nút không kéo dài vô nghĩa ---------- */
html.tab-ui .grid2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
html.tab-ui .field input,html.tab-ui .field select,html.tab-ui .field textarea{
  min-height:46px;padding:11px 14px;font-size:15px;
}
html.tab-ui .btn{min-height:46px;font-size:15px;}
html.tab-ui .btn.sm{min-height:40px;font-size:14px;}
html.tab-ui .card > .btn:not(.sm){max-width:360px;}
/* Nút chính không việc gì phải kéo dài hết bề ngang 1400px của màn lớn */
html.tab-ui .wrap > .btn:not(.sm){max-width:360px;}
html.tab-ui .tg-save-btn{max-width:360px;}
html.tab-ui .iconbtn{width:42px;height:42px;}
html.tab-ui .seg{max-width:820px;}
html.tab-ui .seg button{min-height:42px;font-size:14.5px;}
html.tab-ui .filter-bar{flex-wrap:wrap;overflow:visible;}
html.tab-ui .ftag,html.tab-ui .report-subnav button{min-height:42px;font-size:14.5px;padding:10px 20px;}
html.tab-ui .weeknav{max-width:520px;}
html.tab-ui .weeknav button{width:42px;height:42px;}
html.tab-ui .litem{min-height:60px;padding:16px 18px;row-gap:12px;}
/* Ô lưới 360px không đủ cho cả tên lẫn dãy nút trên một hàng, nên dãy nút xuống
   hàng dưới — cho nó nhỉnh ra một chút để ngón tay chạm thoải mái, thay vì bóp
   nút lại hoặc giấu bớt vào menu "...". */
html.tab-ui .litem .li-r{gap:10px;padding-top:2px;}
html.tab-ui .more-menu{top:48px;}
html.tab-ui .more-menu button{min-height:44px;}
/* [MỚI] Khối "Sức khoẻ quán" ở chế độ tablet — bo tròn hơn, mập hơn, và tô màu
   theo đúng loại cảnh báo thay vì chỉ một vạch mảnh bên trái trên nền trắng
   (nhìn rối, không phân biệt được loại nào với loại nào ở khoảng cách xa). */
html.tab-ui .health-item{
  min-height:64px;padding:16px 20px;border-radius:var(--r-xl);
  box-shadow:none;
}
html.tab-ui .health-item::before{display:none;}
/* [FIX] Nền màu đặc mà không viền thì thanh tóm tắt (.hbar-sum) và card bên dưới
   cùng đỏ nhìn dính vào nhau, không phân biệt được đâu là đâu — thêm viền cùng
   tông nhưng đậm hơn nền một chút để tách lớp rõ ràng. */
html.tab-ui .health-item.red{background:var(--bad-bg);border:1.5px solid var(--bad-line);}
html.tab-ui .health-item.yellow{background:var(--warn-bg);border:1.5px solid var(--warn-line);}
html.tab-ui .health-item.gray{background:var(--fill);border:1.5px solid var(--line);}
html.tab-ui .health-item.red .hi-label{color:var(--bad);}
html.tab-ui .health-item.yellow .hi-label{color:var(--warn);}
html.tab-ui .health-item .hi-label{font-size:15.5px;font-weight:700;}
/* [MỚI] Thẻ cảnh báo chi tiết (Hộp thư cảnh báo, mở từ "Sức khoẻ quán") — cùng
   ngôn ngữ thiết kế: bo tròn hẳn, tô nguyên nền theo trạng thái, nút hành động
   to hơn cho ngón tay bấm thoải mái trên màn rộng. */
html.tab-ui .alert-card{
  border-radius:var(--r-xl);padding:20px 22px;box-shadow:none;
  border:1.5px solid var(--bad-line);background:var(--bad-bg);
}
html.tab-ui .alert-card.resolved{background:var(--fill);border-color:var(--line);}
html.tab-ui .alert-card .ac-title{font-size:16px;}
html.tab-ui .alert-card .ac-row{font-size:14.5px;}
html.tab-ui .alert-card .ac-infer-body{background:#fff;border-radius:var(--r-md);}
html.tab-ui .alert-card .ac-actions button{
  min-height:50px;border-radius:var(--r-lg);background:#fff;font-size:14.5px;
}
html.tab-ui .health-item.red .hi-count{color:var(--bad);opacity:.8;}
html.tab-ui .health-item.yellow .hi-count{color:var(--warn);opacity:.8;}
html.tab-ui .health-group-title{margin:22px 4px 10px;font-size:12.5px;}
html.tab-ui .hbar-sum{
  border-radius:var(--r-xl);padding:14px 18px;box-shadow:none;
}
html.tab-ui .hbar-sum.bad{background:var(--bad-bg);border:1.5px solid var(--bad-line);}
html.tab-ui .hbar-sum.warn{background:var(--warn-bg);border:1.5px solid var(--warn-line);}
html.tab-ui .hbar-sum.ok{background:var(--ok-bg);border:1.5px solid var(--ok-line);}
html.tab-ui .hbar-sum.bad .hbs-txt{color:var(--bad);}
html.tab-ui .hbar-sum.warn .hbs-txt{color:var(--warn);}
html.tab-ui .hbar-sum .hbs-txt{font-size:14px;}
html.tab-ui table.kt th{font-size:12.5px;padding:10px 10px;}
html.tab-ui table.kt td{font-size:14.5px;padding:12px 10px;}

/* ---------- 16.6 Danh sách trải nhiều cột ----------
   :has() bắt đúng "hộp nào đang chứa từ 2 dòng trở lên" mà không phải sửa hàng
   chục hàm render. Trình duyệt cũ không hiểu :has() thì bỏ qua, danh sách vẫn
   xếp dọc bình thường (không vỡ layout). */
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .litem + .litem),
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .health-item + .health-item),
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .alert + .alert),
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .alert-card + .alert-card){
  display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:12px;align-items:start;
}
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .litem + .litem) > *:not(.litem),
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .health-item + .health-item) > *:not(.health-item),
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .alert + .alert) > *:not(.alert),
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .alert-card + .alert-card) > *:not(.alert-card){
  grid-column:1 / -1;
}
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .litem + .litem) > .litem,
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .health-item + .health-item) > .health-item,
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .alert + .alert) > .alert,
html.tab-ui :is(.wrap,.edit-sheet-body) div:has(> .alert-card + .alert-card) > .alert-card{margin-bottom:0;}

/* ---------- 16.7 Popup giữa màn thay cho sheet đáy ---------- */
html.tab-ui .edit-sheet{
  top:50%;left:50%;right:auto;bottom:auto;
  width:min(820px,92vw);max-height:88vh;border-radius:var(--r-xl);
  transform:translate(-50%,-46%) scale(.98);opacity:0;
  transition:transform .26s var(--ease),opacity .18s ease;
  box-shadow:var(--sh-pop);
}
html.tab-ui #editSheetWrap.open .edit-sheet{transform:translate(-50%,-50%) scale(1);opacity:1;}
html.tab-ui .edit-sheet::before{display:none;}
html.tab-ui .edit-sheet-head{padding:20px 26px 14px;border-radius:var(--r-xl) var(--r-xl) 0 0;}
html.tab-ui .edit-sheet-body{padding:22px 26px 26px;}
html.tab-ui .toast{bottom:36px;}

/* ---------- 16.8 Hai màn POS (giữ nguyên bản gốc) ---------- */
html.tab-ui #tgBody{
  max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
  gap:4px 22px;align-items:start;
}
html.tab-ui #tg > div:first-child,
html.tab-ui #mn > div:first-child{padding:16px 28px 0;}
html.tab-ui #tg > div:first-child span,
html.tab-ui #mn > div:first-child span{font-size:23px;}
html.tab-ui .tg-section{padding:22px;border-radius:22px;}
html.tab-ui .tg-input-group input{font-size:19px;}
html.tab-ui .tg-save-btn{max-width:340px;}
html.tab-ui #mn-list{max-width:1280px;margin:0 auto;width:100%;padding:20px 28px 48px;}
/* Mỗi nhóm món trải thành lưới thẻ; tiêu đề nhóm vẫn chiếm trọn 1 hàng */
html.tab-ui #mn-list > div{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:12px;align-items:start;
}
html.tab-ui #mn-list > div > div:not([onclick]){grid-column:1 / -1;}
html.tab-ui #mn-list > div > div[onclick]{margin-bottom:0 !important;}
html.tab-ui #screen-mn .tbb,html.tab-ui #screen-tg .tbb{font-size:15px;padding:13px 0;}
html.tab-ui #screen-mn > div > div:nth-child(2){max-width:560px;margin-left:28px;}

/* ---------- 16.9 Tablet dựng đứng / chia đôi màn ---------- */
@media (max-width:1023px){
  html.tab-ui:not(.nav-off) .sidebar{width:244px;}
  html.tab-ui .sidebar-item{font-size:14.5px;}
  html.tab-ui .wrap{padding:20px 20px 44px;}
  html.tab-ui .topbar{padding:10px 20px;}
  html.tab-ui #hdrTitle{font-size:22px !important;}
  html.tab-ui #mn-list{padding:18px 18px 40px;}
  html.tab-ui #tg > div:first-child,
  html.tab-ui #mn > div:first-child{padding:14px 18px 0;}
  html.tab-ui #screen-mn > div > div:nth-child(2){margin-left:18px;}
}

/* ==========================================================================
   17. HOVER — chỉ bật cho thiết bị CÓ con trỏ thật (chuột / trackpad).
   Trên cảm ứng, :hover bị "dính" sau khi chạm nên tuyệt đối không bật.
   ========================================================================== */
@media (hover:hover) and (pointer:fine){
  .sidebar-item:hover{background:var(--fill);}
  .sidebar-item.active:hover{background:var(--gl);}
  .hib:hover,.hamburger-btn:hover,.weeknav button:hover,
  .edit-sheet-x:hover{background:var(--fill-2);color:var(--td);}
  /* Nút icon đã có màu riêng theo hành động — hover chỉ làm đậm lên,
     KHÔNG được ghi đè thành xám (làm thế là mất luôn tín hiệu màu). */
  .iconbtn:hover{filter:brightness(.94);}
  .btn:hover{background:#EE4467;box-shadow:0 6px 18px -6px var(--accent-glow);}
  .btn.outline:hover{background:var(--gl);}
  .btn.danger:hover{background:#DE3C48;}
  .ftag:hover,.report-subnav button:hover{background:var(--fill);border-color:var(--line-2);}
  .ftag.active:hover,.report-subnav button.active:hover{background:var(--gm);border-color:var(--gm);}
  .seg button:hover{color:var(--td);}
  .litem:hover,.health-item:hover{
    border-color:var(--line-2);box-shadow:var(--sh-2);transform:translateY(-1px);
  }
  .more-menu button:hover{background:var(--fill);}
  .more-menu button.danger:hover{background:var(--bad-bg);}
  .alert-card .ac-actions button:hover{background:var(--fill);}
  table.kt tbody tr:hover td{background:var(--surface-2);}
  .row:hover .rl{color:var(--td);}
}

/* Trên máy có chuột, mọi thứ bấm được phải hiện con trỏ tay. */
@media (pointer:fine){
  .litem,.health-item,label,summary{cursor:default;}
  [onclick],button,.health-item,.togo-toggle-wrap{cursor:pointer;}
  input,textarea,select{cursor:auto;}
}

/* ==========================================================================
   18. ÉP CHẾ ĐỘ ĐIỆN THOẠI TRÊN MÁY MÀN LỚN (html.phone-ui)
   ========================================================================== */
html.phone-ui body{max-width:430px;}
html.phone-ui .app-shell{max-width:430px;margin:0 auto;}
html.phone-ui .sidebar{position:fixed;top:0;height:auto;width:290px;transform:translateX(-102%);}
html.phone-ui .sidebar.open{transform:translateX(0);}
html.phone-ui .sidebar-backdrop.open{display:block !important;}
html.phone-ui .main-col{max-width:none;}
html.phone-ui .hamburger-btn{display:flex;}
html.phone-ui .nav-search .ns-kbd{display:none;}

/* ==========================================================================
   19. TÔN TRỌNG TUỲ CHỌN HỆ THỐNG
   ========================================================================== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
@media print{
  .sidebar,.sidebar-backdrop,.topbar,.toast,.report-subnav,.filter-bar,.seg{display:none !important;}
  .wrap{padding:0;}

// Mỗi món tìm trong menu RT `menu` theo TÊN (không phân biệt hoa thường); type chứa "ăn vặt" / "đồ ăn" /
// "snack" → Ăn vặt; chứa "khác" hoặc = "khac" → Khác; còn lại → Đồ uống. Giá: giá trên món nếu > 0, không thì
// priceM || priceL của menu. Đơn cũ không có itemsArray → tách chuỗi items "Tên(size)xSL, …".
// Tiền mặt / Chuyển khoản tính theo o.total (cả bill). Đơn total <= 0 bỏ qua hẳn.
function tcEmptySum(){ return { drink:0, snack:0, khac:0, cash:0, transfer:0, total:0, count:0, hours:new Array(12).fill(0) }; }
function tcIsTransfer(method){
  const m = String(method || '').toLowerCase();
  return m.includes('chuyển khoản') || m.includes('chuyen khoan') || m.includes('bank') || m.includes('transfer');
}
// [FIX 16/10] Giờ bed ("1h bed", "1h bed từ h5"), phí (size "Phí": phí không đặt trước, phí chọn bed…) và nợ cũ ("Nợ cũ: …")
// thuộc nhóm KHÁC (trước rơi vào Đồ uống vì không phải loại "khác" trong menu). Tổng doanh thu (nước + Khác) không đổi. = _isKhacLine của pos.html.
function tcIsKhacLine(name, size){
  const n = String(name || '').trim().toLowerCase();
  return String(size || '').trim().toLowerCase() === 'phí' || n.indexOf('nợ cũ') === 0 || n.indexOf('phí ') === 0
    || n === '1h bed' || n === '1h bed từ h5';
}
function tcAddOrder(sum, o, menu){
  const amount = Number(o && o.total) || 0;
  if(amount <= 0) return sum;
  let orderDrink = 0, orderKhac = 0;
  const one = (name, qty, itemPrice, size)=>{
    const nm = String(name || '').toLowerCase();
    const menuItem = (menu || []).find(m => m && m.name && String(m.name).toLowerCase() === nm);
    const finalPrice = (itemPrice > 0) ? itemPrice : (menuItem ? (Number(menuItem.priceM || menuItem.priceL) || 0) : 0);
    const subTotal = finalPrice * qty;
    const type = menuItem ? String(menuItem.type || '').toLowerCase() : '';
    if(type.includes('ăn vặt') || type.includes('đồ ăn') || type.includes('snack')) sum.snack += subTotal;
    else if(type.includes('khác') || type === 'khac' || tcIsKhacLine(name, size)){ sum.khac += subTotal; orderKhac += subTotal; }
    else { sum.drink += subTotal; orderDrink += subTotal; }
  };
  if(Array.isArray(o.itemsArray)){
    o.itemsArray.forEach(i=>{ if(i) one(i.name, Number(i.qty) || 1, Number(i.price) || 0, i.size); });
  } else if(o.items){
    String(o.items).split(',').forEach(str=>{
      str = str.trim();
      const x = str.lastIndexOf('x');
      if(x > -1){
        const qty = parseInt(str.substring(x + 1)) || 1;
        const full = str.substring(0, x).trim(), sz = full.match(/\(([^)]*)\)\s*$/);
        one(full.split('(')[0].trim(), qty, 0, sz ? sz[1].trim() : '');
      }
    });
  }
  if(tcIsTransfer(o.method)) sum.transfer += amount; else sum.cash += amount;
  sum.total += amount; sum.count++;
  const d = new Date(o.createdAt || Date.now());
  if(!isNaN(d)) sum.hours[Math.floor(d.getHours()/2)] += orderDrink + orderKhac;   // biểu đồ POS (bật 🐶) = nước + Khác
  return sum;
}
function tcSummarize(orders, menu){ const s = tcEmptySum(); (orders||[]).forEach(o=>tcAddOrder(s, o, menu)); return s; }

// ---- XOFA: y như updRv() của PosX.html ----
// Food tách riêng (foodTotal, theo foodMethod || method; TÍNH RIÊNG chia theo tỉ lệ splitGroups).
// Tổng = Σ (total − foodTotal) = Tại quán + To Go. Tiền mặt / Chuyển khoản của phần không-Food.
function xoEmptySum(){ return { total:0, cash:0, bank:0, togo:0, instore:0, food:0, foodCash:0, foodBank:0, ship:0, shipRev:0, count:0, hours:new Array(12).fill(0) }; }
function xoAddOrder(sum, o){
  if(!o) return sum;
  const total = Number(o.total) || 0;
  const ft = Number(o.foodTotal) || 0;
  const fMethod = o.foodMethod || o.method;
  if(ft > 0){
    if(fMethod === 'TIỀN MẶT') sum.foodCash += ft;
    else if(fMethod === 'CHUYỂN KHOẢN') sum.foodBank += ft;
    else if(o.splitGroups && o.splitGroups.length){
      const sgCash = o.splitGroups.filter(g => g.method === 'TIỀN MẶT').reduce((s,g) => s+(g.total||0),0);
      const sgBank = o.splitGroups.filter(g => g.method === 'CHUYỂN KHOẢN').reduce((s,g) => s+(g.total||0),0);
      const sgTot = sgCash + sgBank || 1;
      sum.foodCash += Math.round(ft * sgCash / sgTot);
      sum.foodBank += Math.round(ft * sgBank / sgTot);
    } else sum.foodCash += ft;
  }
  const netAmt = ft > 0 ? (total - ft) : total;
  if(o.method === 'TIỀN MẶT') sum.cash += netAmt;
  else if(o.method === 'CHUYỂN KHOẢN') sum.bank += netAmt;
  else if(o.method === 'TÍNH RIÊNG' && o.splitGroups && o.splitGroups.length){
    const ratio = total > 0 ? (netAmt / total) : 1;
    o.splitGroups.forEach(g=>{
      if(g.method === 'TIỀN MẶT') sum.cash += Math.round((g.total || 0) * ratio);
      else if(g.method === 'CHUYỂN KHOẢN') sum.bank += Math.round((g.total || 0) * ratio);
    });
  } else sum.cash += netAmt;
  const net = total - ft;
  sum.total += net;
  if(o.isToGo === true) sum.togo += net; else sum.instore += net;
  sum.food = sum.foodCash + sum.foodBank;
  if(o.isShip === true){ sum.ship++; sum.shipRev += total; }
  sum.count++;
  const h = parseInt(String(o.time || '').split(':')[0], 10);
  if(h >= 0 && h < 24) sum.hours[Math.floor(h/2)] += net;   // biểu đồ PosX: không gồm Food
  return sum;
}
function xoSummarize(orders){ const s = xoEmptySum(); (orders||[]).forEach(o=>xoAddOrder(s, o)); return s; }
// ---- Gieo Gieo (posgieo.html) ----
// Tiền mặt / Chuyển khoản / Food: y như updRv() của posgieo.html (cùng một hàm với PosX → dùng lại xoAddOrder).
// Doanh thu = Σ o.total của mọi bill (gồm Food) — đúng số "Doanh thu" của quanlygieo (aggregateOrders), cũng là số
// mà mục tiêu của Gieo (AOV × bill/ngày) so với. Chi tiết khác xem ở quanlygieo.
function ggEmptySum(){ return Object.assign(xoEmptySum(), { revenue:0, hoursRev:new Array(12).fill(0) }); }
function ggAddOrder(sum, o){
  if(!o) return sum;
  xoAddOrder(sum, o);
  const total = Number(o.total) || 0;
  sum.revenue += total;
  const h = parseInt(String(o.time || '').split(':')[0], 10);
  if(h >= 0 && h < 24) sum.hoursRev[Math.floor(h/2)] += total;
  return sum;
}
function ggSummarize(orders){ const s = ggEmptySum(); (orders||[]).forEach(o=>ggAddOrder(s, o)); return s; }

// Cộng nhiều ngày lại (các trường số + mảng giờ).
function sumMerge(a, b){
  Object.keys(b).forEach(k=>{
    if(Array.isArray(b[k])) b[k].forEach((v,i)=>{ a[k][i] = (a[k][i]||0) + v; });
    else if(typeof b[k] === 'number') a[k] = (a[k]||0) + b[k];
  });
  return a;
}

async function xoFetchDay(k){
  const d = parseDkey(k);
  const mon = MONTH_KEYS[d.getMonth()], dd = pad(d.getDate()), yyyy = d.getFullYear();
  const dateStr = `${dd}/${pad(d.getMonth()+1)}/${yyyy}`;

  const rt = async ()=>{ const s = await db.ref(`orders_xolifa/${mon}/${dd}`).once('value'); return s.val() || {}; };
  const fs = async ()=>{ const doc = await fstore.collection('orders_xolifa_archive').doc(`${mon}_${dd}_${yyyy}`).get(); return doc.exists ? (doc.data().orders || {}) : null; };
  let merged = {};

    merged = Object.assign({}, a || {}, b);
  } else {
    const a = await fs();
    merged = a !== null ? a : await rt();
  }
  return Object.values(merged).filter(o => o && o.date === dateStr);
}
// Chạy song song có giới hạn — xem cả năm là vài trăm lượt đọc, không bắn một lúc.
async function pool(items, n, fn){
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({length: Math.min(n, items.length)}, async ()=>{
    while(i < items.length){ const j = i++; out[j] = await fn(items[j], j); }
  }));
  return out;
}

// Trả { tc33:{dkey:sum}, xofa:{…}, gg_gg01:{…}, … } cho mọi ngày trong [from, to].
async function revLoadRange(from, to, onProgress){
  const today = dkey(new Date());
  const keys = [];
  for(let d = parseDkey(from); dkey(d) <= to; d = addDays(d, 1)) keys.push(dkey(d));
  const cache = revCacheLoad();
  const srcs = await revSources();
  const res = {}; srcs.forEach(s=>{ res[s.key] = {}; });
  let done = 0; const total = keys.length * srcs.length;
  const tick = ()=>{ done++; if(onProgress && (done % 10 === 0 || done === total)) onProgress(done, total); };
  const jobs = [];
  keys.forEach(k=>{
    const stable = k < today && daysBetween(k, today) > REV_STABLE_AFTER;
    srcs.forEach(s=>jobs.push({ s, k, stable }));
  });
  let dirty = false;
  await pool(jobs, 16, async j=>{
    const key = j.s.key;
    const hit = (REV_MEM[key] || {})[j.k] || (j.stable ? (cache[key] || {})[j.k] : null);
    if(hit){ res[key][j.k] = hit; tick(); return; }
    const sum = await j.s.run(j.k);
    res[key][j.k] = sum;
    if(j.stable){ (cache[key] = cache[key] || {})[j.k] = sum; dirty = true; }
    if(j.k !== today) (REV_MEM[key] = REV_MEM[key] || {})[j.k] = sum;
    tick();
  });
  if(dirty) revCacheSave(cache);
  return res;
}

let REV_MODE = 'day';
let REV_FROM = dkey(new Date()), REV_TO = dkey(new Date());

let _revReq = 0;
function revRangeFor(mode){
  const now = new Date();
  if(mode === 'week'){ const dow = now.getDay() || 7; const s = addDays(now, 1 - dow); return [dkey(s), dkey(addDays(s, 6))]; }
  if(mode === 'month') return [dkey(new Date(now.getFullYear(), now.getMonth(), 1)), dkey(new Date(now.getFullYear(), now.getMonth()+1, 0))];
  if(mode === 'year') return [`${now.getFullYear()}-01-01`, `${now.getFullYear()}-12-31`];
  if(mode === 'custom') return [REV_FROM, REV_TO];
  if(mode === 'yesterday'){ const y = dkey(addDays(now, -1)); return [y, y]; }
  return [dkey(now), dkey(now)];
}
function revSetMode(m){ REV_MODE = m; runRender('rev'); }

async function renderRev(){

  // "So hôm qua" ở tab Hôm nay (pos.html có thẻ này) → đọc kèm ngày trước đó (tab Hôm qua: so hôm kia).
  const oneDay = REV_MODE === 'day' || REV_MODE === 'yesterday';
  const readFrom = oneDay ? dkey(addDays(parseDkey(from), -1)) : from;
  showLoading(body, 'Đang đọc đơn hàng các quán...');

// Gom ngày → cột biểu đồ: 1 ngày = 12 khung 2 giờ; ≤ 31 ngày = từng ngày; dài hơn = từng tháng.
// Mỗi cột 3 số: TC33 Tổng nước · XOFA không gồm Food · Gieo (mọi quán Gieo cộng lại, doanh thu).
function revBuckets(r){
  const days = [];
  for(let d = parseDkey(r.from); dkey(d) <= r.to; d = addDays(d, 1)) days.push(dkey(d));
  const ggKeys = (r.gg || []).map(s=>'gg_' + s.id);
  const D = (key, k)=> (r.data[key] || {})[k];
  const nuoc = s => s ? s.drink + s.khac : 0;
  const ggDay = k => ggKeys.reduce((a, key)=> a + (D(key, k) ? D(key, k).revenue : 0), 0);
  if(r.from === r.to){
    return ['0h','2h','4h','6h','8h','10h','12h','14h','16h','18h','20h','22h'].map((label, i)=>({ label,
      tc: D('tc33', r.from) ? D('tc33', r.from).hours[i] : 0, xo: D('xofa', r.from) ? D('xofa', r.from).hours[i] : 0,
      gg: ggKeys.reduce((a, key)=> a + (D(key, r.from) && D(key, r.from).hoursRev ? D(key, r.from).hoursRev[i] : 0), 0) }));
  }
  if(days.length <= 31){
    const WD = ['CN','T2','T3','T4','T5','T6','T7'];
    return days.map(k=>{ const d = parseDkey(k); return {
      label: r.mode === 'week' ? WD[d.getDay()] : (r.mode === 'month' ? String(d.getDate()) : `${d.getDate()}/${d.getMonth()+1}`),
      tc: nuoc(D('tc33', k)), xo: D('xofa', k) ? D('xofa', k).total : 0, gg: ggDay(k) }; });
  }
  const by = {};
  days.forEach(k=>{
    const mk = k.slice(0,7);
    const b = by[mk] || (by[mk] = { label: 'T' + Number(k.slice(5,7)) + (r.from.slice(0,4) !== r.to.slice(0,4) ? '/' + k.slice(2,4) : ''), tc:0, xo:0, gg:0 });
    b.tc += nuoc(D('tc33', k)); b.xo += D('xofa', k) ? D('xofa', k).total : 0; b.gg += ggDay(k);
  });
  return Object.values(by);
}
const SERIES = [{ k:'tc', name:'The Cafe 33', color:'var(--tc33)' }, { k:'xo', name:'XOFA', color:'var(--xofa)' }, { k:'gg', name:'Gieo Gieo', color:'var(--gieo)' }];
function revChartSvg(buckets, narrow){
  const W = isTabletUiOn() ? (narrow ? 620 : 900) : 380, H = 200, pl = 34, pr = 6, pt = 14, pb = 26;
  const cw = W - pl - pr, ch = H - pt - pb;
  const max = Math.max(1, ...buckets.map(b => Math.max(b.tc, b.xo, b.gg || 0)));
  const step = cw / Math.max(1, buckets.length);
  const bw = Math.max(1.2, Math.min(14, step * 0.26));
  const every = Math.ceil(buckets.length / (isTabletUiOn() ? 31 : 12));
  let g = '';
  [0, .5, 1].forEach(f=>{
    const y = pt + ch - ch * f;
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>` +
         `<text x="${pl-4}" y="${y+3}" text-anchor="end">${fmtGon(max*f)}</text>`;
  });
  buckets.forEach((b, i)=>{
    const cx = pl + step * i + step / 2;
    SERIES.forEach((s, j)=>{
      const v = b[s.k] || 0, h = ch * v / max, x = cx + (j - 1.5) * bw + (j - 1) * 0.5;
      g += `<rect x="${x}" y="${pt + ch - h}" width="${bw}" height="${h}" rx="2" fill="${s.color}"><title>${esc(b.label)} · ${s.name}: ${fmt(v)}</title></rect>`;
    });
    if(i % every === 0) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  return `<svg class="mg-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh thu các quán">${g}</svg>`;
}

  const keys = []; for(let d = parseDkey(r.from); dkey(d) <= r.to; d = addDays(d, 1)) keys.push(dkey(d));
  const D = (key, k)=> (r.data[key] || {})[k];
  const sumOf = (key, empty)=> keys.reduce((a,k)=> D(key, k) ? sumMerge(a, D(key, k)) : a, empty());
  const T = sumOf('tc33', tcEmptySum), X = sumOf('xofa', xoEmptySum);

  // Quán Gieo: luôn hiện quán đang mở; quán đã ngừng chỉ hiện khi kỳ này có doanh thu.
  const many = (r.gg || []).length > 1;
  const G = (r.gg || []).map((s, i)=>({ s, i, sum: sumOf('gg_' + s.id, ggEmptySum) })).filter(x => x.s.active || x.sum.revenue > 0);

  // So hôm qua — như thẻ "So hôm qua" của pos.html (cả bill) và cùng cách cho XOFA (không gồm Food), Gieo (doanh thu).

  //   · Mục tiêu CHUNG = một số chủ quán tự nhập cho TẤT CẢ quán (ô 'all') — mức mong muốn, được phép thấp hơn tổng

  const seg = ['day','yesterday','week','month','year','custom'].map(m=>`<button class="${r.mode===m?'active':''}" onclick="revSetMode('${m}')">${label[m]}</button>`).join('');

  const daily = keys.filter(k => k <= today).slice().reverse();
  // [14/10] Thẻ quán dạng mới (chủ dự án: tối ưu PC). Giữ đủ mọi con số cũ, chỉ đổi cách trình bày:

  const ggCards = G.map((x, n)=>{ const s = x.sum; const pct = pcts[2 + n]; const col = GIEO_COLORS[x.i % GIEO_COLORS.length];

      big: s.revenue, bigLab: 'Doanh thu', so: scSo(s.revenue, D('gg_' + x.s.id, yk), p=>p.revenue),
      tgt: tgtBlock(s.revenue, ggTg, r, '<div class="mg-tgt"><div class="mg-tgt-l"><span>Không đọc được mục tiêu của Quản lý Gieo</span></div></div>'),
      secs: [{ t:'Thanh toán', items:[{ l:'Tiền mặt', v: s.cash + s.foodCash, c: col }, { l:'Chuyển khoản', v: s.bank + s.foodBank, c:'#F4A9B9' }] }],
      tiles: [scTile('Số bill', fmtN(s.count))].concat(s.food > 0 ? [scTile('Trong đó Food', fmtN(s.food))] : []) }); }).join('');
  body.innerHTML = `

    ${r.mode === 'custom' ? `<div class="mg-range">
      <input type="date" id="revFrom" value="${REV_FROM}"> <span>–</span> <input type="date" id="revTo" value="${REV_TO}">
      <button class="btn" onclick="revApplyCustom()">Xem</button></div>` : ''}

      <b>Mục tiêu chung</b> là mức bạn tự đặt cho tất cả quán (có thể thấp hơn tổng mục tiêu từng quán). Mục tiêu Gieo đọc từ Quản lý Gieo.<br>
      Chia doanh thu đúng như mỗi POS: The Cafe 33 theo loại món trong menu; XOFA tách Food như PosX; Gieo Gieo tiền mặt / chuyển khoản như POS Gieo, doanh thu = tổng bill như Quản lý Gieo (chi tiết món, giá vốn, lãi lỗ, kho xem ở Quản lý Gieo).<br>
      Số ngày cũ hơn ${REV_STABLE_AFTER} ngày được lưu trong máy — bấm ⟳ để đọc lại.`)}</div>

    <div class="kcard kcard-wide lv-green" style="margin-bottom:12px">
      <div class="klabel">Doanh thu chung</div>
      <div class="kval">${fmt(chung)}</div>
      <div class="mg-share" role="img" aria-label="${esc(parts.map((p, i)=>p.name + ' ' + pcts[i] + '%').join(' · '))}">
        ${parts.map(p=>`<span style="width:${chung ? p.v / chung * 100 : 0}%;background:${p.color};"></span>`).join('')}
      </div>

      ${tgtBlock(chung, tgAll, r, `<div class="mg-tgt"><div class="mg-tgt-l"><span>Chưa đặt mục tiêu chung</span><a href="#" onclick="switchScreen('target');return false" style="color:inherit;font-weight:700">Đặt ›</a></div></div>`)}
      ${(()=>{ const t = tgSum(r.from, r.to); if(!t.v) return '';
        return `<div class="mg-pace" style="margin-top:8px">Cộng mục tiêu từng quán: <b style="color:#fff">${fmtGon(t.v)}</b> · đạt ${Math.round(chung / t.v * 100)}%${t.thieu.length ? ' — chưa có mục tiêu: ' + esc(t.thieu.join(', ')) : ''}</div>`; })()}

      ${scCard({ c:'var(--tc33)', name:'The Cafe 33', pct: pctTc, pctBg:'#E6F2EC', pctFg:'#004D33',
        big: tcNuoc, bigLab:'Tổng nước', so: scSo(T.total, D('tc33', yk), p=>p.total), tgt: tgtBlock(tcNuoc, tgTc, r),
        secs: [{ t:'Theo nhóm món', items:[{ l:'Đồ uống', v:T.drink, c:'#006241' }, { l:'Khác', v:T.khac, c:'#4FA383' }, { l:'Ăn vặt', v:T.snack, c:'#B5DCCB' }] },
               { t:'Thanh toán', items:[{ l:'Tiền mặt', v:T.cash, c:'#006241' }, { l:'Chuyển khoản', v:T.transfer, c:'#9CCFBA' }] }],
        tiles: [scTile('Số đơn', fmtN(T.count))] })}
      ${scCard({ c:'var(--xofa)', name:'XOFA', pct: pctXo, pctBg:'#E7EEFC', pctFg:'#2B57A8',
        big: X.total, bigLab:'Tổng (không gồm Food)', so: scSo(X.total, D('xofa', yk), p=>p.total), tgt: tgtBlock(X.total, tgXo, r),
        secs: [{ t:'Theo hình thức', items:[{ l:'Tại quán', v:X.instore, c:'#2B57A8' }, { l:'To Go', v:X.togo, c:'#9DB5E3' }] },
               { t:'Thanh toán', items:[{ l:'Tiền mặt', v:X.cash, c:'#2B57A8' }, { l:'Chuyển khoản', v:X.bank, c:'#9DB5E3' }] }],
        tiles: [scTile('Số đơn', fmtN(X.count)), scTile('Đơn ship', fmtN(X.ship) + ' đơn', fmtN(X.shipRev)),
                `<div class="sc-tile food"><span>Food</span><b>${fmtN(X.food)}</b><small>TM ${fmtN(X.foodCash)}<br>CK ${fmtN(X.foodBank)}</small></div>`] })}
      ${ggCards}
    </div>

    <div class="mg-bottom ${daily.length > 1 ? 'two' : ''}">
      <div class="mg-bottom-c">
        <div class="sec-title">Biểu đồ ${r.from === r.to ? 'theo khung giờ' : (buckets.length > 31 || keys.length > 31 ? 'theo tháng' : 'theo ngày')}</div>
        <div class="card">
          <div class="mg-legend"><span><span class="mg-dot" style="background:var(--tc33)"></span>The Cafe 33 · Tổng nước</span><span><span class="mg-dot" style="background:var(--xofa)"></span>XOFA · không gồm Food</span><span><span class="mg-dot" style="background:var(--gieo)"></span>Gieo Gieo${many ? ' (mọi cửa hàng)' : ''}</span></div>
          ${revChartSvg(buckets, daily.length > 1 && window.innerWidth >= 1500)}
        </div>
      </div>
      ${daily.length > 1 ? `<div class="mg-bottom-c"><div class="sec-title">Từng ngày</div>
      <div class="card mg-scroll mg-daily"><table class="kt">
        <thead><tr><th>Ngày</th><th style="text-align:right">TC33 · nước</th><th style="text-align:right">XOFA</th><th style="text-align:right">Gieo</th><th style="text-align:right">Chung</th></tr></thead>
        <tbody>${daily.map(k=>{ const t = D('tc33', k) || tcEmptySum(), x = D('xofa', k) || xoEmptySum();
          const g = G.reduce((a, y)=> a + (D('gg_' + y.s.id, k) ? D('gg_' + y.s.id, k).revenue : 0), 0);
          return `<tr><td>${fmtDateVN(parseDkey(k)).slice(0,5)}</td><td style="text-align:right">${fmtN(t.drink+t.khac)}</td><td style="text-align:right">${fmtN(x.total)}</td><td style="text-align:right">${fmtN(g)}</td><td style="text-align:right"><b>${fmtN(t.drink+t.khac+x.total+g)}</b></td></tr>`; }).join('')}</tbody>

}

// ==========================================================================
// MỤC TIÊU DOANH THU (chủ dự án chốt 12/10)
//   · Đặt theo THÁNG, mỗi tháng một mức; tháng chưa đặt dùng mức của tháng gần nhất trước đó (từng ô riêng).
//   · 3 ô: The Cafe 33 (so với Tổng nước), XOFA (so với Tổng không gồm Food), Chung 2 quán (nhập riêng,
//     so với Doanh thu chung = 2 số trên cộng lại).
//   · Kỳ khác tháng: mục tiêu từng ngày = mục tiêu tháng ÷ số ngày của tháng đó, cộng theo các ngày trong kỳ.
// Lưu: revenue_targets_tc33xofa/months { m: { 'YYYY-MM': { tc33, xofa, all, updatedAt } } } — 1 doc, 1 lượt đọc.
// ==========================================================================
const TARGET_KEYS = [{ key:'tc33', label:'The Cafe 33', note:'Tổng nước' }, { key:'xofa', label:'XOFA', note:'không gồm Food' }, { key:'all', label:'Mục tiêu chung — tất cả quán (gồm Gieo Gieo)', note:'Doanh thu chung' }];
const TARGET_DOC = () => fstore.collection('revenue_targets_tc33xofa').doc('months');
let TARGETS = null;
async function loadTargets(force){
  if(TARGETS && !force) return TARGETS;
  const d = await TARGET_DOC().get();
  TARGETS = (d.exists && d.data().m) || {};
  return TARGETS;
}
// Mức của tháng ym: tháng gần nhất ≤ ym có giá trị > 0 cho ô đó. Trả { value, from } hoặc null.
function targetMonthValue(T, ym, key){
  let best = null;
  Object.keys(T || {}).forEach(m=>{
    const v = Number(T[m] && T[m][key]);
    if(m <= ym && v > 0 && (!best || m > best.from)) best = { value: v, from: m };
  });
  return best;
}
function daysInMonthYm(ym){ const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
// Mục tiêu của khoảng ngày [from, to] — cộng từng ngày (mục tiêu tháng ÷ số ngày tháng đó). Không ngày nào có mức → null.
function targetForRange(T, from, to, key){
  let sum = 0, any = false; const memo = {};
  for(let d = parseDkey(from); dkey(d) <= to; d = addDays(d, 1)){
    const ym = dkey(d).slice(0, 7);
    if(!(ym in memo)) memo[ym] = targetMonthValue(T, ym, key);
    if(memo[ym]){ sum += memo[ym].value / daysInMonthYm(ym); any = true; }
  }
  return any ? Math.round(sum) : null;
}
// % đóng góp làm tròn sao cho các phần cộng lại đúng 100 (phần dư dồn cho phần có số lẻ lớn nhất).
function sharePcts(vals){
  const t = vals.reduce((a, v)=> a + (v || 0), 0);
  if(t <= 0) return vals.map(()=>0);
  const raw = vals.map(v=> (v || 0) / t * 100), fl = raw.map(Math.floor);
  let left = 100 - fl.reduce((a, v)=> a + v, 0);
  raw.map((v, i)=>({ i, f: v - fl[i] })).sort((a, b)=> b.f - a.f).forEach(x=>{ if(left > 0){ fl[x.i]++; left--; } });
  return fl;
}
function sharePct(a, b){ return sharePcts([a, b]); }
function tgtLevel(ratio){ return ratio >= 1 ? 'green' : ratio >= 0.8 ? 'blue' : ratio >= 0.5 ? 'amber' : 'red'; }
// Khối mục tiêu dưới một con số doanh thu. tgFn(from, to) → mục tiêu của khoảng ngày (null = chưa có).
// Kỳ chưa hết (có ngày sau hôm nay) → thêm dòng tiến độ tới hôm nay.
function tgtBlock(actual, tgFn, r, emptyHtml){
  const tg = tgFn(r.from, r.to);
  if(!tg) return emptyHtml != null ? emptyHtml : `<div class="mg-tgt"><div class="mg-tgt-l"><span>Chưa đặt mục tiêu</span><a href="#" onclick="switchScreen('target');return false" style="color:inherit;font-weight:700">Đặt ›</a></div></div>`;
  const ratio = actual / tg;
  const today = dkey(new Date());
  let pace = '';
  if(r.to > today && r.from <= today){
    const tgNow = tgFn(r.from, today);
    if(tgNow){ const d = actual - tgNow; pace = `<div class="mg-pace">Tiến độ tới hôm nay: ${Math.round(actual / tgNow * 100)}% (${d >= 0 ? 'vượt' : 'thiếu'} ${fmtGon(Math.abs(d))})</div>`; }
  }
  return `<div class="mg-tgt">
    <div class="mg-tgt-l"><span>Mục tiêu ${fmtGon(tg)}</span><b>${Math.round(ratio * 100)}%</b></div>
    <div class="meter"><div class="meter-bar"><div class="meter-fill ${tgtLevel(ratio)}" style="width:${Math.max(3, Math.min(100, ratio * 100))}%"></div></div></div>
    ${actual < tg ? `<div class="mg-pace">Còn thiếu ${fmtGon(tg - actual)}</div>` : ''}${pace}
  </div>`;
}

let targetMonth = dkey(new Date()).slice(0, 7);
async function renderTarget(){
  const body = document.getElementById('targetBody');
  showLoading(body);
  const [T, ggHist, gg] = await Promise.all([loadTargets(true), gieoConfigHistory().catch(()=>null), gieoStores()]);
  const cur = T[targetMonth] || {};
  // Gieo: chỉ ĐỌC mục tiêu của Quản lý Gieo (AOV × bill/ngày) — không cấu hình ở đây.
  const mEnd = dkey(new Date(Number(targetMonth.slice(0,4)), Number(targetMonth.slice(5,7)), 0));
  const ggT = ggHist ? gieoTargetsOn(ggHist, mEnd) : null;
  const ggMonth = ggHist ? gieoTargetForRange(ggHist, targetMonth + '-01', mEnd) : null;
  const ggN = gg.filter(x=>x.active).length || 1;
  const months = Object.keys(T).filter(m => TARGET_KEYS.some(k => Number(T[m][k.key]) > 0)).sort().reverse();
  const [y, m] = targetMonth.split('-').map(Number);
  body.innerHTML = `
    <div class="card">
      <div class="field"><label>Tháng ${infoI('Đặt mục tiêu doanh thu theo THÁNG; tháng chưa đặt dùng mức của tháng gần nhất trước đó. Xem Hôm nay / Tuần / Năm thì mục tiêu tự chia theo số ngày.<br>The Cafe 33 so với Tổng nước · XOFA so với không gồm Food · Mục tiêu chung so với Doanh thu chung — là mức bạn mong muốn cho cả hệ thống, được phép thấp hơn tổng mục tiêu từng quán để quán này bù quán kia.')}</label>
        <input type="month" id="tgMonth" value="${targetMonth}" onchange="targetMonth=this.value;renderTarget()"></div>
      ${TARGET_KEYS.map(k=>{
        const own = Number(cur[k.key]) > 0 ? Number(cur[k.key]) : '';
        const inh = own ? null : targetMonthValue(T, targetMonth, k.key);
        return `<div class="field"><label>${k.label}</label>
          <input type="number" inputmode="numeric" id="tg_${k.key}" value="${own}" placeholder="${inh ? fmtN(inh.value) + ' (đang dùng mức tháng ' + inh.from.slice(5) + '/' + inh.from.slice(0, 4) + ')' : 'VD: 60000000'}">

async function saveTarget(){

  }

    await TARGET_DOC().set({ m: { [targetMonth]: rec } }, { mergeFields: ['m.' + targetMonth] });

  }catch(err){ toast('❌ ' + (err.message||err)); }
}

}

// ==========================================================================
// Trường mới `workStores`: quán người này làm việc. Thiếu = ['gieo'] (nhân viên Gieo như trước).
// pos.html / PosX.html chỉ cho check-in người có tích đúng quán (cham_cong.v1.js).
// Lương tính ở đây: CHỈ lương giờ. Người lương cứng (của Gieo) — chỉ sửa tên / PIN / cửa hàng, lương sửa ở quanlygieo.
let EMP_CACHE = null;
async function loadEmployees(force){
  if(EMP_CACHE && !force) return EMP_CACHE;
  const snap = await fstore.collection('employees_gieogieo').get();
  const today = dkey(new Date());
  EMP_CACHE = snap.docs.map(d=>{ const e = {id:d.id, ...d.data()}; if(Array.isArray(e.payHistory) && e.payHistory.length) Object.assign(e, empPayTermsOn(e, today)); return e; })
    .sort((a,b)=>(a.fullName||'').localeCompare(b.fullName||'','vi'));
  return EMP_CACHE;
}
function workStoresOf(e){
  const ws = e && Array.isArray(e.workStores) ? e.workStores.filter(x=>typeof x === 'string' && x) : [];
  return ws.length ? ws : ['gieo'];
}
function worksAt(e, st){ return workStoresOf(e).includes(st); }
function isHourly(e){ return !!e && (e.payType === 'hourly_full' || e.payType === 'hourly_part'); }
function storeTags(e){ return workStoresOf(e).map(s=>`<span class="mg-tag ${s}">${s==='gieo'?'Gieo':s==='tc33'?'TC33':s==='xofa'?'XOFA':esc(s)}</span>`).join(''); }

// [LƯƠNG THEO MỐC] — chép nguyên từ quanlygieo.html: mỗi NGÀY dùng mức có effectiveFrom lớn nhất ≤ ngày đó;
// chưa có payHistory → ảnh chụp payTerms của ca, không có mới dùng hồ sơ hiện tại.
const PAY_FIELDS = ['payType','hourlyRate','otEnabled','otThresholdHours','otRate','fixedMonthlySalary'];
function payTermsOfRecord(o){
  o = o || {};
  return { payType: o.payType||null, hourlyRate: Number(o.hourlyRate)||0, otEnabled: !!o.otEnabled,
    otThresholdHours: Number(o.otThresholdHours)||0, otRate: Number(o.otRate)||0, fixedMonthlySalary: Number(o.fixedMonthlySalary)||0 };
}
function empPayTermsOn(emp, dateKey, snap){
  const hist = (emp && Array.isArray(emp.payHistory) ? emp.payHistory : []).filter(h=>h && h.effectiveFrom)
    .slice().sort((a,b)=>String(a.effectiveFrom).localeCompare(String(b.effectiveFrom)));
  const useSnap = snap && snap.payType;
  if(!hist.length) return payTermsOfRecord(useSnap ? snap : emp);
  let pick = null;
  for(const h of hist){ if(String(h.effectiveFrom) <= String(dateKey)) pick = h; else break; }
  if(!pick) pick = hist[0];
  if(pick.legacy && useSnap) return payTermsOfRecord(snap);
  return payTermsOfRecord(pick);
}
// OT tính theo NGÀY (gộp mọi ca trong ngày trước khi so ngưỡng) — như computeWageForDayHours của quanlygieo.
function computeWageForDayHours(emp, hoursInDay){
  const rate = Number(emp && emp.hourlyRate)||0;
  if(!emp || !emp.otEnabled) return { amount: hoursInDay*rate, regularHours: hoursInDay, otHours: 0 };
  const threshold = Number(emp.otThresholdHours)||8, otRate = Number(emp.otRate)||0;
  if(hoursInDay <= threshold) return { amount: hoursInDay*rate, regularHours: hoursInDay, otHours: 0 };
  return { amount: threshold*rate + (hoursInDay-threshold)*otRate, regularHours: threshold, otHours: hoursInDay - threshold };
}
// Giờ một ca: có giờ ra → ra − vào; đang mở của HÔM NAY → tạm tới hiện tại; mở của ngày đã qua → 0 (không đoán).
function isShiftInProgress(s){ return !!s && !s.checkedOutAt && s.businessDate === dkey(new Date()); }
function shiftWorkedHours(s, nowMs){
  if(!s || !s.checkedInAt) return 0;
  const inMs = new Date(s.checkedInAt).getTime();
  if(isNaN(inMs)) return 0;
  let endMs;
  if(s.checkedOutAt){ endMs = new Date(s.checkedOutAt).getTime(); if(isNaN(endMs)) return 0; }
  else { if(!isShiftInProgress(s)) return 0; endMs = nowMs || Date.now(); }
  return Math.max(0, (endMs - inMs) / 3600000);
}
function payTypeLabel(e){
  const ot = (e.otEnabled && isHourly(e)) ? ` · OT: &gt;${fmtNum(e.otThresholdHours||8,1)}h/ngày = ${fmt(e.otRate||0)}/giờ` : '';
  if(e.payType==='hourly_full') return `${fmt(e.hourlyRate||0)}/giờ (Full-time)${ot}`;
  if(e.payType==='hourly_part') return `${fmt(e.hourlyRate||0)}/giờ (Part-time)${ot}`;
  if(e.payType==='fixed') return `Lương cứng ${fmt(e.fixedMonthlySalary||0)}/tháng (tính ở Quản lý Gieo)`;
  return '⚠️ Chưa khai hình thức lương';
}

async function nvSubmit(){
  const fullName = (document.getElementById('nvFullName').value||'').trim();
  const pin = (document.getElementById('nvPin').value||'').trim();
  const workStores = WORK_STORE_OPTS.filter(o=>{ const c = document.getElementById('nvWs_'+o.id); return c && c.checked; }).map(o=>o.id);
  if(!fullName){ toast('⚠️ Nhập họ tên'); return; }
  if(!/^\d{4}$/.test(pin)){ toast('⚠️ Mã PIN phải đúng 4 chữ số'); return; }
  if(!workStores.length){ toast('⚠️ Chọn ít nhất 1 cửa hàng'); return; }
  const list = await loadEmployees(true);
  const cur = nvEditingId ? (list.find(e=>e.id===nvEditingId) || {}) : null;
  const clash = list.find(e => e.pin === pin && e.active !== false && e.id !== nvEditingId);
  if(clash){ toast(`❌ Mã PIN ${pin} đã được dùng bởi "${clash.fullName}" — chọn PIN khác`); return; }
  const patch = { fullName, pin, workStores };
  if(!(cur && cur.payType === 'fixed')){
    const otEnabled = !!(document.getElementById('nvOtEnabled') && document.getElementById('nvOtEnabled').checked);
    const otRate = otEnabled ? (Number(document.getElementById('nvOtRate').value)||0) : 0;
    if(otEnabled && !otRate){ toast('⚠️ Nhập đơn giá lương OT'); return; }
    const pay = { payType: document.getElementById('nvPayType').value, hourlyRate: Number(document.getElementById('nvHourlyRate').value)||0,
      fixedMonthlySalary: 0, otEnabled, otThresholdHours: otEnabled ? (Number(document.getElementById('nvOtThreshold').value)||8) : 0, otRate };
    if(cur){
      // Đổi lương khi SỬA → thêm mốc vào payHistory (như quanlygieo), các ngày trước mốc giữ mức cũ.
      const before = payTermsOfRecord(cur), after = payTermsOfRecord(pay);
      if(PAY_FIELDS.some(k=>before[k]!==after[k])){
        const from = ((document.getElementById('nvPayFrom')||{}).value || dkey(new Date())).trim();
        if(!/^\d{4}-\d{2}-\d{2}$/.test(from)){ toast('⚠️ Chọn ngày áp dụng mức lương mới'); return; }
        let hist = Array.isArray(cur.payHistory) ? cur.payHistory.slice() : [];
        if(!hist.length) hist.push({ effectiveFrom:'0000-00-00', legacy:true, ...before });
        hist = hist.filter(h=>h.effectiveFrom!==from);
        hist.push({ effectiveFrom: from, ...after, changedAt: new Date().toISOString() });
        hist.sort((a,b)=>String(a.effectiveFrom).localeCompare(String(b.effectiveFrom)));
        Object.assign(patch, empPayTermsOn({payHistory:hist}, dkey(new Date())), { payHistory: hist });
      }
    } else Object.assign(patch, pay);
  }
  try{
    if(cur){ await fstore.collection('employees_gieogieo').doc(nvEditingId).update(patch); toast('✅ Đã lưu'); }
    else { await fstore.collection('employees_gieogieo').add({ ...patch, active:true, roles:[], createdAt:new Date().toISOString(), createdFrom:'manage' }); toast('✅ Đã thêm nhân viên'); }
    nvEditingId = null; nvDraft = { payType:null, otEnabled:null, workStores:null };
    closeEditSheet(true);
    EMP_CACHE = null;
    renderNv();
  }catch(err){ toast('❌ ' + (err.message||err)); }
}
async function nvToggleActive(id, active){
  try{
    if(active){
      const list = await loadEmployees(true);
      const me = list.find(e=>e.id===id);
      const clash = me && list.find(e => e.pin === me.pin && e.active !== false && e.id !== id);
      if(clash){ toast(`❌ PIN ${me.pin} đang thuộc "${clash.fullName}" — sửa PIN trước khi bật lại`); return; }
    } else if(!confirm('Ngừng nhân viên này? (không check-in được nữa ở mọi quán — kể cả Gieo)')) return;
    await fstore.collection('employees_gieogieo').doc(id).update({ active });
    EMP_CACHE = null; toast('✅ Đã lưu'); renderNv();
  }catch(err){ toast('❌ ' + (err.message||err)); }
}

function bulkLichWd(w){ const i = bulkLich.weekdays.indexOf(w); if(i>=0) bulkLich.weekdays.splice(i,1); else bulkLich.weekdays.push(w); renderLich(); }
async function submitBulkLich(){
  const emp = (await loadEmployees()).find(e=>e.id===bulkLich.employeeId);
  if(!emp){ toast('⚠️ Chọn nhân viên'); return; }
  if(!bulkLich.startDate || !bulkLich.endDate || bulkLich.startDate > bulkLich.endDate){ toast('⚠️ Khoảng ngày không hợp lệ'); return; }
  if(!bulkLich.weekdays.length){ toast('⚠️ Chọn ít nhất 1 thứ'); return; }
  if(!bulkLich.isOff && (!bulkLich.startTime || !bulkLich.endTime)){ toast('⚠️ Nhập đủ giờ vào/ra'); return; }
  const dates = [];
  for(let d = parseDkey(bulkLich.startDate); dkey(d) <= bulkLich.endDate; d = addDays(d, 1)) if(bulkLich.weekdays.includes(d.getDay())) dates.push(dkey(d));
  if(!dates.length){ toast('⚠️ Không có ngày nào khớp thứ đã chọn'); return; }
  if(dates.length > 120){ toast('⚠️ Tối đa 120 ngày mỗi lần'); return; }
  if(!confirm(`Xếp lịch ${STORES[HR_STORE].name} cho ${emp.fullName}: ${dates.length} ngày. Tiếp tục?`)) return;
  try{
    await Promise.all(dates.map(d => saveScheduleEntry(emp.id, emp.fullName, d, bulkLich.startTime, bulkLich.endTime, bulkLich.isOff)));
    toast(`✅ Đã xếp lịch ${dates.length} ngày cho ${emp.fullName}`); renderLich();
  }catch(err){ toast('❌ ' + (err.message||err)); }
}
async function submitSchedule(employeeId, employeeName){
  const isOff = document.getElementById('lichOff_'+employeeId).checked;
  const st = isOff ? null : document.getElementById('lichStart_'+employeeId).value;
  const en = isOff ? null : document.getElementById('lichEnd_'+employeeId).value;
  if(!isOff && (!st || !en)){ toast('⚠️ Nhập đủ giờ vào/ra'); return; }
  try{ await saveScheduleEntry(employeeId, employeeName, lichViewDate, st, en, isOff); toast('✅ Đã lưu lịch'); renderLich(); }
  catch(err){ toast('❌ ' + (err.message||err)); }
}
async function deleteSchedule(employeeId){
  if(!confirm('Xoá lịch làm việc ngày này của nhân viên?')) return;
  try{ await schedColl().doc(scheduleDocId(employeeId, lichViewDate)).delete(); toast('🗑 Đã xoá lịch'); renderLich(); }
  catch(err){ toast('❌ ' + (err.message||err)); }
}

let HR_SETTINGS = { lateGraceMinutes: 10 };

function shiftColl(st){ return fstore.collection(STORES[st || HR_STORE].shifts); }

function hhmm(iso){ if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toIso(dateKey, t){ if(!t) return null; const [h,m] = t.split(':').map(Number); const d = parseDkey(dateKey); d.setHours(h||0, m||0, 0, 0); return d.toISOString(); }
// Giờ ra ≤ giờ vào = ca qua đêm (rạng sáng hôm sau), vẫn thuộc cùng businessDate.
function outIso(dateKey, inIsoV, t){ if(!t) return null; let o = new Date(toIso(dateKey, t)); if(o <= new Date(inIsoV)) o = new Date(o.getTime() + 86400000); return o.toISOString(); }

async function ccSave(id){
  const inV = document.getElementById('cc-in-'+id).value, outV = document.getElementById('cc-out-'+id).value;
  if(!inV){ toast('⚠️ Phải có giờ vào'); return; }
  const checkedInAt = toIso(ccDate, inV);
  const checkedOutAt = outV ? outIso(ccDate, checkedInAt, outV) : null;
  if(checkedOutAt){ const h = (new Date(checkedOutAt) - new Date(checkedInAt))/3600000; if(h > 16 && !confirm('Ca này dài ' + h.toFixed(1) + ' giờ — có chắc không?')) return; }
  try{ await shiftColl().doc(id).update({ checkedInAt, checkedOutAt, manualEdit:true, manualEditAt:new Date().toISOString(), manualEditBy:'manage' }); ccEditId = null; toast('✅ Đã sửa chấm công'); renderCc(); }
  catch(err){ toast('❌ ' + (err.message||err)); }
}
async function ccDelete(id){
  if(!confirm('Xoá hẳn bản ghi chấm công này? Không khôi phục được.')) return;
  try{ await shiftColl().doc(id).delete(); ccEditId = null; toast('✅ Đã xoá bản ghi'); renderCc(); }
  catch(err){ toast('❌ ' + (err.message||err)); }
}
async function ccAdd(){
  const empId = (document.getElementById('cc-add-emp')||{}).value, inV = document.getElementById('cc-add-in').value, outV = document.getElementById('cc-add-out').value;
  if(!empId){ toast('⚠️ Chọn nhân viên'); return; }
  if(!inV){ toast('⚠️ Nhập giờ vào'); return; }
  const emp = ccEmps.find(e=>e.id===empId);
  const checkedInAt = toIso(ccDate, inV), checkedOutAt = outV ? outIso(ccDate, checkedInAt, outV) : null;
  try{
    const dup = await shiftColl().where('businessDate','==',ccDate).get();
    if(dup.docs.some(d=>{ const x = d.data(); return x.employeeId === empId && x.checkedInAt === checkedInAt; })){ toast('⚠️ Đã có bản ghi đúng giờ vào này rồi'); return; }
    await shiftColl().add({ employeeId: empId, employeeName: emp ? emp.fullName : '(không rõ)', businessDate: ccDate, store: HR_STORE,
      checkedInAt, checkedOutAt, manualEntry:true, manualEditAt:new Date().toISOString(), manualEditBy:'manage' });
    ccAddOpen = false; toast('✅ Đã thêm ca bù'); renderCc();
  }catch(err){ toast('❌ ' + (err.message||err)); }
}
async function saveLateGrace(v){
