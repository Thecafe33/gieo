}

// ==========================================================================
// LƯƠNG — lương giờ từ chấm công ở TC33 / XOFA (OT theo ngày, từng quán), như computeActualLaborBreakdownByEmployee
// của quanlygieo. Cột "Giờ ở Gieo" chỉ để tham khảo — lương phần đó tính ở Quản lý Gieo.
// ==========================================================================
let luongMonth = dkey(new Date()).slice(0,7);
// Thuần: shifts = [{employeeId, businessDate, checkedInAt, checkedOutAt, payTerms}], trả { empId: {hours, otHours, amount} }.
function laborByEmployee(employees, shifts, nowMs){
  const empById = {}; employees.forEach(e=>empById[e.id]=e);
  const hoursKey = {}, termsKey = {};
  shifts.forEach(s=>{
    const emp = empById[s.employeeId]; if(!emp) return;
    const terms = empPayTermsOn(emp, s.businessDate, s.payTerms);
    if(terms.payType!=='hourly_full' && terms.payType!=='hourly_part') return;
    const h = shiftWorkedHours(s, nowMs); if(h <= 0) return;
    const k = s.employeeId + '|' + s.businessDate;
    hoursKey[k] = (hoursKey[k]||0) + h;
    if(!termsKey[k]) termsKey[k] = terms;
  });
  const out = {};
  Object.entries(hoursKey).forEach(([k, h])=>{
    const id = k.slice(0, k.indexOf('|'));
    const r = computeWageForDayHours(termsKey[k], h);
    const b = out[id] || (out[id] = { hours:0, otHours:0, amount:0 });
    b.hours += h; b.otHours += r.otHours; b.amount += r.amount;
  });
  return out;
}
async function gieoHoursByEmployee(from, to){
  // Ca chấm công ở các quán Gieo: gg01 = employee_shifts_gieogieo, quán khác = employee_shifts_gieogieo__{id} (data_access).
  let ids = ['gg01'];
  try{ const s = await fstore.collection('stores_gieogieo').get(); const x = s.docs.map(d=>d.id).filter(id=>/^gg\d{2}$/.test(id)); if(x.length) ids = Array.from(new Set(['gg01', ...x])); }catch(e){}
  const out = {};
  await Promise.all(ids.map(async id=>{
    const name = id === 'gg01' ? 'employee_shifts_gieogieo' : 'employee_shifts_gieogieo__' + id;
    try{
      const snap = await fstore.collection(name).where('businessDate','>=',from).where('businessDate','<=',to).get();
      snap.docs.forEach(d=>{ const s = d.data(); out[s.employeeId] = (out[s.employeeId]||0) + shiftWorkedHours(s); });
    }catch(e){ console.warn('[Lương] không đọc được', name, e); }
  }));
  return out;
}
async function renderLuong(){
  const body = document.getElementById('luongBody');
  showLoading(body);
  const [y, m] = luongMonth.split('-').map(Number);
  const from = dkey(new Date(y, m-1, 1)), to = dkey(new Date(y, m, 0));
  const [emps, tcSnap, xoSnap, gieo] = await Promise.all([
    loadEmployees(true),
    shiftColl('tc33').where('businessDate','>=',from).where('businessDate','<=',to).get(),
    shiftColl('xofa').where('businessDate','>=',from).where('businessDate','<=',to).get(),
    gieoHoursByEmployee(from, to)
  ]);
  const now = Date.now();
  const tcShifts = tcSnap.docs.map(d=>d.data()), xoShifts = xoSnap.docs.map(d=>d.data());
  const L = { tc33: laborByEmployee(emps, tcShifts, now), xofa: laborByEmployee(emps, xoShifts, now) };
  const treo = tcShifts.concat(xoShifts).filter(s=>!s.checkedOutAt && !isShiftInProgress(s)).length;
  const ids = new Set([...Object.keys(L.tc33), ...Object.keys(L.xofa)]);
  emps.filter(e=>e.active!==false && isHourly(e) && (worksAt(e,'tc33')||worksAt(e,'xofa'))).forEach(e=>ids.add(e.id));
  const rows = Array.from(ids).map(id=>{
    const e = emps.find(x=>x.id===id) || { id, fullName: '(đã xoá)' };
    const a = L.tc33[id] || {hours:0,otHours:0,amount:0}, b = L.xofa[id] || {hours:0,otHours:0,amount:0};
    return { e, a, b, total: a.amount + b.amount, gieo: gieo[id] || 0 };
  }).sort((p,q)=>q.total - p.total || (p.e.fullName||'').localeCompare(q.e.fullName||'','vi'));
  const sum = rows.reduce((s,r)=>({ tc: s.tc + r.a.amount, xo: s.xo + r.b.amount }), { tc:0, xo:0 });
  body.innerHTML = `
    <div class="card"><div class="field" style="margin-bottom:0"><label>Xem tháng</label>
      <div style="display:flex;gap:6px"><input type="month" id="luongMonthInput" value="${luongMonth}" style="flex:1">
      <button class="btn" style="width:auto;padding:0 16px" onclick="luongMonth=document.getElementById('luongMonthInput').value;renderLuong()">Xem</button></div></div></div>
    <div class="kcard kcard-wide lv-green" style="margin-bottom:12px">
      <div class="klabel">Lương giờ tháng ${m}/${y}</div><div class="kval">${fmt(sum.tc + sum.xo)}</div>
      <div class="ksub">The Cafe 33 ${fmt(sum.tc)} · XOFA ${fmt(sum.xo)}</div></div>
    ${treo ? `<div class="card" style="border-left:3px solid var(--bad)"><div class="small-note" style="margin:0;color:var(--bad)">${ic('alert',14)} ${treo} ca quên check-out trong tháng chưa được tính — sửa ở mục Chấm công.</div></div>` : ''}
    <div class="sec-title">Từng người ${infoI('Tiền = giờ chấm công thật × đơn giá đúng ngày (theo lịch sử lương), OT tính theo từng ngày ở từng quán. Ca hôm nay đang mở tính tạm tới hiện tại. *Giờ ở Gieo chỉ để tham khảo — lương phần đó xem ở Quản lý Gieo.')}</div>
    <div class="card mg-scroll"><table class="kt">
      <thead><tr><th>Nhân viên</th><th style="text-align:right">Giờ TC33</th><th style="text-align:right">Giờ XOFA</th><th style="text-align:right">Tiền</th><th style="text-align:right">Giờ Gieo*</th></tr></thead>
      <tbody>${rows.length ? rows.map(r=>`<tr>
        <td>${esc(r.e.fullName)}<div class="small-note" style="margin:2px 0 0">${isHourly(r.e) ? payTypeLabel(r.e) : 'không phải lương giờ'}${(r.a.otHours+r.b.otHours)>0 ? ` · <span style="color:var(--warn);font-weight:700">${fmtNum(r.a.otHours+r.b.otHours,1)}h OT</span>` : ''}</div></td>
        <td style="text-align:right">${fmtNum(r.a.hours,1)}h</td><td style="text-align:right">${fmtNum(r.b.hours,1)}h</td>
        <td style="text-align:right"><b>${fmt(r.total)}</b></td><td style="text-align:right;color:var(--gt)">${r.gieo ? fmtNum(r.gieo,1)+'h' : '—'}</td></tr>`).join('')
        : '<tr><td colspan="5"><div class="muted">Chưa có ca nào trong tháng.</div></td></tr>'}</tbody>
    </table></div>
  `;
}
