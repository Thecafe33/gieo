   */
  function restoreFound(unit, spec) {
    if (unit.status !== STATUS.LOST) return R.err('PRECONDITION', 'Unit không ở trạng thái LOST');
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'restoreFound cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'restoreFound cần operationId');

    var back = unit.statusBeforeLost || STATUS.SEALED;
    if (!canTransition(STATUS.LOST, back)) back = STATUS.SEALED;
    var review = addReview(unit, REVIEW.RESTORED_FROM_LOST);

    return R.ok(Object.assign({}, unit, {
      status: back,
      foundAt: spec.at,
      foundBy: spec.actorId,
      operationId: spec.operationId
    }, review));
  }

  /**
   * RM3 — sửa giá nhập sai (`NET-RAW-MATERIAL-V1.md` RM3).
   *
   * Cố ý KHÔNG có `historicalPolicy` để chọn như `ReviseState`
   * (`commands/reversal.js`): invariant #14 (`recipe-cost-btp/cost.js` —
   * "CẤM dùng giá hiện tại để tính lại lịch sử") đã cấm RECOMPUTE cho MỌI
   * giá vốn ở mọi nơi khác trong hệ thống, nên costBasis của Unit chỉ có
   * đúng MỘT chính sách hợp lệ: ĐÓNG BĂNG ledger đã ghi bằng giá cũ, sửa chỉ
   * ảnh hưởng phần TIÊU THỤ TỪ NAY VỀ SAU (và giá trị còn lại cho báo cáo,
   * vd liability nếu Unit đang LOST). Cho `ReviseState` chọn RECOMPUTE ở đây
   * sẽ mở lại đúng invariant đã đóng — nên đây là command riêng.
   *
   * Audit append-only trong `costBasisRevisions`, không ghi đè.
   */
  function reviseCostBasis(unit, spec) {
    if (unit.status === STATUS.VOIDED) {
      return R.err('PRECONDITION', 'không sửa giá vốn của Unit đã VOIDED');
    }
    if (!spec || typeof spec.unitCost !== 'number' || spec.unitCost < 0) {
      return R.err('VALIDATION', 'reviseCostBasis cần unitCost là số không âm');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'reviseCostBasis cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'reviseCostBasis cần operationId');
    if (!spec.reason) return R.err('VALIDATION', 'sửa giá nhập sai phải có lý do');

    var before = unit.costBasis || null;
    var after = {
      unitCost: spec.unitCost,
      currency: spec.currency || (before && before.currency) || 'VND',
      versionId: spec.versionId || null,
      source: 'CORRECTION'
    };
    var revision = {
      before: before, after: after,
      at: spec.at, actorId: spec.actorId, reason: spec.reason, operationId: spec.operationId
    };

    return R.ok(Object.assign({}, unit, {
      costBasis: after,
      costBasisRevisions: (unit.costBasisRevisions || []).concat([revision]),
      operationId: spec.operationId
    }));
  }

  /**
   * Trạng thái HIỂN THỊ, gộp cả phần suy diễn.
   * Dùng cho UI/alert; state máy vẫn là `unit.status`.
   */
  function effectiveState(unit) {
    if (unit.debt && !unit.debt.absorbedByUnitId) return 'DEBT';
    if ((unit.status === STATUS.OPEN || unit.status === STATUS.CONSUMING) && unit.remainingQty <= 0) {
      return 'SYSTEM_EXHAUSTED';
    }
    return unit.status;
  }

  /**
   * Điều kiện CẦN để compact (FIFO-COMPACTION-CONTRACT-V1.md §2.2).
   * Trả về danh sách lý do CHẶN thay vì true/false, để chỗ gọi nói được vì sao.
   */
  function compactBlockers(unit) {
    var blockers = [];
    if (unit.status !== STATUS.PHYSICALLY_FINISHED && unit.status !== STATUS.VOIDED) {
      blockers.push('chưa kết thúc vòng đời (đang ' + unit.status + ')');
    }
    if (unit.debt && !unit.debt.absorbedByUnitId) {
      blockers.push('còn nợ ' + unit.debt.amount + ' chưa được hấp thụ');
    }
    if (unit.needsReview) {
      blockers.push('còn cờ cần rà: ' + unit.needsReviewReasons.join(', '));
    }
    return blockers;
  }

  return {
    STATUS: STATUS,
    ORIGIN: ORIGIN,
    TRANSITIONS: TRANSITIONS,
    ITEM_KIND: ITEM_KIND,
    REVIEW: REVIEW,
    isStatus: isStatus,
    canTransition: canTransition,
    createUnit: createUnit,
    seedUnitFromLegacy: seedUnitFromLegacy,
    open: open,
    markConsuming: markConsuming,
    markSystemExhausted: markSystemExhausted,
    finish: finish,
    recordDebt: recordDebt,
    absorbDebt: absorbDebt,
    markLost: markLost,
    restoreFound: restoreFound,
    reviseCostBasis: reviseCostBasis,
    effectiveState: effectiveState,
    compactBlockers: compactBlockers
  };
});

/* ===== src/layers/traceability/trace.js ===== */
/**
 * Traceability graph — trace 2 chiều.
 *
 * Contract: GIEO-SYSTEM-REBUILD-PLAN.md §8 (Phase 4),
 * GIEO-NEW-CHAT-HANDOFF-FLAN-1.md §1.1 (bộ câu hỏi 1 Unit phải trả lời được).
 *
 * Forward:  supplier → receipt → unit → open → allocation → bill/BTP/waste/lost
 * Reverse:  bill/COGS/waste/lost/BTP → xuống tận Unit
 *
 * Đây là thứ biện minh cho câu "FIFO là traceability backbone, không phải một
 * feature của kho": nếu không trả lời được trọn bộ câu hỏi dưới đây thì Unit
 * chỉ là một con số tồn kho, không phải xương sống truy vết.
 */
GIEO.define('traceability/trace', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'fifo-core/unit'
], function (ids, R, unitLib) {
  /* eslint-disable no-unused-vars */
  'use strict';

  /**
   * Bộ câu hỏi bắt buộc. Khai thành dữ liệu để kiểm được là trace có trả lời
   * đủ hay không, thay vì tin là đủ.
   */
  var REQUIRED_ANSWERS = [
    'nhận từ đâu', 'supplier/receipt nào', 'số lượng ban đầu', 'cost basis nào',
    'mở lúc nào', 'ai mở', 'đã phân bổ cho những gì', 'dùng cho bill nào',
    'dùng cho BTP batch nào', 'recipe version nào', 'hệ thống báo hết lúc nào',
    'nhân viên báo hết lúc nào', 'waste/lost/adjustment/reversal nào liên quan'
  ];

  /** Forward trace cho 1 Unit. */
  function buildUnitTrace(spec) {
    var unit = spec.unit;
    if (!unit || !ids.isId(unit.unitId, 'unit')) {
      return R.err('VALIDATION', 'buildUnitTrace cần unit hợp lệ');
    }

    var entries = (spec.ledgerEntries || []).filter(function (e) { return e.unitId === unit.unitId; });
    var allocations = (spec.allocations || []).filter(function (a) { return a.unitId === unit.unitId; });

    var billIds = [];
    var prepBatchIds = [];
    var recipeVersionIds = [];
    allocations.forEach(function (a) {
      if (a.billId && billIds.indexOf(a.billId) === -1) billIds.push(a.billId);
      if (a.prepBatchId && prepBatchIds.indexOf(a.prepBatchId) === -1) prepBatchIds.push(a.prepBatchId);
      (a.recipeVersionIds || []).forEach(function (v) {
        if (recipeVersionIds.indexOf(v) === -1) recipeVersionIds.push(v);
      });
    });

    function byType(t) { return entries.filter(function (e) { return e.type === t; }); }

    return R.ok({
      unitId: unit.unitId,
      itemId: unit.itemId,
      storeId: unit.storeId,
      itemKind: unit.itemKind,

      origin: {
        receiptId: unit.receiptId,
        supplierId: unit.supplierId,
        receivedAt: unit.receivedAt,
        receivedBy: unit.receivedBy
      },
      initialQty: unit.initialQty,
      remainingQty: unit.remainingQty,
      costBasis: unit.costBasis,

      opened: { at: unit.openedAt, by: unit.openedBy },

      /* Từng lần bị trừ, đủ chi tiết để cộng lại ra số dư hiện tại. */
      allocations: allocations.map(function (a) {
        return {
          operationId: a.operationId, qty: a.qty,
          unitBaseBefore: a.unitBaseBefore, unitBaseAfter: a.unitBaseAfter,
          unitCost: a.unitCost, cost: a.cost,
          billId: a.billId || null, prepBatchId: a.prepBatchId || null
        };
      }),
      billIds: billIds,
      prepBatchIds: prepBatchIds,
      recipeVersionIds: recipeVersionIds,

      /* Hai mốc ĐỘC LẬP, không suy ra nhau (FIFO-CORE §2). Legacy chỉ suy diễn
         tạm thời mốc thứ nhất nên không trả lời được nó trong lịch sử. */
      systemExhaustedAt: unit.systemExhaustedAt,
      physicallyFinished: {
        at: unit.finishedAt, by: unit.finishedBy,
        reason: unit.finishReason, wasteQty: unit.wasteQty
      },

      debt: unit.debt,
      lost: unit.lostAt ? { at: unit.lostAt, by: unit.lostBy, reportId: unit.lostReportId } : null,
      found: unit.foundAt ? { at: unit.foundAt, by: unit.foundBy } : null,

      waste: byType('WASTE'),
      adjustments: byType('ADJUSTMENT'),
      reversals: byType('REVERSAL'),
      physicalReconciliations: unit.physicalReconciliations,

      needsReview: unit.needsReview,
      needsReviewReasons: unit.needsReviewReasons,
      currentState: unitLib.effectiveState(unit),

      /**
       * RANH GIỚI TRUY VẾT — phần quan trọng nhất của trace một lô tiếp nhận.
       *
       * Lô seed từ hệ cũ chỉ truy được TỪ mốc tiếp nhận trở đi. Nếu không nói ra,
       * màn truy vết sẽ hiện một lịch sử cụt trông y hệt một lịch sử đầy đủ, và
       * người đọc sẽ kết luận sai từ một khoảng trống mà họ không biết là trống.
       *
       * Đây KHÔNG phải dữ liệu bị mất do lỗi: đó là quyết định đã chốt — lấy
       * FIFO làm gốc cho tương lai, không bám vào quá khứ.
       */
      traceability: unit.origin === unitLib.ORIGIN.LEGACY_SEED
        ? {
            origin: unit.origin,
            completeFrom: unit.seededAt,
            legacyRef: unit.legacyRef,
            complete: false,
            note: 'Lô tiếp nhận từ hệ cũ tại ' + unit.seededAt +
              '. Truy vết đầy đủ từ mốc này trở đi; lịch sử trước đó thuộc hệ cũ và ' +
              'không được truy xuất — đây là ranh giới đã chốt, không phải dữ liệu thiếu.'
          }
        : { origin: unit.origin, completeFrom: unit.receivedAt, legacyRef: null, complete: true, note: null }
    });
  }

  /**
   * Kiểm trace có trả lời đủ bộ câu hỏi không.
   * Trả danh sách câu CHƯA trả lời được, thay vì true/false — để nói được
   * thiếu cái gì.
   */
  function unanswered(trace) {
    var missing = [];

    /* Lô seed: những câu hỏi về xuất xứ nằm NGOÀI ranh giới, nên không tính là
       "chưa trả lời được". Tính chúng vào sẽ biến một quyết định đã chốt thành
       một danh sách lỗi dài vĩnh viễn, và danh sách lỗi mà không ai sửa được
       thì chỉ dạy người ta bỏ qua danh sách lỗi. */
    var seeded = trace.traceability && trace.traceability.complete === false;
    if (!seeded) {
      if (!trace.origin.receiptId && !trace.origin.supplierId) missing.push('nhận từ đâu');
      if (!trace.origin.supplierId) missing.push('supplier/receipt nào');
      if (!trace.costBasis || typeof trace.costBasis.unitCost !== 'number') missing.push('cost basis nào');
      if (!trace.opened.at) missing.push('mở lúc nào');
      if (!trace.opened.by) missing.push('ai mở');
    }

    /* Những câu này phải trả lời được với MỌI lô, kể cả lô seed — vì chúng nói
       về quãng đời SAU mốc tiếp nhận, tức phần hệ mới chịu trách nhiệm. */
    if (typeof trace.initialQty !== 'number') missing.push('số lượng ban đầu');
    if (!trace.allocations) missing.push('đã phân bổ cho những gì');
    return missing;
  }

  /** Reverse trace: từ 1 bill xuống các Unit đã gánh nó. */
  function buildBillTrace(spec) {
    var billId = spec.billId;
    if (!ids.isId(billId, 'bill')) return R.err('VALIDATION', 'buildBillTrace cần billId hợp lệ');

    var allocations = (spec.allocations || []).filter(function (a) { return a.billId === billId; });
    var byUnit = Object.create(null);
    allocations.forEach(function (a) {
      if (!byUnit[a.unitId]) byUnit[a.unitId] = { unitId: a.unitId, itemId: a.itemId, qty: 0, cost: 0, allocations: [] };
      byUnit[a.unitId].qty += a.qty;
      byUnit[a.unitId].cost += a.cost;
      byUnit[a.unitId].allocations.push(a);
    });

    return R.ok({
      billId: billId,
      units: Object.keys(byUnit).map(function (k) { return byUnit[k]; }),
      totalActualCost: allocations.reduce(function (s, a) { return s + a.cost; }, 0),
      recipeVersionIds: (spec.bill && spec.bill.recipeVersionIds) || [],
      soldByActorId: (spec.bill && spec.bill.soldByActorId) || null
    });
  }

  /**
   * TRACE_DEPENDENCY registry (FIFO-COMPACTION-CONTRACT-V1.md §6).
   * Compact/purge đọc cái này để trả lời "còn ai cần raw không" — không suy
   * đoán, không "chắc là hết".
   */
  function createDependencyRegistry() {
    var deps = [];
    return {
      register: function (d) {
        deps.push({
          sourceType: d.sourceType, sourceId: d.sourceId,
          referencedBy: d.referencedBy || [], status: 'ACTIVE'
        });
        return R.ok(true);
      },
      resolveDep: function (sourceType, sourceId) {
        var found = false;
        deps = deps.map(function (d) {
          if (d.sourceType === sourceType && d.sourceId === sourceId) {
            found = true;
            return Object.assign({}, d, { status: 'RESOLVED' });
          }
          return d;
        });
        return found ? R.ok(true) : R.err('NOT_FOUND', 'không có dependency ' + sourceType + '/' + sourceId);
      },
      activeFor: function (sourceType, sourceId) {
        return deps.filter(function (d) {
          return d.sourceType === sourceType && d.sourceId === sourceId && d.status === 'ACTIVE';
        });
      },
      /** Chỉ được purge khi KHÔNG còn entry ACTIVE nào (invariant C6). */
      canPurge: function (sourceType, sourceId) {
        var active = deps.filter(function (d) {
          return d.sourceType === sourceType && d.sourceId === sourceId && d.status === 'ACTIVE';
        });
        return active.length === 0
          ? R.ok(true)
          : R.err('PRECONDITION', 'còn ' + active.length + ' tham chiếu đang hoạt động', { active: active });
      },
      all: function () { return deps.slice(); }
    };
  }

  return {
    REQUIRED_ANSWERS: REQUIRED_ANSWERS,
    buildUnitTrace: buildUnitTrace,
    unanswered: unanswered,
    buildBillTrace: buildBillTrace,
    createDependencyRegistry: createDependencyRegistry
  };
});

/* ===== src/layers/recipe-cost-btp/btp.js ===== */
/**
 * BTP (bán thành phẩm) — mẻ nấu, yield, actual vs theoretical.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-BTP-V1.md. Bốn vấn đề, đóng cả bốn:
 *
 * 1. [B3] KHÔNG CÓ actual-vs-theoretical cho BTP. Nguyên liệu thô có
 *    (`thDoiChieu`), BTP thì không — `thDoiChieu` có 0 tham chiếu tới
 *    `prep_items`/`prep_transactions`. Master Plan §1.6 coi actual-vs-theoretical
 *    là nguyên tắc TRUNG TÂM của FIFO, nên thiếu hẳn một domain là vi phạm
 *    trực tiếp North Star. Ở đây dùng CÙNG một cơ chế cho mọi itemKind.
 *
 * 2. [B2] Sửa yield làm trôi COGS/P&L lịch sử: `prepCostOn` đọc
 *    `yieldActualAvg` HIỆN TẠI cho MỌI dateKey quá khứ — code legacy tự thú
 *    nhận trong comment mà không có cảnh báo UI. Đây là instance #4 của lớp lỗi
 *    đã xác nhận 7 lần, nên yield đi qua ĐÚNG `VersionedInput` dùng chung.
 *
 * 3. [B4] Waste BTP không nhất quán field giữa 2 đường ghi — xem
 *    `commands/prep.RecordPrepWaste`.
 *
 * 4. [B5] Báo cáo ngày BTP tính đúng nhưng không bao giờ lên màn hình — xem
 *    `reporting/btp-report`.
 */
GIEO.define('recipe-cost-btp/btp', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input'
], function (ids, R, VI) {
  'use strict';

  var BATCH_STATUS = { PLANNED: 'PLANNED', PRODUCED: 'PRODUCED', CANCELLED: 'CANCELLED' };

  /**
   * Công bố yield của một loại BTP.
   *
   * Legacy ghi `prep_items.yieldActualAvg` là giá trị "hiện tại" và sửa đè mỗi
   * lần có mẻ mới hoặc sửa yield. Ở đây mỗi lần đổi là một version có hiệu lực
   * từ thời điểm cụ thể.
   */
  function publishYield(registry, spec) {
    if (!ids.isId(spec.prepItemId, 'prepItem')) return R.err('VALIDATION', 'cần prepItemId hợp lệ');
    if (typeof spec.yieldPerBatch !== 'number' || !(spec.yieldPerBatch > 0)) {
      return R.err('VALIDATION', 'yieldPerBatch phải dương');
    }
    return registry.publish({
      kind: VI.KINDS.prepYield,
      subjectId: spec.prepItemId,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: {
        yieldPerBatch: spec.yieldPerBatch,
        sampleCount: spec.sampleCount || 1,
        source: spec.source || 'ACTUAL'
      }
    });
  }

  /** Yield có hiệu lực TẠI THỜI ĐIỂM SỰ KIỆN — không phải bản mới nhất. */
  function resolveYieldAt(registry, spec) {
    return registry.resolveAt(VI.KINDS.prepYield, spec.prepItemId, spec.storeId, spec.at);
  }

  /**
   * Ghi nhận một mẻ đã nấu xong.
   *
   * `rawCost` là tổng giá vốn THẬT của nguyên liệu đã bị FIFO trừ cho mẻ này
   * (từ `fifo-core/allocation`), nên giá vốn 1 đơn vị BTP là giá thật của chính
   * mẻ đó — không phải trung bình động như `prep_items.costPerUnit` của legacy.
   */
  function createBatch(spec) {
    if (!ids.isId(spec.prepItemId, 'prepItem')) return R.err('VALIDATION', 'cần prepItemId hợp lệ');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'cần storeId hợp lệ');
    if (typeof spec.actualYield !== 'number' || !(spec.actualYield > 0)) {
      return R.err('VALIDATION', 'actualYield phải dương');
    }
    if (typeof spec.rawCost !== 'number' || spec.rawCost < 0) {
      return R.err('VALIDATION', 'rawCost phải là số không âm — mẻ không có giá vốn thì BTP không có cost basis');
    }
    if (!spec.operationId) return R.err('VALIDATION', 'mẻ cần operationId');
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'mẻ cần actorId');

    var expected = typeof spec.expectedYield === 'number' ? spec.expectedYield : null;

    return R.ok({
      prepBatchId: spec.prepBatchId || ids.newId('prepBatch'),
      prepItemId: spec.prepItemId,
      storeId: spec.storeId,
      status: BATCH_STATUS.PRODUCED,
      /* BẤT BIẾN — sửa yield tạo bản ghi mới trong yieldEdits, không đè số này. */
      initialYield: spec.actualYield,
      actualYield: spec.actualYield,
      expectedYield: expected,
      yieldVariancePct: (expected && expected > 0)
        ? ((spec.actualYield - expected) / expected) * 100
        : null,
      yieldVersionId: spec.yieldVersionId || null,
      rawCost: spec.rawCost,
      /* Giá vốn 1 đơn vị BTP của CHÍNH mẻ này. */
      costPerUnit: spec.rawCost / spec.actualYield,
      recipeVersionId: spec.recipeVersionId || null,
      producedAt: spec.at,
      producedBy: spec.actorId,
      businessDate: spec.businessDate,
      expiresAt: spec.expiresAt || null,
      operationId: spec.operationId,
      yieldEdits: []
    });
  }

  /**
   * Sửa yield của mẻ đã nấu.
   *
   * Giữ nguyên phần legacy làm ĐÚNG: netting đúng phần đã bán, và audit trail
   * đầy đủ trong `yieldEdits[]`. Khác legacy ở chỗ giá vốn được tính lại theo
   * mẻ này chứ không đẩy sang một trung bình động làm trôi lịch sử.
   */
  function editYield(batch, spec) {
    if (batch.status !== BATCH_STATUS.PRODUCED) {
      return R.err('PRECONDITION', 'chỉ sửa yield được mẻ đã nấu xong');
    }
    if (typeof spec.newYield !== 'number' || !(spec.newYield > 0)) {
      return R.err('VALIDATION', 'yield mới phải dương');
    }
    if (!spec.reason) return R.err('VALIDATION', 'sửa yield phải có lý do');
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'sửa yield cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'sửa yield cần operationId');

    var consumed = typeof spec.consumedQty === 'number' ? spec.consumedQty : 0;
    if (spec.newYield < consumed) {
      return R.err('VALIDATION',
        'yield mới (' + spec.newYield + ') nhỏ hơn lượng đã dùng (' + consumed + ') — ' +
        'sửa như vậy làm tồn âm mà không có nguyên nhân vật lý');
    }

    return R.ok(Object.assign({}, batch, {
      actualYield: spec.newYield,
      costPerUnit: batch.rawCost / spec.newYield,
      yieldVariancePct: (batch.expectedYield && batch.expectedYield > 0)
        ? ((spec.newYield - batch.expectedYield) / batch.expectedYield) * 100
        : null,
      yieldEdits: batch.yieldEdits.concat([{
        operationId: spec.operationId,
        actorId: spec.actorId,
        at: spec.at || null,
        reason: String(spec.reason),
        before: { actualYield: batch.actualYield, costPerUnit: batch.costPerUnit },
        after: { actualYield: spec.newYield, costPerUnit: batch.rawCost / spec.newYield },
        consumedQtyAtEdit: consumed
      }])
    }));
  }

  /**
   * ACTUAL vs THEORETICAL cho BTP — mắt xích CHƯA TỪNG TỒN TẠI.
   *
   *   theoretical = Σ(mẻ đã nấu) − Σ(đã bán theo recipe) − Σ(waste đã ghi)
   *   actual      = số đếm được thật
   *   variance    = actual − theoretical
   *
   * Cùng một công thức với nguyên liệu thô. Không tách 2 đường code như legacy.
   */
  function computeTheoretical(spec) {
    var batches = spec.batches || [];
    var produced = 0;
    for (var i = 0; i < batches.length; i++) {
      if (batches[i].status !== BATCH_STATUS.PRODUCED) continue;
      if (batches[i].prepItemId !== spec.prepItemId) continue;
      produced += batches[i].actualYield;
    }

    var soldQty = spec.soldQty || 0;
    var wasteQty = spec.wasteQty || 0;

    return R.ok({
      prepItemId: spec.prepItemId,
      producedQty: produced,
      soldQty: soldQty,
      wasteQty: wasteQty,
      theoreticalRemaining: produced - soldQty - wasteQty
    });
  }

  function computeVariance(spec) {
    var t = computeTheoretical(spec);
    if (R.isErr(t)) return t;
    var theo = t.value.theoreticalRemaining;

    if (typeof spec.countedQty !== 'number') {
      /* Chưa đếm thì KHÔNG có variance — nói rõ thay vì coi lệch bằng 0. */
      return R.ok(Object.assign({}, t.value, {
        countedQty: null, variance: null, variancePct: null,
        status: 'NOT_COUNTED'
      }));
    }

    var variance = spec.countedQty - theo;
    var tol = typeof spec.tolerance === 'number' ? spec.tolerance : 0;

    return R.ok(Object.assign({}, t.value, {
      countedQty: spec.countedQty,
      variance: variance,
      variancePct: theo === 0 ? null : (variance / theo) * 100,
      status: Math.abs(variance) <= tol ? 'OK' : (variance < 0 ? 'SHORT' : 'OVER')
    }));
  }

  /**
   * Giá vốn 1 đơn vị BTP tại thời điểm sự kiện.
   *
   * Ưu tiên giá của CHÍNH mẻ đã bị trừ (`batch.costPerUnit`) — đó là giá thật.
   * Không có mẻ cụ thể thì rơi về yield version có hiệu lực tại thời điểm đó,
   * KHÔNG phải yield hiện tại. Đây là điểm sửa trực tiếp `prepCostOn` của legacy.
   */
  function prepCostAt(spec) {
    if (spec.batch) {
      return R.ok({
        costPerUnit: spec.batch.costPerUnit,
        source: 'BATCH',
        prepBatchId: spec.batch.prepBatchId,
        yieldVersionId: spec.batch.yieldVersionId
      });
    }
    var y = resolveYieldAt(spec.registry, { prepItemId: spec.prepItemId, storeId: spec.storeId, at: spec.at });
    if (R.isErr(y)) {
      return R.err('NOT_FOUND',
        'không có yield hiệu lực cho BTP tại thời điểm đó, và cũng không biết mẻ nào đã bị trừ — ' +
        'không được lấy yield hiện tại để tính lịch sử');
    }
    if (typeof spec.batchRawCost !== 'number') {
      return R.err('PRECONDITION', 'thiếu giá vốn nguyên liệu của mẻ để quy ra giá 1 đơn vị BTP');
    }
    return R.ok({
      costPerUnit: spec.batchRawCost / y.value.payload.yieldPerBatch,
      source: 'YIELD_VERSION',
      yieldVersionId: y.value.versionId
    });
  }

  return {
    BATCH_STATUS: BATCH_STATUS,
    publishYield: publishYield,
    resolveYieldAt: resolveYieldAt,
    createBatch: createBatch,
    editYield: editYield,
    computeTheoretical: computeTheoretical,
    computeVariance: computeVariance,
    prepCostAt: prepCostAt
  };
});

/* ===== src/layers/recipe-cost-btp/cogs.js ===== */
/**
 * COGS — HAI con số tách biệt + variance.
 *
 * ĐÂY LÀ GAP NGHIÊM TRỌNG NHẤT CỦA TOÀN BỘ AUDIT.
 * Nguồn: FIFO-CHAIN-TRACE-SALES-COGS-PL-V1.md §3, FIFO-CORE-ARCHITECTURE-V2.md §10b.1.
 *
 * Sự thật về hệ thống cũ: **"COGS actual" chưa từng tồn tại.** Unit/tem không
 * lưu giá vốn (`createContainersForReceipt` không có field cost nào; allocation
 * trả về cũng không có cost). Biến `cogsActual` trong `aggregateOrders()` THỰC
 * CHẤT là recipe-theoretical (định mức × giá lịch sử) bị đặt tên sai.
 *
 * Hệ quả của việc chỉ có MỘT con số: nếu công thức khai sai, hoặc nhà cung cấp
 * tăng giá đột xuất giữa 2 lần cập nhật giá, hệ thống KHÔNG CÓ CƠ CHẾ NÀO phát
 * hiện — vì không có gì để so sánh với nó.
 *
 * Ở đây:
 *   cogsTheoretical — định mức × CostBasis lịch sử tại thời điểm bán
 *   cogsActual      — tổng THẬT từ `Unit.costBasis` của các lô đã FIFO cấp phát
 *   variance        — chênh lệch, chỉ số chính của báo cáo
 *
 * Quy tắc cứng (UNIFIED-READ-LAYER-CONTRACT-V1.md §3, invariant R8): CẤM tồn
 * tại field tên `cogsActual` mà nội dung là theoretical. Chưa đủ dữ liệu Unit
 * thì trả `null` kèm lý do, KHÔNG fallback sang theoretical rồi gọi nó là actual.
 */
GIEO.define('recipe-cost-btp/cogs', [
  'shared-kernel/result',
  'recipe-cost-btp/cost'
], function (R, costLib) {
  'use strict';

  /**
   * Vế ACTUAL — cộng chi phí thật của từng lô đã bị trừ.
   *
   * `allocations` là kết quả của fifo-core/allocation, mỗi phần tử mang `cost`
   * tính từ `Unit.costBasis.unitCost` của chính lô đó. Đây là thứ legacy không
   * có, nên vế này không thể tồn tại ở hệ thống cũ.
   */
  function computeActualCost(spec) {
    var plans = spec.allocationPlans || [];
    if (plans.length === 0) {
      return R.ok({
        total: null,
        complete: false,
        reason: 'NO_ALLOCATION',
        lines: []
      });
    }

    var lines = [];
    var total = 0;
    var incomplete = [];

    for (var i = 0; i < plans.length; i++) {
      var p = plans[i];
      if (!p.costComplete) {
        /* Thiếu hàng → phần thiếu KHÔNG có lô nào gánh → không có giá thật.
           Ghi nhận thay vì lấy giá lý thuyết bù vào. */
        incomplete.push({ itemId: p.itemId, shortfallQty: p.shortfallQty });
      }
      for (var j = 0; j < p.allocations.length; j++) {
        var a = p.allocations[j];
        total += a.cost;
        lines.push({
          unitId: a.unitId,
          itemId: a.itemId,
          qty: a.qty,
          unitCost: a.unitCost,
          amount: a.cost,
          costBasisVersionId: a.costBasisVersionId
        });
      }
    }

    if (incomplete.length) {
      return R.ok({
        /* Có số nhưng KHÔNG đủ — nói rõ, không để caller tưởng đây là tổng đầy đủ.
           Phân biệt "không cấp phát được gì" với "cấp phát được một phần": hai
           tình huống này cần xử lý khác nhau ở tầng trên (chặn bán vs rà lại). */
        total: total,
        complete: false,
        reason: lines.length === 0 ? 'NO_ALLOCATION' : 'SHORTFALL',
        incomplete: incomplete,
        lines: lines
      });
    }

    return R.ok({ total: total, complete: true, reason: null, lines: lines });
  }

  /**
   * Cả hai vế + variance.
   *
   * @param spec.requirements     yêu cầu vật chất từ recipe + packaging
   * @param spec.allocationPlans  kết quả FIFO cấp phát thật
   * @param spec.registry         VersionedInput registry
   * @param spec.storeId, spec.at thời điểm SỰ KIỆN (không phải hiện tại)
   * @param spec.gapLineCount     số dòng bill KHÔNG có recipeId (N10, §2.3a —
   *                              bán tiếp được, nhưng `requirements` không hề
   *                              chứa nguyên liệu của các dòng đó, nên cả hai
   *                              vế COGS đều KHÔNG PHẢI con số đầy đủ của cả
   *                              bill dù tính ra "trọn vẹn" theo dữ liệu đang
   *                              có — phải nói rõ null+reason, không để
   *                              tưởng nhầm là đủ (cùng luật R8 dưới đây)
   */
  function computeCogs(spec) {
    var theo = costLib.computeTheoreticalCost(spec.registry, {
      requirements: spec.requirements || [],
      storeId: spec.storeId,
      at: spec.at
    });
    if (R.isErr(theo)) return theo;

    var actualR = computeActualCost({ allocationPlans: spec.allocationPlans });
    if (R.isErr(actualR)) return actualR;
    var actual = actualR.value;

    var hasRecipeGap = !!spec.gapLineCount;
    var cogsActual = (!hasRecipeGap && actual.complete) ? actual.total : null;
    var cogsTheoretical = hasRecipeGap ? null : theo.value.total;

    return R.ok({
      cogsTheoretical: cogsTheoretical,
      cogsTheoreticalPartial: hasRecipeGap ? theo.value.total : null,
      cogsTheoreticalReason: hasRecipeGap ? 'NO_RECIPE' : null,
      /* null khi chưa đủ dữ liệu — KHÔNG BAO GIỜ rơi về theoretical (R8). */
      cogsActual: cogsActual,
      cogsActualPartial: hasRecipeGap ? actual.total : (actual.complete ? null : actual.total),
      cogsActualReason: hasRecipeGap ? 'NO_RECIPE' : actual.reason,
      variance: cogsActual === null ? null : cogsActual - theo.value.total,
      variancePct: (cogsActual === null || theo.value.total === 0)
        ? null
        : ((cogsActual - theo.value.total) / theo.value.total) * 100,
      basis: {
        costBasisVersionIds: theo.value.lines
          .map(function (l) { return l.costBasisVersionId; })
          .filter(function (v, i, arr) { return v && arr.indexOf(v) === i; }),
        unitIds: actual.lines.map(function (l) { return l.unitId; })
      },
      theoreticalLines: theo.value.lines,
      actualLines: actual.lines
    });
  }

  /**
   * Diễn giải variance cho người đọc. Chênh lệch dương = tốn hơn định mức.
   *
   * Hai nguyên nhân gốc mà legacy không phân biệt được vì chỉ có 1 con số:
   *   - định mức khai sai (dùng nhiều/ít hơn công thức)
   *   - giá lô nhập lệch giá đang khai (NCC tăng giá đột xuất)
   */
  function explainVariance(cogs, tolerancePct) {
    var tol = typeof tolerancePct === 'number' ? tolerancePct : 5;
    if (cogs.cogsActual === null) {
      return {
        status: 'UNKNOWN',
        message: 'chưa đủ dữ liệu lô để tính giá vốn thật (' + cogs.cogsActualReason + ')'
      };
    }
    if (Math.abs(cogs.variancePct) <= tol) {
      return { status: 'OK', message: 'giá vốn thật khớp định mức trong ngưỡng ' + tol + '%' };
    }
    return {
      status: cogs.variance > 0 ? 'OVER' : 'UNDER',
      message: (cogs.variance > 0 ? 'tốn hơn' : 'ít hơn') + ' định mức ' +
        Math.abs(cogs.variancePct).toFixed(1) + '% — kiểm tra định mức khai sai hoặc giá nhập lệch'
    };
  }

  return {
    computeActualCost: computeActualCost,
    computeCogs: computeCogs,
    explainVariance: explainVariance
  };
});

/* ===== src/layers/recipe-cost-btp/cost.js ===== */
/**
 * CostBasis — giá vốn nguyên liệu, VERSIONED theo thời điểm.
 *
 * Instance #2 của lớp lỗi versioning: legacy `invalidateSalesCache()` xoá sạch
 * cache mỗi khi đổi giá, rồi tính lại COGS lịch sử bằng giá HIỆN TẠI.
 *
 * Phần ĐÚNG duy nhất của legacy cần giữ: `price_history_gieogieo` là append-only
 * — đúng mô hình versioning. Ở đây chỉ mở rộng nó ra toàn hệ thống qua
 * `VersionedInput` dùng chung, thay vì để nó là ngoại lệ đơn độc.
 *
 * Hai vai trò KHÁC NHAU của giá vốn, cố ý không trộn:
 *   - CostBasis (ở đây)      — giá THEO MẶT HÀNG theo thời điểm. Dùng cho
 *                              COGS THEORETICAL, và làm giá ghi lên Unit lúc nhận.
 *   - Unit.costBasis (fifo-core) — giá THEO TỪNG LÔ đã nhập. Dùng cho COGS ACTUAL.
 * Legacy chỉ có cái thứ nhất, và đặt tên biến `cogsActual` cho nó — đó là gốc
 * của gap nghiêm trọng nhất toàn bộ audit.
 */
GIEO.define('recipe-cost-btp/cost', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input'
], function (ids, R, VI) {
  'use strict';

  function publishCostBasis(registry, spec) {
    if (!spec) return R.err('VALIDATION', 'publishCostBasis cần spec');
    if (!ids.isId(spec.itemId, 'item')) return R.err('VALIDATION', 'cần itemId hợp lệ');
    if (typeof spec.unitCost !== 'number' || spec.unitCost < 0) {
      return R.err('VALIDATION', 'unitCost phải là số không âm');
    }

    return registry.publish({
      kind: VI.KINDS.cost,
      subjectId: spec.itemId,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: {
        unitCost: spec.unitCost,
        currency: spec.currency || 'VND',
        source: spec.source || 'MANUAL'
      }
    });
  }

  /** CẤM dùng giá hiện tại để tính lại lịch sử (invariant #14). */
  function resolveCostAt(registry, spec) {
    return registry.resolveAt(VI.KINDS.cost, spec.itemId, spec.storeId, spec.at);
  }

  /**
   * Giá vốn để GẮN LÊN UNIT lúc nhận hàng.
   *
   * Ưu tiên giá thực trả trên phiếu nhập; chỉ rơi về CostBasis theo thời điểm
   * khi phiếu không ghi giá. Đây là lý do `cogsActual` tồn tại được: Unit mang
   * giá của chính lô đó, không phải giá trung bình theo mặt hàng.
   */
  function costBasisForNewUnit(registry, spec) {
    if (typeof spec.paidUnitCost === 'number') {
      return R.ok({
        unitCost: spec.paidUnitCost,
        currency: spec.currency || 'VND',
        versionId: null,
        source: 'RECEIVING'
      });
    }
    var r = resolveCostAt(registry, { itemId: spec.itemId, storeId: spec.storeId, at: spec.at });
    if (R.isErr(r)) {
      return R.err('PRECONDITION',
        'không có giá vốn cho nguyên liệu tại thời điểm nhận, và phiếu nhập cũng không ghi giá — ' +
        'Unit không có costBasis thì COGS actual không tính được', { itemId: spec.itemId });
    }
    return R.ok({
      unitCost: r.value.payload.unitCost,
      currency: r.value.payload.currency,
      versionId: r.value.versionId,
      source: 'COST_BASIS'
    });
  }

  /**
   * Giá vốn LÝ THUYẾT cho một tập yêu cầu vật chất, resolve theo đúng thời điểm
   * sự kiện. Đây là vế "theoretical" của cặp actual/theoretical.
   *
   * Thiếu giá cho bất kỳ thành phần nào thì TỪ CHỐI cả cụm — không im lặng coi
   * phần thiếu là 0, vì như vậy giá vốn sẽ nhỏ đi và lãi trông đẹp lên một cách
   * giả tạo.
   */
  function computeTheoreticalCost(registry, spec) {
    var reqs = spec.requirements || [];
    var lines = [];
    var total = 0;

    for (var i = 0; i < reqs.length; i++) {
      var req = reqs[i];
      var r = resolveCostAt(registry, { itemId: req.itemId, storeId: spec.storeId, at: spec.at });
      if (R.isErr(r)) {
        return R.err('NOT_FOUND',
          'thiếu giá vốn cho "' + req.itemId + '" tại thời điểm tính — ' +
          'không được coi phần thiếu bằng 0', { itemId: req.itemId });
      }
      var unitCost = r.value.payload.unitCost;
      var amount = unitCost * req.qty;
      total += amount;
      lines.push({
        itemId: req.itemId,
        qty: req.qty,
        unitCost: unitCost,
        amount: amount,
        costBasisVersionId: r.value.versionId,
        source: req.source || null
      });
    }

    return R.ok({ total: total, lines: lines });
  }

  return {
    publishCostBasis: publishCostBasis,
    resolveCostAt: resolveCostAt,
    costBasisForNewUnit: costBasisForNewUnit,
    computeTheoreticalCost: computeTheoreticalCost
  };
});

/* ===== src/layers/recipe-cost-btp/recipe.js ===== */
/**
 * Recipe — định mức, VERSIONED theo thời điểm.
 *
 * Contract: FIFO-CORE-ARCHITECTURE-V2.md §10. Đây là vi phạm versioning RÕ NHẤT
 * của toàn bộ audit (instance #1 trong 7 instance của HANDOFF-V2 §3):
 * legacy `saveRecipe()` dùng `.set()` GHI ĐÈ, nên đổi công thức hôm nay làm
 * COGS của mọi bill trong quá khứ được tính lại theo công thức mới.
 *
 * Ở đây không có hàm nào ghi đè. Sửa công thức = publish version mới qua đúng
 * cơ chế `VersionedInput` dùng chung, đóng `effectiveTo` của bản cũ.
 *
 * Hệ quả quan trọng: cache doanh thu vẫn được phép xoá khi có version mới, NHƯNG
 * khi tính lại nó phải dùng RecipeVersion lịch sử của TỪNG NGÀY — nên kết quả
 * tính lại GIỐNG HỆT kết quả cũ. Khác hẳn legacy, nơi tính lại cho ra số khác.
 */
GIEO.define('recipe-cost-btp/recipe', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input'
], function (ids, R, VI) {
  'use strict';

  /* Thành phần định mức có thể trỏ tới nguyên liệu thô, bán thành phẩm, hoặc
     topping — giữ nguyên cấu trúc 3 loại của legacy. */
  var REF_TYPE = { item: 'item', prep: 'prep', topping: 'topping' };

  function validateComponents(rows) {
    if (!Array.isArray(rows)) return 'components phải là mảng';
    if (rows.length === 0) return 'định mức phải có ít nhất 1 thành phần';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!REF_TYPE[r.refType]) return 'component[' + i + '] refType không hợp lệ: ' + r.refType;
      if (!r.refId) return 'component[' + i + '] thiếu refId';
      if (typeof r.qty !== 'number' || !(r.qty > 0)) return 'component[' + i + '] qty phải dương';
    }
    return null;
  }

  /**
   * Công bố định mức mới. `components` khai theo size vì cùng 1 món size M và L
   * dùng lượng khác nhau — giữ đúng cấu trúc nghiệp vụ của legacy.
   */
  function publishRecipeVersion(registry, spec) {
    if (!spec) return R.err('VALIDATION', 'publishRecipeVersion cần spec');
    if (!ids.isId(spec.recipeId, 'recipe')) return R.err('VALIDATION', 'cần recipeId hợp lệ');
    if (!spec.components || typeof spec.components !== 'object') {
      return R.err('VALIDATION', 'cần components khai theo size');
    }
    var sizes = Object.keys(spec.components);
    if (sizes.length === 0) return R.err('VALIDATION', 'định mức cần ít nhất 1 size');
    for (var i = 0; i < sizes.length; i++) {
      var bad = validateComponents(spec.components[sizes[i]]);
      if (bad) return R.err('VALIDATION', 'size ' + sizes[i] + ': ' + bad);
    }

/** Archive bill: copy đủ chi tiết trước, xác nhận đích, rồi mới cho xoá nguồn. */

  'shared-kernel/ids',
  'shared-kernel/result'
], function (ids, R) {
  'use strict';

  var STATUS = {
    PENDING: 'PENDING',
    FAILED: 'FAILED',
    DESTINATION_WRITTEN: 'DESTINATION_WRITTEN',
    COMPLETED: 'COMPLETED'
  };

  function parts(dateKey) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateKey || '');
    return m ? { year: m[1], month: m[2], day: m[3] } : null;
  }
  function archiveKey(dateKey) {
    var p = parts(dateKey);
    return p ? p.month + '_' + p.day + '_' + p.year : null;
  }
  function operationIdFor(dateKey, stage) {
    return ids.deterministicId('operation', ['archive-bills', dateKey, stage]);
  }

    var rows = Object.create(null);
    (seed || []).forEach(function (r) { rows[r.businessDate] = Object.freeze(Object.assign({}, r)); });

    function put(record) {
      rows[record.businessDate] = Object.freeze(Object.assign({}, record));
      return R.ok(rows[record.businessDate]);
    }
    return {
      register: function (businessDate, at) {
        if (!parts(businessDate)) return R.err('VALIDATION', 'businessDate phải dạng YYYY-MM-DD');
        if (rows[businessDate]) return R.ok(rows[businessDate]);
        return put({
          businessDate: businessDate, archiveKey: archiveKey(businessDate),
          status: STATUS.PENDING, attempts: 0, lastError: null,
          destinationRef: null, updatedAt: at || null
        });
      },
      markFailed: function (businessDate, error, at) {
        var current = rows[businessDate];
        if (!current) return R.err('NOT_FOUND', 'ngày chưa đăng ký archive');
        return put(Object.assign({}, current, {
          status: STATUS.FAILED, attempts: current.attempts + 1,
          lastError: String(error || 'unknown'), updatedAt: at || null
        }));
      },
      markDestinationWritten: function (businessDate, destinationRef, at) {
        var current = rows[businessDate];
        if (!current) return R.err('NOT_FOUND', 'ngày chưa đăng ký archive');
        if (!destinationRef) return R.err('VALIDATION', 'cần destinationRef chứng minh đã ghi đích');
        return put(Object.assign({}, current, {
          status: STATUS.DESTINATION_WRITTEN, attempts: current.attempts + 1,
          lastError: null, destinationRef: destinationRef, updatedAt: at || null
        }));
      },
      markCompleted: function (businessDate, at) {
        var current = rows[businessDate];
        if (!current || current.status !== STATUS.DESTINATION_WRITTEN) {
          return R.err('PRECONDITION', 'chưa có bằng chứng ghi archive đích');
        }
        return put(Object.assign({}, current, { status: STATUS.COMPLETED, updatedAt: at || null }));
      },
      get: function (businessDate) { return rows[businessDate] || null; },
      pending: function () {
        return Object.keys(rows).map(function (k) { return rows[k]; })
          .filter(function (r) { return r.status !== STATUS.COMPLETED; })
          .sort(function (a, b) { return a.businessDate < b.businessDate ? -1 : 1; });
      },
      all: function () { return Object.keys(rows).map(function (k) { return rows[k]; }); }
    };
  }

  function buildWritePlan(spec) {
    spec = spec || {};
    var p = parts(spec.businessDate);
    if (!p) return R.err('VALIDATION', 'archive cần businessDate dạng YYYY-MM-DD');
    if (!spec.orders || typeof spec.orders !== 'object' || Array.isArray(spec.orders)) {
      return R.err('VALIDATION', 'archive cần object orders nguyên bản');
    }
    var key = archiveKey(spec.businessDate);
    return R.ok({
      operationId: operationIdFor(spec.businessDate, 'write'),
      domainRecords: [{
        type: 'billArchive',
        record: {
          archiveKey: key, businessDate: spec.businessDate,
          month: p.month, day: p.day, year: p.year,
          orders: spec.orders, archivedAt: spec.at || null
        }
      }],
      audit: { command: 'ArchiveBillsWrite', actorId: spec.actorId || null, reason: 'archive_before_delete' }
    });
  }

  function buildRemovalPlan(spec) {
    spec = spec || {};
    var record = spec.registry && spec.registry.get(spec.businessDate);
    if (!record || record.status !== STATUS.DESTINATION_WRITTEN || !record.destinationRef) {
      return R.err('PRECONDITION', 'chưa xác nhận ghi archive đích — cấm xoá nguồn');
    }
    if (!(spec.sourceRecords || []).length) return R.err('VALIDATION', 'cần sourceRecords cụ thể');
    return R.ok({
      operationId: operationIdFor(spec.businessDate, 'remove-source'),
      rawRemovals: spec.sourceRecords.map(function (r) { return { kind: r.kind, path: r.path }; }),
      audit: { command: 'ArchiveBillsRemoveSource', actorId: spec.actorId || null, reason: record.destinationRef }
    });
  }

  return {
    STATUS: STATUS,
    archiveKey: archiveKey,
    operationIdFor: operationIdFor,
    createRegistry: createRegistry,
    buildWritePlan: buildWritePlan,
    buildRemovalPlan: buildRemovalPlan
  };
});

        period: period,
        asOfPeriod: asOfPeriod,
        snapshotId: snap.snapshotId,
        /* Tháng cuối cùng còn CHẮC CHẮN phải giữ — chốt tháng 8 thì giữ tới hết tháng 9. */

    snapshotIdFor: snapshotIdFor,
    closeOperationId: closeOperationId,

/** Trạng thái P6: LIVE → CLOSED → SNAPSHOT_READY → COMPACTED → ARCHIVED/PURGED_RAW. */

    LIVE: 'LIVE', CLOSED: 'CLOSED', SNAPSHOT_READY: 'SNAPSHOT_READY',
    COMPACTED: 'COMPACTED', ARCHIVED: 'ARCHIVED', PURGED_RAW: 'PURGED_RAW'
  };
  var NEXT = {
    LIVE: ['CLOSED'],
    CLOSED: ['SNAPSHOT_READY'],
    SNAPSHOT_READY: ['COMPACTED'],
    COMPACTED: ['ARCHIVED', 'PURGED_RAW'],
    ARCHIVED: ['PURGED_RAW'],
    PURGED_RAW: []
  };

  function start(scopeType, scopeId) {
    if (!scopeType || !scopeId) return R.err('VALIDATION', 'lifecycle cần scopeType/scopeId');
    return R.ok({ scopeType: scopeType, scopeId: scopeId, state: STATE.LIVE, history: [] });
  }
  function transition(record, to, spec) {
    spec = spec || {};
    if (!record || !NEXT[record.state] || NEXT[record.state].indexOf(to) === -1) {
      return R.err('PRECONDITION', 'không chuyển compaction từ ' + (record && record.state) + ' sang ' + to);
    }
    if (to === STATE.SNAPSHOT_READY && !spec.snapshotId) {
      return R.err('VALIDATION', 'SNAPSHOT_READY cần snapshotId');
    }
    if (to === STATE.COMPACTED && (!spec.snapshot || spec.snapshot.verified !== true)) {
      return R.err('PRECONDITION', 'chỉ snapshot verified PASS mới được COMPACTED');
    }
    if ((to === STATE.ARCHIVED || to === STATE.PURGED_RAW) && spec.systemControlled !== true) {
      return R.err('FORBIDDEN', to + ' chỉ do system-controlled process chạy');
    }
    return R.ok(Object.assign({}, record, {
      state: to,
      snapshotId: spec.snapshotId || (spec.snapshot && spec.snapshot.snapshotId) || record.snapshotId || null,
      history: record.history.concat([{
        from: record.state, to: to, at: spec.at || null,
        operationId: spec.operationId || null
      }])
    }));
  }

  return { STATE: STATE, start: start, transition: transition };

    if ((spec.unresolvedReferences || []).length) blockers.push('còn reference chưa resolved');
    if (spec.dependencyRegistry && spec.sourceType && spec.sourceId) {
      var dep = spec.dependencyRegistry.canPurge(spec.sourceType, spec.sourceId);
      if (R.isErr(dep)) blockers.push(dep.error.message);
    } else {
      blockers.push('thiếu TRACE_DEPENDENCY registry để chứng minh an toàn');
    }

    return R.ok({ allowed: blockers.length === 0, blockers: blockers });
  }

  function buildPlan(spec) {
    var c = check(spec);
    if (R.isErr(c)) return c;
    if (!c.value.allowed) return R.err('PRECONDITION', 'không được purge: ' + c.value.blockers.join('; '), c.value);
    if (!spec.sourceType || !spec.sourceId) return R.err('VALIDATION', 'purge cần sourceType/sourceId');
    if (!(spec.rawRecords || []).length) return R.err('VALIDATION', 'purge cần rawRecords cụ thể');
    var operationId = operationIdFor(spec.sourceType, spec.sourceId, spec.snapshot.snapshotId);
    if (spec.operationId && spec.operationId !== operationId) {
      return R.err('VALIDATION', 'operationId purge không đúng id xác định');
    }
    if ((spec.rawRecords || []).some(function (r) { return /(^|\/)snapshots\//.test(r.path || ''); })) {
      return R.err('FORBIDDEN', 'purge raw không bao giờ được xoá snapshot/revision (invariant C3)');
    }
    return R.ok({
      operationId: operationId,
      sourceType: spec.sourceType,
      sourceId: spec.sourceId,
      snapshotId: spec.snapshot.snapshotId,
      rawRemovals: (spec.rawRecords || []).map(function (r) { return { kind: r.kind, path: r.path }; }),
      audit: { command: 'PurgeRaw', reason: spec.reason || 'verified_compaction', actorId: spec.actorId || null }
    });
  }

  /** §5.4: cleanup handshake ngân hàng không bao giờ chỉ dựa vào tuổi. */
  function canDeleteBankConfirmation(spec) {
    spec = spec || {};
    if (spec.systemControlled !== true) {
      return R.err('FORBIDDEN', 'cleanup bank confirmation chỉ do system-controlled process chạy');
    }
    if (!spec.bankOrderId) return R.err('VALIDATION', 'cần bankOrderId');
    if (spec.billExists === true) return R.ok({ allowed: true, reason: 'BILL_EXISTS' });
    if (spec.longExpired !== true) {
      return R.ok({ allowed: false, reason: 'NO_BILL_AND_NOT_LONG_EXPIRED' });
    }
    if (!spec.dependencyRegistry) {
      return R.err('PRECONDITION', 'thiếu dependency registry — tuổi không đủ để xoá');
    }
    var safe = spec.dependencyRegistry.canPurge('bankConfirmation', spec.bankOrderId);
    return R.isErr(safe)
      ? R.ok({ allowed: false, reason: 'ACTIVE_DEPENDENCY', detail: safe.error })
      : R.ok({ allowed: true, reason: 'LONG_EXPIRED_AND_NO_REFERENCE' });
  }

  return {
    operationIdFor: operationIdFor,
    check: check,
    buildPlan: buildPlan,
    canDeleteBankConfirmation: canDeleteBankConfirmation
  };
});

/* ===== src/layers/compaction/snapshot-verifier.js ===== */
/** RAW → rebuild → compare → PASS mới được compact (§4, invariant C5). */
GIEO.define('compaction/snapshot-verifier', [
  'shared-kernel/result',
  'fifo-core/ledger',
  'fifo-core/reconciliation',
  'fifo-core/projection',
  'compaction/unit-snapshot'
], function (R, ledgerLib, reconciliation, projection, unitSnapshot) {
  'use strict';

  function sorted(list) { return (list || []).slice().sort(); }
  function sameList(a, b) { return JSON.stringify(sorted(a)) === JSON.stringify(sorted(b)); }
  function canonical(v) {
    if (Array.isArray(v)) return v.map(canonical);
    if (v && typeof v === 'object') {
      var out = {};
      Object.keys(v).sort().forEach(function (k) { out[k] = canonical(v[k]); });
      return out;
    }
    return v;
  }
  function sameValue(a, b) { return JSON.stringify(canonical(a)) === JSON.stringify(canonical(b)); }
  function sum(list, fn) {
    return (list || []).reduce(function (total, row) { return total + (fn(row) || 0); }, 0);
  }

  function verify(input) {
    input = input || {};
    var snapshot = input.snapshot;
    var unit = input.unit;
    if (!snapshot || !unit) return R.err('VALIDATION', 'verifier cần snapshot và raw unit');
    if (snapshot.unitId !== unit.unitId) return R.err('VALIDATION', 'snapshot và raw unit khác identity');
    if (!input.projectionInput || typeof input.observedCurrentStock !== 'number') {
      return R.err('VALIDATION', 'verifier cần projectionInput và observedCurrentStock');
    }

    var gate = unitSnapshot.assessCompactability(Object.assign({}, input.compactability || {}, { unit: unit }));
    if (R.isErr(gate)) return gate;
    if (!gate.value.compactable) {
      return R.err('PRECONDITION', 'Unit chưa đủ điều kiện verify/compact', gate.value);
    }

    var entries = input.entries || [];
    var allocations = input.allocations || [];
    var cogsLines = input.cogsLines || [];
    var failures = [];
    var missing = unitSnapshot.missingFields(snapshot);
    if (missing.length) failures.push({ check: 'REQUIRED_FIELDS', missing: missing });

    var ledgerAudit = ledgerLib.auditEntries(entries);
    if (R.isErr(ledgerAudit)) failures.push({ check: 'LEDGER_INVARIANTS', detail: ledgerAudit.error });

    var rebuilt = reconciliation.rebuildUnitState(unit, entries);
    if (R.isErr(rebuilt)) return rebuilt;
    if (!rebuilt.value.matches || rebuilt.value.rebuiltRemainingQty !== snapshot.finalRemainingQty) {
      failures.push({
        check: 'REMAINING_QTY',
        expected: snapshot.finalRemainingQty,
        actual: rebuilt.value.rebuiltRemainingQty
      });
    }

    var allocationQty = sum(allocations, function (a) { return a.qty; });
    var frozenAllocationQty = sum(snapshot.consumption, function (a) { return a.qty; });
    if (allocationQty !== frozenAllocationQty) {
      failures.push({ check: 'ALLOCATION_TOTAL', expected: frozenAllocationQty, actual: allocationQty });
    }

    function ledgerTotal(type) {
      return sum(entries.filter(function (e) { return e.type === type; }),
        function (e) { return Math.abs(e.qtyDelta); });
    }
    var waste = ledgerTotal(ledgerLib.TYPE.WASTE);
    if (waste !== snapshot.wasteQty) {
      failures.push({ check: 'WASTE_TOTAL', expected: snapshot.wasteQty, actual: waste });
    }

    var cogs = sum(cogsLines, function (line) { return line.amount; });
    var frozenCogs = sum(snapshot.cogsLines, function (line) { return line.amount; });
    if (cogs !== frozenCogs) failures.push({ check: 'COGS_TOTAL', expected: frozenCogs, actual: cogs });

    var rebuiltSnapshot = unitSnapshot.buildUnitSnapshot({
      unit: unit, entries: entries, allocations: allocations, cogsLines: cogsLines,
      variance: input.variance || null, revisionNo: snapshot.revisionNo,
      supersedesSnapshotId: snapshot.supersedesSnapshotId
    });
    if (R.isErr(rebuiltSnapshot)) return rebuiltSnapshot;
    if (!sameList(snapshot.billIds, rebuiltSnapshot.value.billIds)) failures.push({ check: 'BILL_REFERENCES' });
    if (!sameList(snapshot.prepBatchIds, rebuiltSnapshot.value.prepBatchIds)) failures.push({ check: 'BTP_REFERENCES' });
    if (!sameList(snapshot.recipeVersionIds, rebuiltSnapshot.value.recipeVersionIds)) {
      failures.push({ check: 'RECIPE_VERSION_REFERENCES' });
    }
    if (!sameList(snapshot.ledgerEntryIds, rebuiltSnapshot.value.ledgerEntryIds)) {
      failures.push({ check: 'LEDGER_REFERENCES' });
    }
    if (!sameValue(snapshot.canonical, rebuiltSnapshot.value.canonical)) {
      failures.push({ check: 'CANONICAL_TRACE' });
    }

    var projected = projection.computeCurrentStock(input.projectionInput);
    if (R.isErr(projected)) return projected;
    if (projected.value.currentStock !== input.observedCurrentStock) {
      failures.push({
        check: 'CURRENT_STOCK',
        expected: input.observedCurrentStock,
        actual: projected.value.currentStock
      });
    }

    var passed = failures.length === 0;
    return R.ok({
      passed: passed,
      snapshot: Object.freeze(Object.assign({}, snapshot, {
        verified: passed,
        verifiedAt: typeof input.verifiedAt === 'number' ? input.verifiedAt : null,
        verifiedBy: input.verifiedBy || null,
        verification: Object.freeze({ failures: failures.slice() })
      })),
      failures: failures,
      alert: passed ? null : {
        type: 'SNAPSHOT_VERIFY_FAILED',
        payload: { scope: snapshot.snapshotId, failures: failures }
      }
    });
  }

  return { verify: verify };
});

/* ===== src/layers/compaction/unit-snapshot.js ===== */
/**
 * Snapshot Unit — §2 của FIFO-COMPACTION-CONTRACT-V1.md.
 * Tách cổng compactability khỏi bước dựng snapshot; tuổi không cấp quyền dọn.
 */
GIEO.define('compaction/unit-snapshot', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'fifo-core/unit',
  'fifo-core/ledger',
  'traceability/trace'
], function (ids, R, unitLib, ledgerLib, traceLib) {
  'use strict';

  var S = unitLib.STATUS;
  var TERMINAL = [S.PHYSICALLY_FINISHED, S.LOST, S.COMPACTABLE];

  function assessCompactability(input) {
    if (!input || !input.unit) return R.err('VALIDATION', 'assessCompactability cần unit');
    var u = input.unit;
    var blockers = [];

    if (!Array.isArray(input.pendingOperations) || !Array.isArray(input.approvals) ||
        !Array.isArray(input.activeDependencies)) {
      blockers.push({
        code: 'COMPACTABILITY_INPUT_INCOMPLETE',
        detail: 'phải nạp pendingOperations, approvals và activeDependencies kể cả khi rỗng'
      });
    }

    if (TERMINAL.indexOf(u.status) === -1) {
      blockers.push({ code: 'NOT_TERMINAL', detail: 'status=' + u.status });
    }
    if (u.status === S.LOST) {
      var approved = (input.approvals || []).some(function (a) {
        return a.unitId === u.unitId && a.type === 'ApproveLostContainer' && a.status === 'COMPLETED';
      });
      if (!approved) blockers.push({ code: 'LOST_NOT_APPROVED', detail: u.lostReportId || null });
    }

    var pending = (input.pendingOperations || []).filter(function (o) {
      return !o.unitIds || o.unitIds.indexOf(u.unitId) !== -1;
    });
    if (pending.length) {
      blockers.push({
        code: 'OPERATION_UNRESOLVED',
        detail: pending.map(function (o) { return o.operationId; })
      });
    }

    var unresolvedApprovals = (input.approvals || []).filter(function (a) {
      return a.unitId === u.unitId && a.status !== 'COMPLETED' && a.status !== 'REJECTED';
    });
    if (unresolvedApprovals.length) {
      blockers.push({
        code: 'APPROVAL_UNRESOLVED',
        detail: unresolvedApprovals.map(function (a) { return a.type; })
      });
    }

    var active = input.activeDependencies || [];
    if (active.length) blockers.push({ code: 'TRACE_DEPENDENCY_ACTIVE', detail: active.length });

    var debtQty = u.debt && (u.debt.amount || u.debt.qty) ? (u.debt.amount || u.debt.qty) : 0;
    var absorbed = input.debtAbsorbedBy || (u.debt && u.debt.absorbedByUnitId);
    if (debtQty > 0 && !absorbed) blockers.push({ code: 'DEBT_UNABSORBED', detail: debtQty });

    return R.ok({ unitId: u.unitId, compactable: blockers.length === 0, blockers: blockers });
  }

  function sumBy(list, fn) {
    return list.reduce(function (acc, x) { return acc + (fn(x) || 0); }, 0);
  }

  function uniq(list) {
    var seen = Object.create(null), out = [];
    list.forEach(function (x) {
      if (x === null || x === undefined || seen[x]) return;
      seen[x] = true;
      out.push(x);
    });
    return out;
  }

  function buildUnitSnapshot(input) {
    if (!input || !input.unit) return R.err('VALIDATION', 'buildUnitSnapshot cần unit');
    var u = input.unit;
    var entries = input.entries || [];
    var allocations = input.allocations || [];
    var cogsLines = input.cogsLines || [];

    var foreign = entries.filter(function (e) { return e.unitId !== u.unitId; });
    if (foreign.length) {
      return R.err('VALIDATION',
        'entries chứa ' + foreign.length + ' bút toán của unit khác — snapshot sẽ sai',
        { unitId: u.unitId });
    }

    var revisionNo = input.revisionNo || 1;
    if (revisionNo > 1 && !input.supersedesSnapshotId) {
      return R.err('VALIDATION', 'revision > 1 phải trỏ supersedesSnapshotId');
    }
    var snapshotId = ids.deterministicId('snapshot', ['unit', u.unitId, String(revisionNo)]);
    var billIds = uniq(allocations
      .filter(function (a) { return a.domain === 'sale' || a.targetType === 'bill'; })
      .map(function (a) { return a.targetRef; })
      .concat(cogsLines.map(function (c) { return c.billId; })));
    var prepBatchIds = uniq(allocations
      .filter(function (a) { return a.domain === 'prep' || a.targetType === 'prepBatch'; })
      .map(function (a) { return a.targetRef; }));
    var recipeVersionIds = uniq(cogsLines.map(function (c) { return c.recipeVersionId; }));
    var traceAllocations = allocations.map(function (a) {
      var recipeIds = a.recipeVersionIds || uniq(cogsLines.filter(function (c) {
        return c.billId && c.billId === (a.billId || (a.targetType === 'bill' ? a.targetRef : null));
      }).map(function (c) { return c.recipeVersionId; }));
      return Object.assign({}, a, {
        billId: a.billId || (a.targetType === 'bill' ? a.targetRef : null),
        prepBatchId: a.prepBatchId || (a.targetType === 'prepBatch' ? a.targetRef : null),
        recipeVersionIds: recipeIds
      });
    });
    var canonical = traceLib.buildUnitTrace({
      unit: u, ledgerEntries: entries, allocations: traceAllocations
    });
    if (R.isErr(canonical)) return canonical;

    function totalOf(type) {
      return sumBy(entries.filter(function (e) { return e.type === type; }),
        function (e) { return Math.abs(e.qtyDelta); });
    }

    return R.ok(Object.freeze({
      snapshotId: snapshotId,
      revisionNo: revisionNo,
      supersedesSnapshotId: input.supersedesSnapshotId || null,
      unitId: u.unitId, itemId: u.itemId, storeId: u.storeId, itemKind: u.itemKind,
      receiptId: u.receiptId, supplierId: u.supplierId,
      receivedAt: u.receivedAt, receivedBy: u.receivedBy,
      initialQty: u.initialQty, finalRemainingQty: u.remainingQty, costBasis: u.costBasis,
      openedAt: u.openedAt, openedBy: u.openedBy,
      consumption: allocations.map(function (a) {
        return {
          operationId: a.operationId, qty: a.qty, domain: a.domain,
          targetRef: a.targetRef, unitCost: typeof a.unitCost === 'number' ? a.unitCost : null,
          cost: typeof a.cost === 'number' ? a.cost : null
        };
      }),
      billIds: billIds,
      prepBatchIds: prepBatchIds,
      recipeVersionIds: recipeVersionIds,
      cogsLines: cogsLines.map(function (c) {
        return {
          amount: c.amount,
          costBasisVersionId: c.costBasisVersionId || null,
          recipeVersionId: c.recipeVersionId || null,
          billId: c.billId || null
        };
      }),
      wasteQty: totalOf(ledgerLib.TYPE.WASTE),
      lostQty: totalOf(ledgerLib.TYPE.LOST),
      adjustmentQty: sumBy(entries.filter(function (e) {
        return e.type === ledgerLib.TYPE.ADJUSTMENT;
      }), function (e) { return e.qtyDelta; }),
      reversalQty: totalOf(ledgerLib.TYPE.REVERSAL),
      systemExhaustedAt: u.systemExhaustedAt,
      finishedAt: u.finishedAt, finishedBy: u.finishedBy, finishReason: u.finishReason,
      needsReview: !!u.needsReview,
      needsReviewReasons: (u.needsReviewReasons || []).slice(),
      variance: input.variance || null,
      ledgerEntryIds: entries.map(function (e) { return e.entryId; }),
      canonical: canonical.value,
      builtAt: input.builtAt || null,
      builtBy: input.builtBy || null
    }));
  }

  var REQUIRED_FIELDS = [
    'unitId', 'itemId', 'storeId', 'itemKind',
    'receiptId', 'receivedAt', 'initialQty', 'costBasis',
    'openedAt', 'consumption', 'billIds', 'prepBatchIds',
    'recipeVersionIds', 'cogsLines', 'wasteQty', 'lostQty',
    'adjustmentQty', 'reversalQty', 'systemExhaustedAt',
    'finishedAt', 'needsReview', 'needsReviewReasons',
    'variance', 'revisionNo', 'canonical'
  ];

  function missingFields(snapshot) {
    if (!snapshot) return REQUIRED_FIELDS.slice();
    return REQUIRED_FIELDS.filter(function (f) {
      return !Object.prototype.hasOwnProperty.call(snapshot, f);
    });
  }

  return {
    TERMINAL_STATUSES: TERMINAL.slice(),
    REQUIRED_FIELDS: REQUIRED_FIELDS,
    assessCompactability: assessCompactability,
    buildUnitSnapshot: buildUnitSnapshot,
    missingFields: missingFields
  };
});

/**
 * VersionedInput — CƠ CHẾ VERSIONING DÙNG CHUNG.
 *
 * Contract: FIFO-COMPACTION-CONTRACT-V1.md §1 (quy tắc V1-V6).
 *
 * Vì sao dùng chung chứ không mỗi domain một kiểu: cùng 1 lớp lỗi đã xuất hiện
 * ĐỘC LẬP ở 7 domain không liên quan nhau về nghiệp vụ (GIEO-REBUILD-HANDOFF-V2.md §3)
 *   1 Recipe    — đổi công thức, COGS lịch sử tính lại theo công thức mới
 *   2 Cost      — invalidateSalesCache() xoá sạch cache khi đổi giá
 *   3 Packaging — cùng cơ chế trên
 *   4 BTP yield — sửa yield mẻ cũ, prepCostOn resolve yieldActualAvg hiện tại
 *   5 PayTerms  — snapshot lúc check-in bị ghi nhưng KHÔNG BAO GIỜ đọc lại
 *   6 KPI target— resolve tại NGÀY CUỐI kỳ rồi áp cho toàn kỳ
 *   7 Báo cáo kỳ— cả 2 cột so sánh đều tính sống, không đóng băng
 *
 * 7 lần cùng 1 lỗi = lỗ hổng kiến trúc, không phải 7 case cần 7 lần sửa riêng.
 * Sửa riêng lẻ thì domain thứ 8 lại mắc lại.
 */
GIEO.define('compaction/versioned-input', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'shared-kernel/clock'
], function (ids, R, clockLib) {
  'use strict';

  /* 7 loại gốc ở §1, cộng thêm về sau vẫn đi qua CƠ CHẾ NÀY — thêm loại mới =
     thêm vào đây, không tự chế cơ chế riêng.
     `iceCogs` (N2, NET-SALES-V1.md, chốt chủ quán 2026-09-17): lượng đá trừ
     kho mỗi ly. Ảnh hưởng COGS lịch sử y hệt Recipe/Packaging (đổi lượng đá
     hôm nay không được làm trôi COGS bill cũ) nên phải versioned, không phải
     1 số cấu hình đọc sống — xem `catalog/ice.js`. */
  var KINDS = {
    recipe: 'recipe',
    cost: 'cost',
    packaging: 'packaging',
    prepYield: 'prepYield',
    payTerms: 'payTerms',
    kpiTarget: 'kpiTarget',
    config: 'config',
    iceCogs: 'iceCogs'
  };

  function isKind(k) { return Object.prototype.hasOwnProperty.call(KINDS, k); }

  /**
   * V1 — append-only. Version đã publish thì payload BẤT BIẾN.
   * Đóng băng bằng Object.freeze để lỗi "sửa version cũ" nổ ngay ở strict mode,
   * thay vì âm thầm làm trôi mọi số liệu lịch sử đã dùng version đó.
   */
  function freezeDeep(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) {
      Object.freeze(o);
      Object.keys(o).forEach(function (k) { freezeDeep(o[k]); });
    }
    return o;
  }

  function createRegistry(opts) {
    opts = (opts || {});
    var clock = opts.clock || clockLib.createClock();
    /* key = kind|subjectId|storeId  →  mảng version sắp theo effectiveFrom tăng dần */
    var byKey = Object.create(null);

    function keyOf(kind, subjectId, storeId) {
      return kind + '|' + subjectId + '|' + storeId;
    }

    function listVersions(kind, subjectId, storeId) {
      return (byKey[keyOf(kind, subjectId, storeId)] || []).slice();
    }

    /**
     * Publish 1 version mới. KHÔNG sửa version cũ — chỉ đóng `effectiveTo` của
     * bản đang mở tại thời điểm đó (V1).
     */
    function publish(spec) {
      if (!spec) return R.err('VALIDATION', 'publish cần spec');
      if (!isKind(spec.kind)) return R.err('VALIDATION', 'kind không hợp lệ: ' + spec.kind);
      if (!spec.subjectId) return R.err('VALIDATION', 'publish cần subjectId');
      if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'publish cần storeId hợp lệ');
      if (typeof spec.effectiveFrom !== 'number') {
        return R.err('VALIDATION', 'publish cần effectiveFrom (timestamp)');
      }
      if (spec.payload === undefined || spec.payload === null) {
        return R.err('VALIDATION', 'publish cần payload');
      }
      if (!ids.isId(spec.publishedBy, 'actor')) {
        return R.err('VALIDATION', 'publish cần publishedBy — mọi thay đổi số liệu phải có người chịu trách nhiệm');
      }

      var key = keyOf(spec.kind, spec.subjectId, spec.storeId);
      var list = byKey[key] || (byKey[key] = []);

      /* Không cho chèn version có hiệu lực TRƯỚC bản mới nhất: lịch sử phải
         tiến về phía trước. Muốn sửa quá khứ thì đi đường correction (§3),
         không phải nhét lén 1 version vào giữa. */
      var last = list[list.length - 1];
      if (last && spec.effectiveFrom <= last.effectiveFrom) {
        return R.err('PRECONDITION',
          'effectiveFrom (' + spec.effectiveFrom + ') phải sau version mới nhất (' + last.effectiveFrom + '). ' +
          'Sửa hiệu lực trong quá khứ phải đi qua correction, không phải publish.');
      }

      var version = {
        kind: spec.kind,
        subjectId: String(spec.subjectId),
        storeId: spec.storeId,
        versionId: spec.versionId || ids.newId('version'),
        effectiveFrom: spec.effectiveFrom,
        effectiveTo: null,
        payload: spec.payload,
        publishedAt: spec.publishedAt || clock.now(),
        publishedBy: spec.publishedBy,
        supersedesVersionId: last ? last.versionId : null
      };

      if (last) {
        /* effectiveTo của bản cũ được đặt LÚC NÀY, không phải sửa payload.
           Đây là ranh giới hiệu lực, không phải nội dung. */
        last.effectiveTo = spec.effectiveFrom;
      }
      freezeDeep(version.payload);
      list.push(version);
      return R.ok(version);
    }

    /**
     * V2 — resolve theo point-in-time. `at` là thời điểm SỰ KIỆN nghiệp vụ
     * (occurredAt của bill/mẻ/ca), KHÔNG phải Date.now().
     */
    function resolveAt(kind, subjectId, storeId, at) {
      if (typeof at !== 'number') {
        return R.err('VALIDATION', 'resolveAt cần "at" là timestamp của sự kiện, không được bỏ trống');
      }
      var list = byKey[keyOf(kind, subjectId, storeId)] || [];
      for (var i = list.length - 1; i >= 0; i--) {
        var v = list[i];
        if (v.effectiveFrom <= at && (v.effectiveTo === null || at < v.effectiveTo)) return R.ok(v);
      }
      return R.err('NOT_FOUND',
        'không có version ' + kind + ' nào có hiệu lực cho "' + subjectId + '" tại ' + new Date(at).toISOString());
    }

    /**
     * V3 — resolve TỪNG NGÀY trong khoảng.
     *
     * Đây là hàm chặn bug instance #6/#7: có sẵn đường đúng thì không còn lý do
     * để ai đó resolve 1 lần tại ngày cuối kỳ rồi áp cho cả kỳ.
     *
     * Nếu trong 1 ngày có nhiều hơn 1 version thì KHÔNG im lặng chọn bừa —
     * đánh dấu `multipleVersionsInDay` để caller biết độ phân giải ngày không
     * đủ diễn tả thay đổi đó.
     */
    function resolveDaily(kind, subjectId, storeId, fromTs, toTs) {
      if (typeof fromTs !== 'number' || typeof toTs !== 'number') {
        return R.err('VALIDATION', 'resolveDaily cần fromTs và toTs là timestamp');
      }
      if (toTs < fromTs) return R.err('VALIDATION', 'resolveDaily: toTs < fromTs');

      var list = byKey[keyOf(kind, subjectId, storeId)] || [];
      var out = {};
      var cur = fromTs;
      var lastKey = clock.calendarDate(toTs);

      for (var guard = 0; guard < 4000; guard++) {
        var dateKey = clock.calendarDate(cur);
        var r = resolveAt(kind, subjectId, storeId, cur);
        if (R.isErr(r)) return r;

        var dayEnd = cur + 24 * 3600 * 1000;
        var overlaps = list.filter(function (v) {
          return v.effectiveFrom < dayEnd && (v.effectiveTo === null || v.effectiveTo > cur);
        }).length;

        out[dateKey] = {
          dateKey: dateKey,
          version: r.value,
          multipleVersionsInDay: overlaps > 1
        };
        if (dateKey >= lastKey) return R.ok(out);
        cur = dayEnd;
      }
      return R.err('VALIDATION', 'resolveDaily: khoảng quá dài (>4000 ngày)');
    }

    /**
     * V4 — đọc lại lịch sử bằng versionId ĐÃ LƯU trên record, không resolve lại.
     * Mọi đường đọc số liệu lịch sử phải đi qua đây, không qua resolveAt.
     */
    function getByVersionId(versionId) {
      var keys = Object.keys(byKey);
      for (var i = 0; i < keys.length; i++) {
        var list = byKey[keys[i]];
        for (var j = 0; j < list.length; j++) {
          if (list[j].versionId === versionId) return R.ok(list[j]);
        }
      }
      return R.err('NOT_FOUND', 'không có version "' + versionId + '"');
    }

    /**
     * V5 — snapshot lúc ghi KHÔNG được là write-only.
     * Trả về phần đính kèm bắt buộc cho mọi record kết quả. Record nào thiếu
     * `versionId` là record không đọc lại được — chính là bug payTerms của legacy.
     */
    function snapshotRef(version) {
      return {
        versionId: version.versionId,
        kind: version.kind,
        subjectId: version.subjectId,
        effectiveFrom: version.effectiveFrom,
        payload: version.payload
      };
    }

    /** Nạp version đã có sẵn từ kho (khi khôi phục state), bỏ qua luật thứ tự publish. */
    function hydrate(versions) {
      for (var i = 0; i < versions.length; i++) {
        var v = versions[i];
        if (!isKind(v.kind)) return R.err('VALIDATION', 'hydrate: kind không hợp lệ ' + v.kind);
        var key = keyOf(v.kind, v.subjectId, v.storeId);
        (byKey[key] || (byKey[key] = [])).push(freezeDeep(v));
      }
      Object.keys(byKey).forEach(function (k) {
        byKey[k].sort(function (a, b) { return a.effectiveFrom - b.effectiveFrom; });
      });
      return R.ok(versions.length);
    }

    return {
      publish: publish,
      resolveAt: resolveAt,
      resolveDaily: resolveDaily,
      getByVersionId: getByVersionId,
      snapshotRef: snapshotRef,
      listVersions: listVersions,
      hydrate: hydrate
    };
  }

  return {
    KINDS: KINDS,
    isKind: isKind,
    createRegistry: createRegistry
  };
});

/* ===== src/layers/catalog/ice.js ===== */
/**
 * Ice COGS — lượng đá trừ kho mỗi ly.
 *
 * Quyết định chủ quán 2026-09-17 (N2, NET-SALES-V1.md): "cửa hàng chỉ có đá
 * chung / đá riêng / không đá, không có ít/nhiều gì cả, nên cứ mặc định cái
 * nào cũng trừ 1 lượng đá theo cài đặt là được, nhưng cũng nên có chỗ bật tắt
 * theo lượng đá cogs nếu cần thiết." Nghĩa là:
 *
 *   1. KHÔNG phân biệt đá chung/đá riêng/không đá khi trừ kho — cả 3 lựa
 *      chọn trừ ĐÚNG CÙNG 1 lượng cấu hình. Lựa chọn đá vẫn được ghi trên
 *      từng dòng bill (xem `commands/sales.js buildBill`) để in tem/nhãn như
 *      legacy, nhưng đó là dữ liệu hiển thị — không rẽ nhánh COGS.
 *   2. Có "chỗ bật tắt": `enabled` nằm NGAY TRONG payload đã versioned, nên
 *      bật/tắt cũng đi qua đúng cơ chế publish — tắt hôm nay không làm trôi
 *      COGS của bill cũ (giữ đúng bất biến §10 mà Recipe/Packaging đã có).
 *
 * Versioned qua VersionedInput dùng chung (không tự chế cơ chế riêng — xem
 * `compaction/versioned-input.js`), vì đổi lượng đá/nguyên liệu đá ảnh hưởng
 * COGS lịch sử y hệt đổi công thức: instance #1/#3 của lớp lỗi đã xác nhận 7
 * lần (GIEO-REBUILD-HANDOFF-V2.md §3) nếu lỡ đọc "cấu hình hiện tại" thay vì
 * resolve tại thời điểm bán.
 *
 * `subjectId` cố định '__default__': đây là cấu hình TOÀN CỬA HÀNG, không
 * theo từng món — đúng như chủ quán mô tả (không có biến thể theo món/size).
 */
GIEO.define('catalog/ice', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input'
], function (ids, R, VI) {
  'use strict';

  var SUBJECT = '__default__';

  function publishIceCogs(registry, spec) {
    if (!spec) return R.err('VALIDATION', 'publishIceCogs cần spec');
    var enabled = !!spec.enabled;
    if (enabled) {
      if (!ids.isId(spec.itemId, 'item')) {
        return R.err('VALIDATION', 'bật trừ đá COGS thì cần itemId nguyên liệu đá hợp lệ');
      }
      if (typeof spec.qtyPerCup !== 'number' || !(spec.qtyPerCup > 0)) {
        return R.err('VALIDATION', 'bật trừ đá COGS thì cần qtyPerCup dương');
      }
    }

    return registry.publish({
      kind: VI.KINDS.iceCogs,
      subjectId: SUBJECT,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: {
        enabled: enabled,
        itemId: enabled ? spec.itemId : null,
        qtyPerCup: enabled ? spec.qtyPerCup : 0
      }
    });
  }

  /**
   * Chưa ai cấu hình thì mặc định TẮT (`isDefault: true`) — không đoán mò
   * nguyên liệu đá hay lượng đá của quán, đúng nguyên tắc "mọi thứ CÓ DEFAULT
   * nhưng không tự bịa dữ liệu nghiệp vụ" của `finance/config.js`.
   */
  function resolveIceCogsAt(registry, spec) {
    var r = registry.resolveAt(VI.KINDS.iceCogs, SUBJECT, spec.storeId, spec.at);
    if (R.isOk(r)) {
      return R.ok({
        enabled: r.value.payload.enabled,
        itemId: r.value.payload.itemId,
        qtyPerCup: r.value.payload.qtyPerCup,
        versionId: r.value.versionId,
        isDefault: false
      });
    }
    return R.ok({ enabled: false, itemId: null, qtyPerCup: 0, versionId: null, isDefault: true });
  }

  /**
   * Yêu cầu vật chất cho `cupQty` ly — ÁP DỤNG ĐỒNG NHẤT bất kể khách chọn đá
   * chung/đá riêng/không đá (chốt N2 ở trên). Trả `null` khi tắt hoặc
   * cupQty không dương, để caller biết KHÔNG có gì cần cộng vào requirements
   * thay vì phải tự suy diễn từ 1 object rỗng.
   */
  function toRequirement(resolved, cupQty) {
    if (!resolved || !resolved.enabled) return null;
    if (typeof cupQty !== 'number' || cupQty <= 0) return null;
    return { itemId: resolved.itemId, qty: resolved.qtyPerCup * cupQty, source: 'ice' };
  }

  return {
    publishIceCogs: publishIceCogs,
    resolveIceCogsAt: resolveIceCogsAt,
    toRequirement: toRequirement
  };
});
