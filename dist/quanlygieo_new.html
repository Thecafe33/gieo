/* ===== src/layers/persistence-firebase/atomic-commit.js ===== */
/**
 * Ranh giới ghi NGUYÊN TỬ cho MutationPlan.
 *
 * Contract: GIEO-SYSTEM-REBUILD-PLAN.md §2 (data flow chuẩn),
 * FIFO-CORE-ARCHITECTURE-V2.md §7 (idempotency).
 *
 * Một `MutationPlan` mang TẤT CẢ thay đổi của một operation: vật chất (Unit) +
 * ledger + projection + trace + domain record. Ghi hết hoặc không ghi gì.
 *
 * Vì sao điều này quan trọng hơn vẻ ngoài: legacy có những chỗ allocate xong
 * rồi ghi sổ hỏng mà không rollback (bug #21), và những chỗ ghi `currentStock`
 * tách rời khỏi ledger nên hai bên lệch nhau âm thầm. Cả hai biến mất nếu
 * không tồn tại đường ghi từng phần.
 *
 * Module này KHÔNG import Firebase SDK. Nó nhận một `transactionRunner` được
 * tiêm vào — adapter thật cho nó một transaction Firestore, test cho nó bản
 * in-memory. Nhờ vậy domain core không bao giờ chạm SDK (blueprint §2 quy tắc 2).
 */
GIEO.define('persistence-firebase/atomic-commit', [
  'shared-kernel/result',
  'shared-kernel/operation-state',
  'persistence-firebase/canonical-paths'
], function (R, opState, paths) {
  'use strict';

  /**
   * Dịch MutationPlan thành danh sách thao tác ghi có path cụ thể.
   * Tách riêng để kiểm được plan sinh ra đúng những path nào mà không cần ghi thật.
   */
  function planToWrites(plan, ctx) {
    var writes = [];
    var errors = [];

    function add(name, args, data, op) {
      var p = paths.path(name, ctx, args);
      if (R.isErr(p)) { errors.push(p.error.message); return; }
      writes.push({ kind: p.value.kind, path: p.value.path, op: op || 'set', data: data });
    }

    (plan.unitChanges || []).forEach(function (u) {
      add('unit', { unitId: u.unitId }, u);
      /* Live layer chỉ phản chiếu unit đang mở — hũ đã hết thì gỡ khỏi RTDB,
         đúng vai trò "hot layer" của legacy. */
      if (u.status === 'OPEN' || u.status === 'CONSUMING') {
        add('unitLive', { itemId: u.itemId, unitId: u.unitId }, {
          unitBase: u.remainingQty, status: u.status, openedAt: u.openedAt
        });
      } else {
        add('unitLive', { itemId: u.itemId, unitId: u.unitId }, null, 'remove');
      }
    });

    (plan.ledgerEntries || []).forEach(function (e) {
      add('ledger', { entryId: e.entryId || null }, e);
    });

    (plan.domainRecords || []).forEach(function (r) {
      var map = {
        bill: ['billLive', function (x) { return { businessDate: x.businessDate, billId: x.billId }; }],
        billArchive: ['billArchive', function (x) { return { archiveKey: x.archiveKey }; }],
        archiveRegistry: ['archiveRegistry', function (x) { return { businessDate: x.businessDate }; }],
        prepBatch: ['prepBatch', function (x) { return { prepBatchId: x.prepBatchId }; }],
        lostReport: ['lostReport', function (x) { return { reportId: x.lostReportId }; }],
        stockCount: ['stockCount', function (x) { return { countId: x.stockCountId }; }],
        cashSegment: ['shiftSegment', function (x) { return { businessDate: x.businessDate, seq: x.seq }; }],
        expense: ['auditLog', function (x) { return { id: x.expenseId }; }],
        unitSnapshot: ['unitSnapshot', function (x) { return { unitId: x.unitId, revisionNo: x.revisionNo }; }],
        unitSnapshotHead: ['unitSnapshotHead', function (x) { return { unitId: x.unitId }; }],
        monthlySnapshot: ['monthlySnapshot', function (x) { return { period: x.period, revisionNo: x.revisionNo }; }],
        monthlySnapshotHead: ['monthlySnapshotHead', function (x) { return { period: x.period }; }],
        /* Loại bản ghi của đường TIẾP NHẬN dữ liệu cũ. Khai ở đây vì nếu không
           khai thì `planToWrites` từ chối — và từ chối đúng là hành vi mong muốn
           cho loại chưa khai, nên cách mở là khai ra, không phải nới luật. */
        item: ['item', function (x) { return { itemId: x.itemId }; }],
        recipeVersion: ['recipeVersion', function (x) {
          return { recipeId: x.recipeId, versionId: x.versionId };
        }],
        employee: ['employee', function (x) { return { employeeId: x.employeeId }; }],
        /* Bổ sung — 7 loại này được commands/* đẩy vào plan.domainRecords từ
           trước nhưng thiếu khai path, nên commit() thật sẽ TỪ CHỐI ngay ở
           đây dù execute() vẫn trả plan hợp lệ (chỉ lộ ra khi ghi thật, không
           lộ ở test gọi execute() trực tiếp). Khai đủ để đường ghi thật không
           đứt ở persistence boundary. */
        employeeShift: ['employeeShift', function (x) { return { shiftId: x.shiftId }; }],
        receivingRecord: ['receivingRecord', function (x) { return { id: x.receivingRecordId }; }],
        purchaseOrder: ['purchaseOrder', function (x) { return { id: x.purchaseOrderId }; }],
        wasteRecord: ['wasteRecord', function (x) { return { wasteRef: x.wasteRef, itemId: x.itemId }; }],
        reconciliationRecord: ['reconciliationRecord', function (x) { return { operationId: x.operationId }; }],
        liability: ['liability', function (x) { return { liabilityId: x.liabilityId }; }],
        payrollClosing: ['payrollClosing', function (x) { return { payrollClosingId: x.payrollClosingId }; }],
        /* CP11 — commands/catalog.js. */
        menuItem: ['menuItem', function (x) { return { menuItemId: x.menuItemId }; }],
        category: ['category', function (x) { return { categoryId: x.categoryId }; }],
        promotion: ['promotion', function (x) { return { promotionId: x.promotionId }; }],
        /* L9 — commands/loyalty.js (tích/hoàn điểm gọi qua domain-events dispatch). */
        loyaltyLedgerEntry: ['loyaltyLedger', function (x) { return { entryId: x.entryId }; }],
        /* L9 — commands/alerts.js (RaiseAlert gọi qua domain-events dispatch). */
        alert: ['alert', function (x) { return { alertId: x.alertId }; }]
      };
      var m = map[r.type];
      if (!m) {
        /* Loại bản ghi chưa khai path là lỗi cấu hình, không phải chuyện bỏ qua
           được — ghi vào hư không là cách dữ liệu biến mất im lặng. */
        errors.push('domainRecord loại "' + r.type + '" chưa khai path canonical');
        return;
      }
      add(m[0], m[1](r.record), r.record);
    });

    (plan.traceChanges || []).forEach(function (t, i) {
      add('traceDependency', { id: (plan.operationId || 'op') + '.' + i }, t);
    });

    /* Purge chỉ nhận path canonical CỤ THỂ từ compaction safety gate. Chặn
       snapshot ở cả domain lẫn adapter để invariant C3 không phụ thuộc một lớp. */
    (plan.rawRemovals || []).forEach(function (r) {
      var prefix = 'orgs/' + ctx.organizationId + '/stores/' + ctx.storeId + '/';
      if (!r || (r.kind !== paths.RTDB && r.kind !== paths.FIRESTORE) ||
          typeof r.path !== 'string' || r.path.indexOf(prefix) !== 0 ||
          /(^|\/)snapshots\//.test(r.path)) {
        errors.push('rawRemoval không phải path canonical an toàn');
        return;
      }
      writes.push({ kind: r.kind, path: r.path, op: 'remove', data: null });
    });

    if (plan.audit) {
      add('auditLog', { id: plan.operationId }, plan.audit);
    }

    if (errors.length) {
      return R.err('VALIDATION', 'không dịch được plan thành path: ' + errors.join('; '), { errors: errors });
    }
    return R.ok(writes);
  }

  /**
   * @param deps.transactionRunner  (fn) => Promise — chạy fn trong 1 transaction
   * @param deps.operationStore     kho operation để claim/hoàn tất
   */
  function createCommitter(deps) {
    deps = deps || {};
    var runner = deps.transactionRunner;
    if (typeof runner !== 'function') {
      throw new Error('[atomic-commit] cần transactionRunner — module này không tự import Firebase SDK');
    }

    /**
     * Ghi cả plan trong một transaction.
     *
     * Bản ghi `operations/{operationId}` được ghi TRONG CÙNG transaction với dữ
     * liệu — nếu tách ra, sẽ có cửa sổ mà dữ liệu đã ghi nhưng operation chưa
     * đánh dấu hoàn tất, và lần chạy lại sẽ ghi đúp.
     */
    function commit(plan, ctx) {
      if (!plan || !plan.operationId) {
        return Promise.resolve(R.err('VALIDATION', 'plan thiếu operationId'));
      }
      var w = planToWrites(plan, ctx);
      if (R.isErr(w)) return Promise.resolve(w);
      var writes = w.value;

      var opPath = paths.path('operation', ctx, { operationId: plan.operationId });
      if (R.isErr(opPath)) return Promise.resolve(opPath);

      writes.push({
        kind: opPath.value.kind,
        path: opPath.value.path,
        op: 'set',
        data: {
          operationId: plan.operationId,
          status: opState.STATES.COMPLETED,
          command: plan.audit ? plan.audit.command : null,
          actorId: plan.audit ? plan.audit.actorId : null,
          storeId: ctx.storeId,
          businessDate: ctx.businessDate,
          completedAt: ctx.clock.now(),
          writeCount: writes.length
        }
      });

      return Promise.resolve()
        .then(function () { return runner(writes); })
        .then(function () {
          return R.ok({
            operationId: plan.operationId,
            writeCount: writes.length,
            paths: writes.map(function (x) { return x.path; })
          });
        })
        .catch(function (e) {
          /* Transaction hỏng = KHÔNG có gì được ghi. Không cần rollback thủ
             công, nhưng phải nói rõ là thử lại được hay cần người xử lý. */
          var retryable = !!(e && e.retryable);
          return R.err(retryable ? 'RETRYABLE' : 'MANUAL_REVIEW',
            'ghi nguyên tử thất bại, KHÔNG có thay đổi nào được ghi: ' +
            (e && e.message ? e.message : e));
        });
    }

    return { commit: commit, planToWrites: planToWrites };
  }

  /**
   * Transaction runner in-memory — cho test và cho chế độ shadow/simulate,
   * đúng giai đoạn READ-ONLY hiện tại (hệ thống cũ vẫn chạy production).
   */
  function createInMemoryRunner(opts) {
    opts = opts || {};
    var store = Object.create(null);
    var committed = [];
    var failNext = 0;

    function runner(writes) {
      if (failNext > 0) {
        failNext -= 1;
        var e = new Error(opts.failMessage || 'transaction hỏng');
        e.retryable = !!opts.failRetryable;
        throw e;
      }
      /* Áp tất cả hoặc không áp gì — dựng bản nháp rồi mới gán. */
      var draft = Object.assign(Object.create(null), store);
      writes.forEach(function (w) {
        if (w.op === 'remove') delete draft[w.path];
        else draft[w.path] = w.data;
      });
      store = draft;
      committed.push(writes);
      return true;
    }

    return {
      runner: runner,
      failOnce: function () { failNext += 1; },
      read: function (path) { return store[path]; },
      keys: function () { return Object.keys(store).sort(); },
      commitCount: function () { return committed.length; }
    };
  }

  return {
    planToWrites: planToWrites,
    createCommitter: createCommitter,
    createInMemoryRunner: createInMemoryRunner
  };
});

/* ===== src/layers/persistence-firebase/canonical-paths.js ===== */
/**
 * Path CANONICAL mới — `orgs/{orgId}/stores/{storeId}/<domain>/{id}`.
 *
 * Contract: LEGACY-FIREBASE-PATH-MAP-V1.md §2.
 *
 * Hai quyết định đã chốt và giữ:
 *   - RTDB vẫn là "live/hot layer", KHÔNG chuyển hết sang Firestore. Phân tầng
 *     này ở legacy là ĐÚNG; rebuild chỉ đổi namespace + schema, không đổi động
 *     cơ lưu trữ.
 *   - `bank_confirmations` GIỮ NGUYÊN path cũ — webhook nằm ngoài phạm vi
 *     rebuild, đổi path là phá webhook đang chạy production.
 *
 * `storeId` có mặt trong MỌI path ngay từ đầu dù hệ thống hiện tại single-store
 * (đã chốt: chừa chỗ, không xây ALL_STORES). Thêm về sau nghĩa là phải sửa mọi
 * path và dữ liệu cũ thì không có gì để điền vào.
 */
GIEO.define('persistence-firebase/canonical-paths', [
  'shared-kernel/ids',
  'shared-kernel/result'
], function (ids, R) {
  'use strict';

  var RTDB = 'RTDB';
  var FIRESTORE = 'FIRESTORE';

  function base(ctx) {
    return 'orgs/' + ctx.organizationId + '/stores/' + ctx.storeId;
  }

  /**
   * Mọi builder nhận ctx có organizationId + storeId. Không có biến thể nào bỏ
   * qua storeId, nên không tồn tại đường ghi "quên" phạm vi cửa hàng.
   */
  function validateCtx(ctx) {
    if (!ctx || !ids.isId(ctx.organizationId, 'org')) {
      return R.err('VALIDATION', 'path canonical cần organizationId hợp lệ');
    }
    if (!ids.isId(ctx.storeId, 'store')) {
      return R.err('VALIDATION', 'path canonical cần storeId hợp lệ');
    }
    return R.ok(true);
  }

  var BUILDERS = {
    /* Live layer — RTDB, phản chiếu unit đang mở cho UI POS. */
    unitLive: { kind: RTDB, build: function (ctx, a) { return base(ctx) + '/units/live/' + a.itemId + '/' + a.unitId; } },
    /* Nguồn thật của Unit. */
    unit: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/units/' + a.unitId; } },
    prepUnit: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/prepUnits/' + a.unitId; } },
    /* Ledger GỘP raw + prep, phân biệt bằng field domain. */
    ledger: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/ledger/' + a.entryId; } },
    /* Operation record dùng chung MỌI domain — tổng quát hoá từ
       reversal_unit_claims_gieogieo vốn chỉ dùng cho reversal. */
    operation: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/operations/' + a.operationId; } },
    item: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/items/' + a.itemId; } },
    prepItem: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/prepItems/' + a.prepItemId; } },
    prepBatch: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/prepBatches/' + a.prepBatchId; } },
    stockCount: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/stockCounts/' + a.countId; } },
    lostReport: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/lostReports/' + a.reportId; } },
    purchaseOrder: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/purchaseOrders/' + a.id; } },
    receivingRecord: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/receivingRecords/' + a.id; } },
    /* Bản ghi hao hụt — key ghép wasteRef+itemId, đúng cặp làm nên
       operationId của RecordWaste (commands/inventory.js). */
    wasteRecord: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/wasteRecords/' + a.wasteRef + '.' + a.itemId; } },
    /* Bản ghi đối chiếu vật lý — key theo operationId, đã xác định sẵn từ
       AdjustInventory/ApproveStockCount, không cần key riêng. */
    reconciliationRecord: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/reconciliationRecords/' + a.operationId; } },
    /* Khoản trừ trách nhiệm nhân viên khi mất container (hr/liability.js). */
    liability: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/liabilities/' + a.liabilityId; } },
    /* Chốt lương tháng (hr/payroll.js closePayroll). */
    payrollClosing: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/payrollClosings/' + a.payrollClosingId; } },

    /* Recipe CÓ tầng version — legacy ghi đè trực tiếp, đây là chỗ sửa. */

    /* CP11 — commands/catalog.js. */
    menuItem: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/menuItems/' + a.menuItemId; } },
    category: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/categories/' + a.categoryId; } },
    promotion: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/promotions/' + a.promotionId; } },
    manualCostOverride: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/manualCostOverrides/' + a.itemId; } },

    /* Bill — live ở RTDB, archive ở Firestore, giữ đúng phân tầng legacy. */
    billLive: { kind: RTDB, build: function (ctx, a) { return base(ctx) + '/bills/live/' + a.businessDate + '/' + a.billId; } },
    billArchive: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/billArchives/' + a.archiveKey; } },
    archiveRegistry: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/archiveRegistry/' + a.businessDate; } },
    billCounter: { kind: RTDB, build: function (ctx, a) { return base(ctx) + '/counters/bill/' + a.businessDate; } },

    /* Cache TÍNH-LẠI-ĐƯỢC — không lên cấp thành snapshot bất biến. */
    dailySalesCache: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/dailySalesCache/' + a.dateKey; } },
    /* Sổ vận hành ca — event record, đọc thẳng. */
    shiftDay: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/shifts/' + a.businessDate; } },
    shiftSegment: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/shifts/' + a.businessDate + '/segments/' + a.seq; } },
    /* Trạng thái tiến trình cutover. Phải NẰM TRONG kho, không nằm trong bộ nhớ
       tab: tải lại trang mà quyền ghi trở về mặc định thì mọi bảo đảm của P13
       chỉ tồn tại tới lần F5 đầu tiên. */
    cutoverState: { kind: FIRESTORE, build: function (ctx) { return base(ctx) + '/system/cutover'; } },
    employee: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/employees/' + a.employeeId; } },
    employeeShift: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/employeeShifts/' + a.shiftId; } },
    /* Compaction thật. */
    /* Firestore đòi collection/document xen kẽ, nên path tới một document LUÔN
       có số đoạn CHẴN. Bốn path dưới đây từng có số đoạn lẻ — trỏ vào một

    monthlySnapshot: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/monthlySnapshots/' + a.period + '.r' + a.revisionNo; } },
    monthlySnapshotHead: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/monthlySnapshots/' + a.period + '.head'; } },
    unitSnapshot: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/unitSnapshots/' + a.unitId + '.r' + a.revisionNo; } },
    unitSnapshotHead: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/unitSnapshots/' + a.unitId + '.head'; } },

    loyaltyLedger: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/loyaltyLedger/' + a.entryId; } },
    loyaltyEffects: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/loyaltyEffects/' + a.billId; } },
    customer: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/customers/' + a.customerId; } },
    alert: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/alerts/' + a.alertId; } },
    auditLog: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/auditLogs/' + a.id; } },
    traceDependency: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/traceDependencies/' + a.id; } }
  };

  function path(name, ctx, args) {

    var v = validateCtx(ctx);
    if (R.isErr(v)) return v;
    return R.ok({ kind: b.kind, path: b.build(ctx, args || {}) });
  }

  /**
   * Path COLLECTION chứa một builder document — bỏ đoạn cuối (id document) của

 *
 * Một điều phải nói thẳng vì nó quyết định cả thiết kế: **Firestore và RTDB

     tầng trên đang tin là có. */

   * @param spec.firestore  handle Firestore đã khởi tạo
   * @param spec.rtdb       handle RTDB đã khởi tạo

    spec = spec || {};
    var firestore = spec.firestore;
    var rtdb = spec.rtdb;
    if (!firestore || typeof firestore.batch !== 'function') {
      throw new Error('[firestore-runner] cần handle Firestore có batch()');
    }
    if (!rtdb || typeof rtdb.ref !== 'function') {
      throw new Error('[firestore-runner] cần handle RTDB có ref()');
    }

    /* Lỗi chiếu RTDB được giữ lại ở đây để tầng trên đọc — không nuốt, không
       chỉ log ra console rồi thôi. */
    var projectionFailures = [];

    function docRef(path) {
      var parts = splitPath(path);
      if (!parts) return null;
      var ref = firestore.collection(parts[0]).doc(parts[1]);
      for (var i = 2; i < parts.length; i += 2) {
        ref = ref.collection(parts[i]).doc(parts[i + 1]);
      }
      return ref;
    }

    function runner(writes) {
      var fsWrites = writes.filter(function (w) { return w.kind === paths.FIRESTORE; });
      var rtWrites = writes.filter(function (w) { return w.kind === paths.RTDB; });

          'plan có ' + fsWrites.length + ' thao tác Firestore, vượt trần ' + BATCH_LIMIT +
          ' của một batch nguyên tử — TỪ CHỐI thay vì cắt nhỏ và mất tính nguyên tử');

        if (!ref) {
          var bad = new Error('path canonical không trỏ tới document: ' + w.path);
          bad.retryable = false;

        .then(function () { return fsWrites.length ? batch.commit() : null; })
        .then(function () {

                projectionFailures.push({

        .then(function () {
          return {
            firestoreWrites: fsWrites.length,
            rtdbWrites: rtWrites.length,
            projectionFailures: projectionFailures.slice()
          };
        });
    }

    return {
      runner: runner,
      /** Lệch tầng nóng chưa chiếu được — tầng trên đọc để cảnh báo. */
      projectionFailures: function () { return projectionFailures.slice(); },
      clearProjectionFailures: function () { projectionFailures = []; }
    };
  }

            costBasisVersionIds: versionIds.filter(function (v, i, a) { return v && a.indexOf(v) === i; })
          }
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * P&L. Kỳ đã chốt → đọc thẳng snapshot, không tính lại (§3.1 compaction).
   * `frozen` trong meta cho UI biết cột nào là số đóng băng (quy tắc T3).
   */
  function getPnL(ctx, spec) {
    var g = guard(Q.GetPnL, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      snapshot: spec.closing,
      computeLive: function () {
        var rev = spec.revenue;
        var cogs = spec.cogs;
        var exp = spec.expenses;
        if (!rev || !cogs) return R.ok(null);

        var grossProfit = rev.netRevenue - (cogs.cogsActual !== null ? cogs.cogsActual : cogs.cogsTheoretical);
        return R.ok({
          netRevenue: rev.netRevenue,
          cogsTheoretical: cogs.cogsTheoretical,
          cogsActual: cogs.cogsActual,
          /* Nói rõ lãi đang tính theo vế nào — legacy chỉ có 1 số nên không cần
             nói, và cũng vì thế không ai biết nó là số gì. */
          cogsBasisUsed: cogs.cogsActual !== null ? 'ACTUAL' : 'THEORETICAL',
          grossProfit: grossProfit,
          expenses: exp ? exp.total : 0,
          fixedExpenses: exp ? exp.fixed : 0,
          variableExpenses: exp ? exp.variable : 0,
          netProfit: grossProfit - (exp ? exp.total : 0),
          /* Còn khoản ước tính thì lãi này chưa phải số cuối. */
          hasEstimatedExpenses: !!(exp && exp.estimated > 0)
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * So sánh 2 kỳ — mỗi cột mang cờ `frozen` riêng (quy tắc T3).
   * Legacy để cả 2 cột tính sống nên so sánh trôi theo thời gian.
   */
  function comparePeriods(ctx, spec) {
    var g = guard(Q.GetPnL, ctx, spec);
    if (R.isErr(g)) return g;
    if (!spec.current || !spec.previous) {
      return R.err('VALIDATION', 'so sánh kỳ cần cả 2 kỳ');
    }
    return R.ok({
      current: { data: spec.current.data, frozen: spec.current.meta.frozen },
      previous: { data: spec.previous.data, frozen: spec.previous.meta.frozen },
      /* Cả 2 cột đều sống thì so sánh này sẽ đổi theo thời gian — nói ra. */
      bothLive: !spec.current.meta.frozen && !spec.previous.meta.frozen
    });
  }

  /**
   * Trạng thái ca + két — nguồn cho màn Ca ở POS và ô "hôm nay" ở QUANLY.
   *
   * businessDate là TRẠNG THÁI VẬN HÀNH (mở/chốt ở QUANLY), không phải phép tính
   * từ đồng hồ. Query này vì thế đọc bản ghi ngày làm việc, tuyệt đối không tự
   * suy ra ngày từ `clock` — suy ra ở UI là cách hai máy hiển thị hai ngày khác
   * nhau lúc nửa đêm.
   */
  function getShiftStatus(ctx, spec) {
    var g = guard(Q.GetShiftStatus, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      computeLive: function () {
        var day = spec.businessDay || null;
        var segments = spec.segments || [];
        var employeeShifts = spec.employeeShifts || [];

        var openSegment = null;
        for (var i = 0; i < segments.length; i++) {
          if (segments[i].status === 'OPEN') { openSegment = segments[i]; break; }
        }
        var onShift = employeeShifts.filter(function (s) { return s.status === 'OPEN'; });

        return R.ok({
          businessDate: day ? day.businessDate : null,
          dayStatus: day ? day.status : null,
          /* Không có ngày mở = không được bán. Nói thẳng ra, đừng để UI tự đoán. */
          operable: !!(day && day.status === 'OPEN'),
          openSegment: openSegment ? {
            seq: openSegment.seq, openedAt: openSegment.openedAt, openedBy: openSegment.openedBy
          } : null,
          closedSegmentCount: segments.filter(function (s) { return s.status === 'CLOSED'; }).length,
          employeesOnShift: onShift.map(function (s) {
            return { shiftId: s.shiftId, employeeId: s.employeeId, checkedInAt: s.checkedInAt };
          })
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * PR2b — đọc lương tháng. `spec.closing` (nếu có) là snapshot PayrollClosing
   * ĐÃ CHỐT (hr/payroll.js#closePayroll) — đóng vai trò SNAPSHOT của
   * merge.resolve, đọc thẳng không tính lại. Không có thì đọc LIVE từ
   * `spec.liveResults` (caller tự tính bằng hr/payroll.js#computePayroll cho
   * từng nhân viên — "denormalized input" giống ClosePayroll, ở đây không
   * loop qua toàn bộ nhân viên).
   *
   * Có cả hai thì kèm luôn `drift` — số sống đã trôi khỏi số đã chốt hay
   * chưa (tương đương hr/payroll.js#detectPayrollDrift, tính lại tại chỗ vì
   * read-layer không được import hr — xem lý do ở Q.GetPayrollForMonth).
   */
  function getPayrollForMonth(ctx, spec) {
    var g = guard(Q.GetPayrollForMonth, ctx, spec);
    if (R.isErr(g)) return g;

    var result = merge.resolve({
      snapshot: spec.closing || null,
      computeLive: function () { return R.ok(spec.liveResults || []); },
      computedAt: ctx.clock.now()
    });
    if (R.isErr(result)) return result;

    if (spec.closing && spec.liveResults) {
      var byId = Object.create(null);
      spec.liveResults.forEach(function (r) { byId[r.employeeId] = r; });
      var drift = [];
      (spec.closing.lines || []).forEach(function (l) {
        var live = byId[l.employeeId];
        if (!live) {
          drift.push({ employeeId: l.employeeId, reason: 'KHÔNG CÒN DỮ LIỆU SỐNG', frozen: l.total, live: null });
          return;
        }
        if (live.total !== l.total) {
          drift.push({
            employeeId: l.employeeId, reason: 'SỐ SỐNG KHÁC SỐ ĐÃ CHỐT',
            frozen: l.total, live: live.total, difference: live.total - l.total
          });
        }
      });
      result.value.data = Object.assign({}, result.value.data, {
        drift: { monthKey: spec.closing.monthKey, clean: drift.length === 0, drift: drift }
      });
    }

    return result;
  }

  /**
   * Cảnh báo theo đối tượng xem. Dùng `alertLib.bucketize` chứ không tự sắp lại
   * thứ tự ưu tiên: hai bản xếp hạng khác nhau giữa POS và QUANLY chính là kiểu
   * lệch mà R3 cấm.
   *
   * `audience` bắt buộc — không có mặc định "xem hết", vì mặc định xem hết chính
   * là cách reporting legacy đi tới 0% phân quyền.
   */
  function getAlerts(ctx, spec) {
    var g = guard(Q.GetAlerts, ctx, spec);
    if (R.isErr(g)) return g;
    var audience = spec.audience;
    if (audience !== alertLib.AUDIENCE.POS && audience !== alertLib.AUDIENCE.QUANLY) {
      return R.err('VALIDATION', "getAlerts cần audience 'POS' hoặc 'QUANLY'");
    }

    return merge.resolve({
      computeLive: function () {
        var visible = (spec.alerts || []).filter(function (a) {
          if (a.status === alertLib.STATUS.RESOLVED) return false;
          return a.audience === audience || a.audience === alertLib.AUDIENCE.BOTH;
        });
        var buckets = alertLib.bucketize(visible, { at: ctx.clock.now() });
        return R.ok({
          audience: audience,
          buckets: buckets,
          /* Đếm theo mức nặng, KHÔNG gộp thành một số tổng: một DANGER không
             được lẫn vào đám INFO rồi biến mất trong con số "12 cảnh báo". */
          counts: {
            DANGER: buckets.DANGER.length,
            WARNING: buckets.WARNING.length,
            INFO: buckets.INFO.length
          },
          total: visible.length
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  var APPROVAL_KINDS = {
    lostReport: { command: 'ApproveLostContainer', label: 'Báo mất hũ' },
    stockCount: { command: 'ApproveStockCount', label: 'Kiểm kê' },
    expense: { command: 'ApproveExpense', label: 'Chi phí' }
  };

  /**
   * Việc chờ duyệt, gom từ 3 nguồn về một danh sách có sẵn tên command để chạy.
   *
   * Vì sao gắn sẵn `command`: legacy để mỗi màn tự biết "duyệt cái này thì gọi
   * gì", nên có chỗ duyệt xong mà không chạy hệ quả (gap Bug #12/#16). Ở đây
   * danh sách và command đi kèm nhau, không có chỗ để nối sai.
   */
  function getPendingApprovals(ctx, spec) {
    var g = guard(Q.GetPendingApprovals, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      computeLive: function () {
        var items = [];
        var unknown = [];
        (spec.pending || []).forEach(function (p) {
          var kind = APPROVAL_KINDS[p.type];
          if (!kind) {
            /* Loại chưa khai = KHÔNG dựng nút duyệt. Dựng bừa một nút gọi command
               đoán được mới là thứ nguy hiểm. */
            unknown.push(p.type);
            return;
          }
          items.push({
            type: p.type,
            label: kind.label,
            command: kind.command,
            referenceId: p.referenceId,
            requestedBy: p.requestedBy || null,
            requestedAt: p.requestedAt || null,
            summary: p.summary || null
          });
        });
        return R.ok({
          items: items,
          byType: Object.keys(APPROVAL_KINDS).reduce(function (acc, k) {
            acc[k] = items.filter(function (i) { return i.type === k; }).length;
            return acc;
          }, {}),
          unknownTypes: unknown.filter(function (v, i, a) { return a.indexOf(v) === i; })
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  return {
    QUERIES: Q,
    registerQuery: registerQuery,
    guardRead: guard,
    getUnitTrace: getUnitTrace,
    getMenu: getMenu,
    getInventoryLevel: getInventoryLevel,
    getRevenue: getRevenue,
    getCOGS: getCOGS,
    getPnL: getPnL,
    comparePeriods: comparePeriods,
    getShiftStatus: getShiftStatus,
    getAlerts: getAlerts,
    getPendingApprovals: getPendingApprovals,
    getPayrollForMonth: getPayrollForMonth
  };
});

/* ===== src/layers/read-layer/merge-canonical.js ===== */
/**
 * merge-canonical — NƠI DUY NHẤT biết cả LIVE lẫn COMPACT.
 *
 * Contract: UNIFIED-READ-LAYER-CONTRACT-V1.md §4, invariant R1/R2.
 *
 * Gate của Phase 7: không còn UI nào tự branch `if (còn raw) ... else đọc
 * archive/compact`. Cách duy nhất bảo đảm điều đó là chỉ có đúng một nơi trong
 * toàn hệ thống được phép biết có hai nguồn.
 *
 * Thứ tự resolve (§4.1):
 *   1. SNAPSHOT (đã chốt/compacted)  → đọc thẳng, KHÔNG tính lại
 *   2. CACHE (tính lại được)          → nếu còn hợp lệ
 *   3. LIVE RAW                        → tính từ ledger/unit/bill
 *   4. LEGACY                          → qua adapter, CHỈ ĐỌC
 */
GIEO.define('read-layer/merge-canonical', ['shared-kernel/result'], function (R) {
  'use strict';

  var SOURCE = { SNAPSHOT: 'SNAPSHOT', CACHE: 'CACHE', LIVE: 'LIVE', LEGACY: 'LEGACY' };

  /**
   * Bọc kết quả kèm metadata nguồn.
   *
   * `meta` để CHẨN ĐOÁN và hiển thị cờ — KHÔNG phải để UI branch logic theo
   * nguồn (R1). UI đọc `data`, và `data` giống nhau bất kể đến từ đâu.
   */
  function wrap(data, meta) {
    return R.ok({
      data: data,
      meta: {
        sources: (meta && meta.sources) || [],
        frozen: !!(meta && meta.frozen),
        versionIds: (meta && meta.versionIds) || {},
        ambiguous: (meta && meta.ambiguous) || [],
        computedAt: (meta && meta.computedAt) || null
      }
    });
  }

  /**
   * Chọn nguồn theo đúng thứ tự ưu tiên.
   *
   * @param spec.snapshot  kết quả đã đóng băng (nếu có)
   * @param spec.cache     kết quả cache còn hợp lệ (nếu có)
   * @param spec.computeLive  () => Result  — chỉ gọi khi cần
   * @param spec.legacy    () => Result     — chỉ gọi khi live không có gì
   */
  function resolve(spec) {
    if (spec.snapshot) {
      /* Đã chốt thì ĐỌC THẲNG. "Con số chủ quán đã đọc và đã dùng để ra quyết
         định thì không được đổi sau lưng." */
      var snapshotData = spec.snapshot.canonical || spec.snapshot.values || spec.snapshot;
      return wrap(snapshotData, {
        sources: [SOURCE.SNAPSHOT], frozen: true,
        versionIds: spec.snapshot.versionIds || snapshotData.versionIds || {}, computedAt: spec.computedAt
      });
    }
    if (spec.cache) {
      return wrap(spec.cache, {
        sources: [SOURCE.CACHE], frozen: false, computedAt: spec.computedAt
      });
    }

    if (typeof spec.computeLive === 'function') {
      var live = spec.computeLive();
      if (R.isErr(live)) return live;
      if (live.value !== null && live.value !== undefined) {
        var sources = [SOURCE.LIVE];
        var ambiguous = [];

        /* Dữ liệu cũ không đủ nghĩa: đánh dấu AMBIGUOUS, KHÔNG suy đoán
           (invariant #12). UI/report hiện "cần rà thủ công" thay vì im lặng
           dựng số. */
        if (typeof spec.legacy === 'function') {
          var lg = spec.legacy();
          if (R.isOk(lg) && lg.value) {
            sources.push(SOURCE.LEGACY);
            if (lg.value.ambiguous) ambiguous = ambiguous.concat(lg.value.ambiguous);
          }
        }
        return wrap(live.value, {
          sources: sources, frozen: false, ambiguous: ambiguous, computedAt: spec.computedAt
        });
      }
    }

    if (typeof spec.legacy === 'function') {
      var only = spec.legacy();
      if (R.isErr(only)) return only;
      if (only.value) {
        return wrap(only.value, {
          sources: [SOURCE.LEGACY], frozen: false,
          ambiguous: only.value.ambiguous || [], computedAt: spec.computedAt
        });
      }
    }

    return R.err('NOT_FOUND', 'không có nguồn nào trả được dữ liệu cho truy vấn này');
  }

  /**
   * Cache invalidate THEO PHẠM VI, không xoá sạch (quy tắc K3).
   *
   * Legacy `clearSalesCache()`/`invalidateSalesCache()` xoá TOÀN BỘ cache mọi
   * ngày mỗi khi đổi cấu hình ảnh hưởng giá vốn, rồi tính lại bằng version
   * HIỆN TẠI — chính là instance #2/#3 của lớp lỗi versioning.
   *
   * Ở đây chỉ những ngày bị ảnh hưởng mới bị bỏ, và khi tính lại thì dùng
   * version lịch sử của từng ngày nên kết quả GIỐNG HỆT kết quả cũ.
   */
  function invalidateScope(cacheKeys, spec) {
    var from = spec.fromDateKey;
    var to = spec.toDateKey;
    if (!from || !to) return R.err('VALIDATION', 'invalidate cần phạm vi ngày — cấm xoá sạch cache');

    var kept = [];
    var dropped = [];
    cacheKeys.forEach(function (k) {
      var d = k.dateKey;
      if (d >= from && d <= to && (!spec.storeId || k.storeId === spec.storeId)) dropped.push(k);
      else kept.push(k);
    });
    return R.ok({ kept: kept, dropped: dropped });
  }

  return {
    SOURCE: SOURCE,
    wrap: wrap,
    resolve: resolve,
    invalidateScope: invalidateScope
  };
});

/* ===== src/layers/commands/alerts.js ===== */
/**
 * Lệnh cảnh báo — bọc `alerts/alert.js#raise()` thành command thật.
 *
 * `alerts/alert.js` có logic đúng (severity/audience/required field theo
 * TỪNG loại, xem header file đó) nhưng chưa từng được command nào gọi — mọi
 * event đã sẵn trong `plan.events` (`PrepYieldMismatch`, `LostContainerReported`,
 * `StockCountPartiallyApplied`...) không có consumer nào tạo alert thật.
 * `bootstrap/domain-events.js` dịch các event đó thành input cho `RaiseAlert`
 * ở đây, cùng cổng idempotency/quyền/audit với mọi command khác — không có
 * đường ghi tắt riêng cho "alert nội bộ do hệ thống tự tạo".
 *
 * `RaiseAlert` idempotent theo (type, storeId, subjectKey) — TRÙNG với cách
 * `alert.raise()` xác định `alertId`, nên gọi lại đúng operationId là replay
 * (không ghi lại), KHÔNG đè mất trạng thái `SEEN`/`RESOLVED` mà người dùng đã
 * đặt cho alert đó qua các command khác.
 *
 * `MarkAlertSeen`/`ResolveAlert` (AL6) — bọc `alerts/alert.js#markSeen()`/
 * `#resolve()`, cùng pattern denormalized-input: caller cấp thẳng bản ghi
 * `alert` hiện tại (đọc qua `GetAlerts`), không tự tra lại. `MarkAlertSeen`
 * mở cho CẢ HAI audience (POS lẫn QUANLY đều thấy alert audience BOTH/POS
 * theo đúng loại) — "đã xem" không tắt cảnh báo, chỉ ghi nhận ai đã thấy.
 * `ResolveAlert` chỉ REVIEW_APPROVE_CORRECT: mọi loại MANUAL_WITH_REFERENCE
 * (loại duy nhất `resolve()` lib cho đóng tay) đều audience QUANLY — không
 * loại nào trong số đó cần POS đóng. `alerts/alert.js#resolve()` tự chặn
 * AUTO_VERIFIABLE (không cho đóng tay) và đòi `referenceId` — validate ở
 * đây chỉ kiểm tra input tồn tại, phần logic domain vẫn ở lib.
 */
GIEO.define('commands/alerts', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'alerts/alert'
], function (ids, R, pipeline, alertLib) {
  'use strict';

  var RaiseAlert = pipeline.defineCommand({
    name: 'RaiseAlert',
    /*
     * Alert được HỆ THỐNG tự tạo, chạy NGAY SAU command gốc qua domain-events
     * dispatch — CÙNG actor/ctx với command gốc (dispatchDomainEvents không
     * đổi actor). Command gốc có thể là ReportLostContainer (POS, EXECUTE),
     * RecordPrepProduction (POS hoặc QUANLY, EXECUTE hoặc REVIEW_APPROVE_CORRECT)
     * hay ApproveStockCount (QUANLY, REVIEW_APPROVE_CORRECT) — RaiseAlert phải
     * chấp nhận CẢ HAI, nếu không actor đã đủ quyền chạy command gốc sẽ bị
     * FORBIDDEN ngay ở bước side-effect, một lỗi khó hiểu vì input hợp lệ.
     */
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation',
        ['raisealert', input.type, input.storeId, input.subjectKey || 'store']);
    },

    validate: function (input) {
      if (!input || !input.type) return R.err('VALIDATION', 'RaiseAlert cần type');
      if (!ids.isId(input.storeId, 'store')) return R.err('VALIDATION', 'RaiseAlert cần storeId hợp lệ');
      if (!input.businessDate) return R.err('VALIDATION', 'RaiseAlert cần businessDate');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation',
        ['raisealert', input.type, input.storeId, input.subjectKey || 'store']);
      var r = alertLib.raise({
        type: input.type,
        storeId: input.storeId,
        businessDate: input.businessDate,
        subjectKey: input.subjectKey,
        data: input.data,
        at: input.at || ctx.clock.now(),
        operationId: opId
      });
      if (R.isErr(r)) return r;
      plan.domainRecords.push({ type: 'alert', record: r.value });
      return R.ok(plan);
    }
  });

  var MarkAlertSeen = pipeline.defineCommand({
    name: 'MarkAlertSeen',
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['markalertseen', input.alert && input.alert.alertId]);
    },

    validate: function (input) {
      if (!input || !input.alert || !ids.isId(input.alert.alertId, 'alert')) {
        return R.err('VALIDATION', 'MarkAlertSeen cần alert hợp lệ');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var r = alertLib.markSeen(input.alert, { actorId: ctx.actor.actorId, at: ctx.clock.now() });
      if (R.isErr(r)) return r;
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'alert', record: r.value });
      return R.ok(plan);
    }
  });

  var ResolveAlert = pipeline.defineCommand({
    name: 'ResolveAlert',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['resolvealert', input.alert && input.alert.alertId]);
    },

    validate: function (input) {
      if (!input || !input.alert || !ids.isId(input.alert.alertId, 'alert')) {
        return R.err('VALIDATION', 'ResolveAlert cần alert hợp lệ');
      }
      if (!input.referenceId) {
        return R.err('VALIDATION', 'ResolveAlert cần referenceId trỏ tới hành động đã sửa');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var r = alertLib.resolve(input.alert, {
        actorId: ctx.actor.actorId, at: ctx.clock.now(), referenceId: input.referenceId
      });
      if (R.isErr(r)) return r;
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'alert', record: r.value });
      return R.ok(plan);
    }
  });

  return { RaiseAlert: RaiseAlert, MarkAlertSeen: MarkAlertSeen, ResolveAlert: ResolveAlert };
});

/* ===== src/layers/commands/approval.js ===== */
/**
 * Lệnh duyệt.
 *
 * Nguồn: FIFO-CORE-ARCHITECTURE-V2.md §8, §10b.3, §10b.4;
 *        FIFO-CHAIN-TRACE-STOCK-COUNT-V1.md "FIX BẮT BUỘC".
 *
 * §10b.3 — IDEMPOTENCY ÁP CHO CẢ HÀNH ĐỘNG DUYỆT, không chỉ hành động tạo.
 * Legacy `ApproveStockCount` không kiểm tra status trước khi apply và không có
 * busy-guard, nên double-click hoặc 2 người duyệt cùng lúc cộng đúp variance.
 * Ở đây mọi duyệt đi qua pipeline chung nên có claim + id xác định.
 *
 * §10b.4 — `ApproveLostContainer` LÀ GAP CÓ BẰNG CHỨNG CHẮC CHẮN NHẤT TOÀN BỘ
 * AUDIT, xác nhận ĐỘC LẬP 3 LẦN từ 3 góc khác nhau:
 *   - FIFO audit: grep `approveLostReport` trong quanlygieo.html → 0 kết quả
 *   - Alerts audit: không có nút xử lý nào cho báo mất
 *   - Stock-count chain: route duyệt không tồn tại, khiến container "mất" lặp
 *     lại vô hạn mỗi kỳ kiểm kho
 * Hệ quả ở legacy: Unit KHÔNG BAO GIỜ đạt tới nhánh LOST, dù logic nhánh LOST
 * và logic khôi phục `submitFoundLostContainer` đều đã viết sẵn và đúng — chúng
 * chỉ không bao giờ chạy tới vì thiếu đúng mắt xích này.
 */
GIEO.define('commands/approval', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/unit',
  'fifo-core/reconciliation',
  'hr/liability'
], function (ids, R, pipeline, unitLib, reconciliation, liabilityLib) {
  'use strict';

  var COUNT_STATUS = {
    PENDING: 'PENDING',
    APPROVED: 'APPROVED',
    /* Legacy chỉ có `approved` và một con số `failedCount`. Chain-trace yêu cầu
       state này để biết phiếu chưa áp hết và dòng nào còn lại. */
    PARTIALLY_APPLIED: 'PARTIALLY_APPLIED',
    REJECTED: 'REJECTED'
  };

  /**
   * ApproveLostContainer — MẮT XÍCH LEGACY CHƯA TỪNG CÓ.
   *
   * ReportLostContainer (POS) → lostReport PENDING_REVIEW
   *                           → ApproveLostContainer (QUANLY, ở đây)
   *                           → Unit vào nhánh LOST
   *                           → RestoreFoundContainer chạy được khi tìm lại
   */
  var ApproveLostContainer = pipeline.defineCommand({
    name: 'ApproveLostContainer',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['approvelost', input.lostReportId]);
    },

    validate: function (input) {
      if (!input || !input.lostReportId) return R.err('VALIDATION', 'cần lostReportId');
      if (!input.decision || (input.decision !== 'APPROVE' && input.decision !== 'REJECT')) {
        return R.err('VALIDATION', "decision phải là 'APPROVE' hoặc 'REJECT'");
      }
      if (!input.reason) {
        return R.err('VALIDATION', 'duyệt/từ chối báo mất phải có lý do (§25 — approval bắt buộc có reason)');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var report = input.lostReport;
      if (!report) return R.err('NOT_FOUND', 'không tìm thấy phiếu báo mất');
      if (report.status !== 'PENDING_REVIEW') {
        /* Fail-closed: duyệt lại phiếu đã xử lý là no-op có kiểm soát, không
           phải áp lần hai (§27 invariant 8). */
        return R.err('PRECONDITION', 'phiếu báo mất đã được xử lý (' + report.status + ')');
      }

      var opId = ids.deterministicId('operation', ['approvelost', input.lostReportId]);
      var plan = pipeline.emptyPlan();

      if (input.decision === 'REJECT') {
        plan.domainRecords.push({
          type: 'lostReport',
          record: Object.assign({}, report, {
            status: 'REJECTED', reviewedBy: ctx.actor.actorId,
            reviewedAt: ctx.clock.now(), reviewReason: input.reason
          })
        });
        return R.ok(plan);
      }

      var unit = (input.units || []).filter(function (u) { return u.unitId === report.unitId; })[0];
      if (!unit) return R.err('NOT_FOUND', 'không tìm thấy lô ' + report.unitId);

      var lost = unitLib.markLost(unit, {
        at: ctx.clock.now(), actorId: ctx.actor.actorId,
        operationId: opId, lostReportId: input.lostReportId
      });
      if (R.isErr(lost)) return lost;

      plan.unitChanges.push(lost.value);
      plan.domainRecords.push({
        type: 'lostReport',
        record: Object.assign({}, report, {
          status: 'APPROVED', reviewedBy: ctx.actor.actorId,
          reviewedAt: ctx.clock.now(), reviewReason: input.reason
        })
      });
      plan.ledgerEntries.push({
        domain: 'raw', type: 'LOST', itemId: unit.itemId, storeId: ctx.storeId,
        unitId: unit.unitId, qtyDelta: -unit.remainingQty,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'lostReport', referenceId: input.lostReportId, reason: input.reason
      });

      /* Quy trách nhiệm nhân viên (quyết định chủ quán) — tạo NGAY trong plan
         này, không đi qua event: L9 chưa tồn tại và đây không phải side-effect
         tuỳ chọn. `input.employees` là input denormalized giống `input.units`;
         khớp qua actorId người báo mất (report.reportedBy). Không khớp được
         thì vẫn duyệt mất container — khoản trừ chỉ gắn cờ gap (§2.3a),
         không chặn. */
      var employee = (input.employees || []).filter(function (e) {
        return e.actorId === report.reportedBy;
      })[0];
      var liabilityR = liabilityLib.createLiability({
        employeeId: employee ? employee.employeeId : null,
        storeId: ctx.storeId,
        actorId: ctx.actor.actorId,
        operationId: opId,
        lostReportId: input.lostReportId,
        unit: unit,
        reason: input.reason,
        at: ctx.clock.now()
      });
      if (R.isErr(liabilityR)) return liabilityR;
      plan.domainRecords.push({ type: 'liability', record: liabilityR.value });

      /* Đổi tên khỏi 'ContainerFound' (bug: trùng type với sự kiện "tìm lại
         được" ngược chiều ở commands/inventory.js RestoreFoundContainer —
         một consumer L9 tương lai sẽ không phân biệt được 2 hướng nếu dùng
         chung type). Đây chỉ còn là thông báo phụ; bản ghi thật đã ở trên. */
      plan.events.push({
        type: 'ContainerLostApproved',
        unitId: unit.unitId, storeId: ctx.storeId, businessDate: ctx.businessDate,
        lostReportId: input.lostReportId, liabilityId: liabilityR.value.liabilityId
      });
      plan.projectionRecomputes.push({ itemId: unit.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  /**
   * ApproveStockCount — duyệt phiếu kiểm kê.
   *
   * Bốn yêu cầu của chain-trace:
   *  1. đi qua ĐÚNG đường điều chỉnh của FIFO Engine, không có code path ghi
   *     thẳng currentStock song song như `applyStockTransaction`
   *  2. idempotent (§10b.3)
   *  3. dòng lỗi lưu CHÍNH XÁC dòng nào, không chỉ một con số failedCount
   *  4. có state PARTIALLY_APPLIED thay vì luôn APPROVED
   */
  var ApproveStockCount = pipeline.defineCommand({
    name: 'ApproveStockCount',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['approvecount', input.stockCountId]);
    },

    validate: function (input) {
      if (!input || !input.stockCountId) return R.err('VALIDATION', 'cần stockCountId');
      if (!input.reason) return R.err('VALIDATION', 'duyệt kiểm kê phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var count = input.stockCount;
      if (!count) return R.err('NOT_FOUND', 'không tìm thấy phiếu kiểm kê');
      if (count.status !== COUNT_STATUS.PENDING && count.status !== COUNT_STATUS.PARTIALLY_APPLIED) {
        return R.err('PRECONDITION', 'phiếu kiểm kê đã duyệt (' + count.status + ')');
      }

      var opId = ids.deterministicId('operation', ['approvecount', input.stockCountId]);
      var plan = pipeline.emptyPlan();
      var applied = [];
      var failed = [];

      var unitsById = Object.create(null);
      (input.units || []).forEach(function (u) { unitsById[u.unitId] = u; });

      (count.lines || []).forEach(function (line) {
        /* Dòng đã áp ở lần duyệt trước thì bỏ qua — đây là phần làm cho việc
           duyệt lại phiếu PARTIALLY_APPLIED không cộng đúp. */
        if (line.applied) { applied.push(line.itemId); return; }

        if (line.unitId) {
          var unit = unitsById[line.unitId];
          if (!unit) {
            failed.push({ itemId: line.itemId, unitId: line.unitId, reason: 'không tìm thấy lô' });
            return;
          }
          var rc = reconciliation.physicalReconciliation(unit, {
            actualQty: line.countedQty, at: ctx.clock.now(),
            actorId: ctx.actor.actorId,
            operationId: ids.deterministicId('operation', ['approvecount', input.stockCountId, line.itemId]),
            method: 'stock_count', reason: input.reason
          });
          if (R.isErr(rc)) {
            /* Lưu CHÍNH XÁC dòng nào hỏng và vì sao — legacy chỉ có failedCount. */
            failed.push({ itemId: line.itemId, unitId: line.unitId, reason: rc.error.message });
            return;
          }
          plan.unitChanges.push(rc.value.unit);
          plan.ledgerEntries.push({
            domain: 'raw', type: 'ADJUSTMENT', itemId: line.itemId, storeId: ctx.storeId,
            unitId: line.unitId, qtyDelta: rc.value.delta,
            businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
            occurredAt: ctx.clock.now(),
            referenceType: 'stockCount', referenceId: input.stockCountId, reason: input.reason
          });
        } else {
          plan.ledgerEntries.push({
            domain: 'raw', type: 'ADJUSTMENT', itemId: line.itemId, storeId: ctx.storeId,
            unitId: null, qtyDelta: line.delta,
            businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
            occurredAt: ctx.clock.now(),
            referenceType: 'stockCount', referenceId: input.stockCountId, reason: input.reason
          });
        }
        applied.push(line.itemId);
        plan.projectionRecomputes.push({ itemId: line.itemId, storeId: ctx.storeId });
      });

      plan.domainRecords.push({
        type: 'stockCount',
        record: Object.assign({}, count, {
          /* Còn dòng lỗi thì KHÔNG phải APPROVED — nói đúng trạng thái thật. */
          status: failed.length ? COUNT_STATUS.PARTIALLY_APPLIED : COUNT_STATUS.APPROVED,
          approvedBy: ctx.actor.actorId,
          approvedAt: ctx.clock.now(),
          approveOperationId: opId,
          appliedItemIds: applied,
          failedLines: failed,
          lines: (count.lines || []).map(function (l) {
            return Object.assign({}, l, {
              applied: l.applied || applied.indexOf(l.itemId) !== -1
            });
          })
        })
      });

      if (failed.length) {
        plan.events.push({
          type: 'StockCountPartiallyApplied',
          stockCountId: input.stockCountId, storeId: ctx.storeId,
          businessDate: ctx.businessDate, failedLines: failed
        });
      }

      return R.ok(plan);
    }
  });

  var ApproveExpense = pipeline.defineCommand({
    name: 'ApproveExpense',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],
    operationId: function (input) {
      return ids.deterministicId('operation', ['approveexp', input.expenseId]);
    },
    validate: function (input) {
      if (!input || !ids.isId(input.expenseId, 'expense')) return R.err('VALIDATION', 'cần expenseId hợp lệ');
      if (!input.reason) return R.err('VALIDATION', 'duyệt chi phí phải có lý do');
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var e = input.expense;
      if (!e) return R.err('NOT_FOUND', 'không tìm thấy khoản chi');
      if (e.status !== 'PENDING_APPROVAL') {
        return R.err('PRECONDITION', 'khoản chi không ở trạng thái chờ duyệt (' + e.status + ')');
      }
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({
        type: 'expense',
        record: Object.assign({}, e, {
          status: input.decision === 'REJECT' ? 'REJECTED' : 'ACTUAL',
          approvedBy: ctx.actor.actorId, approvedAt: ctx.clock.now(), approveReason: input.reason
        })
      });
      return R.ok(plan);
    }
  });

  return {
    COUNT_STATUS: COUNT_STATUS,
    ApproveLostContainer: ApproveLostContainer,
    ApproveStockCount: ApproveStockCount,
    ApproveExpense: ApproveExpense
  };
});

/* ===== src/layers/commands/business-day.js ===== */
/**
 * Command boundary cho vòng đời ngày vận hành.
 *
 * Domain truth vẫn nằm ở store-context/business-day. File này chỉ bọc hai
 * transition qua command pipeline để quyền, idempotency, audit và atomic commit
 * giống mọi mutation khác. UI không được gọi openDay/closeDay trực tiếp.
 */
GIEO.define('commands/business-day', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'store-context/business-day',
  'commands/pipeline',
  'commands/shift'
], function (ids, R, businessDay, pipeline, shift) {
  'use strict';

  function openOperationId(input) {
    return ids.deterministicId('operation', [
      'open-business-day', input.storeId, input.dateKey
    ]);
  }

  function closeOperationId(input) {
    return ids.deterministicId('operation', [
      'close-business-day', input.day.storeId, input.day.dateKey
    ]);
  }

  var OpenBusinessDay = pipeline.defineCommand({
    name: 'OpenBusinessDay',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],
    /* Mở ngày là transition tạo gate, nên bản thân nó không thể đòi ngày mở. */
    requiresOpenDay: false,
    operationId: openOperationId,
    validate: function (input) {
      if (!input || !ids.isId(input.storeId, 'store')) {
        return R.err('VALIDATION', 'OpenBusinessDay cần storeId hợp lệ');
      }
      if (!input.dateKey) return R.err('VALIDATION', 'OpenBusinessDay cần dateKey');
      if ((input.existingDays || []).some(function (day) {
        return day.storeId === input.storeId && day.status === businessDay.STATUS.OPEN;
      })) {
        return R.err('CONFLICT', 'cửa hàng đã có ngày làm việc đang mở');
      }
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var opened = businessDay.openDay({
        storeId: input.storeId,
        dateKey: input.dateKey,
        actorId: ctx.actor.actorId,
        at: ctx.clock.now(),
        clock: ctx.clock
      });
      if (R.isErr(opened)) return opened;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'businessDay', record: opened.value });
      plan.events.push({
        type: 'BusinessDayOpened',
        businessDayId: opened.value.businessDayId,
        storeId: opened.value.storeId,
        businessDate: opened.value.dateKey,
        openedBy: opened.value.openedBy
      });
      return R.ok(plan);
    }
  });

  var CloseBusinessDay = pipeline.defineCommand({
    name: 'CloseBusinessDay',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],
    operationId: closeOperationId,
    validate: function (input) {
      if (!input || !input.day) return R.err('VALIDATION', 'CloseBusinessDay cần day');
      if (!ids.isId(input.day.storeId, 'store')) {
        return R.err('VALIDATION', 'CloseBusinessDay cần day.storeId hợp lệ');
      }
      if (input.storeId && input.storeId !== input.day.storeId) {
        return R.err('VALIDATION', 'storeId khác store của ngày cần chốt');
      }
      return R.ok(true);
    },
    execute: function (input, ctx) {
      /* Không nhận `blockers` dựng sẵn từ UI. Command luôn tự tính từ canonical
         input đã được data source hydrate, nên caller không thể gửi [] để lách. */
      var blockers = shift.closeDayBlockers({
        segments: input.segments || [],
        openEmployeeShifts: input.openEmployeeShifts || [],
        pendingChecklists: input.pendingChecklists || []
      });
      var operationId = closeOperationId(input);
      var closed = businessDay.closeDay(input.day, {
        actorId: ctx.actor.actorId,
        operationId: operationId,
        at: ctx.clock.now(),
        blockers: blockers
      });
      if (R.isErr(closed)) return closed;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'businessDay', record: closed.value });
      plan.events.push({
        type: 'BusinessDayClosed',
        businessDayId: closed.value.businessDayId,
        storeId: closed.value.storeId,
        businessDate: closed.value.dateKey,
        closedBy: closed.value.closedBy
      });
      return R.ok(plan);
    }
  });

  return {
    OpenBusinessDay: OpenBusinessDay,
    CloseBusinessDay: CloseBusinessDay
  };
});

/**
 * Lệnh ghi Catalog (Menu/Category/Promotion) — CP11.
 *
 * Chuỗi thật: `NET-CATALOG-PROMOTION-V1.md` CP11 (⚪ CHƯA THỂ XÁC NHẬN — tầng
 * command chưa tồn tại). Header của `catalog/menu.js` đã ghi rõ Ý ĐỊNH:
 * "QUANLY là nơi DUY NHẤT sửa menu (POS chỉ đọc)... Enforce ở tầng command
 * qua sources:['QUANLY'], không phải ở đây" — nhưng chưa có command nào wrap
 * `catalog/menu.js`/`catalog/promotion.js` để enforce ý định đó. Domain logic
 * (createMenuItem/rename/archive/linkRecipe/createCategory/createPromotion)
 * đã đúng và có test riêng (`tests/unit/catalog.test.js`); module này chỉ
 * đóng phần THIẾU — cùng hình dạng gap như RM1 (Receiving) trước khi có
 * `commands/receiving.js`.
 *
 * `catalog/packaging.js` (publishPackaging) CỐ Ý không nằm trong module này:
 * nó ghi qua `compaction/versioned-input` registry, một cơ chế ghi khác hẳn
 * (append-only version theo effectiveFrom, không phải sửa 1 bản ghi tại chỗ)
 * mà CHƯA có domain nào trong `commands/` từng wrap thành pipeline command —
 * đây là gap RIÊNG cắt ngang cả 7 loại VersionedInput (recipe/cost/packaging/
 * prepYield/payTerms/kpiTarget/config), không phải chuyện chỉ của catalog.
 * Gộp vào đây sẽ lẫn 2 quyết định kiến trúc khác nhau vào 1 PR.
 *
 * Quyền: `MASTER_CONFIGURE` — sửa menu/khuyến mãi là cấu hình dữ liệu gốc,
 * không phải duyệt/sửa một giao dịch đã phát sinh (khác `REVIEW_APPROVE_CORRECT`
 * mà RM3/SC3 dùng). Chỉ `QUANLY_ADMIN`/`SYSTEM_ADMIN` có quyền này
 * (`store-context/access.js` ROLES).
 *
 * Idempotency: `menuItemId`/`categoryId`/`promotionId` do CALLER cấp trước
 * (UI sinh 1 lần lúc mở form, không phải command tự sinh ngẫu nhiên) nên
 * double-tap submit cùng id là no-op — cùng nguyên tắc `receiptRef`/`countRef`
 * đã dùng ở RM1/SC2, áp dụng cho việc TẠO entity thay vì một giao dịch có ref
 * nghiệp vụ sẵn. Lệnh SỬA (rename/linkRecipe/archive/restore) cần thêm
 * `editRef` tường minh — không thể suy idempotency chỉ từ menuItemId vì 2 lần
 * sửa THẬT khác nhau trên cùng 1 món phải là 2 operationId khác nhau, không
 * phải "cùng input nên coi là 1 request được gửi lại" như CorrectReceivingCost.
 */
GIEO.define('commands/catalog', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'catalog/menu',
  'catalog/promotion'
], function (ids, R, pipeline, menu, promotion) {

  }

  var CreateCategory = pipeline.defineCommand({

      });

  var CreateMenuItem = pipeline.defineCommand({
    name: 'CreateMenuItem',
    authority: 'MASTER_CONFIGURE',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['createmenuitem', input.menuItemId]);
