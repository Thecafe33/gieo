    if (c.cogsActual === null) {
      /* Không có vế actual thì KHÔNG có variance — nói thẳng, không lấy
         theoretical so với chính nó rồi báo "khớp". */
      status = STATUS.UNKNOWN;
      message = 'chưa đủ dữ liệu lô để tính giá vốn thật' +
        (c.missingActual && c.missingActual.length ? ' (' + c.missingActual.length + ' bill thiếu)' : '');
    } else if (Math.abs(c.variancePct) <= tol) {
      status = STATUS.OK;
      message = 'giá vốn thật khớp định mức trong ngưỡng ' + tol + '%';
    } else {
      status = c.variance > 0 ? STATUS.OVER : STATUS.UNDER;
      message = (c.variance > 0 ? 'tốn hơn' : 'ít hơn') + ' định mức ' +
        Math.abs(c.variancePct).toFixed(1) + '%';
    }

    var netRevenue = spec.revenue ? spec.revenue.netRevenue : null;
    function pct(v) {
      return (v === null || !netRevenue) ? null : (v / netRevenue) * 100;
    }

    var actualPct = pct(c.cogsActual);
    var overTarget = (typeof spec.targetPct === 'number' && actualPct !== null)
      ? actualPct > spec.targetPct
      : null;

    return R.ok({
      cogsTheoretical: c.cogsTheoretical,
      cogsActual: c.cogsActual,
      variance: c.variance,
      variancePct: c.variancePct,
      status: status,
      message: message,
      /* Hai nguyên nhân gốc mà legacy không phân biệt được vì chỉ có 1 số. */
      possibleCauses: status === STATUS.OVER || status === STATUS.UNDER
        ? ['định mức khai sai (dùng nhiều/ít hơn công thức)', 'giá lô nhập lệch giá đang khai']
        : [],
      cogsPctTheoretical: pct(c.cogsTheoretical),
      cogsPctActual: actualPct,
      targetPct: typeof spec.targetPct === 'number' ? spec.targetPct : null,
      overTarget: overTarget,
      missingActual: c.missingActual || []
    });
  }

  /**
   * Vượt ngưỡng thì sinh cảnh báo CHỦ ĐỘNG.
   *
   * Gap §6 chain-trace Sales: `cogsPct` legacy có so sánh thật nhưng chỉ hiện
   * khi người TỰ mở tab Sức khoẻ — không ghi vào alerts, không chặn gì. Ở đây
   * nó phát ra để alerts domain nhận.
   */
  function toAlerts(report, spec) {
    if (!report.overTarget) return [];
    return [{
      type: 'COGS_OVER_TARGET',
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      subjectKey: 'cogs.' + spec.businessDate,
      data: {
        cogsPct: report.cogsPctActual,
        target: report.targetPct,
        dateKey: spec.businessDate
      }
    }];
  }

  return { STATUS: STATUS, build: build, toAlerts: toAlerts };
});

/* ===== src/layers/bootstrap/canonical-data-source.js ===== */
/**
 * Hydrate `deps.units`/`deps.versionRegistry` cho command TRƯỚC khi tới pipeline.
 *
 * Đây LÀ mảnh còn thiếu mà `bootstrap/legacy-data-source.js#forCommand` cố ý
 * không làm (đọc comment ở đó — pass-through vĩnh viễn, "command đã phải mang
 * canonical input từ controller/read-layer"). `commands/sales.js RecordSale`,
 * `commands/inventory.js RecordWaste/ReportLostContainer/RestoreFoundContainer`,
 * `commands/prep.js`, `commands/receiving.js` đều đợi `deps.units`/
 * `deps.versionRegistry` do CALLER mang tới — không có gì tự động cấp trước
 * module này. Phạm vi bản đầu: CHỈ `RecordSale` (quyết định chủ quán
 * 2026-09-17 — checkout là gap chặn bán, các command còn lại để đợt sau).
 *
 * Thuật toán 2 pha, vì registry cần biết Recipe/Packaging/Ice TRƯỚC mới suy ra
 * được itemId nguyên liệu cần giá (`recipe-cost-btp/cost.js` KINDS.cost) —
 * đúng đúng thứ tự `commands/sales.js#buildRequirements` đã làm với registry
 * cho sẵn, ở đây chỉ là tự đọc registry đó từ Firestore thay vì test tự dựng:
 *
 *   Pha 1 — đọc version recipe (mỗi dòng)/packaging (mỗi dòng + fallback
 *           '__default__')/iceCogs ('__default__' toàn quán), dựng registry
 *           TẠM, gọi `buildRequirements` THẬT (hàm thuần, không side-effect)
 *           để biết requirements (itemId nguyên liệu).
 *   Pha 2 — đọc version cost của đúng những itemId đó + đọc Unit đang có của
 *           đúng những itemId đó, nạp thêm vào CÙNG registry.
 *
 * `buildRequirements` được gọi ở đây CHỈ để suy itemId — `RecordSale.execute`
 * vẫn gọi lại nó (hàm thuần, gọi 2 lần cho kết quả giống hệt, không tốn gì
 * ngoài 1 lượt tính lại rẻ).
 *
 * Không có version/Unit nào cho một itemId thì mảng rỗng, KHÔNG lỗi — đúng
 * §2.3a: thiếu dữ liệu suy biến thành gap-flag qua đường đã có sẵn trong
 * `buildRequirements`/`computeCogs` (gapLines/NO_RECIPE, cogsActual=null),
 * không phải lý do chặn RecordSale ở đây.
 */
GIEO.define('bootstrap/canonical-data-source', [
  'shared-kernel/result',
  'commands/sales'
], function (R, salesLib) {
  'use strict';

  function uniq(list) {
    var seen = Object.create(null);
    return list.filter(function (x) {
      var k = JSON.stringify(x);
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    });
  }

  function create(reader, defaults) {
    defaults = defaults || {};
    if (!reader) throw new Error('[canonical-data-source] cần canonical reader');

    function loadVersionsFor(ctx, pairs) {
      return Promise.all(pairs.map(function (p) { return reader.loadVersions(ctx, p.kind, p.subjectId); }))
        .then(function (results) {
          var all = [];
          for (var i = 0; i < results.length; i++) {
            if (R.isErr(results[i])) return results[i];
            all = all.concat(results[i].value);
          }
          return R.ok(all);
        });
    }

    function loadUnitsFor(ctx, itemIds) {
      return Promise.all(itemIds.map(function (id) { return reader.loadUnitsForItem(ctx, id); }))
        .then(function (results) {
          var all = [];
          for (var i = 0; i < results.length; i++) {
            if (R.isErr(results[i])) return results[i];
            all = all.concat(results[i].value);
          }
          return R.ok(all);
        });
    }

    function hydrateForRecordSale(input) {
      var bill = input.bill;
      var ctx = { organizationId: defaults.organizationId, storeId: bill.storeId };

      var phase1Pairs = uniq([].concat(
        bill.lines.filter(function (l) { return !!l.recipeId; })
          .map(function (l) { return { kind: 'recipe', subjectId: l.recipeId }; }),
        bill.lines.map(function (l) { return { kind: 'packaging', subjectId: l.menuItemId }; }),
        [{ kind: 'packaging', subjectId: '__default__' }, { kind: 'iceCogs', subjectId: '__default__' }]
      ));

      var registry = salesLib.createVersionRegistry();

      return loadVersionsFor(ctx, phase1Pairs).then(function (v1) {
        if (R.isErr(v1)) return v1;
        var h1 = registry.hydrate(v1.value);
        if (R.isErr(h1)) return h1;

        var reqR = salesLib.buildRequirements(bill, { versionRegistry: registry });
        if (R.isErr(reqR)) return reqR;
        var itemIds = uniq(reqR.value.requirements.map(function (r) { return r.itemId; }));

        return Promise.all([
          loadVersionsFor(ctx, itemIds.map(function (id) { return { kind: 'cost', subjectId: id }; })),
          loadUnitsFor(ctx, itemIds)
        ]).then(function (rows) {
          if (R.isErr(rows[0])) return rows[0];
          if (R.isErr(rows[1])) return rows[1];
          var h2 = registry.hydrate(rows[0].value);
          if (R.isErr(h2)) return h2;

          var mergedDeps = Object.assign(
            { units: rows[1].value, versionRegistry: registry },
            input.deps || {}
          );
          return R.ok(Object.assign({}, input, { deps: mergedDeps }));
        });
      });
    }

    function forCommand(name, input) {
      input = input || {};
      /* Không phải RecordSale, hoặc bill chưa dựng (không phải việc của module
         này — `RecordSale.validate` sẽ báo lỗi đúng chỗ): đi thẳng, không thêm
         gì — cùng nguyên tắc pass-through của `legacy-data-source.js`. */
      if (name !== 'RecordSale' || !input.bill || !input.bill.lines) {
        return Promise.resolve(R.ok(input));
      }
      return hydrateForRecordSale(input);
    }

    return { forCommand: forCommand };
  }

  return { create: create };
});

/* ===== src/layers/bootstrap/cutover.js ===== */
/**
 * P13 — PRODUCTION CUTOVER (GIEO-SYSTEM-REBUILD-PLAN.md §17).
 *
 * Trình tự bắt buộc:
 *
 *     OLD WRITER STOP → FINAL RECONCILIATION → NEW SYSTEM SOLE WRITER
 *                     → OLD SYSTEM RETAINED → ROLLBACK WINDOW
 *
 * Ba luật của §17 và cách chúng được cài vào cấu trúc chứ không nằm ở lời dặn:
 *
 *   "Không dual writer production" — trạng thái ghi được biểu diễn bằng MỘT
 *   trường `writer` nhận đúng một giá trị ('OLD' | 'NONE' | 'NEW'). Không có
 *   cách nào viết ra một trạng thái mà cả hai cùng ghi, nên không có gì để
 *   quên kiểm tra.
 *
 *   "Không partial migration" — không có bước nào chuyển một phần domain. Bước
 *   duy nhất đổi writer là `newSoleWriter`, và nó đổi toàn bộ.
 *
 *   "Cutover chỉ một lần" — `newSoleWriter` chạy lần thứ hai bị từ chối. Quay
 *   lui là đường RIÊNG (`rollback`) chỉ mở trong cửa sổ đã khai, và sau khi quay
 *   lui thì phải làm lại từ đầu, không "tiếp tục cutover dở".
 *
 * Module này KHÔNG tự ghi gì. Nó chỉ trả lời "được phép chuyển bước chưa" và
 * ghi lại ai chuyển, lúc nào, dựa trên bằng chứng nào.
 */
GIEO.define('bootstrap/cutover', [
  'shared-kernel/result'
], function (R) {
  'use strict';

  /* Ai đang được ghi. Đúng một giá trị tại một thời điểm. */
  var WRITER = { OLD: 'OLD', NONE: 'NONE', NEW: 'NEW' };

  var STEP = {
    NOT_STARTED: 'NOT_STARTED',
    OLD_WRITER_STOPPED: 'OLD_WRITER_STOPPED',
    FINAL_RECONCILED: 'FINAL_RECONCILED',
    NEW_SOLE_WRITER: 'NEW_SOLE_WRITER',
    ROLLED_BACK: 'ROLLED_BACK'
  };

  /* Ai được ghi ở mỗi bước. Cửa sổ NONE ở giữa là CỐ Ý: quán dừng ghi trong lúc
     đối chiếu lần cuối. Không có bước nào ánh xạ tới "cả hai". */
  var WRITER_AT = {
    NOT_STARTED: WRITER.OLD,
    OLD_WRITER_STOPPED: WRITER.NONE,
    FINAL_RECONCILED: WRITER.NONE,
    NEW_SOLE_WRITER: WRITER.NEW,
    ROLLED_BACK: WRITER.OLD
  };

  /* Điều kiện tiên quyết §17: P0..P12 đều phải PASS. */
  var REQUIRED_PHASES = [
    'P0', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6',
    'P7', 'P8', 'P9', 'P10', 'P11', 'P12'
  ];

  function actorAndTime(spec, what) {
    if (!spec || !spec.actorId) return 'bước ' + what + ' cần actorId — không có ai chịu trách nhiệm thì không phải cutover';
    if (typeof spec.at !== 'number') return 'bước ' + what + ' cần mốc thời gian';
    return null;
  }

  function createCutover(opts) {
    opts = opts || {};
    var step = STEP.NOT_STARTED;
    var phases = Object.create(null);
    var log = [];
    var rollbackWindowMs = typeof opts.rollbackWindowMs === 'number' ? opts.rollbackWindowMs : null;
    var cutoverAt = null;
    var attempted = false;

    function writer() { return WRITER_AT[step]; }

    function append(action, spec, extra) {
      log.push(Object.assign({
        action: action, step: step, writer: writer(),
        actorId: spec.actorId, at: spec.at
      }, extra || {}));
    }

    /**
     * Ghi nhận một phase đã PASS. BẮT BUỘC có bằng chứng — "đánh dấu xong" mà
     * không kèm bằng chứng thì chỉ là một ô tick, và ô tick không chặn được gì.
     */
    function recordPhase(spec) {
      if (!spec || REQUIRED_PHASES.indexOf(spec.phase) === -1) {
        return R.err('VALIDATION', 'phase không hợp lệ: ' + (spec && spec.phase));
      }
      var bad = actorAndTime(spec, 'ghi nhận phase');
      if (bad) return R.err('VALIDATION', bad);
      if (!spec.evidence || (typeof spec.evidence === 'string' && !spec.evidence.trim())) {
        return R.err('VALIDATION',
          'phase ' + spec.phase + ' cần bằng chứng PASS (tên test suite, số hiệu run, biên bản) — ' +
          'đánh dấu xong mà không có bằng chứng thì cổng này vô nghĩa');
      }
      phases[spec.phase] = {
        phase: spec.phase, evidence: spec.evidence,
        actorId: spec.actorId, at: spec.at
      };
      return R.ok(phases[spec.phase]);
    }

    function missingPhases() {
      return REQUIRED_PHASES.filter(function (p) { return !phases[p]; });
    }

    /** Cổng tiên quyết. MẶC ĐỊNH ĐÓNG. */
    function preconditions() {
      var missing = missingPhases();
      return missing.length
        ? R.err('PRECONDITION', 'thiếu ' + missing.length + ' phase chưa PASS: ' + missing.join(', '),
          { missing: missing })
        : R.ok({ ready: true, phases: REQUIRED_PHASES.map(function (p) { return phases[p]; }) });
    }

    function expect(current, what) {
      if (step !== current) {
        return R.err('PRECONDITION',
          what + ' phải chạy khi đang ở bước ' + current + ', hiện đang ở ' + step);
      }
      return null;
    }

    /** Bước 1 — dừng hệ cũ. Từ đây KHÔNG ai ghi cho tới khi đối chiếu xong. */
    function stopOldWriter(spec) {
      var e = expect(STEP.NOT_STARTED, 'dừng hệ cũ'); if (e) return e;
      var bad = actorAndTime(spec, 'dừng hệ cũ'); if (bad) return R.err('VALIDATION', bad);
      var pre = preconditions();
      if (R.isErr(pre)) return pre;
      step = STEP.OLD_WRITER_STOPPED;
      append('STOP_OLD_WRITER', spec);
      return R.ok({ step: step, writer: writer() });
    }

    /**
     * Bước 2 — đối chiếu lần cuối. Còn chênh lệch chưa giải thích thì KHÔNG đi
     * tiếp; quay lui ở đây rẻ, quay lui sau khi đã ghi thì không.
     */
    function finalReconciliation(spec) {
      var e = expect(STEP.OLD_WRITER_STOPPED, 'đối chiếu lần cuối'); if (e) return e;
      var bad = actorAndTime(spec, 'đối chiếu lần cuối'); if (bad) return R.err('VALIDATION', bad);
      if (!spec.report) return R.err('VALIDATION', 'đối chiếu lần cuối cần báo cáo đối chiếu');
      var unresolved = spec.report.unresolved || [];
      if (unresolved.length) {
        return R.err('PRECONDITION',
          'còn ' + unresolved.length + ' chênh lệch chưa giải quyết — KHÔNG cutover',
          { unresolved: unresolved });
      }
      step = STEP.FINAL_RECONCILED;
      append('FINAL_RECONCILIATION', spec, { report: spec.report });
      return R.ok({ step: step, writer: writer() });
    }

    /**
     * Bước 3 — hệ mới thành sole writer. Đây là điểm không quay đầu miễn phí,
     * nên nó chạy đúng một lần.
     */
    function newSoleWriter(spec) {
      if (attempted) {
        return R.err('CONFLICT',
          'cutover chỉ chạy MỘT lần (§17). Muốn về hệ cũ thì dùng rollback(), ' +
          'và sau rollback phải làm lại từ đầu chứ không tiếp tục cutover dở');
      }
      var e = expect(STEP.FINAL_RECONCILED, 'chuyển hệ mới thành sole writer'); if (e) return e;
      var bad = actorAndTime(spec, 'chuyển sole writer'); if (bad) return R.err('VALIDATION', bad);
      attempted = true;
      step = STEP.NEW_SOLE_WRITER;
      cutoverAt = spec.at;
      append('NEW_SOLE_WRITER', spec);
      return R.ok({
        step: step, writer: writer(),
        /* Hệ cũ được GIỮ LẠI (§17 "OLD SYSTEM RETAINED") — giữ lại để đọc, chứ

       báo cáo kỳ chưa đọc được từ nguồn cũ. Nói ra, chứ không dựng báo cáo
       rỗng trông như "kỳ này không hao hụt gì". */
    GetUsageReport: 'ledger legacy chỉ tra theo containerCode, chưa tra được theo kỳ',
    GetLossReport: 'ledger legacy chỉ tra theo containerCode, chưa tra được theo kỳ',
    GetInventoryValuation: 'cần danh sách Unit đang mở toàn kho, legacy chưa có đường đọc theo lô',
    GetBTPReport: 'mẻ BTP legacy chưa map canonical theo kỳ'
  };

  /* Caller tự mang dữ liệu canonical thì không cần nguồn legacy nữa. */
  var CANONICAL_KEYS = {
    GetAlerts: 'alerts',
    GetShiftStatus: 'businessDay',
    GetPendingApprovals: 'pending',

    GetLossReport: 'entries',

          if (R.isErr(out)) return out;
          return R.ok({
            storeId: input.storeId,
            categories: out.value.categories,
            menuItems: out.value.menuItems,

      if ((name === 'GetRevenue' || name === 'GetCOGS') && input.businessDate && !input.bills) {
        return reader.loadBills(input).then(function (out) {
          if (R.isErr(out)) return out;
          return R.ok({
            storeId: input.storeId,

            legacyMeta: { source: out.value.source, ambiguous: out.value.ambiguous }

      if (NOT_WIRED[name] && !hasCanonicalInput(name, input)) {
        /* Chưa có nguồn legacy cho query này. Trả LỖI, không trả rỗng.
           Rỗng và "chưa đọc được" trông giống nhau trên màn hình nhưng nghĩa
           ngược nhau: một bên là "không có cảnh báo nào", một bên là "không
           biết có cảnh báo hay không". Legacy sai đúng chỗ này. */
        return Promise.resolve(R.err('NOT_FOUND',
          'chưa nối nguồn dữ liệu legacy cho ' + name + ' — ' + NOT_WIRED[name]));

      return Promise.resolve(R.ok(input));

    function forCommand(name, input) {
      /* Command đã mang canonical input từ controller/read-layer. Adapter
         legacy tuyệt đối không bổ sung dữ liệu và không ghi path cũ, nhưng cũng
         không được chặn command mới đi tới canonical atomic commit. */

        if (R.isErr(out)) return listener(out);

          storeId: input.storeId,
          categories: out.value.categories,
          menuItems: out.value.menuItems,
          legacyMeta: { ambiguous: out.value.ambiguous }
        }));
      });
    }

    return { forQuery: forQuery, forCommand: forCommand, watchQuery: watchQuery };
  }

  return { create: create };

/**
 * Nối read port hệ cũ vào lệnh tiếp nhận — phần WIRING, không có luật nghiệp vụ.
 *
 * Luật tiếp nhận nằm ở `commands/takeover` và không biết dữ liệu đến từ đâu.
 * Ở đây chỉ làm đúng hai việc: đọc đủ nguồn, rồi đưa sang. Nhờ tách vậy, luật
 * tiếp nhận kiểm được mà không cần Firebase, còn chỗ này kiểm được bằng một
 * reader giả.
 *
 * Hệ mới bật lên ngày cutover là tự chạy đường này. Không có bước export tay,
 * không có file trung gian, không cần ai chuẩn bị dữ liệu sẵn.
 */
GIEO.define('bootstrap/legacy-takeover', [
  'shared-kernel/result',
  'commands/takeover'
], function (R, takeover) {
  'use strict';

  /**
   * @param spec.reader       legacy read port (CHỈ ĐỌC)
   * @param spec.cutoverDate  'YYYY-MM-DD'
   * @param spec.storeId, spec.actorId
   */
  function run(spec) {
    spec = spec || {};
    if (!spec.reader || typeof spec.reader.loadAll !== 'function') {
      return Promise.resolve(R.err('VALIDATION', 'tiếp nhận cần legacy read port có loadAll'));
    }

    var names = takeover.SOURCES;
    return Promise.all(names.map(function (n) { return spec.reader.loadAll(n); }))
      .then(function (outs) {
        var failed = [];
        var legacy = {};
        outs.forEach(function (o, i) {
          if (R.isErr(o)) failed.push(names[i] + ': ' + o.error.message);
          else legacy[names[i]] = o.value;
        });
        if (failed.length) {
          /* Đọc hụt một nguồn thì dừng ở đây, KHÔNG đưa dữ liệu khuyết sang
             lệnh tiếp nhận. Tiếp nhận thiếu công thức còn tệ hơn chưa tiếp nhận. */
          return R.err('RETRYABLE',
            'không đọc đủ nguồn hệ cũ, KHÔNG tiếp nhận một phần: ' + failed.join('; '),
            { failed: failed });
        }
        return takeover.buildPlan({
          legacy: legacy,
          cutoverDate: spec.cutoverDate,
          storeId: spec.storeId,
          actorId: spec.actorId
        });
      });
  }

  return {
    run: run,
    /* Khối khởi động cần id này để hỏi "đã tiếp nhận chưa" trước khi chạy. */
    operationIdFor: takeover.takeoverOperationId
  };
});

/** Xác thực PIN trước khi có business day; không đọc/ghi Firebase trực tiếp. */
GIEO.define('bootstrap/pin-auth', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'store-context/access',
  'store-context/context'
], function (ids, R, access, contextLib) {
  'use strict';

  function authenticate(spec) {
    spec = spec || {};
    var pin = String(spec.pin || '');
    if (!/^\d{4}$/.test(pin)) return R.err('VALIDATION', 'PIN phải gồm đúng 4 chữ số');
    if (!ids.isId(spec.organizationId, 'org')) return R.err('VALIDATION', 'cần organizationId hợp lệ');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'cần storeId hợp lệ');
    if (!access.SOURCE[spec.source] || spec.source === access.SOURCE.SYSTEM) {
      return R.err('VALIDATION', 'đăng nhập PIN chỉ dành cho POS hoặc QUANLY');
    }

    var matched = (spec.employees || []).filter(function (employee) {
      return employee && employee.active !== false && String(employee.pin || '') === pin;
    });
    if (matched.length === 0) return R.err('FORBIDDEN', 'PIN không đúng hoặc nhân viên đã ngừng hoạt động');
    if (matched.length > 1) {
      return R.err('CONFLICT', 'PIN bị trùng giữa nhiều nhân viên — phải sửa dữ liệu trước khi đăng nhập');
    }

    var employee = matched[0];
    if (!ids.isId(employee.employeeId, 'employee')) return R.err('VALIDATION', 'nhân viên thiếu employeeId hợp lệ');
    if (!ids.isId(employee.actorId, 'actor')) return R.err('VALIDATION', 'nhân viên thiếu actorId hợp lệ');
    if (employee.storeId !== spec.storeId) return R.err('FORBIDDEN', 'nhân viên không thuộc cửa hàng này');
    if (!employee.role) return R.err('FORBIDDEN', 'nhân viên chưa được gán vai trò');

    var actor = access.createActor({
      actorId: employee.actorId,
      role: employee.role,
      source: spec.source,
      stores: [spec.storeId],
      allStoresRead: !!employee.allStoresRead
    });
    if (R.isErr(actor)) return actor;

    /* QUANLY không được mở bằng PIN của POS_OPERATOR. Dùng authority thật thay
       vì danh sách PIN đặc biệt trong UI. */
    if (spec.source === access.SOURCE.QUANLY &&
        !access.hasAuthority(actor.value, access.AUTHORITY.REVIEW_APPROVE_CORRECT)) {
      return R.err('FORBIDDEN', 'vai trò ' + employee.role + ' không có quyền vào QUANLY');
    }

    var context = contextLib.createContext({
      organizationId: spec.organizationId,
      storeId: spec.storeId,
      actor: actor.value,
      source: spec.source,
      businessDay: spec.businessDay || null,
      clock: spec.clock,
      deviceId: spec.deviceId,
      appInstanceId: spec.appInstanceId
    });
    if (R.isErr(context)) return context;
    return R.ok({ employee: employee, actor: actor.value, context: context.value });
  }

  return { authenticate: authenticate };
});

  'use strict';

  /* Ma trận so sánh — đúng danh sách §16. */
  var DOMAINS = [
    'SALE', 'FIFO', 'STOCK', 'COGS', 'WASTE', 'BTP',
    'RECEIVING', 'STOCK_COUNT', 'REVERSAL', 'SNAPSHOT', 'REPORT'
  ];

  /* Lớp kịch bản bắt buộc — §16. Đây là nơi lớp bug của legacy sống: gần như
     mọi bug đã audit đều rơi vào concurrent / retry / double-submit / lost ACK
     / partial failure, chứ không phải đường chạy thuận. */
  var SCENARIOS = [
    'normal', 'concurrent', 'retry', 'double-submit', 'lost-ack',
    'partial-failure', 'reversal', 'correction', 'recompute',
    'compact', 'historical-read'
  ];

  var SEVERITY = { NONE: 'NONE', IMMATERIAL: 'IMMATERIAL', MATERIAL: 'MATERIAL' };
  var STATUS = { MATCH: 'MATCH', EXPLAINED: 'EXPLAINED', UNEXPLAINED: 'UNEXPLAINED' };

  function isDomain(d) { return DOMAINS.indexOf(d) !== -1; }
  function isScenario(s) { return SCENARIOS.indexOf(s) !== -1; }
  function cellKey(domain, scenario) { return domain + '|' + scenario; }

  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  /**
   * So từng trường một, trả về danh sách lệch. Cố ý KHÔNG so sâu cả object:
   * so sâu sẽ báo lệch ở những trường mà hệ mới có thêm (versionId, operationId,
   * actorId...) — những trường đó tồn tại chính vì legacy thiếu chúng.
   *
   * @param spec.fields  [{name, tolerance}] — trường nào được so và sai số cho phép
   */
  function diffFields(oldResult, newResult, fields) {
    var diffs = [];
    fields.forEach(function (f) {
      var o = oldResult ? oldResult[f.name] : undefined;
      var n = newResult ? newResult[f.name] : undefined;

      if (o === undefined && n === undefined) {
        /* Cả hai đều không có trường này = không so được, KHÔNG phải khớp. */
        diffs.push({ field: f.name, old: null, new: null, delta: null, kind: 'MISSING_BOTH' });
        return;
      }
      if (isNum(o) && isNum(n)) {
        var delta = n - o;
        var tol = isNum(f.tolerance) ? f.tolerance : 0;
        if (Math.abs(delta) > tol) {
          diffs.push({ field: f.name, old: o, new: n, delta: delta, kind: 'NUMERIC' });
        }
        return;
      }
      if (o !== n) {
        diffs.push({ field: f.name, old: o === undefined ? null : o, new: n === undefined ? null : n, delta: null, kind: 'VALUE' });
      }
    });
    return diffs;
  }

  /**
   * Mức nặng. Trường được khai `material: true` (tiền, số lượng, tồn) lệch quá
   * dung sai thì là MATERIAL — thứ chặn cổng P12. Lệch ở trường mô tả thì
   * IMMATERIAL: vẫn ghi lại, nhưng không chặn.
   */
  function severityOf(diffs, fields) {
    if (!diffs.length) return SEVERITY.NONE;
    var materialNames = Object.create(null);
    fields.forEach(function (f) { if (f.material) materialNames[f.name] = true; });
    var hasMaterial = diffs.some(function (d) {
      /* Thiếu trường ở cả hai bên luôn là MATERIAL: không so được nghĩa là
         không biết, và "không biết" không được đi qua cổng. */
      return d.kind === 'MISSING_BOTH' || materialNames[d.field];
    });
    return hasMaterial ? SEVERITY.MATERIAL : SEVERITY.IMMATERIAL;
  }

  /**
   * @param spec.domain, spec.scenario
   * @param spec.oldResult  kết quả đọc từ hệ cũ
   * @param spec.newResult  kết quả SIMULATE của hệ mới (pipeline.run, không commit)
   * @param spec.fields     [{name, material, tolerance}]
   * @param spec.explanation {cause, actorId} — chỉ dùng khi đã điều tra xong
   */
  function compare(spec) {
    if (!spec || !isDomain(spec.domain)) {
      return R.err('VALIDATION', 'domain không nằm trong ma trận §16: ' + (spec && spec.domain));
    }
    if (!isScenario(spec.scenario)) {
      return R.err('VALIDATION', 'lớp kịch bản không hợp lệ: ' + spec.scenario);
    }
    if (!Array.isArray(spec.fields) || !spec.fields.length) {
      return R.err('VALIDATION',
        'compare phải khai rõ trường nào được so — so mặc định "cả object" sẽ báo lệch ở ' +
        'chính những trường hệ mới thêm vào vì legacy thiếu');
    }

    var diffs = diffFields(spec.oldResult, spec.newResult, spec.fields);
    var severity = severityOf(diffs, spec.fields);

    var status;
    if (!diffs.length) status = STATUS.MATCH;
    else {
      var ex = spec.explanation;
      var explained = !!(ex && typeof ex.cause === 'string' && ex.cause.trim() && ex.actorId);
      /* Nhãn "đã giải thích" không tự có giá trị — phải có lý do viết ra và
         người đứng tên, đúng nguyên tắc C4. */
      status = explained ? STATUS.EXPLAINED : STATUS.UNEXPLAINED;
    }

    return R.ok({
      cell: cellKey(spec.domain, spec.scenario),
      domain: spec.domain,
      scenario: spec.scenario,
      diffs: diffs,
      severity: severity,
      status: status,
      cause: status === STATUS.EXPLAINED ? spec.explanation.cause : null,
      explainedBy: status === STATUS.EXPLAINED ? spec.explanation.actorId : null,
      comparedAt: spec.at || null
    });
  }

  /**
   * Sổ ghi kết quả shadow + cổng P12.
   *
   * @param spec.runtimeMode  mode của runtime đang chạy shadow
   */
  function createRun(spec) {
    spec = spec || {};
    if (spec.runtimeMode === 'WRITE') {
      /* Chặn ngay lúc dựng, không phải lúc chạy: một run shadow trỏ vào runtime
         ghi thật là cách ghi đúp trong khi tưởng đang so sánh. */
      throw new Error('[shadow-compare] KHÔNG chạy shadow trên runtime WRITE — ' +
        'P12 quy định hệ cũ là sole writer');
    }

    var results = [];
    var byCell = Object.create(null);

    function record(spec2) {
      var out = compare(spec2);
      if (R.isErr(out)) return out;
      results.push(out.value);
      /* Một ô chạy nhiều lần thì giữ kết quả XẤU NHẤT, không phải lần cuối:
         chạy lại tới khi may mắn khớp là cách lỗi lọt qua cổng. */
      var prev = byCell[out.value.cell];
      if (!prev || rankOf(out.value) > rankOf(prev)) byCell[out.value.cell] = out.value;
      return out;
    }

    function rankOf(r) {
      if (r.status === STATUS.UNEXPLAINED) return r.severity === SEVERITY.MATERIAL ? 4 : 3;
      if (r.status === STATUS.EXPLAINED) return r.severity === SEVERITY.MATERIAL ? 2 : 1;
      return 0;
    }

    /** Ô nào trong ma trận chưa từng chạy. */
    function missingCells() {
      var missing = [];
      DOMAINS.forEach(function (d) {
        SCENARIOS.forEach(function (s) {
          if (!byCell[cellKey(d, s)]) missing.push({ domain: d, scenario: s });
        });
      });
      return missing;
    }

    function unexplainedMaterial() {
      return Object.keys(byCell).map(function (k) { return byCell[k]; })
        .filter(function (r) {
          return r.status === STATUS.UNEXPLAINED && r.severity === SEVERITY.MATERIAL;
        });
    }

    /**
     * Cổng P12. MẶC ĐỊNH ĐÓNG.
     *
     * "Không còn unexplained material difference" chỉ có nghĩa khi ma trận đã
     * được chạy đủ — nếu không, câu đó đúng một cách rỗng tuếch với một sổ trắng.
     */
    function gate() {
      var missing = missingCells();
      var bad = unexplainedMaterial();
      var blockers = [];
      if (missing.length) {
        blockers.push({
          code: 'MATRIX_INCOMPLETE',
          detail: missing.length + '/' + (DOMAINS.length * SCENARIOS.length) + ' ô chưa chạy',
          cells: missing
        });
      }
      if (bad.length) {
        blockers.push({
          code: 'UNEXPLAINED_MATERIAL_DIFF',
          detail: bad.length + ' ô còn lệch vật chất chưa giải thích',
          cells: bad.map(function (r) { return r.cell; })
        });
      }
      return blockers.length
        ? R.err('PRECONDITION', 'P12 CHƯA ĐẠT', { blockers: blockers })
        : R.ok({
            passed: true,
            cellsRun: Object.keys(byCell).length,
            comparisons: results.length,
            explained: Object.keys(byCell).filter(function (k) {
              return byCell[k].status === STATUS.EXPLAINED;
            }).length
          });
    }

    function coverage() {
      var total = DOMAINS.length * SCENARIOS.length;
      var run = Object.keys(byCell).length;
      return {
        total: total, run: run, missing: total - run,
        pct: total === 0 ? 0 : (run / total) * 100,
        byDomain: DOMAINS.reduce(function (acc, d) {
          acc[d] = SCENARIOS.filter(function (s) { return !!byCell[cellKey(d, s)]; }).length;
          return acc;
        }, {})
      };
    }

    return {
      record: record,
      results: function () { return results.slice(); },
      cell: function (d, s) { return byCell[cellKey(d, s)] || null; },
      missingCells: missingCells,
      unexplainedMaterial: unexplainedMaterial,
      coverage: coverage,
      gate: gate
    };
  }

  return {
    DOMAINS: DOMAINS,
    SCENARIOS: SCENARIOS,
    SEVERITY: SEVERITY,
    STATUS: STATUS,
    compare: compare,
    createRun: createRun
  };
});

/**
 * Khối KHỞI ĐỘNG — nơi ba mảnh được cắm điện với nhau.
 *
 *   Firebase  →  runtime (quyền ghi do cutover quyết)
 *             →  tiếp nhận hệ cũ, ĐÚNG MỘT LẦN, tại mốc cutover
 *
 * Ba luật được cài ở đây, không nằm ở lời dặn:
 *
 *   1. Quyền ghi KHÔNG hardcode. Nó đến từ trạng thái cutover đọc trong kho.
 *      Trạng thái nằm trong bộ nhớ tab thì mọi bảo đảm của P13 chỉ sống tới
 *      lần F5 đầu tiên.
 *
 *   2. Tiếp nhận chạy đúng một lần. Kiểm bằng bản ghi operation đã tồn tại
 *      chưa, không bằng một cờ trong localStorage — đổi máy là quên.
 *
 *   3. Chưa tới mốc cutover thì KHÔNG tiếp nhận. Tiếp nhận sớm nghĩa là chụp
 *      tồn đầu sai, và sai từ con số gốc thì mọi thứ sau đó sai theo.
 */
GIEO.define('bootstrap/startup', [
  'shared-kernel/result',
  'bootstrap/firebase-app',
  'bootstrap/firebase-read-client',
  'bootstrap/pin-auth',
  'bootstrap/legacy-data-source',
  'bootstrap/canonical-data-source',
  'bootstrap/legacy-takeover',
  'bootstrap/cutover',
  'bootstrap/runtime',
  'legacy-firebase-adapter/read-port',
  'persistence-firebase/canonical-paths',
  'persistence-firebase/canonical-read-port',
  'persistence-firebase/firestore-runner',
  'persistence-firebase/atomic-commit'
], function (R, fbApp, readClientLib, pinAuth, legacyDataSourceLib, canonicalDataSourceLib, takeoverLib,
             cutoverLib, runtimeLib, readPortLib, paths, canonicalReadPortLib, runnerLib, commitLib) {
  'use strict';

  function docPath(name, ctx, args) {
    var p = paths.path(name, ctx, args);
    return R.isErr(p) ? null : p.value.path;
  }

  /**
   * Ghép 2 dataSource thành 1: `forQuery` vẫn của legacy (đường đọc UI hiện
   * tại chưa đổi), `forCommand` đi qua canonical TRƯỚC (cấp `deps.units`/
   * `deps.versionRegistry` thật cho RecordSale — xem `canonical-data-source.js`)
   * RỒI mới qua legacy (legacy `forCommand` là pass-through vĩnh viễn theo
   * thiết kế, nên chuỗi này không mất gì, chỉ cộng thêm đúng 1 chỗ nó cố ý
   * chừa trống).
   */
  function composeDataSource(legacy, canonical) {
    return {
      forQuery: legacy.forQuery,
      forCommand: function (name, input) {
        return Promise.resolve(canonical.forCommand(name, input)).then(function (out) {
          if (R.isErr(out)) return out;
          return legacy.forCommand(name, out.value);
        });
      },
      watchQuery: legacy.watchQuery
    };
  }

  /** Đọc một document canonical bằng handle Firestore thô. */
  function readDoc(firestore, fullPath) {
    var parts = fullPath.split('/').filter(Boolean);
    if (parts.length % 2 !== 0) return Promise.resolve(null);
    var ref = firestore.collection(parts[0]).doc(parts[1]);
    for (var i = 2; i < parts.length; i += 2) ref = ref.collection(parts[i]).doc(parts[i + 1]);
    return Promise.resolve(ref.get())
      .then(function (snap) {
        if (!snap || snap.exists === false) return null;
        return typeof snap.data === 'function' ? snap.data() : null;
      })
      .catch(function () { return null; });
  }

  /**
   * @param spec.firebase    {config, account} từ shell
   * @param spec.context     StoreContext (hoặc hàm trả về)
   * @param spec.cutoverDate 'YYYY-MM-DD'
   * @param spec.today       'YYYY-MM-DD' — ngày vận hành hiện tại, TRUYỀN VÀO
   *                         chứ không đọc đồng hồ máy (xem `store-context`)
   * @param spec.sdk         tiêm để test không cần mạng
   */
  function start(spec) {
    spec = spec || {};
    var ctxOf = typeof spec.context === 'function' ? spec.context : function () { return spec.context; };

    return fbApp.init({ config: spec.firebase && spec.firebase.config,
                        account: spec.firebase && spec.firebase.account,
                        sdk: spec.sdk })
      .then(function (fb) {
        if (R.isErr(fb)) return fb;

        var handles = fb.value;
        var readClient = readClientLib.create({ rtdb: handles.rtdb, firestore: handles.firestore });
        var reader = readPortLib.createReader(readClient);
        var canonicalReader = canonicalReadPortLib.createReader(handles.firestore);
        var writeRunner = runnerLib.create({ firestore: handles.firestore, rtdb: handles.rtdb });
        var committer = commitLib.createCommitter({ transactionRunner: writeRunner.runner });

        var ctx = ctxOf();
        if (!ctx) return R.err('NOT_FOUND', 'chưa có StoreContext để khởi động');

        var cutover = cutoverLib.createCutover({ rollbackWindowMs: spec.rollbackWindowMs });
        var statePath = docPath('cutoverState', ctx, {});

        return readDoc(handles.firestore, statePath).then(function (saved) {
          var h = cutover.hydrate(saved);
          if (R.isErr(h)) return h;

          var runtime = runtimeLib.createRuntime({
            /* KHÔNG truyền mode: quyền ghi do cutover quyết, và runtime từ chối
               nhận cả hai. */
            cutover: cutover,
            context: ctxOf,
            dataSource: composeDataSource(
              legacyDataSourceLib.create(reader, { storeId: ctx.storeId }),
              canonicalDataSourceLib.create(canonicalReader, { organizationId: ctx.organizationId })
            ),
            commit: function (plan, commitCtx) { return committer.commit(plan, commitCtx); },
            device: spec.device
          });

          var result = {
            runtime: runtime,
            cutover: cutover,
            reader: reader,
            committer: committer,
            writeRunner: writeRunner,
            takeover: null
          };

          /* Chưa tới ngày cutover thì dừng ở đây — chạy READ_ONLY như thường. */
          if (!spec.cutoverDate || !spec.today || spec.today < spec.cutoverDate) {
            result.takeover = { ran: false, why: 'chưa tới mốc cutover' };
            return R.ok(result);
          }

          return maybeTakeover(spec, ctx, handles, reader, committer).then(function (t) {
            if (R.isErr(t)) return t;
            result.takeover = t.value;
            return R.ok(result);
          });
        });
      });
  }

  /**
   * Pha trước runtime: đăng nhập Firebase dùng chung, chỉ đọc employee/PIN rồi
   * dựng actor + context. Không cần biết URL bí mật hay tạo business day giả.
   */
  function prepareAuth(spec) {
    spec = spec || {};
    return fbApp.init({ config: spec.firebase && spec.firebase.config,
                        account: spec.firebase && spec.firebase.account,
                        sdk: spec.sdk })
      .then(function (fb) {
        if (R.isErr(fb)) return fb;
        var readClient = readClientLib.create({
          rtdb: fb.value.rtdb, firestore: fb.value.firestore
        });
        var reader = readPortLib.createReader(readClient);
        return reader.loadEmployees({ storeId: spec.storeId }).then(function (employees) {
          if (R.isErr(employees)) return employees;
          return R.ok({
            employees: employees.value,
            authenticate: function (pin) {
              return pinAuth.authenticate({
                pin: pin,
                employees: employees.value,
                organizationId: spec.organizationId,
                storeId: spec.storeId,
                source: spec.source,
                businessDay: spec.businessDay || null,
                clock: spec.clock,
                deviceId: spec.deviceId,
                appInstanceId: spec.appInstanceId
              });
            }
          });
        });
      });
  }

  /** Tiếp nhận nếu chưa từng chạy. Idempotent theo bản ghi operation trong kho. */
  function maybeTakeover(spec, ctx, handles, reader, committer) {
    var opId = takeoverLib.operationIdFor(spec.cutoverDate);
    var opPath = docPath('operation', ctx, { operationId: opId });

    return readDoc(handles.firestore, opPath).then(function (existing) {
      if (existing) {
        /* Đã tiếp nhận rồi. Chạy lại sẽ ghi đè tồn đầu bằng số của hệ cũ HÔM
           NAY, xoá sạch mọi giao dịch hệ mới đã ghi từ lúc cutover. */
        return R.ok({ ran: false, why: 'đã tiếp nhận trước đó', operationId: opId });
      }
      return takeoverLib.run({
        reader: reader,
        cutoverDate: spec.cutoverDate,
        storeId: ctx.storeId,
        actorId: spec.actorId || (ctx.actor && ctx.actor.actorId)
      }).then(function (built) {
        if (R.isErr(built)) return built;
        return committer.commit(built.value.plan, ctx).then(function (written) {
          if (R.isErr(written)) return written;
          return R.ok({
            ran: true, operationId: opId,
            summary: built.value.summary, skipped: built.value.skipped,
            writeCount: written.value.writeCount
          });
        });
      });
    });
  }

  return { prepareAuth: prepareAuth, start: start };
});

/** QUANLY controller: drill qua read-layer, sửa/duyệt qua command pipeline. */
GIEO.define('app-quanly/controller', [
  'shared-kernel/result',
  'bootstrap/runtime'
], function (R, bootstrap) {
  'use strict';

  function createController(runtime) {
    runtime = runtime || bootstrap.createRuntime({ mode: bootstrap.MODE.READ_ONLY });
    var state = { mode: runtime.mode, screen: 'OVERVIEW', lastResult: null, lastError: null };
    function snapshot() { return Object.assign({}, state); }
    function navigate(screen) {
      if (['OVERVIEW', 'ALERTS', 'TRACE', 'INVENTORY', 'APPROVALS', 'REPORTS', 'BTP'].indexOf(screen) === -1) {
        return R.err('VALIDATION', 'màn QUANLY không hợp lệ: ' + screen);
      }
      state.screen = screen;
      return R.ok(snapshot());
    }
    function read(name, input) {
      return Promise.resolve(runtime.query(name, input || {})).then(function (out) {
        if (R.isErr(out)) state.lastError = out.error;
        else state.lastResult = out.value;
        return out;
      });
    }
    function run(name, input) {
      return runtime.command(name, input || {}).then(function (out) {
        if (R.isErr(out)) state.lastError = out.error;
        else state.lastResult = out.value;
        return out;
      });
    }

    return {
      state: snapshot,
      navigate: navigate,
      getUnitTrace: function (input) { return read('GetUnitTrace', input); },
      getInventoryLevel: function (input) { return read('GetInventoryLevel', input); },
      getRevenue: function (input) { return read('GetRevenue', input); },
      getCOGS: function (input) { return read('GetCOGS', input); },
      getPnL: function (input) { return read('GetPnL', input); },
      comparePeriods: function (input) { return read('ComparePeriods', input); },
      getAlerts: function (input) { return read('GetAlerts', Object.assign({ audience: 'QUANLY' }, input || {})); },
      getShiftStatus: function (input) { return read('GetShiftStatus', input); },
      getPendingApprovals: function (input) { return read('GetPendingApprovals', input); },
      getUsageReport: function (input) { return read('GetUsageReport', input); },
      getLossReport: function (input) { return read('GetLossReport', input); },
      getInventoryValuation: function (input) { return read('GetInventoryValuation', input); },
      getVarianceReport: function (input) { return read('GetVarianceReport', input); },
      getBTPReport: function (input) { return read('GetBTPReport', input); },
      openBusinessDay: function (input) { return run('OpenBusinessDay', input); },
      closeBusinessDay: function (input) { return run('CloseBusinessDay', input); },
      /**
       * Xuất file. BẮT BUỘC truyền lại `meta` của truy vấn gốc — file rời khỏi
       * hệ thống mà không mang xuất xứ thì không ai kiểm chứng lại được.
       */
      exportReport: function (input) { return read('ExportReport', input); },
      /**
       * Duyệt theo đúng command mà GetPendingApprovals đã gắn sẵn vào từng việc.
       * Màn hình KHÔNG tự tra bảng "loại này thì gọi gì" — tra bảng ở UI chính là
       * chỗ legacy nối thiếu hệ quả sau khi duyệt (Bug #12/#16).
       */
      approvePending: function (item, input) {
        if (!item || !item.command) {
          return Promise.resolve(R.err('VALIDATION',
            'việc chờ duyệt không mang sẵn command — từ chối đoán'));
        }
        return run(item.command, Object.assign({ referenceId: item.referenceId }, input || {}));
      },
      approveStockCount: function (input) { return run('ApproveStockCount', input); },
      approveLost: function (input) { return run('ApproveLostContainer', input); },
      approveExpense: function (input) { return run('ApproveExpense', input); },
      adjustInventory: function (input) { return run('AdjustInventory', input); },
      restoreFoundContainer: function (input) { return run('RestoreFoundContainer', input); },
      reverseOrder: function (input) { return run('ReverseTransaction', input); },
      reviseState: function (input) { return run('ReviseState', input); },
      correctLedgerEntry: function (input) { return run('CorrectLedgerEntry', input); }
    };
  }

  return { createController: createController };
});

/* ===== src/apps/quanly/main.js ===== */
/** QUANLY thin client — điều tra qua read-layer, sửa qua commands. */
GIEO.define('app-quanly/main', [
  'shared-kernel/result',
  'shared-kernel/clock',
  'bootstrap/runtime',
  'app-quanly/controller'
], function (R, clockLib, bootstrap, controllerLib) {
  'use strict';

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function money(n) { return Number(n || 0).toLocaleString('vi-VN') + ' ₫'; }
  var clock = clockLib.createClock();
  function view() { return { loading: false, error: null, data: null }; }

  function applyRead(out) {
    return R.isErr(out)
      ? { loading: false, error: out.error, data: null }
      : { loading: false, error: null, data: out.value.data, meta: out.value.meta };
  }

  /** Màn PIN tối thiểu của QUANLY; sẽ được đặt vào layout legacy khi port UI. */
  function showLogin(spec) {
    spec = spec || {};
    var el = document.getElementById('app');
    if (!el) return R.err('NOT_FOUND', 'không có #app');
    if (typeof spec.authenticate !== 'function' || typeof spec.onAuthenticated !== 'function') {
      return R.err('VALIDATION', 'showLogin cần authenticate và onAuthenticated');
    }
    el.innerHTML = '<div class="app-shell"><section class="panel" style="max-width:420px;margin:12vh auto 0">' +
      '<p class="eyebrow">GIEO QUANLY</p><h2>Đăng nhập quản lý</h2>' +
      '<p style="color:var(--muted)">Nhập PIN 4 số của bạn.</p>' +
      '<form id="ql-pin-form" class="search-row"><input name="pin" type="password" inputmode="numeric" ' +
      'pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" aria-label="PIN 4 số" required>' +
      '<button type="submit">Đăng nhập</button></form><div id="ql-pin-result"></div></section></div>';
    var form = el.querySelector('#ql-pin-form');
    var result = el.querySelector('#ql-pin-result');
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var button = form.querySelector('button');
      button.disabled = true;
      result.innerHTML = '<div class="result"><span>Đang kiểm tra…</span></div>';
      var authenticated = spec.authenticate(form.elements.pin.value);
      if (R.isErr(authenticated)) {
        button.disabled = false;
        form.elements.pin.value = '';
        form.elements.pin.focus();
        result.innerHTML = '<div class="result error"><strong>Không đăng nhập được</strong><span>' +
          esc(authenticated.error.message) + '</span></div>';
        return;
      }
      result.innerHTML = '';
      Promise.resolve(spec.onAuthenticated(authenticated.value)).catch(function (error) {
        button.disabled = false;
        result.innerHTML = '<div class="result error"><strong>Không khởi động được</strong><span>' +
          esc(error && error.message ? error.message : error) + '</span></div>';
      });
    });
    form.elements.pin.focus();
    return R.ok(true);
  }

  function start() {
    var el = document.getElementById('app');
    if (!el) return R.err('NOT_FOUND', 'không có #app');
    var runtime = globalThis.GIEO_QUANLY_RUNTIME || bootstrap.createRuntime({ mode: bootstrap.MODE.READ_ONLY });
    var controller = controllerLib.createController(runtime);

    var traceView = view();
    var inventoryView = view();
    var reportView = view();
    var cogsView = view();
    var varianceView = view();
    var pnlView = view();
    var alertView = view();
    var shiftView = view();
    var approvalView = view();
    var usageView = view();
    var lossView = view();
    var valuationView = view();
    var btpView = view();
    var compareView = view();
    var exportView = { busy: false, error: null, file: null };
    var btpExportView = { busy: false, error: null, file: null };
    var approvalAction = { busy: null, error: null, done: null };
    var lastPeriod = null;

    function errorBox(title, error) {
      return '<div class="result error"><strong>' + esc(title) + '</strong><span>' +
        esc(error.message) + '</span></div>';
    }

    function metric(label, value) {
      return '<article class="metric"><span>' + esc(label) + '</span><strong>' + esc(value) + '</strong></article>';
    }

    /** Cột đã đóng băng phải nói ra là đóng băng (quy tắc T3 của read contract). */
    function frozenTag(v) {
      if (!v || !v.meta) return '';
      return v.meta.frozen ? '<span class="status neutral">Số đã chốt</span>' : '<span class="status">Số sống</span>';
    }

    /* ---------- Tổng quan ---------- */

    function overviewScreen() {
      var busy = reportView.loading || alertView.loading || shiftView.loading;
      var head = '<section><div class="section-head"><div><p class="eyebrow">Hôm nay</p>' +
        '<h2>Sức khỏe quán</h2></div>' +
        '<span class="status ' + (busy ? 'neutral' : 'success') + '">' +
        (busy ? 'Đang đọc…' : (shiftView.data && shiftView.data.businessDate ? esc(shiftView.data.businessDate) : 'Chưa mở ngày')) +
        '</span></div>';

      var boxes = [];
      if (reportView.error) boxes.push(errorBox('Không đọc được doanh thu', reportView.error));
      if (alertView.error) boxes.push(errorBox('Không đọc được cảnh báo', alertView.error));
      if (shiftView.error) boxes.push(errorBox('Không đọc được trạng thái ca', shiftView.error));

      var rev = reportView.data;
      var al = alertView.data;
      var sh = shiftView.data;
      function kcard(label, value, sub, tone) {
        return '<article class="kcard ' + (tone || '') + '"><div class="klabel">' + esc(label) +
          '</div><div class="kvalue">' + esc(value) + '</div><div class="ksub">' + esc(sub || '') + '</div></article>';
      }
      return head + boxes.join('') + '<div class="kgrid" id="todayGrid">' +
        kcard('Doanh thu thuần', rev ? money(rev.netRevenue) : money(0),
          rev ? rev.billCount + ' đơn' : 'Không có giao dịch', 'accent') +
        kcard('Số đơn', rev ? rev.billCount : 0, 'Trong ngày được chọn') +
        /* Hai mức nặng để RIÊNG: gộp thành "12 cảnh báo" là cách một DANGER
           biến mất giữa đám INFO. */
        kcard('Nghiêm trọng', al ? al.counts.DANGER : 0, 'Cần xử lý ngay', 'danger') +
        kcard('Cảnh báo', al ? al.counts.WARNING : 0, 'Cần theo dõi', 'warning') +
        kcard('Trạng thái ngày', sh && sh.operable ? 'Đang mở' : 'Đóng cửa',
          sh && sh.businessDate ? sh.businessDate : 'Không có ca bán hàng') +
        kcard('Đang trong ca', sh && sh.employeesOnShift ? sh.employeesOnShift.length : 0,
          'Nhân viên đã check-in') +
        '</div></section>';
    }

    function alertDetail(alert) {
      var data = alert.data || {};
      return Object.keys(data).sort().map(function (key) {
        var value = Array.isArray(data[key]) ? data[key].join(', ') : data[key];
        return key + ': ' + value;
      }).join(' · ');
    }

    function alertsScreen() {
      var d = alertView.data;
      var head = '<section id="screen-alerts-port"><div class="section-head"><div><p class="eyebrow">Ưu tiên vận hành</p>' +
        '<h2>Cảnh báo đang mở</h2></div><span class="status neutral">' +
        (d ? d.total + ' việc' : '—') + '</span></div>';
      if (alertView.loading) return head + '<div class="empty"><h3>Đang đọc cảnh báo…</h3></div></section>';
      if (alertView.error) return head + errorBox('Không đọc được cảnh báo', alertView.error) + '</section>';
      if (!d || !d.total) return head + '<div class="empty"><div class="empty-icon">✓</div>' +
        '<h3>Không có cảnh báo đang mở</h3></div></section>';
      var sections = ['DANGER', 'WARNING', 'INFO'].map(function (severity) {
        var items = d.buckets[severity] || [];
        if (!items.length) return '';
        var tone = severity === 'DANGER' ? 'danger' : (severity === 'WARNING' ? 'warning' : 'neutral');
        return '<h3 class="report-sub"><span class="status ' + tone + '">' + severity + '</span> ' +
          items.length + ' việc</h3><div class="card">' + items.map(function (alert) {
            return '<article class="litem"><div class="lmain"><div class="ltitle">' + esc(alert.type) +
              '</div><div class="lsub">' + esc(alertDetail(alert)) + '</div></div><div class="lmeta">' +
              esc(alert.businessDate || '') + '</div></article>';
          }).join('') + '</div>';
      }).join('');
      return head + sections + '</section>';
    }

    /* ---------- Truy vết ---------- */

    function traceMarkup() {
      if (traceView.loading) return '<div class="empty"><h3>Đang dựng timeline…</h3></div>';
      if (traceView.error) return errorBox('Không thể truy vết', traceView.error);
      if (!traceView.data) return '<div class="empty"><div class="empty-icon">⌕</div><h3>Chọn một Unit để điều tra</h3>' +
        '<p>Read Layer tự chọn LIVE hoặc snapshot lịch sử; màn hình không branch theo nguồn.</p></div>';
      return '<div class="card"><article class="litem"><div class="lmain"><div class="ltitle">Unit</div>' +
        '<div class="lsub">' + esc(traceView.data.unitId) + '</div></div></article>' +
        '<article class="litem"><div class="lmain"><div class="ltitle">Bill liên quan</div>' +
        '<div class="lsub">Theo allocation canonical</div></div><strong>' +
        esc((traceView.data.billIds || []).length) + '</strong></article>' +
        '<article class="litem"><div class="lmain"><div class="ltitle">Mẻ BTP liên quan</div>' +
        '<div class="lsub">Theo dependency registry</div></div><strong>' +
        esc((traceView.data.prepBatchIds || []).length) + '</strong></article></div>';
    }

    function traceScreen() {
      return '<section id="screen-trace-port"><div class="section-head"><div><p class="eyebrow">Truy vết hai chiều</p>' +
        '<h2>Unit → Bill / BTP / Waste</h2></div>' + frozenTag(traceView) + '</div><div class="search-row">' +
        '<form id="ql-unit-search" style="display:contents"><input name="code" aria-label="Mã Unit" ' +
        'placeholder="Nhập hoặc quét mã Unit" required><button>Tra cứu</button></form></div>' +
        traceMarkup() + '</section>';
    }

    function inventoryScreen() {
      var d = inventoryView.data;
      var body;
      if (inventoryView.loading) body = '<div class="empty"><h3>Đang đọc projection tồn kho…</h3></div>';
      else if (inventoryView.error) body = errorBox('Không đọc được tồn kho', inventoryView.error);
      else if (!d) body = '<div class="empty"><div class="empty-icon">▦</div><h3>Chọn một mặt hàng</h3>' +
        '<p>Tồn kho được đọc từ projection duy nhất của FIFO core.</p></div>';
      else body = '<div class="metric-grid">' + metric('Tồn hiện tại', d.currentStock) +
        metric('Unit còn niêm phong', d.breakdown.sealedQty) +
        metric('Unit đang mở', d.breakdown.openQty) +
        metric('Tồn chưa gắn Unit', d.breakdown.untrackedBase) +
        metric('Biến động chưa gắn Unit', d.breakdown.untrackedPendingDelta) + '</div>';
      return '<section id="screen-inventory-port"><div class="section-head"><div><p class="eyebrow">Kho canonical</p>' +
        '<h2>Tồn kho theo mặt hàng</h2></div>' + frozenTag(inventoryView) + '</div>' +
        '<form class="search-row" id="inventory-search"><input name="itemId" aria-label="Mã mặt hàng" ' +
        'placeholder="Nhập mã mặt hàng" required><button>Đọc tồn</button></form>' + body + '</section>';
    }

    /* ---------- Duyệt ---------- */

    function approvalsScreen() {
      var d = approvalView.data;
      var count = d ? d.items.length : 0;
      var head = '<section id="screen-inbox-port"><div class="section-head"><div><p class="eyebrow">Kiểm soát</p>' +
        '<h2>Hộp việc</h2></div><span class="status neutral">' +
        (approvalView.loading ? 'Đang đọc…' : count + ' việc') + '</span></div>';

      if (approvalView.error) return head + errorBox('Không đọc được danh sách duyệt', approvalView.error) + '</section>';
      if (approvalView.loading) return head + '<div class="empty"><h3>Đang đọc…</h3></div></section>';
      if (!d || !count) {
        return head + '<div class="empty"><div class="empty-icon">✓</div><h3>Không có việc chờ duyệt</h3>' +
          '<p>Kiểm kê, báo mất và chi phí chỉ được thay đổi qua command có audit.</p></div></section>';
      }

      var warn = d.unknownTypes.length
        /* Loại chưa khai không được dựng nút duyệt. Hiện ra để người ta biết có
           việc đang kẹt, thay vì im lặng bỏ qua. */
        ? '<div class="result error"><strong>' + esc(d.unknownTypes.length) +
          ' loại việc chưa khai báo command</strong><span>' + esc(d.unknownTypes.join(', ')) +
          ' — không dựng nút duyệt cho tới khi được khai.</span></div>'
        : '';

      var action = approvalAction.error
        ? errorBox('Không duyệt được', approvalAction.error)
        : (approvalAction.done ? '<div class="result"><strong>Đã duyệt ' + esc(approvalAction.done) + '</strong></div>' : '');

      return head + warn + action + '<div class="card" id="inboxBody">' + d.items.map(function (item, i) {
        return '<article class="litem"><div class="lmain"><div class="ltitle">' + esc(item.label) + '</div>' +
          '<div class="lsub">' + esc(item.referenceId) + '</div></div>' +
          '<div class="lmeta">' + esc(item.summary || '') + '</div>' +
          '<button class="btn primary" data-approve="' + i + '"' +
          (approvalAction.busy === item.referenceId ? ' disabled' : '') + '>' +
          esc(approvalAction.busy === item.referenceId ? 'Đang duyệt…' : 'Duyệt') + '</button></article>';
      }).join('') + '</div></section>';
    }

    /* ---------- Báo cáo ---------- */

    function cogsMarkup() {
      if (cogsView.loading) return '<div class="empty"><h3>Đang đọc COGS…</h3></div>';
      if (cogsView.error) return errorBox('Không đọc được COGS', cogsView.error);
      var c = cogsView.data;
      if (!c) return '';
      /* R8: luôn 2 vế. Thiếu vế thực tế thì hiện "chưa đủ", tuyệt đối không
         lấy lý thuyết đắp vào cho ô trông đầy. */
      var actual = c.cogsActual === null
        ? 'Chưa đủ (' + c.missingActual.length + ' đơn thiếu)'
        : money(c.cogsActual);
      return '<div class="metric-grid">' +
        metric('COGS lý thuyết', money(c.cogsTheoretical)) +
        metric('COGS thực tế', actual) +
        metric('Chênh lệch', c.variance === null ? '—' : money(c.variance)) +
        metric('Chênh lệch %', c.variancePct === null ? '—' : c.variancePct.toFixed(1) + '%') +
        '</div>';
    }

    function pnlMarkup() {
      if (pnlView.loading) return '<div class="empty"><h3>Đang đọc P&amp;L…</h3></div>';

      if (varianceView.loading) return '<div class="empty"><h3>Đang đối chiếu giá vốn…</h3></div>';

      var v = varianceView.data;
      if (!v) return '';
      var actual = v.cogsActual === null ? 'Chưa đủ dữ liệu lô' : money(v.cogsActual);
      var tone = v.status === 'OK' ? 'success' : (v.status === 'UNKNOWN' ? 'neutral' : 'warning');
      return '<h3 class="report-sub">Đối chiếu thực tế với định mức</h3>' +

        '<span>' + esc(v.message) + '</span></div><div class="metric-grid">' +
        metric('Giá vốn định mức', money(v.cogsTheoretical)) + metric('Giá vốn thực tế', actual) +
        metric('Chênh lệch', v.variance === null ? '—' : money(v.variance)) +
        metric('Chênh lệch %', v.variancePct === null ? '—' : Number(v.variancePct).toFixed(1) + '%') +
        '</div>' + (v.possibleCauses && v.possibleCauses.length
          ? '<div class="result"><strong>Cần điều tra</strong><span>' +
            esc(v.possibleCauses.join(' · ')) + '</span></div>' : '');
    }

    function usageMarkup() {
      if (usageView.loading) return '<div class="empty"><h3>Đang đọc hao hụt…</h3></div>';
      if (usageView.error) return errorBox('Không đọc được hao hụt/tiêu thụ', usageView.error);
      var u = usageView.data;
      if (!u) return '';
      if (!u.rows.length) return '<div class="result"><span>Kỳ này không có bút toán kho nào.</span></div>';
      return '<h3 class="report-sub">Tiêu thụ · hao hụt · mất</h3>' +
        '<table class="report"><thead><tr><th>Mặt hàng</th><th>Nhập</th><th>Dùng</th>' +
        '<th>Hao</th><th>Mất</th><th>Chưa gắn lô</th></tr></thead><tbody>' +
        u.rows.map(function (r) {
          return '<tr><td>' + esc(r.itemName || r.itemId) + '</td><td>' + esc(r.received) +
            '</td><td>' + esc(r.consumed) + '</td><td>' + esc(r.waste) + '</td><td>' +
            /* Mất và tìm lại hiện cùng nhau: "mất 10 tìm lại 10" khác hẳn
               "không mất gì", gộp lại là xoá mất một sự kiện có thật. */
            esc(r.lost) + (r.found ? ' (tìm lại ' + esc(r.found) + ')' : '') +
            '</td><td>' + esc(r.untrackedQty) + '</td></tr>';
        }).join('') + '</tbody></table>' +
        (u.unknownTypes.length
          ? '<div class="result error"><strong>Có loại bút toán chưa khai</strong><span>' +
            esc(u.unknownTypes.join(', ')) + ' — số của các dòng này KHÔNG nằm trong bảng trên.</span></div>'
          : '');
    }

    function lossMarkup() {
      if (lossView.loading) return '<div class="empty"><h3>Đang đọc hao hụt và mất…</h3></div>';
      if (lossView.error) return errorBox('Không đọc được hao hụt và mất', lossView.error);
      var l = lossView.data;
      if (!l) return '';
      return '<h3 class="report-sub">Hao hụt và mất</h3><div class="metric-grid">' +
        metric('Hao hụt', l.totalWaste) + metric('Báo mất', l.totalLost) +

        (!l.rows.length ? '<div class="result"><span>Kỳ này không có hao hụt hoặc báo mất.</span></div>' :
          '<table class="report"><thead><tr><th>Mặt hàng</th><th>Hao hụt</th><th>Báo mất</th>' +
          '<th>Tìm lại</th><th>Unit liên quan</th></tr></thead><tbody>' + l.rows.map(function (row) {
            return '<tr><td>' + esc(row.itemName || row.itemId) + '</td><td>' + esc(row.waste) +
              '</td><td>' + esc(row.lost) + '</td><td>' + esc(row.found) + '</td><td>' +
              esc((row.unitIds || []).join(', ') || 'Chưa gắn Unit') + '</td></tr>';
          }).join('') + '</tbody></table>');
    }

    function valuationMarkup() {
      if (valuationView.loading) return '<div class="empty"><h3>Đang định giá tồn…</h3></div>';
      if (valuationView.error) return errorBox('Không định giá được tồn kho', valuationView.error);

      return '<h3 class="report-sub">Giá trị tồn kho</h3><div class="metric-grid">' +

        metric('Số lượng có lô', v.trackedQty) +

        metric('Tồn chưa gắn lô', v.untrackedQty) +
        metric('Giá trị phần chưa gắn lô',
          v.untrackedValue === null ? 'Không định giá được' : money(v.untrackedValue)) +
        '</div>';
    }

    function exportMarkup() {
      if (exportView.busy) return '<div class="result"><span>Đang dựng file…</span></div>';
      if (exportView.error) return errorBox('Không xuất được báo cáo', exportView.error);
      if (!exportView.file) return '';
      return '<div class="result"><strong>Đã dựng file ' + esc(exportView.file.title) + '</strong>' +
        '<span>' + esc(exportView.file.rowCount) + ' dòng · kỳ ' + esc(exportView.file.period) + '</span>' +
        exportView.file.notices.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') +
        '</div>';
