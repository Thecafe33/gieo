    validate: function (input) {
      if (!input || !ids.isId(input.menuItemId, 'item')) {
        return R.err('VALIDATION', 'CreateMenuItem cần menuItemId hợp lệ do caller cấp trước');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var made = menu.createMenuItem({
        menuItemId: input.menuItemId, storeId: ctx.storeId, name: input.name,
        prices: input.prices, categoryId: input.categoryId, recipeId: input.recipeId,
        toppingIds: input.toppingIds, displayOrder: input.displayOrder, color: input.color
      });
      if (R.isErr(made)) return made;

      var plan = pipeline.emptyPlan();
      pushMenuItem(plan, made.value);
      return R.ok(plan);
    }
  });

  var RenameMenuItem = pipeline.defineCommand({
    name: 'RenameMenuItem',
    authority: 'MASTER_CONFIGURE',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['renamemenuitem', input.menuItemId, input.editRef]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.menuItemId, 'item')) return R.err('VALIDATION', 'cần menuItemId hợp lệ');
      if (!input.editRef) return R.err('VALIDATION', 'RenameMenuItem cần editRef để chống sửa đúp');
      if (!input.menuItem) return R.err('VALIDATION', 'thiếu input.menuItem (denormalized, không tự tra catalog)');
      return R.ok(true);
    },

    execute: function (input) {
      var renamed = menu.rename(input.menuItem, input.newName);
      if (R.isErr(renamed)) return renamed;

      var plan = pipeline.emptyPlan();
      pushMenuItem(plan, renamed.value);
      return R.ok(plan);
    }
  });

  var LinkRecipeToMenuItem = pipeline.defineCommand({
    name: 'LinkRecipeToMenuItem',
    authority: 'MASTER_CONFIGURE',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['linkrecipe', input.menuItemId, input.editRef]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.menuItemId, 'item')) return R.err('VALIDATION', 'cần menuItemId hợp lệ');
      if (!input.editRef) return R.err('VALIDATION', 'LinkRecipeToMenuItem cần editRef để chống sửa đúp');
      if (!input.menuItem) return R.err('VALIDATION', 'thiếu input.menuItem (denormalized, không tự tra catalog)');
      return R.ok(true);
    },

    execute: function (input) {
      var linked = menu.linkRecipe(input.menuItem, input.recipeId === undefined ? null : input.recipeId);
      if (R.isErr(linked)) return linked;

      var plan = pipeline.emptyPlan();
      pushMenuItem(plan, linked.value);
      return R.ok(plan);
    }
  });

  var ArchiveMenuItem = pipeline.defineCommand({
    name: 'ArchiveMenuItem',
    authority: 'MASTER_CONFIGURE',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['archivemenuitem', input.menuItemId, input.editRef]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.menuItemId, 'item')) return R.err('VALIDATION', 'cần menuItemId hợp lệ');
      if (!input.editRef) return R.err('VALIDATION', 'ArchiveMenuItem cần editRef để chống ngưng-bán đúp');
      if (!input.menuItem) return R.err('VALIDATION', 'thiếu input.menuItem (denormalized, không tự tra catalog)');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var archived = menu.archive(input.menuItem, input.at || ctx.clock.now());
      if (R.isErr(archived)) return archived;

      var plan = pipeline.emptyPlan();
      pushMenuItem(plan, archived.value);
      return R.ok(plan);
    }
  });

  var RestoreMenuItem = pipeline.defineCommand({
    name: 'RestoreMenuItem',
    authority: 'MASTER_CONFIGURE',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['restoremenuitem', input.menuItemId, input.editRef]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.menuItemId, 'item')) return R.err('VALIDATION', 'cần menuItemId hợp lệ');
      if (!input.editRef) return R.err('VALIDATION', 'RestoreMenuItem cần editRef để chống khôi phục đúp');
      if (!input.menuItem) return R.err('VALIDATION', 'thiếu input.menuItem (denormalized, không tự tra catalog)');
      return R.ok(true);
    },

    execute: function (input) {
      var restored = menu.restore(input.menuItem);
      if (R.isErr(restored)) return restored;

      var plan = pipeline.emptyPlan();
      pushMenuItem(plan, restored.value);
      return R.ok(plan);
    }
  });

  var CreatePromotion = pipeline.defineCommand({
    name: 'CreatePromotion',
    authority: 'MASTER_CONFIGURE',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['createpromotion', input.promotionId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.promotionId, 'item')) {
        return R.err('VALIDATION', 'CreatePromotion cần promotionId hợp lệ do caller cấp trước');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var made = promotion.createPromotion({
        promotionId: input.promotionId, storeId: ctx.storeId, name: input.name,
        tier: input.tier, priority: input.priority, exclusivityGroup: input.exclusivityGroup,
        conditions: input.conditions, effect: input.effect, active: input.active
      });
      if (R.isErr(made)) return made;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'promotion', record: made.value });
      return R.ok(plan);
    }
  });

  return {
    CreateCategory: CreateCategory,
    CreateMenuItem: CreateMenuItem,
    RenameMenuItem: RenameMenuItem,
    LinkRecipeToMenuItem: LinkRecipeToMenuItem,
    ArchiveMenuItem: ArchiveMenuItem,
    RestoreMenuItem: RestoreMenuItem,
    CreatePromotion: CreatePromotion
  };
});

/* ===== src/layers/commands/inventory.js ===== */
/**
 * Lệnh kho — waste / nhận hàng / kiểm kê / mất-tìm-thấy.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-RAW-MATERIAL-V1.md, FIFO-CHAIN-TRACE-STOCK-COUNT-V1.md.
 * Gap: FIFO-CORE-ARCHITECTURE-V2.md §10b.2, §8, §9.
 *
 * Thay thế `applyStockTransaction` của QUANLY — §9 yêu cầu KHÔNG giữ bất kỳ hàm
 * nào ghi thẳng Firestore từ phía QUANLY. Ở đây không tồn tại code path nào ghi
 * thẳng `currentStock`: mọi thay đổi vật chất đi qua FIFO Engine, nên điều chỉnh
 * kiểm kê không còn bị lần recompute kế tiếp xoá âm thầm như legacy.
 */
GIEO.define('commands/inventory', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/unit',
  'fifo-core/allocation',
  'fifo-core/reconciliation',
  'hr/liability'
], function (ids, R, pipeline, unitLib, allocation, reconciliation, liabilityLib) {
  'use strict';

  /**
   * RecordWaste — hao hụt.
   *
   * §10b.2: legacy `_submitDrinkWasteImpl` xử lý cả prep lẫn nguyên liệu thô
   * trong CÙNG một hàm, nhưng nhánh prep gọi allocate qua FIFO (đúng) còn nhánh
   * nguyên liệu thô ghi thẳng sổ (sai, không allocate). Đây là bằng chứng kỹ
   * thuật đúng ĐÃ tồn tại sẵn, chỉ chưa áp dụng đồng nhất.
   *
   * Invariant ở đây: BẮT BUỘC allocate qua FIFO cho MỌI itemKind — không có
   * nhánh code riêng bỏ qua allocation theo domain.
   *
   * Hết lô để gánh hao hụt KHÔNG chặn ghi (quyết định chủ quán 2026-09, cùng
   * quyết định shortfall của RecordSale/RecordPrepProduction). Trước đây trả
   * `PRECONDITION` trừ khi `input.allowUntracked` — một điểm chặn MỚI so với
   * legacy (legacy ghi thẳng sổ không allocate, không chặn ai). Đã sửa: cơ chế
   * untrackedPendingDelta có sẵn bên dưới giờ chạy KHÔNG ĐIỀU KIỆN, kèm phát
   * `UntrackedConsumptionRecorded` để L9 tạo alert `UNTRACKED_CONSUMPTION`
   * cho QUANLY — không âm thầm.
   */
  var RecordWaste = pipeline.defineCommand({
    name: 'RecordWaste',
    /* §21: "Waste | YES | REVIEW/CORRECT". */
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['waste', input.wasteRef, input.itemId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.itemId, 'item')) return R.err('VALIDATION', 'RecordWaste cần itemId hợp lệ');
      if (typeof input.qty !== 'number' || !(input.qty > 0)) return R.err('VALIDATION', 'qty phải dương');
      if (!input.wasteRef) return R.err('VALIDATION', 'RecordWaste cần wasteRef để id xác định (bug #21)');
      if (!input.reason) return R.err('VALIDATION', 'hao hụt phải có lý do');
      if (input.domain !== 'raw' && input.domain !== 'prep') {
        return R.err('VALIDATION', "domain phải là 'raw' hoặc 'prep' — cả hai đi CÙNG một đường");
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['waste', input.wasteRef, input.itemId]);
      var ws = allocation.createWorkingSet(input.units || []);

      /* Cùng một lời gọi cho raw lẫn prep. Không có nhánh rẽ theo domain. */
      var r = allocation.allocateConsumption(ws, {
        itemId: input.itemId, qty: input.qty, operationId: opId
      });
      if (R.isErr(r)) return r;
      var alloc = r.value;

      plan.unitChanges = alloc.touchedUnits;
      alloc.allocations.forEach(function (a) {
        plan.ledgerEntries.push({
          domain: input.domain, type: 'WASTE', itemId: a.itemId, storeId: ctx.storeId,
          unitId: a.unitId, qtyDelta: -a.qty, unitCost: a.unitCost,
          costBasisVersionId: a.costBasisVersionId,
          businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: 'waste', referenceId: input.wasteRef, reason: input.reason
        });
      });

      /* Phần không có lô gánh vẫn phải vào sổ, qua đúng cơ chế
         untrackedPendingDelta (entry không có unitId) — không "biến mất".
         KHÔNG chặn ghi (chốt chủ quán 2026-09, cùng quyết định shortfall của
         RecordSale/RecordPrepProduction) — chỉ báo QUANLY qua alert. */
      if (alloc.shortfallQty > 0) {
        plan.ledgerEntries.push({
          domain: input.domain, type: 'WASTE', itemId: input.itemId, storeId: ctx.storeId,
          unitId: null, qtyDelta: -alloc.shortfallQty,
          businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: 'waste', referenceId: input.wasteRef,
          reason: input.reason + ' (phần không truy được lô)'
        });
        plan.events.push({
          type: 'UntrackedConsumptionRecorded',
          itemId: input.itemId,
          qty: alloc.shortfallQty,
          wasteRef: input.wasteRef,
          domain: input.domain,
          storeId: ctx.storeId,
          businessDate: ctx.businessDate
        });
      }

      /* §10b.2 cũng nói: chỉ 1/3 đường ghi waste của legacy có ingredientBreakdown
         dù kỹ thuật đã có sẵn. Ở đây nó luôn có, vì allocation vốn đã trả ra. */
      plan.domainRecords.push({
        type: 'wasteRecord',
        record: {
          wasteRef: input.wasteRef, itemId: input.itemId, qty: input.qty,
          domain: input.domain, reason: input.reason,
          actorId: ctx.actor.actorId, businessDate: ctx.businessDate,
          ingredientBreakdown: alloc.allocations.map(function (a) {
            return { unitId: a.unitId, qty: a.qty, cost: a.cost };
          }),
          wasteCost: alloc.totalCost,
          costComplete: alloc.costComplete
        }
      });

      plan.projectionRecomputes.push({ itemId: input.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  /**
   * AdjustInventory — điều chỉnh tồn, thay `applyStockTransaction` của QUANLY.
   *
   * Legacy ghi thẳng `currentStock` bỏ qua Unit Engine, nên điều chỉnh kiểm kê
   * bị lần tính lại kế tiếp xoá âm thầm. Ở đây điều chỉnh đi qua Unit: hoặc là
   * đối chiếu vật lý trên một Unit cụ thể, hoặc là ledger entry không có unitId
   * (tự cộng `untrackedPendingDelta` theo quy tắc §5).
   */
  var AdjustInventory = pipeline.defineCommand({
    name: 'AdjustInventory',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['adjust', input.adjustRef, input.itemId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.itemId, 'item')) return R.err('VALIDATION', 'cần itemId hợp lệ');
      if (!input.adjustRef) return R.err('VALIDATION', 'cần adjustRef để id xác định');
      if (!input.reason) return R.err('VALIDATION', 'điều chỉnh kho phải có lý do');
      var hasUnit = !!input.unitId;
      if (hasUnit && typeof input.actualQty !== 'number') {
        return R.err('VALIDATION', 'điều chỉnh trên 1 lô cụ thể cần actualQty (số cân được)');
      }
      if (!hasUnit && typeof input.qtyDelta !== 'number') {
        return R.err('VALIDATION', 'điều chỉnh phần không gắn lô cần qtyDelta');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['adjust', input.adjustRef, input.itemId]);

      if (input.unitId) {
        var unit = (input.units || []).filter(function (u) { return u.unitId === input.unitId; })[0];
        if (!unit) return R.err('NOT_FOUND', 'không tìm thấy lô ' + input.unitId);

        /* GHI ĐÈ TUYỆT ĐỐI qua Unit Engine — không cộng delta vào số cache. */
        var rc = reconciliation.physicalReconciliation(unit, {
          actualQty: input.actualQty, at: ctx.clock.now(),
          actorId: ctx.actor.actorId, operationId: opId,
          method: input.method || 'stock_count', reason: input.reason
        });
        if (R.isErr(rc)) return rc;

        plan.unitChanges.push(rc.value.unit);
        plan.ledgerEntries.push({
          domain: input.domain || 'raw', type: 'ADJUSTMENT', itemId: input.itemId,
          storeId: ctx.storeId, unitId: input.unitId,
          qtyDelta: rc.value.delta,
          businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: 'adjustment', referenceId: input.adjustRef, reason: input.reason
        });
        plan.domainRecords.push({ type: 'reconciliationRecord', record: rc.value.record });
      } else {
        plan.ledgerEntries.push({
          domain: input.domain || 'raw', type: 'ADJUSTMENT', itemId: input.itemId,
          storeId: ctx.storeId, unitId: null, qtyDelta: input.qtyDelta,
          businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: 'adjustment', referenceId: input.adjustRef, reason: input.reason
        });
      }

      plan.projectionRecomputes.push({ itemId: input.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  /** ReportLostContainer — POS báo mất. Chỉ tạo phiếu CHỜ DUYỆT. */
  var ReportLostContainer = pipeline.defineCommand({
    name: 'ReportLostContainer',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['lostreport', input.unitId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.unitId, 'unit')) return R.err('VALIDATION', 'cần unitId hợp lệ');
      if (!input.reason) return R.err('VALIDATION', 'báo mất phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var lostReportId = ids.deterministicId('operation', ['lostreport', input.unitId]);
      plan.domainRecords.push({
        type: 'lostReport',
        record: {
          lostReportId: lostReportId,
          unitId: input.unitId,
          /* CHỜ DUYỆT — Unit chưa vào nhánh LOST cho tới khi QUANLY duyệt.
             Đây chính là mắt xích legacy thiếu (Bug #12). */
          status: 'PENDING_REVIEW',
          reportedBy: ctx.actor.actorId,
          reportedAt: ctx.clock.now(),
          businessDate: ctx.businessDate,
          reason: input.reason
        }
      });
      plan.events.push({
        type: 'LostContainerReported',
        unitId: input.unitId, lostReportId: lostReportId,
        storeId: ctx.storeId, businessDate: ctx.businessDate
      });
      return R.ok(plan);
    }
  });

  /**
   * RestoreFoundContainer — tìm lại được.
   *
   * §8: giữ nguyên toàn bộ quyết định nghiệp vụ của legacy
   * (`submitFoundLostContainer`) — Unit "mới nguyên", KHÔNG suy luận lại phần
   * đã dùng trước khi mất. Chỉ thêm `operationId` xuyên suốt (fix Bug #24, nơi
   * bước ADJUSTMENT không có txId).
   */
  var RestoreFoundContainer = pipeline.defineCommand({
    name: 'RestoreFoundContainer',
    /* Ma trận §21: "Found | YES | REVIEW/CORRECT" — POS làm bằng EXECUTE,
       QUANLY làm bằng REVIEW/CORRECT. Cùng một command, hai lối vào hợp lệ. */
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['found', input.unitId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.unitId, 'unit')) return R.err('VALIDATION', 'cần unitId hợp lệ');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var unit = (input.units || []).filter(function (u) { return u.unitId === input.unitId; })[0];
      if (!unit) return R.err('NOT_FOUND', 'không tìm thấy lô ' + input.unitId);

      var opId = ids.deterministicId('operation', ['found', input.unitId]);
      var r = unitLib.restoreFound(unit, {
        at: ctx.clock.now(), actorId: ctx.actor.actorId, operationId: opId
      });
      if (R.isErr(r)) return r;

      var plan = pipeline.emptyPlan();
      plan.unitChanges.push(r.value);
      plan.ledgerEntries.push({
        domain: 'raw', type: 'FOUND', itemId: unit.itemId, storeId: ctx.storeId,
        unitId: unit.unitId, qtyDelta: r.value.remainingQty,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'found', referenceId: input.unitId,
        reason: 'tìm lại được container đã báo mất'
      });

      /* Hoàn khoản trừ trách nhiệm nhân viên — NGAY trong plan này, cùng lý
         do như ApproveLostContainer: đây là nghiệp vụ chính của việc tìm lại
         container, không phải side-effect tuỳ chọn chờ L9. `input.liability`
         là input denormalized (giống input.units): bản ghi liability hiện
         tại ứng với lostReportId của unit, nếu có — không phải mọi Unit LOST
         đều có liability (VD: không xác định được nhân viên từ trước khi
         tính năng này tồn tại), nên không có thì bỏ qua, không lỗi. */
      var liability = input.liability;
      if (liability && (liability.status === liabilityLib.STATUS.PENDING ||
          liability.status === liabilityLib.STATUS.WAIVED)) {
        var reversedR = liabilityLib.reverseLiability(liability, {
          at: ctx.clock.now(), actorId: ctx.actor.actorId, operationId: opId
        });
        if (R.isErr(reversedR)) return reversedR;
        plan.domainRecords.push({ type: 'liability', record: reversedR.value });
      }

      plan.events.push({
        type: 'ContainerFound',
        unitId: unit.unitId, storeId: ctx.storeId, businessDate: ctx.businessDate,
        lostReportId: unit.lostReportId
      });
      plan.projectionRecomputes.push({ itemId: unit.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  return {
    RecordWaste: RecordWaste,
    AdjustInventory: AdjustInventory,
    ReportLostContainer: ReportLostContainer,
    RestoreFoundContainer: RestoreFoundContainer
  };
});

/* ===== src/layers/commands/loyalty.js ===== */
/**
 * Loyalty — bọc `loyalty/accrual.js` thành command thật, đi qua ĐÚNG pipeline
 * chung (idempotency + quyền + audit) như mọi mutation khác.
 *
 * Đóng nửa sau của gap L9 (`NET-LOYALTY-V1.md`): luật tích/hoàn điểm đã viết
 * xong ở `loyalty/accrual.js` từ trước, nhưng chưa có command nào GỌI nó —
 * nên nó chưa bao giờ tạo ra domainRecord thật. `bootstrap/domain-events.js`
 * là tầng điều phối gọi các command này khi `SaleCompleted`/`SaleAmountIncreased`/
 * `OrderVoided` phát ra từ `commands/sales.js`/`commands/reversal.js`.
 *
 * Theo đúng nguyên tắc "denormalized command input" đã dùng xuyên toàn hệ:
 * command KHÔNG tự tra khách hàng hay sổ cũ — `customer`/`entries` phải do
 * caller mang tới sẵn. Thiếu khách hàng thì `accrual.js` tự trả `skipped`
 * tường minh (không đoán, không im lặng bỏ qua).
 */
GIEO.define('commands/loyalty', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'loyalty/accrual'
], function (ids, R, pipeline, accrual) {
  'use strict';

  function pushEntries(plan, entries) {
    (entries || []).forEach(function (e) {
      plan.domainRecords.push({ type: 'loyaltyLedgerEntry', record: e });
    });
  }

  /** L2 — tích điểm/tem cho 1 bill đã thanh toán (event SaleCompleted). */
  var AccrueLoyaltyForSale = pipeline.defineCommand({
    name: 'AccrueLoyaltyForSale',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['loyalty-accrue-sale', input.bill && input.bill.billId]);
    },

    validate: function (input) {
      if (!input || !input.bill) return R.err('VALIDATION', 'AccrueLoyaltyForSale cần bill');
      if (!ids.isId(input.bill.billId, 'bill')) return R.err('VALIDATION', 'bill thiếu billId hợp lệ');
      return R.ok(true);
    },

    execute: function (input) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['loyalty-accrue-sale', input.bill.billId]);
      var r = accrual.accrueForSale({
        bill: input.bill,
        customer: input.customer || null,
        stampsEarnedToday: input.stampsEarnedToday || 0,
        operationId: opId
      });
      if (R.isErr(r)) return r;
      pushEntries(plan, r.value.entries);
      return R.ok(plan);
    }
  });

  /** L4 — đóng gap addon không cộng điểm (event SaleAmountIncreased). */
  var AccrueLoyaltyForAddon = pipeline.defineCommand({
    name: 'AccrueLoyaltyForAddon',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['loyalty-accrue-addon', input.billId, String(input.addonSeq)]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.billId, 'bill')) return R.err('VALIDATION', 'AccrueLoyaltyForAddon cần billId');
      if (input.addonSeq === undefined || input.addonSeq === null) {
        return R.err('VALIDATION', 'AccrueLoyaltyForAddon cần addonSeq');
      }
      if (typeof input.addedAmount !== 'number' || input.addedAmount <= 0) {
        return R.err('VALIDATION', 'addon phải có số tiền tăng thêm dương');
      }
      return R.ok(true);
    },

    execute: function (input) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['loyalty-accrue-addon', input.billId, String(input.addonSeq)]);
      var r = accrual.accrueForAddon({
        customer: input.customer || null,
        operationId: opId,
        addedAmount: input.addedAmount,
        billId: input.billId,
        addonSeq: input.addonSeq,
        storeId: input.storeId,
        businessDate: input.businessDate,
        occurredAt: input.occurredAt,
        actorId: input.actorId
      });
      if (R.isErr(r)) return r;
      pushEntries(plan, r.value.entries);
      return R.ok(plan);
    }
  });

  /**
   * L5 — hoàn điểm/tem khi huỷ bill (event OrderVoided).
   *
   * `policy` mặc định `REVERSE` (chốt chủ quán 2026-09, `NET-LOYALTY-V1.md`
   * L5: "Khi hủy phải thu hồi điểm"). Trước đây bắt buộc caller khai rõ vì
   * chưa chốt REVERSE hay KEEP; giờ đã chốt nên mặc định áp dụng khi caller
   * không truyền — nhưng vẫn CHO PHÉP truyền `'KEEP'` tường minh cho ca đặc
   * biệt (không tự ý loại bỏ đường thoát, chỉ đổi mặc định). Giá trị khác
   * REVERSE/KEEP vẫn là lỗi validate, không âm thầm coi như REVERSE.
   */
  var ReverseLoyaltyForVoidedBill = pipeline.defineCommand({
    name: 'ReverseLoyaltyForVoidedBill',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['loyalty-reverse', input.billId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.billId, 'bill')) return R.err('VALIDATION', 'ReverseLoyaltyForVoidedBill cần billId');
      var policy = input.policy || 'REVERSE';
      if (policy !== 'REVERSE' && policy !== 'KEEP') {
        return R.err('VALIDATION',
          "policy phải là 'REVERSE' hoặc 'KEEP' nếu truyền — mặc định 'REVERSE' " +
          "khi không truyền (NET-LOYALTY-V1.md L5)");
      }
      return R.ok(true);
    },

    execute: function (input) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['loyalty-reverse', input.billId]);
      var r = accrual.reverseForVoidedBill({
        policy: input.policy || 'REVERSE',
        billId: input.billId,
        entries: input.entries || [],
        operationId: opId,
        businessDate: input.businessDate,
        occurredAt: input.occurredAt,
        actorId: input.actorId
      });
      if (R.isErr(r)) return r;
      pushEntries(plan, r.value.entries);
      return R.ok(plan);
    }
  });

  return {
    AccrueLoyaltyForSale: AccrueLoyaltyForSale,
    AccrueLoyaltyForAddon: AccrueLoyaltyForAddon,
    ReverseLoyaltyForVoidedBill: ReverseLoyaltyForVoidedBill
  };
});

/* ===== src/layers/commands/payroll.js ===== */
/**
 * Lệnh Payroll — điểm nối còn thiếu.
 *
 * hr/payroll.js (closePayroll) và hr/shift.js (reviseShift) đúng nhưng KHÔNG
 * có defineCommand() nào gọi tới — 0 importer trong toàn bộ src/layers, nên
 * không cách nào chạm tới được dù logic đã viết sẵn. Quyết định chủ quán
 * ("tìm chỗ nối vào hợp lý"): nối theo ĐÚNG pattern commands/shift.js đã
 * dùng cho CheckIn/CheckOut, không phát minh cơ chế mới.
 */
GIEO.define('commands/payroll', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'hr/shift',
  'hr/payroll',
  'hr/liability'
], function (ids, R, pipeline, shiftLib, payrollLib, liabilityLib) {
  'use strict';

  /**
   * ReviseAttendance — nối hr/shift.reviseShift() vào command layer.
   * `revisionRef` là id xác định do caller cấp (cùng vai trò wasteRef/adjustRef
   * ở commands/inventory.js) — sửa chấm công không có input tự nhiên nào là
   * duy nhất, nên không có nó thì không dựng được operationId ổn định.
   */
  var ReviseAttendance = pipeline.defineCommand({
    name: 'ReviseAttendance',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['reviseattendance', input.shift.shiftId, input.revisionRef]);
    },

    validate: function (input) {
      if (!input || !input.shift || !ids.isId(input.shift.shiftId, 'shift')) {
        return R.err('VALIDATION', 'ReviseAttendance cần shift hợp lệ');
      }
      if (!input.revisionRef) return R.err('VALIDATION', 'ReviseAttendance cần revisionRef để id xác định');
      if (!input.reason) return R.err('VALIDATION', 'sửa chấm công phải có lý do');
      if (!input.changes || (input.changes.checkedInAt === undefined && input.changes.checkedOutAt === undefined)) {
        return R.err('VALIDATION', 'ReviseAttendance cần ít nhất 1 thay đổi giờ');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var opId = ids.deterministicId('operation', ['reviseattendance', input.shift.shiftId, input.revisionRef]);
      var revised = shiftLib.reviseShift(input.shift, input.changes, {
        actorId: ctx.actor.actorId,
        operationId: opId,
        reason: input.reason,
        at: ctx.clock.now(),
        isCurrentBusinessDate: input.shift.businessDate === ctx.businessDate
      });
      if (R.isErr(revised)) return revised;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'employeeShift', record: revised.value.shift });
      revised.value.events.forEach(function (e) { plan.events.push(e); });
      return R.ok(plan);
    }
  });

  /**
   * ClosePayroll — nối hr/payroll.closePayroll() vào command layer.
   *
   * `input.results` = computePayroll() đã chạy sẵn cho từng nhân viên trong
   * kỳ (đọc-tính rồi mới chốt, giống mọi report khác — closePayroll không tự
   * tính lại). Khoản trừ trách nhiệm nhân viên (input.liabilities, khớp qua
   * appliedLiabilityIds đã đóng băng trong từng dòng) được chuyển sang
   * DEDUCTED NGAY trong cùng mutation này — không đợi L9.
   */
  var ClosePayroll = pipeline.defineCommand({
    name: 'ClosePayroll',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation',
        ['closepayroll', input.storeId, input.monthKey, String(input.revisionNo || 1)]);
    },

    validate: function (input) {
      if (!input || !input.monthKey || !/^\d{4}-\d{2}$/.test(input.monthKey)) {
        return R.err('VALIDATION', 'ClosePayroll cần monthKey dạng YYYY-MM');
      }
      if (!ids.isId(input.storeId, 'store')) return R.err('VALIDATION', 'ClosePayroll cần storeId hợp lệ');
      if (!Array.isArray(input.results) || input.results.length === 0) {
        return R.err('VALIDATION', 'ClosePayroll cần results (computePayroll đã tính cho từng nhân viên)');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var opId = ids.deterministicId('operation',
        ['closepayroll', input.storeId, input.monthKey, String(input.revisionNo || 1)]);

      var closed = payrollLib.closePayroll({
        monthKey: input.monthKey,
        storeId: input.storeId,
        actorId: ctx.actor.actorId,
        operationId: opId,
        at: ctx.clock.now(),
        results: input.results,
        acknowledgeReview: input.acknowledgeReview,
        revisionNo: input.revisionNo,
        supersedesClosingId: input.supersedesClosingId
      });
      if (R.isErr(closed)) return closed;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'payrollClosing', record: closed.value });

      /* Khoản trừ đã đóng băng vào lương kỳ này → chuyển DEDUCTED. Dùng đúng
         appliedLiabilityIds đã đóng băng trong closing.lines — không tính lại
         "ai bị trừ", vì số đã chốt rồi. */
      var liabilitiesById = Object.create(null);
      (input.liabilities || []).forEach(function (l) { liabilitiesById[l.liabilityId] = l; });

      var deductError = null;
      closed.value.lines.forEach(function (line) {
        (line.appliedLiabilityIds || []).forEach(function (liabilityId) {
          if (deductError) return;
          var liability = liabilitiesById[liabilityId];
          if (!liability) return;
          var d = liabilityLib.markDeducted(liability, {
            at: ctx.clock.now(), payrollClosingId: closed.value.payrollClosingId
          });
          if (R.isErr(d)) { deductError = d; return; }
          plan.domainRecords.push({ type: 'liability', record: d.value });
        });
      });
      if (deductError) return deductError;

      return R.ok(plan);
    }
  });

  return {
    ReviseAttendance: ReviseAttendance,
    ClosePayroll: ClosePayroll
  };
});

/* ===== src/layers/commands/pipeline.js ===== */
/**
 * Command pipeline — đường ghi DUY NHẤT của cả POS lẫn QUANLY.
 *
 * Contract: GIEO-SYSTEM-REBUILD-PLAN.md §2/§12, FIFO-CORE-ARCHITECTURE-V2.md §7.
 *
 *   VALIDATE → AUTHORIZE → READ CANONICAL → CALCULATE → MUTATION PLAN
 *            → IDEMPOTENCY → ENGINE → LEDGER → PROJECTION → AUDIT → VERIFY
 *
 * ────────────────────────────────────────────────────────────────────────
 * IDEMPOTENCY — legacy có 3 lớp bảo vệ ở đường bán hàng chính
 * (`applySalesConsumptionPOS`) nhưng 6 đường khác thiếu ít nhất 1 lớp:
 *   #6  not-empty        — busy-lock đặt SAU await
 *   #13 stock count      — dùng .add() sinh id ngẫu nhiên
 *   #21 BTP waste        — không catch/rollback sau khi đã allocate
 *   #22 start prep batch — thiếu txId cố định
 *   #23 add-on tăng      — thiếu txId cố định
 *   #24 found-lost       — bước ADJUSTMENT không có txId
 *
 * Nguyên nhân gốc: mỗi hàm TỰ CHẾ lớp chống-đúp riêng. Ở đây chỉ có MỘT chỗ
 * implement, và command không có cách nào tự chế lớp khác — nó chỉ mô tả việc
 * cần làm, pipeline lo phần còn lại.
 *
 * §10b.3 bổ sung tường minh: idempotency áp cho MỌI command, kể cả Approval
 * (ApproveStockCount, ApproveLostContainer, ApproveExpense) — legacy để approval
 * không kiểm tra status trước khi apply, nên 2 người duyệt cùng lúc cộng đúp.
 * ────────────────────────────────────────────────────────────────────────
 */
GIEO.define('commands/pipeline', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'shared-kernel/operation-state',
  'store-context/access'
], function (ids, R, opState, access) {
  'use strict';

  var STATES = opState.STATES;

  /**
   * Kho operation. Đây là port — bản in-memory dùng cho test và shadow;
   * persistence-firebase implement bản thật với compare-and-swap.
   */
  function createInMemoryOperationStore() {
    var ops = Object.create(null);
    return {
      get: function (operationId) {
        return R.ok(ops[operationId] || null);
      },
      /** Giành quyền chạy. Trả CONFLICT nếu đã có người giữ. */
      claim: function (record) {
        var existing = ops[record.operationId];
        if (existing) {
          if (existing.status === STATES.COMPLETED) {
            return R.err('CONFLICT', 'operation đã hoàn tất', { existing: existing });
          }
          if (existing.status === STATES.RUNNING) {
            return R.err('CONFLICT', 'operation đang chạy ở nơi khác', { existing: existing });
          }
        }
        ops[record.operationId] = record;
        return R.ok(record);
      },
      update: function (operationId, patch) {
        if (!ops[operationId]) return R.err('NOT_FOUND', 'không có operation ' + operationId);
        ops[operationId] = Object.assign({}, ops[operationId], patch);
        return R.ok(ops[operationId]);
      },
      all: function () { return Object.keys(ops).map(function (k) { return ops[k]; }); }
    };
  }

  /**
   * Khai báo 1 command. Đăng ký quyền LUÔN tại đây, nên không thể có command
   * chạy được mà quên khai quyền (mặc định đóng — access.authorize từ chối
   * command lạ).
   *
   * @param spec.name
   * @param spec.authority, spec.mutates, spec.sources, spec.crossStore  → access
   * @param spec.operationId  (input, ctx) => string  — BẮT BUỘC xác định
   * @param spec.requiresOpenDay  mặc định = mutates
   * @param spec.validate     (input, ctx) => Result
   * @param spec.execute      (input, ctx) => Result<MutationPlan>
   */
  function defineCommand(spec) {
    if (!spec || !spec.name) throw new Error('[pipeline] command cần name');
    if (typeof spec.operationId !== 'function') {
      throw new Error('[pipeline] command "' + spec.name + '" phải khai hàm operationId — ' +
        'id ngẫu nhiên làm sập idempotency (bug #13/#21/#22/#23/#24)');
    }
    if (typeof spec.execute !== 'function') {
      throw new Error('[pipeline] command "' + spec.name + '" cần execute');
    }

    access.registerCommand(spec.name, {
      authority: spec.authority,
      mutates: spec.mutates,
      sources: spec.sources,
      crossStore: spec.crossStore
    });

    return {
      name: spec.name,
      mutates: spec.mutates,
      requiresOpenDay: spec.requiresOpenDay === undefined ? spec.mutates : spec.requiresOpenDay,
      operationId: spec.operationId,
      validate: spec.validate || function () { return R.ok(true); },
      execute: spec.execute
    };
  }

  /**
   * Chạy 1 command qua đủ pipeline.
   *
   * `deps.operationStore` bắt buộc. `deps.commit` là ranh giới ghi nguyên tử —
   * nhận MutationPlan, ghi tất cả hoặc không ghi gì. Không có commit thì chạy ở
   * chế độ DRY-RUN (dùng cho shadow/simulate, đúng giai đoạn READ-ONLY hiện tại).
   */
  function run(command, input, ctx, deps) {
    deps = deps || {};
    var store = deps.operationStore;
    if (!store) return R.err('VALIDATION', 'pipeline cần operationStore');

    /* 1. VALIDATE */
    var v = command.validate(input, ctx);
    if (R.isErr(v)) return v;

    /* 2. AUTHORIZE — ở tầng Command/Domain, không phải UI (invariant #17) */
    var auth = ctx.authorize(command.name, input.storeId || ctx.storeId);
    if (R.isErr(auth)) return auth;

    /* 3. GATE ngày làm việc — ngày đã chốt thì khoá thao tác vận hành */
    if (command.requiresOpenDay) {
      var day = ctx.assertOperable(command.name);
      if (R.isErr(day)) return day;
    }

    /* 4. IDEMPOTENCY — id xác định, không bao giờ ngẫu nhiên */
    var operationId;
    try {
      operationId = command.operationId(input, ctx);
    } catch (e) {
      return R.err('VALIDATION', 'không dựng được operationId: ' + e.message);
    }
    if (!ids.isId(operationId, 'operation')) {
      return R.err('VALIDATION', 'operationId phải là id loại operation, nhận: ' + operationId);
    }

    var prior = store.get(operationId);
    if (R.isErr(prior)) return prior;
    if (prior.value && prior.value.status === STATES.COMPLETED) {
      /* Chạy lại là NO-OP trả kết quả cũ — không phải làm lại. */
      return R.ok({
        operationId: operationId,
        status: STATES.COMPLETED,
        replayed: true,
        result: prior.value.result
      });
    }

    var claim = store.claim({
      operationId: operationId,
      command: command.name,
      status: STATES.RUNNING,
      actorId: ctx.actor.actorId,
      storeId: ctx.storeId,
      businessDate: ctx.businessDate,
      startedAt: ctx.clock.now(),
      result: null
    });
    if (R.isErr(claim)) return claim;

    /* 5. CALCULATE + MUTATION PLAN */
    var planR;
    try {
      planR = command.execute(input, ctx);
    } catch (e) {
      store.update(operationId, { status: STATES.FAILED_MANUAL_REVIEW, error: e.message });
      return R.err('MANUAL_REVIEW', 'command "' + command.name + '" ném lỗi: ' + e.message);
    }
    if (R.isErr(planR)) {
      /* Chưa chạm vào state vật lý nên thất bại ở đây là thử lại được. */
      store.update(operationId, {
        status: R.isRetryable(planR) ? STATES.FAILED_RETRYABLE : STATES.FAILED_MANUAL_REVIEW,
        error: planR.error.message
      });
      return planR;
    }

    var plan = planR.value;
    plan.operationId = operationId;
    /* 6. AUDIT — gắn sẵn, không để command tự nhớ (§25) */
    plan.audit = Object.assign(ctx.auditBase(operationId), {
      command: command.name,
      reason: input.reason || null
    }, plan.audit || {});

    /* 7. COMMIT — ranh giới nguyên tử */
    if (!deps.commit) {
      /* runAndCommit dùng planningOnly: giữ claim ở RUNNING cho tới khi
         transaction thật kết thúc. Nếu đánh COMPLETED tại đây, request thứ hai
         có thể nhận replay giả trong lúc commit đầu vẫn đang pending/hỏng. */
      if (!deps.planningOnly) {
        store.update(operationId, { status: STATES.COMPLETED, result: plan, dryRun: true });
      }
      return R.ok({
        operationId: operationId,
        status: deps.planningOnly ? STATES.RUNNING : STATES.COMPLETED,
        /* Giữ cùng hình dạng với đường commit thật — caller không phải phân biệt
           dry-run hay không để biết đây có phải lần chạy đầu. */
        replayed: false,
        dryRun: true,
        plan: plan
      });
    }

    var committed = deps.commit(plan, ctx);
    if (R.isErr(committed)) {
      /* Ghi hỏng sau khi đã tính toán: KHÔNG nuốt lỗi (invariant #11).
         Rollback nằm TRONG cùng command, không phải bước riêng dễ quên. */
      var rolledBack = null;
      if (deps.rollback) rolledBack = deps.rollback(plan, ctx);
      store.update(operationId, {
        status: R.isRetryable(committed) ? STATES.FAILED_RETRYABLE : STATES.FAILED_MANUAL_REVIEW,
        error: committed.error.message,
        rolledBack: rolledBack ? R.isOk(rolledBack) : false
      });
      return committed;
    }

    store.update(operationId, { status: STATES.COMPLETED, result: committed.value });
    return R.ok({
      operationId: operationId,
      status: STATES.COMPLETED,
      replayed: false,
      plan: plan,
      result: committed.value
    });
  }

  /**
   * Chạy command RỒI GHI THẬT.
   *
   * `run()` ở trên cố ý đồng bộ: nó dựng MutationPlan, và dựng plan là việc
   * thuần tính toán. Nhưng ghi Firebase thì bất đồng bộ. Trộn hai thứ vào một
   * hàm lúc trả Promise lúc trả giá trị là API dễ dùng sai, nên tách hẳn:
   *
   *   run()           → dry-run, đồng bộ, dùng cho shadow/simulate và test
   *   runAndCommit()  → Promise, dùng khi đã có adapter ghi thật
   *
   * Giai đoạn hiện tại hệ thống chạy READ-ONLY nên đường dùng chủ yếu vẫn là
   * run(); runAndCommit() có sẵn để cutover không phải sửa lại pipeline.
   */
  function runAndCommit(command, input, ctx, deps) {
    deps = deps || {};
    if (typeof deps.commit !== 'function') {
      return Promise.resolve(R.err('VALIDATION', 'runAndCommit cần deps.commit'));
    }

    /* Chạy pha dựng plan ở chế độ dry-run để tái dùng nguyên vẹn mọi chốt chặn
       (validate → authorize → gate ngày → idempotency) mà không nhân bản logic. */
    var planned = run(command, input, ctx, {
      operationStore: deps.operationStore,
      planningOnly: true
    });
    if (R.isErr(planned)) return Promise.resolve(planned);
    if (planned.value.replayed) return Promise.resolve(planned.value);

    var plan = planned.value.plan;
    return Promise.resolve()
      .then(function () { return deps.commit(plan, ctx); })
      .then(function (committed) {
        if (R.isErr(committed)) {
          var rolledBack = null;
          if (deps.rollback) rolledBack = deps.rollback(plan, ctx);
          deps.operationStore.update(plan.operationId, {
            status: R.isRetryable(committed) ? STATES.FAILED_RETRYABLE : STATES.FAILED_MANUAL_REVIEW,
            error: committed.error.message,
            rolledBack: rolledBack ? R.isOk(rolledBack) : false
          });
          return committed;
        }
        deps.operationStore.update(plan.operationId, {
          status: STATES.COMPLETED, result: committed.value, dryRun: false
        });
        return R.ok({
          operationId: plan.operationId,
          status: STATES.COMPLETED,
          replayed: false,
          plan: plan,
          result: committed.value
        });
      });
  }

  /**
   * MutationPlan rỗng — command bồi vào. Một plan mang TẤT CẢ thay đổi của một
   * operation (vật chất + ledger + projection + trace), để commit được nguyên tử.
   */
  function emptyPlan() {
    return {
      operationId: null,
      unitChanges: [],
      ledgerEntries: [],
      projectionRecomputes: [],
      traceChanges: [],
      domainRecords: [],
      events: [],
      audit: null
    };
  }

  return {
    createInMemoryOperationStore: createInMemoryOperationStore,
    defineCommand: defineCommand,
    run: run,
    runAndCommit: runAndCommit,
    emptyPlan: emptyPlan
  };
});

/* ===== src/layers/commands/prep.js ===== */
/**
 * Lệnh BTP — nấu mẻ, sửa yield, đối chiếu cuối ca.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-BTP-V1.md.
 *
 * Mẻ BTP nấu xong tạo ra một `StockUnit` do FIFO sở hữu với `itemKind='prep'`,
 * nên BTP đi qua ĐÚNG một engine với nguyên liệu thô — không có đường kho song
 * song. Đây là điều kiện để actual-vs-theoretical áp được cho cả hai.
 *
 * Waste BTP dùng chung `commands/inventory.RecordWaste` (domain 'prep'), nên
 * `ingredientBreakdown` luôn có bất kể trigger từ đâu — đóng đứt chuỗi #2 của
 * chain-trace, nơi legacy có 2 code path ghi cùng `type:WASTE` với field khác
 * nhau và đường phổ biến nhất (hết hạn cuối ca) thì thiếu breakdown.
 *
 * Hết nguyên liệu thô KHÔNG chặn nấu mẻ (quyết định chủ quán 2026-09, cùng
 * quyết định với RecordSale — SOP cho phép thay nguyên liệu khi hết). Trước
 * đây trả `PRECONDITION` ngay khi `alloc.shortfalls.length`, không có cờ
 * thoát — CHẶT HƠN cả RecordSale/RecordWaste cùng thời điểm đó. Đã sửa: mỗi
 * shortfall đi qua `allocation.handleShortfall` (§3.3), Unit gánh nợ gắn
 * `needsReview`, phát `IngredientShortfallRecorded` để L9 tạo alert
 * `UNIT_NEEDS_REVIEW`.
 */
GIEO.define('commands/prep', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/unit',
  'fifo-core/allocation',
  'recipe-cost-btp/btp',
  'recipe-cost-btp/recipe'
], function (ids, R, pipeline, unitLib, allocation, btpLib, recipeLib) {
  'use strict';

  /**
   * RecordPrepProduction — nấu xong một mẻ.
   *
   * Trừ nguyên liệu thô qua FIFO (nên có giá vốn thật), rồi tạo một Unit BTP
   * mang giá vốn = tổng nguyên liệu / yield thật của chính mẻ đó.
   */
  var RecordPrepProduction = pipeline.defineCommand({
    name: 'RecordPrepProduction',
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['prep', input.batchRef]);
    },

    validate: function (input) {
      if (!input || !input.batchRef) {
        return R.err('VALIDATION', 'RecordPrepProduction cần batchRef để id xác định (bug #22)');
      }
      if (!ids.isId(input.prepItemId, 'prepItem')) return R.err('VALIDATION', 'cần prepItemId hợp lệ');
      if (!ids.isId(input.prepStockItemId, 'item')) {
        return R.err('VALIDATION', 'cần prepStockItemId — BTP là một mặt hàng kho như mọi mặt hàng khác');
      }
      if (typeof input.actualYield !== 'number' || !(input.actualYield > 0)) {
        return R.err('VALIDATION', 'actualYield phải dương');
      }
      if (!input.deps || !input.deps.versionRegistry) {
        return R.err('VALIDATION', 'RecordPrepProduction cần versionRegistry');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['prep', input.batchRef]);
      var reg = input.deps.versionRegistry;

      /* Định mức mẻ resolve theo thời điểm nấu, không phải bản mới nhất. */
      var rv = recipeLib.resolveRecipeAt(reg, {
        recipeId: input.recipeId, storeId: ctx.storeId, at: input.at || ctx.clock.now()
      });
      if (R.isErr(rv)) return rv;
      var rr = recipeLib.toRequirements(rv.value, { size: input.size || 'BATCH', qty: input.batchCount || 1 });
      if (R.isErr(rr)) return rr;

      /* Trừ nguyên liệu thô qua CÙNG engine với bán hàng. */
      var ws = allocation.createWorkingSet(input.deps.units || []);
      var allocR = allocation.allocateMany(ws, rr.value.requirements, { operationId: opId });
      if (R.isErr(allocR)) return allocR;
      var alloc = allocR.value;

      /*
       * Hết nguyên liệu thật KHÔNG chặn nấu mẻ (chốt chủ quán 2026-09, cùng
       * quyết định với RecordSale — SOP cho phép thay nguyên liệu khi hết).
       * Phần thiếu thành NỢ tường minh trên Unit (§3.3 handleShortfall), gắn
       * needsReview, báo QUANLY qua alert thay vì chặn nhân viên bếp.
       */
      var prepBatchId = ids.deterministicId('prepBatch', [input.batchRef]);
      var shortfallEvents = [];
      for (var sfi = 0; sfi < alloc.shortfalls.length; sfi++) {
        var shortfall = alloc.shortfalls[sfi];
        var sfR = allocation.handleShortfall(ws, shortfall, {
          at: input.at || ctx.clock.now(),
          operationId: opId
        });
        if (R.isErr(sfR)) return sfR;
        if (sfR.value.debtUnit) {
          shortfallEvents.push({
            type: 'IngredientShortfallRecorded',
            unitId: sfR.value.debtUnit.unitId,
            itemId: shortfall.itemId,
            shortfallQty: shortfall.shortfallQty,
            prepBatchId: prepBatchId,
            storeId: ctx.storeId,
            businessDate: ctx.businessDate
          });
        }
      }

      /* Yield kỳ vọng để tính variance — lấy version có hiệu lực lúc nấu. */
      var expected = null;
      var yieldVersionId = null;
      var yv = btpLib.resolveYieldAt(reg, {
        prepItemId: input.prepItemId, storeId: ctx.storeId, at: input.at || ctx.clock.now()
      });
      if (R.isOk(yv)) {
        expected = yv.value.payload.yieldPerBatch * (input.batchCount || 1);
        yieldVersionId = yv.value.versionId;
      }

      var batchR = btpLib.createBatch({
        prepBatchId: prepBatchId,
        prepItemId: input.prepItemId,
        storeId: ctx.storeId,
        actualYield: input.actualYield,
        expectedYield: expected,
        yieldVersionId: yieldVersionId,
        rawCost: alloc.totalCost,
        recipeVersionId: rr.value.recipeVersionId,
        at: input.at || ctx.clock.now(),
        actorId: ctx.actor.actorId,
        businessDate: ctx.businessDate,
        expiresAt: input.expiresAt,
        operationId: opId
      });
      if (R.isErr(batchR)) return batchR;
      var batch = batchR.value;

      /* Sản phẩm của mẻ là một Unit FIFO thật, itemKind='prep'. */
      var outUnitR = unitLib.createUnit({
        unitId: ids.deterministicId('unit', ['prep', input.batchRef]),
        itemId: input.prepStockItemId,
        storeId: ctx.storeId,
        itemKind: 'prep',
        initialQty: input.actualYield,
        costBasis: {
          unitCost: batch.costPerUnit,
          versionId: yieldVersionId,
          source: 'BTP_PRODUCTION'
        },
        receiptId: batch.prepBatchId,
        receivedAt: input.at || ctx.clock.now(),
        receivedBy: ctx.actor.actorId,
        operationId: opId
      });
      if (R.isErr(outUnitR)) return outUnitR;

      /* ws.all() sau khi handleShortfall để bắt luôn Unit gánh nợ — touchedUnits
         của alloc.plans là ảnh chụp TRƯỚC handleShortfall, thiếu cờ needsReview
         và field debt vừa gắn. */
      plan.unitChanges = ws.all().filter(function (u) {
        var before = (input.deps.units || []).filter(function (o) { return o.unitId === u.unitId; })[0];
        return before && before.remainingQty !== u.remainingQty;
      }).concat([outUnitR.value]);

      alloc.plans.forEach(function (p) {
        p.allocations.forEach(function (a) {
          plan.ledgerEntries.push({
            domain: 'raw', type: 'CONSUMPTION', itemId: a.itemId, storeId: ctx.storeId,
            unitId: a.unitId, qtyDelta: -a.qty, unitCost: a.unitCost,
            costBasisVersionId: a.costBasisVersionId,
            businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
            occurredAt: input.at || ctx.clock.now(),
            referenceType: 'prepBatch', referenceId: batch.prepBatchId
          });
          /* Lineage: mẻ → nguyên liệu → Unit → UnitBase trước/sau. */
          plan.traceChanges.push({
            prepBatchId: batch.prepBatchId, unitId: a.unitId, itemId: a.itemId,
            qty: a.qty, unitBaseBefore: a.unitBaseBefore, unitBaseAfter: a.unitBaseAfter,
            recipeVersionIds: [rr.value.recipeVersionId]
          });
        });
      });

      plan.ledgerEntries.push({
        domain: 'prep', type: 'RECEIVING', itemId: input.prepStockItemId, storeId: ctx.storeId,
        unitId: outUnitR.value.unitId, qtyDelta: input.actualYield,
        unitCost: batch.costPerUnit,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: input.at || ctx.clock.now(),
        referenceType: 'prepBatch', referenceId: batch.prepBatchId
      });

      plan.domainRecords.push({ type: 'prepBatch', record: batch });

      /* Lệch yield nhiều thì báo — legacy có alert này, giữ nguyên. */
      if (batch.yieldVariancePct !== null && Math.abs(batch.yieldVariancePct) > (input.yieldAlertPct || 10)) {
        plan.events.push({
          type: 'PrepYieldMismatch',
          prepBatchId: batch.prepBatchId, prepItemId: input.prepItemId,
          expectedYield: expected, actualYield: input.actualYield,
          variancePct: batch.yieldVariancePct,
          storeId: ctx.storeId, businessDate: ctx.businessDate
        });
      }

      plan.projectionRecomputes.push({ itemId: input.prepStockItemId, storeId: ctx.storeId });
      shortfallEvents.forEach(function (evt) { plan.events.push(evt); });
      return R.ok(plan);
    }
  });

  /**
   * EditPrepYield — sửa yield mẻ đã nấu.
   *
   * Điểm khác legacy: sửa yield KHÔNG đẩy sang một trung bình động
   * (`prep_items.yieldActualAvg`) mà mọi ngày quá khứ đều đọc. Giá vốn được
   * tính lại cho CHÍNH mẻ này, nên COGS các ngày cũ không trôi.
   */
  var EditPrepYield = pipeline.defineCommand({
    name: 'EditPrepYield',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['yieldedit', input.prepBatchId, String(input.editSeq || 1)]);
    },

    validate: function (input) {
      if (!input || !input.prepBatchId) return R.err('VALIDATION', 'cần prepBatchId');
      if (!input.reason) return R.err('VALIDATION', 'sửa yield phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      if (!input.batch) return R.err('NOT_FOUND', 'không tìm thấy mẻ');
      var opId = ids.deterministicId('operation', ['yieldedit', input.prepBatchId, String(input.editSeq || 1)]);

      var r = btpLib.editYield(input.batch, {
        newYield: input.newYield,
        consumedQty: input.consumedQty,
        reason: input.reason,
        actorId: ctx.actor.actorId,
        at: ctx.clock.now(),
        operationId: opId
      });
      if (R.isErr(r)) return r;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'prepBatch', record: r.value });
      plan.ledgerEntries.push({
        domain: 'prep', type: 'ADJUSTMENT', itemId: input.prepStockItemId, storeId: ctx.storeId,
        unitId: input.prepUnitId || null,
        qtyDelta: r.value.actualYield - input.batch.actualYield,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'prepBatch', referenceId: input.prepBatchId, reason: input.reason
      });
      plan.projectionRecomputes.push({ itemId: input.prepStockItemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  return {
    RecordPrepProduction: RecordPrepProduction,
    EditPrepYield: EditPrepYield
  };
});

/**

 * Chuỗi thật: `NET-RAW-MATERIAL-V1.md` RM1 (🔴 GAP TOÀN PHẦN — hệ mới trước

 *

 * theo chỉ số tách — mẫu này lấy nguyên `idPrefix` của legacy (comment gốc:
 * bug "nhận hàng cộng kho 2 lần khi retry"), xác nhận lại đúng mẫu ở
 * `commands/prep.js:114` (`ids.deterministicId('unit', ['prep', batchRef])`).
 */
GIEO.define('commands/receiving', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/unit',
  'recipe-cost-btp/cost'
], function (ids, R, pipeline, unitLib, costLib) {
  'use strict';

  /**
   * Phân loại tường minh theo `item.trackingMode` — KHÔNG suy luận từ field
   * `unit`. Đây là fix chung cho gap AMBIGUOUS đã ghi nhận cả ở RM1 lẫn SC1
   * (`NET-STOCK-COUNT-V1.md`): legacy để `mode` quyết định có tạo container
   * hay không, rồi lại dùng `item.unit === 'cái'` làm ngoại lệ ngầm bên trong
   * nhánh 'unit' — hai lớp suy luận chồng nhau trên CÙNG một khái niệm.
   */
  function classifyTrackingMode(item) {
    var mode = (item && item.trackingMode) || 'none';
    return mode === 'unit' || mode === 'batch' ? mode : 'none';
  }

  function isDiscreteUnit(item) {
    return String((item && item.unit) || '').trim().toLowerCase() === 'cái';
  }

  /** Quy cách đóng gói đang chọn (Chai/Khay/...), hoặc null nếu chưa khai. */
  function resolvePackagingBaseQty(item) {
    var pk = ((item && item.packagingUnits) || []).filter(function (p) {
      return p.name === item.countUnitName;
    })[0];
    if (pk && typeof pk.baseQty === 'number' && pk.baseQty > 0) return pk.baseQty;
    return null;
  }

  /**
   * Chia MỘT dòng nhận hàng thành các Unit sẽ tạo. Không bao giờ trả mảng
   * rỗng khi `qtyBase > 0` — đây chính là chỗ khác legacy (xem đầu file).
   */
  function splitReceivingLine(item, qtyBase) {
    var mode = classifyTrackingMode(item);

    if (mode === 'batch') {
      return [{ qty: qtyBase, gap: false, gapReason: null }];
    }
    if (mode === 'none') {
      return [{ qty: qtyBase, gap: false, gapReason: null }];
    }

    /* mode === 'unit' */
    var baseQty = isDiscreteUnit(item) ? 1 : resolvePackagingBaseQty(item);
    if (!baseQty) {
      return [{
        qty: qtyBase, gap: true,
        gapReason: 'thiếu quy cách đóng gói (packagingUnits/countUnitName chưa khớp) — ' +
          'gộp cả dòng thành 1 lô, không tách được theo đơn vị đếm'
      }];
    }

    var count = Math.floor(qtyBase / baseQty);
    var remainder = qtyBase - count * baseQty;
    var out = [];
    for (var i = 0; i < count; i++) out.push({ qty: baseQty, gap: false, gapReason: null });
    if (remainder > 0) {
      out.push({
        qty: remainder, gap: true,
        gapReason: 'phần dư sau khi chia theo quy cách đóng gói (' + baseQty + '/đơn vị đếm) — ' +
          'legacy bỏ phần này (Math.floor không xử lý dư), ở đây vẫn vào kho'
      });
    }
    return out;
  }

  /**
   * ReceiveGoods — nhận hàng, tạo Unit sealed với costBasis thật.
   *
   * Input đi theo mẫu "denormalized": `input.lines[].item` là bản ghi mặt
   * hàng đã tra sẵn (không tự tra catalog bên trong command).
   */
  var ReceiveGoods = pipeline.defineCommand({
    name: 'ReceiveGoods',
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['receive', input.receiptRef]);
    },

    validate: function (input) {
      if (!input || !input.receiptRef) {
        return R.err('VALIDATION', 'ReceiveGoods cần receiptRef (idPrefix) để id xác định — ' +
          'thiếu nó là tái lập đúng bug "nhận hàng cộng kho 2 lần khi retry"');
      }
      if (!Array.isArray(input.lines) || input.lines.length === 0) {
        return R.err('VALIDATION', 'ReceiveGoods cần ít nhất 1 dòng nhận hàng');
      }
      for (var i = 0; i < input.lines.length; i++) {
        var line = input.lines[i];
        if (!line || !ids.isId(line.itemId, 'item')) {
          return R.err('VALIDATION', 'dòng ' + i + ' cần itemId hợp lệ');
        }
        if (typeof line.qtyBase !== 'number' || !(line.qtyBase > 0)) {
          return R.err('VALIDATION', 'dòng ' + i + ' cần qtyBase dương');
        }
        if (!line.item) {
          return R.err('VALIDATION', 'dòng ' + i + ' thiếu input.lines[].item (denormalized, không tự tra catalog)');
        }
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['receive', input.receiptRef]);
      var at = input.at || ctx.clock.now();
      var registry = input.deps && input.deps.versionRegistry;

      var lineRecords = [];
      var gaps = [];

      for (var li = 0; li < input.lines.length; li++) {
        var line = input.lines[li];
        var item = line.item;

        var costR = costLib.costBasisForNewUnit(registry, {
          itemId: line.itemId, storeId: ctx.storeId, at: at, paidUnitCost: line.paidUnitCost
        });
        if (R.isErr(costR)) return costR;
        var cost = costR.value;

        var splits = splitReceivingLine(item, line.qtyBase);
        var lineUnitIds = [];

        for (var si = 0; si < splits.length; si++) {
          var s = splits[si];
          var unitR = unitLib.createUnit({
            unitId: ids.deterministicId('unit', ['receive', input.receiptRef, line.itemId, String(si)]),
            itemId: line.itemId, storeId: ctx.storeId, itemKind: 'raw',
            initialQty: s.qty,
            costBasis: { unitCost: cost.unitCost, currency: cost.currency, versionId: cost.versionId, source: cost.source },
            receiptId: input.receiptRef,
            supplierId: line.supplierId || input.supplierId || null,
            receivedAt: at, receivedBy: ctx.actor.actorId,
            operationId: opId
          });
          if (R.isErr(unitR)) return unitR;

          plan.unitChanges.push(unitR.value);
          lineUnitIds.push(unitR.value.unitId);

          plan.ledgerEntries.push({
            domain: 'raw', type: 'RECEIVING', itemId: line.itemId, storeId: ctx.storeId,
            unitId: unitR.value.unitId, qtyDelta: s.qty,
            unitCost: cost.unitCost, costBasisVersionId: cost.versionId,
            businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
            occurredAt: at,
            referenceType: 'receiving', referenceId: input.receiptRef
          });

          if (s.gap) gaps.push({ itemId: line.itemId, unitId: unitR.value.unitId, reason: s.gapReason });
        }

        lineRecords.push({
          itemId: line.itemId, qtyBase: line.qtyBase,
          trackingMode: classifyTrackingMode(item),
          unitCost: cost.unitCost, costSource: cost.source,
          unitIds: lineUnitIds,
          supplierId: line.supplierId || input.supplierId || null
        });

        plan.projectionRecomputes.push({ itemId: line.itemId, storeId: ctx.storeId });
      }

      plan.domainRecords.push({
        type: 'receivingRecord',
        record: {
          receivingRecordId: ids.deterministicId('receipt', ['receive', input.receiptRef]),
          receiptRef: input.receiptRef,
          supplierId: input.supplierId || null,
          purchaseOrderRef: input.purchaseOrderRef || null,
          lines: lineRecords,
          gap: gaps.length > 0,
          gaps: gaps,
          actorId: ctx.actor.actorId,
          businessDate: ctx.businessDate,
          receivedAt: at
        }
      });

      return R.ok(plan);
    }
  });

  /**
   * CorrectReceivingCost — RM3, sửa giá nhập sai của MỘT lô đã sealed.
   *
   * Quyết định chủ quán mục 2 + `NET-RAW-MATERIAL-V1.md` RM3: sửa LƯỢNG nhập
   * sai đã có sẵn qua `AdjustInventory` (`commands/inventory.js`, dùng
   * `physicalReconciliation`, atomic đúng 1 bước — tự đóng bug "4 bước
   * không atomic" của `fixRecWizApply` legacy). Domain còn thiếu là sửa GIÁ
   * — legacy hoàn toàn không có nhánh này. Command này bọc
   * `unit.reviseCostBasis()` — xem lý do KHÔNG có `historicalPolicy` ở đó.
   */
  var CorrectReceivingCost = pipeline.defineCommand({
    name: 'CorrectReceivingCost',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['correctcost', input.correctRef, input.unitId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.unitId, 'unit')) return R.err('VALIDATION', 'cần unitId hợp lệ');
      if (!input.correctRef) return R.err('VALIDATION', 'cần correctRef để id xác định (chống sửa đúp)');
      if (typeof input.unitCost !== 'number' || input.unitCost < 0) {
        return R.err('VALIDATION', 'unitCost phải là số không âm');
      }
      if (!input.reason) return R.err('VALIDATION', 'sửa giá nhập sai phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var unit = (input.units || []).filter(function (u) { return u.unitId === input.unitId; })[0];
      if (!unit) return R.err('NOT_FOUND', 'không tìm thấy lô ' + input.unitId);

      var opId = ids.deterministicId('operation', ['correctcost', input.correctRef, input.unitId]);
      var r = unitLib.reviseCostBasis(unit, {
        unitCost: input.unitCost, currency: input.currency, versionId: input.versionId,
        at: ctx.clock.now(), actorId: ctx.actor.actorId, reason: input.reason, operationId: opId
      });
      if (R.isErr(r)) return r;

      var plan = pipeline.emptyPlan();
      plan.unitChanges.push(r.value);
      plan.projectionRecomputes.push({ itemId: unit.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  return {
    classifyTrackingMode: classifyTrackingMode,
    splitReceivingLine: splitReceivingLine,
    ReceiveGoods: ReceiveGoods,
    CorrectReceivingCost: CorrectReceivingCost
  };
});

/* ===== src/layers/commands/reversal.js ===== */
/**
 * Reversal / Correction — ĐÚNG 2 PATTERN, thay cho 10 đường rời rạc của legacy.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-REVERSAL-CORRECTION-V1.md.
 *
 * Legacy có 10 cơ chế hoàn/sửa khác nhau về chất lượng dù cùng ý định — chính
 * code legacy tự nhận trong comment rằng "lẽ ra nên dùng chung engine". Kết
 * luận thiết kế: chỉ cần 2 pattern + domain event cho side-effect.
 *
 *   ReverseTransaction — sự kiện ĐÃ TIÊU THỤ kho, giờ hoàn ngược.
 *                        (xoá bill, huỷ mẻ đang nấu, sửa add-on, sửa ledger sai)
 *   ReviseState        — sửa một con số trạng thái đã chốt sai, KHÔNG có ý
 *                        nghĩa tiêu thụ ngược. (yield BTP, giờ công, kiểm kê)
 *
 * SIDE-EFFECT NGOÀI KHO KHÔNG NẰM TRONG 2 PATTERN TRÊN.
 * Bằng chứng từ legacy: xoá bill CỐ Ý không hoàn loyalty (quyết định nghiệp vụ
 * hợp lệ, ghi rõ trong comment/toast), còn ở Found-after-Lost thì logic hoàn
 * deduction đã viết sẵn nhưng tầng tạo deduction chưa từng tồn tại. Hai tình
 * huống khác nhau, cùng một bài học: side-effect phải là handler đăng ký riêng
 * lắng nghe domain event, không phải nhánh if/else trong hàm hoàn chính.
 *
 * Lợi ích cụ thể: chủ quán đổi ý "có hoàn điểm khi huỷ bill không" thì thêm/bớt
 * một handler, không phải sửa lại luồng hoàn.
 */
GIEO.define('commands/reversal', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/allocation',
  'fifo-core/reconciliation'
], function (ids, R, pipeline, allocation, reconciliation) {
  'use strict';

  /**
   * Câu hỏi mà legacy để ngỏ ở MỌI trường hợp đã audit: báo cáo lịch sử đóng
   * băng theo giá trị tại thời điểm phát sinh, hay tính lại theo giá trị mới?
   * Ở đây nó là field BẮT BUỘC — không có mặc định để rơi vào.
   */
  var HISTORICAL_POLICY = {
    /* Số đã công bố giữ nguyên; sửa chỉ ảnh hưởng từ nay về sau. */
    FREEZE: 'FREEZE',
    /* Tính lại lịch sử theo giá trị mới — phải có lý do rõ. */
    RECOMPUTE: 'RECOMPUTE'
  };

  /* Sự kiện domain. Handler đăng ký riêng, không sửa file này khi thêm/bớt. */
  var EVENTS = {
    OrderVoided: 'OrderVoided',
    ContainerFound: 'ContainerFound',
    BatchCancelled: 'BatchCancelled',
    StateRevised: 'StateRevised'
  };

  function createEventBus() {
    var handlers = Object.create(null);
    return {
      on: function (eventType, name, fn) {
        if (!EVENTS[eventType]) throw new Error('[reversal] sự kiện chưa khai: ' + eventType);
        (handlers[eventType] || (handlers[eventType] = [])).push({ name: name, fn: fn });
      },
      /** Trả kết quả TỪNG handler — một handler hỏng không được nuốt im lặng. */
      emit: function (event) {
        var list = handlers[event.type] || [];
        return list.map(function (h) {
          try {
            return { handler: h.name, result: h.fn(event) };
          } catch (e) {
            return { handler: h.name, result: R.err('MANUAL_REVIEW', h.name + ' ném lỗi: ' + e.message) };
          }
        });
      },
      handlersFor: function (eventType) {
        return (handlers[eventType] || []).map(function (h) { return h.name; });
      }
    };
  }

  /**
   * ReverseTransaction — MỘT API cho mọi trường hợp hoàn kho.
   *
   * Hoàn theo phân bổ GỐC, không chạy lại FIFO (fifo-core/reconciliation §3.8).
   * Claim theo doc id xác định nên idempotent tự nhiên, không phải check-then-act.
   */
  var ReverseTransaction = pipeline.defineCommand({
    name: 'ReverseTransaction',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return reconciliation.reversalOperationId(input.referenceId, input.domain, input.itemId || 'all');
    },

    validate: function (input) {
      if (!input || !input.referenceId) return R.err('VALIDATION', 'ReverseTransaction cần referenceId');
      if (!input.domain) return R.err('VALIDATION', 'ReverseTransaction cần domain');
      if (!input.reason) {
        return R.err('VALIDATION', 'hoàn giao dịch phải có lý do — hoàn không lý do là hoàn không kiểm chứng được');
      }
      if (!Array.isArray(input.originalAllocations)) {
        return R.err('VALIDATION',
          'ReverseTransaction cần originalAllocations — hoàn là BÙ TRỪ theo phân bổ gốc, ' +
          'không phải chạy lại FIFO để đoán hồi đó đã trừ ở đâu');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = reconciliation.reversalOperationId(input.referenceId, input.domain, input.itemId || 'all');
      var ws = allocation.createWorkingSet(input.units || []);

      var r = reconciliation.reverseAllocations(ws, {
        referenceId: input.referenceId,
        domain: input.domain,
        operationId: opId,
        originalAllocations: input.originalAllocations,
        fallbackQty: input.fallbackQty
      });
      if (R.isErr(r)) return r;
      var rev = r.value;

      plan.unitChanges = rev.touchedUnits;
      rev.reversals.forEach(function (x) {
        plan.ledgerEntries.push({
          domain: input.domain,
          type: 'REVERSAL',
          itemId: x.itemId,
          storeId: ctx.storeId,
          unitId: x.unitId,
          /* Trả lại bằng delta DƯƠNG — giữ nguyên mọi thao tác xảy ra sau đó. */
          qtyDelta: x.qty,
          unitCost: x.unitCost,
          costBasisVersionId: x.costBasisVersionId,
          businessDate: ctx.businessDate,
          actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: input.referenceType || 'reversal',
          referenceId: input.referenceId,
          reason: input.reason
        });
      });

      if (rev.coverage === 'untracked') {
        /* Dữ liệu legacy không truy được phân bổ gốc. Đánh dấu để rà tay —
           KHÔNG đoán bừa (invariant #12). */
        plan.domainRecords.push({
          type: 'manualReviewTask',
          record: {
            reason: 'AMBIGUOUS_LEGACY',
            referenceId: input.referenceId,
            qty: rev.untrackedQty,
            note: 'không truy được phân bổ gốc — cần rà thủ công trước khi coi là đã hoàn'
          }
        });
      }

      /* Side-effect ĐI QUA EVENT, không phải if/else ở đây. */
      if (input.eventType) {
        if (!EVENTS[input.eventType]) {
          return R.err('VALIDATION', 'sự kiện chưa khai: ' + input.eventType);
        }
        plan.events.push(Object.assign({
          type: input.eventType,
          referenceId: input.referenceId,
          storeId: ctx.storeId,
          businessDate: ctx.businessDate,
          occurredAt: ctx.clock.now(),
          reversedBy: ctx.actor.actorId,
          reason: input.reason
        }, input.eventData || {}));
      }

      plan.projectionRecomputes = rev.reversals.map(function (x) {
        return { itemId: x.itemId, storeId: ctx.storeId };
      });

      return R.ok(plan);
    }
  });

  /**
   * ReviseState — sửa con số đã chốt sai, KHÔNG có ý nghĩa tiêu thụ ngược.
   *
   * Hai thứ bắt buộc mà legacy thiếu ở mọi trường hợp đã audit:
   *   - audit-array giữ giá trị trước (append-only, không ghi đè)
   *   - `historicalPolicy` trả lời rõ đóng băng hay tính lại lịch sử
   */
  var ReviseState = pipeline.defineCommand({
    name: 'ReviseState',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['revise', input.entityType, input.entityId, input.field]);
    },

    validate: function (input) {
      if (!input || !input.entityId) return R.err('VALIDATION', 'ReviseState cần entityId');
      if (!input.entityType) return R.err('VALIDATION', 'ReviseState cần entityType');
      if (!input.field) return R.err('VALIDATION', 'ReviseState cần field');
      if (input.newValue === undefined) return R.err('VALIDATION', 'ReviseState cần newValue');
      if (!input.reason) return R.err('VALIDATION', 'sửa trạng thái phải có lý do');
      if (!HISTORICAL_POLICY[input.historicalPolicy]) {
        return R.err('VALIDATION',
          'ReviseState phải khai historicalPolicy: FREEZE (số đã công bố giữ nguyên) ' +
          'hay RECOMPUTE (tính lại lịch sử). Legacy để ngỏ câu này ở mọi trường hợp, ' +
          'nên không ai biết báo cáo cũ có đổi hay không.');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['revise', input.entityType, input.entityId, input.field]);

      plan.domainRecords.push({
        type: 'stateRevision',
        record: {
          entityType: input.entityType,
          entityId: input.entityId,
          field: input.field,
          /* Append-only: giá trị cũ giữ lại để trả lời "số nào từng đúng". */
          before: input.currentValue === undefined ? null : input.currentValue,
          after: input.newValue,
          historicalPolicy: input.historicalPolicy,
          reason: input.reason,
          actorId: ctx.actor.actorId,
          at: ctx.clock.now(),
          operationId: opId
        }
      });

      /* RECOMPUTE mới đụng tới báo cáo cũ; FREEZE thì không. Quyết định này
         hiện ra trong plan, không nằm ngầm trong đầu người bấm nút. */
      if (input.historicalPolicy === HISTORICAL_POLICY.RECOMPUTE && input.affectedScope) {
        plan.projectionRecomputes.push(input.affectedScope);
      }

      plan.events.push({
        type: EVENTS.StateRevised,
        entityType: input.entityType,
        entityId: input.entityId,
        field: input.field,
        historicalPolicy: input.historicalPolicy,
        storeId: ctx.storeId,
        businessDate: ctx.businessDate
      });

      return R.ok(plan);
    }
  });

  /**
   * LedgerCorrection — đóng gap "sửa 1 dòng ledger sai".
   *
   * Ghi dòng ĐẢO + dòng ĐÚNG, `referenceId` trỏ về dòng gốc. KHÔNG update dòng
   * cũ — ledger append-only THẬT, không lặp lại pattern mutate-tại-chỗ của
   * `ctnDaoHaoHutMa` legacy.
   */
  var CorrectLedgerEntry = pipeline.defineCommand({
    name: 'CorrectLedgerEntry',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['ledgerfix', input.originalEntry.entryId]);
    },

    validate: function (input) {
      if (!input || !input.originalEntry) return R.err('VALIDATION', 'cần dòng ledger gốc');
      if (!input.corrected) return R.err('VALIDATION', 'cần nội dung đúng');
      if (!input.reason) return R.err('VALIDATION', 'sửa ledger phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var o = input.originalEntry;

      /* Dòng ĐẢO. */
      plan.ledgerEntries.push({
        domain: o.domain, type: o.type, itemId: o.itemId, storeId: o.storeId,
        unitId: o.unitId, qtyDelta: -o.qtyDelta,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'ledgerCorrection', referenceId: o.entryId,
        reason: 'đảo dòng sai: ' + input.reason
      });

      /* Dòng ĐÚNG. */
      plan.ledgerEntries.push({
        domain: o.domain,
        type: input.corrected.type || o.type,
        itemId: input.corrected.itemId || o.itemId,
        storeId: o.storeId,
        unitId: input.corrected.unitId !== undefined ? input.corrected.unitId : o.unitId,
        qtyDelta: input.corrected.qtyDelta,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'ledgerCorrection', referenceId: o.entryId,
        reason: 'thay cho dòng sai: ' + input.reason
      });

      plan.projectionRecomputes.push({ itemId: o.itemId, storeId: o.storeId });
      return R.ok(plan);
    }
  });

  return {
    HISTORICAL_POLICY: HISTORICAL_POLICY,
    EVENTS: EVENTS,
    createEventBus: createEventBus,
    ReverseTransaction: ReverseTransaction,
    ReviseState: ReviseState,
    CorrectLedgerEntry: CorrectLedgerEntry
  };
});

/* ===== src/layers/commands/sales.js ===== */
/**
 * Bán hàng — Bill model + RecordSale.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-SALES-COGS-PL-V1.md.
 * Gap: FEATURE-TREE-V1.md §4.7, §4.16; FIFO-CORE-ARCHITECTURE-V2.md §10b.1/§10b.7.
 *
 * Ba field/hành vi mà legacy thiếu, bổ sung ngay từ thiết kế (không thêm sau):
 *
 * 1. `soldByActorId` — NGOẠI LỆ DUY NHẤT của toàn hệ thống cũ. Mọi domain khác
 *    (stock transaction, prep batch, container, expense, cash count, checklist)
 *    đều ghi staffEmployeeId; riêng Bill thì không — chỉ có gate "có ai đó đang
 *    check-in", không biết CHÍNH XÁC ai bán. FEATURE-TREE §4.7 gọi đây là field
 *    còn thiếu quan trọng nhất trong toàn bộ audit tính năng.
 *
 * 2. `channel` (tại quán / mang đi / sàn) là first-class. Legacy ĐÃ ghi
 *    isToGo/isShip/isAppSale/appFeePct trên mỗi bill, nhưng `appFeePct` chỉ
 *    được GHI, KHÔNG BAO GIỜ ĐƯỢC ĐỌC (grep toàn bộ 2 file: đúng 1 kết quả —
 *    chính dòng ghi), và `plChannelFeeForDay()` hard-code return 0. Dữ liệu đã
 *    sẵn sàng, chỉ chưa nối đường ống. Ở đây phí sàn được TRỪ THẬT vào doanh
 *    thu thuần.
 *
 * 3. Addon phải kích hoạt lại Loyalty. Legacy `submitAddon` không gọi
 *    `loyaltyProcessAfterPay()`, nên khách trả thêm tiền mà không được cộng
 *    thêm điểm. Ở đây addon phát event để handler loyalty xử lý — side-effect
 *    là handler đăng ký riêng, không nhét vào lệnh bán.
 *
 * 4. Thiếu định mức KHÔNG chặn bán (N10, `NET-SALES-V1.md`, quyết định chủ
 *    quán 2026-09-17, §2.3a): legacy chỉ soft-warn qua Hộp thư, không chặn —
 *    bản đầu của core này từng trả `PRECONDITION` khi thiếu recipeId, một
 *    điểm chặn MỚI so với hệ cũ. Đã sửa: `buildRequirements` ghi nhận
 *    `gapLines` thay vì lỗi, `cogsTheoretical`/`cogsActual` của bill về
 *    `null` kèm `reason: 'NO_RECIPE'` (không âm thầm tính thiếu — xem
 *    `recipe-cost-btp/cogs.js`), và phát `MissingRecipeDetected` cho mỗi món
 *    thiếu để `bootstrap/domain-events.js` (L9) tạo alert `MISSING_RECIPE`
 *    (đã đăng ký sẵn trong `alerts/alert.js`, tự hết khi khai định mức xong).
 *
 * 5. Hết nguyên liệu thật KHÔNG chặn bán (quyết định chủ quán 2026-09: SOP cho
 *    phép thay thế nguyên liệu khi hết). Trước đây trả `PRECONDITION` khi
 *    `alloc.shortfalls.length` — bản đầu cố ý chặn CHẶT HƠN legacy (legacy để
 *    kho âm mà không ai biết). Đã sửa: mỗi shortfall đi qua
 *    `allocation.handleShortfall` (§3.3, cơ chế NỢ tường minh trên Unit đã có
 *    sẵn ở fifo-core, chỉ chưa được gọi), Unit gánh nợ được gắn `needsReview`,
 *    và phát `IngredientShortfallRecorded` để L9 tạo alert `UNIT_NEEDS_REVIEW`
 *    cho QUANLY — không âm thầm, không chặn nhân viên tại quầy.
 *
 * 6. Đá (N2, `NET-SALES-V1.md`, quyết định chủ quán 2026-09): "cửa hàng chỉ có
 *    đá chung/đá riêng/không đá, không có ít/nhiều gì cả, nên cứ mặc định cái
 *    nào cũng trừ 1 lượng đá theo cài đặt là được, nhưng cũng nên có chỗ bật
 *    tắt theo lượng đá cogs nếu cần thiết." Mỗi dòng vẫn ghi `ice` (mặc định
 *    'CHUNG' như legacy `cartIceDefault`) để in tem/nhãn, nhưng COGS trừ
 *    ĐỒNG NHẤT theo số ly bất kể giá trị đó — xem `catalog/ice.js` (versioned
 *    qua `compaction/versioned-input`, `enabled` là "chỗ bật tắt" nằm ngay
 *    trong version nên tắt/bật không làm trôi COGS bill cũ).
 *
 * 7. Đổi tem lấy ly miễn phí (N12 phần "đổi tem", `NET-SALES-V1.md`, quyết
 *    định chủ quán 2026-09-17): legacy `_finalizeStampFreeAfterPay` chưa có
