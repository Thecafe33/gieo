    opts = opts || {};
    var maxHours = opts.maxShiftHours || DEFAULT_MAX_SHIFT_HOURS;
    if (shift.status !== STATUS.OPEN) return R.ok(shift);

    var elapsed = nowTs - shift.checkedInAt;
    if (elapsed <= maxHours * HOUR) return R.ok(shift);

    var reasons = shift.needsReviewReasons.slice();
    if (reasons.indexOf(REVIEW.AUTO_CLOSED) === -1) reasons.push(REVIEW.AUTO_CLOSED);

    return R.ok(Object.assign({}, shift, {
      checkedOutAt: shift.checkedInAt + maxHours * HOUR,
      status: STATUS.CLOSED,
      autoClosed: true,
      needsReview: true,
      needsReviewReasons: reasons
    }));
  }

  /**
   * Sửa giờ chấm công.
   *
   * Trả về CẢ state mới lẫn danh sách event phải phát. Gọi được mà không phát
   * event là cách legacy âm thầm khoá 23 actor-gate ở POS — nên event nằm ngay
   * trong giá trị trả về, không phải việc caller tự nhớ.
   */
  function reviseShift(shift, changes, spec) {
    if (!spec || !ids.isId(spec.actorId, 'actor')) {
      return R.err('VALIDATION', 'sửa chấm công phải có actorId — legacy thiếu audit ở đúng chỗ này');
    }
    if (!spec.operationId) return R.err('VALIDATION', 'sửa chấm công phải có operationId');
    if (!spec.reason) return R.err('VALIDATION', 'sửa chấm công phải có lý do');
    if (!changes || (changes.checkedInAt === undefined && changes.checkedOutAt === undefined)) {
      return R.err('VALIDATION', 'reviseShift cần ít nhất 1 thay đổi giờ');
    }

    var nextIn = changes.checkedInAt === undefined ? shift.checkedInAt : changes.checkedInAt;
    var nextOut = changes.checkedOutAt === undefined ? shift.checkedOutAt : changes.checkedOutAt;
    if (typeof nextIn !== 'number') return R.err('VALIDATION', 'checkedInAt phải là timestamp');
    if (nextOut !== null && typeof nextOut !== 'number') return R.err('VALIDATION', 'checkedOutAt phải là timestamp hoặc null');
    if (nextOut !== null && nextOut < nextIn) return R.err('VALIDATION', 'giờ ra sớm hơn giờ vào');

    var reasons = shift.needsReviewReasons.slice();
    if (reasons.indexOf(REVIEW.REVISED) === -1) reasons.push(REVIEW.REVISED);

    var next = Object.assign({}, shift, {
      checkedInAt: nextIn,
      checkedOutAt: nextOut,
      status: nextOut === null ? STATUS.OPEN : STATUS.CLOSED,
      needsReview: true,
      needsReviewReasons: reasons,
      /* Append-only: giữ nguyên giá trị trước để trả lời "số nào từng đúng". */
      revisions: shift.revisions.concat([{
        operationId: spec.operationId,
        actorId: spec.actorId,
        at: spec.at || null,
        reason: String(spec.reason),
        before: { checkedInAt: shift.checkedInAt, checkedOutAt: shift.checkedOutAt, status: shift.status },
        after: { checkedInAt: nextIn, checkedOutAt: nextOut }
      }])
    });

    var events = [];
    var wasOpen = shift.status === STATUS.OPEN;
    var nowOpen = next.status === STATUS.OPEN;
    if (spec.isCurrentBusinessDate && wasOpen !== nowOpen) {
      /* Đây là side-effect legacy chưa từng tài liệu hoá. Phát event để mọi
         actor-gate (checklist, ký tên kho/BTP, tạo bill, giao ca) refresh đồng
         bộ, thay vì để nhân viên bị khoá quyền không rõ nguyên nhân. */
      events.push({
        type: 'EmployeeCheckedInStateChanged',
        employeeId: shift.employeeId,
        actorId: shift.actorId,
        storeId: shift.storeId,
        businessDate: shift.businessDate,
        checkedIn: nowOpen,
        causedByOperationId: spec.operationId
      });
    }

    return R.ok({ shift: next, events: events });
  }

  /**
   * Actor-gate: "nhân viên này đã check-in hôm nay chưa".
   * POS gọi ở 23 chỗ. Một hàm duy nhất, không suy diễn lại ở từng chỗ.
   */
  function isCheckedIn(shifts, employeeId, businessDate) {
    for (var i = 0; i < shifts.length; i++) {
      var s = shifts[i];
      if (s.employeeId === employeeId && s.businessDate === businessDate && s.status === STATUS.OPEN) {
        return true;
      }
    }
    return false;
  }

  /** Giờ công thực tế của 1 ca. Ca chưa đóng thì KHÔNG đoán. */
  function workedHours(shift) {
    if (shift.checkedOutAt === null) {
      return R.err('PRECONDITION', 'ca chưa check-out, không tính được giờ công');
    }
    var ms = shift.checkedOutAt - shift.checkedInAt;
    if (ms < 0) return R.err('VALIDATION', 'ca có giờ ra sớm hơn giờ vào');
    return R.ok(ms / HOUR);
  }

  /**
   * Tiền công 1 ca.
   *
   * CHỈ nhận `shift` và đọc `shift.payTermsRef`. Không có tham số nào cho
   * Employee hiện tại, nên KHÔNG CÓ ĐƯỜNG NÀO để lặp lại bug legacy "join bảng
   * nhân viên hiện tại" — chặn bằng chữ ký hàm, không bằng lời nhắc.
   */
  function computeWage(shift) {
    if (!shift.payTermsRef || !shift.payTermsRef.payload) {
      return R.err('PRECONDITION', 'ca thiếu payTermsRef — không được tính lương bằng PayTerms hiện tại');
    }
    var hoursR = workedHours(shift);
    if (R.isErr(hoursR)) return hoursR;

    var hours = hoursR.value;
    var t = shift.payTermsRef.payload;
    var normalHours = Math.min(hours, t.otThreshold);
    var otHours = Math.max(0, hours - t.otThreshold);

    return R.ok({
      hours: hours,
      normalHours: normalHours,
      otHours: otHours,
      amount: normalHours * t.rate + otHours * t.otRate,
      /* V4: kết quả mang theo versionId đã dùng, để đọc lại lịch sử không phải
         resolve lại. */
      payTermsVersionId: shift.payTermsRef.versionId,
      needsReview: shift.needsReview,
      needsReviewReasons: shift.needsReviewReasons.slice()
    });
  }

  return {
    STATUS: STATUS,
    REVIEW: REVIEW,
    DEFAULT_MAX_SHIFT_HOURS: DEFAULT_MAX_SHIFT_HOURS,
    shiftId: shiftId,
    checkIn: checkIn,
    checkOut: checkOut,
    autoCloseIfStale: autoCloseIfStale,
    reviseShift: reviseShift,
    isCheckedIn: isCheckedIn,
    workedHours: workedHours,
    computeWage: computeWage
  };
});

/* ===== src/layers/hr/work-schedule.js ===== */
/**
 * Work schedule — lịch làm việc đã xếp.
 *
 * Ở legacy đây là dữ liệu CHỈ ĐỂ ĐỌC, dùng so sánh đi trễ, không nối vào tính
 * lương (`FIFO-CHAIN-TRACE-PAYROLL-V1.md` §6: lương cứng cộng đều mọi ngày,
 * KHÔNG kiểm tra work_schedules hay có chấm công hay không — nghỉ dài ngày
 * không tự trừ).
 *
 * Chủ quán đã chốt: **lương cứng trừ theo lịch làm việc**. Nên domain này từ
 * optional thành BẮT BUỘC cho payroll — không có lịch thì không biết ngày nào
 * là vắng mặt, và mọi phép trừ đều là đoán.
 */
GIEO.define('hr/work-schedule', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  function scheduleId(employeeId, dateKey) {
    return ids.deterministicId('shift', ['sched', employeeId, dateKey]);
  }

  /** Một ngày được xếp lịch cho một nhân viên. */
  function scheduleDay(spec) {
    if (!ids.isId(spec.employeeId, 'employee')) return R.err('VALIDATION', 'cần employeeId hợp lệ');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'cần storeId hợp lệ');
    if (!spec.clock || !spec.clock.isDateKey(spec.dateKey)) {
      return R.err('VALIDATION', 'cần dateKey dạng YYYY-MM-DD');
    }
    return R.ok({
      scheduleId: scheduleId(spec.employeeId, spec.dateKey),
      employeeId: spec.employeeId,
      storeId: spec.storeId,
      dateKey: spec.dateKey,
      plannedHours: typeof spec.plannedHours === 'number' ? spec.plannedHours : null,
      /* Nghỉ có phép: vẫn nằm trong lịch nhưng KHÔNG bị tính là vắng mặt.
         Legacy không có khái niệm này nên không phân biệt được nghỉ phép với
         nghỉ không báo. */
      excused: !!spec.excused,
      excusedReason: spec.excusedReason || null
    });
  }

  function markExcused(day, reason) {
    if (!reason) return R.err('VALIDATION', 'nghỉ có phép phải ghi lý do');
    return R.ok(Object.assign({}, day, { excused: true, excusedReason: String(reason) }));
  }

  /**
   * Đối chiếu lịch với chấm công thật.
   *
   * Trả 3 nhóm tách bạch, vì chúng dẫn tới 3 xử lý khác nhau:
   *   worked         — có lịch, có đi làm
   *   absent         — có lịch, không đi làm, không phép  → CƠ SỞ TRỪ LƯƠNG CỨNG
   *   excusedAbsent  — có lịch, không đi làm, có phép     → không trừ
   *   unscheduled    — đi làm ngoài lịch                  → không cộng thêm, nhưng phải thấy được
   */
  function reconcile(spec) {
    var days = spec.scheduleDays || [];
    var shifts = spec.shifts || [];

    var workedKeys = Object.create(null);
    shifts.forEach(function (s) { workedKeys[s.businessDate] = true; });

    var scheduledKeys = Object.create(null);
    var worked = [];
    var absent = [];
    var excusedAbsent = [];

    days.forEach(function (d) {
      scheduledKeys[d.dateKey] = true;
      if (workedKeys[d.dateKey]) worked.push(d.dateKey);
      else if (d.excused) excusedAbsent.push(d.dateKey);
      else absent.push(d.dateKey);
    });

    var unscheduled = Object.keys(workedKeys).filter(function (k) { return !scheduledKeys[k]; });

    return R.ok({
      scheduledDays: days.length,
      worked: worked,
      absent: absent,
      excusedAbsent: excusedAbsent,
      unscheduled: unscheduled.sort()
    });
  }

  return {
    scheduleId: scheduleId,
    scheduleDay: scheduleDay,
    markExcused: markExcused,
    reconcile: reconcile
  };
});

/* ===== src/layers/finance/config.js ===== */
/**
 * Config — cấu hình vận hành, đi qua cơ chế versioning DÙNG CHUNG.
 *
 * FEATURE-TREE-V1.md §2 mục [7]: domain này optional với phần còn lại của hệ
 * thống, mọi thứ CÓ DEFAULT — nên không domain nào phải chờ nó mới chạy được.
 * Nhưng khi giá trị được đặt thì nó phải versioned, vì có những cấu hình ảnh
 * hưởng thẳng vào số liệu lịch sử (KPI target là instance #6 của lớp lỗi đã
 * xác nhận 7 lần: `computeKPIs()` resolve target tại NGÀY CUỐI của cả khoảng
 * báo cáo rồi áp cho toàn khoảng).
 *
 * `FINISH_REVIEW_RATIO` nằm ở đây theo đúng xác nhận của chủ quán: cấu hình ở
 * QUANLY, không hard-code. fifo-core nhận nó qua tham số nên vẫn là domain
 * thuần — nó không tự đọc config.
 */
GIEO.define('finance/config', [
  'shared-kernel/result',
  'compaction/versioned-input'
], function (R, VI) {
  'use strict';

  /**
   * Khoá cấu hình và giá trị mặc định.
   *
   * Mặc định có mặt để hệ thống chạy được ngay khi chưa ai cấu hình gì — đúng
   * nguyên tắc "domain này optional với phần còn lại".
   */
  var KEYS = {
    /* Báo hết hũ khi còn > tỉ lệ này thì gắn needsReview (chủ quán chốt: cấu
       hình ở QUANLY). 0.25 là con số legacy từng định dùng nhưng chưa bao giờ
       nối vào code. */
    finishReviewRatio: { default: 0.25, min: 0, max: 1 },
    /* Ngưỡng cảnh báo giá vốn / hao hụt — nền của alert chủ động. */
    cogsPctTarget: { default: null, min: 0, max: 100 },
    wastePctTarget: { default: null, min: 0, max: 100 },
    /* Ngưỡng dung sai khi đối chiếu tồn kho. */
    stockVarianceTolerance: { default: 0, min: 0, max: null },
    /* Số lần đếm tiền tối đa trước khi chốt đoạn ca. */
    maxCashCounts: { default: 3, min: 1, max: 20 }
  };

  function isKey(k) { return Object.prototype.hasOwnProperty.call(KEYS, k); }

  function publishConfig(registry, spec) {
    if (!spec || !isKey(spec.key)) {
      return R.err('VALIDATION', 'khoá cấu hình không hợp lệ: ' + (spec && spec.key));
    }
    var def = KEYS[spec.key];
    if (typeof spec.value !== 'number') {
      return R.err('VALIDATION', 'giá trị cấu hình "' + spec.key + '" phải là số');
    }
    if (def.min !== null && spec.value < def.min) {
      return R.err('VALIDATION', spec.key + ' phải >= ' + def.min);
    }
    if (def.max !== null && spec.value > def.max) {
      return R.err('VALIDATION', spec.key + ' phải <= ' + def.max);
    }

    return registry.publish({
      kind: VI.KINDS.config,
      subjectId: spec.key,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: { key: spec.key, value: spec.value }
    });
  }

  /**
   * Giá trị có hiệu lực TẠI THỜI ĐIỂM SỰ KIỆN, rơi về mặc định nếu chưa ai đặt.
   * Trả kèm `versionId` (null khi dùng mặc định) để nơi ghi kết quả lưu lại được.
   */
  function resolveConfigAt(registry, spec) {
    if (!isKey(spec.key)) return R.err('VALIDATION', 'khoá cấu hình không hợp lệ: ' + spec.key);
    var r = registry.resolveAt(VI.KINDS.config, spec.key, spec.storeId, spec.at);
    if (R.isOk(r)) {
      return R.ok({ key: spec.key, value: r.value.payload.value, versionId: r.value.versionId, isDefault: false });
    }
    return R.ok({ key: spec.key, value: KEYS[spec.key].default, versionId: null, isDefault: true });
  }

  /**
   * KPI target theo TỪNG NGÀY — đóng instance #6.
   *
   * Legacy resolve target tại ngày cuối của cả khoảng báo cáo rồi áp cho toàn
   * khoảng, nên mọi ngày còn lại đều bị so với target sai. Có hàm này thì
   * không còn lý do làm vậy.
   */
  function resolveConfigDaily(registry, spec) {
    if (!isKey(spec.key)) return R.err('VALIDATION', 'khoá cấu hình không hợp lệ: ' + spec.key);
    var r = registry.resolveDaily(VI.KINDS.config, spec.key, spec.storeId, spec.fromTs, spec.toTs);
    if (R.isOk(r)) return r;
    /* Chưa ai đặt giá trị nào trong kỳ: dùng mặc định cho mọi ngày, và NÓI RÕ
       là mặc định thay vì giả vờ có cấu hình. */
    var out = {};
    var clock = spec.clock;
    clock.eachDay(spec.fromTs, spec.toTs).forEach(function (dateKey) {
      out[dateKey] = {
        dateKey: dateKey,
        version: null,
        value: KEYS[spec.key].default,
        isDefault: true,
        multipleVersionsInDay: false
      };
    });
    return R.ok(out);
  }

  return {
    KEYS: KEYS,
    isKey: isKey,
    publishConfig: publishConfig,
    resolveConfigAt: resolveConfigAt,
    resolveConfigDaily: resolveConfigDaily
  };
});

/**
 * Expense — chi phí vận hành.
 *
 * FEATURE-TREE-V1.md §2 mục [7]: hard dep để POS ghi chi phí; phần còn lại của
 * domain optional.
 *
 * Điểm cần đúng ngay từ đầu: chi phí ƯỚC TÍNH và chi phí THẬT phải phân biệt
 * được. Chain-trace P&L cho thấy `chotSoThang()` chỉ cho chốt khi không còn
 * chi phí "ước tính chờ số thật" — tức là khái niệm này ĐÃ tồn tại trong
 * nghiệp vụ thật và là điều kiện chốt sổ, nên nó phải là field tường minh chứ
 * không phải quy ước ngầm trong ghi chú.
 */
GIEO.define('finance/expense', [
  'shared-kernel/ids',
  'shared-kernel/result'
], function (ids, R) {
  'use strict';

  var STATUS = {
    /* Số ước tính, chờ hoá đơn thật — CHẶN chốt sổ tháng. */
    ESTIMATED: 'ESTIMATED',
    ACTUAL: 'ACTUAL',
    PENDING_APPROVAL: 'PENDING_APPROVAL',
    REJECTED: 'REJECTED'
  };

  /* Chi phí cố định phân bổ đều theo tháng vs biến phí theo phát sinh —
     phân biệt vì P&L cần tách 2 loại. */
  var NATURE = { FIXED: 'FIXED', VARIABLE: 'VARIABLE' };

  function createExpense(spec) {
    if (!spec) return R.err('VALIDATION', 'expense cần spec');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'expense cần storeId hợp lệ');
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'expense cần actorId — ai ghi khoản này');
    if (!spec.categoryId) return R.err('VALIDATION', 'expense cần categoryId');
    if (typeof spec.amount !== 'number' || !(spec.amount > 0)) {
      return R.err('VALIDATION', 'số tiền phải dương');
    }
    if (!spec.businessDate) return R.err('VALIDATION', 'expense cần businessDate');
    if (!STATUS[spec.status]) {
      return R.err('VALIDATION',
        'expense phải khai rõ status — ESTIMATED (chờ số thật) hay ACTUAL. ' +
        'Không phân biệt được thì không biết tháng đã đủ điều kiện chốt sổ chưa.');
    }
    if (!NATURE[spec.nature]) return R.err('VALIDATION', "nature phải là FIXED hoặc VARIABLE");
    if (!spec.operationId) return R.err('VALIDATION', 'expense cần operationId');

    return R.ok({
      expenseId: spec.expenseId || ids.newId('expense'),
      storeId: spec.storeId,
      categoryId: spec.categoryId,
      amount: spec.amount,
      nature: spec.nature,
      status: spec.status,
      businessDate: spec.businessDate,
      occurredAt: spec.occurredAt || null,
      actorId: spec.actorId,
      paymentMethodId: spec.paymentMethodId || null,
      note: spec.note || null,
      operationId: spec.operationId,
      revisions: []
    });
  }

  /**
   * Thay số ước tính bằng số thật.
   * Append-only: giữ giá trị cũ để trả lời "trước đây ước bao nhiêu".
   */
  function settleEstimate(expense, spec) {
    if (expense.status !== STATUS.ESTIMATED) {
      return R.err('PRECONDITION', 'chỉ chốt được khoản đang ở trạng thái ước tính');
    }
    if (typeof spec.actualAmount !== 'number' || !(spec.actualAmount > 0)) {
      return R.err('VALIDATION', 'số thật phải dương');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'chốt số thật cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'chốt số thật cần operationId');

    return R.ok(Object.assign({}, expense, {
      amount: spec.actualAmount,
      status: STATUS.ACTUAL,
      revisions: expense.revisions.concat([{
        operationId: spec.operationId,
        actorId: spec.actorId,
        at: spec.at || null,
        from: { amount: expense.amount, status: expense.status },
        to: { amount: spec.actualAmount, status: STATUS.ACTUAL },
        reason: spec.reason || 'có hoá đơn thật'
      }])
    }));
  }

  /**
   * Lý do CHẶN chốt sổ tháng — giữ nguyên điều kiện nghiệp vụ của legacy
   * ("chỉ cho chốt khi tháng đã kết thúc VÀ không còn chi phí ước tính chờ số
   * thật"), nhưng nêu rõ khoản nào thay vì chỉ báo không chốt được.
   */
  function closeBookBlockers(expenses) {
    var blockers = [];
    (expenses || []).forEach(function (e) {
      if (e.status === STATUS.ESTIMATED) {
        blockers.push('khoản "' + e.categoryId + '" (' + e.amount + ') còn là số ước tính, chờ hoá đơn thật');
      }
      if (e.status === STATUS.PENDING_APPROVAL) {
        blockers.push('khoản "' + e.categoryId + '" (' + e.amount + ') chưa được duyệt');
      }
    });
    return blockers;
  }

  /** Tổng theo loại — đầu vào của P&L. */
  function summarize(expenses) {
    var out = { fixed: 0, variable: 0, estimated: 0, actual: 0, total: 0, byCategory: {} };
    (expenses || []).forEach(function (e) {
      if (e.status === STATUS.REJECTED) return;
      if (e.nature === NATURE.FIXED) out.fixed += e.amount; else out.variable += e.amount;
      if (e.status === STATUS.ESTIMATED) out.estimated += e.amount; else out.actual += e.amount;
      out.total += e.amount;
      out.byCategory[e.categoryId] = (out.byCategory[e.categoryId] || 0) + e.amount;
    });
    return out;
  }

  return {
    STATUS: STATUS,
    NATURE: NATURE,
    createExpense: createExpense,
    settleEstimate: settleEstimate,
    closeBookBlockers: closeBookBlockers,
    summarize: summarize
  };
});

/**
 * AlertEngine — MỘT bộ máy cảnh báo, route theo (type, severity).
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-ALERTS-V1.md. Gap: FEATURE-TREE-V1.md §4.9, §4.17.
 *
 * Bốn vấn đề của legacy, đóng cả bốn:
 *
 * 1. SEVERITY GHI RỒI KHÔNG DÙNG (§2). Alert tự gắn `severity:'danger'` lúc tạo,
 *    nhưng `computeStoreHealth()` chỉ switch theo `a.type`. Loại nào không nằm
 *    trong 6 type đặt tên cứng thì rơi hết vào một bucket vàng chung "Cảnh báo
 *    khác chưa xem" — kể cả loại đã tự gắn nhãn danger. Trường dữ liệu tồn tại
 *    nhưng bị bỏ qua ở đúng bước quan trọng nhất là xếp hạng ưu tiên.
 *
 * 2. PUSH KHÔNG NHẤT QUÁN (§4). Hạn dùng chai/hũ đã mở được push đỏ; hạn dùng
 *    lô BTP tính đúng nhưng bị chôn trong màn Tài chính. Cùng là "hàng đã mở
 *    sắp hết hạn", một loại được báo chủ động, một loại phải tự tìm mới thấy.
 *    Tồn thấp chỉ hiện ở QUANLY — nhân viên đứng bán KHÔNG được báo sắp hết
 *    nguyên liệu. Ở đây `audience` là thuộc tính của LOẠI cảnh báo, quyết định
 *    theo mức nghiêm trọng thật, không theo việc ai code trước.
 *
 * 3. "ĐÃ XEM" TẮT CẢNH BÁO Y HỆT "ĐÃ XỬ LÝ" (§6). Hệ thống không xác minh vấn
 *    đề gốc đã được sửa trước khi ngừng nhắc. Ngoại lệ đúng duy nhất là FIFO
 *    bell — cơ chế duy nhất tự xoá khi điều kiện THẬT SỰ hết. Ở đây pattern đó
 *    thành mặc định cho mọi loại kiểm chứng được bằng dữ liệu.
 *
 * 4. 12/16 LOẠI RƠI VÀO KHUÔN UI CHUNG, mất nội dung chẩn đoán (§4.9). Ở đây
 *    mỗi loại tự khai trường bắt buộc của nó.
 */
GIEO.define('alerts/alert', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  var SEVERITY = { INFO: 'INFO', WARNING: 'WARNING', DANGER: 'DANGER' };
  var SEVERITY_RANK = { INFO: 1, WARNING: 2, DANGER: 3 };

  /* Ai cần thấy. Quyết định theo mức nghiêm trọng thật của vấn đề. */
  var AUDIENCE = { POS: 'POS', QUANLY: 'QUANLY', BOTH: 'BOTH' };

  var RESOLUTION = {
    /* Tự xoá khi điều kiện hết — pattern của FIFO bell, giờ là mặc định. */
    AUTO_VERIFIABLE: 'AUTO_VERIFIABLE',
    /* Không kiểm chứng được bằng dữ liệu → phải link tới hành động đã sửa. */
    MANUAL_WITH_REFERENCE: 'MANUAL_WITH_REFERENCE'
  };

  var STATUS = { NEW: 'NEW', SEEN: 'SEEN', RESOLVED: 'RESOLVED', AUTO_CLEARED: 'AUTO_CLEARED' };

  /**
   * Sổ đăng ký loại cảnh báo. Mỗi loại tự khai severity / audience / cách đóng
   * / trường bắt buộc — không có khuôn chung nuốt mất nội dung chẩn đoán.
   */
  var TYPES = {
    FIFO_UNIT_EXHAUSTED: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.POS,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['unitId', 'itemId']
    },
    CONTAINER_EXPIRING: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.BOTH,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['unitId', 'itemId', 'expiresAt']
    },
    /* Cùng mức với CONTAINER_EXPIRING — cùng là rủi ro an toàn thực phẩm và
       vốn đọng. Legacy để loại này chôn trong màn Tài chính (§4). */
    PREP_BATCH_EXPIRING: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.BOTH,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['prepBatchId', 'itemId', 'expiresAt']
    },
    /* BOTH, không phải chỉ QUANLY — nhân viên đứng bán cần biết để báo khách. */
    LOW_STOCK: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.BOTH,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['itemId', 'currentStock', 'threshold']
    },
    STOCKOUT: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.BOTH,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['itemId', 'menuItemIds']
    },
    UNIT_NEEDS_REVIEW: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['unitId', 'reasons']
    },
    CASH_VARIANCE: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['segmentId', 'variance']
    },
    STOCK_VARIANCE: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['itemId', 'projected', 'observed']
    },
    COGS_OVER_TARGET: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['cogsPct', 'target', 'dateKey']
    },
    MISSING_RECIPE: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.BOTH,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['menuItemId']
    },
    UNTRACKED_CONSUMPTION: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['itemId', 'qty']
    },
    LOYALTY_DRIFT: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['customerId', 'drift']
    },
    DRIFT_AFTER_CLOSING: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['period', 'frozen', 'live']
    },
    SNAPSHOT_VERIFY_FAILED: {
      severity: SEVERITY.DANGER, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['scope']
    },
    LOST_CONTAINER_PENDING: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['unitId', 'lostReportId']
    },
    DAY_NOT_CLOSED: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.BOTH,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['dateKey']
    },
    /* L9 nối — mẻ BTP nấu lệch yield >ngưỡng (commands/prep.js). Không tự
       kiểm chứng được bằng dữ liệu (mẻ đã nấu xong, không "hết điều kiện"
       theo thời gian) nên cần referenceId trỏ tới hành động đã soát (vd
       EditPrepYield), giống CASH_VARIANCE/STOCK_VARIANCE. */
    PREP_YIELD_MISMATCH: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['prepBatchId', 'prepItemId', 'variancePct']
    },
    /* L9 nối — 1 dòng kiểm kê không áp được lúc duyệt (commands/approval.js
       ApproveStockCount, mảng `failedLines`). Khác STOCK_VARIANCE (đó là
       lệch SỐ LƯỢNG đã biết cả 2 phía) — đây là LỖI ÁP DỤNG (không tìm
       thấy lô, ghi sổ hỏng...), nên cần loại riêng để không mất "reason". */
    STOCK_COUNT_LINE_FAILED: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.QUANLY,
      resolution: RESOLUTION.MANUAL_WITH_REFERENCE, required: ['stockCountId', 'itemId', 'reason']
    }
  };

  function isType(t) { return Object.prototype.hasOwnProperty.call(TYPES, t); }

  function raise(spec) {
    if (!spec || !isType(spec.type)) {
      return R.err('VALIDATION', 'loại cảnh báo chưa đăng ký: ' + (spec && spec.type) +
        ' — mọi loại phải khai severity/audience/cách đóng, không có khuôn chung');
    }
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'cảnh báo cần storeId hợp lệ');
    if (!spec.businessDate) return R.err('VALIDATION', 'cảnh báo cần businessDate');

    var def = TYPES[spec.type];
    var data = spec.data || {};
    for (var i = 0; i < def.required.length; i++) {
      if (data[def.required[i]] === undefined || data[def.required[i]] === null) {
        return R.err('VALIDATION',
          'cảnh báo ' + spec.type + ' thiếu trường chẩn đoán bắt buộc "' + def.required[i] + '"');
      }
    }

    return R.ok({
      /* Id xác định theo (type, subject): cùng một vấn đề không sinh 20 cảnh báo. */
      alertId: ids.deterministicId('alert', [spec.type, spec.storeId, spec.subjectKey || 'store']),
      type: spec.type,
      storeId: spec.storeId,
      severity: def.severity,
      audience: def.audience,
      resolution: def.resolution,
      status: STATUS.NEW,
      subjectKey: spec.subjectKey || null,
      data: data,
      businessDate: spec.businessDate,
      raisedAt: spec.at || null,
      raisedByOperationId: spec.operationId || null,
      seenAt: null, seenBy: null,
      resolvedAt: null, resolvedBy: null, resolvedReferenceId: null,
      autoClearedAt: null
    });
  }

  /**
   * Xếp hạng — đọc CẢ severity lẫn type.
   *
   * Đây là chỗ legacy sai: chỉ switch theo type nên alert `danger` không nằm
   * trong danh sách cứng bị nuốt vào bucket vàng chung.
   */
  function rank(alerts, spec) {
    spec = spec || {};
    var audience = spec.audience;
    return alerts
      .filter(function (a) {
        if (a.status === STATUS.RESOLVED || a.status === STATUS.AUTO_CLEARED) return false;
        if (!audience) return true;
        return a.audience === audience || a.audience === AUDIENCE.BOTH;
      })
      .slice()
      .sort(function (a, b) {
        var d = SEVERITY_RANK[b.severity] - SEVERITY_RANK[a.severity];
        if (d !== 0) return d;
        /* Cùng mức thì cũ trước — việc tồn lâu không được lùi xuống cuối. */
        if (a.raisedAt !== b.raisedAt) return (a.raisedAt || 0) - (b.raisedAt || 0);
        return a.alertId < b.alertId ? -1 : 1;
      });
  }

  /** Không có loại nào rơi vào bucket "khác" — mọi loại đều có nhà. */
  function bucketize(alerts, spec) {
    var ranked = rank(alerts, spec);
    var out = { DANGER: [], WARNING: [], INFO: [] };
    ranked.forEach(function (a) { out[a.severity].push(a); });
    return out;
  }

  /**
   * "Đã xem" — KHÔNG tắt push.
   * Legacy để "Đã xem" tắt cảnh báo y hệt "Đã xử lý"; ở đây nó chỉ ghi nhận
   * người đã nhìn thấy, vấn đề gốc vẫn còn nên vẫn còn hiện.
   */
  function markSeen(alert, spec) {
    if (alert.status !== STATUS.NEW) return R.ok(alert);
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'markSeen cần actorId');
    return R.ok(Object.assign({}, alert, {
      status: STATUS.SEEN, seenAt: spec.at || null, seenBy: spec.actorId
    }));
  }

  /**
   * "Đã xử lý" — với loại không tự kiểm chứng được thì BẮT BUỘC link tới hành
   * động đã sửa (ReviseState / ReverseTransaction / approval...). Không có link
   * thì đó chỉ là bấm cho khuất mắt.
   */
  function resolve(alert, spec) {
    if (alert.status === STATUS.RESOLVED || alert.status === STATUS.AUTO_CLEARED) {
      return R.err('PRECONDITION', 'cảnh báo đã đóng');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'resolve cần actorId');

    if (alert.resolution === RESOLUTION.AUTO_VERIFIABLE) {
      return R.err('PRECONDITION',
        'loại "' + alert.type + '" tự đóng khi điều kiện thật sự hết — không đóng tay được. ' +
        'Bấm tắt bằng tay là cách bỏ qua vấn đề gốc.');
    }
    if (!spec.referenceId) {
      return R.err('VALIDATION',
        'đóng cảnh báo "' + alert.type + '" phải kèm referenceId trỏ tới hành động đã sửa — ' +
        'không có tham chiếu thì không chứng minh được vấn đề đã được xử lý');
    }

    return R.ok(Object.assign({}, alert, {
      status: STATUS.RESOLVED,
      resolvedAt: spec.at || null,
      resolvedBy: spec.actorId,
      resolvedReferenceId: spec.referenceId
    }));
  }

  /**
   * Quét lại: loại AUTO_VERIFIABLE nào không còn điều kiện thì tự đóng.
   *
   * Đây là pattern của FIFO bell — cơ chế DUY NHẤT của legacy tự xoá đúng khi
   * điều kiện thật sự hết, thay vì chờ người bấm ẩn. Giờ là mặc định.
   *
   * @param spec.stillActiveKeys  danh sách subjectKey còn đang có vấn đề
   */
  function reconcile(alerts, spec) {
    var active = Object.create(null);
    (spec.stillActiveKeys || []).forEach(function (k) { active[k] = true; });

    var cleared = [];
    var next = alerts.map(function (a) {
      if (a.resolution !== RESOLUTION.AUTO_VERIFIABLE) return a;
      if (a.status === STATUS.RESOLVED || a.status === STATUS.AUTO_CLEARED) return a;
      if (active[a.subjectKey]) return a;
      var done = Object.assign({}, a, { status: STATUS.AUTO_CLEARED, autoClearedAt: spec.at || null });
      cleared.push(done);
      return done;
    });

    return R.ok({ alerts: next, cleared: cleared });
  }

  /**
   * Kênh ngoài app (push OS / SMS / Zalo) là CHỖ NỐI SẴN (§6 luồng chuẩn).
   * AlertEngine chỉ phát event; handler bên ngoài đăng ký sau, không phải sửa
   * lại engine.
   */
  function toEvents(alerts) {
    return alerts.map(function (a) {
      return {
        type: 'AlertRaised',
        alertId: a.alertId,
        alertType: a.type,
        severity: a.severity,
        audience: a.audience,
        storeId: a.storeId,
        businessDate: a.businessDate,
        data: a.data
      };
    });
  }

  return {
    SEVERITY: SEVERITY,
    AUDIENCE: AUDIENCE,
    RESOLUTION: RESOLUTION,
    STATUS: STATUS,
    TYPES: TYPES,
    isType: isType,
    raise: raise,
    rank: rank,
    bucketize: bucketize,
    markSeen: markSeen,
    resolve: resolve,
    reconcile: reconcile,
    toEvents: toEvents
  };
});

/**
 * BankPaymentAdapter — chuyển khoản VietQR.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §4.
 *

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

   * Sinh mã giao dịch ngân hàng — giữ đúng định dạng legacy `'GG' + ddHHmmss`.
   * Định dạng này có ý nghĩa với người đối soát sao kê, nên không đổi.
   */

  function createBankPayment(opts) {
    opts = opts || {};
    var store = opts.confirmationStore;
    if (!store) throw new Error('[bank-payment] cần confirmationStore (RTDB bank_confirmations)');
    var clock = opts.clock;
    if (!clock) throw new Error('[bank-payment] cần clock');

    var active = Object.create(null);

    /** Dựng URL ảnh QR. Tài khoản cố định của quán, cấu hình ở ngoài. */

      if (typeof spec.amount !== 'number' || !(spec.amount > 0)) {
        return R.err('VALIDATION', 'số tiền phải dương');
      }
      return R.ok({
        bankOrderId: spec.bankOrderId,
        url: opts.qrBaseUrl + '?acc=' + encodeURIComponent(opts.bankAccount)
          + '&amount=' + spec.amount
          + '&addInfo=' + encodeURIComponent(spec.bankOrderId),
        amount: spec.amount
      });
    }

    /**
     * Mở một lượt chờ chuyển khoản.
     *
     * KHÔNG có timeout (§4.3). Legacy không có `setTimeout` nào tự đóng popup,
     * và đó là quyết định nghiệp vụ hợp lý — nhân viên toàn quyền quyết định
     * khi nào huỷ. Không tự ý thêm vào.
     */
    function open(spec) {
      var bankOrderId = spec.bankOrderId || genBankOrderId(clock.now());
      var qr = buildQrUrl({ bankOrderId: bankOrderId, amount: spec.amount });
      if (R.isErr(qr)) return qr;

      var session = {
        bankOrderId: bankOrderId,
        amount: spec.amount,
        qrUrl: qr.value.url,
        openedAt: clock.now(),
        status: 'WAITING',
        /* §4.5 — nói rõ ngay trong dữ liệu để không ai dùng nhầm. */
        notAnOperationId: true
      };
      active[bankOrderId] = session;

      /* Lắng nghe node one-shot. Cả hai đường (webhook và bấm tay) đều đi vào
         cùng một hàm settle. */
      var unsubscribe = store.listen(bankOrderId, function (snapshot) {
        if (!snapshot) return;
        settle(bankOrderId, 'WEBHOOK', snapshot);
      });
      session.unsubscribe = unsubscribe;

      return R.ok(session);
    }

    /**
     * Chốt một lượt. Dùng chung cho webhook lẫn bấm tay — §4.1 nói rõ đường
     * thủ công chạy ĐÚNG callback y hệt đường tự động, không có luồng riêng.
     */

      var session = active[bankOrderId];
      if (!session) return R.err('NOT_FOUND', 'không có lượt chờ nào cho ' + bankOrderId);
      if (session.status !== 'WAITING') {
        /* One-shot: chốt lần hai là no-op có kiểm soát. */
        return R.ok(Object.assign({}, session, { replayed: true }));
      }

      session.status = 'CONFIRMED';
      session.confirmedAt = clock.now();
      session.source = source;
      if (session.unsubscribe) session.unsubscribe();

      /* Xoá node NGAY — bắt tay một lần. */
      store.remove(bankOrderId);
      delete active[bankOrderId];

      if (typeof opts.onConfirmed === 'function') opts.onConfirmed(session);

      return R.ok({
        bankOrderId: bankOrderId,
        source: source,
        amountShown: snapshot && typeof snapshot.amount === 'number' ? snapshot.amount : null,
        expectedAmount: session.amount,
        /* Cờ này luôn true. Đọc code ở đây mà tưởng số tiền đã được kiểm là
           hiểu sai một ranh giới protected — xem ghi chú đầu file. */
        amountNotVerifiedClientSide: true,
        confirmedAt: session.confirmedAt
      });
    }

    /** Nhân viên bấm "ĐÃ CHUYỂN KHOẢN XONG". */
    function confirmManually(bankOrderId) {
      return settle(bankOrderId, 'MANUAL', null);
    }

    /** Nhân viên tự đóng popup. */
    function cancel(bankOrderId) {
      var session = active[bankOrderId];
      if (!session) return R.err('NOT_FOUND', 'không có lượt chờ nào cho ' + bankOrderId);
      if (session.unsubscribe) session.unsubscribe();
      session.status = 'CANCELLED';
      delete active[bankOrderId];
      return R.ok(session);
    }

    function activeCount() { return Object.keys(active).length; }

    return {
      genBankOrderId: genBankOrderId,
      buildQrUrl: buildQrUrl,
      open: open,
      confirmManually: confirmManually,
      cancel: cancel,
      activeCount: activeCount
    };
  }

  return { genBankOrderId: genBankOrderId, createBankPayment: createBankPayment };
});

/**
 * BillPrinterAdapter — máy in bill, Bluetooth qua APK.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §1.
 *
 * Ba điều đã chốt, giữ nguyên:
 *   - CHỈ một đường Bluetooth qua `AndroidPrinter.printBillRawBytes`.

 *     duyệt thường như legacy.

 *
 * Cửa sổ thời gian cho phép in lại, log chống gian lận, giới hạn hiển thị lịch
 * sử bill KHÔNG nằm ở đây — chúng là business rule, thuộc `packages/commands`
 * (ranh giới §5).
 */
GIEO.define('protected-adapters/bill-printer', [
  'shared-kernel/result',
  'protected-adapters/print-queue'
], function (R, queueLib) {
  'use strict';

  /**
   * @param opts.bridge      native-bridge
   * @param opts.encodeBill  (content) => bytes — rasterize canvas thành byte
   * @param opts.onError
   */
  function createBillPrinter(opts) {
    opts = opts || {};
    var bridge = opts.bridge;
    if (!bridge) throw new Error('[bill-printer] cần bridge');

    /* Queue RIÊNG của máy in bill — tem kẹt giấy không được làm nghẽn in bill. */
    var queue = queueLib.createPrintQueue({ name: 'bill-printer', onError: opts.onError });

    var state = { enabled: true, mac: null, connected: false };

    function setEnabled(v) { state.enabled = !!v; }
    function isEnabled() { return state.enabled; }

    /** Nhớ MAC. Legacy lưu ở `printer_layout_gieogieo.billPrinterMac` (dùng
        chung mọi máy POS trong quán) — adapter chỉ giữ giá trị, nơi lưu là
        việc của tầng persistence. */
    function rememberMac(mac) {
      state.mac = mac || null;
      return R.ok(state.mac);
    }

    function connect(mac) {
      var target = mac || state.mac;
      if (!target) {
        return Promise.resolve(R.err('PRECONDITION',
          'chưa có địa chỉ máy in bill — phải ghép nối Bluetooth trong Cài đặt Android trước'));
      }
      return bridge.connectBluetooth(target).then(function (r) {
        state.connected = R.isOk(r);
        if (R.isOk(r)) state.mac = target;
        return r;
      });
    }

    /** Tự nối lại lúc khởi động bằng MAC đã nhớ. */
    function reconnectOnBoot() {
      if (!state.mac) return Promise.resolve(R.ok({ skipped: 'NO_REMEMBERED_MAC' }));
      return connect(state.mac);
    }

    /**
     * In một bill.
     *
     * LUÔN trả Promise đã resolve — lỗi in là giá trị trả về. Caller (luồng
     * thanh toán) gọi fire-and-forget và KHÔNG được để kết quả ở đây ảnh hưởng
     * tới việc bill đã ghi và kho đã trừ.
     */
    function print(content, label) {
      if (!state.enabled) {
        return Promise.resolve(R.ok({ skipped: 'PRINTER_DISABLED' }));
      }
      return queue.enqueue(function () {
        var bytes = opts.encodeBill ? opts.encodeBill(content) : content;
        return bridge.printBillRawBytes(bytes).then(function (r) {
          if (R.isErr(r)) throw new Error(r.error.message);
          return true;
        });
      }, label || 'bill');
    }

    /**
     * In lại. Về mặt kỹ thuật giống hệt in lần đầu — "in thuần tuý", không có
     * side-effect nào khác (§1.4). Việc có được in lại hay không, và ghi log
     * chống gian lận, là quyết định của tầng command.
     */
    function reprint(content, label) {
      return print(content, label || 'reprint-bill');
    }

    function openCashDrawer() { return bridge.openCashDrawer(); }

    return {
      setEnabled: setEnabled,
      isEnabled: isEnabled,
      rememberMac: rememberMac,
      connect: connect,
      reconnectOnBoot: reconnectOnBoot,
      print: print,
      reprint: reprint,
      openCashDrawer: openCashDrawer,
      drain: queue.drain,
      queueStats: queue.snapshot,
      queueHealthy: queue.isHealthy,
      state: function () { return Object.assign({}, state); }
    };

/**
 * LabelPrinterAdapter — máy in tem, LAN/TCP qua APK.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §2.
 *
 * Phức tạp hơn máy in bill nhiều, và ĐỘ PHỨC TẠP ĐÓ LÀ CẦN THIẾT — máy in tem
 * tự đóng socket sau 30-90s nhàn rỗi và chỉ nhận MỘT phiên TCP tại một thời
 * điểm. Ba lớp chống rớt dưới đây mỗi lớp giải quyết một race condition thật
 * đã được vá qua nhiều đợt, không phải dư thừa (§2.5):
 *
 *   1. Nhớ IP cuối (cấp MÁY, không lưu cloud vì IP đổi theo DHCP) → nối lại
 *      ngay trước khi in.
 *   2. Watchdog nền định kỳ — chỉ chạy nếu APK hỗ trợ, phải FEATURE-DETECT.
 *   3. Khoá single-flight chống gọi connect chồng lấp — bắt buộc vì máy chỉ
 *      nhận một phiên.
 *
 * Hai điều KHÔNG được làm:
 *   - KHÔNG thêm đường gửi fallback thứ hai (§2.4). Legacy từng có fallback qua
 *     app trung gian và đã CỐ Ý xoá vì gây văng WebView khi máy in mất kết nối.
 *   - KHÔNG auto-detect giao thức theo model máy (§2.3) — nhân viên chọn tay,
 *     mặc định TSPL.
 */
GIEO.define('protected-adapters/label-printer', [
  'shared-kernel/result',
  'protected-adapters/print-queue'
], function (R, queueLib) {
  'use strict';

  /* TSPL có lệnh SIZE/GAP/OFFSET để máy tự canh tem → khuyến nghị mặc định.
     ESC/POS không có khái niệm khổ tem nên dễ in đè. */
  var ENGINE = { TSPL: 'TSPL', ESCPOS: 'ESCPOS' };

  function createLabelPrinter(opts) {
    opts = opts || {};
    var bridge = opts.bridge;
    if (!bridge) throw new Error('[label-printer] cần bridge');

    /* Queue RIÊNG — độc lập với máy in bill (gate §8). */
    var queue = queueLib.createPrintQueue({ name: 'label-printer', onError: opts.onError });

    var state = {
      enabled: true,
      engine: opts.engine || ENGINE.TSPL,
      ip: null,
      port: opts.port || 9100,
      connected: false,
      keepAliveOn: false
    };

    /* Lớp 3 — single-flight. Nhiều lời gọi cùng lúc dùng CHUNG một promise
       kết nối, vì máy chỉ nhận một phiên TCP. */
    var connecting = null;

    function setEngine(engine) {
      if (!ENGINE[engine]) return R.err('VALIDATION', 'giao thức không hợp lệ: ' + engine);
      /* Chọn tay, không auto-detect theo model (§2.3). */
      state.engine = engine;
      return R.ok(state.engine);
    }

    function setEnabled(v) { state.enabled = !!v; }
    function isEnabled() { return state.enabled; }

    /** Lớp 1 — nhớ IP cấp MÁY. Không lưu cloud: IP đổi theo DHCP. */
    function rememberIp(ip, port) {
      state.ip = ip || null;
      if (port) state.port = port;
      state.connected = false;
      return R.ok({ ip: state.ip, port: state.port });
    }

    /**
     * Lớp 3 — bảo đảm đã kết nối, chống gọi chồng lấp.
     * Nhiều lượt in song song cùng chờ một lời gọi connect duy nhất.
     */
    function ensureConnected() {
      if (state.connected) return Promise.resolve(R.ok({ reused: true }));
      if (connecting) return connecting;
      if (!state.ip) {
        return Promise.resolve(R.err('PRECONDITION', 'chưa biết IP máy in tem'));
      }

      connecting = bridge.connectLan(state.ip, state.port).then(function (r) {
        state.connected = R.isOk(r);
        connecting = null;
        return r;
      }, function (e) {
        connecting = null;
        state.connected = false;
        return R.err('RETRYABLE', 'kết nối máy in tem lỗi: ' + (e && e.message ? e.message : e));
      });
      return connecting;
    }

    /**
     * Lớp 2 — watchdog nền. FEATURE-DETECT vì chỉ APK bản mới có.
     * Open Question §7.1 chưa được trả lời nên KHÔNG giả định luôn sẵn có.
     */
    function startKeepAlive() {
      if (!bridge.supportsKeepAlive()) {
        return Promise.resolve(R.ok({
          skipped: 'APK_KHONG_HO_TRO',
          note: 'APK này thiếu setTemKeepAlive/getTemStatus — dựa vào lớp 1 và 3'
        }));
      }
      return bridge.setKeepAlive(true).then(function (r) {
        state.keepAliveOn = R.isOk(r);
        return r;
      });
    }

    /** Dựng byte theo giao thức đang chọn. Khác nhau ở header/footer lệnh. */
    function encode(bitmap, spec) {
      if (state.engine === ENGINE.TSPL) {
        return {
          engine: ENGINE.TSPL,
          /* SIZE/GAP/OFFSET để máy tự canh tem. */
          header: { size: spec.size, gap: spec.gap, offset: spec.offset || 0 },
          bitmap: bitmap
        };
      }
      return { engine: ENGINE.ESCPOS, header: null, bitmap: bitmap };
    }

    /**
     * In tem. Nối lại ngay trước khi in (lớp 1), qua queue tự phục hồi.
     * Đường gửi DUY NHẤT là `printRawBytes` — không fallback.
     */
    function print(bitmap, spec, label) {
      if (!state.enabled) return Promise.resolve(R.ok({ skipped: 'PRINTER_DISABLED' }));

      return queue.enqueue(function () {
        return ensureConnected().then(function (c) {
          if (R.isErr(c)) throw new Error(c.error.message);
          var payload = encode(bitmap, spec || {});
          var bytes = opts.encodeLabel ? opts.encodeLabel(payload) : payload;
          return bridge.printRawBytes(bytes).then(function (r) {
            if (R.isErr(r)) {
              /* Mất kết nối giữa chừng: đánh dấu để lượt sau nối lại,
                 KHÔNG thử đường gửi khác. */
              state.connected = false;
              throw new Error(r.error.message);
            }
            return true;
          });
        });
      }, label || 'tem');
    }

    /**
     * In nhiều tem. Vẫn tuần tự qua queue vì máy chỉ nhận một phiên — song
     * song hoá ở đây là cách làm rớt kết nối.
     */
    function printBatch(items, spec) {
      var results = [];
      var chain = Promise.resolve();
      items.forEach(function (it, i) {
        chain = chain.then(function () {
          return print(it, spec, 'tem-' + (i + 1)).then(function (r) { results.push(r); });
        });
      });
      return chain.then(function () {
        return R.ok({
          total: results.length,
          ok: results.filter(function (r) { return R.isOk(r); }).length,
          failed: results.filter(function (r) { return R.isErr(r); }).length,
          results: results
        });
      });
    }

    return {
      ENGINE: ENGINE,
      setEngine: setEngine,
      setEnabled: setEnabled,
      isEnabled: isEnabled,
      rememberIp: rememberIp,
      ensureConnected: ensureConnected,
      startKeepAlive: startKeepAlive,
      encode: encode,
      print: print,
      printBatch: printBatch,
      drain: queue.drain,
      queueStats: queue.snapshot,
      queueHealthy: queue.isHealthy,
      state: function () { return Object.assign({}, state); }
    };
  }

  return { ENGINE: ENGINE, createLabelPrinter: createLabelPrinter };
});

      hasScanner: function () { return !!scanner; },

      /** Đường gửi cho máy in BILL (Bluetooth). */

      /** Đường gửi cho máy in TEM (LAN/TCP) — đường DUY NHẤT, không fallback. */
      printRawBytes: function (bytes) {
        var g = requirePrinter('printRawBytes');
        if (R.isErr(g)) return Promise.resolve(g);
        return settle(printer.printRawBytes(bytes), 'in tem');
      },

      connectBluetooth: function (mac) {
        var g = requirePrinter('connectBluetoothApp');
        if (R.isErr(g)) return Promise.resolve(g);
        return settle(printer.connectBluetoothApp(mac), 'kết nối Bluetooth');
      },

      connectLan: function (ip, port) {
        var g = requirePrinter('connectPrinter');
        if (R.isErr(g)) return Promise.resolve(g);
        return settle(printer.connectPrinter(ip, port), 'kết nối LAN');
      },

      /**
       * Watchdog LAN chỉ có ở APK bản mới → FEATURE-DETECT như legacy.
       * Open Question §7.1 chưa được trả lời (không rõ mọi máy production đã
       * lên bản mới chưa), nên KHÔNG giả định là luôn có.

      supportsKeepAlive: function () {
        return !!(printer && typeof printer.setTemKeepAlive === 'function'
          && typeof printer.getTemStatus === 'function');

      setKeepAlive: function (enabled) {
        if (!printer || typeof printer.setTemKeepAlive !== 'function') {
          return Promise.resolve(R.err('PRECONDITION', 'APK này không hỗ trợ watchdog LAN'));
        }
        return settle(printer.setTemKeepAlive(enabled), 'bật watchdog');
      },
      getTemStatus: function () {

/* ===== src/layers/protected-adapters/print-queue.js ===== */
/**
 * Hàng đợi in TỰ PHỤC HỒI — đây là BUG THẬT phải sửa, không phải giữ nguyên.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §1.2, §6.1.
 *
 * ────────────────────────────────────────────────────────────────────────
 * Legacy `POSPrinter._queue = Promise.resolve()`, mọi lệnh in chain kiểu
 *     this._queue = this._queue.then(() => this._doPrint(order));
 * KHÔNG có `.catch()` phục hồi. Một lần in lỗi (mất kết nối, hết giấy) làm
 * `_queue` thành Promise rejected VĨNH VIỄN → mọi lệnh in bill sau đó, kể cả
 * reprint, im lặng không chạy nữa cho tới khi reload app.
 *
 * Pattern ĐÚNG đã có sẵn ngay trong chính codebase legacy, ở máy in tem:
 *     var next = _queue.then(fn, fn);   // lỗi lượt trước không chặn lượt sau
 *     _queue = next.catch(function(){});// luôn giữ queue ở trạng thái chạy được
 *
 * Contract §6 nói rõ: đây là lỗi kỹ thuật thuần tuý, không phải quyết định
 * nghiệp vụ, nên KHÔNG được "giữ nguyên để tương thích".
 * ────────────────────────────────────────────────────────────────────────
 *
 * Gate §8 đòi bill printer và label printer có queue ĐỘC LẬP — máy in tem kẹt
 * giấy không được làm nghẽn in bill. Nên đây là factory, mỗi adapter tự tạo
 * một instance riêng.
 */
GIEO.define('protected-adapters/print-queue', ['shared-kernel/result'], function (R) {
  'use strict';

  /**
   * @param opts.name     tên để báo lỗi cho người đọc
   * @param opts.onError  gọi khi một lượt in hỏng (toast/alert) — KHÔNG chặn lượt sau
   */
  function createPrintQueue(opts) {
    opts = opts || {};
    var name = opts.name || 'printer';
    var chain = Promise.resolve();
    var stats = { queued: 0, done: 0, failed: 0 };

    /**
     * Xếp một lượt in. LUÔN trả Promise<Result> đã resolve — lỗi in là giá trị
     * trả về, không phải exception, vì in hỏng không được làm sập luồng bán hàng.
     */
    function enqueue(job, label) {
      stats.queued += 1;

      var result = chain.then(runJob, runJob);

      /* Mấu chốt: chain kế tiếp LUÔN là một promise đã được nuốt lỗi, nên một
         lượt hỏng không bao giờ đầu độc những lượt sau. */
      chain = result.catch(function () {});
      return result;

      function runJob() {
        return Promise.resolve()
          .then(job)
          .then(function (value) {
            stats.done += 1;
            return R.ok(value === undefined ? true : value);
          })
          .catch(function (e) {
            stats.failed += 1;
            var err = R.err('RETRYABLE',
              '[' + name + '] in hỏng' + (label ? ' (' + label + ')' : '') + ': ' + (e && e.message ? e.message : e));
            if (typeof opts.onError === 'function') {
              /* Handler người dùng hỏng cũng không được làm nghẽn hàng đợi. */
              try { opts.onError(err, label); } catch (ignored) { /* noop */ }
            }
            return err;
          });
      }
    }

    /** Chờ hàng đợi rỗng — dùng cho test và cho lúc tắt app. */
    function drain() {
      return chain.then(function () { return R.ok(Object.assign({}, stats)); });
    }

    function snapshot() { return Object.assign({}, stats); }

    /**
     * Hàng đợi có còn chạy được không. Ở legacy câu này luôn là "không" sau
     * lần lỗi đầu tiên; ở đây nó luôn là "có" theo thiết kế, và test chứng minh.
     */
    function isHealthy() {
      return chain instanceof Promise;
    }

    return {
      name: name,
      enqueue: enqueue,
      drain: drain,
      snapshot: snapshot,
      isHealthy: isHealthy
    };
  }

  return { createPrintQueue: createPrintQueue };
});

/**
 * ScannerAdapter — máy quét mã, qua UI native.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §3.
 *
 * WebView không tự cấp quyền camera cho app quán (thiếu `onPermissionRequest`),
 * nên việc quét giao hẳn cho UI native. Kết quả về qua global callback +
 * pending-map, KHÔNG phải Promise trực tiếp từ native.
 *
 * CONTRACT CỐT LÕI: `scan()` LUÔN RESOLVE, KHÔNG BAO GIỜ REJECT.
 * Caller luôn nhận `{ok, code, format, error}` và tự xử lý `ok:false` — không
 * dùng try/catch cho luồng lỗi bình thường. Quét không ra mã là chuyện thường
 * ngày ở quầy, không phải ngoại lệ chương trình.
 *
 * MỘT THỨ BỔ SUNG SO VỚI LEGACY (§3.3, §6.2): fallback NHẬP MÃ BẰNG TAY.
 * Audit không tìm thấy ô nhập tay nào khi máy quét timeout/lỗi, và khi hoàn
 * toàn không có scanner cũng không thấy input thay thế. Contract kết luận đây
 * nhiều khả năng là gap thật và yêu cầu bổ sung tường minh.
 *
 * Đối chiếu mã trùng (`chanMaTrung`) KHÔNG nằm ở đây — adapter chỉ trả mã thô;
 * validate thuộc Unit Identity ở `packages/commands` (ranh giới §5).
 */
GIEO.define('protected-adapters/scanner', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  var DEFAULT_TIMEOUT_MS = 90000;

  var FAIL = {
    NO_SCANNER: 'NO_SCANNER',
    TIMEOUT: 'TIMEOUT',
    BRIDGE_ERROR: 'BRIDGE_ERROR',
    CANCELLED: 'CANCELLED'
  };

  function createScanner(opts) {
    opts = opts || {};
    var bridge = opts.bridge;
    if (!bridge) throw new Error('[scanner] cần bridge');

    var timeoutMs = opts.timeoutMs || DEFAULT_TIMEOUT_MS;
    var setTimer = opts.setTimeout || function (fn, ms) { return setTimeout(fn, ms); };
    var clearTimer = opts.clearTimeout || function (t) { return clearTimeout(t); };

    /* pending-map: native gọi ngược đúng một lần, đối chiếu theo id. */
    var pending = Object.create(null);
    var seq = 0;

    function available() { return bridge.hasScanner(); }

    /**
     * Quét một mã. LUÔN resolve.
     * Kết quả: `{ok:true, code, format, source}` hoặc `{ok:false, reason, message}`.
     */
    function scan(label) {
      seq += 1;
      var scanId = ids.deterministicId('operation', ['scan', String(Date.now()), String(seq)]);

      if (!available()) {
        /* Không có máy quét KHÔNG phải lỗi chương trình — caller chuyển sang
           nhập tay. */
        return Promise.resolve({
          ok: false, reason: FAIL.NO_SCANNER,
          message: 'máy này không có máy quét — nhập mã bằng tay',
          canFallbackToManual: true
        });
      }

      return new Promise(function (resolve) {
        var done = false;
        function finish(result) {
          if (done) return;
          done = true;
          clearTimer(timer);
          delete pending[scanId];
          resolve(result);
        }

        /* Timeout đề phòng app native treo — không có nó thì Promise treo mãi. */
        var timer = setTimer(function () {
          finish({
            ok: false, reason: FAIL.TIMEOUT,
            message: 'máy quét không phản hồi sau ' + Math.round(timeoutMs / 1000) + 's',
            canFallbackToManual: true
          });
        }, timeoutMs);

        pending[scanId] = finish;

        var started = bridge.startScan(scanId);
        if (R.isErr(started)) {
          finish({
            ok: false, reason: FAIL.BRIDGE_ERROR,
            message: started.error.message,
            canFallbackToManual: true
          });
        }
      });
    }

    /**
     * Native gọi ngược. Gắn hàm này vào `window.__androidScanResult`.
     * Kết quả lạ (id không còn chờ, gọi hai lần) bị bỏ qua có kiểm soát.
     */
    function handleNativeResult(res) {
      if (!res || !res.id) return R.err('VALIDATION', 'kết quả quét thiếu id');
      var finish = pending[res.id];
      if (!finish) {
        /* Đến muộn sau timeout, hoặc gọi lần hai. Không nổ, nhưng cũng không
           im lặng hoàn toàn — trả về để nơi gọi ghi log nếu muốn. */
        return R.err('NOT_FOUND', 'không có lượt quét nào đang chờ id ' + res.id);
      }
      if (res.cancelled) {
        finish({ ok: false, reason: FAIL.CANCELLED, message: 'người dùng huỷ quét', canFallbackToManual: true });
        return R.ok(true);
      }
      if (!res.code) {
        finish({ ok: false, reason: FAIL.BRIDGE_ERROR, message: res.error || 'không đọc được mã', canFallbackToManual: true });
        return R.ok(true);
      }
      finish({ ok: true, code: String(res.code), format: res.format || null, source: 'SCANNER' });
      return R.ok(true);
    }

    /**
     * FALLBACK NHẬP TAY — bổ sung so với legacy (§6.2).
     * Trả về CÙNG hình dạng với `scan()` để nơi gọi không phải rẽ nhánh theo
     * nguồn; `source` phân biệt để tầng nghiệp vụ ghi audit nếu cần.
     */
    function manualEntry(code) {
      var trimmed = typeof code === 'string' ? code.trim() : '';
      if (!trimmed) {
        return { ok: false, reason: FAIL.BRIDGE_ERROR, message: 'mã nhập tay rỗng', canFallbackToManual: true };
      }
      return { ok: true, code: trimmed, format: null, source: 'MANUAL' };
    }

    /** Huỷ mọi lượt đang chờ — dùng khi đóng màn hình. */
    function cancelAll() {
      Object.keys(pending).forEach(function (id) {
        pending[id]({ ok: false, reason: FAIL.CANCELLED, message: 'đóng màn hình', canFallbackToManual: true });
      });
      return R.ok(true);
    }

    function pendingCount() { return Object.keys(pending).length; }

    return {
      FAIL: FAIL,
      available: available,
      scan: scan,
      handleNativeResult: handleNativeResult,
      manualEntry: manualEntry,
      cancelAll: cancelAll,
      pendingCount: pendingCount
    };
  }

  return { DEFAULT_TIMEOUT_MS: DEFAULT_TIMEOUT_MS, createScanner: createScanner };
});

 * lớn giá trị của adapter này nằm ở chỗ nói ra được cái gì KHÔNG biết.

GIEO.define('legacy-firebase-adapter/mappers', [
  'shared-kernel/ids',
  'shared-kernel/result'

  'use strict';

  var AMBIGUOUS = {
    NO_COST_BASIS: 'NO_COST_BASIS',
    NO_ACTOR: 'NO_ACTOR',
    NO_RECIPE_VERSION: 'NO_RECIPE_VERSION',
    NO_SUPPLIER: 'NO_SUPPLIER',
    NEGATIVE_UNIT_BASE: 'NEGATIVE_UNIT_BASE'
  };

  /* Legacy status → canonical lifecycle (FIFO-CORE-ARCHITECTURE-V2.md §2). */
  var STATUS_MAP = {
    sealed: 'SEALED',
    open: 'OPEN',
    finished: 'PHYSICALLY_FINISHED',
    used_up: 'PHYSICALLY_FINISHED',
    lost: 'LOST',
    voided: 'VOIDED'
  };

    list.push({ code: code, detail: detail || null });
  }

  /**
   * Unit — phải xử lý CẢ HAI nguồn và merge đúng như `_ueRecomputeCurrentStock`.
   *
   * `stock_containers_gieogieo` (Firestore) là nguồn thật cho sealed/finished;
   * `active_units_gieogieo` (RTDB) là phản chiếu real-time của unit ĐANG MỞ.
   * Hai nguồn có thể lệch nhau — legacy có biến `_ueRtStale` cho đúng chuyện
   * này. Merge phải nói ra khi lệch, không im lặng chọn một bên.
   *
   * @param spec.container  bản ghi Firestore

    if (!c || !c.code) return R.err('VALIDATION', 'bản ghi container thiếu code');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'mapUnit cần storeId hợp lệ');

    var status = STATUS_MAP[c.status] || null;
    if (!status) {
      return R.err('AMBIGUOUS_LEGACY',

       NÓI RA thay vì bịa một con số. */

      costBasis = { unitCost: c.unitCost, currency: 'VND', versionId: null, source: 'LEGACY' };
    } else {
      flag(ambiguous, AMBIGUOUS.NO_COST_BASIS,
        'container legacy không lưu giá vốn — COGS actual cho Unit này không tính được');
    }

    if (!c.supplierId && !c.receiveRefId) flag(ambiguous, AMBIGUOUS.NO_SUPPLIER);

    /* Merge 2 nguồn. RTDB thắng cho số dư của unit đang mở, đúng như legacy —
       nhưng lệch thì ghi nhận. */

        storeId: spec.storeId,
        itemKind: spec.itemKind || 'raw',
        receiptId: c.receiveRefId || null,
        supplierId: c.supplierId || null,
        receivedAt: c.createdAt || null,
        receivedBy: c.createdBy || null,

        finishedBy: c.finishedBy || null,
        finishReason: c.finishReason || null,
        wasteQty: typeof c.wasteBase === 'number' ? c.wasteBase : 0,
        debt: debt,
        lostAt: c.lostAt || null, lostBy: c.lostBy || null, lostReportId: c.lostReportId || null,
        foundAt: null, foundBy: null,
        needsReview: ambiguous.length > 0,
        needsReviewReasons: ambiguous.map(function (a) { return a.code; }),
        physicalReconciliations: (c.notEmptyChecks || []).map(function (n) {
          return {
            operationId: null, at: n.at || null, actorId: n.by || null,
            before: null, actual: n.qty, delta: null,
            method: 'weighing', reason: null
          };
        }),
        operationId: null,
        legacySource: { code: c.code, id: c.id || null }

      ambiguous: ambiguous,
      /* Lệch 2 nguồn là thông tin cho shadow-compare, không phải lỗi map. */
      sourceDrift: drift
    });
  }

  /** Ledger — gộp stock_transactions và prep_transactions, phân biệt bằng domain. */
  function mapLedgerEntry(spec) {
    var t = spec.tx;
    if (!t) return R.err('VALIDATION', 'thiếu bản ghi giao dịch');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'mapLedgerEntry cần storeId');

    var ambiguous = [];
    if (!t.staffEmployeeId && !t.actorId) flag(ambiguous, AMBIGUOUS.NO_ACTOR);

    var unitId = t.containerCode
      ? ids.deterministicId('unit', ['legacy', t.containerCode])
      : null;
    var qtyDelta = typeof t.qtyDelta === 'number' ? t.qtyDelta : (t.qty || 0);

    return R.ok({
      entry: {
        entryId: ids.deterministicId('ledger', ['legacy', t.id || String(t.txId || Math.random())]),
        operationId: t.txId || null,
        domain: spec.domain || 'raw',
        type: (t.type || 'ADJUSTMENT').toUpperCase(),
        itemId: ids.deterministicId('item', ['legacy', t.itemId || 'unknown']),
        storeId: spec.storeId,
        unitId: unitId,
        qtyDelta: qtyDelta,
        /* Quy tắc §5 áp NGAY lúc map — dữ liệu cũ vào canonical cũng phải tuân
           đúng luật, không có ngoại lệ cho dữ liệu migrate. */
        untrackedPendingDelta: unitId ? 0 : qtyDelta,
        costBasisVersionId: null,
        unitCost: typeof t.unitCost === 'number' ? t.unitCost : null,
        businessDate: t.dateKey || null,
        actorId: t.staffEmployeeId || t.actorId || null,
        occurredAt: t.createdAt || null,
        referenceType: t.refType || null,
        referenceId: t.refId || null,
        reason: t.reason || null
      },
      ambiguous: ambiguous
    });
  }

  /**
   * Recipe — legacy KHÔNG có versioning, ghi đè trực tiếp.
   *
   * §4 yêu cầu tự tạo `versionId` giả từ `updatedAt` và đánh dấu
   * `versionSource: 'legacy-inferred'` để phân biệt với version thật tạo sau
   * cutover. Nói rõ: version này KHÔNG chứng minh được công thức tại thời điểm
   * bill cũ là gì — chỉ là ảnh chụp lúc migrate.
   */
  function mapRecipe(spec) {
    var r = spec.recipe;
    if (!r) return R.err('VALIDATION', 'thiếu bản ghi recipe');
    if (!spec.menuRefKey) return R.err('VALIDATION', 'mapRecipe cần menuRefKey');

    var ambiguous = [{
      code: AMBIGUOUS.NO_RECIPE_VERSION,
      detail: 'legacy ghi đè recipe trực tiếp — version này chỉ là ảnh chụp lúc migrate, ' +
        'KHÔNG chứng minh được công thức tại thời điểm các bill cũ'
    }];

    var rows = [];
    Object.keys(r).forEach(function (size) {
      if (!r[size] || typeof r[size] !== 'object') return;
      rows.push({
        size: size,
        components: Object.keys(r[size]).map(function (refId) {
          return { refType: 'item', refId: refId, qty: r[size][refId] };
        })
      });
    });

    return R.ok({
      recipeId: ids.deterministicId('recipe', ['legacy', spec.menuRefKey]),
      versionId: ids.deterministicId('version', ['legacy', spec.menuRefKey, String(r.updatedAt || 0)]),
      versionSource: 'legacy-inferred',
      effectiveFrom: r.updatedAt || null,
      components: rows.reduce(function (acc, x) { acc[x.size] = x.components; return acc; }, {}),
      ambiguous: ambiguous
    });
  }

  /** Bill — giữ nguyên chi tiết, KHÔNG aggregate. */
  function mapBill(spec) {
    var o = spec.order;
    if (!o) return R.err('VALIDATION', 'thiếu bản ghi order');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'mapBill cần storeId');

    var ambiguous = [];
    /* Ngoại lệ duy nhất của toàn hệ thống cũ: Bill không lưu ai bán (§4.7). */
    if (!o.soldBy && !o.staffEmployeeId) {
      flag(ambiguous, AMBIGUOUS.NO_ACTOR,
        'bill legacy không lưu người bán — chỉ có gate "có ai đó đang check-in"');
    }

    var lines = (o.itemsArray || []).map(function (l, i) {
      return {
        billLineId: ids.deterministicId('billLine', ['legacy', spec.billId, String(i)]),
        menuItemId: ids.deterministicId('item', ['legacy', l.id || l.name || 'unknown']),
        name: l.name || null,
        size: l.size || null,
        qty: l.qty || 1,
        /* Giá đã snapshot sẵn trong bill — phần legacy làm ĐÚNG, giữ nguyên. */
        price: typeof l.price === 'number' ? l.price : null,
        isFree: !!l.isFree
      };
    });

    var channelType = o.isAppSale ? 'APP' : (o.isToGo ? 'TO_GO' : 'DINE_IN');
    var total = typeof o.total === 'number' ? o.total : null;
    var feePct = channelType === 'APP' && typeof o.appFeePct === 'number' ? o.appFeePct : 0;
    var channelFee = total === null ? null : total * feePct / 100;

    return R.ok({
      bill: {
        billId: ids.deterministicId('bill', ['legacy', spec.billId]),
        storeId: spec.storeId,
        businessDate: spec.businessDate || null,
        occurredAt: o.createdAt || null,
        soldByActorId: o.soldBy || o.staffEmployeeId || null,
        customerId: o.customerPhone
          ? ids.deterministicId('customer', [o.customerPhone]) : null,
        channel: {
          type: channelType,
          appName: o.appName || null,
          /* appFeePct ĐÃ có trong legacy nhưng chưa bao giờ được đọc — map sang
             để đường ống P&L theo kênh dùng được ngay. */
          feePct: feePct
        },
        lines: lines,
        subtotal: typeof o.subtotal === 'number' ? o.subtotal : null,
        discountTotal: typeof o.discount === 'number' ? o.discount : 0,
        total: total,
        channelFee: channelFee,
        netRevenue: total === null ? null : total - channelFee,
        /* Không tự tính netRevenue nếu thiếu total — thà để null còn hơn số sai. */
        status: 'COMPLETED',
        legacySource: { billId: spec.billId }
      },
      ambiguous: ambiguous
    });
  }

  /** Menu legacy → Catalog canonical. Category/recipe link được đánh dấu là suy ra. */
  function mapMenu(spec) {
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'mapMenu cần storeId');
    var raw = spec.items || {};
    var categories = [];
    var categoryByName = Object.create(null);
    var menuItems = [];
    var ambiguous = [];

    Object.keys(raw).forEach(function (key, index) {
      var item = raw[key] || {};
      if (!item.name) return;
      var categoryName = item.type || 'Khác';
      if (!categoryByName[categoryName]) {
        categoryByName[categoryName] = ids.deterministicId('item', ['legacy-category', categoryName]);
        categories.push({
          categoryId: categoryByName[categoryName], storeId: spec.storeId,
          name: categoryName, displayOrder: categories.length, archived: false,
          versionSource: 'legacy-inferred'
        });
      }
      var prices = {};
      if (typeof item.priceM === 'number') prices.M = item.priceM;
      if (typeof item.priceL === 'number') prices.L = item.priceL;
      if (!Object.keys(prices).length && typeof item.price === 'number') prices.M = item.price;
      var menuItemId = ids.deterministicId('item', ['legacy-menu', key]);
      menuItems.push({
        menuItemId: menuItemId, storeId: spec.storeId, name: item.name,
        categoryId: categoryByName[categoryName], prices: prices,
        recipeId: ids.deterministicId('recipe', ['legacy', (spec.recipePrefix || 'togo:') + key]),
        toppingIds: [], displayOrder: typeof item.displayOrder === 'number' ? item.displayOrder : index,
        color: item.color || null, archived: false, archivedAt: null,
        legacySource: { key: key, channel: spec.channel || 'TO_GO' }
      });
      ambiguous.push({
        code: AMBIGUOUS.NO_RECIPE_VERSION,
        detail: 'recipeId của món ' + key + ' được suy từ key legacy, chưa chứng minh recipe version lịch sử'
      });
    });
    return R.ok({ categories: categories, menuItems: menuItems, ambiguous: ambiguous });
  }

  return {
    AMBIGUOUS: AMBIGUOUS,
    STATUS_MAP: STATUS_MAP,
    mapUnit: mapUnit,
    mapLedgerEntry: mapLedgerEntry,
    mapRecipe: mapRecipe,
    mapBill: mapBill,
    mapMenu: mapMenu
  };
});

/** Read port schema cũ. Firebase client được inject; module không có bất kỳ API ghi nào. */
GIEO.define('legacy-firebase-adapter/read-port', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'legacy-firebase-adapter/legacy-paths',
  'legacy-firebase-adapter/mappers'
], function (ids, R, paths, mappers) {
  'use strict';

  function createReader(client) {
    client = client || {};

    function call(name, args) {
      if (typeof client[name] !== 'function') {
        return Promise.resolve(R.err('NOT_FOUND', 'legacy read client thiếu ' + name));
      }
      return Promise.resolve().then(function () { return client[name].apply(null, args); })
        .then(function (value) { return value && typeof value.ok === 'boolean' ? value : R.ok(value); })
        .catch(function (e) {

        });

      var p = paths.get(name);
      if (p.kind !== paths.RTDB) return Promise.resolve(R.err('VALIDATION', name + ' không phải RTDB'));
      return call('rtdbGet', [join(p.path, suffix)]);
    }
    function firestoreDoc(name, docId) {
      var p = paths.get(name);
      if (p.kind !== paths.FIRESTORE) return Promise.resolve(R.err('VALIDATION', name + ' không phải Firestore'));
      return call('firestoreGet', [p.path, docId]);
    }
    function firestoreQuery(name, query) {
      var p = paths.get(name);
      if (p.kind !== paths.FIRESTORE) return Promise.resolve(R.err('VALIDATION', name + ' không phải Firestore'));
      return call('firestoreQuery', [p.path, query || {}]);

     * cutover — hệ mới tự đọc hệ cũ, không cần ai export tay.
     *
     * Vẫn chỉ đọc: `firestoreQuery`/`rtdbGet` là hai hàm duy nhất đi ra ngoài,
     * và client được inject không phơi bất kỳ API ghi nào.

      spec = spec || {};

        return Promise.resolve(R.err('VALIDATION', 'loadUnit cần containerCode legacy'));

        if (R.isErr(container)) return container;

          allocations: [],

        if (R.isErr(rows)) return rows;
        var bills = [], ambiguous = [];
        Object.keys(rows.value.orders).forEach(function (id) {
          var mapped = mappers.mapBill({
            order: rows.value.orders[id], billId: id,
            storeId: spec.storeId, businessDate: spec.businessDate

          if (R.isOk(mapped)) {
            bills.push(mapped.value.bill);
            ambiguous = ambiguous.concat(mapped.value.ambiguous || []);
          }

      });
    }

    function loadMenu(spec) {
      spec = spec || {};
      var source = spec.legacyMenuSource === 'menu' ? 'menu' : 'menuTogo';
      return rtdb(source, null).then(function (rows) {
        if (R.isErr(rows)) return rows;

          items: rows.value || {}, storeId: spec.storeId,
          channel: source === 'menuTogo' ? 'TO_GO' : 'DINE_IN',
          recipePrefix: source === 'menuTogo' ? 'togo:' : 'dinein:'
        });
      });
    }

    /** Danh sách tối thiểu cho pre-auth PIN; tuyệt đối không ghi ngược legacy. */
    function loadEmployees(spec) {

      if (!ids.isId(spec.storeId, 'store')) {
        return Promise.resolve(R.err('VALIDATION', 'loadEmployees cần storeId hợp lệ'));
      }
      return firestoreQuery('employees', {}).then(function (rows) {
        if (R.isErr(rows)) return rows;
        var employees = Object.keys(rows.value || {}).map(function (legacyId) {
          var raw = rows.value[legacyId] || {};
          return {
            employeeId: ids.deterministicId('employee', ['legacy', legacyId]),
            actorId: ids.deterministicId('actor', ['legacy', legacyId]),
            storeId: spec.storeId,
            fullName: raw.fullName || raw.name || legacyId,
            pin: raw.pin || null,
            active: raw.active !== false,
            role: raw.role || 'POS_OPERATOR',
            allStoresRead: !!raw.allStoresRead,
            legacyRef: legacyId
          };
        });
        return R.ok(employees);

          }));
        }, function (error) {
          listener(R.err('RETRYABLE', 'theo dõi menu legacy thất bại: ' +
            (error && error.message ? error.message : error)));

        listener(R.err('RETRYABLE', 'khởi tạo theo dõi menu thất bại: ' + error.message));

    }

    return {
      loadAll: loadAll,
      loadUnit: loadUnit,
      loadLedger: loadLedger,
      loadUnitTrace: loadUnitTrace,
      loadBills: loadBills,
      loadMenu: loadMenu,
      loadEmployees: loadEmployees,
      watchMenu: watchMenu

  return { createReader: createReader };
