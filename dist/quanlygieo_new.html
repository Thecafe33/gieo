 *    module "tiêu thụ" tương ứng ở hệ mới — `loyalty/accrual.js#redeemStamps`
 *    đã viết luật (trừ 6 tem, cộng 1 ly miễn phí, cả hai đều là DÒNG SỔ) từ
 *    trước nhưng chưa command nào gọi. Ở đây cố ý gọi TRỰC TIẾP trong
 *    `RecordSale` (không qua event/handler như tích điểm ở mục 3) vì đổi tem
 *    là ĐIỀU KIỆN của GIÁ bill (dòng nào miễn phí), không phải phần thưởng
 *    PHÁT SINH SAU khi bán — phải cùng thành/bại với chính giao dịch, nếu
 *    không đủ tem thì bill không được chốt với dòng miễn phí đó.
 *    LOẠI BỎ "mã giảm giá"/voucher (`rewards`/`customers.myGifts`) KHÔNG nằm
 *    trong phạm vi này — chủ quán đã chỉ đạo trực tiếp cắt hẳn phần đó khi
 *    rebuild (`FEATURE-TREE-V1.md` §4.5, `GIEO-REBUILD-HANDOFF-V2.md`): tàn
 *    dư hệ 1.0, không có UI tạo ở cả 2 app, dữ liệu tới từ nguồn ngoài phạm
 *    vi rebuild. Cần lại thì đó là tính năng MỚI thiết kế từ đầu.
 */
GIEO.define('commands/sales', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'catalog/menu',
  'catalog/packaging',
  'catalog/ice',
  'recipe-cost-btp/recipe',
  'recipe-cost-btp/cogs',
  'fifo-core/allocation',
  'loyalty/accrual',
  'compaction/versioned-input'
], function (ids, R, pipeline, menuLib, packagingLib, iceLib, recipeLib, cogsLib, allocation, accrualLib, VI) {
  'use strict';

  var CHANNEL = {
    DINE_IN: 'DINE_IN',
    TO_GO: 'TO_GO',
    /* Sàn giao đồ ăn — có phí phần trăm, và phí đó PHẢI được đọc. */
    APP: 'APP'
  };

  /* Đúng 3 lựa chọn đá của quán — không có "ít/nhiều" (N2, chốt chủ quán
     2026-09). Giữ trên từng dòng để in tem/nhãn như legacy; KHÔNG rẽ nhánh
     COGS theo giá trị này — xem `catalog/ice.js`. */
  var ICE_TYPE = { CHUNG: 'CHUNG', RIENG: 'RIENG', KHONG: 'KHONG' };

  function validateChannel(ch) {
    if (!ch || !CHANNEL[ch.type]) return "channel.type phải là DINE_IN | TO_GO | APP";
    if (ch.type === CHANNEL.APP) {
      if (!ch.appName) return 'bán qua sàn phải ghi rõ tên sàn';
      if (typeof ch.feePct !== 'number' || ch.feePct < 0 || ch.feePct > 100) {
        return 'bán qua sàn phải ghi feePct hợp lệ — legacy ghi rồi không bao giờ đọc, ' +
          'nên P&L theo kênh không bao giờ đúng';
      }
    }
    return null;
  }

  /**
   * Dựng Bill từ giỏ hàng.
   *
   * Mỗi dòng mang GIÁ ĐÃ SNAPSHOT (catalog/menu.snapshotPrice) — mẫu ĐÚNG của
   * legacy cần giữ: sửa giá menu sau này không làm trôi số liệu bill lịch sử.
   */
  function buildBill(spec) {
    if (!spec) return R.err('VALIDATION', 'buildBill cần spec');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'bill cần storeId hợp lệ');
    if (!ids.isId(spec.soldByActorId, 'actor')) {
      return R.err('VALIDATION',
        'bill BẮT BUỘC có soldByActorId — không biết ai bán là ngoại lệ duy nhất của hệ thống cũ (§4.7)');
    }
    if (!spec.businessDate) return R.err('VALIDATION', 'bill cần businessDate');
    if (typeof spec.occurredAt !== 'number') return R.err('VALIDATION', 'bill cần occurredAt');

    var chBad = validateChannel(spec.channel);
    if (chBad) return R.err('VALIDATION', chBad);

    var lines = spec.lines || [];
    if (lines.length === 0) return R.err('VALIDATION', 'bill phải có ít nhất 1 dòng');

    /*
     * Đổi tem lấy ly miễn phí (N12, mục 7 ở trên) — cần customerId vì đổi tem
     * là trừ SỔ của khách, không có khách thì không có sổ để trừ.
     */
    /*
     * ĐIỂM NỐI cho voucher/mã giảm giá NẾU sau này triển khai lại (hiện KHÔNG
     * xây — xem mục 7 header): thêm case redemption.type mới ở đây (vd.
     * 'VOUCHER_CODE'), branch xác thực riêng (không cần customerId như tem
     * nếu voucher ẩn danh), rồi ở RecordSale.execute() thêm nhánh gọi module
     * "tiêu thụ" voucher tương ứng — theo ĐÚNG khuôn `redemption` này, không
     * cần đổi shape. `catalog/promotion.js` cũng đã chừa `extraPromotions`
     * cho khuyến mãi/voucher dạng giảm giá (khác voucher đổi-lấy-sản-phẩm ở
     * đây). Không tự suy luận thêm gì ngoài điểm nối — chờ quyết định thiết
     * kế mới nếu/khi việc đó xảy ra.
     */
    var redemption = spec.redemption || null;
    if (redemption) {
      if (redemption.type !== 'STAMP_FREE_DRINK') {
        return R.err('VALIDATION', 'redemption.type không hợp lệ: ' + redemption.type);
      }
      if (!ids.isId(spec.customerId, 'customer')) {
        return R.err('VALIDATION',
          'đổi tem lấy ly miễn phí cần customerId — không có khách thì không có sổ tem để trừ');
      }
    }

    var normalized = [];
    var subtotal = 0;
    var freeLineCount = 0;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (!ids.isId(l.menuItemId, 'item')) return R.err('VALIDATION', 'dòng ' + i + ' thiếu menuItemId hợp lệ');
      if (typeof l.price !== 'number') return R.err('VALIDATION', 'dòng ' + i + ' thiếu giá đã snapshot');
      if (typeof l.qty !== 'number' || !(l.qty > 0)) return R.err('VALIDATION', 'dòng ' + i + ' qty phải dương');
      var ice = l.ice || spec.iceDefault || ICE_TYPE.CHUNG;
      if (!ICE_TYPE[ice]) return R.err('VALIDATION', 'dòng ' + i + ' ice không hợp lệ: ' + ice);

      /*
       * Dòng miễn phí (đổi tem, hoặc BUY_X_GET_Y của khuyến mãi — xem
       * `catalog/promotion.js`) vẫn tiêu tốn kho thật (accrual.js §3: "ly
       * free đổi tem vẫn đi qua FIFO/COGS như món thường"), nên qty/price vẫn
       * ghi bình thường cho requirements/COGS — chỉ amount (doanh thu) về 0.
       */
      var isFree = !!l.isFree;
      if (isFree) freeLineCount++;
      var amount = isFree ? 0 : l.price * l.qty;
      subtotal += amount;
      normalized.push({
        billLineId: ids.deterministicId('billLine', [spec.billId || 'draft', String(i)]),
        menuItemId: l.menuItemId,
        name: l.name || null,
        size: l.size,
        qty: l.qty,
        /* Snapshot, không phải tham chiếu sống. */
        price: l.price,
        amount: amount,
        isFree: isFree,
        recipeId: l.recipeId || null,
        toppings: (l.toppings || []).slice(),
        /* Chỉ để in tem/nhãn (như legacy) — không ảnh hưởng COGS, xem N2. */
        ice: ice
      });
    }

    if (redemption && freeLineCount !== 1) {
      return R.err('VALIDATION',
        'đổi tem lấy ly miễn phí cần ĐÚNG 1 dòng isFree — có ' + freeLineCount);
    }

    var discountTotal = spec.discountTotal || 0;
    var total = Math.max(0, subtotal - discountTotal);

    /* Phí sàn được TRỪ THẬT — đây là đường ống legacy chưa từng nối. */
    var channelFee = spec.channel.type === CHANNEL.APP
      ? total * (spec.channel.feePct / 100)
      : 0;

    return R.ok({
      billId: spec.billId || ids.newId('bill'),
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      occurredAt: spec.occurredAt,
      soldByActorId: spec.soldByActorId,
      customerId: spec.customerId || null,
      channel: {
        type: spec.channel.type,
        appName: spec.channel.appName || null,
        feePct: spec.channel.type === CHANNEL.APP ? spec.channel.feePct : 0
      },
      lines: normalized,
      subtotal: subtotal,
      discountTotal: discountTotal,
      promotionsApplied: (spec.promotionsApplied || []).slice(),
      redemption: redemption,
      total: total,
      channelFee: channelFee,
      /* Doanh thu thuần sau phí sàn — con số P&L thật sự cần. */
      netRevenue: total - channelFee,
      payments: (spec.payments || []).slice(),
      status: 'DRAFT'
    });
  }

  /**
   * Yêu cầu vật chất của cả bill: định mức + bao bì + túi.
   *
   * Mọi version dùng ở đây được GHI LẠI trên bill (V4), nên đọc lại lịch sử
   * không phải resolve lại — và không thể trôi theo cấu hình hiện tại.
   */
  function buildRequirements(bill, deps) {
    var registry = deps.versionRegistry;
    var reqs = [];
    var recipeVersionIds = [];
    var packagingVersionIds = [];
    var gapLines = [];
    var cups = bill.lines.reduce(function (s, l) { return s + l.qty; }, 0);

    for (var i = 0; i < bill.lines.length; i++) {
      var line = bill.lines[i];
      if (!line.recipeId) {
        /*
         * §2.3a (quyết định chủ quán 2026-09-17, NET-SALES-V1.md N10): thiếu
         * định mức KHÔNG được chặn bán — legacy chỉ soft-warn qua Hộp thư,
         * core không được chặt hơn hệ cũ. Ghi nhận gap, KHÔNG suy đoán
         * requirements cho món này (không có công thức thì không biết trừ
         * nguyên liệu gì) — cogsTheoretical/cogsActual của cả bill sẽ về
         * null kèm reason NO_RECIPE (xem `commands/sales.js RecordSale` +
         * `recipe-cost-btp/cogs.js`), KHÔNG âm thầm tính thiếu rồi báo như
         * đã đủ. Bao bì (dưới) vẫn tính bình thường — không phụ thuộc recipe.
         */
        gapLines.push({ menuItemId: line.menuItemId, name: line.name || null, billLineId: line.billLineId });
      } else {
        var rv = recipeLib.resolveRecipeAt(registry, {
          recipeId: line.recipeId, storeId: bill.storeId, at: bill.occurredAt
        });
        if (R.isErr(rv)) return rv;

        var rr = recipeLib.toRequirements(rv.value, { size: line.size, qty: line.qty });
        if (R.isErr(rr)) return rr;
        recipeVersionIds.push(rr.value.recipeVersionId);
        reqs = reqs.concat(rr.value.requirements);
      }

      var pv = packagingLib.resolvePackagingAt(registry, {
        menuItemId: line.menuItemId, storeId: bill.storeId, at: bill.occurredAt
      });
      if (R.isOk(pv)) {
        var pr = packagingLib.toRequirements(pv.value, line.qty);
        if (R.isErr(pr)) return pr;
        packagingVersionIds.push(pr.value.packagingVersionId);
        reqs = reqs.concat(pr.value.requirements);

        if (i === 0) {
          var bag = packagingLib.baggingRequirements(pv.value, cups);
          if (R.isOk(bag)) reqs = reqs.concat(bag.value.requirements);
        }
      }
    }

    /*
     * Đá — theo SỐ LY của cả bill, ĐỒNG NHẤT bất kể đá chung/đá riêng/không
     * đá (N2, chốt chủ quán 2026-09 — xem `catalog/ice.js`). Độc lập với
     * recipe/packaging: quán chưa cấu hình thì `toRequirement` trả null,
     * không thêm gì, không lỗi — đúng nguyên tắc "mọi thứ có default".
     */
    var iceResolved = iceLib.resolveIceCogsAt(registry, { storeId: bill.storeId, at: bill.occurredAt }).value;
    var iceReq = iceLib.toRequirement(iceResolved, cups);
    if (iceReq) reqs.push(iceReq);

    /* Gộp cùng itemId để FIFO cấp phát 1 lần cho mỗi nguyên liệu. */
    var merged = Object.create(null);
    reqs.forEach(function (r) {
      merged[r.itemId] = (merged[r.itemId] || 0) + r.qty;
    });

    return R.ok({
      requirements: Object.keys(merged).map(function (itemId) {
        return { itemId: itemId, qty: merged[itemId] };
      }),
      detailedRequirements: reqs,
      recipeVersionIds: recipeVersionIds.filter(function (v, i, a) { return a.indexOf(v) === i; }),
      packagingVersionIds: packagingVersionIds.filter(function (v, i, a) { return a.indexOf(v) === i; }),
      gapLines: gapLines
    });
  }

  /** RecordSale — ghi bán hàng, trừ kho qua FIFO, tính CẢ HAI vế COGS. */
  var RecordSale = pipeline.defineCommand({
    name: 'RecordSale',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    /* Id xác định theo billId: bấm thanh toán 2 lần không trừ kho 2 lần. */
    operationId: function (input) {
      return ids.deterministicId('operation', ['sale', input.bill.billId]);
    },

    validate: function (input) {
      if (!input || !input.bill) return R.err('VALIDATION', 'RecordSale cần bill');
      if (!ids.isId(input.bill.soldByActorId, 'actor')) {
        return R.err('VALIDATION', 'bill thiếu soldByActorId');
      }
      if (!input.deps || !input.deps.versionRegistry) {
        return R.err('VALIDATION', 'RecordSale cần versionRegistry');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var bill = input.bill;
      var deps = input.deps;
      var plan = pipeline.emptyPlan();

      /* Actor trên bill phải là người đang thao tác — không nhận hộ người khác. */
      if (bill.soldByActorId !== ctx.actor.actorId) {
        return R.err('FORBIDDEN', 'soldByActorId khác actor đang thao tác');
      }

      var reqR = buildRequirements(bill, deps);
      if (R.isErr(reqR)) return reqR;
      var req = reqR.value;

      /* FIFO cấp phát — 1 WorkingSet cho cả bill, nên các món dùng chung
         nguyên liệu không đọc số dư cũ của nhau. */
      var ws = allocation.createWorkingSet(deps.units || []);
      var allocR = allocation.allocateMany(ws, req.requirements, {
        operationId: ids.deterministicId('operation', ['sale', bill.billId])
      });
      if (R.isErr(allocR)) return allocR;
      var alloc = allocR.value;

      /*
       * Hết nguyên liệu thật: KHÔNG chặn bán (chốt chủ quán 2026-09) — SOP cho
       * phép thay thế một số nguyên liệu khi nguyên liệu kia hết, nên vẫn phải
       * bán tiếp được. Phần thiếu thành NỢ tường minh trên Unit (§3.3
       * `allocation.handleShortfall`), gắn `needsReview`, KHÔNG âm thầm — khác
       * legacy để kho tụt âm mà không ai biết.
       */
      var shortfallEvents = [];
      for (var sfi = 0; sfi < alloc.shortfalls.length; sfi++) {
        var shortfall = alloc.shortfalls[sfi];
        var sfR = allocation.handleShortfall(ws, shortfall, {
          at: bill.occurredAt,
          operationId: ids.deterministicId('operation', ['sale', bill.billId])
        });
        if (R.isErr(sfR)) return sfR;
        if (sfR.value.debtUnit) {
          shortfallEvents.push({
            type: 'IngredientShortfallRecorded',
            unitId: sfR.value.debtUnit.unitId,
            itemId: shortfall.itemId,
            shortfallQty: shortfall.shortfallQty,
            billId: bill.billId,
            storeId: bill.storeId,
            businessDate: bill.businessDate
          });
        }
      }

      /* HAI vế COGS — thứ legacy chưa từng có. */
      var cogsR = cogsLib.computeCogs({
        registry: deps.versionRegistry,
        storeId: bill.storeId,
        at: bill.occurredAt,
        requirements: req.requirements,
        allocationPlans: alloc.plans,
        gapLineCount: req.gapLines.length
      });
      if (R.isErr(cogsR)) return cogsR;

      var finalized = Object.assign({}, bill, {
        status: 'COMPLETED',
        recipeVersionIds: req.recipeVersionIds,
        packagingVersionIds: req.packagingVersionIds,
        cogs: cogsR.value
      });

      plan.domainRecords.push({ type: 'bill', record: finalized });

      /*
       * Đổi tem lấy ly miễn phí (N12, mục 7) — gọi TRỰC TIẾP ở đây, cùng
       * thành/bại với chính bill, vì đây là ĐIỀU KIỆN của giá (dòng miễn phí
       * đã tính amount=0 ở buildBill), không phải phần thưởng phát sinh sau.
       * Không đủ tem thì bill KHÔNG được chốt — trả lỗi ngay, không âm thầm
       * chốt bill với dòng miễn phí mà không trừ sổ.
       */
      if (bill.redemption && bill.redemption.type === 'STAMP_FREE_DRINK') {
        var redeemR = accrualLib.redeemStamps({
          entries: deps.loyaltyEntries || [],
          customerId: bill.customerId,
          storeId: bill.storeId,
          billId: bill.billId,
          operationId: ids.deterministicId('operation', ['sale', bill.billId]),
          businessDate: bill.businessDate,
          occurredAt: bill.occurredAt,
          actorId: bill.soldByActorId
        });
        if (R.isErr(redeemR)) return redeemR;
        redeemR.value.entries.forEach(function (e) {
          plan.domainRecords.push({ type: 'loyaltyLedgerEntry', record: e });
        });
      }
      // ĐIỂM NỐI voucher (nếu sau này xây lại): thêm `else if (bill.redemption.type
      // === 'VOUCHER_CODE') { ... }` cùng khối trên — cùng thành/bại với bill,
      // push domainRecords tương ứng module "tiêu thụ" voucher đó.

      plan.unitChanges = ws.all().filter(function (u) {
        var before = (deps.units || []).filter(function (o) { return o.unitId === u.unitId; })[0];
        return before && before.remainingQty !== u.remainingQty;
      });

      alloc.plans.forEach(function (p) {
        p.allocations.forEach(function (a) {
          plan.ledgerEntries.push({
            domain: 'raw',
            type: 'CONSUMPTION',
            itemId: a.itemId,
            storeId: bill.storeId,
            unitId: a.unitId,
            qtyDelta: -a.qty,
            unitCost: a.unitCost,
            costBasisVersionId: a.costBasisVersionId,
            businessDate: bill.businessDate,
            actorId: bill.soldByActorId,
            occurredAt: bill.occurredAt,
            referenceType: 'bill',
            referenceId: bill.billId
          });
          /* Lineage đầy đủ: Bill → BillLine → RecipeVersion → Requirement →
             UnitAllocation → UnitBase trước/sau. */
          plan.traceChanges.push({
            billId: bill.billId,
            unitId: a.unitId,
            itemId: a.itemId,
            qty: a.qty,
            unitBaseBefore: a.unitBaseBefore,
            unitBaseAfter: a.unitBaseAfter,
            recipeVersionIds: req.recipeVersionIds,
            costBasisVersionId: a.costBasisVersionId
          });
        });
      });

      plan.projectionRecomputes = req.requirements.map(function (r) {
        return { itemId: r.itemId, storeId: bill.storeId };
      });

      /*
       * Loyalty là handler đăng ký riêng, không nhét vào lệnh bán — nhưng
       * event vẫn mang sẵn `bill`/`customer` denormalized để
       * `bootstrap/domain-events.js` (L9) gọi tiếp AccrueLoyaltyForSale mà
       * không phải tự tra dữ liệu (đúng nguyên tắc "denormalized command
       * input"). `deps.loyaltyCustomer` là optional: caller đã tra khách ở
       * bước L1 thì mang theo, không có thì loyalty/accrual.js tự skip
       * tường minh (customer null), không đoán.
       */
      if (bill.customerId) {
        plan.events.push({
          type: 'SaleCompleted',
          billId: bill.billId,
          customerId: bill.customerId,
          bill: finalized,
          customer: deps.loyaltyCustomer || null,
          stampsEarnedToday: deps.loyaltyStampsEarnedToday || 0,
          netRevenue: finalized.netRevenue,
          storeId: bill.storeId,
          businessDate: bill.businessDate
        });
      }

      /*
       * Alert (L9) cho từng món thiếu định mức — AUTO_VERIFIABLE
       * (`alerts/alert.js TYPES.MISSING_RECIPE`), tự hết khi khai định mức
       * xong, không cần ai đóng tay. Gộp theo menuItemId: 1 bill có thể có
       * 2 dòng cùng món thiếu định mức, chỉ cần 1 alert cho món đó.
       */
      var seenGapItems = Object.create(null);
      req.gapLines.forEach(function (g) {
        if (seenGapItems[g.menuItemId]) return;
        seenGapItems[g.menuItemId] = true;
        plan.events.push({
          type: 'MissingRecipeDetected',
          menuItemId: g.menuItemId,
          name: g.name,
          billId: bill.billId,
          storeId: bill.storeId,
          businessDate: bill.businessDate
        });
      });

      shortfallEvents.forEach(function (evt) { plan.events.push(evt); });

      return R.ok(plan);
    }
  });

  /**
   * RecordAddon — thêm món/topping sau khi bill đã lưu.
   *
   * Legacy cho thêm trong 10 phút (add-only, không sửa/xoá) và trừ kho theo
   * diff đúng — nhưng KHÔNG gọi loyalty, nên khách trả thêm tiền mà không được
   * cộng thêm điểm (§1 chain-trace, §4.16). Ở đây event được phát cho ĐÚNG
   * phần chênh lệch.
   */
  var RecordAddon = pipeline.defineCommand({
    name: 'RecordAddon',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['addon', input.billId, input.addonSeq]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.billId, 'bill')) return R.err('VALIDATION', 'RecordAddon cần billId');
      if (input.addonSeq === undefined || input.addonSeq === null) {
        return R.err('VALIDATION', 'RecordAddon cần addonSeq để id xác định — thiếu nó là bug #23');
      }
      if (typeof input.addedAmount !== 'number' || input.addedAmount <= 0) {
        return R.err('VALIDATION', 'addon phải có số tiền tăng thêm dương');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({
        type: 'billAddon',
        record: {
          billId: input.billId,
          addonSeq: input.addonSeq,
          addedAmount: input.addedAmount,
          addedByActorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now()
        }
      });

      if (input.customerId) {
        /*
         * Đúng phần CHÊNH LỆCH, không phải tổng bill. `customer` denormalized
         * theo cùng lý do với RecordSale — xem ghi chú ở đó (L9).
         */
        plan.events.push({
          type: 'SaleAmountIncreased',
          billId: input.billId,
          addonSeq: input.addonSeq,
          customerId: input.customerId,
          addedAmount: input.addedAmount,
          customer: input.loyaltyCustomer || null,
          storeId: ctx.storeId,
          businessDate: ctx.businessDate,
          occurredAt: ctx.clock.now(),
          actorId: ctx.actor.actorId
        });
      }

      return R.ok(plan);
    }
  });

  /**
   * `deps.versionRegistry` là một `compaction/versioned-input` registry —
   * export lối dựng nó để caller ngoài `commands` (bootstrap — xem
   * `bootstrap/canonical-data-source.js`) không phải tự import `compaction`
   * (layer-rules.json không cho `bootstrap` import `compaction` trực tiếp;
   * `commands` thì được, nên khai hộ ở đây thay vì nới luật import-direction).
   */
  function createVersionRegistry(opts) { return VI.createRegistry(opts); }

  return {
    CHANNEL: CHANNEL,
    buildBill: buildBill,
    buildRequirements: buildRequirements,
    createVersionRegistry: createVersionRegistry,
    RecordSale: RecordSale,
    RecordAddon: RecordAddon
  };
});

/* ===== src/layers/commands/shift.js ===== */
/**
 * Ca / Két tiền — đối soát tiền mặt và giao ca.
 *
 * Nguồn: LEGACY-SNAPSHOT-COMPACTION-AUDIT-V1.md §2.2, FEATURE-TREE-V1.md §2 mục [5].
 *
 * Đây thuộc nhóm "OPERATIONAL RECORD" của FIFO-COMPACTION-CONTRACT-V1.md §0:
 * nó LÀ sự kiện đã xảy ra, được ĐỌC THẲNG chứ không tính lại — khác hẳn cache
 * (tính lại được) và snapshot P&L (đóng băng có chủ đích). Ba khái niệm này
 * legacy đã tách rất có chủ đích và thiết kế mới không gộp lại.
 *
 * QUYẾT ĐỊNH CỦA LEGACY CẦN GIỮ NGUYÊN — sai số KHÔNG cộng dồn giữa các đoạn ca.
 * Khi giao ca giữa ngày, đoạn sau bắt đầu từ số tiền ĐẾM ĐƯỢC THẬT của đoạn
 * trước, không phải từ số tiền LẼ RA PHẢI CÓ. Nhờ vậy sai số của đoạn trước
 * không trôi sang làm bẩn sai số đoạn sau, và mỗi đoạn quy trách nhiệm được cho
 * đúng người trực đoạn đó. Legacy giải thích điều này ngay trong comment; đây
 * là thiết kế đúng, không phải chỗ cần "sửa cho gọn".
 */
GIEO.define('commands/shift', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'store-context/business-day',
  'commands/pipeline',
  'hr/shift'
], function (ids, R, businessDay, pipeline, employeeShift) {
  'use strict';

  var STATUS = { OPEN: 'OPEN', CLOSED: 'CLOSED' };

  function segmentId(storeId, businessDate, seq) {
    return ids.deterministicId('shift', ['seg', storeId, businessDate, String(seq)]);
  }

  /**
   * Mở một đoạn ca.
   * @param spec.startCash tiền mặt đầu đoạn — với đoạn > 1 đây phải là số ĐẾM
   *        ĐƯỢC của đoạn trước (xem closeSegment.actualEndCash), không phải số
   *        kỳ vọng.
   */
  function openSegment(spec) {
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'đoạn ca cần storeId hợp lệ');
    if (!spec.businessDate) return R.err('VALIDATION', 'đoạn ca cần businessDate');
    if (typeof spec.seq !== 'number' || spec.seq < 1) return R.err('VALIDATION', 'seq phải >= 1');
    if (typeof spec.startCash !== 'number' || spec.startCash < 0) {
      return R.err('VALIDATION', 'startCash phải là số không âm');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'đoạn ca cần actorId');

    return R.ok({
      segmentId: segmentId(spec.storeId, spec.businessDate, spec.seq),
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      seq: spec.seq,
      status: STATUS.OPEN,
      startCash: spec.startCash,
      openedAt: spec.at,
      openedBy: spec.actorId,
      /* Nguồn của startCash — để đọc lại biết đoạn này nối từ đâu. */
      startCashSource: spec.seq === 1 ? 'OPENING_FLOAT' : 'PREVIOUS_SEGMENT_ACTUAL',
      counts: [],
      cashSales: 0,
      cashOut: 0,
      expectedEndCash: null,
      actualEndCash: null,
      variance: null,
      closedAt: null,
      closedBy: null
    });
  }

  /** Ghi nhận tiền mặt phát sinh trong đoạn. */
  function recordCashMovement(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (typeof spec.amount !== 'number' || spec.amount <= 0) {
      return R.err('VALIDATION', 'số tiền phải dương — chiều đi vào/ra do "direction" quyết định');
    }
    if (spec.direction !== 'IN' && spec.direction !== 'OUT') {
      return R.err('VALIDATION', "direction phải là 'IN' hoặc 'OUT'");
    }
    var patch = spec.direction === 'IN'
      ? { cashSales: segment.cashSales + spec.amount }
      : { cashOut: segment.cashOut + spec.amount };
    return R.ok(Object.assign({}, segment, patch));
  }

  /**
   * Thêm 1 lần đếm. Legacy cho đếm nhiều lần trước khi chốt — giữ nguyên, và
   * giữ ĐỦ các lần đếm thay vì chỉ lần cuối, vì chênh lệch giữa các lần đếm
   * chính là thông tin cần cho người rà soát.
   */
  function addCount(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (typeof spec.countedCash !== 'number' || spec.countedCash < 0) {
      return R.err('VALIDATION', 'countedCash phải là số không âm');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'lần đếm cần actorId');

    return R.ok(Object.assign({}, segment, {
      counts: segment.counts.concat([{
        seq: segment.counts.length + 1,
        countedCash: spec.countedCash,
        at: spec.at,
        actorId: spec.actorId,
        note: spec.note || null
      }])
    }));
  }

  /**
   * Chốt đoạn ca.
   *
   *   expectedEndCash = startCash + cashSales - cashOut
   *   variance        = actualEndCash - expectedEndCash
   *
   * `actualEndCash` lấy từ lần đếm CUỐI CÙNG — không trung bình các lần đếm,
   * vì đếm lại là để sửa lần trước, không phải để lấy mẫu.
   */
  function closeSegment(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (segment.counts.length === 0) {
      return R.err('PRECONDITION', 'phải đếm tiền ít nhất 1 lần trước khi chốt đoạn ca');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'chốt đoạn ca cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'chốt đoạn ca cần operationId');

    var actual = segment.counts[segment.counts.length - 1].countedCash;
    var expected = segment.startCash + segment.cashSales - segment.cashOut;

    return R.ok(Object.assign({}, segment, {
      status: STATUS.CLOSED,
      expectedEndCash: expected,
      actualEndCash: actual,
      variance: actual - expected,
      closedAt: spec.at,
      closedBy: spec.actorId,
      operationId: spec.operationId
    }));
  }

  /**
   * Đoạn kế tiếp — ĐÂY LÀ CHỖ QUYẾT ĐỊNH THIẾT KẾ QUAN TRỌNG.
   *
   * Bắt đầu từ `actualEndCash` (đếm được thật), KHÔNG phải `expectedEndCash`.
   * Nếu bắt đầu từ số kỳ vọng thì sai số của đoạn trước sẽ xuất hiện lại trong
   * sai số đoạn sau, và người trực đoạn sau bị quy trách nhiệm cho tiền hụt mà
   * họ không gây ra.
   */
  function nextSegment(closedSegment, spec) {
    if (closedSegment.status !== STATUS.CLOSED) {
      return R.err('PRECONDITION', 'phải chốt đoạn hiện tại trước khi mở đoạn kế');
    }
    return openSegment({
      storeId: closedSegment.storeId,
      businessDate: closedSegment.businessDate,
      seq: closedSegment.seq + 1,
      startCash: closedSegment.actualEndCash,
      actorId: spec.actorId,
      at: spec.at
    });
  }

  /**
   * Tổng hợp cả ngày. Sai số ngày = TỔNG sai số từng đoạn, và luôn nói được
   * đoạn nào của ai lệch bao nhiêu.
   */
  function summarizeDay(segments) {
    var closed = segments.filter(function (s) { return s.status === STATUS.CLOSED; });
    return R.ok({
      segmentCount: segments.length,
      closedCount: closed.length,
      allClosed: closed.length === segments.length && segments.length > 0,
      totalCashSales: segments.reduce(function (s, x) { return s + x.cashSales; }, 0),
      totalCashOut: segments.reduce(function (s, x) { return s + x.cashOut; }, 0),
      totalVariance: closed.reduce(function (s, x) { return s + x.variance; }, 0),
      /* Quy trách nhiệm theo đoạn — thứ mà cộng dồn sai số sẽ làm mất. */
      varianceBySegment: closed.map(function (s) {
        return { seq: s.seq, closedBy: s.closedBy, variance: s.variance };
      })
    });
  }

  /**
   * Lý do CHẶN chốt ngày. FEATURE-TREE §2 mục [5] gọi đây là `blockingClose`.
   * Trả danh sách để `store-context/business-day.closeDay` từ chối kèm lý do
   * cụ thể, thay vì chỉ báo "không chốt được".
   */
  function closeDayBlockers(spec) {
    var blockers = [];
    var segments = spec.segments || [];

    if (segments.length === 0) blockers.push('chưa có đoạn ca nào trong ngày');
    segments.forEach(function (s) {
      if (s.status === STATUS.OPEN) blockers.push('đoạn ca #' + s.seq + ' chưa chốt');
    });
    (spec.openEmployeeShifts || []).forEach(function (sh) {
      blockers.push('ca của nhân viên ' + sh.employeeId + ' chưa check-out');
    });
    (spec.pendingChecklists || []).forEach(function (c) {
      if (c.blocking) blockers.push('checklist "' + c.name + '" chưa hoàn tất');
    });
    return blockers;
  }

  var CloseCashSegment = pipeline.defineCommand({
    name: 'CloseCashSegment',
    /* Nhân viên kết ca, nhưng Quản lý cũng chốt hộ được khi cần. */
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],
    operationId: function (input) {
      return ids.deterministicId('operation', [
        'closeseg', input.segment.storeId, input.segment.businessDate, String(input.segment.seq)
      ]);
    },
    validate: function (input) {
      if (!input || !input.segment) return R.err('VALIDATION', 'cần segment');
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var r = closeSegment(input.segment, {
        actorId: ctx.actor.actorId,
        at: ctx.clock.now(),
        operationId: ids.deterministicId('operation', [
          'closeseg', input.segment.storeId, input.segment.businessDate, String(input.segment.seq)
        ])
      });
      if (R.isErr(r)) return r;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'cashSegment', record: r.value });
      if (r.value.variance !== 0) {
        /* Lệch két là việc cần người biết, không phải con số nằm im trong sổ. */
        plan.events.push({
          type: 'CashVarianceDetected',
          segmentId: r.value.segmentId,
          storeId: r.value.storeId,
          businessDate: r.value.businessDate,
          seq: r.value.seq,
          variance: r.value.variance,
          closedBy: r.value.closedBy
        });
      }
      return R.ok(plan);
    }
  });

  var OpenCashSegment = pipeline.defineCommand({
    name: 'OpenCashSegment',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS', 'QUANLY'],
    operationId: function (input) {
      return ids.deterministicId('operation', [
        'openseg', input.storeId, input.businessDate, String(input.seq)
      ]);
    },
    validate: function (input) {
      if (!input) return R.err('VALIDATION', 'OpenCashSegment cần input');
      if (!ids.isId(input.storeId, 'store')) return R.err('VALIDATION', 'cần storeId hợp lệ');
      if (!input.businessDate) return R.err('VALIDATION', 'cần businessDate');
      if (typeof input.seq !== 'number' || input.seq < 1) return R.err('VALIDATION', 'seq phải >= 1');
      if (typeof input.startCash !== 'number' || input.startCash < 0) {
        return R.err('VALIDATION', 'startCash phải là số không âm');
      }
      if (input.openSegment) return R.err('CONFLICT', 'đã có cash segment đang mở');
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var opened = openSegment({
        storeId: input.storeId,
        businessDate: input.businessDate,
        seq: input.seq,
        startCash: input.startCash,
        actorId: ctx.actor.actorId,
        at: ctx.clock.now()
      });
      if (R.isErr(opened)) return opened;
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'cashSegment', record: opened.value });
      return R.ok(plan);
    }
  });

  var CheckIn = pipeline.defineCommand({
    name: 'CheckIn',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS', 'QUANLY'],
    /* Check-in là sự kiện mở ngày gần sự thật nhất; không thể đòi ngày đã mở. */
    requiresOpenDay: false,
    operationId: function (input, ctx) {
      return ids.deterministicId('operation', [
        'checkin', input.employee.employeeId, input.businessDate
      ]);
    },
    validate: function (input) {
      if (!input || !input.employee || !ids.isId(input.employee.employeeId, 'employee')) {
        return R.err('VALIDATION', 'CheckIn cần employee hợp lệ');
      }
      if (!input.versionRegistry) return R.err('VALIDATION', 'CheckIn cần versionRegistry');
      if (!input.businessDate) return R.err('VALIDATION', 'CheckIn cần businessDate từ lịch/flow mở ca');
      if (input.openShift) return R.err('CONFLICT', 'nhân viên đã check-in');
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var operationId = ids.deterministicId('operation', [
        'checkin', input.employee.employeeId, input.businessDate
      ]);
      var day = input.businessDay || ctx.businessDay || null;
      var openedDay = null;
      if (!day) {
        var opened = businessDay.openDay({
          storeId: ctx.storeId,
          dateKey: input.businessDate,
          actorId: ctx.actor.actorId,
          at: ctx.clock.now(),
          clock: ctx.clock
        });
        if (R.isErr(opened)) return opened;
        day = opened.value;
        openedDay = opened.value;
      } else {
        if (day.dateKey !== input.businessDate) {
          return R.err('CONFLICT', 'ngày đang mở khác ngày của flow check-in');
        }
        var operable = businessDay.assertOperable(day, 'CheckIn');
        if (R.isErr(operable)) return operable;
      }
      var checkedIn = employeeShift.checkIn({
        employee: input.employee,
        versionRegistry: input.versionRegistry,
        at: ctx.clock.now(),
        businessDate: day.dateKey,
        operationId: operationId
      });
      if (R.isErr(checkedIn)) return checkedIn;
      var plan = pipeline.emptyPlan();
      if (openedDay) {
        plan.domainRecords.push({ type: 'businessDay', record: openedDay });
        plan.events.push({
          type: 'BusinessDayOpened', businessDayId: openedDay.businessDayId,
          storeId: openedDay.storeId, businessDate: openedDay.dateKey,
          openedBy: openedDay.openedBy
        });
      }
      plan.domainRecords.push({ type: 'employeeShift', record: checkedIn.value });
      plan.events.push({
        type: 'EmployeeCheckedInStateChanged',
        employeeId: checkedIn.value.employeeId,
        actorId: checkedIn.value.actorId,
        storeId: checkedIn.value.storeId,
        businessDate: checkedIn.value.businessDate,
        checkedIn: true
      });
      return R.ok(plan);
    }
  });

  var CheckOut = pipeline.defineCommand({
    name: 'CheckOut',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS', 'QUANLY'],
    operationId: function (input) {
      return ids.deterministicId('operation', ['checkout', input.shift.shiftId]);
    },
    validate: function (input) {
      if (!input || !input.shift || !ids.isId(input.shift.shiftId, 'shift')) {
        return R.err('VALIDATION', 'CheckOut cần shift hợp lệ');
      }
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var checkedOut = employeeShift.checkOut(input.shift, ctx.clock.now());
      if (R.isErr(checkedOut)) return checkedOut;
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'employeeShift', record: checkedOut.value });
      plan.events.push({
        type: 'EmployeeCheckedInStateChanged',
        employeeId: checkedOut.value.employeeId,
        actorId: checkedOut.value.actorId,
        storeId: checkedOut.value.storeId,
        businessDate: checkedOut.value.businessDate,
        checkedIn: false
      });
      return R.ok(plan);
    }
  });

  return {
    STATUS: STATUS,
    segmentId: segmentId,
    openSegment: openSegment,
    recordCashMovement: recordCashMovement,
    addCount: addCount,
    closeSegment: closeSegment,
    nextSegment: nextSegment,
    summarizeDay: summarizeDay,
    closeDayBlockers: closeDayBlockers,
    OpenCashSegment: OpenCashSegment,
    CheckIn: CheckIn,
    CheckOut: CheckOut,
    CloseCashSegment: CloseCashSegment
  };
});

/* ===== src/layers/commands/stock-count.js ===== */
/**
 * Lệnh kiểm kho — tạo phiếu (đầu vào của chuỗi SC1 → SC6).
 *
 * Chuỗi thật: `NET-STOCK-COUNT-V1.md` SC1 (phân loại `countMode`, 🔴 GAP TOÀN
 * PHẦN) + SC2 (`SubmitStockCount`, 🔴 GAP TOÀN PHẦN). Phần DUYỆT (SC3) đã có
 * sẵn ở `commands/approval.js#ApproveStockCount` — module này chỉ đóng phần
 * TẠO PHIẾU còn thiếu ở đầu chuỗi, cùng hình dạng gap với RM1 (Receiving).
 *
 * SC1's AMBIGUOUS đã ghi nhận: legacy quyết định `countMode:'unit'` (bắt
 * buộc quét mã) hay `'qty'` (nhập tay số tuyệt đối) bằng cách suy luận ngầm
 * từ việc `packagingUnits` có khớp được hay không — cùng lỗi gốc với RM1's
 * `createContainersForReceipt`. Fix giống hệt RM1: TÁI SỬ DỤNG
 * `commands/receiving.js#classifyTrackingMode()` — `trackingMode === 'unit'`
 * (tường minh trên item, không suy từ field khác) thì bắt buộc quét mã theo
 * từng Unit; mọi trường hợp khác ('batch'/'none') là đếm tổng bằng tay. Một
 * khái niệm, một hàm phân loại — không có 2 cách suy luận lệch nhau cho cùng
 * một câu hỏi như legacy.
 *
 * `stockCountId` xác định theo `countRef` caller cung cấp (mẫu
 * wasteRef/adjustRef/correctRef đã dùng xuyên suốt `commands/inventory.js`,
 * `commands/receiving.js`) — đóng đúng Bug #13 (double-tap sinh 2 phiếu vì
 * legacy dùng `.add()` id ngẫu nhiên).
 *
 * Chỉ TẠO phiếu PENDING — hoàn toàn không mutate Unit/ledger. Việc đó
 * (physicalReconciliation) là của `ApproveStockCount`, đã đóng đúng 4/5 mục
 * "FIX BẮT BUỘC" của chain-trace (xem SC3).
 */
GIEO.define('commands/stock-count', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'commands/receiving'
], function (ids, R, pipeline, receiving) {
  'use strict';

  var COUNT_STATUS = { PENDING: 'PENDING' };

  /**
   * SC1 — countMode tường minh, tái dùng đúng phân loại của RM1.
   * `trackingMode:'unit'` → bắt buộc quét mã từng Unit; ngược lại → đếm tổng.
   */
  function classifyCountMode(item) {
    return receiving.classifyTrackingMode(item) === 'unit' ? 'unit' : 'qty';
  }

  /**
   * SubmitStockCount — SC2, tạo phiếu kiểm kê ở trạng thái PENDING.
   *
   * Input đi theo mẫu "denormalized": `input.lines[].item` là bản ghi mặt
   * hàng đã tra sẵn (dùng để phân loại countMode, không tự tra catalog).
   *
   *   - countMode 'unit': dòng phải có `unitId` (đã quét) + `countedQty`
   *     (số đếm được TRÊN CHÍNH lô đó — absolute, giống `physicalReconciliation`).
   *   - countMode 'qty': dòng KHÔNG được gắn unitId (đếm tổng, không truy lô
   *     cụ thể) + `countedQty`/`expectedQty` để tính `delta` — đúng shape mà
   *     `ApproveStockCount` cần cho nhánh không có `unitId`.
   */
  var SubmitStockCount = pipeline.defineCommand({
    name: 'SubmitStockCount',
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['submitcount', input.countRef]);
    },

    validate: function (input) {
      if (!input || !input.countRef) {
        return R.err('VALIDATION', 'SubmitStockCount cần countRef để id xác định — thiếu nó là tái lập ' +
          'đúng Bug #13 (double-tap gửi 2 lần tạo 2 phiếu)');
      }
      if (!Array.isArray(input.lines) || input.lines.length === 0) {
        return R.err('VALIDATION', 'SubmitStockCount cần ít nhất 1 dòng đếm');
      }
      for (var i = 0; i < input.lines.length; i++) {
        var line = input.lines[i];
        if (!line || !ids.isId(line.itemId, 'item')) {
          return R.err('VALIDATION', 'dòng ' + i + ' cần itemId hợp lệ');
        }
        if (!line.item) {
          return R.err('VALIDATION', 'dòng ' + i + ' thiếu input.lines[].item (denormalized, không tự tra catalog)');
        }
        var mode = classifyCountMode(line.item);
        if (mode === 'unit') {
          if (!ids.isId(line.unitId, 'unit')) {
            return R.err('VALIDATION',
              'dòng ' + i + ' (countMode unit) cần unitId hợp lệ — mặt hàng này bắt buộc quét mã, ' +
              'không được nhập tay tổng số (đóng đúng AMBIGUOUS đã nêu ở SC1)');
          }
          if (typeof line.countedQty !== 'number' || line.countedQty < 0) {
            return R.err('VALIDATION', 'dòng ' + i + ' cần countedQty là số không âm');
          }
        } else {
          if (line.unitId) {
            return R.err('VALIDATION',
              'dòng ' + i + ' (countMode qty) không được gắn unitId — mặt hàng này đếm tổng, không quét từng lô');
          }
          if (typeof line.countedQty !== 'number' || typeof line.expectedQty !== 'number') {
            return R.err('VALIDATION', 'dòng ' + i + ' (countMode qty) cần countedQty và expectedQty để tính delta');
          }
        }
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var stockCountId = ids.deterministicId('stockCount', ['submit', input.countRef]);
      var at = input.at || ctx.clock.now();

      var lines = input.lines.map(function (line) {
        var mode = classifyCountMode(line.item);
        if (mode === 'unit') {
          return {
            itemId: line.itemId, unitId: line.unitId, countMode: 'unit',
            countedQty: line.countedQty, applied: false
          };
        }
        return {
          itemId: line.itemId, unitId: null, countMode: 'qty',
          countedQty: line.countedQty, expectedQty: line.expectedQty,
          /* Delta tính SẴN ở đây — ApproveStockCount chỉ đọc thẳng field này
             cho nhánh không unitId, không tự trừ lại. */
          delta: line.countedQty - line.expectedQty,
          applied: false
        };
      });

      plan.domainRecords.push({
        type: 'stockCount',
        record: {
          stockCountId: stockCountId,
          countRef: input.countRef,
          status: COUNT_STATUS.PENDING,
          lines: lines,
          appliedItemIds: [],
          failedLines: [],
          submittedBy: ctx.actor.actorId,
          submittedAt: at,
          businessDate: ctx.businessDate,
          storeId: ctx.storeId,
          approvedBy: null,
          approvedAt: null,
          approveOperationId: null
        }
      });

      return R.ok(plan);
    }
  });

  return {
    COUNT_STATUS: COUNT_STATUS,
    classifyCountMode: classifyCountMode,
    SubmitStockCount: SubmitStockCount
  };
});

/* ===== src/layers/commands/takeover.js ===== */
/**
 * TIẾP NHẬN HỆ CŨ — hệ mới tự làm, một lần, lúc cutover.
 *
 * Quyết định đã chốt (SEED-CONTRACT-V1.md): lấy `unitBase` hiện tại làm tồn đầu,
 * `costBasis` để trống. FIFO đúng về LƯỢNG ngay; COGS thực tế có dần khi nhập lô
 * mới. Dữ liệu cũ được ĐÁNH DẤU và không truy ngược.
 *
 * Đây là tầng NGHIỆP VỤ của việc tiếp nhận: nhận dữ liệu thô của hệ cũ và dựng
 * ra MỘT `MutationPlan`. Nó KHÔNG biết dữ liệu đó đến từ đâu — `bootstrap` nối
 * read port vào. Nhờ vậy luật tiếp nhận kiểm được mà không cần Firebase.
 *
 * Ghi vẫn đi qua đúng `persistence-firebase/atomic-commit` như mọi mutation
 * khác — tiếp nhận không có đường ghi riêng.
 *
 * Cả plan vào trọn hoặc không vào gì. Nạp nửa chừng là thứ tệ nhất ở đây: tồn
 * đầu có mà công thức chưa có thì FIFO sẽ trừ sai ngay ca đầu tiên.
 */
GIEO.define('commands/takeover', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'fifo-core/unit'
], function (ids, R, unitLib) {
  'use strict';

  var ORIGIN = 'LEGACY_SEED';

  function takeoverOperationId(cutoverDate) {
    /* Xác định theo mốc cutover: chạy lại lần hai ghi vào đúng các path cũ,
       KHÔNG nhân đôi tồn đầu. Id ngẫu nhiên ở đây nghĩa là bật app hai lần thì
       có hai bộ tồn đầu. */
    return ids.deterministicId('operation', ['takeover', cutoverDate]);
  }

  function itemIdOf(legacyId) { return ids.deterministicId('item', ['legacy', legacyId || 'unknown']); }

  /* ---------- Từng phần, tách nhỏ để kiểm được riêng ---------- */

  function buildItems(legacyItems, skipped) {
    return Object.keys(legacyItems || {}).map(function (id) {
      var it = legacyItems[id];
      if (!it || !it.name) { skipped.push({ kind: 'item', ref: id, why: 'không có tên' }); return null; }
      return {
        itemId: itemIdOf(id),
        name: it.name,
        unit: it.unit || null,
        countUnitName: it.countUnitName || null,
        baseQtyPerCountUnit: it.packagingUnits ? it.packagingUnits.baseQty : null,
        minStock: typeof it.minStock === 'number' ? it.minStock : 0,
        trackingMode: it.trackingMode || null,
        stockManaged: it.stockManaged !== false,
        /* `costPerUnit` của hệ cũ KHÔNG thành giá vốn lô — dùng nó như vậy đúng
           là lỗi "quy hết về giá scalar gần nhất" mà audit đã chỉ ra. Giữ làm
           GỢI Ý cho lần nhập tới, và gọi đúng tên của nó. */
        suggestedCostPerUnit: typeof it.costPerUnit === 'number' ? it.costPerUnit : null,
        origin: ORIGIN, legacyRef: id
      };
    }).filter(Boolean);
  }

  /**
   * Tồn đầu. Mỗi lô còn hàng thành một Unit.
   *
   * @param activeUnits nhánh RTDB `active_units` — tầng nóng, thắng cho lô đang mở
   */
  function buildUnits(containers, activeUnits, spec, skipped) {
    var rtByCode = Object.create(null);
    Object.keys(activeUnits || {}).forEach(function (itemId) {
      var byContainer = activeUnits[itemId] || {};
      Object.keys(byContainer).forEach(function (cid) {
        var u = byContainer[cid];
        if (u && u.code) rtByCode[u.code] = u;
      });
    });

    var units = [];
    Object.keys(containers || {}).forEach(function (id) {
      var c = Object.assign({ code: id }, containers[id]);
      if (c.status === 'finished') {
        skipped.push({ kind: 'unit', ref: c.code, why: 'đã dùng hết ở hệ cũ' });
        return;
      }
      var rt = rtByCode[c.code];
      /* Lô niêm phong lấy `baseQty` (chưa mở thì `unitBase` chưa có nghĩa);
         lô đang mở lấy số của RTDB, đúng phân tầng nóng/nguội của hệ cũ. */
      var qty = c.status === 'sealed'
        ? c.baseQty
        : (rt && typeof rt.unitBase === 'number' ? rt.unitBase : c.unitBase);

      /* Hũ đang mở dở giữ nguyên `openedAt` cũ để thứ tự FIFO khớp kệ thật.
         Hũ niêm phong không có mốc mở, và không được bịa ra một mốc. */
      var openedAt = c.status === 'sealed' ? null : ((rt && rt.openedAt) || c.openedAt || null);

      var out = unitLib.seedUnitFromLegacy({
        unitId: ids.deterministicId('unit', ['seed', c.code]),
        itemId: itemIdOf(c.itemId),
        storeId: spec.storeId,
        itemKind: 'raw',
        initialQty: qty,
        openedAt: openedAt,
        operationId: ids.deterministicId('operation', ['takeover', spec.cutoverDate, c.code]),
        seededAt: spec.cutoverDate,
        legacyRef: c.code
      });
      if (R.isErr(out)) {
        skipped.push({ kind: 'unit', ref: c.code, qty: qty, why: out.error.message.split(' — ')[0] });
        return;
      }
      units.push(out.value);
    });
    return units;
  }

  function buildRecipes(legacyRecipes, cutoverDate, skipped) {
    return Object.keys(legacyRecipes || {}).map(function (id) {
      var r = legacyRecipes[id];
      if (!r || !r.sizes) { skipped.push({ kind: 'recipe', ref: id, why: 'không có định lượng theo size' }); return null; }
      var recipeId = ids.deterministicId('recipe', ['legacy', id]);
      return {
        recipeId: recipeId,
        versionId: ids.deterministicId('version', ['takeover', recipeId]),
        /* Version đầu có hiệu lực TỪ mốc cutover. Không giả vờ công thức này đã
           có hiệu lực từ quá khứ — COGS lịch sử của hệ cũ không thuộc hệ mới. */
        effectiveFrom: cutoverDate,
        versionSource: ORIGIN,
        sizes: r.sizes,
        origin: ORIGIN, legacyRef: id
      };
    }).filter(Boolean);
  }

  function buildEmployees(legacyEmployees, cutoverDate, storeId, skipped) {
    return Object.keys(legacyEmployees || {}).map(function (id) {
      var e = legacyEmployees[id];
      if (!e || !e.fullName) { skipped.push({ kind: 'employee', ref: id, why: 'không có tên' }); return null; }
      return {
        employeeId: ids.deterministicId('employee', ['legacy', id]),
        actorId: ids.deterministicId('actor', ['legacy', id]),
        storeId: storeId,
        fullName: e.fullName,
        active: e.active !== false,
        /* Legacy có thể chưa có role. POS_OPERATOR là quyền tối thiểu; quyền
           QUANLY phải được gán tường minh, không suy từ tên/PIN. */
        role: e.role || 'POS_OPERATOR',
        /* Điều khoản lương hiệu lực TỪ mốc cutover, đi qua cơ chế versioning —
           sửa lương về sau không được làm trôi lương các ca đã chấm. */
        payTerms: {
          effectiveFrom: cutoverDate,
          payType: e.payType || null,
          hourlyRate: typeof e.hourlyRate === 'number' ? e.hourlyRate : null,
          fixedMonthlySalary: typeof e.fixedMonthlySalary === 'number' ? e.fixedMonthlySalary : null,
          otEnabled: !!e.otEnabled,
          otRate: typeof e.otRate === 'number' ? e.otRate : null,
          otThresholdHours: typeof e.otThresholdHours === 'number' ? e.otThresholdHours : null
        },
        /* PIN mang sang NGUYÊN VẸN. Tiếp nhận nghĩa là nhân viên đăng nhập bằng
           đúng mã họ vẫn dùng — bắt cả quán học lại PIN mới trong ngày cutover
           là tự tạo ra một sự cố không liên quan gì tới FIFO. */
        pin: e.pin || null,
        origin: ORIGIN, legacyRef: id
      };
    }).filter(Boolean);
  }

  function buildRevenue(closings) {
    return Object.keys(closings || {}).map(function (period) {
      var b = closings[period] || {};
      return {
        period: period,
        revisionNo: 1,
        /* Số ĐÃ CHỐT của hệ cũ, đóng băng nguyên trạng. Hệ mới không tính lại —
           tính lại một kỳ đã chốt là đổi con số chủ quán đã dùng để ra quyết định. */
        frozen: true,
        values: {
          revenue: typeof b.doanhThu === 'number' ? b.doanhThu : null,
          cogs: typeof b.giaVon === 'number' ? b.giaVon : null,
          expenses: typeof b.tongChiPhi === 'number' ? b.tongChiPhi : null,
          payroll: typeof b.luong === 'number' ? b.luong : null,
          profit: typeof b.lai === 'number' ? b.lai : null
        },
        closedBy: b.closedBy || null,
        closedAt: b.closedAt || null,
        origin: ORIGIN, legacyRef: period
      };
    });
  }

  /* ---------- Ghép thành một plan ---------- */

  /** Tên các nguồn hệ cũ cần đọc. Bootstrap đọc đúng danh sách này. */
  var SOURCES = ['inventoryItems', 'stockContainers', 'activeUnits', 'recipes', 'employees', 'bookClosings'];

  /**
   * @param spec.legacy        dữ liệu THÔ của hệ cũ, keyed theo SOURCES
   * @param spec.cutoverDate   'YYYY-MM-DD' — ranh giới truy vết
   * @param spec.storeId, spec.actorId
   */
  function buildPlan(spec) {
    if (!spec || !spec.legacy) {
      return R.err('VALIDATION', 'tiếp nhận cần dữ liệu thô của hệ cũ');
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(spec.cutoverDate || '')) {
      return R.err('VALIDATION',
        'tiếp nhận cần cutoverDate YYYY-MM-DD — đây là ranh giới truy vết, không đoán được');
    }
    if (!ids.isId(spec.storeId, 'store')) {
      return R.err('VALIDATION', 'tiếp nhận cần storeId hợp lệ');
    }
    if (!ids.isId(spec.actorId, 'actor')) {
      return R.err('VALIDATION', 'tiếp nhận cần actorId — ai bấm nút chuyển giao');
    }

    var L = spec.legacy;
    var missing = SOURCES.filter(function (n) { return L[n] === undefined || L[n] === null; });
    if (missing.length) {
      /* Thiếu một nguồn thì KHÔNG dựng plan một phần. Tiếp nhận thiếu công thức
         hay thiếu mặt hàng còn tệ hơn là chưa tiếp nhận. */
      return R.err('PRECONDITION',
        'thiếu nguồn hệ cũ, KHÔNG tiếp nhận một phần: ' + missing.join(', '), { missing: missing });
    }

    var skipped = [];
    var items = buildItems(L.inventoryItems, skipped);
    var units = buildUnits(L.stockContainers, L.activeUnits, spec, skipped);
    var recipes = buildRecipes(L.recipes, spec.cutoverDate, skipped);
    var employees = buildEmployees(L.employees, spec.cutoverDate, spec.storeId, skipped);
    var revenue = buildRevenue(L.bookClosings);

    if (!units.length && !items.length) {
      return R.err('PRECONDITION',
        'hệ cũ không trả về mặt hàng hay lô nào — dừng, vì tiếp nhận rỗng trông y hệt tiếp nhận thành công');
    }

    var operationId = takeoverOperationId(spec.cutoverDate);
    var plan = {
      operationId: operationId,
      /* Unit tiếp nhận đi qua ĐÚNG đường unitChanges như mọi Unit khác —
         không có kho riêng cho hàng cũ. Chúng khác ở `origin`, không khác
         ở chỗ lưu. */
      unitChanges: units,
      /* KHÔNG có ledgerEntries: tồn đầu không phải một lần nhập hàng. Sinh
         bút toán RECEIVING giả sẽ làm báo cáo "nhập trong kỳ" của ngày
         cutover vọt lên một con số chưa từng có ai nhập. */
      ledgerEntries: [],
      domainRecords: []
        .concat(items.map(function (x) { return { type: 'item', record: x }; }))
        .concat(recipes.map(function (x) { return { type: 'recipeVersion', record: x }; }))
        .concat(employees.map(function (x) { return { type: 'employee', record: x }; }))
        .concat(revenue.map(function (x) { return { type: 'monthlySnapshot', record: x }; })),
      audit: {
        command: 'TakeoverFromLegacy',
        actorId: spec.actorId,
        cutoverDate: spec.cutoverDate,
        /* Dán ranh giới ngay vào audit, không để ở tài liệu rời. */
        boundary: 'Dữ liệu tiếp nhận từ hệ cũ tại ' + spec.cutoverDate +
          '. Hệ mới truy vết từ mốc này trở đi; lịch sử trước đó thuộc hệ cũ và không truy xuất.',
        counts: {
          units: units.length, items: items.length, recipes: recipes.length,
          employees: employees.length, revenuePeriods: revenue.length,
          skipped: skipped.length
        }
      }
    };

    return R.ok({
      plan: plan,
      summary: {
        operationId: operationId,
        units: units.length,
        unitsOpen: units.filter(function (u) { return u.status === 'OPEN'; }).length,
        totalQty: units.reduce(function (s, u) { return s + u.initialQty; }, 0),
        items: items.length, recipes: recipes.length,
        employees: employees.length, revenuePeriods: revenue.length
      },
      skipped: skipped
    });
  }

  return {
    ORIGIN: ORIGIN,
    SOURCES: SOURCES,
    takeoverOperationId: takeoverOperationId,
    buildItems: buildItems,
    buildUnits: buildUnits,
    buildRecipes: buildRecipes,
    buildEmployees: buildEmployees,
    buildRevenue: buildRevenue,
    buildPlan: buildPlan
  };
});

/* ===== src/layers/reporting/btp-report.js ===== */
/**
 * Báo cáo BTP theo ngày — {nấu, dùng, huỷ}.
 *
 * Đứt chuỗi #3 của FIFO-CHAIN-TRACE-BTP-V1.md [B5]: `thLichSuBTP` của legacy
 * TÍNH ĐÚNG {nau, dung, huy} theo ngày, nhưng chỉ dùng nội bộ cho dự báo và
 * export AI — KHÔNG BAO GIỜ lên màn hình báo cáo cho chủ quán xem.
 *
 * Cùng dạng lỗi "tính nhưng không bao giờ hiển thị" đã thấy ở `stockoutTargetPct`.
 * Chain-trace nói rõ: dữ liệu đã đúng logic, chỉ cần đưa ra, không cần thuật
 * toán mới.
 */
GIEO.define('reporting/btp-report', ['shared-kernel/result'], function (R) {
  'use strict';

  /**
   * @param spec.batches      mẻ đã nấu trong kỳ
   * @param spec.consumption  ledger CONSUMPTION của mặt hàng BTP
   * @param spec.waste        ledger WASTE của mặt hàng BTP
   */
  function buildDaily(spec) {
    var days = Object.create(null);

    function day(k) {
      if (!days[k]) {
        days[k] = { dateKey: k, nau: 0, nauCost: 0, batchCount: 0, dung: 0, huy: 0, huyCost: 0 };
      }
      return days[k];
    }

    (spec.batches || []).forEach(function (b) {
      if (b.status !== 'PRODUCED') return;
      var d = day(b.businessDate);
      d.nau += b.actualYield;
      d.nauCost += b.rawCost;
      d.batchCount += 1;
    });

    (spec.consumption || []).forEach(function (e) {
      day(e.businessDate).dung += Math.abs(e.qtyDelta);
    });

    (spec.waste || []).forEach(function (e) {
      var d = day(e.businessDate);
      d.huy += Math.abs(e.qtyDelta);
      d.huyCost += Math.abs(e.qtyDelta) * (e.unitCost || 0);
    });

    var rows = Object.keys(days).sort().map(function (k) {
      var d = days[k];
      /* Tỉ lệ huỷ trên lượng nấu — con số chủ quán thật sự cần nhìn. */
      d.huyPct = d.nau > 0 ? (d.huy / d.nau) * 100 : null;
      return d;
    });

    return R.ok({
      rows: rows,
      total: rows.reduce(function (s, d) {
        return {
          nau: s.nau + d.nau, dung: s.dung + d.dung, huy: s.huy + d.huy,
          nauCost: s.nauCost + d.nauCost, huyCost: s.huyCost + d.huyCost,
          batchCount: s.batchCount + d.batchCount
        };
      }, { nau: 0, dung: 0, huy: 0, nauCost: 0, huyCost: 0, batchCount: 0 }),
      computedAt: spec.computedAt || null
    });
  }

  /** Cột cho export CSV — thứ tự ổn định giữa các lần xuất. */
  var COLUMNS = [
    { key: 'dateKey', label: 'Ngày' },
    { key: 'batchCount', label: 'Số mẻ' },
    { key: 'nau', label: 'Nấu' },
    { key: 'dung', label: 'Dùng' },
    { key: 'huy', label: 'Huỷ' },
    { key: 'huyPct', label: 'Tỉ lệ huỷ (%)' },
    { key: 'huyCost', label: 'Giá trị huỷ' }
  ];

  return { buildDaily: buildDaily, COLUMNS: COLUMNS };
});

/* ===== src/layers/reporting/export-payload.js ===== */
/**
 * Export báo cáo ĐÃ ĐỊNH DẠNG.
 *
 * Gap (GIEO-REBUILD-HANDOFF-V2.md §4.2, FIFO-CHAIN-TRACE-REPORTING-V1.md §6):
 * legacy không có export báo cáo nào, chỉ có dump JSON thô. Chain-trace nói rõ
 * đây là 2 việc KHÁC NHAU và không thay thế nhau được:
 *   - export báo cáo (CSV tối thiểu) — cho người đọc, cho kế toán
 *   - trích xuất dữ liệu thô — cho phân tích, vẫn giữ riêng
 *
 * Mọi payload mang `computedAt` (§8) để UI luôn hiển thị được độ mới, và mang
 * nhãn cơ sở giá / cờ đóng băng để người đọc biết con số này là gì.
 */
GIEO.define('reporting/export-payload', ['shared-kernel/result'], function (R) {
  'use strict';

  function esc(v) {
    if (v === null || v === undefined) return '';
    var s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  /**
   * CSV từ danh sách bản ghi + cột khai tường minh.
   * Khai cột thay vì suy từ khoá object: thứ tự cột phải ổn định giữa các lần
   * export, nếu không file tháng này và tháng sau không xếp cạnh nhau được.
   */
  function toCsv(spec) {
    var columns = spec.columns;
    if (!Array.isArray(columns) || columns.length === 0) {
      return R.err('VALIDATION', 'export CSV phải khai cột — thứ tự cột suy từ object sẽ đổi giữa các lần');
    }
    /* Cột phải khai {label, key} hoặc {label, value}. Nhận chuỗi trần thì header
       sẽ là "undefined" và file vẫn xuất ra bình thường — đúng kiểu hỏng im lặng
       mà không ai phát hiện cho tới khi mở file. */
    var bad = columns.filter(function (c) {
      return !c || typeof c !== 'object' || !c.label ||
        (c.key === undefined && typeof c.value !== 'function');
    });
    if (bad.length) {
      return R.err('VALIDATION',
        'cột export phải là {label, key} hoặc {label, value}; ' + bad.length +
        ' cột không hợp lệ — cột khai sai sẽ xuất ra file có header rỗng');
    }

    var rows = spec.rows || [];
    var out = [columns.map(function (c) { return esc(c.label); }).join(',')];

    rows.forEach(function (r) {
      out.push(columns.map(function (c) {
        var v = typeof c.value === 'function' ? c.value(r) : r[c.key];
        return esc(v);
      }).join(','));
    });

    return R.ok(out.join('\n'));
  }

  /**
   * Bọc 1 báo cáo để xuất ra.
   * `meta` của read-layer được mang theo nguyên vẹn, nên file xuất ra nói được
   * số này đến từ đâu và đã đóng băng chưa.
   */
  function buildExport(spec) {
    if (!spec.title) return R.err('VALIDATION', 'export cần tiêu đề');
    if (!spec.period) return R.err('VALIDATION', 'export cần kỳ báo cáo');

    var meta = spec.meta || {};
    var csv = toCsv({ columns: spec.columns, rows: spec.rows });
    if (R.isErr(csv)) return csv;

    return R.ok({
      title: spec.title,
      period: spec.period,
      storeId: spec.storeId,
      /* §8 — mọi payload mang computedAt, không tuỳ màn hình có hay không. */
      computedAt: meta.computedAt || spec.computedAt || null,
      frozen: !!meta.frozen,
      sources: meta.sources || [],
      /* Cơ sở giá đi kèm số, không nằm ở chú thích cuối trang. */
      valuationBasis: spec.valuationBasis || null,
      ambiguous: meta.ambiguous || [],
      csv: csv.value,
      rowCount: (spec.rows || []).length,
      /* Cảnh báo dán ngay trên file, để người cầm file biết nó chưa chốt. */
      notices: buildNotices(meta, spec)
    });
  }

  function buildNotices(meta, spec) {
    var n = [];
    if (!meta.frozen) n.push('Số liệu chưa đóng băng — có thể đổi nếu dữ liệu gốc thay đổi.');
    if (meta.ambiguous && meta.ambiguous.length) {
      n.push(meta.ambiguous.length + ' mục dữ liệu cũ không đủ nghĩa, cần rà thủ công.');
    }
    if (spec.mixedBasis) n.push('Tổng trộn 2 cơ sở giá — xem nhãn từng dòng.');
    if (spec.hasEstimatedExpenses) n.push('Còn chi phí ước tính chờ hoá đơn thật — lãi chưa phải số cuối.');
    return n;
  }

  /**
   * Trích xuất thô — GIỮ RIÊNG, không phải thay thế cho export báo cáo.
   * Chain-trace §6 nói rõ 2 việc này tách biệt.
   */
  function rawExtract(spec) {
    return R.ok({
      kind: 'RAW_EXTRACT',
      purpose: 'phân tích/AI — KHÔNG phải báo cáo cho người đọc',
      storeId: spec.storeId,
      period: spec.period,
      computedAt: spec.computedAt || null,
      data: spec.data || {}
    });
  }

  return { toCsv: toCsv, buildExport: buildExport, rawExtract: rawExtract };
});

/* ===== src/layers/reporting/inventory-valuation.js ===== */
/**
 * Định giá tồn kho — dùng `Unit.costBasis` THẬT, không phải giá scalar gần nhất.
 *
 * Gap (GIEO-REBUILD-HANDOFF-V2.md §4.2, FIFO-CHAIN-TRACE-REPORTING-V1.md §4):
 * legacy định giá tồn kho bằng giá gần nhất của mặt hàng, nên tồn gồm nhiều lô
 * giá khác nhau vẫn bị quy về một giá — sai lệch càng lớn khi giá nhập biến động.
 *
 * Điểm thứ hai của §4 cũng quan trọng không kém: khi hiển thị cùng lúc 2 chỉ số
 * dùng 2 CƠ SỞ GIÁ khác nhau (tồn kho hiện tại vs tiêu hao lịch sử), mỗi số
 * phải mang nhãn cơ sở giá của chính nó. Legacy chỉ có chú thích nhỏ, nên người
 * đọc dễ so hai số không cùng gốc. Ở đây `basis` là field của kết quả.
 */
GIEO.define('reporting/inventory-valuation', [
  'shared-kernel/result'
], function (R) {
  'use strict';

  var BASIS = {
    /* Cộng theo giá vốn thật của từng lô còn tồn. */
    FIFO_ACTUAL: 'FIFO_ACTUAL',
    /* Chỉ dùng cho phần tồn KHÔNG có Unit đại diện, vì không có lô để hỏi giá. */
    LATEST_COST: 'LATEST_COST'
  };

  /**
   * Giá trị tồn kho theo từng lô.
   *
   * Phần `untracked` (tồn không có Unit) được tách riêng và ghi rõ nó dùng cơ
   * sở giá khác — gộp vào tổng mà không nói là làm người đọc tưởng cả tổng đều
   * là giá lô thật.
   */
  function valuate(spec) {
    var units = spec.units || [];
    var trackedValue = 0;
    var trackedQty = 0;
    var lines = [];

    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      if (u.status !== 'SEALED' && u.status !== 'OPEN' && u.status !== 'CONSUMING') continue;
      var qty = u.status === 'SEALED' ? u.initialQty : u.remainingQty;
      if (qty <= 0) continue;
      if (!u.costBasis || typeof u.costBasis.unitCost !== 'number') {
        return R.err('PRECONDITION',
          'Unit ' + u.unitId + ' không có costBasis — không định giá được bằng giá lô thật',
          { unitId: u.unitId });
      }
      var value = qty * u.costBasis.unitCost;
      trackedValue += value;
      trackedQty += qty;
      lines.push({
        unitId: u.unitId, itemId: u.itemId, qty: qty,
        unitCost: u.costBasis.unitCost, value: value,
        costBasisVersionId: u.costBasis.versionId
      });
    }

    var untrackedQty = spec.untrackedBase || 0;
    var untrackedValue = null;
    if (untrackedQty > 0) {
      if (typeof spec.latestUnitCost !== 'number') {
        return R.err('NOT_FOUND',
          'có ' + untrackedQty + ' tồn không gắn lô nhưng không biết giá gần nhất để định giá phần đó');
      }
      untrackedValue = untrackedQty * spec.latestUnitCost;
    }

    return R.ok({
      tracked: { qty: trackedQty, value: trackedValue, basis: BASIS.FIFO_ACTUAL, lines: lines },
      untracked: untrackedQty > 0
        ? { qty: untrackedQty, value: untrackedValue, basis: BASIS.LATEST_COST, unitCost: spec.latestUnitCost }
        : null,
      totalQty: trackedQty + untrackedQty,
      totalValue: trackedValue + (untrackedValue || 0),
      /* Tổng trộn 2 cơ sở giá thì phải NÓI RA. */
      mixedBasis: untrackedQty > 0,
      computedAt: spec.computedAt || null
    });
  }

  /**
   * Nhãn cơ sở giá cho UI. §4 yêu cầu nhãn đi kèm từng số, không phải chú
   * thích nhỏ ở cuối màn.
   */
  function describeBasis(basis) {
    return basis === BASIS.FIFO_ACTUAL
      ? 'giá vốn thật của từng lô còn tồn'
      : 'giá nhập gần nhất (phần tồn không gắn lô)';
  }

  return { BASIS: BASIS, valuate: valuate, describeBasis: describeBasis };
});

/* ===== src/layers/reporting/report-queries.js ===== */
/**
 * Các báo cáo P11 dưới dạng QUERY đăng ký — §15 GIEO-SYSTEM-REBUILD-PLAN.md.
 *
 * Vì sao module này tồn tại: tầng `reporting` đã có sẵn định giá tồn, variance,
 * BTP và export, nhưng không app nào với tới được vì chúng chưa bao giờ được
 * đăng ký thành query. Một báo cáo không đăng ký thì hoặc là không dùng được,
 * hoặc sẽ được dùng bằng cách đọc thẳng nguồn thô — và đọc thẳng nguồn thô đúng
 * là thứ `LIVE + COMPACT → UNIFIED READ → REPORT` sinh ra để cấm.
 *
 * Mọi query ở đây đi qua ĐÚNG cổng quyền của read-layer (`guardRead`), không
 * có sổ quyền thứ hai.
 */
GIEO.define('reporting/report-queries', [
  'shared-kernel/result',
  'read-layer/gateway',
  'reporting/usage-report',
  'reporting/inventory-valuation',
  'reporting/variance-report',
  'reporting/btp-report',
  'reporting/export-payload'
], function (R, gateway, usage, valuation, variance, btp, exportLib) {
  'use strict';

  /* Báo cáo quản trị: mặc định KHÔNG thuộc tầng EXECUTE. Người đứng bán không
     cần đọc giá trị tồn kho hay tỉ lệ giá vốn để làm việc của mình. */
  var Q = {
    GetUsageReport: gateway.registerQuery('GetUsageReport', { authority: 'REVIEW_APPROVE_CORRECT' }),
    /* RM7 — báo cáo hao hụt/tồn kho nguyên liệu thô THEO NGÀY, cùng dữ liệu
       GetUsageReport, khác chiều gộp. Xem `reporting/usage-report.js#buildDaily`. */
    GetUsageReportDaily: gateway.registerQuery('GetUsageReportDaily', { authority: 'REVIEW_APPROVE_CORRECT' }),
    GetLossReport: gateway.registerQuery('GetLossReport', { authority: 'REVIEW_APPROVE_CORRECT' }),
    GetInventoryValuation: gateway.registerQuery('GetInventoryValuation', { authority: 'REVIEW_APPROVE_CORRECT' }),
    GetVarianceReport: gateway.registerQuery('GetVarianceReport', { authority: 'REVIEW_APPROVE_CORRECT' }),
    GetBTPReport: gateway.registerQuery('GetBTPReport', { authority: 'REVIEW_APPROVE_CORRECT' }),
    /* Xuất file mang số ra ngoài hệ thống — để ở tầng cao nhất. */
    ExportReport: gateway.registerQuery('ExportReport', { authority: 'MASTER_CONFIGURE' })
  };

  function wrap(data, ctx) {
    return R.ok({
      data: data,
      meta: { sources: ['LIVE'], frozen: false, ambiguous: [], computedAt: ctx.clock.now() }
    });
  }

  function getUsageReport(ctx, spec) {
    var g = gateway.guardRead(Q.GetUsageReport, ctx, spec);
    if (R.isErr(g)) return g;
    var r = usage.build({ entries: spec.entries || [], itemNames: spec.itemNames });
    return R.isErr(r) ? r : wrap(r.value, ctx);
  }

  function getUsageReportDaily(ctx, spec) {
    var g = gateway.guardRead(Q.GetUsageReportDaily, ctx, spec);
    if (R.isErr(g)) return g;
    var r = usage.buildDaily({ entries: spec.entries || [], itemNames: spec.itemNames });
    return R.isErr(r) ? r : wrap(r.value, ctx);
  }

  function getLossReport(ctx, spec) {
    var g = gateway.guardRead(Q.GetLossReport, ctx, spec);
    if (R.isErr(g)) return g;
    /* Cùng một lần đọc sổ với usage — không có đường đếm hao hụt thứ hai. */
    var r = usage.build({ entries: spec.entries || [], itemNames: spec.itemNames });
    if (R.isErr(r)) return r;
    return wrap(usage.lossOnly(r.value), ctx);
  }

  function getInventoryValuation(ctx, spec) {
    var g = gateway.guardRead(Q.GetInventoryValuation, ctx, spec);
    if (R.isErr(g)) return g;
    var r = valuation.valuate({
      units: spec.units || [],
      untrackedBase: spec.untrackedBase || 0,
      latestCost: spec.latestCost
    });
    return R.isErr(r) ? r : wrap(r.value, ctx);
  }

  function getVarianceReport(ctx, spec) {
    var g = gateway.guardRead(Q.GetVarianceReport, ctx, spec);
    if (R.isErr(g)) return g;
    var r = variance.build({
      cogs: spec.cogs, revenue: spec.revenue,
      targetPct: spec.targetPct, tolerancePct: spec.tolerancePct
    });
    return R.isErr(r) ? r : wrap(r.value, ctx);
  }

  function getBTPReport(ctx, spec) {
    var g = gateway.guardRead(Q.GetBTPReport, ctx, spec);
    if (R.isErr(g)) return g;
    var r = btp.buildDaily({
      batches: spec.batches || [],
      consumption: spec.consumption || [],
      waste: spec.waste || [],
      dateKey: spec.dateKey
    });
    return R.isErr(r) ? r : wrap(r.value, ctx);
  }

  /**
   * Xuất file. `meta` của báo cáo gốc đi kèm nguyên vẹn, nên file nói được số
   * đến từ đâu và đã chốt hay chưa — không có file nào rời khỏi hệ thống mà
   * không mang theo xuất xứ.
   */
  function exportReport(ctx, spec) {
    var g = gateway.guardRead(Q.ExportReport, ctx, spec);
    if (R.isErr(g)) return g;
    if (!spec.meta) {
      return R.err('VALIDATION',
        'xuất báo cáo phải kèm meta của truy vấn gốc — file không mang xuất xứ là file không kiểm chứng được');
    }
    var r = exportLib.buildExport({
      title: spec.title, period: spec.period, storeId: spec.storeId || ctx.storeId,
      columns: spec.columns, rows: spec.rows, meta: spec.meta,
      valuationBasis: spec.valuationBasis, computedAt: ctx.clock.now()
    });
    return R.isErr(r) ? r : R.ok({ data: r.value, meta: spec.meta });
  }

  return {
    QUERIES: Q,
    getUsageReport: getUsageReport,
    getUsageReportDaily: getUsageReportDaily,
    getLossReport: getLossReport,
    getInventoryValuation: getInventoryValuation,
    getVarianceReport: getVarianceReport,
    getBTPReport: getBTPReport,
    exportReport: exportReport
  };
});

/* ===== src/layers/reporting/usage-report.js ===== */
/**
 * Báo cáo Waste / Lost / Usage — P11 của GIEO-SYSTEM-REBUILD-PLAN.md §15.
 *
 * Ba báo cáo này là BA LÁT CẮT của cùng một cuốn sổ, nên ở đây là một module
 * đọc ledger một lần rồi tách ra, không phải ba module cộng ba lần. Legacy có
 * ba đường đếm hao hụt riêng và chúng không khớp nhau — chính là lớp lệch mà
 * quy tắc R3 ("một canonical query, một implementation") sinh ra để chặn.
 *
 * Nguồn DUY NHẤT là ledger. Không đọc `currentStock`, không đọc bất kỳ ô tổng
 * nào đã được cộng sẵn: ô tổng là projection, và projection sai thì báo cáo sai
 * theo mà không ai biết.
 */
GIEO.define('reporting/usage-report', [
  'shared-kernel/result'
], function (R) {
  'use strict';

  /* Ánh xạ loại bút toán → cột báo cáo. Loại nào chưa khai thì được đếm riêng
     chứ không im lặng bỏ qua — bỏ qua là cách một dòng hao hụt biến mất. */
  var BUCKET = {
    CONSUMPTION: 'consumed',
    WASTE: 'waste',
    LOST: 'lost',
    FOUND: 'found',
    ADJUSTMENT: 'adjustment',
    REVERSAL: 'reversal',
    RECEIVING: 'received',
    TRANSFER: 'transfer'
  };

  var COLUMNS = [
    'itemId', 'received', 'consumed', 'waste', 'lost', 'found',
    'adjustment', 'reversal', 'net', 'untrackedQty'
  ];

  function emptyRow(itemId) {
    return {
      itemId: itemId,
      received: 0, consumed: 0, waste: 0, lost: 0, found: 0,
      adjustment: 0, reversal: 0, transfer: 0,
      net: 0,
      /* Phần không gắn được Unit để RIÊNG. Gộp vào tổng là cách legacy làm cho
         "hao hụt" và "chưa ghi nhận được" trông giống hệt nhau. */
      untrackedQty: 0,
      unitIds: []
    };
  }

  /**
   * @param spec.entries     ledger entries trong kỳ (đã lọc theo store/kỳ ở tầng trên)
   * @param spec.itemNames   {itemId: tên} — chỉ để hiển thị, không ảnh hưởng số
   */
  function build(spec) {
    if (!spec || !Array.isArray(spec.entries)) {
      return R.err('VALIDATION', 'usage-report cần mảng entries');
    }
    var names = spec.itemNames || {};
    var byItem = Object.create(null);
    var unknownTypes = [];

    spec.entries.forEach(function (e) {
      var col = BUCKET[e.type];
      if (!col) {
        unknownTypes.push(e.type);
        return;
      }
      var row = byItem[e.itemId] || (byItem[e.itemId] = emptyRow(e.itemId));
      /* Cột báo cáo là ĐỘ LỚN (hao bao nhiêu), `net` giữ dấu để đối chiếu được
         với projection. Trộn hai thứ vào một cột là cách số liệu hết đọc được. */
      row[col] += Math.abs(e.qtyDelta);
      row.net += e.qtyDelta;
      if (!e.unitId) row.untrackedQty += Math.abs(e.qtyDelta);
      else if (row.unitIds.indexOf(e.unitId) === -1) row.unitIds.push(e.unitId);
    });

    var rows = Object.keys(byItem).sort().map(function (itemId) {
      return Object.assign({ itemName: names[itemId] || null }, byItem[itemId]);
    });

    function totalOf(col) {
      return rows.reduce(function (a, r) { return a + r[col]; }, 0);
    }

    return R.ok({
      rows: rows,
      totals: {
        received: totalOf('received'),
        consumed: totalOf('consumed'),
        waste: totalOf('waste'),
        lost: totalOf('lost'),
        found: totalOf('found'),
        adjustment: totalOf('adjustment'),
        reversal: totalOf('reversal'),
        net: totalOf('net'),
        untrackedQty: totalOf('untrackedQty')
      },
      entryCount: spec.entries.length,
      unknownTypes: unknownTypes.filter(function (v, i, a) { return a.indexOf(v) === i; })
    });
  }

  /** Lát cắt hao hụt: chỉ những mặt hàng thật sự có waste/lost trong kỳ. */
  function lossOnly(report) {
    return {
      rows: report.rows.filter(function (r) { return r.waste > 0 || r.lost > 0; }),
      totalWaste: report.totals.waste,
      totalLost: report.totals.lost,
      /* Tìm thấy lại được trừ ra khỏi mất — nhưng hiện cả hai số, vì "mất 10 tìm
         lại 10" khác hẳn "không mất gì". */
      netLost: report.totals.lost - report.totals.found,
      totalFound: report.totals.found
    };
  }

  var TOTAL_COLS = [
    'received', 'consumed', 'waste', 'lost', 'found',
    'adjustment', 'reversal', 'net', 'untrackedQty'
  ];

  /** Cột cho export CSV theo ngày — cùng hình dạng với `btp-report.js`. */
  var DAILY_COLUMNS = [
    { key: 'dateKey', label: 'Ngày' },
    { key: 'itemId', label: 'Nguyên liệu' },
    { key: 'received', label: 'Nhận' },
    { key: 'consumed', label: 'Dùng' },
    { key: 'waste', label: 'Hao hụt' },
    { key: 'lost', label: 'Mất' },
    { key: 'found', label: 'Tìm lại' },
    { key: 'adjustment', label: 'Điều chỉnh' },
    { key: 'net', label: 'Ròng' },
    { key: 'untrackedQty', label: 'Chưa gắn lô' }
  ];

  /**
   * RM7 — cùng nguồn/cùng luật với `build()`, chỉ thêm chiều `businessDate` mà
   * hệ cũ tính đúng (`thLichSuBTP` cho BTP) nhưng nguyên liệu thô chưa từng có.
   * `businessDate` là trường bắt buộc của mọi ledger entry (`fifo-core/ledger.js`
   * từ chối entry thiếu nó) nên không cần fallback gap-flag ở đây.
   *
   * @param spec.entries     ledger entries trong kỳ (đã lọc theo store/kỳ ở tầng trên)
   * @param spec.itemNames   {itemId: tên} — chỉ để hiển thị, không ảnh hưởng số
   */
  function buildDaily(spec) {
    if (!spec || !Array.isArray(spec.entries)) {
      return R.err('VALIDATION', 'usage-report cần mảng entries');
    }
    var names = spec.itemNames || {};
    var byDay = Object.create(null);
    var unknownTypes = [];

    spec.entries.forEach(function (e) {
      var col = BUCKET[e.type];
      if (!col) { unknownTypes.push(e.type); return; }
      var dateKey = e.businessDate;
      var day = byDay[dateKey] || (byDay[dateKey] = Object.create(null));
      var row = day[e.itemId] || (day[e.itemId] = Object.assign(emptyRow(e.itemId), { dateKey: dateKey }));
      row[col] += Math.abs(e.qtyDelta);
      row.net += e.qtyDelta;
      if (!e.unitId) row.untrackedQty += Math.abs(e.qtyDelta);
      else if (row.unitIds.indexOf(e.unitId) === -1) row.unitIds.push(e.unitId);
    });

    var dateKeys = Object.keys(byDay).sort();
    var rows = [];
    dateKeys.forEach(function (dateKey) {
      Object.keys(byDay[dateKey]).sort().forEach(function (itemId) {
        rows.push(Object.assign({ itemName: names[itemId] || null }, byDay[dateKey][itemId]));
      });
    });

    /* Tổng theo ngày, gộp mọi mặt hàng — con số đầu tiên chủ quán nhìn vào,
       chi tiết theo mặt hàng nằm ở `rows` khi cần đào sâu. */
    var days = dateKeys.map(function (dateKey) {
      var t = { dateKey: dateKey };
      TOTAL_COLS.forEach(function (c) { t[c] = 0; });
      Object.keys(byDay[dateKey]).forEach(function (itemId) {
        var r = byDay[dateKey][itemId];
        TOTAL_COLS.forEach(function (c) { t[c] += r[c]; });
      });
      return t;
    });

    return R.ok({
      rows: rows,
      days: days,
      entryCount: spec.entries.length,
      unknownTypes: unknownTypes.filter(function (v, i, a) { return a.indexOf(v) === i; })
    });
  }

  return {
    COLUMNS: COLUMNS, DAILY_COLUMNS: DAILY_COLUMNS, BUCKET: BUCKET,
    build: build, lossOnly: lossOnly, buildDaily: buildDaily
  };
});

/* ===== src/layers/reporting/variance-report.js ===== */
/**
 * Variance report — actual vs theoretical là CHỈ SỐ CHÍNH.
 *
 * FIFO-CHAIN-TRACE-SALES-COGS-PL-V1.md: "packages/reporting/variance-report
 * phải hiển thị variance giữa 2 con số này làm chỉ số chính".
 *
 * Nguyên lý "Actual ≠ Theoretical" là nguyên lý trung tâm của Master Plan §10
 * nhưng CHƯA TỪNG được lấp cho domain COGS — nguyên liệu thô có đối chiếu
 * SỐ LƯỢNG (`thDoiChieu`), còn TIỀN thì không có gì để đối chiếu, vì chưa từng
 * có vế actual. Báo cáo này là chỗ vế đó cuối cùng được dùng.
 */
GIEO.define('reporting/variance-report', ['shared-kernel/result'], function (R) {
  'use strict';

  var STATUS = { OK: 'OK', OVER: 'OVER', UNDER: 'UNDER', UNKNOWN: 'UNKNOWN' };

  /**
   * @param spec.cogs       kết quả read-layer.getCOGS (đã có 2 vế)
   * @param spec.revenue    để tính tỉ lệ giá vốn
   * @param spec.targetPct  ngưỡng cogsPct của kỳ (resolve theo NGÀY ở tầng trên)
   * @param spec.tolerancePct
   */
  function build(spec) {
    var c = spec.cogs;
    if (!c) return R.err('VALIDATION', 'variance-report cần kết quả COGS');
    var tol = typeof spec.tolerancePct === 'number' ? spec.tolerancePct : 5;

    var status;
    var message;
