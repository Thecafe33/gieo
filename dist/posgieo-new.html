      return R.err('PRECONDITION', 'cảnh báo đã đóng');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'resolve cần actorId');

    if (alert.resolution === RESOLUTION.AUTO_VERIFIABLE) {
      return R.err('PRECONDITION',
        'loại "' + alert.type + '" tự đóng khi điều kiện thật sự hết — không đóng tay được. ' +
        'Bấm tắt bằng tay là cách bỏ qua vấn đề gốc.');
    }
    if (!spec.referenceId) {
      return R.err('VALIDATION',
        'đóng cảnh báo "' + alert.type + '" phải kèm referenceId trỏ tới hành động đã sửa — ' +
        'không có tham chiếu thì không chứng minh được vấn đề đã được xử lý');
    }

    return R.ok(Object.assign({}, alert, {
      status: STATUS.RESOLVED,
      resolvedAt: spec.at || null,
      resolvedBy: spec.actorId,
      resolvedReferenceId: spec.referenceId
    }));
  }

  /**
   * Quét lại: loại AUTO_VERIFIABLE nào không còn điều kiện thì tự đóng.
   *
   * Đây là pattern của FIFO bell — cơ chế DUY NHẤT của legacy tự xoá đúng khi
   * điều kiện thật sự hết, thay vì chờ người bấm ẩn. Giờ là mặc định.
   *
   * @param spec.stillActiveKeys  danh sách subjectKey còn đang có vấn đề
   */
  function reconcile(alerts, spec) {
    var active = Object.create(null);
    (spec.stillActiveKeys || []).forEach(function (k) { active[k] = true; });

    var cleared = [];
    var next = alerts.map(function (a) {
      if (a.resolution !== RESOLUTION.AUTO_VERIFIABLE) return a;
      if (a.status === STATUS.RESOLVED || a.status === STATUS.AUTO_CLEARED) return a;
      if (active[a.subjectKey]) return a;
      var done = Object.assign({}, a, { status: STATUS.AUTO_CLEARED, autoClearedAt: spec.at || null });
      cleared.push(done);
      return done;
    });

    return R.ok({ alerts: next, cleared: cleared });
  }

  /**
   * Kênh ngoài app (push OS / SMS / Zalo) là CHỖ NỐI SẴN (§6 luồng chuẩn).
   * AlertEngine chỉ phát event; handler bên ngoài đăng ký sau, không phải sửa
   * lại engine.
   */
  function toEvents(alerts) {
    return alerts.map(function (a) {
      return {
        type: 'AlertRaised',
        alertId: a.alertId,
        alertType: a.type,
        severity: a.severity,
        audience: a.audience,
        storeId: a.storeId,
        businessDate: a.businessDate,
        data: a.data
      };
    });
  }

  return {
    SEVERITY: SEVERITY,
    AUDIENCE: AUDIENCE,
    RESOLUTION: RESOLUTION,
    STATUS: STATUS,
    TYPES: TYPES,
    isType: isType,
    raise: raise,
    rank: rank,
    bucketize: bucketize,
    markSeen: markSeen,
    resolve: resolve,
    reconcile: reconcile,
    toEvents: toEvents
  };
});

/* ===== src/layers/read-layer/gateway.js ===== */
/**
 * Read gateway — CỔNG ĐỌC DUY NHẤT.
 *
 * Contract: UNIFIED-READ-LAYER-CONTRACT-V1.md.
 *
 * Ba invariant nặng nhất được cài vào chính cấu trúc, không phải bằng lời nhắc:
 *
 * R3 — MỘT canonical query, MỘT implementation. Legacy có 2 pipeline doanh thu
 *      độc lập (POS tự tính, QUANLY tự tính) không đảm bảo khớp nhau. Ở đây cả
 *      hai app gọi cùng một hàm, nên không tồn tại khả năng lệch.
 *
 * R5/§5 — PHÂN QUYỀN ĐỌC. Gap đã xác nhận: Reporting legacy có 0% phân quyền —
 *      QUANLY dùng một tài khoản Firebase dùng chung nên mọi người thấy toàn bộ
 *      P&L/COGS/khách hàng. Ở đây mọi API đăng ký quyền, và MẶC ĐỊNH ĐÓNG:
 *      query chưa khai quyền thì bị từ chối.
 *
 * R8/§3 — COGS luôn 2 vế. Cấm tồn tại field tên `cogsActual` chứa theoretical.
 */
GIEO.define('read-layer/gateway', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'store-context/access',
  'read-layer/merge-canonical',
  'fifo-core/projection',
  'traceability/trace'
], function (ids, R, access, merge, projection, traceLib) {
  'use strict';

  /**
   * Đăng ký query đọc. Đi qua CÙNG sổ quyền với command ghi — quyền đọc không
   * phải hạng hai.
   */
  function registerQuery(name, spec) {
    access.registerCommand(name, {
      authority: spec.authority,
      mutates: false,
      sources: spec.sources,
      crossStore: spec.crossStore
    });
    return name;
  }

  var Q = {
    GetUnitTrace: registerQuery('GetUnitTrace', { authority: 'EXECUTE' }),
    GetInventoryLevel: registerQuery('GetInventoryLevel', { authority: 'EXECUTE' }),
    GetConsumption: registerQuery('GetConsumption', { authority: 'REVIEW_APPROVE_CORRECT' }),
    /* Dữ liệu nhạy cảm mặc định KHÔNG thuộc tầng EXECUTE (quy tắc P3). */
    GetRevenue: registerQuery('GetRevenue', { authority: 'REVIEW_APPROVE_CORRECT' }),
    GetCOGS: registerQuery('GetCOGS', { authority: 'REVIEW_APPROVE_CORRECT' }),
    GetPnL: registerQuery('GetPnL', { authority: 'MASTER_CONFIGURE' }),
    GetCustomerReport: registerQuery('GetCustomerReport', { authority: 'MASTER_CONFIGURE' })
  };

  /** Cổng chung: quyền + storeId bắt buộc, trước khi chạm dữ liệu. */
  function guard(queryName, ctx, spec) {
    if (!ctx || !ctx.actor) return R.err('FORBIDDEN', 'không có context — mọi read phải biết ai đọc');
    var storeId = (spec && spec.storeId) || ctx.storeId;
    if (!ids.isId(storeId, 'store')) {
      return R.err('VALIDATION', 'mọi query phải nêu rõ storeId (quy tắc P5)');
    }
    var auth = access.authorize(ctx.actor, queryName, storeId);
    if (R.isErr(auth)) return auth;
    return R.ok(storeId);
  }

  /** Vòng đời đầy đủ 1 Unit. */
  function getUnitTrace(ctx, spec) {
    var g = guard(Q.GetUnitTrace, ctx, spec);
    if (R.isErr(g)) return g;
    if (!ids.isId(spec.unitId, 'unit')) return R.err('VALIDATION', 'getUnitTrace cần unitId hợp lệ');

    return merge.resolve({
      snapshot: spec.snapshot,
      computeLive: function () {
        if (!spec.unit) return R.ok(null);
        return traceLib.buildUnitTrace({
          unit: spec.unit,
          ledgerEntries: spec.ledgerEntries || [],
          allocations: spec.allocations || []
        });
      },
      legacy: spec.legacyTrace,
      computedAt: ctx.clock.now()
    });
  }

  /** Tồn kho hiện tại — công thức DUY NHẤT của fifo-core/projection. */
  function getInventoryLevel(ctx, spec) {
    var g = guard(Q.GetInventoryLevel, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      computeLive: function () {
        var r = projection.computeCurrentStock({
          units: spec.units || [],
          untrackedBase: spec.untrackedBase || 0,
          ledgerEntries: spec.ledgerEntries || []
        });
        return R.isErr(r) ? r : R.ok(r.value);
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * Doanh thu — MỘT implementation cho cả POS lẫn QUANLY (R3).
   * Trừ phí sàn để ra doanh thu thuần: đường ống legacy chưa từng nối.
   */
  function getRevenue(ctx, spec) {
    var g = guard(Q.GetRevenue, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      snapshot: spec.snapshot,
      cache: spec.cache,
      computeLive: function () {
        var bills = spec.bills || [];
        var byChannel = {};
        var gross = 0, fees = 0, net = 0, discounts = 0;

        bills.forEach(function (b) {
          gross += b.total;
          fees += b.channelFee || 0;
          net += b.netRevenue;
          discounts += b.discountTotal || 0;
          var k = b.channel ? b.channel.type : 'UNKNOWN';
          if (!byChannel[k]) byChannel[k] = { gross: 0, fees: 0, net: 0, billCount: 0 };
          byChannel[k].gross += b.total;
          byChannel[k].fees += b.channelFee || 0;
          byChannel[k].net += b.netRevenue;
          byChannel[k].billCount += 1;
        });

        return R.ok({
          billCount: bills.length,
          grossRevenue: gross,
          discountTotal: discounts,
          channelFees: fees,
          netRevenue: net,
          /* Tách theo kênh — dữ liệu legacy đã có nhưng P&L chỉ 1 số tổng. */
          byChannel: byChannel
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * COGS — BẮT BUỘC 2 vế (§3, invariant R8).
   *
   * Cộng từ `bill.cogs` đã ghi lúc bán (V4: đọc versionId đã lưu, KHÔNG resolve
   * lại). Bill nào thiếu vế actual thì tổng actual là null — không bù bằng
   * theoretical để tổng trông đẹp.
   */
  function getCOGS(ctx, spec) {
    var g = guard(Q.GetCOGS, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      snapshot: spec.snapshot,
      cache: spec.cache,
      computeLive: function () {
        var bills = spec.bills || [];
        var theoretical = 0;
        var actual = 0;
        var missingActual = [];
        var versionIds = [];

        bills.forEach(function (b) {
          var c = b.cogs;
          if (!c) { missingActual.push({ billId: b.billId, reason: 'NO_COGS' }); return; }
          theoretical += c.cogsTheoretical;
          if (c.cogsActual === null) {
            missingActual.push({ billId: b.billId, reason: c.cogsActualReason || 'UNKNOWN' });
          } else {
            actual += c.cogsActual;
          }
          if (c.basis && c.basis.costBasisVersionIds) {
            versionIds = versionIds.concat(c.basis.costBasisVersionIds);
          }
        });

        var actualComplete = missingActual.length === 0 && bills.length > 0;
        var cogsActual = actualComplete ? actual : null;

        return R.ok({
          cogsTheoretical: theoretical,
          cogsActual: cogsActual,
          cogsActualPartial: actualComplete ? null : actual,
          variance: cogsActual === null ? null : cogsActual - theoretical,
          variancePct: (cogsActual === null || theoretical === 0)
            ? null : ((cogsActual - theoretical) / theoretical) * 100,
          missingActual: missingActual,
          basis: {
            costBasisVersionIds: versionIds.filter(function (v, i, a) { return v && a.indexOf(v) === i; })
          }
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * P&L. Kỳ đã chốt → đọc thẳng snapshot, không tính lại (§3.1 compaction).
   * `frozen` trong meta cho UI biết cột nào là số đóng băng (quy tắc T3).
   */
  function getPnL(ctx, spec) {
    var g = guard(Q.GetPnL, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      snapshot: spec.closing,
      computeLive: function () {
        var rev = spec.revenue;
        var cogs = spec.cogs;
        var exp = spec.expenses;
        if (!rev || !cogs) return R.ok(null);

        var grossProfit = rev.netRevenue - (cogs.cogsActual !== null ? cogs.cogsActual : cogs.cogsTheoretical);
        return R.ok({
          netRevenue: rev.netRevenue,
          cogsTheoretical: cogs.cogsTheoretical,
          cogsActual: cogs.cogsActual,
          /* Nói rõ lãi đang tính theo vế nào — legacy chỉ có 1 số nên không cần
             nói, và cũng vì thế không ai biết nó là số gì. */
          cogsBasisUsed: cogs.cogsActual !== null ? 'ACTUAL' : 'THEORETICAL',
          grossProfit: grossProfit,
          expenses: exp ? exp.total : 0,
          fixedExpenses: exp ? exp.fixed : 0,
          variableExpenses: exp ? exp.variable : 0,
          netProfit: grossProfit - (exp ? exp.total : 0),
          /* Còn khoản ước tính thì lãi này chưa phải số cuối. */
          hasEstimatedExpenses: !!(exp && exp.estimated > 0)
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * So sánh 2 kỳ — mỗi cột mang cờ `frozen` riêng (quy tắc T3).
   * Legacy để cả 2 cột tính sống nên so sánh trôi theo thời gian.
   */
  function comparePeriods(ctx, spec) {
    var g = guard(Q.GetPnL, ctx, spec);
    if (R.isErr(g)) return g;
    if (!spec.current || !spec.previous) {
      return R.err('VALIDATION', 'so sánh kỳ cần cả 2 kỳ');
    }
    return R.ok({
      current: { data: spec.current.data, frozen: spec.current.meta.frozen },
      previous: { data: spec.previous.data, frozen: spec.previous.meta.frozen },
      /* Cả 2 cột đều sống thì so sánh này sẽ đổi theo thời gian — nói ra. */
      bothLive: !spec.current.meta.frozen && !spec.previous.meta.frozen
    });
  }

  return {
    QUERIES: Q,
    registerQuery: registerQuery,
    getUnitTrace: getUnitTrace,
    getInventoryLevel: getInventoryLevel,
    getRevenue: getRevenue,
    getCOGS: getCOGS,
    getPnL: getPnL,
    comparePeriods: comparePeriods
  };
});

/* ===== src/layers/read-layer/merge-canonical.js ===== */
/**
 * merge-canonical — NƠI DUY NHẤT biết cả LIVE lẫn COMPACT.
 *
 * Contract: UNIFIED-READ-LAYER-CONTRACT-V1.md §4, invariant R1/R2.
 *
 * Gate của Phase 7: không còn UI nào tự branch `if (còn raw) ... else đọc
 * archive/compact`. Cách duy nhất bảo đảm điều đó là chỉ có đúng một nơi trong
 * toàn hệ thống được phép biết có hai nguồn.
 *
 * Thứ tự resolve (§4.1):
 *   1. SNAPSHOT (đã chốt/compacted)  → đọc thẳng, KHÔNG tính lại
 *   2. CACHE (tính lại được)          → nếu còn hợp lệ
 *   3. LIVE RAW                        → tính từ ledger/unit/bill
 *   4. LEGACY                          → qua adapter, CHỈ ĐỌC
 */
GIEO.define('read-layer/merge-canonical', ['shared-kernel/result'], function (R) {
  'use strict';

  var SOURCE = { SNAPSHOT: 'SNAPSHOT', CACHE: 'CACHE', LIVE: 'LIVE', LEGACY: 'LEGACY' };

  /**
   * Bọc kết quả kèm metadata nguồn.
   *
   * `meta` để CHẨN ĐOÁN và hiển thị cờ — KHÔNG phải để UI branch logic theo
   * nguồn (R1). UI đọc `data`, và `data` giống nhau bất kể đến từ đâu.
   */
  function wrap(data, meta) {
    return R.ok({
      data: data,
      meta: {
        sources: (meta && meta.sources) || [],
        frozen: !!(meta && meta.frozen),
        versionIds: (meta && meta.versionIds) || {},
        ambiguous: (meta && meta.ambiguous) || [],
        computedAt: (meta && meta.computedAt) || null
      }
    });
  }

  /**
   * Chọn nguồn theo đúng thứ tự ưu tiên.
   *
   * @param spec.snapshot  kết quả đã đóng băng (nếu có)
   * @param spec.cache     kết quả cache còn hợp lệ (nếu có)
   * @param spec.computeLive  () => Result  — chỉ gọi khi cần
   * @param spec.legacy    () => Result     — chỉ gọi khi live không có gì
   */
  function resolve(spec) {
    if (spec.snapshot) {
      /* Đã chốt thì ĐỌC THẲNG. "Con số chủ quán đã đọc và đã dùng để ra quyết
         định thì không được đổi sau lưng." */
      return wrap(spec.snapshot, {
        sources: [SOURCE.SNAPSHOT], frozen: true,
        versionIds: spec.snapshot.versionIds || {}, computedAt: spec.computedAt
      });
    }
    if (spec.cache) {
      return wrap(spec.cache, {
        sources: [SOURCE.CACHE], frozen: false, computedAt: spec.computedAt
      });
    }

    if (typeof spec.computeLive === 'function') {
      var live = spec.computeLive();
      if (R.isErr(live)) return live;
      if (live.value !== null && live.value !== undefined) {
        var sources = [SOURCE.LIVE];
        var ambiguous = [];

        /* Dữ liệu cũ không đủ nghĩa: đánh dấu AMBIGUOUS, KHÔNG suy đoán
           (invariant #12). UI/report hiện "cần rà thủ công" thay vì im lặng
           dựng số. */
        if (typeof spec.legacy === 'function') {
          var lg = spec.legacy();
          if (R.isOk(lg) && lg.value) {
            sources.push(SOURCE.LEGACY);
            if (lg.value.ambiguous) ambiguous = ambiguous.concat(lg.value.ambiguous);
          }
        }
        return wrap(live.value, {
          sources: sources, frozen: false, ambiguous: ambiguous, computedAt: spec.computedAt
        });
      }
    }

    if (typeof spec.legacy === 'function') {
      var only = spec.legacy();
      if (R.isErr(only)) return only;
      if (only.value) {
        return wrap(only.value, {
          sources: [SOURCE.LEGACY], frozen: false,
          ambiguous: only.value.ambiguous || [], computedAt: spec.computedAt
        });
      }
    }

    return R.err('NOT_FOUND', 'không có nguồn nào trả được dữ liệu cho truy vấn này');
  }

  /**
   * Cache invalidate THEO PHẠM VI, không xoá sạch (quy tắc K3).
   *
   * Legacy `clearSalesCache()`/`invalidateSalesCache()` xoá TOÀN BỘ cache mọi
   * ngày mỗi khi đổi cấu hình ảnh hưởng giá vốn, rồi tính lại bằng version
   * HIỆN TẠI — chính là instance #2/#3 của lớp lỗi versioning.
   *
   * Ở đây chỉ những ngày bị ảnh hưởng mới bị bỏ, và khi tính lại thì dùng
   * version lịch sử của từng ngày nên kết quả GIỐNG HỆT kết quả cũ.
   */
  function invalidateScope(cacheKeys, spec) {
    var from = spec.fromDateKey;
    var to = spec.toDateKey;
    if (!from || !to) return R.err('VALIDATION', 'invalidate cần phạm vi ngày — cấm xoá sạch cache');

    var kept = [];
    var dropped = [];
    cacheKeys.forEach(function (k) {
      var d = k.dateKey;
      if (d >= from && d <= to && (!spec.storeId || k.storeId === spec.storeId)) dropped.push(k);
      else kept.push(k);
    });
    return R.ok({ kept: kept, dropped: dropped });
  }

  return {
    SOURCE: SOURCE,
    wrap: wrap,
    resolve: resolve,
    invalidateScope: invalidateScope
  };
});

/* ===== src/layers/commands/pipeline.js ===== */
/**
 * Command pipeline — đường ghi DUY NHẤT của cả POS lẫn QUANLY.
 *
 * Contract: GIEO-SYSTEM-REBUILD-PLAN.md §2/§12, FIFO-CORE-ARCHITECTURE-V2.md §7.
 *
 *   VALIDATE → AUTHORIZE → READ CANONICAL → CALCULATE → MUTATION PLAN
 *            → IDEMPOTENCY → ENGINE → LEDGER → PROJECTION → AUDIT → VERIFY
 *
 * ────────────────────────────────────────────────────────────────────────
 * IDEMPOTENCY — legacy có 3 lớp bảo vệ ở đường bán hàng chính
 * (`applySalesConsumptionPOS`) nhưng 6 đường khác thiếu ít nhất 1 lớp:
 *   #6  not-empty        — busy-lock đặt SAU await
 *   #13 stock count      — dùng .add() sinh id ngẫu nhiên
 *   #21 BTP waste        — không catch/rollback sau khi đã allocate
 *   #22 start prep batch — thiếu txId cố định
 *   #23 add-on tăng      — thiếu txId cố định
 *   #24 found-lost       — bước ADJUSTMENT không có txId
 *
 * Nguyên nhân gốc: mỗi hàm TỰ CHẾ lớp chống-đúp riêng. Ở đây chỉ có MỘT chỗ
 * implement, và command không có cách nào tự chế lớp khác — nó chỉ mô tả việc
 * cần làm, pipeline lo phần còn lại.
 *
 * §10b.3 bổ sung tường minh: idempotency áp cho MỌI command, kể cả Approval
 * (ApproveStockCount, ApproveLostContainer, ApproveExpense) — legacy để approval
 * không kiểm tra status trước khi apply, nên 2 người duyệt cùng lúc cộng đúp.
 * ────────────────────────────────────────────────────────────────────────
 */
GIEO.define('commands/pipeline', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'shared-kernel/operation-state',
  'store-context/access'
], function (ids, R, opState, access) {
  'use strict';

  var STATES = opState.STATES;

  /**
   * Kho operation. Đây là port — bản in-memory dùng cho test và shadow;
   * persistence-firebase implement bản thật với compare-and-swap.
   */
  function createInMemoryOperationStore() {
    var ops = Object.create(null);
    return {
      get: function (operationId) {
        return R.ok(ops[operationId] || null);
      },
      /** Giành quyền chạy. Trả CONFLICT nếu đã có người giữ. */
      claim: function (record) {
        var existing = ops[record.operationId];
        if (existing) {
          if (existing.status === STATES.COMPLETED) {
            return R.err('CONFLICT', 'operation đã hoàn tất', { existing: existing });
          }
          if (existing.status === STATES.RUNNING) {
            return R.err('CONFLICT', 'operation đang chạy ở nơi khác', { existing: existing });
          }
        }
        ops[record.operationId] = record;
        return R.ok(record);
      },
      update: function (operationId, patch) {
        if (!ops[operationId]) return R.err('NOT_FOUND', 'không có operation ' + operationId);
        ops[operationId] = Object.assign({}, ops[operationId], patch);
        return R.ok(ops[operationId]);
      },
      all: function () { return Object.keys(ops).map(function (k) { return ops[k]; }); }
    };
  }

  /**
   * Khai báo 1 command. Đăng ký quyền LUÔN tại đây, nên không thể có command
   * chạy được mà quên khai quyền (mặc định đóng — access.authorize từ chối
   * command lạ).
   *
   * @param spec.name
   * @param spec.authority, spec.mutates, spec.sources, spec.crossStore  → access
   * @param spec.operationId  (input, ctx) => string  — BẮT BUỘC xác định
   * @param spec.requiresOpenDay  mặc định = mutates
   * @param spec.validate     (input, ctx) => Result
   * @param spec.execute      (input, ctx) => Result<MutationPlan>
   */
  function defineCommand(spec) {
    if (!spec || !spec.name) throw new Error('[pipeline] command cần name');
    if (typeof spec.operationId !== 'function') {
      throw new Error('[pipeline] command "' + spec.name + '" phải khai hàm operationId — ' +
        'id ngẫu nhiên làm sập idempotency (bug #13/#21/#22/#23/#24)');
    }
    if (typeof spec.execute !== 'function') {
      throw new Error('[pipeline] command "' + spec.name + '" cần execute');
    }

    access.registerCommand(spec.name, {
      authority: spec.authority,
      mutates: spec.mutates,
      sources: spec.sources,
      crossStore: spec.crossStore
    });

    return {
      name: spec.name,
      mutates: spec.mutates,
      requiresOpenDay: spec.requiresOpenDay === undefined ? spec.mutates : spec.requiresOpenDay,
      operationId: spec.operationId,
      validate: spec.validate || function () { return R.ok(true); },
      execute: spec.execute
    };
  }

  /**
   * Chạy 1 command qua đủ pipeline.
   *
   * `deps.operationStore` bắt buộc. `deps.commit` là ranh giới ghi nguyên tử —
   * nhận MutationPlan, ghi tất cả hoặc không ghi gì. Không có commit thì chạy ở
   * chế độ DRY-RUN (dùng cho shadow/simulate, đúng giai đoạn READ-ONLY hiện tại).
   */
  function run(command, input, ctx, deps) {
    deps = deps || {};
    var store = deps.operationStore;
    if (!store) return R.err('VALIDATION', 'pipeline cần operationStore');

    /* 1. VALIDATE */
    var v = command.validate(input, ctx);
    if (R.isErr(v)) return v;

    /* 2. AUTHORIZE — ở tầng Command/Domain, không phải UI (invariant #17) */
    var auth = ctx.authorize(command.name, input.storeId || ctx.storeId);
    if (R.isErr(auth)) return auth;

    /* 3. GATE ngày làm việc — ngày đã chốt thì khoá thao tác vận hành */
    if (command.requiresOpenDay) {
      var day = ctx.assertOperable(command.name);
      if (R.isErr(day)) return day;
    }

    /* 4. IDEMPOTENCY — id xác định, không bao giờ ngẫu nhiên */
    var operationId;
    try {
      operationId = command.operationId(input, ctx);
    } catch (e) {
      return R.err('VALIDATION', 'không dựng được operationId: ' + e.message);
    }
    if (!ids.isId(operationId, 'operation')) {
      return R.err('VALIDATION', 'operationId phải là id loại operation, nhận: ' + operationId);
    }

    var prior = store.get(operationId);
    if (R.isErr(prior)) return prior;
    if (prior.value && prior.value.status === STATES.COMPLETED) {
      /* Chạy lại là NO-OP trả kết quả cũ — không phải làm lại. */
      return R.ok({
        operationId: operationId,
        status: STATES.COMPLETED,
        replayed: true,
        result: prior.value.result
      });
    }

    var claim = store.claim({
      operationId: operationId,
      command: command.name,
      status: STATES.RUNNING,
      actorId: ctx.actor.actorId,
      storeId: ctx.storeId,
      businessDate: ctx.businessDate,
      startedAt: ctx.clock.now(),
      result: null
    });
    if (R.isErr(claim)) return claim;

    /* 5. CALCULATE + MUTATION PLAN */
    var planR;
    try {
      planR = command.execute(input, ctx);
    } catch (e) {
      store.update(operationId, { status: STATES.FAILED_MANUAL_REVIEW, error: e.message });
      return R.err('MANUAL_REVIEW', 'command "' + command.name + '" ném lỗi: ' + e.message);
    }
    if (R.isErr(planR)) {
      /* Chưa chạm vào state vật lý nên thất bại ở đây là thử lại được. */
      store.update(operationId, {
        status: R.isRetryable(planR) ? STATES.FAILED_RETRYABLE : STATES.FAILED_MANUAL_REVIEW,
        error: planR.error.message
      });
      return planR;
    }

    var plan = planR.value;
    plan.operationId = operationId;
    /* 6. AUDIT — gắn sẵn, không để command tự nhớ (§25) */
    plan.audit = Object.assign(ctx.auditBase(operationId), {
      command: command.name,
      reason: input.reason || null
    }, plan.audit || {});

    /* 7. COMMIT — ranh giới nguyên tử */
    if (!deps.commit) {
      store.update(operationId, { status: STATES.COMPLETED, result: plan, dryRun: true });
      return R.ok({
        operationId: operationId,
        status: STATES.COMPLETED,
        /* Giữ cùng hình dạng với đường commit thật — caller không phải phân biệt
           dry-run hay không để biết đây có phải lần chạy đầu. */
        replayed: false,
        dryRun: true,
        plan: plan
      });
    }

    var committed = deps.commit(plan, ctx);
    if (R.isErr(committed)) {
      /* Ghi hỏng sau khi đã tính toán: KHÔNG nuốt lỗi (invariant #11).
         Rollback nằm TRONG cùng command, không phải bước riêng dễ quên. */
      var rolledBack = null;
      if (deps.rollback) rolledBack = deps.rollback(plan, ctx);
      store.update(operationId, {
        status: R.isRetryable(committed) ? STATES.FAILED_RETRYABLE : STATES.FAILED_MANUAL_REVIEW,
        error: committed.error.message,
        rolledBack: rolledBack ? R.isOk(rolledBack) : false
      });
      return committed;
    }

    store.update(operationId, { status: STATES.COMPLETED, result: committed.value });
    return R.ok({
      operationId: operationId,
      status: STATES.COMPLETED,
      replayed: false,
      plan: plan,
      result: committed.value
    });
  }

  /**
   * MutationPlan rỗng — command bồi vào. Một plan mang TẤT CẢ thay đổi của một
   * operation (vật chất + ledger + projection + trace), để commit được nguyên tử.
   */
  function emptyPlan() {
    return {
      operationId: null,
      unitChanges: [],
      ledgerEntries: [],
      projectionRecomputes: [],
      traceChanges: [],
      domainRecords: [],
      events: [],
      audit: null
    };
  }

  return {
    createInMemoryOperationStore: createInMemoryOperationStore,
    defineCommand: defineCommand,
    run: run,
    emptyPlan: emptyPlan
  };
});

/* ===== src/layers/commands/sales.js ===== */
/**
 * Bán hàng — Bill model + RecordSale.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-SALES-COGS-PL-V1.md.
 * Gap: FEATURE-TREE-V1.md §4.7, §4.16; FIFO-CORE-ARCHITECTURE-V2.md §10b.1/§10b.7.
 *
 * Ba field/hành vi mà legacy thiếu, bổ sung ngay từ thiết kế (không thêm sau):
 *
 * 1. `soldByActorId` — NGOẠI LỆ DUY NHẤT của toàn hệ thống cũ. Mọi domain khác
 *    (stock transaction, prep batch, container, expense, cash count, checklist)
 *    đều ghi staffEmployeeId; riêng Bill thì không — chỉ có gate "có ai đó đang
 *    check-in", không biết CHÍNH XÁC ai bán. FEATURE-TREE §4.7 gọi đây là field
 *    còn thiếu quan trọng nhất trong toàn bộ audit tính năng.
 *
 * 2. `channel` (tại quán / mang đi / sàn) là first-class. Legacy ĐÃ ghi
 *    isToGo/isShip/isAppSale/appFeePct trên mỗi bill, nhưng `appFeePct` chỉ
 *    được GHI, KHÔNG BAO GIỜ ĐƯỢC ĐỌC (grep toàn bộ 2 file: đúng 1 kết quả —
 *    chính dòng ghi), và `plChannelFeeForDay()` hard-code return 0. Dữ liệu đã
 *    sẵn sàng, chỉ chưa nối đường ống. Ở đây phí sàn được TRỪ THẬT vào doanh
 *    thu thuần.
 *
 * 3. Addon phải kích hoạt lại Loyalty. Legacy `submitAddon` không gọi
 *    `loyaltyProcessAfterPay()`, nên khách trả thêm tiền mà không được cộng
 *    thêm điểm. Ở đây addon phát event để handler loyalty xử lý — side-effect
 *    là handler đăng ký riêng, không nhét vào lệnh bán.
 */
GIEO.define('commands/sales', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'catalog/menu',
  'catalog/packaging',
  'recipe-cost-btp/recipe',
  'recipe-cost-btp/cogs',
  'fifo-core/allocation'
], function (ids, R, pipeline, menuLib, packagingLib, recipeLib, cogsLib, allocation) {
  'use strict';

  var CHANNEL = {
    DINE_IN: 'DINE_IN',
    TO_GO: 'TO_GO',
    /* Sàn giao đồ ăn — có phí phần trăm, và phí đó PHẢI được đọc. */
    APP: 'APP'
  };

  function validateChannel(ch) {
    if (!ch || !CHANNEL[ch.type]) return "channel.type phải là DINE_IN | TO_GO | APP";
    if (ch.type === CHANNEL.APP) {
      if (!ch.appName) return 'bán qua sàn phải ghi rõ tên sàn';
      if (typeof ch.feePct !== 'number' || ch.feePct < 0 || ch.feePct > 100) {
        return 'bán qua sàn phải ghi feePct hợp lệ — legacy ghi rồi không bao giờ đọc, ' +
          'nên P&L theo kênh không bao giờ đúng';
      }
    }
    return null;
  }

  /**
   * Dựng Bill từ giỏ hàng.
   *
   * Mỗi dòng mang GIÁ ĐÃ SNAPSHOT (catalog/menu.snapshotPrice) — mẫu ĐÚNG của
   * legacy cần giữ: sửa giá menu sau này không làm trôi số liệu bill lịch sử.
   */
  function buildBill(spec) {
    if (!spec) return R.err('VALIDATION', 'buildBill cần spec');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'bill cần storeId hợp lệ');
    if (!ids.isId(spec.soldByActorId, 'actor')) {
      return R.err('VALIDATION',
        'bill BẮT BUỘC có soldByActorId — không biết ai bán là ngoại lệ duy nhất của hệ thống cũ (§4.7)');
    }
    if (!spec.businessDate) return R.err('VALIDATION', 'bill cần businessDate');
    if (typeof spec.occurredAt !== 'number') return R.err('VALIDATION', 'bill cần occurredAt');

    var chBad = validateChannel(spec.channel);
    if (chBad) return R.err('VALIDATION', chBad);

    var lines = spec.lines || [];
    if (lines.length === 0) return R.err('VALIDATION', 'bill phải có ít nhất 1 dòng');

    var normalized = [];
    var subtotal = 0;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (!ids.isId(l.menuItemId, 'item')) return R.err('VALIDATION', 'dòng ' + i + ' thiếu menuItemId hợp lệ');
      if (typeof l.price !== 'number') return R.err('VALIDATION', 'dòng ' + i + ' thiếu giá đã snapshot');
      if (typeof l.qty !== 'number' || !(l.qty > 0)) return R.err('VALIDATION', 'dòng ' + i + ' qty phải dương');

      var amount = l.price * l.qty;
      subtotal += amount;
      normalized.push({
        billLineId: ids.deterministicId('billLine', [spec.billId || 'draft', String(i)]),
        menuItemId: l.menuItemId,
        name: l.name || null,
        size: l.size,
        qty: l.qty,
        /* Snapshot, không phải tham chiếu sống. */
        price: l.price,
        amount: amount,
        recipeId: l.recipeId || null,
        toppings: (l.toppings || []).slice()
      });
    }

    var discountTotal = spec.discountTotal || 0;
    var total = Math.max(0, subtotal - discountTotal);

    /* Phí sàn được TRỪ THẬT — đây là đường ống legacy chưa từng nối. */
    var channelFee = spec.channel.type === CHANNEL.APP
      ? total * (spec.channel.feePct / 100)
      : 0;

    return R.ok({
      billId: spec.billId || ids.newId('bill'),
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      occurredAt: spec.occurredAt,
      soldByActorId: spec.soldByActorId,
      customerId: spec.customerId || null,
      channel: {
        type: spec.channel.type,
        appName: spec.channel.appName || null,
        feePct: spec.channel.type === CHANNEL.APP ? spec.channel.feePct : 0
      },
      lines: normalized,
      subtotal: subtotal,
      discountTotal: discountTotal,
      promotionsApplied: (spec.promotionsApplied || []).slice(),
      total: total,
      channelFee: channelFee,
      /* Doanh thu thuần sau phí sàn — con số P&L thật sự cần. */
      netRevenue: total - channelFee,
      payments: (spec.payments || []).slice(),
      status: 'DRAFT'
    });
  }

  /**
   * Yêu cầu vật chất của cả bill: định mức + bao bì + túi.
   *
   * Mọi version dùng ở đây được GHI LẠI trên bill (V4), nên đọc lại lịch sử
   * không phải resolve lại — và không thể trôi theo cấu hình hiện tại.
   */
  function buildRequirements(bill, deps) {
    var registry = deps.versionRegistry;
    var reqs = [];
    var recipeVersionIds = [];
    var packagingVersionIds = [];

    for (var i = 0; i < bill.lines.length; i++) {
      var line = bill.lines[i];
      if (!line.recipeId) {
        return R.err('PRECONDITION',
          'món "' + (line.name || line.menuItemId) + '" chưa khai định mức — ' +
          'không được bán với giá vốn ngầm bằng 0');
      }

      var rv = recipeLib.resolveRecipeAt(registry, {
        recipeId: line.recipeId, storeId: bill.storeId, at: bill.occurredAt
      });
      if (R.isErr(rv)) return rv;

      var rr = recipeLib.toRequirements(rv.value, { size: line.size, qty: line.qty });
      if (R.isErr(rr)) return rr;
      recipeVersionIds.push(rr.value.recipeVersionId);
      reqs = reqs.concat(rr.value.requirements);

      var pv = packagingLib.resolvePackagingAt(registry, {
        menuItemId: line.menuItemId, storeId: bill.storeId, at: bill.occurredAt
      });
      if (R.isOk(pv)) {
        var pr = packagingLib.toRequirements(pv.value, line.qty);
        if (R.isErr(pr)) return pr;
        packagingVersionIds.push(pr.value.packagingVersionId);
        reqs = reqs.concat(pr.value.requirements);

        var cups = bill.lines.reduce(function (s, l) { return s + l.qty; }, 0);
        if (i === 0) {
          var bag = packagingLib.baggingRequirements(pv.value, cups);
          if (R.isOk(bag)) reqs = reqs.concat(bag.value.requirements);
        }
      }
    }

    /* Gộp cùng itemId để FIFO cấp phát 1 lần cho mỗi nguyên liệu. */
    var merged = Object.create(null);
    reqs.forEach(function (r) {
      merged[r.itemId] = (merged[r.itemId] || 0) + r.qty;
    });

    return R.ok({
      requirements: Object.keys(merged).map(function (itemId) {
        return { itemId: itemId, qty: merged[itemId] };
      }),
      detailedRequirements: reqs,
      recipeVersionIds: recipeVersionIds.filter(function (v, i, a) { return a.indexOf(v) === i; }),
      packagingVersionIds: packagingVersionIds.filter(function (v, i, a) { return a.indexOf(v) === i; })
    });
  }

  /** RecordSale — ghi bán hàng, trừ kho qua FIFO, tính CẢ HAI vế COGS. */
  var RecordSale = pipeline.defineCommand({
    name: 'RecordSale',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    /* Id xác định theo billId: bấm thanh toán 2 lần không trừ kho 2 lần. */
    operationId: function (input) {
      return ids.deterministicId('operation', ['sale', input.bill.billId]);
    },

    validate: function (input) {
      if (!input || !input.bill) return R.err('VALIDATION', 'RecordSale cần bill');
      if (!ids.isId(input.bill.soldByActorId, 'actor')) {
        return R.err('VALIDATION', 'bill thiếu soldByActorId');
      }
      if (!input.deps || !input.deps.versionRegistry) {
        return R.err('VALIDATION', 'RecordSale cần versionRegistry');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var bill = input.bill;
      var deps = input.deps;
      var plan = pipeline.emptyPlan();

      /* Actor trên bill phải là người đang thao tác — không nhận hộ người khác. */
      if (bill.soldByActorId !== ctx.actor.actorId) {
        return R.err('FORBIDDEN', 'soldByActorId khác actor đang thao tác');
      }

      var reqR = buildRequirements(bill, deps);
      if (R.isErr(reqR)) return reqR;
      var req = reqR.value;

      /* FIFO cấp phát — 1 WorkingSet cho cả bill, nên các món dùng chung
         nguyên liệu không đọc số dư cũ của nhau. */
      var ws = allocation.createWorkingSet(deps.units || []);
      var allocR = allocation.allocateMany(ws, req.requirements, {
        operationId: ids.deterministicId('operation', ['sale', bill.billId])
      });
      if (R.isErr(allocR)) return allocR;
      var alloc = allocR.value;

      if (alloc.shortfalls.length && !input.allowShortfall) {
        return R.err('PRECONDITION',
          'không đủ nguyên liệu cho ' + alloc.shortfalls.length + ' thành phần — ' +
          'bán tiếp sẽ làm kho âm mà không ai chặn (đúng lỗi legacy)',
          { shortfalls: alloc.shortfalls });
      }

      /* HAI vế COGS — thứ legacy chưa từng có. */
      var cogsR = cogsLib.computeCogs({
        registry: deps.versionRegistry,
        storeId: bill.storeId,
        at: bill.occurredAt,
        requirements: req.requirements,
        allocationPlans: alloc.plans
      });
      if (R.isErr(cogsR)) return cogsR;

      var finalized = Object.assign({}, bill, {
        status: 'COMPLETED',
        recipeVersionIds: req.recipeVersionIds,
        packagingVersionIds: req.packagingVersionIds,
        cogs: cogsR.value
      });

      plan.domainRecords.push({ type: 'bill', record: finalized });
      plan.unitChanges = ws.all().filter(function (u) {
        var before = (deps.units || []).filter(function (o) { return o.unitId === u.unitId; })[0];
        return before && before.remainingQty !== u.remainingQty;
      });

      alloc.plans.forEach(function (p) {
        p.allocations.forEach(function (a) {
          plan.ledgerEntries.push({
            domain: 'raw',
            type: 'CONSUMPTION',
            itemId: a.itemId,
            storeId: bill.storeId,
            unitId: a.unitId,
            qtyDelta: -a.qty,
            unitCost: a.unitCost,
            costBasisVersionId: a.costBasisVersionId,
            businessDate: bill.businessDate,
            actorId: bill.soldByActorId,
            occurredAt: bill.occurredAt,
            referenceType: 'bill',
            referenceId: bill.billId
          });
          /* Lineage đầy đủ: Bill → BillLine → RecipeVersion → Requirement →
             UnitAllocation → UnitBase trước/sau. */
          plan.traceChanges.push({
            billId: bill.billId,
            unitId: a.unitId,
            itemId: a.itemId,
            qty: a.qty,
            unitBaseBefore: a.unitBaseBefore,
            unitBaseAfter: a.unitBaseAfter,
            recipeVersionIds: req.recipeVersionIds,
            costBasisVersionId: a.costBasisVersionId
          });
        });
      });

      plan.projectionRecomputes = req.requirements.map(function (r) {
        return { itemId: r.itemId, storeId: bill.storeId };
      });

      /* Loyalty là handler đăng ký riêng, không nhét vào lệnh bán. */
      if (bill.customerId) {
        plan.events.push({
          type: 'SaleCompleted',
          billId: bill.billId,
          customerId: bill.customerId,
          netRevenue: finalized.netRevenue,
          storeId: bill.storeId,
          businessDate: bill.businessDate
        });
      }

      return R.ok(plan);
    }
  });

  /**
   * RecordAddon — thêm món/topping sau khi bill đã lưu.
   *
   * Legacy cho thêm trong 10 phút (add-only, không sửa/xoá) và trừ kho theo
   * diff đúng — nhưng KHÔNG gọi loyalty, nên khách trả thêm tiền mà không được
   * cộng thêm điểm (§1 chain-trace, §4.16). Ở đây event được phát cho ĐÚNG
   * phần chênh lệch.
   */
  var RecordAddon = pipeline.defineCommand({
    name: 'RecordAddon',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['addon', input.billId, input.addonSeq]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.billId, 'bill')) return R.err('VALIDATION', 'RecordAddon cần billId');
      if (input.addonSeq === undefined || input.addonSeq === null) {
        return R.err('VALIDATION', 'RecordAddon cần addonSeq để id xác định — thiếu nó là bug #23');
      }
      if (typeof input.addedAmount !== 'number' || input.addedAmount <= 0) {
        return R.err('VALIDATION', 'addon phải có số tiền tăng thêm dương');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({
        type: 'billAddon',
        record: {
          billId: input.billId,
          addonSeq: input.addonSeq,
          addedAmount: input.addedAmount,
          addedByActorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now()
        }
      });

      if (input.customerId) {
        /* Đúng phần CHÊNH LỆCH, không phải tổng bill. */
        plan.events.push({
          type: 'SaleAmountIncreased',
          billId: input.billId,
          customerId: input.customerId,
          addedAmount: input.addedAmount,
          storeId: ctx.storeId,
          businessDate: ctx.businessDate
        });
      }
      return R.ok(plan);
    }
  });

  return {
    CHANNEL: CHANNEL,
    buildBill: buildBill,
    buildRequirements: buildRequirements,
    RecordSale: RecordSale,
    RecordAddon: RecordAddon
  };
});

/* ===== src/layers/commands/shift.js ===== */
/**
 * Ca / Két tiền — đối soát tiền mặt và giao ca.
 *
 * Nguồn: LEGACY-SNAPSHOT-COMPACTION-AUDIT-V1.md §2.2, FEATURE-TREE-V1.md §2 mục [5].
 *
 * Đây thuộc nhóm "OPERATIONAL RECORD" của FIFO-COMPACTION-CONTRACT-V1.md §0:
 * nó LÀ sự kiện đã xảy ra, được ĐỌC THẲNG chứ không tính lại — khác hẳn cache
 * (tính lại được) và snapshot P&L (đóng băng có chủ đích). Ba khái niệm này
 * legacy đã tách rất có chủ đích và thiết kế mới không gộp lại.
 *
 * QUYẾT ĐỊNH CỦA LEGACY CẦN GIỮ NGUYÊN — sai số KHÔNG cộng dồn giữa các đoạn ca.
 * Khi giao ca giữa ngày, đoạn sau bắt đầu từ số tiền ĐẾM ĐƯỢC THẬT của đoạn
 * trước, không phải từ số tiền LẼ RA PHẢI CÓ. Nhờ vậy sai số của đoạn trước
 * không trôi sang làm bẩn sai số đoạn sau, và mỗi đoạn quy trách nhiệm được cho
 * đúng người trực đoạn đó. Legacy giải thích điều này ngay trong comment; đây
 * là thiết kế đúng, không phải chỗ cần "sửa cho gọn".
 */
GIEO.define('commands/shift', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline'
], function (ids, R, pipeline) {
  'use strict';

  var STATUS = { OPEN: 'OPEN', CLOSED: 'CLOSED' };

  function segmentId(storeId, businessDate, seq) {
    return ids.deterministicId('shift', ['seg', storeId, businessDate, String(seq)]);
  }

  /**
   * Mở một đoạn ca.
   * @param spec.startCash tiền mặt đầu đoạn — với đoạn > 1 đây phải là số ĐẾM
   *        ĐƯỢC của đoạn trước (xem closeSegment.actualEndCash), không phải số
   *        kỳ vọng.
   */
  function openSegment(spec) {
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'đoạn ca cần storeId hợp lệ');
    if (!spec.businessDate) return R.err('VALIDATION', 'đoạn ca cần businessDate');
    if (typeof spec.seq !== 'number' || spec.seq < 1) return R.err('VALIDATION', 'seq phải >= 1');
    if (typeof spec.startCash !== 'number' || spec.startCash < 0) {
      return R.err('VALIDATION', 'startCash phải là số không âm');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'đoạn ca cần actorId');

    return R.ok({
      segmentId: segmentId(spec.storeId, spec.businessDate, spec.seq),
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      seq: spec.seq,
      status: STATUS.OPEN,
      startCash: spec.startCash,
      openedAt: spec.at,
      openedBy: spec.actorId,
      /* Nguồn của startCash — để đọc lại biết đoạn này nối từ đâu. */
      startCashSource: spec.seq === 1 ? 'OPENING_FLOAT' : 'PREVIOUS_SEGMENT_ACTUAL',
      counts: [],
      cashSales: 0,
      cashOut: 0,
      expectedEndCash: null,
      actualEndCash: null,
      variance: null,
      closedAt: null,
      closedBy: null
    });
  }

  /** Ghi nhận tiền mặt phát sinh trong đoạn. */
  function recordCashMovement(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (typeof spec.amount !== 'number' || spec.amount <= 0) {
      return R.err('VALIDATION', 'số tiền phải dương — chiều đi vào/ra do "direction" quyết định');
    }
    if (spec.direction !== 'IN' && spec.direction !== 'OUT') {
      return R.err('VALIDATION', "direction phải là 'IN' hoặc 'OUT'");
    }
    var patch = spec.direction === 'IN'
      ? { cashSales: segment.cashSales + spec.amount }
      : { cashOut: segment.cashOut + spec.amount };
    return R.ok(Object.assign({}, segment, patch));
  }

  /**
   * Thêm 1 lần đếm. Legacy cho đếm nhiều lần trước khi chốt — giữ nguyên, và
   * giữ ĐỦ các lần đếm thay vì chỉ lần cuối, vì chênh lệch giữa các lần đếm
   * chính là thông tin cần cho người rà soát.
   */
  function addCount(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (typeof spec.countedCash !== 'number' || spec.countedCash < 0) {
      return R.err('VALIDATION', 'countedCash phải là số không âm');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'lần đếm cần actorId');

    return R.ok(Object.assign({}, segment, {
      counts: segment.counts.concat([{
        seq: segment.counts.length + 1,
        countedCash: spec.countedCash,
        at: spec.at,
        actorId: spec.actorId,
        note: spec.note || null
      }])
    }));
  }

  /**
   * Chốt đoạn ca.
   *
   *   expectedEndCash = startCash + cashSales - cashOut
   *   variance        = actualEndCash - expectedEndCash
   *
   * `actualEndCash` lấy từ lần đếm CUỐI CÙNG — không trung bình các lần đếm,
   * vì đếm lại là để sửa lần trước, không phải để lấy mẫu.
   */
  function closeSegment(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (segment.counts.length === 0) {
      return R.err('PRECONDITION', 'phải đếm tiền ít nhất 1 lần trước khi chốt đoạn ca');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'chốt đoạn ca cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'chốt đoạn ca cần operationId');

    var actual = segment.counts[segment.counts.length - 1].countedCash;
    var expected = segment.startCash + segment.cashSales - segment.cashOut;

    return R.ok(Object.assign({}, segment, {
      status: STATUS.CLOSED,
      expectedEndCash: expected,
      actualEndCash: actual,
      variance: actual - expected,
      closedAt: spec.at,
      closedBy: spec.actorId,
      operationId: spec.operationId
    }));
  }

  /**
   * Đoạn kế tiếp — ĐÂY LÀ CHỖ QUYẾT ĐỊNH THIẾT KẾ QUAN TRỌNG.
   *
   * Bắt đầu từ `actualEndCash` (đếm được thật), KHÔNG phải `expectedEndCash`.
   * Nếu bắt đầu từ số kỳ vọng thì sai số của đoạn trước sẽ xuất hiện lại trong
   * sai số đoạn sau, và người trực đoạn sau bị quy trách nhiệm cho tiền hụt mà
   * họ không gây ra.
   */
  function nextSegment(closedSegment, spec) {
    if (closedSegment.status !== STATUS.CLOSED) {
      return R.err('PRECONDITION', 'phải chốt đoạn hiện tại trước khi mở đoạn kế');
    }
    return openSegment({
      storeId: closedSegment.storeId,
      businessDate: closedSegment.businessDate,
      seq: closedSegment.seq + 1,
      startCash: closedSegment.actualEndCash,
      actorId: spec.actorId,
      at: spec.at
    });
  }

  /**
   * Tổng hợp cả ngày. Sai số ngày = TỔNG sai số từng đoạn, và luôn nói được
   * đoạn nào của ai lệch bao nhiêu.
   */
  function summarizeDay(segments) {
    var closed = segments.filter(function (s) { return s.status === STATUS.CLOSED; });
    return R.ok({
      segmentCount: segments.length,
      closedCount: closed.length,
      allClosed: closed.length === segments.length && segments.length > 0,
      totalCashSales: segments.reduce(function (s, x) { return s + x.cashSales; }, 0),
      totalCashOut: segments.reduce(function (s, x) { return s + x.cashOut; }, 0),
      totalVariance: closed.reduce(function (s, x) { return s + x.variance; }, 0),
      /* Quy trách nhiệm theo đoạn — thứ mà cộng dồn sai số sẽ làm mất. */
      varianceBySegment: closed.map(function (s) {
        return { seq: s.seq, closedBy: s.closedBy, variance: s.variance };
      })
    });
  }

  /**
   * Lý do CHẶN chốt ngày. FEATURE-TREE §2 mục [5] gọi đây là `blockingClose`.
   * Trả danh sách để `store-context/business-day.closeDay` từ chối kèm lý do
   * cụ thể, thay vì chỉ báo "không chốt được".
   */
  function closeDayBlockers(spec) {
    var blockers = [];
    var segments = spec.segments || [];

    if (segments.length === 0) blockers.push('chưa có đoạn ca nào trong ngày');
    segments.forEach(function (s) {
      if (s.status === STATUS.OPEN) blockers.push('đoạn ca #' + s.seq + ' chưa chốt');
    });
    (spec.openEmployeeShifts || []).forEach(function (sh) {
      blockers.push('ca của nhân viên ' + sh.employeeId + ' chưa check-out');
    });
    (spec.pendingChecklists || []).forEach(function (c) {
      if (c.blocking) blockers.push('checklist "' + c.name + '" chưa hoàn tất');
    });
    return blockers;
  }

  var CloseCashSegment = pipeline.defineCommand({
    name: 'CloseCashSegment',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS', 'QUANLY'],
    operationId: function (input) {
      return ids.deterministicId('operation', [
        'closeseg', input.segment.storeId, input.segment.businessDate, String(input.segment.seq)
      ]);
    },
    validate: function (input) {
      if (!input || !input.segment) return R.err('VALIDATION', 'cần segment');
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var r = closeSegment(input.segment, {
        actorId: ctx.actor.actorId,
        at: ctx.clock.now(),
        operationId: ids.deterministicId('operation', [
          'closeseg', input.segment.storeId, input.segment.businessDate, String(input.segment.seq)
        ])
      });
      if (R.isErr(r)) return r;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'cashSegment', record: r.value });
      if (r.value.variance !== 0) {
        /* Lệch két là việc cần người biết, không phải con số nằm im trong sổ. */
        plan.events.push({
          type: 'CashVarianceDetected',
          segmentId: r.value.segmentId,
          storeId: r.value.storeId,
          businessDate: r.value.businessDate,
          seq: r.value.seq,
          variance: r.value.variance,
          closedBy: r.value.closedBy
        });
      }
      return R.ok(plan);
    }
  });

  return {
    STATUS: STATUS,
    segmentId: segmentId,
    openSegment: openSegment,
    recordCashMovement: recordCashMovement,
    addCount: addCount,
    closeSegment: closeSegment,
    nextSegment: nextSegment,
    summarizeDay: summarizeDay,
    closeDayBlockers: closeDayBlockers,
    CloseCashSegment: CloseCashSegment
  };
});

/* ===== src/layers/reporting/export-payload.js ===== */
/**
 * Export báo cáo ĐÃ ĐỊNH DẠNG.
 *
 * Gap (GIEO-REBUILD-HANDOFF-V2.md §4.2, FIFO-CHAIN-TRACE-REPORTING-V1.md §6):
 * legacy không có export báo cáo nào, chỉ có dump JSON thô. Chain-trace nói rõ
 * đây là 2 việc KHÁC NHAU và không thay thế nhau được:
 *   - export báo cáo (CSV tối thiểu) — cho người đọc, cho kế toán
 *   - trích xuất dữ liệu thô — cho phân tích, vẫn giữ riêng
 *
 * Mọi payload mang `computedAt` (§8) để UI luôn hiển thị được độ mới, và mang
 * nhãn cơ sở giá / cờ đóng băng để người đọc biết con số này là gì.
 */
GIEO.define('reporting/export-payload', ['shared-kernel/result'], function (R) {
  'use strict';

  function esc(v) {
    if (v === null || v === undefined) return '';
    var s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  /**
   * CSV từ danh sách bản ghi + cột khai tường minh.
   * Khai cột thay vì suy từ khoá object: thứ tự cột phải ổn định giữa các lần
   * export, nếu không file tháng này và tháng sau không xếp cạnh nhau được.
   */
  function toCsv(spec) {
    var columns = spec.columns;
    if (!Array.isArray(columns) || columns.length === 0) {
      return R.err('VALIDATION', 'export CSV phải khai cột — thứ tự cột suy từ object sẽ đổi giữa các lần');
    }
    var rows = spec.rows || [];
    var out = [columns.map(function (c) { return esc(c.label); }).join(',')];

    rows.forEach(function (r) {
      out.push(columns.map(function (c) {
        var v = typeof c.value === 'function' ? c.value(r) : r[c.key];
        return esc(v);
      }).join(','));
    });

    return R.ok(out.join('\n'));
  }

  /**
   * Bọc 1 báo cáo để xuất ra.
   * `meta` của read-layer được mang theo nguyên vẹn, nên file xuất ra nói được
   * số này đến từ đâu và đã đóng băng chưa.
   */
  function buildExport(spec) {
    if (!spec.title) return R.err('VALIDATION', 'export cần tiêu đề');
    if (!spec.period) return R.err('VALIDATION', 'export cần kỳ báo cáo');

    var meta = spec.meta || {};
    var csv = toCsv({ columns: spec.columns, rows: spec.rows });
    if (R.isErr(csv)) return csv;

    return R.ok({
      title: spec.title,
      period: spec.period,
      storeId: spec.storeId,
      /* §8 — mọi payload mang computedAt, không tuỳ màn hình có hay không. */
      computedAt: meta.computedAt || spec.computedAt || null,
      frozen: !!meta.frozen,
      sources: meta.sources || [],
      /* Cơ sở giá đi kèm số, không nằm ở chú thích cuối trang. */
      valuationBasis: spec.valuationBasis || null,
      ambiguous: meta.ambiguous || [],
      csv: csv.value,
      rowCount: (spec.rows || []).length,
      /* Cảnh báo dán ngay trên file, để người cầm file biết nó chưa chốt. */
      notices: buildNotices(meta, spec)
    });
  }

  function buildNotices(meta, spec) {
    var n = [];
    if (!meta.frozen) n.push('Số liệu chưa đóng băng — có thể đổi nếu dữ liệu gốc thay đổi.');
    if (meta.ambiguous && meta.ambiguous.length) {
      n.push(meta.ambiguous.length + ' mục dữ liệu cũ không đủ nghĩa, cần rà thủ công.');
    }
    if (spec.mixedBasis) n.push('Tổng trộn 2 cơ sở giá — xem nhãn từng dòng.');
    if (spec.hasEstimatedExpenses) n.push('Còn chi phí ước tính chờ hoá đơn thật — lãi chưa phải số cuối.');
    return n;
  }

  /**
   * Trích xuất thô — GIỮ RIÊNG, không phải thay thế cho export báo cáo.
   * Chain-trace §6 nói rõ 2 việc này tách biệt.
   */
  function rawExtract(spec) {
    return R.ok({
      kind: 'RAW_EXTRACT',
      purpose: 'phân tích/AI — KHÔNG phải báo cáo cho người đọc',
      storeId: spec.storeId,
      period: spec.period,
      computedAt: spec.computedAt || null,
      data: spec.data || {}
    });
  }

  return { toCsv: toCsv, buildExport: buildExport, rawExtract: rawExtract };
});

/* ===== src/layers/reporting/inventory-valuation.js ===== */
/**
 * Định giá tồn kho — dùng `Unit.costBasis` THẬT, không phải giá scalar gần nhất.
 *
 * Gap (GIEO-REBUILD-HANDOFF-V2.md §4.2, FIFO-CHAIN-TRACE-REPORTING-V1.md §4):
 * legacy định giá tồn kho bằng giá gần nhất của mặt hàng, nên tồn gồm nhiều lô
 * giá khác nhau vẫn bị quy về một giá — sai lệch càng lớn khi giá nhập biến động.
 *
 * Điểm thứ hai của §4 cũng quan trọng không kém: khi hiển thị cùng lúc 2 chỉ số
 * dùng 2 CƠ SỞ GIÁ khác nhau (tồn kho hiện tại vs tiêu hao lịch sử), mỗi số
 * phải mang nhãn cơ sở giá của chính nó. Legacy chỉ có chú thích nhỏ, nên người
 * đọc dễ so hai số không cùng gốc. Ở đây `basis` là field của kết quả.
 */
GIEO.define('reporting/inventory-valuation', [
  'shared-kernel/result'
], function (R) {
  'use strict';

  var BASIS = {
    /* Cộng theo giá vốn thật của từng lô còn tồn. */
    FIFO_ACTUAL: 'FIFO_ACTUAL',
    /* Chỉ dùng cho phần tồn KHÔNG có Unit đại diện, vì không có lô để hỏi giá. */
    LATEST_COST: 'LATEST_COST'
  };

  /**
   * Giá trị tồn kho theo từng lô.
   *
   * Phần `untracked` (tồn không có Unit) được tách riêng và ghi rõ nó dùng cơ
   * sở giá khác — gộp vào tổng mà không nói là làm người đọc tưởng cả tổng đều
   * là giá lô thật.
   */
  function valuate(spec) {
    var units = spec.units || [];
    var trackedValue = 0;
    var trackedQty = 0;
    var lines = [];

    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      if (u.status !== 'SEALED' && u.status !== 'OPEN' && u.status !== 'CONSUMING') continue;
      var qty = u.status === 'SEALED' ? u.initialQty : u.remainingQty;
      if (qty <= 0) continue;
      if (!u.costBasis || typeof u.costBasis.unitCost !== 'number') {
        return R.err('PRECONDITION',
          'Unit ' + u.unitId + ' không có costBasis — không định giá được bằng giá lô thật',
          { unitId: u.unitId });
      }
      var value = qty * u.costBasis.unitCost;
      trackedValue += value;
      trackedQty += qty;
      lines.push({
        unitId: u.unitId, itemId: u.itemId, qty: qty,
        unitCost: u.costBasis.unitCost, value: value,
        costBasisVersionId: u.costBasis.versionId
      });
    }

    var untrackedQty = spec.untrackedBase || 0;
    var untrackedValue = null;
    if (untrackedQty > 0) {
      if (typeof spec.latestUnitCost !== 'number') {
        return R.err('NOT_FOUND',
          'có ' + untrackedQty + ' tồn không gắn lô nhưng không biết giá gần nhất để định giá phần đó');
      }
      untrackedValue = untrackedQty * spec.latestUnitCost;
    }

    return R.ok({
      tracked: { qty: trackedQty, value: trackedValue, basis: BASIS.FIFO_ACTUAL, lines: lines },
      untracked: untrackedQty > 0
        ? { qty: untrackedQty, value: untrackedValue, basis: BASIS.LATEST_COST, unitCost: spec.latestUnitCost }
        : null,
      totalQty: trackedQty + untrackedQty,
      totalValue: trackedValue + (untrackedValue || 0),
      /* Tổng trộn 2 cơ sở giá thì phải NÓI RA. */
      mixedBasis: untrackedQty > 0,
      computedAt: spec.computedAt || null
    });
  }

  /**
   * Nhãn cơ sở giá cho UI. §4 yêu cầu nhãn đi kèm từng số, không phải chú
   * thích nhỏ ở cuối màn.
   */
  function describeBasis(basis) {
    return basis === BASIS.FIFO_ACTUAL
      ? 'giá vốn thật của từng lô còn tồn'
      : 'giá nhập gần nhất (phần tồn không gắn lô)';
  }

  return { BASIS: BASIS, valuate: valuate, describeBasis: describeBasis };
});

/* ===== src/layers/reporting/variance-report.js ===== */
/**
 * Variance report — actual vs theoretical là CHỈ SỐ CHÍNH.
 *
 * FIFO-CHAIN-TRACE-SALES-COGS-PL-V1.md: "packages/reporting/variance-report
 * phải hiển thị variance giữa 2 con số này làm chỉ số chính".
 *
 * Nguyên lý "Actual ≠ Theoretical" là nguyên lý trung tâm của Master Plan §10
 * nhưng CHƯA TỪNG được lấp cho domain COGS — nguyên liệu thô có đối chiếu
 * SỐ LƯỢNG (`thDoiChieu`), còn TIỀN thì không có gì để đối chiếu, vì chưa từng
 * có vế actual. Báo cáo này là chỗ vế đó cuối cùng được dùng.
 */
GIEO.define('reporting/variance-report', ['shared-kernel/result'], function (R) {
  'use strict';

  var STATUS = { OK: 'OK', OVER: 'OVER', UNDER: 'UNDER', UNKNOWN: 'UNKNOWN' };

  /**
   * @param spec.cogs       kết quả read-layer.getCOGS (đã có 2 vế)
   * @param spec.revenue    để tính tỉ lệ giá vốn
   * @param spec.targetPct  ngưỡng cogsPct của kỳ (resolve theo NGÀY ở tầng trên)
   * @param spec.tolerancePct
   */
  function build(spec) {
    var c = spec.cogs;
    if (!c) return R.err('VALIDATION', 'variance-report cần kết quả COGS');
    var tol = typeof spec.tolerancePct === 'number' ? spec.tolerancePct : 5;

    var status;
    var message;
    if (c.cogsActual === null) {
      /* Không có vế actual thì KHÔNG có variance — nói thẳng, không lấy
         theoretical so với chính nó rồi báo "khớp". */
      status = STATUS.UNKNOWN;
      message = 'chưa đủ dữ liệu lô để tính giá vốn thật' +
        (c.missingActual && c.missingActual.length ? ' (' + c.missingActual.length + ' bill thiếu)' : '');
    } else if (Math.abs(c.variancePct) <= tol) {
      status = STATUS.OK;
      message = 'giá vốn thật khớp định mức trong ngưỡng ' + tol + '%';
    } else {
      status = c.variance > 0 ? STATUS.OVER : STATUS.UNDER;
      message = (c.variance > 0 ? 'tốn hơn' : 'ít hơn') + ' định mức ' +
        Math.abs(c.variancePct).toFixed(1) + '%';
    }

    var netRevenue = spec.revenue ? spec.revenue.netRevenue : null;
    function pct(v) {
      return (v === null || !netRevenue) ? null : (v / netRevenue) * 100;
    }

    var actualPct = pct(c.cogsActual);
    var overTarget = (typeof spec.targetPct === 'number' && actualPct !== null)
      ? actualPct > spec.targetPct
      : null;

    return R.ok({
      cogsTheoretical: c.cogsTheoretical,
      cogsActual: c.cogsActual,
      variance: c.variance,
      variancePct: c.variancePct,
      status: status,
      message: message,
      /* Hai nguyên nhân gốc mà legacy không phân biệt được vì chỉ có 1 số. */
      possibleCauses: status === STATUS.OVER || status === STATUS.UNDER
        ? ['định mức khai sai (dùng nhiều/ít hơn công thức)', 'giá lô nhập lệch giá đang khai']
        : [],
      cogsPctTheoretical: pct(c.cogsTheoretical),
      cogsPctActual: actualPct,
      targetPct: typeof spec.targetPct === 'number' ? spec.targetPct : null,
      overTarget: overTarget,
      missingActual: c.missingActual || []
    });
  }

  /**
   * Vượt ngưỡng thì sinh cảnh báo CHỦ ĐỘNG.
   *
   * Gap §6 chain-trace Sales: `cogsPct` legacy có so sánh thật nhưng chỉ hiện
   * khi người TỰ mở tab Sức khoẻ — không ghi vào alerts, không chặn gì. Ở đây
   * nó phát ra để alerts domain nhận.
   */
  function toAlerts(report, spec) {
    if (!report.overTarget) return [];
    return [{
      type: 'COGS_OVER_TARGET',
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      subjectKey: 'cogs.' + spec.businessDate,
      data: {
        cogsPct: report.cogsPctActual,
        target: report.targetPct,
        dateKey: spec.businessDate
      }
    }];
  }

  return { STATUS: STATUS, build: build, toAlerts: toAlerts };
});

/* ===== src/apps/pos/main.js ===== */
/**
 * POS entry — THIN CLIENT.
 *
 * Giai đoạn hiện tại: SCAFFOLD, READ-ONLY. Hệ thống cũ vẫn chạy production.
 * Màn này chưa nối Firebase, chưa có nghiệp vụ nào — nó chỉ chứng minh khung
 * layer + luật import-direction chạy thật, không phải thư mục rỗng.
 */
GIEO.define('app-pos/main', [
  'shared-kernel/ids',
  'shared-kernel/clock',
  'shared-kernel/result',
  'shared-kernel/operation-state'
], function (ids, clock, R, opState) {
  'use strict';

  function start() {
    var c = clock.createClock();
    var el = document.getElementById('app');

    /* Tự kiểm tra: nếu bất kỳ nền tảng nào sai thì hiện ra ngay, không im lặng. */
    var checks = [];
    function check(name, fn) {
      try {
        var detail = fn();
        checks.push({ name: name, ok: true, detail: detail });
      } catch (e) {
        checks.push({ name: name, ok: false, detail: e.message });
      }
    }

    check('Branded id tách loại', function () {
      var u = ids.newId('unit');
      if (ids.isId(u, 'bill')) throw new Error('unitId bị nhận nhầm là billId');
      return u;
    });
    check('operationId xác định (idempotency)', function () {
      var a = ids.deterministicId('operation', ['sale', 'bill-9', 'item-3']);
      var b = ids.deterministicId('operation', ['sale', 'bill-9', 'item-3']);
      if (a !== b) throw new Error('cùng input ra 2 id khác nhau');
      return a;
    });
    check('Lỗi không biến thành số 0', function () {
      var r = R.err('NOT_FOUND', 'chưa có dữ liệu');
      if (R.isOk(r) || r.value === 0) throw new Error('lỗi bị nuốt');
      return r.error.kind;
    });
    check('Operation COMPLETED là trạng thái cuối', function () {
      var r = opState.transition('COMPLETED', 'RUNNING');
      if (R.isOk(r)) throw new Error('cho phép chạy lại operation đã hoàn tất');
      return r.error.kind;
    });
    check('businessDate', function () { return c.calendarDate(); });

    var failed = checks.filter(function (x) { return !x.ok; });
    var mods = GIEO.inventory();

    el.innerHTML =
      '<h1 style="font-size:18px;margin:0 0 4px">GIEO POS</h1>' +
      '<p style="margin:0 0 16px;color:#666">Scaffold — READ-ONLY. Hệ thống cũ vẫn chạy production.</p>' +
      '<p style="padding:8px 12px;border-radius:6px;background:' +
        (failed.length ? '#fdecea' : '#e8f5e9') + '">' +
        (failed.length ? failed.length + ' kiểm tra nền tảng THẤT BẠI' : 'Nền tảng OK — ' + checks.length + '/' + checks.length) +
      '</p>' +
      '<ul style="padding-left:18px">' +
        checks.map(function (x) {
          return '<li>' + (x.ok ? '✓' : '✗') + ' ' + x.name +
            ' <code style="color:#666">' + String(x.detail) + '</code></li>';
        }).join('') +
      '</ul>' +
      '<h2 style="font-size:14px;margin-top:20px">Module đã nạp (' + mods.length + ')</h2>' +
      '<ul style="padding-left:18px;color:#555">' +
        mods.map(function (m) { return '<li><code>' + m.id + '</code></li>'; }).join('') +
      '</ul>';
  }

  return { start: start };
});

/* ===== khởi động ===== */
GIEO.require("app-pos/main").start();

</script>
