    if (typeof spec.amount !== 'number' || !(spec.amount > 0)) {
      return R.err('VALIDATION', 'debt.amount phải dương — nợ luôn ghi bằng số dương');
    }
    return R.ok(Object.assign({}, unit, {
      debt: {
        amount: spec.amount,
        incurredAt: spec.at,
        incurredByOperationId: spec.operationId,
        absorbedByUnitId: null,
        absorbedAt: null
      }
    }));
  }

  function absorbDebt(unit, spec) {
    if (!unit.debt) return R.err('PRECONDITION', 'Unit không có nợ để hấp thụ');
    if (unit.debt.absorbedByUnitId) return R.err('PRECONDITION', 'nợ đã được hấp thụ rồi');
    if (!ids.isId(spec.byUnitId, 'unit')) return R.err('VALIDATION', 'absorbDebt cần byUnitId hợp lệ');
    return R.ok(Object.assign({}, unit, {
      debt: Object.assign({}, unit.debt, {
        absorbedByUnitId: spec.byUnitId,
        absorbedAt: spec.at
      })
    }));
  }

  function markLost(unit, spec) {
    if (!canTransition(unit.status, STATUS.LOST)) {
      return R.err('PRECONDITION', 'không đánh dấu mất được Unit ở trạng thái ' + unit.status);
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'markLost cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'markLost cần operationId');
    return R.ok(Object.assign({}, unit, {
      status: STATUS.LOST,
      lostAt: spec.at,
      lostBy: spec.actorId,
      lostReportId: spec.lostReportId || null,
      /* Nhớ trạng thái trước khi mất để khôi phục đúng chỗ. */
      statusBeforeLost: unit.status,
      operationId: spec.operationId
    }));
  }

  /**
   * §8 — khôi phục container tìm lại được.
   * Giữ nguyên quyết định nghiệp vụ của legacy: unit "mới nguyên", KHÔNG suy
   * luận lại phần đã dùng trước khi mất. Nhưng gắn cờ cần rà, vì quãng thời
   * gian nó biến mất là quãng không ai biết chuyện gì đã xảy ra.
   */
  function restoreFound(unit, spec) {
    if (unit.status !== STATUS.LOST) return R.err('PRECONDITION', 'Unit không ở trạng thái LOST');
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'restoreFound cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'restoreFound cần operationId');

    var back = unit.statusBeforeLost || STATUS.SEALED;
    if (!canTransition(STATUS.LOST, back)) back = STATUS.SEALED;
    var review = addReview(unit, REVIEW.RESTORED_FROM_LOST);

    return R.ok(Object.assign({}, unit, {
      status: back,
      foundAt: spec.at,
      foundBy: spec.actorId,
      operationId: spec.operationId
    }, review));
  }

  /**
   * Trạng thái HIỂN THỊ, gộp cả phần suy diễn.
   * Dùng cho UI/alert; state máy vẫn là `unit.status`.
   */
  function effectiveState(unit) {
    if (unit.debt && !unit.debt.absorbedByUnitId) return 'DEBT';
    if ((unit.status === STATUS.OPEN || unit.status === STATUS.CONSUMING) && unit.remainingQty <= 0) {
      return 'SYSTEM_EXHAUSTED';
    }
    return unit.status;
  }

  /**
   * Điều kiện CẦN để compact (FIFO-COMPACTION-CONTRACT-V1.md §2.2).
   * Trả về danh sách lý do CHẶN thay vì true/false, để chỗ gọi nói được vì sao.
   */
  function compactBlockers(unit) {
    var blockers = [];
    if (unit.status !== STATUS.PHYSICALLY_FINISHED && unit.status !== STATUS.VOIDED) {
      blockers.push('chưa kết thúc vòng đời (đang ' + unit.status + ')');
    }
    if (unit.debt && !unit.debt.absorbedByUnitId) {
      blockers.push('còn nợ ' + unit.debt.amount + ' chưa được hấp thụ');
    }
    if (unit.needsReview) {
      blockers.push('còn cờ cần rà: ' + unit.needsReviewReasons.join(', '));
    }
    return blockers;
  }

  return {
    STATUS: STATUS,
    TRANSITIONS: TRANSITIONS,
    ITEM_KIND: ITEM_KIND,
    REVIEW: REVIEW,
    isStatus: isStatus,
    canTransition: canTransition,
    createUnit: createUnit,
    open: open,
    markConsuming: markConsuming,
    markSystemExhausted: markSystemExhausted,
    finish: finish,
    recordDebt: recordDebt,
    absorbDebt: absorbDebt,
    markLost: markLost,
    restoreFound: restoreFound,
    effectiveState: effectiveState,
    compactBlockers: compactBlockers
  };
});

/* ===== src/layers/traceability/trace.js ===== */
/**
 * Traceability graph — trace 2 chiều.
 *
 * Contract: GIEO-SYSTEM-REBUILD-PLAN.md §8 (Phase 4),
 * GIEO-NEW-CHAT-HANDOFF-FLAN-1.md §1.1 (bộ câu hỏi 1 Unit phải trả lời được).
 *
 * Forward:  supplier → receipt → unit → open → allocation → bill/BTP/waste/lost
 * Reverse:  bill/COGS/waste/lost/BTP → xuống tận Unit
 *
 * Đây là thứ biện minh cho câu "FIFO là traceability backbone, không phải một
 * feature của kho": nếu không trả lời được trọn bộ câu hỏi dưới đây thì Unit
 * chỉ là một con số tồn kho, không phải xương sống truy vết.
 */
GIEO.define('traceability/trace', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'fifo-core/unit'
], function (ids, R, unitLib) {
  /* eslint-disable no-unused-vars */
  'use strict';

  /**
   * Bộ câu hỏi bắt buộc. Khai thành dữ liệu để kiểm được là trace có trả lời
   * đủ hay không, thay vì tin là đủ.
   */
  var REQUIRED_ANSWERS = [
    'nhận từ đâu', 'supplier/receipt nào', 'số lượng ban đầu', 'cost basis nào',
    'mở lúc nào', 'ai mở', 'đã phân bổ cho những gì', 'dùng cho bill nào',
    'dùng cho BTP batch nào', 'recipe version nào', 'hệ thống báo hết lúc nào',
    'nhân viên báo hết lúc nào', 'waste/lost/adjustment/reversal nào liên quan'
  ];

  /** Forward trace cho 1 Unit. */
  function buildUnitTrace(spec) {
    var unit = spec.unit;
    if (!unit || !ids.isId(unit.unitId, 'unit')) {
      return R.err('VALIDATION', 'buildUnitTrace cần unit hợp lệ');
    }

    var entries = (spec.ledgerEntries || []).filter(function (e) { return e.unitId === unit.unitId; });
    var allocations = (spec.allocations || []).filter(function (a) { return a.unitId === unit.unitId; });

    var billIds = [];
    var prepBatchIds = [];
    var recipeVersionIds = [];
    allocations.forEach(function (a) {
      if (a.billId && billIds.indexOf(a.billId) === -1) billIds.push(a.billId);
      if (a.prepBatchId && prepBatchIds.indexOf(a.prepBatchId) === -1) prepBatchIds.push(a.prepBatchId);
      (a.recipeVersionIds || []).forEach(function (v) {
        if (recipeVersionIds.indexOf(v) === -1) recipeVersionIds.push(v);
      });
    });

    function byType(t) { return entries.filter(function (e) { return e.type === t; }); }

    return R.ok({
      unitId: unit.unitId,
      itemId: unit.itemId,
      storeId: unit.storeId,
      itemKind: unit.itemKind,

      origin: {
        receiptId: unit.receiptId,
        supplierId: unit.supplierId,
        receivedAt: unit.receivedAt,
        receivedBy: unit.receivedBy
      },
      initialQty: unit.initialQty,
      costBasis: unit.costBasis,

      opened: { at: unit.openedAt, by: unit.openedBy },

      /* Từng lần bị trừ, đủ chi tiết để cộng lại ra số dư hiện tại. */
      allocations: allocations.map(function (a) {
        return {
          operationId: a.operationId, qty: a.qty,
          unitBaseBefore: a.unitBaseBefore, unitBaseAfter: a.unitBaseAfter,
          unitCost: a.unitCost, cost: a.cost,
          billId: a.billId || null, prepBatchId: a.prepBatchId || null
        };
      }),
      billIds: billIds,
      prepBatchIds: prepBatchIds,
      recipeVersionIds: recipeVersionIds,

      /* Hai mốc ĐỘC LẬP, không suy ra nhau (FIFO-CORE §2). Legacy chỉ suy diễn
         tạm thời mốc thứ nhất nên không trả lời được nó trong lịch sử. */
      systemExhaustedAt: unit.systemExhaustedAt,
      physicallyFinished: {
        at: unit.finishedAt, by: unit.finishedBy,
        reason: unit.finishReason, wasteQty: unit.wasteQty
      },

      debt: unit.debt,
      lost: unit.lostAt ? { at: unit.lostAt, by: unit.lostBy, reportId: unit.lostReportId } : null,
      found: unit.foundAt ? { at: unit.foundAt, by: unit.foundBy } : null,

      waste: byType('WASTE'),
      adjustments: byType('ADJUSTMENT'),
      reversals: byType('REVERSAL'),
      physicalReconciliations: unit.physicalReconciliations,

      needsReview: unit.needsReview,
      needsReviewReasons: unit.needsReviewReasons,
      currentState: unitLib.effectiveState(unit)
    });
  }

  /**
   * Kiểm trace có trả lời đủ bộ câu hỏi không.
   * Trả danh sách câu CHƯA trả lời được, thay vì true/false — để nói được
   * thiếu cái gì.
   */
  function unanswered(trace) {
    var missing = [];
    if (!trace.origin.receiptId && !trace.origin.supplierId) missing.push('nhận từ đâu');
    if (!trace.origin.supplierId) missing.push('supplier/receipt nào');
    if (typeof trace.initialQty !== 'number') missing.push('số lượng ban đầu');
    if (!trace.costBasis || typeof trace.costBasis.unitCost !== 'number') missing.push('cost basis nào');
    if (!trace.opened.at) missing.push('mở lúc nào');
    if (!trace.opened.by) missing.push('ai mở');
    if (!trace.allocations) missing.push('đã phân bổ cho những gì');
    return missing;
  }

  /** Reverse trace: từ 1 bill xuống các Unit đã gánh nó. */
  function buildBillTrace(spec) {
    var billId = spec.billId;
    if (!ids.isId(billId, 'bill')) return R.err('VALIDATION', 'buildBillTrace cần billId hợp lệ');

    var allocations = (spec.allocations || []).filter(function (a) { return a.billId === billId; });
    var byUnit = Object.create(null);
    allocations.forEach(function (a) {
      if (!byUnit[a.unitId]) byUnit[a.unitId] = { unitId: a.unitId, itemId: a.itemId, qty: 0, cost: 0, allocations: [] };
      byUnit[a.unitId].qty += a.qty;
      byUnit[a.unitId].cost += a.cost;
      byUnit[a.unitId].allocations.push(a);
    });

    return R.ok({
      billId: billId,
      units: Object.keys(byUnit).map(function (k) { return byUnit[k]; }),
      totalActualCost: allocations.reduce(function (s, a) { return s + a.cost; }, 0),
      recipeVersionIds: (spec.bill && spec.bill.recipeVersionIds) || [],
      soldByActorId: (spec.bill && spec.bill.soldByActorId) || null
    });
  }

  /**
   * TRACE_DEPENDENCY registry (FIFO-COMPACTION-CONTRACT-V1.md §6).
   * Compact/purge đọc cái này để trả lời "còn ai cần raw không" — không suy
   * đoán, không "chắc là hết".
   */
  function createDependencyRegistry() {
    var deps = [];
    return {
      register: function (d) {
        deps.push({
          sourceType: d.sourceType, sourceId: d.sourceId,
          referencedBy: d.referencedBy || [], status: 'ACTIVE'
        });
        return R.ok(true);
      },
      resolveDep: function (sourceType, sourceId) {
        var found = false;
        deps = deps.map(function (d) {
          if (d.sourceType === sourceType && d.sourceId === sourceId) {
            found = true;
            return Object.assign({}, d, { status: 'RESOLVED' });
          }
          return d;
        });
        return found ? R.ok(true) : R.err('NOT_FOUND', 'không có dependency ' + sourceType + '/' + sourceId);
      },
      activeFor: function (sourceType, sourceId) {
        return deps.filter(function (d) {
          return d.sourceType === sourceType && d.sourceId === sourceId && d.status === 'ACTIVE';
        });
      },
      /** Chỉ được purge khi KHÔNG còn entry ACTIVE nào (invariant C6). */
      canPurge: function (sourceType, sourceId) {
        var active = deps.filter(function (d) {
          return d.sourceType === sourceType && d.sourceId === sourceId && d.status === 'ACTIVE';
        });
        return active.length === 0
          ? R.ok(true)
          : R.err('PRECONDITION', 'còn ' + active.length + ' tham chiếu đang hoạt động', { active: active });
      },
      all: function () { return deps.slice(); }
    };
  }

  return {
    REQUIRED_ANSWERS: REQUIRED_ANSWERS,
    buildUnitTrace: buildUnitTrace,
    unanswered: unanswered,
    buildBillTrace: buildBillTrace,
    createDependencyRegistry: createDependencyRegistry
  };
});

/* ===== src/layers/recipe-cost-btp/cogs.js ===== */
/**
 * COGS — HAI con số tách biệt + variance.
 *
 * ĐÂY LÀ GAP NGHIÊM TRỌNG NHẤT CỦA TOÀN BỘ AUDIT.
 * Nguồn: FIFO-CHAIN-TRACE-SALES-COGS-PL-V1.md §3, FIFO-CORE-ARCHITECTURE-V2.md §10b.1.
 *
 * Sự thật về hệ thống cũ: **"COGS actual" chưa từng tồn tại.** Unit/tem không
 * lưu giá vốn (`createContainersForReceipt` không có field cost nào; allocation
 * trả về cũng không có cost). Biến `cogsActual` trong `aggregateOrders()` THỰC
 * CHẤT là recipe-theoretical (định mức × giá lịch sử) bị đặt tên sai.
 *
 * Hệ quả của việc chỉ có MỘT con số: nếu công thức khai sai, hoặc nhà cung cấp
 * tăng giá đột xuất giữa 2 lần cập nhật giá, hệ thống KHÔNG CÓ CƠ CHẾ NÀO phát
 * hiện — vì không có gì để so sánh với nó.
 *
 * Ở đây:
 *   cogsTheoretical — định mức × CostBasis lịch sử tại thời điểm bán
 *   cogsActual      — tổng THẬT từ `Unit.costBasis` của các lô đã FIFO cấp phát
 *   variance        — chênh lệch, chỉ số chính của báo cáo
 *
 * Quy tắc cứng (UNIFIED-READ-LAYER-CONTRACT-V1.md §3, invariant R8): CẤM tồn
 * tại field tên `cogsActual` mà nội dung là theoretical. Chưa đủ dữ liệu Unit
 * thì trả `null` kèm lý do, KHÔNG fallback sang theoretical rồi gọi nó là actual.
 */
GIEO.define('recipe-cost-btp/cogs', [
  'shared-kernel/result',
  'recipe-cost-btp/cost'
], function (R, costLib) {
  'use strict';

  /**
   * Vế ACTUAL — cộng chi phí thật của từng lô đã bị trừ.
   *
   * `allocations` là kết quả của fifo-core/allocation, mỗi phần tử mang `cost`
   * tính từ `Unit.costBasis.unitCost` của chính lô đó. Đây là thứ legacy không
   * có, nên vế này không thể tồn tại ở hệ thống cũ.
   */
  function computeActualCost(spec) {
    var plans = spec.allocationPlans || [];
    if (plans.length === 0) {
      return R.ok({
        total: null,
        complete: false,
        reason: 'NO_ALLOCATION',
        lines: []
      });
    }

    var lines = [];
    var total = 0;
    var incomplete = [];

    for (var i = 0; i < plans.length; i++) {
      var p = plans[i];
      if (!p.costComplete) {
        /* Thiếu hàng → phần thiếu KHÔNG có lô nào gánh → không có giá thật.
           Ghi nhận thay vì lấy giá lý thuyết bù vào. */
        incomplete.push({ itemId: p.itemId, shortfallQty: p.shortfallQty });
      }
      for (var j = 0; j < p.allocations.length; j++) {
        var a = p.allocations[j];
        total += a.cost;
        lines.push({
          unitId: a.unitId,
          itemId: a.itemId,
          qty: a.qty,
          unitCost: a.unitCost,
          amount: a.cost,
          costBasisVersionId: a.costBasisVersionId
        });
      }
    }

    if (incomplete.length) {
      return R.ok({
        /* Có số nhưng KHÔNG đủ — nói rõ, không để caller tưởng đây là tổng đầy đủ.
           Phân biệt "không cấp phát được gì" với "cấp phát được một phần": hai
           tình huống này cần xử lý khác nhau ở tầng trên (chặn bán vs rà lại). */
        total: total,
        complete: false,
        reason: lines.length === 0 ? 'NO_ALLOCATION' : 'SHORTFALL',
        incomplete: incomplete,
        lines: lines
      });
    }

    return R.ok({ total: total, complete: true, reason: null, lines: lines });
  }

  /**
   * Cả hai vế + variance.
   *
   * @param spec.requirements     yêu cầu vật chất từ recipe + packaging
   * @param spec.allocationPlans  kết quả FIFO cấp phát thật
   * @param spec.registry         VersionedInput registry
   * @param spec.storeId, spec.at thời điểm SỰ KIỆN (không phải hiện tại)
   */
  function computeCogs(spec) {
    var theo = costLib.computeTheoreticalCost(spec.registry, {
      requirements: spec.requirements || [],
      storeId: spec.storeId,
      at: spec.at
    });
    if (R.isErr(theo)) return theo;

    var actualR = computeActualCost({ allocationPlans: spec.allocationPlans });
    if (R.isErr(actualR)) return actualR;
    var actual = actualR.value;

    var cogsActual = actual.complete ? actual.total : null;

    return R.ok({
      cogsTheoretical: theo.value.total,
      /* null khi chưa đủ dữ liệu — KHÔNG BAO GIỜ rơi về theoretical (R8). */
      cogsActual: cogsActual,
      cogsActualPartial: actual.complete ? null : actual.total,
      cogsActualReason: actual.reason,
      variance: cogsActual === null ? null : cogsActual - theo.value.total,
      variancePct: (cogsActual === null || theo.value.total === 0)
        ? null
        : ((cogsActual - theo.value.total) / theo.value.total) * 100,
      basis: {
        costBasisVersionIds: theo.value.lines
          .map(function (l) { return l.costBasisVersionId; })
          .filter(function (v, i, arr) { return v && arr.indexOf(v) === i; }),
        unitIds: actual.lines.map(function (l) { return l.unitId; })
      },
      theoreticalLines: theo.value.lines,
      actualLines: actual.lines
    });
  }

  /**
   * Diễn giải variance cho người đọc. Chênh lệch dương = tốn hơn định mức.
   *
   * Hai nguyên nhân gốc mà legacy không phân biệt được vì chỉ có 1 con số:
   *   - định mức khai sai (dùng nhiều/ít hơn công thức)
   *   - giá lô nhập lệch giá đang khai (NCC tăng giá đột xuất)
   */
  function explainVariance(cogs, tolerancePct) {
    var tol = typeof tolerancePct === 'number' ? tolerancePct : 5;
    if (cogs.cogsActual === null) {
      return {
        status: 'UNKNOWN',
        message: 'chưa đủ dữ liệu lô để tính giá vốn thật (' + cogs.cogsActualReason + ')'
      };
    }
    if (Math.abs(cogs.variancePct) <= tol) {
      return { status: 'OK', message: 'giá vốn thật khớp định mức trong ngưỡng ' + tol + '%' };
    }
    return {
      status: cogs.variance > 0 ? 'OVER' : 'UNDER',
      message: (cogs.variance > 0 ? 'tốn hơn' : 'ít hơn') + ' định mức ' +
        Math.abs(cogs.variancePct).toFixed(1) + '% — kiểm tra định mức khai sai hoặc giá nhập lệch'
    };
  }

  return {
    computeActualCost: computeActualCost,
    computeCogs: computeCogs,
    explainVariance: explainVariance
  };
});

/* ===== src/layers/recipe-cost-btp/cost.js ===== */
/**
 * CostBasis — giá vốn nguyên liệu, VERSIONED theo thời điểm.
 *
 * Instance #2 của lớp lỗi versioning: legacy `invalidateSalesCache()` xoá sạch
 * cache mỗi khi đổi giá, rồi tính lại COGS lịch sử bằng giá HIỆN TẠI.
 *
 * Phần ĐÚNG duy nhất của legacy cần giữ: `price_history_gieogieo` là append-only
 * — đúng mô hình versioning. Ở đây chỉ mở rộng nó ra toàn hệ thống qua
 * `VersionedInput` dùng chung, thay vì để nó là ngoại lệ đơn độc.
 *
 * Hai vai trò KHÁC NHAU của giá vốn, cố ý không trộn:
 *   - CostBasis (ở đây)      — giá THEO MẶT HÀNG theo thời điểm. Dùng cho
 *                              COGS THEORETICAL, và làm giá ghi lên Unit lúc nhận.
 *   - Unit.costBasis (fifo-core) — giá THEO TỪNG LÔ đã nhập. Dùng cho COGS ACTUAL.
 * Legacy chỉ có cái thứ nhất, và đặt tên biến `cogsActual` cho nó — đó là gốc
 * của gap nghiêm trọng nhất toàn bộ audit.
 */
GIEO.define('recipe-cost-btp/cost', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input'
], function (ids, R, VI) {
  'use strict';

  function publishCostBasis(registry, spec) {
    if (!spec) return R.err('VALIDATION', 'publishCostBasis cần spec');
    if (!ids.isId(spec.itemId, 'item')) return R.err('VALIDATION', 'cần itemId hợp lệ');
    if (typeof spec.unitCost !== 'number' || spec.unitCost < 0) {
      return R.err('VALIDATION', 'unitCost phải là số không âm');
    }

    return registry.publish({
      kind: VI.KINDS.cost,
      subjectId: spec.itemId,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: {
        unitCost: spec.unitCost,
        currency: spec.currency || 'VND',
        source: spec.source || 'MANUAL'
      }
    });
  }

  /** CẤM dùng giá hiện tại để tính lại lịch sử (invariant #14). */
  function resolveCostAt(registry, spec) {
    return registry.resolveAt(VI.KINDS.cost, spec.itemId, spec.storeId, spec.at);
  }

  /**
   * Giá vốn để GẮN LÊN UNIT lúc nhận hàng.
   *
   * Ưu tiên giá thực trả trên phiếu nhập; chỉ rơi về CostBasis theo thời điểm
   * khi phiếu không ghi giá. Đây là lý do `cogsActual` tồn tại được: Unit mang
   * giá của chính lô đó, không phải giá trung bình theo mặt hàng.
   */
  function costBasisForNewUnit(registry, spec) {
    if (typeof spec.paidUnitCost === 'number') {
      return R.ok({
        unitCost: spec.paidUnitCost,
        currency: spec.currency || 'VND',
        versionId: null,
        source: 'RECEIVING'
      });
    }
    var r = resolveCostAt(registry, { itemId: spec.itemId, storeId: spec.storeId, at: spec.at });
    if (R.isErr(r)) {
      return R.err('PRECONDITION',
        'không có giá vốn cho nguyên liệu tại thời điểm nhận, và phiếu nhập cũng không ghi giá — ' +
        'Unit không có costBasis thì COGS actual không tính được', { itemId: spec.itemId });
    }
    return R.ok({
      unitCost: r.value.payload.unitCost,
      currency: r.value.payload.currency,
      versionId: r.value.versionId,
      source: 'COST_BASIS'
    });
  }

  /**
   * Giá vốn LÝ THUYẾT cho một tập yêu cầu vật chất, resolve theo đúng thời điểm
   * sự kiện. Đây là vế "theoretical" của cặp actual/theoretical.
   *
   * Thiếu giá cho bất kỳ thành phần nào thì TỪ CHỐI cả cụm — không im lặng coi
   * phần thiếu là 0, vì như vậy giá vốn sẽ nhỏ đi và lãi trông đẹp lên một cách
   * giả tạo.
   */
  function computeTheoreticalCost(registry, spec) {
    var reqs = spec.requirements || [];
    var lines = [];
    var total = 0;

    for (var i = 0; i < reqs.length; i++) {
      var req = reqs[i];
      var r = resolveCostAt(registry, { itemId: req.itemId, storeId: spec.storeId, at: spec.at });
      if (R.isErr(r)) {
        return R.err('NOT_FOUND',
          'thiếu giá vốn cho "' + req.itemId + '" tại thời điểm tính — ' +
          'không được coi phần thiếu bằng 0', { itemId: req.itemId });
      }
      var unitCost = r.value.payload.unitCost;
      var amount = unitCost * req.qty;
      total += amount;
      lines.push({
        itemId: req.itemId,
        qty: req.qty,
        unitCost: unitCost,
        amount: amount,
        costBasisVersionId: r.value.versionId,
        source: req.source || null
      });
    }

    return R.ok({ total: total, lines: lines });
  }

  return {
    publishCostBasis: publishCostBasis,
    resolveCostAt: resolveCostAt,
    costBasisForNewUnit: costBasisForNewUnit,
    computeTheoreticalCost: computeTheoreticalCost
  };
});

/* ===== src/layers/recipe-cost-btp/recipe.js ===== */
/**
 * Recipe — định mức, VERSIONED theo thời điểm.
 *
 * Contract: FIFO-CORE-ARCHITECTURE-V2.md §10. Đây là vi phạm versioning RÕ NHẤT
 * của toàn bộ audit (instance #1 trong 7 instance của HANDOFF-V2 §3):
 * legacy `saveRecipe()` dùng `.set()` GHI ĐÈ, nên đổi công thức hôm nay làm
 * COGS của mọi bill trong quá khứ được tính lại theo công thức mới.
 *
 * Ở đây không có hàm nào ghi đè. Sửa công thức = publish version mới qua đúng
 * cơ chế `VersionedInput` dùng chung, đóng `effectiveTo` của bản cũ.
 *
 * Hệ quả quan trọng: cache doanh thu vẫn được phép xoá khi có version mới, NHƯNG
 * khi tính lại nó phải dùng RecipeVersion lịch sử của TỪNG NGÀY — nên kết quả
 * tính lại GIỐNG HỆT kết quả cũ. Khác hẳn legacy, nơi tính lại cho ra số khác.
 */
GIEO.define('recipe-cost-btp/recipe', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input'
], function (ids, R, VI) {
  'use strict';

  /* Thành phần định mức có thể trỏ tới nguyên liệu thô, bán thành phẩm, hoặc
     topping — giữ nguyên cấu trúc 3 loại của legacy. */
  var REF_TYPE = { item: 'item', prep: 'prep', topping: 'topping' };

  function validateComponents(rows) {
    if (!Array.isArray(rows)) return 'components phải là mảng';
    if (rows.length === 0) return 'định mức phải có ít nhất 1 thành phần';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!REF_TYPE[r.refType]) return 'component[' + i + '] refType không hợp lệ: ' + r.refType;
      if (!r.refId) return 'component[' + i + '] thiếu refId';
      if (typeof r.qty !== 'number' || !(r.qty > 0)) return 'component[' + i + '] qty phải dương';
    }
    return null;
  }

  /**
   * Công bố định mức mới. `components` khai theo size vì cùng 1 món size M và L
   * dùng lượng khác nhau — giữ đúng cấu trúc nghiệp vụ của legacy.
   */
  function publishRecipeVersion(registry, spec) {
    if (!spec) return R.err('VALIDATION', 'publishRecipeVersion cần spec');
    if (!ids.isId(spec.recipeId, 'recipe')) return R.err('VALIDATION', 'cần recipeId hợp lệ');
    if (!spec.components || typeof spec.components !== 'object') {
      return R.err('VALIDATION', 'cần components khai theo size');
    }
    var sizes = Object.keys(spec.components);
    if (sizes.length === 0) return R.err('VALIDATION', 'định mức cần ít nhất 1 size');
    for (var i = 0; i < sizes.length; i++) {
      var bad = validateComponents(spec.components[sizes[i]]);
      if (bad) return R.err('VALIDATION', 'size ' + sizes[i] + ': ' + bad);
    }

    var payload = { components: {} };
    sizes.forEach(function (sz) {
      payload.components[sz] = spec.components[sz].map(function (r) {
        return { refType: r.refType, refId: r.refId, qty: r.qty };
      });
    });

    return registry.publish({
      kind: VI.KINDS.recipe,
      subjectId: spec.recipeId,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: payload
    });
  }

  /**
   * Định mức có hiệu lực TẠI THỜI ĐIỂM BÁN.
   * CẤM lấy bản mới nhất để tính lại bill cũ (invariant #13).
   */
  function resolveRecipeAt(registry, spec) {
    return registry.resolveAt(VI.KINDS.recipe, spec.recipeId, spec.storeId, spec.at);
  }

  /**
   * Định mức → yêu cầu vật chất để FIFO cấp phát.
   * Kết quả mang `recipeVersionId` (V4) để bill ghi lại được version đã dùng.
   */
  function toRequirements(recipeVersion, spec) {
    var size = spec.size;
    var qty = spec.qty;
    if (typeof qty !== 'number' || !(qty > 0)) return R.err('VALIDATION', 'qty phải dương');

    var rows = recipeVersion.payload.components[size];
    if (!rows) {
      return R.err('NOT_FOUND',
        'định mức version này không khai size ' + size + ' — không được suy ra từ size khác');
    }

    return R.ok({
      recipeVersionId: recipeVersion.versionId,
      size: size,
      requirements: rows.map(function (r) {
        return { refType: r.refType, itemId: r.refId, qty: r.qty * qty, source: 'recipe' };
      })
    });
  }

  /** Món chưa khai định mức là trạng thái NÓI RA ĐƯỢC, không phải im lặng trả 0. */
  function requireRecipe(menuItem) {
    if (!menuItem.recipeId) {
      return R.err('PRECONDITION',
        'món "' + menuItem.name + '" chưa khai định mức — không tính được giá vốn, ' +
        'và không được im lặng coi giá vốn bằng 0');
    }
    return R.ok(menuItem.recipeId);
  }

  return {
    REF_TYPE: REF_TYPE,
    publishRecipeVersion: publishRecipeVersion,
    resolveRecipeAt: resolveRecipeAt,
    toRequirements: toRequirements,
    requireRecipe: requireRecipe
  };
});

/* ===== src/layers/compaction/versioned-input.js ===== */
/**
 * VersionedInput — CƠ CHẾ VERSIONING DÙNG CHUNG.
 *
 * Contract: FIFO-COMPACTION-CONTRACT-V1.md §1 (quy tắc V1-V6).
 *
 * Vì sao dùng chung chứ không mỗi domain một kiểu: cùng 1 lớp lỗi đã xuất hiện
 * ĐỘC LẬP ở 7 domain không liên quan nhau về nghiệp vụ (GIEO-REBUILD-HANDOFF-V2.md §3)
 *   1 Recipe    — đổi công thức, COGS lịch sử tính lại theo công thức mới
 *   2 Cost      — invalidateSalesCache() xoá sạch cache khi đổi giá
 *   3 Packaging — cùng cơ chế trên
 *   4 BTP yield — sửa yield mẻ cũ, prepCostOn resolve yieldActualAvg hiện tại
 *   5 PayTerms  — snapshot lúc check-in bị ghi nhưng KHÔNG BAO GIỜ đọc lại
 *   6 KPI target— resolve tại NGÀY CUỐI kỳ rồi áp cho toàn kỳ
 *   7 Báo cáo kỳ— cả 2 cột so sánh đều tính sống, không đóng băng
 *
 * 7 lần cùng 1 lỗi = lỗ hổng kiến trúc, không phải 7 case cần 7 lần sửa riêng.
 * Sửa riêng lẻ thì domain thứ 8 lại mắc lại.
 */
GIEO.define('compaction/versioned-input', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'shared-kernel/clock'
], function (ids, R, clockLib) {
  'use strict';

  /* Đúng 7 loại ở §1. Thêm loại mới = thêm vào đây, không tự chế cơ chế riêng. */
  var KINDS = {
    recipe: 'recipe',
    cost: 'cost',
    packaging: 'packaging',
    prepYield: 'prepYield',
    payTerms: 'payTerms',
    kpiTarget: 'kpiTarget',
    config: 'config'
  };

  function isKind(k) { return Object.prototype.hasOwnProperty.call(KINDS, k); }

  /**
   * V1 — append-only. Version đã publish thì payload BẤT BIẾN.
   * Đóng băng bằng Object.freeze để lỗi "sửa version cũ" nổ ngay ở strict mode,
   * thay vì âm thầm làm trôi mọi số liệu lịch sử đã dùng version đó.
   */
  function freezeDeep(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) {
      Object.freeze(o);
      Object.keys(o).forEach(function (k) { freezeDeep(o[k]); });
    }
    return o;
  }

  function createRegistry(opts) {
    opts = (opts || {});
    var clock = opts.clock || clockLib.createClock();
    /* key = kind|subjectId|storeId  →  mảng version sắp theo effectiveFrom tăng dần */
    var byKey = Object.create(null);

    function keyOf(kind, subjectId, storeId) {
      return kind + '|' + subjectId + '|' + storeId;
    }

    function listVersions(kind, subjectId, storeId) {
      return (byKey[keyOf(kind, subjectId, storeId)] || []).slice();
    }

    /**
     * Publish 1 version mới. KHÔNG sửa version cũ — chỉ đóng `effectiveTo` của
     * bản đang mở tại thời điểm đó (V1).
     */
    function publish(spec) {
      if (!spec) return R.err('VALIDATION', 'publish cần spec');
      if (!isKind(spec.kind)) return R.err('VALIDATION', 'kind không hợp lệ: ' + spec.kind);
      if (!spec.subjectId) return R.err('VALIDATION', 'publish cần subjectId');
      if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'publish cần storeId hợp lệ');
      if (typeof spec.effectiveFrom !== 'number') {
        return R.err('VALIDATION', 'publish cần effectiveFrom (timestamp)');
      }
      if (spec.payload === undefined || spec.payload === null) {
        return R.err('VALIDATION', 'publish cần payload');
      }
      if (!ids.isId(spec.publishedBy, 'actor')) {
        return R.err('VALIDATION', 'publish cần publishedBy — mọi thay đổi số liệu phải có người chịu trách nhiệm');
      }

      var key = keyOf(spec.kind, spec.subjectId, spec.storeId);
      var list = byKey[key] || (byKey[key] = []);

      /* Không cho chèn version có hiệu lực TRƯỚC bản mới nhất: lịch sử phải
         tiến về phía trước. Muốn sửa quá khứ thì đi đường correction (§3),
         không phải nhét lén 1 version vào giữa. */
      var last = list[list.length - 1];
      if (last && spec.effectiveFrom <= last.effectiveFrom) {
        return R.err('PRECONDITION',
          'effectiveFrom (' + spec.effectiveFrom + ') phải sau version mới nhất (' + last.effectiveFrom + '). ' +
          'Sửa hiệu lực trong quá khứ phải đi qua correction, không phải publish.');
      }

      var version = {
        kind: spec.kind,
        subjectId: String(spec.subjectId),
        storeId: spec.storeId,
        versionId: spec.versionId || ids.newId('version'),
        effectiveFrom: spec.effectiveFrom,
        effectiveTo: null,
        payload: spec.payload,
        publishedAt: spec.publishedAt || clock.now(),
        publishedBy: spec.publishedBy,
        supersedesVersionId: last ? last.versionId : null
      };

      if (last) {
        /* effectiveTo của bản cũ được đặt LÚC NÀY, không phải sửa payload.
           Đây là ranh giới hiệu lực, không phải nội dung. */
        last.effectiveTo = spec.effectiveFrom;
      }
      freezeDeep(version.payload);
      list.push(version);
      return R.ok(version);
    }

    /**
     * V2 — resolve theo point-in-time. `at` là thời điểm SỰ KIỆN nghiệp vụ
     * (occurredAt của bill/mẻ/ca), KHÔNG phải Date.now().
     */
    function resolveAt(kind, subjectId, storeId, at) {
      if (typeof at !== 'number') {
        return R.err('VALIDATION', 'resolveAt cần "at" là timestamp của sự kiện, không được bỏ trống');
      }
      var list = byKey[keyOf(kind, subjectId, storeId)] || [];
      for (var i = list.length - 1; i >= 0; i--) {
        var v = list[i];
        if (v.effectiveFrom <= at && (v.effectiveTo === null || at < v.effectiveTo)) return R.ok(v);
      }
      return R.err('NOT_FOUND',
        'không có version ' + kind + ' nào có hiệu lực cho "' + subjectId + '" tại ' + new Date(at).toISOString());
    }

    /**
     * V3 — resolve TỪNG NGÀY trong khoảng.
     *
     * Đây là hàm chặn bug instance #6/#7: có sẵn đường đúng thì không còn lý do
     * để ai đó resolve 1 lần tại ngày cuối kỳ rồi áp cho cả kỳ.
     *
     * Nếu trong 1 ngày có nhiều hơn 1 version thì KHÔNG im lặng chọn bừa —
     * đánh dấu `multipleVersionsInDay` để caller biết độ phân giải ngày không
     * đủ diễn tả thay đổi đó.
     */
    function resolveDaily(kind, subjectId, storeId, fromTs, toTs) {
      if (typeof fromTs !== 'number' || typeof toTs !== 'number') {
        return R.err('VALIDATION', 'resolveDaily cần fromTs và toTs là timestamp');
      }
      if (toTs < fromTs) return R.err('VALIDATION', 'resolveDaily: toTs < fromTs');

      var list = byKey[keyOf(kind, subjectId, storeId)] || [];
      var out = {};
      var cur = fromTs;
      var lastKey = clock.calendarDate(toTs);

      for (var guard = 0; guard < 4000; guard++) {
        var dateKey = clock.calendarDate(cur);
        var r = resolveAt(kind, subjectId, storeId, cur);
        if (R.isErr(r)) return r;

        var dayEnd = cur + 24 * 3600 * 1000;
        var overlaps = list.filter(function (v) {
          return v.effectiveFrom < dayEnd && (v.effectiveTo === null || v.effectiveTo > cur);
        }).length;

        out[dateKey] = {
          dateKey: dateKey,
          version: r.value,
          multipleVersionsInDay: overlaps > 1
        };
        if (dateKey >= lastKey) return R.ok(out);
        cur = dayEnd;
      }
      return R.err('VALIDATION', 'resolveDaily: khoảng quá dài (>4000 ngày)');
    }

    /**
     * V4 — đọc lại lịch sử bằng versionId ĐÃ LƯU trên record, không resolve lại.
     * Mọi đường đọc số liệu lịch sử phải đi qua đây, không qua resolveAt.
     */
    function getByVersionId(versionId) {
      var keys = Object.keys(byKey);
      for (var i = 0; i < keys.length; i++) {
        var list = byKey[keys[i]];
        for (var j = 0; j < list.length; j++) {
          if (list[j].versionId === versionId) return R.ok(list[j]);
        }
      }
      return R.err('NOT_FOUND', 'không có version "' + versionId + '"');
    }

    /**
     * V5 — snapshot lúc ghi KHÔNG được là write-only.
     * Trả về phần đính kèm bắt buộc cho mọi record kết quả. Record nào thiếu
     * `versionId` là record không đọc lại được — chính là bug payTerms của legacy.
     */
    function snapshotRef(version) {
      return {
        versionId: version.versionId,
        kind: version.kind,
        subjectId: version.subjectId,
        effectiveFrom: version.effectiveFrom,
        payload: version.payload
      };
    }

    /** Nạp version đã có sẵn từ kho (khi khôi phục state), bỏ qua luật thứ tự publish. */
    function hydrate(versions) {
      for (var i = 0; i < versions.length; i++) {
        var v = versions[i];
        if (!isKind(v.kind)) return R.err('VALIDATION', 'hydrate: kind không hợp lệ ' + v.kind);
        var key = keyOf(v.kind, v.subjectId, v.storeId);
        (byKey[key] || (byKey[key] = [])).push(freezeDeep(v));
      }
      Object.keys(byKey).forEach(function (k) {
        byKey[k].sort(function (a, b) { return a.effectiveFrom - b.effectiveFrom; });
      });
      return R.ok(versions.length);
    }

    return {
      publish: publish,
      resolveAt: resolveAt,
      resolveDaily: resolveDaily,
      getByVersionId: getByVersionId,
      snapshotRef: snapshotRef,
      listVersions: listVersions,
      hydrate: hydrate
    };
  }

  return {
    KINDS: KINDS,
    isKind: isKind,
    createRegistry: createRegistry
  };
});

/* ===== src/layers/catalog/menu.js ===== */
/**
 * Menu + Category — domain [1] CATALOG.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-CATALOG-PROMOTION-V1.md.
 * Gap: FEATURE-TREE-V1.md §4.1-4.3, §4.13, §4.14.
 *
 * Bốn điểm khác legacy:
 *
 * 1. `recipeId` là CON TRỎ TƯỜNG MINH trên MenuItem.
 *    Legacy khớp key ngầm `'togo:' + menuItemId`, không có con trỏ nào để đổi.
 *    Hệ quả: xoá-rồi-tạo-lại món (cách duy nhất để đổi tên) sinh key Firebase
 *    MỚI → recipe cũ mồ côi vĩnh viễn, món mới báo "chưa có định mức" cho tới
 *    khi có người phát hiện. Có con trỏ thật thì đổi tên chỉ là sửa field
 *    `name`, và vấn đề mồ côi biến mất từ gốc thiết kế — không cần cơ chế dọn
 *    dẹp bù đắp.
 *
 * 2. Xoá là SOFT-DELETE. Legacy `.remove()` cứng, không cascade, nên tham chiếu
 *    itemId trong khuyến mãi/quà tặng trỏ vào hư không.
 *
 * 3. Category là ENTITY THẬT có thứ tự hiển thị lưu trữ. Legacy tính lại bằng
 *    `[...new Set(menu.map(m=>m.type))]` mỗi lần render nên thứ tự đổi giữa các
 *    lần tải.
 *
 * 4. Sold-out DẪN XUẤT từ FIFO, không phải cờ tay. Xem computeAvailability().
 *
 * Giữ nguyên 1 mẫu ĐÚNG của legacy: giá được snapshot vào giỏ ngay lúc thêm
 * món (§8 chain-trace) — mẫu đúng hiếm hoi của toàn bộ audit về "không join
 * sống vào dữ liệu hiện tại cho lịch sử". Xem snapshotPrice().
 *
 * QUANLY là nơi DUY NHẤT sửa menu (POS chỉ đọc) — đóng gap §4.1 "2 app cùng
 * ghi thẳng RTDB, race condition không lock/version". Enforce ở tầng command
 * qua sources:['QUANLY'], không phải ở đây.
 */
GIEO.define('catalog/menu', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  var SIZES = { M: 'M', L: 'L' };

  function createCategory(spec) {
    if (!spec || !spec.name) return R.err('VALIDATION', 'category cần name');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'category cần storeId hợp lệ');
    if (typeof spec.displayOrder !== 'number') {
      return R.err('VALIDATION', 'category cần displayOrder — thứ tự phải được LƯU, không suy ra lúc render');
    }
    return R.ok({
      categoryId: spec.categoryId || ids.newId('item'),
      storeId: spec.storeId,
      name: String(spec.name),
      displayOrder: spec.displayOrder,
      archived: false
    });
  }

  function sortCategories(categories) {
    return categories.slice().sort(function (a, b) {
      if (a.displayOrder !== b.displayOrder) return a.displayOrder - b.displayOrder;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });
  }

  function createMenuItem(spec) {
    if (!spec || !spec.name) return R.err('VALIDATION', 'món cần name');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'món cần storeId hợp lệ');
    if (!spec.prices || typeof spec.prices !== 'object') {
      return R.err('VALIDATION', 'món cần bảng giá theo size');
    }
    var sizes = Object.keys(spec.prices);
    if (sizes.length === 0) return R.err('VALIDATION', 'món cần ít nhất 1 size có giá');
    for (var i = 0; i < sizes.length; i++) {
      var p = spec.prices[sizes[i]];
      if (typeof p !== 'number' || p < 0) return R.err('VALIDATION', 'giá size ' + sizes[i] + ' không hợp lệ');
    }

    return R.ok({
      menuItemId: spec.menuItemId || ids.newId('item'),
      storeId: spec.storeId,
      name: String(spec.name),
      categoryId: spec.categoryId || null,
      prices: Object.assign({}, spec.prices),
      /* Con trỏ tường minh. null = chưa khai định mức, và đó là trạng thái
         NÓI RA ĐƯỢC, khác hẳn legacy chỉ im lặng không tìm thấy key. */
      recipeId: spec.recipeId || null,
      toppingIds: (spec.toppingIds || []).slice(),
      displayOrder: typeof spec.displayOrder === 'number' ? spec.displayOrder : 0,
      color: spec.color || null,
      archived: false,
      archivedAt: null
    });
  }

  /** Đổi tên chỉ là sửa field — KHÔNG xoá rồi tạo lại, nên recipe không mồ côi. */
  function rename(menuItem, newName) {
    if (!newName) return R.err('VALIDATION', 'tên mới không được rỗng');
    return R.ok(Object.assign({}, menuItem, { name: String(newName) }));
  }

  /** Trỏ món sang recipe khác — thao tác độc lập mà legacy không có. */
  function linkRecipe(menuItem, recipeId) {
    if (recipeId !== null && !ids.isId(recipeId, 'recipe')) {
      return R.err('VALIDATION', 'recipeId không hợp lệ');
    }
    return R.ok(Object.assign({}, menuItem, { recipeId: recipeId }));
  }

  /**
   * Ngưng bán. KHÔNG xoá cứng: mọi tham chiếu tới món (khuyến mãi, quà tặng,
   * điều kiện chiến dịch) vẫn resolve được thay vì trỏ vào hư không.
   */
  function archive(menuItem, at) {
    if (menuItem.archived) return R.err('PRECONDITION', 'món đã ngưng bán');
    return R.ok(Object.assign({}, menuItem, { archived: true, archivedAt: at || null }));
  }

  function restore(menuItem) {
    if (!menuItem.archived) return R.err('PRECONDITION', 'món đang bán');
    return R.ok(Object.assign({}, menuItem, { archived: false, archivedAt: null }));
  }

  /**
   * Giá đưa vào giỏ — SNAPSHOT, không phải tham chiếu sống.
   *
   * Đây là mẫu ĐÚNG của legacy cần giữ nguyên (§8 chain-trace): giá được sao
   * vào cart ngay lúc thêm món, rồi sao y vào bill. Báo cáo đọc thẳng giá đã
   * lưu, không join lại menu hiện tại — nên sửa giá menu không làm trôi số
   * liệu bill/báo cáo lịch sử.
   */
  function snapshotPrice(menuItem, size) {
    var price = menuItem.prices[size];
    if (typeof price !== 'number') {
      return R.err('NOT_FOUND', 'món "' + menuItem.name + '" không có giá cho size ' + size);
    }
    return R.ok({
      menuItemId: menuItem.menuItemId,
      name: menuItem.name,
      size: size,
      price: price,
      recipeId: menuItem.recipeId
    });
  }

  /**
   * SOLD-OUT DẪN XUẤT TỪ FIFO — đóng gap nghiêm trọng nhất của domain này.
   *
   * Legacy: KHÔNG có field/flag hết hàng nào. renderMenu() render MỌI món luôn
   * bấm được. Kho và Catalog hoàn toàn tách rời TRƯỚC khi bán — trừ kho chỉ
   * chạy SAU khi xác nhận bán, không có bước kiểm tra tồn trước. Nhân viên bán
   * được vô hạn 1 món dù nguyên liệu = 0; kho chỉ âm dần, không ai chặn.
   *
   * Ở đây khả dụng được TÍNH từ tồn kho thật, nên không có "cờ hết hàng" nào
   * để quên bật/tắt. Hàm thuần: catalog không được import fifo-core hay
   * read-layer, nên tồn kho được TRUYỀN VÀO; tầng command/read-layer lấy số.
   *
   * Món chưa khai định mức thì KHÔNG tự coi là còn hàng — trả `unknown` để UI
   * nói thật "chưa biết", thay vì đoán rồi bán âm kho.
   */
  function computeAvailability(spec) {
    var menuItem = spec.menuItem;
    if (menuItem.archived) {
      return { available: false, reason: 'ARCHIVED', blockingItems: [] };
    }
    if (!menuItem.recipeId) {
      return { available: false, reason: 'NO_RECIPE', unknown: true, blockingItems: [] };
    }

    var components = spec.recipeComponents;
    if (!Array.isArray(components) || components.length === 0) {
      return { available: false, reason: 'NO_RECIPE', unknown: true, blockingItems: [] };
    }

    var stock = spec.stockByItemId || {};
    var blocking = [];
    for (var i = 0; i < components.length; i++) {
      var c = components[i];
      var have = stock[c.itemId];
      if (have === undefined) {
        /* Thiếu số liệu tồn thì nói không biết, không mặc định là còn. */
        return { available: false, reason: 'STOCK_UNKNOWN', unknown: true, blockingItems: [c.itemId] };
      }
      if (have < c.qty) blocking.push({ itemId: c.itemId, need: c.qty, have: have });
    }

    return blocking.length
      ? { available: false, reason: 'OUT_OF_STOCK', blockingItems: blocking }
      : { available: true, reason: null, blockingItems: [] };
  }

  /** Menu để render: đã lọc ngưng bán, đã sắp thứ tự ổn định. */
  function buildMenuView(spec) {
    var cats = sortCategories((spec.categories || []).filter(function (c) { return !c.archived; }));
    var items = (spec.menuItems || []).filter(function (m) { return !m.archived; });

    return R.ok(cats.map(function (c) {
      return {
        category: c,
        items: items
          .filter(function (m) { return m.categoryId === c.categoryId; })
          .sort(function (a, b) {
            if (a.displayOrder !== b.displayOrder) return a.displayOrder - b.displayOrder;
            return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
          })
      };
    }));
  }

  return {
    SIZES: SIZES,
    createCategory: createCategory,
    sortCategories: sortCategories,
    createMenuItem: createMenuItem,
    rename: rename,
    linkRecipe: linkRecipe,
    archive: archive,
    restore: restore,
    snapshotPrice: snapshotPrice,
    computeAvailability: computeAvailability,
    buildMenuView: buildMenuView
  };
});

/* ===== src/layers/catalog/packaging.js ===== */
/**
 * Packaging — bao bì nhiều tầng, ẢNH HƯỞNG COGS nên BẮT BUỘC versioned.
 *
 * Gap: FEATURE-TREE-V1.md §4.8 — `invalidateSalesCache()` xoá sạch cache mỗi
 * khi sửa packaging preset/override/rules/bagging, rồi tính lại COGS LỊCH SỬ
 * bằng cấu hình HIỆN TẠI. Đây là instance #3 của lớp lỗi đã xác nhận 7 lần
 * (GIEO-REBUILD-HANDOFF-V2.md §3): mọi input ảnh hưởng số tiền lịch sử phải
 * versioned + resolve point-in-time.
 *
 * Nên packaging KHÔNG có cơ chế lưu riêng — nó đi qua đúng `VersionedInput`
 * dùng chung với Recipe/Cost/PayTerms/BTP-yield/KPI-target/Config. Sửa riêng lẻ
 * từng domain là cách domain thứ 8 lại mắc lại đúng lỗi này.
 *
 * Bốn tầng giữ nguyên khái niệm của legacy (preset → override → rules →
 * bagging): cấu trúc đó phản ánh nghiệp vụ thật của quán, chỉ cách lưu là sai.
 */
GIEO.define('catalog/packaging', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input'
], function (ids, R, VI) {
  'use strict';

  function validateSpec(p) {
    if (!p || typeof p !== 'object') return 'packaging payload phải là object';
    if (!Array.isArray(p.items)) return 'packaging cần mảng items';
    for (var i = 0; i < p.items.length; i++) {
      var it = p.items[i];
      if (!ids.isId(it.itemId, 'item')) return 'packaging item[' + i + '] thiếu itemId hợp lệ';
      if (typeof it.qty !== 'number' || it.qty < 0) return 'packaging item[' + i + '] qty không hợp lệ';
    }
    return null;
  }

  /**
   * Công bố cấu hình bao bì cho 1 món (hoặc mặc định toàn cửa hàng).
   * `subjectId` = menuItemId, hoặc '__default__' cho preset chung.
   */
  function publishPackaging(registry, spec) {
    if (!spec) return R.err('VALIDATION', 'publishPackaging cần spec');
    var subjectId = spec.menuItemId || '__default__';

    var bad = validateSpec(spec.packaging);
    if (bad) return R.err('VALIDATION', bad);

    return registry.publish({
      kind: VI.KINDS.packaging,
      subjectId: subjectId,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: {
        /* preset = bộ mặc định; override = đè cho món cụ thể;
           rules = điều kiện áp (vd chỉ mang đi); bagging = túi đựng theo số ly. */
        tier: spec.tier || 'preset',
        items: spec.packaging.items.map(function (it) {
          return { itemId: it.itemId, qty: it.qty, note: it.note || null };
        }),
        rules: spec.packaging.rules || null,
        bagging: spec.packaging.bagging || null
      }
    });
  }

  /**
   * Bao bì có hiệu lực TẠI THỜI ĐIỂM BÁN — không phải cấu hình hiện tại.
   * Món không có override riêng thì rơi về preset chung.
   */
  function resolvePackagingAt(registry, spec) {
    var own = registry.resolveAt(VI.KINDS.packaging, spec.menuItemId, spec.storeId, spec.at);
    if (R.isOk(own)) return own;
    var fallback = registry.resolveAt(VI.KINDS.packaging, '__default__', spec.storeId, spec.at);
    if (R.isOk(fallback)) return fallback;
    return R.err('NOT_FOUND',
      'không có cấu hình bao bì hiệu lực cho món "' + spec.menuItemId + '" tại thời điểm đó ' +
      '(cũng không có preset chung)');
  }

  /**
   * Nhu cầu bao bì thành yêu cầu vật chất để FIFO cấp phát.
   * Trả kèm `versionId` đã dùng (V4) — kết quả ghi vào bill phải mang nó, để
   * đọc lại lịch sử không phải resolve lại.
   */
  function toRequirements(packagingVersion, qty) {
    if (typeof qty !== 'number' || qty <= 0) return R.err('VALIDATION', 'qty phải dương');
    var p = packagingVersion.payload;
    return R.ok({
      packagingVersionId: packagingVersion.versionId,
      requirements: p.items.map(function (it) {
        return { itemId: it.itemId, qty: it.qty * qty, source: 'packaging' };
      })
    });
  }

  /** Túi đựng theo số ly — tách riêng vì nó tính theo ĐƠN, không theo từng món. */
  function baggingRequirements(packagingVersion, cupCount) {
    var b = packagingVersion.payload.bagging;
    if (!b || !b.itemId) return R.ok({ packagingVersionId: packagingVersion.versionId, requirements: [] });
    var per = b.cupsPerBag || 1;
    var bags = Math.ceil(cupCount / per);
    return R.ok({
      packagingVersionId: packagingVersion.versionId,
      requirements: bags > 0 ? [{ itemId: b.itemId, qty: bags, source: 'bagging' }] : []
    });
  }

  return {
    publishPackaging: publishPackaging,
    resolvePackagingAt: resolvePackagingAt,
    toRequirements: toRequirements,
    baggingRequirements: baggingRequirements
  };
});

/* ===== src/layers/catalog/promotion.js ===== */
/**
 * Khuyến mãi — 2 TẦNG TƯỜNG MINH + 1 bộ kiểm tra loại trừ DUY NHẤT.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-CATALOG-PROMOTION-V1.md §4/§5/§6/§7.
 *
 * Ba vấn đề của legacy đang đóng:
 *
 * 1. HAI TẦNG BỊ LẪN LỘN. Legacy có `togoSettings` TỰ CHẠY (trừ tiền thật) và
 *    `assistConfig.campaigns` CHỈ GỢI Ý (không bao giờ tự trừ tiền/thêm quà).
 *    Chủ quán cấu hình một "chiến dịch" tưởng nó tự chạy như 2 chương trình
 *    hằng ngày, thực ra chỉ là gợi ý cho nhân viên tự áp tay. Ở đây `tier` là
 *    field BẮT BUỘC, không có mặc định — người tạo phải nói rõ nó thuộc tầng
 *    nào.
 *
 * 2. ĐIỀU KIỆN BỊ HARD-CODE. Legacy `checkTogoBeforeCheckout()` chỉ biết đúng
 *    2 dạng (mua X tặng Y theo bội số; đạt ngưỡng số ly → giảm %); tham số cấu
 *    hình được nhưng LOGIC thì không, nên không tạo được dạng thứ 3. Ở đây
 *    điều kiện là dữ liệu, đánh giá bằng 1 rule engine tổng quát.
 *
 * 3. CHỒNG KHUYẾN MÃI NGẦM ĐỊNH. Legacy loại trừ nhau theo THỨ TỰ CODE (quà
 *    tặng luôn được check trước), và discount-code KHÔNG hề đối chiếu với
 *    togoSettings auto-discount — 2 biến độc lập. Hiện vô hại vì discount-code
 *    đang ẩn UI, nhưng là lỗ hổng thật nếu bật lại. Ở đây `priority` và
 *    `exclusivityGroup` là field tường minh, và MỌI loại khuyến mãi đi qua
 *    cùng một bộ kiểm tra.

  /* Tầng — bắt buộc khai, không mặc định. */
  var TIER = {
    /* Tự trừ tiền/thêm quà vào giỏ. */
    AUTO_EXECUTE: 'AUTO_EXECUTE',
    /* Chỉ gợi ý cho nhân viên, KHÔNG đụng vào giỏ. */
    ADVISORY: 'ADVISORY'
  };

  var CHANNEL = { TOGO: 'TOGO', DINE_IN: 'DINE_IN' };

  /* Điều kiện là DỮ LIỆU, không phải nhánh if trong code. */
  var CONDITION = {
    QTY_TOTAL: 'QTY_TOTAL',
    QTY_SIZE: 'QTY_SIZE',
    QTY_ITEM: 'QTY_ITEM',
    QTY_CATEGORY: 'QTY_CATEGORY',
    AMOUNT: 'AMOUNT',
    CHANNEL: 'CHANNEL',
    DAY_OF_WEEK: 'DAY_OF_WEEK',
    DATE_RANGE: 'DATE_RANGE'
  };

  /* 5 kiểu giảm giá của legacy được giữ nguyên thiết kế nghiệp vụ (§6/§7 —
     code còn sống đầy đủ, chỉ ô nhập bị ẩn). Bật/tắt là quyết định vận hành,
     không phải quyết định kiến trúc. */
  var EFFECT = {
    BUY_X_GET_Y: 'BUY_X_GET_Y',
    PERCENT_OFF: 'PERCENT_OFF',
    FREE_TOPPING: 'FREE_TOPPING',
    ITEM_FREE: 'ITEM_FREE',
    ITEM_UPSIZE: 'ITEM_UPSIZE',
    ITEM_DISCOUNT: 'ITEM_DISCOUNT',
    ORDER_DISCOUNT: 'ORDER_DISCOUNT'
  };

  function createPromotion(spec) {
    if (!spec || !spec.name) return R.err('VALIDATION', 'khuyến mãi cần name');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'khuyến mãi cần storeId hợp lệ');
    if (!TIER[spec.tier]) {
      return R.err('VALIDATION',
        'khuyến mãi phải khai rõ tier: AUTO_EXECUTE (tự trừ tiền) hay ADVISORY (chỉ gợi ý). ' +
        'Không có mặc định — lẫn 2 tầng này chính là điểm mơ hồ của hệ thống cũ.');
    }
    if (typeof spec.priority !== 'number') {
      return R.err('VALIDATION', 'khuyến mãi cần priority — thứ tự ưu tiên phải tường minh, không theo thứ tự code');
    }
    if (!spec.effect || !EFFECT[spec.effect.type]) {
      return R.err('VALIDATION', 'khuyến mãi cần effect.type hợp lệ');
    }
    var conditions = spec.conditions || [];
    for (var i = 0; i < conditions.length; i++) {
      if (!CONDITION[conditions[i].type]) {
        return R.err('VALIDATION', 'điều kiện không hợp lệ: ' + conditions[i].type);
      }
    }

    return R.ok({
      promotionId: spec.promotionId || ids.newId('item'),
      storeId: spec.storeId,
      name: String(spec.name),
      tier: spec.tier,
      priority: spec.priority,
      /* Cùng nhóm = loại trừ nhau. null = không loại trừ ai. */
      exclusivityGroup: spec.exclusivityGroup || null,
      conditions: conditions.slice(),
      effect: Object.assign({}, spec.effect),
      active: spec.active === undefined ? true : !!spec.active
    });
  }

  /** Tổng hợp giỏ hàng — tính 1 lần rồi dùng lại cho mọi điều kiện. */
  function summarize(cart) {
    var lines = cart.lines || [];
    var s = { totalQty: 0, subtotal: 0, bySize: {}, byItem: {}, byCategory: {} };
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      var q = l.qty || 0;
      s.totalQty += q;
      s.subtotal += q * (l.price || 0);
      s.bySize[l.size] = (s.bySize[l.size] || 0) + q;
      s.byItem[l.menuItemId] = (s.byItem[l.menuItemId] || 0) + q;
      if (l.categoryId) s.byCategory[l.categoryId] = (s.byCategory[l.categoryId] || 0) + q;
    }
    return s;
  }

  function evalCondition(cond, sum, ctx) {
    switch (cond.type) {
      case CONDITION.QTY_TOTAL: return sum.totalQty >= cond.minQty;
      case CONDITION.QTY_SIZE: return (sum.bySize[cond.size] || 0) >= cond.minQty;
      case CONDITION.QTY_ITEM: return (sum.byItem[cond.menuItemId] || 0) >= cond.minQty;
      case CONDITION.QTY_CATEGORY: return (sum.byCategory[cond.categoryId] || 0) >= cond.minQty;
      case CONDITION.AMOUNT: return sum.subtotal >= cond.minAmount;
      case CONDITION.CHANNEL: return ctx.channel === cond.channel;
      case CONDITION.DAY_OF_WEEK:
        return Array.isArray(cond.days) && cond.days.indexOf(ctx.dayOfWeek) !== -1;
      case CONDITION.DATE_RANGE:
        if (cond.from && ctx.dateKey < cond.from) return false;
        if (cond.to && ctx.dateKey > cond.to) return false;
        return true;
      default:
        /* Điều kiện lạ thì KHÔNG cho qua — fail-closed, không âm thầm bỏ qua. */
        return false;
    }
  }

  function matches(promotion, sum, ctx) {
    if (!promotion.active) return false;
    for (var i = 0; i < promotion.conditions.length; i++) {
      if (!evalCondition(promotion.conditions[i], sum, ctx)) return false;
    }
    return true;
  }

  /** Tính giá trị giảm của 1 effect. Trả cả phần mô tả để hiện cho nhân viên. */
  function computeEffect(promotion, sum, cart) {
    var e = promotion.effect;
    switch (e.type) {
      case EFFECT.BUY_X_GET_Y: {
        var sets = e.buyQty > 0 ? Math.floor(sum.totalQty / e.buyQty) : 0;
        var freeQty = sets * (e.freeQty || 1);
        return { discountAmount: 0, freeQty: freeQty, giftMenuItemId: e.giftMenuItemId || null };
      }
      case EFFECT.PERCENT_OFF:
      case EFFECT.ORDER_DISCOUNT: {
        var amt = sum.subtotal * ((e.pct || 0) / 100);
        if (typeof e.maxAmount === 'number') amt = Math.min(amt, e.maxAmount);
        return { discountAmount: amt, freeQty: 0 };
      }
      case EFFECT.ITEM_DISCOUNT: {
        var lines = (cart.lines || []).filter(function (l) { return l.menuItemId === e.menuItemId; });
        var base = lines.reduce(function (s, l) { return s + l.qty * l.price; }, 0);
        return { discountAmount: base * ((e.pct || 0) / 100), freeQty: 0 };
      }
      case EFFECT.ITEM_FREE: {
        var fl = (cart.lines || []).filter(function (l) { return l.menuItemId === e.menuItemId; });
        return { discountAmount: fl.length ? fl[0].price : 0, freeQty: 1 };
      }
      case EFFECT.ITEM_UPSIZE:
        return { discountAmount: e.upsizeValue || 0, freeQty: 0, upsize: true };
      case EFFECT.FREE_TOPPING:
        return { discountAmount: 0, freeQty: 0, freeToppingId: e.toppingId, freeToppingQty: e.qty || 1 };
      default:
        return { discountAmount: 0, freeQty: 0 };
    }
  }

  /**
   * BỘ KIỂM TRA LOẠI TRỪ DUY NHẤT — mọi loại khuyến mãi đi qua đây.
   *
   * Legacy để mỗi loại tự kiểm tra rời rạc: discount-code chặn chồng với chính
   * nó và với voucher khách hàng, nhưng KHÔNG đối chiếu với togoSettings
   * auto-discount. Ở đây chỉ có một chỗ quyết định, nên không thể có cặp nào
   * "quên đối chiếu nhau".
   *
   * `voucher`/`discountCode` của khách cũng phải truyền vào `extraPromotions`
   * dưới cùng hình dạng Promotion để chịu chung luật.
   */
  function evaluate(spec) {
    var cart = spec.cart || { lines: [] };
    var ctx = spec.context || {};
    var all = (spec.promotions || []).concat(spec.extraPromotions || []);
    var sum = summarize(cart);

    var eligible = all.filter(function (p) { return matches(p, sum, ctx); });

    /* Ưu tiên cao thắng. Bằng nhau thì theo promotionId để kết quả tất định —
       không phụ thuộc thứ tự mảng đầu vào như legacy phụ thuộc thứ tự code. */
    eligible.sort(function (a, b) {
      if (a.priority !== b.priority) return b.priority - a.priority;
      return a.promotionId < b.promotionId ? -1 : a.promotionId > b.promotionId ? 1 : 0;
    });

    var takenGroups = Object.create(null);
    var applied = [];
    var advisory = [];
    var suppressed = [];

    for (var i = 0; i < eligible.length; i++) {
      var p = eligible[i];
      var g = p.exclusivityGroup;

      if (g && takenGroups[g]) {
        suppressed.push({
          promotionId: p.promotionId,
          name: p.name,
          reason: 'loại trừ bởi "' + takenGroups[g].name + '" (cùng nhóm ' + g + ', ưu tiên cao hơn)'
        });
        continue;
      }

      var outcome = {
        promotionId: p.promotionId,
        name: p.name,
        tier: p.tier,
        priority: p.priority,
        exclusivityGroup: g,
        effect: computeEffect(p, sum, cart)
      };

      /* Tầng ADVISORY chiếm chỗ loại trừ nhưng KHÔNG đụng vào giỏ. */
      if (g) takenGroups[g] = p;
      if (p.tier === TIER.AUTO_EXECUTE) applied.push(outcome);
      else advisory.push(outcome);
    }

    return R.ok({
      /* Tự áp vào giỏ. */
      applied: applied,
      /* Chỉ hiện cho nhân viên tự quyết — KHÔNG trừ tiền. */
      advisory: advisory,
      /* Nói rõ cái nào bị loại và vì sao, thay vì im lặng bỏ qua. */
      suppressed: suppressed,
      totalDiscount: applied.reduce(function (s, a) { return s + (a.effect.discountAmount || 0); }, 0),
      summary: sum
    });
  }

  return {
    TIER: TIER,
    CHANNEL: CHANNEL,
    CONDITION: CONDITION,
    EFFECT: EFFECT,
    createPromotion: createPromotion,
    summarize: summarize,
    matches: matches,
    computeEffect: computeEffect,
    evaluate: evaluate
  };
});

/**
 * Tích điểm / tích tem / đổi thưởng — luật nghiệp vụ.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-LOYALTY-V1.md §2, §3, §4, §5, §6.
 *
 * GIỮ NGUYÊN những gì legacy làm đúng (chuỗi này là một trong những chỗ cẩn
 * thận nhất của hệ thống cũ):
 *   - điểm tính trên tổng SAU giảm giá, nên tự nhiên không double-dip (§6)
 *   - ly "mua X tặng Y" KHÔNG được tính tem (fix đã có trong legacy)
 *   - ly free đổi tem vẫn đi qua FIFO/COGS như món thường — quà tặng vẫn
 *     tiêu tốn kho thật (§3), nên KHÔNG có nhánh riêng ở đây
 *
 * SỬA những gì sai:
 *   - kết quả là DÒNG SỔ, không phải cộng thẳng vào field số dư
 *   - addon phải tích điểm cho phần chênh lệch (§4 — legacy bỏ sót hoàn toàn)
 *   - huỷ bill phát event để hoàn điểm; giữ/không hoàn là CỜ TƯỜNG MINH, không
 *     phải im lặng bỏ qua rồi bảo "Quản lý xử lý tay" trong khi chưa từng có
 *     màn hình để xử lý tay (§5)
 */
GIEO.define('loyalty/accrual', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'loyalty/ledger',
  'loyalty/customer'
], function (ids, R, ledger, customerLib) {
  'use strict';

  /* Luật của quán, giữ nguyên con số legacy. Đưa ra ngoài thành tham số để
     đổi luật không phải sửa code — nhưng mặc định khớp hành vi đang chạy. */
  var DEFAULT_RULES = {
    pointsPer100: 5,          // dine-in: 5 điểm / 100đ
    stampPerCup: 1,           // to-go: 1 tem / ly
    maxStampsPerDay: 2,       // tối đa 2 tem / khách / ngày
    stampsPerFreeDrink: 6     // 6 tem → 1 ly miễn phí
  };

  function rulesOf(spec) {
    return Object.assign({}, DEFAULT_RULES, spec && spec.rules ? spec.rules : {});
  }

  /**
   * Số ly được tính tem. Ly tặng (isFree) KHÔNG tính — giữ nguyên fix đã có
   * trong legacy cho bug "từng cho tem cả ly tặng".
   */
  function countableCups(bill) {
    return (bill.lines || []).reduce(function (s, l) {
      return s + (l.isFree ? 0 : l.qty);
    }, 0);
  }

  /**
   * Tích cho 1 bill đã thanh toán.
   *
   * @param spec.bill              bill đã hoàn tất (total đã SAU giảm giá)
   * @param spec.customer          khách đã định danh
   * @param spec.stampsEarnedToday số tem khách đã nhận trong ngày (cho trần/ngày)
   * @param spec.operationId
   */
  function accrueForSale(spec) {
    var bill = spec.bill;
    var customer = spec.customer;
    if (!customer) {
      /* Không có khách thì không tích — nhưng đây là QUYẾT ĐỊNH TƯỜNG MINH,
         không phải return 0 ngầm như legacy làm ở chỗ khác. */
      return R.ok({ entries: [], skipped: 'NO_CUSTOMER' });
    }
    if (!spec.operationId) return R.err('VALIDATION', 'accrueForSale cần operationId');

    var rules = rulesOf(spec);
    var mult = customerLib.accrualMultiplierOf(customer);
    var entries = [];

    function push(currency, delta, reason) {
      if (delta === 0) return null;
      var e = ledger.createEntry({
        customerId: customer.customerId,
        storeId: bill.storeId,
        currency: currency,
        delta: delta,
        reason: reason,
        referenceType: 'bill',
        referenceId: bill.billId,
        operationId: spec.operationId,
        businessDate: bill.businessDate,
        occurredAt: bill.occurredAt,
        actorId: bill.soldByActorId
      });
      if (R.isErr(e)) return e;
      entries.push(e.value);
      return null;
    }

    if (bill.channel && bill.channel.type === 'DINE_IN') {
      /* Trên total SAU giảm giá — nên không double-dip với khuyến mãi. */
      var pts = Math.floor((bill.total / 100) * rules.pointsPer100 * mult);
      var err = push(ledger.CURRENCY.POINTS, pts, ledger.REASON.EARN_SALE);
      if (err) return err;
    } else {
      var cups = countableCups(bill);
      var earned = cups * rules.stampPerCup * mult;
      /* Trần theo ngày — giữ nguyên luật legacy. */
      var room = Math.max(0, rules.maxStampsPerDay - (spec.stampsEarnedToday || 0));
      var stamps = Math.min(earned, room);
      var e2 = push(ledger.CURRENCY.STAMPS, stamps, ledger.REASON.EARN_SALE);
      if (e2) return e2;
    }

    return R.ok({ entries: entries, skipped: null });
  }

  /**
   * ĐÓNG GAP §4 — addon.
   *
   * Legacy `_submitAddonImpl` không có bất kỳ lời gọi tích điểm nào, nên khách
   * mua thêm mà không được cộng điểm cho phần tiền đó, dù cùng một khách đã
   * định danh từ đầu bill. Ở đây tích cho ĐÚNG phần chênh lệch.
   */
  function accrueForAddon(spec) {
    var customer = spec.customer;
    if (!customer) return R.ok({ entries: [], skipped: 'NO_CUSTOMER' });
    if (!spec.operationId) return R.err('VALIDATION', 'accrueForAddon cần operationId');
    if (typeof spec.addedAmount !== 'number' || spec.addedAmount <= 0) {
      return R.err('VALIDATION', 'addon phải có số tiền tăng thêm dương');
    }

    var rules = rulesOf(spec);
    var mult = customerLib.accrualMultiplierOf(customer);
    var pts = Math.floor((spec.addedAmount / 100) * rules.pointsPer100 * mult);
    if (pts === 0) return R.ok({ entries: [], skipped: 'BELOW_THRESHOLD' });

    var e = ledger.createEntry({
      customerId: customer.customerId,
      storeId: spec.storeId,
      currency: ledger.CURRENCY.POINTS,
      delta: pts,
      reason: ledger.REASON.EARN_ADDON,
      referenceType: 'billAddon',
      /* referenceId gồm cả seq nên 2 lần addon khác nhau là 2 dòng khác nhau,
         còn lặp cùng seq thì trùng entryId → không cộng đúp. */
      referenceId: spec.billId + '.' + spec.addonSeq,
      operationId: spec.operationId,
      businessDate: spec.businessDate,
      occurredAt: spec.occurredAt,
      actorId: spec.actorId
    });
    if (R.isErr(e)) return e;
    return R.ok({ entries: [e.value], skipped: null });
  }

  /** Đổi tem lấy ly miễn phí. Số dư kiểm từ SỔ, không từ field. */
  function redeemStamps(spec) {
    var rules = rulesOf(spec);
    var balance = ledger.computeBalance(spec.entries || [], spec.customerId);
    var need = rules.stampsPerFreeDrink;

    if (balance.STAMPS < need) {
      return R.err('PRECONDITION',
        'không đủ tem: có ' + balance.STAMPS + ', cần ' + need);
    }

    var spend = ledger.createEntry({
      customerId: spec.customerId, storeId: spec.storeId,
      currency: ledger.CURRENCY.STAMPS, delta: -need,
      reason: ledger.REASON.CONVERT_STAMPS,
      referenceType: 'bill', referenceId: spec.billId,
      operationId: spec.operationId, businessDate: spec.businessDate,
      occurredAt: spec.occurredAt, actorId: spec.actorId
    });
    if (R.isErr(spend)) return spend;

    var gain = ledger.createEntry({
      customerId: spec.customerId, storeId: spec.storeId,
      currency: ledger.CURRENCY.FREE_DRINKS, delta: 1,
      reason: ledger.REASON.CONVERT_STAMPS,
      referenceType: 'bill', referenceId: spec.billId,
      operationId: spec.operationId, businessDate: spec.businessDate,
      occurredAt: spec.occurredAt, actorId: spec.actorId
    });
    if (R.isErr(gain)) return gain;

    return R.ok({ entries: [spend.value, gain.value] });
  }

  /**
   * ĐÓNG GAP §5 — huỷ bill.
   *
   * Legacy: cả 2 app chỉ hoàn kho, KHÔNG hoàn điểm/tem. Gap này được ghi nhận
   * CÔNG KHAI (toast POS và cảnh báo QUANLY đều nói "Quản lý xử lý tay") —
   * nhưng QUANLY chưa bao giờ có màn hình nào để xử lý tay.
   *
   * Ở đây giữ/không hoàn là CỜ TƯỜNG MINH `policy`, và cả hai nhánh đều để lại
   * dấu vết: không hoàn thì trả lý do, không im lặng.
   */
  function reverseForVoidedBill(spec) {
    var policy = spec.policy || 'REVERSE';
    if (policy !== 'REVERSE' && policy !== 'KEEP') {
      return R.err('VALIDATION', "policy phải là 'REVERSE' hoặc 'KEEP'");
    }
    if (policy === 'KEEP') {
      return R.ok({
        entries: [],
        skipped: 'POLICY_KEEP',
        note: 'chủ quán chọn giữ điểm/tem khi huỷ bill — quyết định tường minh, không phải bỏ sót'
      });
    }

    var original = (spec.entries || []).filter(function (e) {
      return e.referenceId === spec.billId &&
        (e.reason === ledger.REASON.EARN_SALE || e.reason === ledger.REASON.EARN_ADDON);
    });
    if (original.length === 0) {
      return R.ok({ entries: [], skipped: 'NOTHING_TO_REVERSE' });
    }

    var out = [];
    for (var i = 0; i < original.length; i++) {
      var o = original[i];
      /* Bù trừ đúng dòng gốc — cùng nguyên tắc với reversal của FIFO:
         hoàn theo cái đã ghi, không tính lại theo luật hiện tại. */
      var e = ledger.createEntry({
        customerId: o.customerId, storeId: o.storeId,
        currency: o.currency, delta: -o.delta,
        reason: ledger.REASON.REVERSAL,
        referenceType: 'billVoid', referenceId: spec.billId + '.reversal.' + o.currency,
        operationId: spec.operationId, businessDate: spec.businessDate,
        occurredAt: spec.occurredAt, actorId: spec.actorId,
        note: 'hoàn do huỷ bill ' + spec.billId
      });
      if (R.isErr(e)) return e;
      out.push(e.value);
    }
    return R.ok({ entries: out, skipped: null });
  }

  return {
    DEFAULT_RULES: DEFAULT_RULES,
    countableCups: countableCups,
    accrueForSale: accrueForSale,
    accrueForAddon: accrueForAddon,
    redeemStamps: redeemStamps,
    reverseForVoidedBill: reverseForVoidedBill
  };
});

/**
 * Customer — định danh khách.
 *

 *

 * chỉ có nhãn phân khúc thuần đọc-báo-cáo, không nối vào công thức tích điểm).
 * `accrualMultiplier` mặc định 1 có mặt ngay từ đầu, nên sau này bật tier lên

    if (!phone) return R.err('VALIDATION', 'số điện thoại không hợp lệ: ' + spec.phone);

      /* Id xác định theo SĐT: nhập lại cùng số luôn ra cùng khách, không tạo trùng. */
      customerId: ids.deterministicId('customer', [phone]),
      storeId: spec.storeId,

         công thức tích điểm (§5 luồng chuẩn). */
      tier: spec.tier || 'STANDARD',
      accrualMultiplier: typeof spec.accrualMultiplier === 'number' ? spec.accrualMultiplier : 1,
      createdAt: spec.createdAt || null
    });
  }

  /** Hệ số tích điểm theo hạng. Mặc định 1 — không hạng nào thì không lợi gì. */

    if (!customer) return 1;
    var m = customer.accrualMultiplier;
    return typeof m === 'number' && m > 0 ? m : 1;
  }

  return {
    normalizePhone: normalizePhone,
    createCustomer: createCustomer,
    accrualMultiplierOf: accrualMultiplierOf

});

/* ===== src/layers/loyalty/ledger.js ===== */
/**
 * LoyaltyLedger — SỔ CÁI, không phải field cộng dồn.
 *
 * Đây là phát hiện quan trọng nhất của chuỗi Loyalty
 * (FIFO-CHAIN-TRACE-LOYALTY-V1.md §8, FEATURE-TREE-V1.md §4.15).
 *
 * Nghịch lý của legacy: tích điểm là một trong những chuỗi được làm CẨN THẬN
 * NHẤT toàn hệ thống — idempotent qua marker theo billId, Firestore transaction,
 * hàng đợi retry tự phục hồi — nhưng LƯU TRỮ SAI GỐC:
 * `total_points`/`stamp_count`/`free_drink_available` là field cộng dồn trực
 * tiếp trên `customers/{phone}`, và comment tự gọi đó là "single source of truth".
 *
 * Vì sao nặng hơn cả `untrackedPendingDelta` của FIFO: FIFO còn có
 * `stock_transactions_gieogieo` nên về nguyên tắc dựng lại `currentStock` được.
 * Loyalty thì KHÔNG — `loyalty_bill_effects_gieogieo` chỉ là marker chống trùng
 * theo billId, không phải sổ cái. Nếu số dư trôi (ghi lỗi, sửa tay Firestore,
 * race hiếm ngoài phạm vi marker), KHÔNG CÓ CÁCH NÀO tính lại đúng — chỉ có
 * thể sửa tay mà không kiểm chứng được.
 *
 * Ở đây số dư là KẾT QUẢ CỘNG SỔ, không phải thứ được ghi thẳng. Không có hàm
 * nào set số dư.
 */
GIEO.define('loyalty/ledger', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  var CURRENCY = { POINTS: 'POINTS', STAMPS: 'STAMPS', FREE_DRINKS: 'FREE_DRINKS' };

  var REASON = {
    EARN_SALE: 'EARN_SALE',
    EARN_ADDON: 'EARN_ADDON',
    REDEEM: 'REDEEM',
    CONVERT_STAMPS: 'CONVERT_STAMPS',
    REVERSAL: 'REVERSAL',
    MANUAL_ADJUSTMENT: 'MANUAL_ADJUSTMENT'
  };

  function isCurrency(c) { return Object.prototype.hasOwnProperty.call(CURRENCY, c); }
  function isReason(r) { return Object.prototype.hasOwnProperty.call(REASON, r); }

  /**
   * Một dòng sổ BẤT BIẾN.
   * `entryId` xác định theo (customer, currency, reason, referenceId) nên ghi
   * lại cùng một sự kiện không sinh dòng thứ hai.
   */
  function createEntry(spec) {
    if (!spec) return R.err('VALIDATION', 'ledger entry cần spec');
    if (!ids.isId(spec.customerId, 'customer')) return R.err('VALIDATION', 'cần customerId hợp lệ');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'cần storeId hợp lệ');
    if (!isCurrency(spec.currency)) return R.err('VALIDATION', 'currency không hợp lệ: ' + spec.currency);
    if (!isReason(spec.reason)) return R.err('VALIDATION', 'reason không hợp lệ: ' + spec.reason);
    if (typeof spec.delta !== 'number' || !isFinite(spec.delta) || spec.delta === 0) {
      return R.err('VALIDATION', 'delta phải là số khác 0');
    }
    if (!spec.operationId) return R.err('VALIDATION', 'ledger entry cần operationId');
    if (!spec.referenceId) {
      return R.err('VALIDATION', 'ledger entry cần referenceId (billId/lý do) — dòng sổ không nguồn gốc là dòng không kiểm chứng được');
    }
    if (!spec.businessDate) return R.err('VALIDATION', 'ledger entry cần businessDate');

    return R.ok({
      entryId: spec.entryId || ids.deterministicId('ledger', [
        'loyalty', spec.customerId, spec.currency, spec.reason, spec.referenceId
      ]),
      customerId: spec.customerId,
      storeId: spec.storeId,
      currency: spec.currency,
      delta: spec.delta,
      reason: spec.reason,
      referenceType: spec.referenceType || 'bill',
      referenceId: spec.referenceId,
      operationId: spec.operationId,
      businessDate: spec.businessDate,
      occurredAt: typeof spec.occurredAt === 'number' ? spec.occurredAt : null,
      actorId: spec.actorId || null,
      note: spec.note || null
    });
  }

  /**
   * Số dư = TỔNG SỔ. Không có hàm set số dư ở bất kỳ đâu, nên không tồn tại
   * đường làm số dư trôi khỏi lịch sử.
   */
  function computeBalance(entries, customerId) {
    var bal = { POINTS: 0, STAMPS: 0, FREE_DRINKS: 0 };
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      if (customerId && e.customerId !== customerId) continue;
      bal[e.currency] += e.delta;
    }
    return bal;
  }

  /**
   * Đối chiếu số dư đang hiển thị với số dư dựng lại từ sổ.
   *
   * Legacy không làm được phép này vì không có sổ. Đây là thứ biến "số dư trôi"
   * từ chuyện không phát hiện được thành chuyện phát hiện được.
   */
  function detectDrift(entries, customerId, storedBalance) {
    var rebuilt = computeBalance(entries, customerId);
    var drift = {};
    var clean = true;
    Object.keys(rebuilt).forEach(function (k) {
      var stored = (storedBalance && typeof storedBalance[k] === 'number') ? storedBalance[k] : rebuilt[k];
      if (stored !== rebuilt[k]) {
        clean = false;
        drift[k] = { stored: stored, rebuilt: rebuilt[k], difference: stored - rebuilt[k] };
      }
    });
    return R.ok({ customerId: customerId, rebuilt: rebuilt, clean: clean, drift: drift });
  }

  /**
   * Sửa tay số dư — vẫn phải đi qua sổ, có lý do và người chịu trách nhiệm.
   * Legacy không có màn hình nào để "xử lý tay" dù toast bảo Quản lý xử lý tay;
   * ở đây đường sửa tay tồn tại, nhưng nó là 1 dòng sổ chứ không phải ghi đè.
   */
  function adjust(spec) {
    if (!spec.reasonText) {
      return R.err('VALIDATION', 'sửa tay số dư phải có lý do — sửa không lý do là sửa không kiểm chứng được');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'sửa tay phải có actorId');
    return createEntry({
      customerId: spec.customerId,
      storeId: spec.storeId,
      currency: spec.currency,
      delta: spec.delta,
      reason: REASON.MANUAL_ADJUSTMENT,
      referenceType: 'manual',
      referenceId: spec.operationId,
      operationId: spec.operationId,
      businessDate: spec.businessDate,
      occurredAt: spec.occurredAt,
      actorId: spec.actorId,
      note: spec.reasonText
    });
  }

  return {
    CURRENCY: CURRENCY,
    REASON: REASON,
    createEntry: createEntry,
    computeBalance: computeBalance,
    detectDrift: detectDrift,
    adjust: adjust
  };
});

/* ===== src/layers/hr/employee.js ===== */
/**
 * Employee — domain [0] IDENTITY, gốc của cây tính năng.
 *
 * Cấp `actorId` cho MỌI mutation ở mọi nhánh bên dưới (FEATURE-TREE-V1.md §2).
 *
 * `employeeId` và `actorId` là HAI id khác nhau, cố ý (invariant #4):
 *   - employeeId = hồ sơ nhân sự (lương, ca, hợp đồng)
 *   - actorId    = danh tính thao tác, thứ được ghi vào mọi ledger/audit
 * Tách ra vì thao tác của một người không nên chết theo hồ sơ nhân sự: nhân
 * viên nghỉ việc thì hồ sơ đóng lại, nhưng mọi bill/ledger họ từng ký vẫn phải
 * trỏ về đúng actor đó vĩnh viễn. Gộp 2 id là tự chuốc bài toán "xoá nhân viên
 * làm mồ côi lịch sử".
