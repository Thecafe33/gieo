<script>
/* GIEO runtime registry */
/**
 * GIEO module registry — hệ thống module tối thiểu cho HTML tự chứa.
 *
 * Vì sao tồn tại: đã chốt stack HTML thuần, không build/bundler, nên không có
 * `dependency-cruiser` để enforce import-direction. Blueprint §2 quy tắc 5 nói
 * rõ vi phạm import-direction phải FAIL chứ không phải "review sau". Registry
 * này enforce đúng luật đó NGAY LÚC NẠP TRANG, bằng chính bộ luật ở
 * src/layer-rules.json — cùng 1 nguồn với checker offline tools/.
 *
 * Đây KHÔNG phải cấu trúc code legacy. Legacy là 50k dòng phẳng, mọi hàm gọi
 * thẳng mọi hàm, không có ranh giới nào. Ở đây mỗi module phải khai báo tường
 * minh nó thuộc layer nào và phụ thuộc gì, và khai báo sai thì trang không chạy.
 */
(function (global) {
  'use strict';

  /* Build script thay thế token dưới bằng nội dung src/layer-rules.json.
     Khi chạy trực tiếp trong Node (checker/test) thì nạp qua GIEO._loadRules(). */
  var LAYER_RULES = {
  "_doc": "Bộ luật import-direction, mã hoá GIEO-CODE-STRUCTURE-BLUEPRINT-V1.md §2 + bảng §4. Dùng chung cho runtime registry (src/runtime/registry.js) và checker offline (tools/check-import-direction.js). Vi phạm = FAIL, không phải 'review sau' (blueprint §2 quy tắc 5).",
  "_note_compaction_is_shared": "FIFO-COMPACTION-CONTRACT-V1.md §1 chốt rằng cơ chế versioning (VersionedInput) là DÙNG CHUNG cho 7 domain: Recipe/Cost/Packaging/BTP-yield/PayTerms/KPI-target/Config, và nó thuộc về compaction. Nên các domain đó (catalog, recipe-cost-btp, hr, finance) phụ thuộc compaction là hệ quả trực tiếp của contract, không phải rò rỉ kiến trúc. Chúng chỉ dùng phần VersionedInput; snapshot/purge vẫn là việc của compaction và tiến trình nền. Thay thế bằng cách tiêm từ ngoài sẽ làm mỗi domain tự cầm một registry khác nhau — đúng thứ contract cấm.",

  "_note_bootstrap": "Layer 'bootstrap' KHÔNG có trong blueprint gốc. Bổ sung tối thiểu bắt buộc: blueprint §2 quy tắc 1 cấm apps/* import persistence-firebase/legacy-firebase-adapter, nhưng port do domain core định nghĩa vẫn phải được nối với adapter ở đâu đó. 'bootstrap' là composition root duy nhất làm việc nối đó; apps chỉ import bootstrap. Không có nó thì hoặc apps phải vi phạm quy tắc 1, hoặc domain core phải import ngược adapter (vi phạm quy tắc 2).",

  "layers": {
    "shared-kernel": {
      "role": "Kiểu dữ liệu nền tảng: branded ids, Result/error taxonomy, operation state, MutationPlan, clock.",
      "canImport": []
    },
    "store-context": {
      "role": "Đang thao tác ở org/store nào, ai đang thao tác, quyền gì.",
      "canImport": ["shared-kernel"]
    },
    "fifo-core": {
      "role": "TRÁI TIM. Physical truth thay đổi thế nào. Pure domain, không biết Firebase.",
      "canImport": ["shared-kernel", "store-context"]
    },
    "traceability": {
      "role": "Trace 2 chiều: forward supplier->unit->bill, reverse unit->mọi allocation.",
      "canImport": ["shared-kernel", "store-context", "fifo-core"]
    },
    "recipe-cost-btp": {
      "role": "Recipe/cost/BTP tại thời điểm nào. KHÔNG được import fifo-core (blueprint §4: fifo-core chỉ cho commands/read-layer/traceability/compaction import).",
      "canImport": ["shared-kernel", "store-context", "compaction"]
    },
    "compaction": {
      "role": "VersionedInput dùng chung + snapshot + verifier + purge. Contract: FIFO-COMPACTION-CONTRACT-V1.md",
      "canImport": ["shared-kernel", "store-context", "fifo-core"]
    },
    "read-layer": {
      "role": "CỔNG ĐỌC DUY NHẤT. Nơi duy nhất được biết cả LIVE lẫn COMPACT. Contract: UNIFIED-READ-LAYER-CONTRACT-V1.md",
      "canImport": ["shared-kernel", "store-context", "fifo-core", "traceability", "recipe-cost-btp", "compaction", "legacy-firebase-adapter"]
    },
    "catalog": {
      "role": "Menu/Category/Topping/Packaging/Recipe link. QUANLY sở hữu duy nhất.",
      "canImport": ["shared-kernel", "store-context", "recipe-cost-btp", "compaction"]
    },
    "loyalty": {
      "role": "Customer, LoyaltyLedger, stamp-free, auto-promotion. KHÔNG voucher/rewards (đã cắt).",
      "canImport": ["shared-kernel", "store-context"]
    },
    "hr": {
      "role": "Employee, shift check-in/out, payroll. Cấp actorId cho mọi mutation.",
      "canImport": ["shared-kernel", "store-context", "compaction"]
    },
    "finance": {
      "role": "Expense, payment methods, config version.",
      "canImport": ["shared-kernel", "store-context", "compaction"]
    },
    "alerts": {
      "role": "16 loại cảnh báo, 1 schema/type. Sink 2 chiều, không domain nào phụ thuộc ngược vào nó.",
      "canImport": ["shared-kernel", "store-context"]
    },
    "protected-adapters": {
      "role": "Bill printer / label printer / scanner / bank. KHÔNG rewrite semantics, chỉ bọc.",
      "canImport": ["shared-kernel", "store-context"]
    },
    "commands": {
      "role": "Command pipeline dùng chung POS+QUANLY. UI muốn đổi state thì gọi đây.",
      "canImport": ["shared-kernel", "store-context", "fifo-core", "traceability", "recipe-cost-btp", "compaction", "catalog", "loyalty", "hr", "finance", "alerts", "protected-adapters"]
    },
    "reporting": {
      "role": "Chỉ đọc, qua read-layer. Xây SAU CÙNG.",
      "canImport": ["shared-kernel", "store-context", "read-layer"]
    },
    "persistence-firebase": {
      "role": "Implement port cho path CANONICAL mới. Adapter, không quyết định kiến trúc.",
      "canImport": ["shared-kernel", "store-context", "fifo-core", "compaction"]
    },
    "legacy-firebase-adapter": {
      "role": "Đọc schema CŨ -> map sang canonical. CHỈ ĐỌC, không bao giờ ghi path cũ.",
      "canImport": ["shared-kernel", "store-context"]
    },
    "bootstrap": {
      "role": "Composition root DUY NHẤT: nối port của domain core với adapter thật, rồi trao cho apps. Xem _note_bootstrap.",
      "canImport": ["shared-kernel", "store-context", "commands", "read-layer", "persistence-firebase", "legacy-firebase-adapter", "protected-adapters", "reporting"]
    },
    "app-pos": {
      "role": "THIN CLIENT. Không sở hữu business state.",
      "canImport": ["shared-kernel", "store-context", "bootstrap", "commands", "read-layer", "protected-adapters"]
    },
    "app-quanly": {
      "role": "THIN MANAGEMENT UI.",
      "canImport": ["shared-kernel", "store-context", "bootstrap", "commands", "read-layer", "reporting"]
    }
  },

  "hardRules": [
    "apps KHÔNG BAO GIỜ import trực tiếp fifo-core, compaction, persistence-firebase, legacy-firebase-adapter — chỉ qua commands (ghi) / read-layer (đọc) / bootstrap (wiring).",
    "Domain core (fifo-core, traceability, recipe-cost-btp, compaction) KHÔNG import Firebase SDK trực tiếp; chúng định nghĩa port, adapter implement.",
    "legacy-firebase-adapter chỉ đọc, không ghi path cũ (ngoại lệ duy nhất: script trong tools/).",
    "read-layer là nơi DUY NHẤT được biết cả LIVE lẫn COMPACT cùng lúc.",
    "Không ai import ngược vào app-pos / app-quanly.",
    "read-layer KHÔNG import commands (đọc không gọi ghi)."
  ]
};

  var modules = Object.create(null);
  var cache = Object.create(null);
  var loading = Object.create(null);

  function fail(msg) {
    throw new Error('[GIEO] ' + msg);
  }

  function layerOf(id) {
    var i = id.indexOf('/');
    if (i <= 0) fail('id module phải dạng "<layer>/<ten>", nhận được: "' + id + '"');
    return id.slice(0, i);
  }

  function rulesFor(layer) {
    if (!LAYER_RULES) fail('chưa nạp layer-rules');
    var r = LAYER_RULES.layers[layer];
    if (!r) fail('layer không tồn tại trong layer-rules.json: "' + layer + '"');
    return r;
  }

  /**
   * Kiểm tra 1 cạnh phụ thuộc. Tách riêng để checker offline dùng lại y hệt —
   * runtime và CI không được phép hiểu luật khác nhau.
   */
  function checkEdge(fromId, toId) {
    var from = layerOf(fromId);
    var to = layerOf(toId);
    if (from === to) return null; // trong cùng layer: tự do
    var allowed = rulesFor(from).canImport;
    rulesFor(to);
    if (allowed.indexOf(to) === -1) {
      return 'VI PHẠM IMPORT-DIRECTION: "' + fromId + '" (layer ' + from +
        ') không được import "' + toId + '" (layer ' + to + '). ' +
        'Layer ' + from + ' chỉ được import: [' + allowed.join(', ') + ']. ' +
        'Xem GIEO-CODE-STRUCTURE-BLUEPRINT-V1.md §2 và src/layer-rules.json.';
    }
    return null;
  }

  function define(id, deps, factory) {
    if (typeof id !== 'string') fail('define() cần id dạng chuỗi');
    if (!Array.isArray(deps)) fail('define("' + id + '") cần mảng deps (dùng [] nếu không có)');
    if (typeof factory !== 'function') fail('define("' + id + '") cần factory là hàm');
    if (modules[id]) fail('module trùng id: "' + id + '"');
    layerOf(id);

    for (var i = 0; i < deps.length; i++) {
      var err = checkEdge(id, deps[i]);
      if (err) fail(err);
    }
    modules[id] = { deps: deps, factory: factory };
  }

  function require(id) {
    if (cache[id]) return cache[id];
    var m = modules[id];
    if (!m) fail('không tìm thấy module "' + id + '". Thiếu khai báo define() hoặc sai thứ tự nạp?');
    if (loading[id]) fail('phụ thuộc vòng khi nạp "' + id + '"');
    loading[id] = true;

    var resolved = [];
    for (var i = 0; i < m.deps.length; i++) resolved.push(require(m.deps[i]));

    var exports = m.factory.apply(null, resolved);
    if (exports === undefined) fail('module "' + id + '" không return gì. Factory phải return object exports.');
    delete loading[id];
    cache[id] = exports;
    return exports;
  }

  /** Báo cáo toàn bộ module đã đăng ký — dùng cho self-test lúc khởi động. */
  function inventory() {
    return Object.keys(modules).sort().map(function (id) {
      return { id: id, layer: layerOf(id), deps: modules[id].deps.slice() };
    });
  }

  global.GIEO = {
    define: define,
    require: require,
    inventory: inventory,
    checkEdge: checkEdge,
    layerOf: layerOf,
    _setRules: function (r) { LAYER_RULES = r; },
    _getRules: function () { return LAYER_RULES; }
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);


/* ===== src/layers/shared-kernel/clock.js ===== */
/**
 * Clock — nguồn thời gian DUY NHẤT, tiêm được để test.
 *
 * Invariant T4 (UNIFIED-READ-LAYER-CONTRACT-V1.md §7): cấm `new Date()` rải rác.
 *
 * QUAN TRỌNG — clock KHÔNG quyết định `businessDate`.
 * Đã xác nhận với chủ quán: ngày làm việc đóng lại bằng thao tác "chốt ngày"
 * ở QUANLY sau khi kết ca, không phải bằng một mốc giờ cố định. Nên businessDate
 * là TRẠNG THÁI VẬN HÀNH (xem store-context/business-day), không phải phép tính
 * từ timestamp. Ở đây chỉ có lịch thuần: hôm nay là ngày mấy trên tờ lịch.
 *
 * Trộn 2 khái niệm này là cách sinh ra loại bug "doanh thu nhảy sang ngày khác
 * lúc 0h dù ca chưa kết" — nên chúng được tách bằng tên gọi, không bằng ghi chú.
 */
GIEO.define('shared-kernel/clock', [], function () {
  'use strict';

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function createClock(opts) {
    opts = opts || {};
    /* now() tiêm được: test truyền hàm cố định, production dùng Date.now. */
    var nowFn = opts.now || function () { return Date.now(); };

    function now() { return nowFn(); }

    /** Ngày trên tờ lịch, 'YYYY-MM-DD'. KHÔNG phải businessDate. */
    function calendarDate(ts) {
      var d = new Date(ts === undefined ? now() : ts);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    /** 'YYYY-MM' — khoá chốt sổ tháng. */
    function monthKey(dateKeyOrTs) {
      if (typeof dateKeyOrTs === 'string') return dateKeyOrTs.slice(0, 7);
      return calendarDate(dateKeyOrTs).slice(0, 7);
    }

    /**
     * Liệt kê từng ngày lịch trong khoảng — nền của quy tắc V3
     * ("resolve TỪNG NGÀY, cấm 1 mốc đại diện cả khoảng").
     * Có sẵn hàm này thì không còn lý do để ai đó resolve 1 lần tại ngày cuối kỳ.
     */
    function eachDay(fromTs, toTs) {
      if (toTs < fromTs) throw new Error('[clock] eachDay: to < from');
      var out = [];
      var cur = fromTs;
      var last = calendarDate(toTs);
      for (var guard = 0; guard < 4000; guard++) {
        var key = calendarDate(cur);
        out.push(key);
        if (key >= last) return out;
        cur += 24 * 3600 * 1000;
      }
      throw new Error('[clock] eachDay: khoảng quá dài (>4000 ngày)');
    }

    /** Cộng/trừ ngày trên chuỗi 'YYYY-MM-DD' mà không đụng timestamp. */
    function addDays(dateKey, n) {
      var p = dateKey.split('-');
      var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function isDateKey(s) {
      return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
    }

    return {
      now: now,
      calendarDate: calendarDate,
      monthKey: monthKey,
      eachDay: eachDay,
      addDays: addDays,
      isDateKey: isDateKey
    };
  }

  return { createClock: createClock };
});

/* ===== src/layers/shared-kernel/ids.js ===== */
/**
 * Branded IDs — invariant #4 của GIEO-SYSTEM-REBUILD-PLAN.md §1.4 ("Identity phải tách biệt").
 *
 * Stack đã chốt là JS thuần nên không có type system để tách UnitId khỏi BillId
 * lúc biên dịch. Thay vào đó tách ở RUNTIME bằng tiền tố bắt buộc: mọi id mang
 * sẵn loại của nó, và assertId() từ chối id sai loại ngay tại chỗ dùng.
 *
 * Legacy không có ranh giới này — container.code vừa là identity nội bộ vừa là
 * nhãn người đọc, nên không thể phân biệt "id này là của cái gì" khi debug.
 */
GIEO.define('shared-kernel/ids', [], function () {
  'use strict';

  /* Mọi loại id trong hệ thống. Thêm loại mới = thêm vào đây, không tự chế
     tiền tố rời rạc ở nơi khác. */
  var KINDS = [
    'org', 'store', 'actor', 'employee', 'operation',
    'unit', 'item', 'receipt', 'supplier', 'ledger',
    'bill', 'billLine', 'prepBatch', 'prepItem',
    'recipe', 'recipeVersion', 'costBasis', 'version',
    'customer', 'shift', 'snapshot', 'alert', 'expense'
  ];

  var SEP = '_';
  var kindSet = Object.create(null);
  KINDS.forEach(function (k) { kindSet[k] = true; });

  function assertKind(kind) {
    if (!kindSet[kind]) throw new Error('[ids] loại id không hợp lệ: "' + kind + '"');
  }

  /** Bỏ ký tự có thể phá cấu trúc id hoặc path Firebase. */
  function sanitize(part) {
    return String(part).replace(/[^A-Za-z0-9.@+-]/g, '-');
  }

  var counter = 0;

  /**
   * Sinh id NGẪU NHIÊN. Chỉ dùng cho thực thể (Unit, Bill...).
   * TUYỆT ĐỐI không dùng cho operationId của mutation nghiệp vụ — xem
   * deterministicId(). Legacy dùng .add() random cho mutation là nguồn của
   * bug #13/#21/#22/#23/#24 (FIFO-CORE-ARCHITECTURE-V2.md §7).
   */
  function newId(kind) {
    assertKind(kind);
    counter = (counter + 1) % 1e6;
    var rand = Math.random().toString(36).slice(2, 10);
    return kind + SEP + Date.now().toString(36) + '-' + rand + '-' + counter.toString(36);
  }

  /**
   * Id XÁC ĐỊNH cho mutation — cùng input luôn ra cùng id, nên chạy lại là no-op.
   * Đây là bước 1 của IdempotencyGuard (FIFO-CORE-ARCHITECTURE-V2.md §7).
   */
  function deterministicId(kind, parts) {
    assertKind(kind);
    if (!Array.isArray(parts) || parts.length === 0) {
      throw new Error('[ids] deterministicId cần mảng parts không rỗng');
    }
    if (parts.some(function (p) { return p === null || p === undefined || p === ''; })) {
      throw new Error('[ids] deterministicId: parts không được có phần rỗng — ' + JSON.stringify(parts));
    }
    return kind + SEP + parts.map(sanitize).join('.');
  }

  function kindOf(id) {
    if (typeof id !== 'string') return null;
    var i = id.indexOf(SEP);
    if (i <= 0) return null;
    var k = id.slice(0, i);
    return kindSet[k] ? k : null;
  }

  function isId(id, kind) {
    assertKind(kind);
    return kindOf(id) === kind;
  }

  /** Dùng ở đầu mọi hàm nhận id — sai loại phải nổ ngay, không trôi xuống sâu. */
  function assertId(id, kind, where) {
    if (!isId(id, kind)) {
      throw new Error(
        '[ids] ' + (where || 'assertId') + ': cần ' + kind + 'Id, nhận được ' +
        (kindOf(id) ? kindOf(id) + 'Id' : JSON.stringify(id))
      );
    }
    return id;
  }

  return {
    KINDS: KINDS.slice(),
    newId: newId,
    deterministicId: deterministicId,
    kindOf: kindOf,
    isId: isId,
    assertId: assertId
  };
});

/* ===== src/layers/shared-kernel/operation-state.js ===== */
/**
 * Operation state machine — invariant #5 ("mutation phải idempotent").
 *
 * Mọi mutation nghiệp vụ có đúng 1 operationId và đi qua đúng máy trạng thái này.
 * Legacy để mỗi hàm tự chế lớp chống-đúp riêng (3/6 đường tiêu thụ thiếu txId,
 * stock count dùng .add() random) — FIFO-CORE-ARCHITECTURE-V2.md §7.
 *
 * Tách FAILED_RETRYABLE khỏi FAILED_MANUAL_REVIEW là có chủ đích: máy được phép
 * tự thử lại cái thứ nhất, KHÔNG được tự thử lại cái thứ hai.
 */
GIEO.define('shared-kernel/operation-state', ['shared-kernel/result'], function (R) {
  'use strict';

  var STATES = {
    PENDING: 'PENDING',
    RUNNING: 'RUNNING',
    COMPLETED: 'COMPLETED',
    FAILED_RETRYABLE: 'FAILED_RETRYABLE',
    FAILED_MANUAL_REVIEW: 'FAILED_MANUAL_REVIEW',
    CANCELLED: 'CANCELLED'
  };

  /* COMPLETED và CANCELLED là terminal — không đường ra. Chạy lại 1 operation
     COMPLETED phải là no-op trả kết quả cũ, không phải làm lại. */
  var TRANSITIONS = {
    PENDING: ['RUNNING', 'CANCELLED', 'FAILED_RETRYABLE', 'FAILED_MANUAL_REVIEW'],
    RUNNING: ['COMPLETED', 'FAILED_RETRYABLE', 'FAILED_MANUAL_REVIEW'],
    FAILED_RETRYABLE: ['RUNNING', 'CANCELLED', 'FAILED_MANUAL_REVIEW'],
    FAILED_MANUAL_REVIEW: ['RUNNING', 'CANCELLED'],
    COMPLETED: [],
    CANCELLED: []
  };

  var TERMINAL = { COMPLETED: true, CANCELLED: true };

  function isState(s) { return Object.prototype.hasOwnProperty.call(STATES, s); }
  function isTerminal(s) { return !!TERMINAL[s]; }

  function canTransition(from, to) {
    if (!isState(from) || !isState(to)) return false;
    return TRANSITIONS[from].indexOf(to) !== -1;
  }

  /** Trả Result thay vì throw: chuyển trạng thái sai là tình huống nghiệp vụ, không phải bug. */
  function transition(from, to) {
    if (!isState(from)) return R.err('VALIDATION', 'trạng thái nguồn không hợp lệ: ' + from);
    if (!isState(to)) return R.err('VALIDATION', 'trạng thái đích không hợp lệ: ' + to);
    if (isTerminal(from)) {
      return R.err('PRECONDITION', 'operation đã ở trạng thái cuối "' + from + '", không thể chuyển sang "' + to + '"');
    }
    if (!canTransition(from, to)) {
      return R.err('PRECONDITION', 'không cho phép chuyển "' + from + '" -> "' + to + '"');
    }
    return R.ok(to);
  }

  return {
    STATES: STATES,
    TRANSITIONS: TRANSITIONS,
    isState: isState,
    isTerminal: isTerminal,
    canTransition: canTransition,
    transition: transition
  };
});

/* ===== src/layers/shared-kernel/result.js ===== */
/**
 * Result + error taxonomy — invariant #11 ("không swallow errors").
 *
 * Legacy nuốt lỗi ở nhiều chỗ: `.catch(console.warn)` khi đóng unit nợ (Bug #15),
 * loyalty trả 0 ngầm khi thiếu Customer, `plChannelFeeForDay()` hard-code trả 0.
 * Hệ quả chung: lỗi biến thành số 0 hợp lệ trông như dữ liệu thật.
 *
 * Ở đây thất bại là GIÁ TRỊ TRẢ VỀ có hình dạng riêng, không thể nhầm với số 0,
 * và không thể đọc .value mà không xử lý lỗi trước.
 */
GIEO.define('shared-kernel/result', [], function () {
  'use strict';

  /* Phân loại lỗi. Quyết định "thử lại hay không" phải đọc được từ loại lỗi,
     không phải đoán từ message như legacy. */
  var ERROR_KINDS = {
    VALIDATION: 'VALIDATION',                 // input sai — thử lại vô nghĩa
    FORBIDDEN: 'FORBIDDEN',                   // thiếu quyền — read-layer §5
    NOT_FOUND: 'NOT_FOUND',
    CONFLICT: 'CONFLICT',                     // claim đã bị người khác giữ
    PRECONDITION: 'PRECONDITION',             // trạng thái không cho phép
    AMBIGUOUS_LEGACY: 'AMBIGUOUS_LEGACY',     // invariant #12 — cấm suy đoán, phải rà tay
    RETRYABLE: 'RETRYABLE',                   // lỗi hạ tầng tạm thời
    MANUAL_REVIEW: 'MANUAL_REVIEW'            // hỏng giữa chừng, cần người xử lý
  };

  var RETRYABLE_KINDS = { RETRYABLE: true };

  function ok(value) {
    return { ok: true, value: value === undefined ? null : value };
  }

  function err(kind, message, detail) {
    if (!ERROR_KINDS[kind]) throw new Error('[result] loại lỗi không hợp lệ: "' + kind + '"');
    return {
      ok: false,
      error: {
        kind: kind,
        message: String(message || kind),
        detail: detail === undefined ? null : detail
      }
    };
  }

  function isOk(r) { return !!(r && r.ok === true); }
  function isErr(r) { return !!(r && r.ok === false); }

  function isRetryable(r) {
    return isErr(r) && !!RETRYABLE_KINDS[r.error.kind];
  }

  /**
   * Lấy giá trị, nổ nếu là lỗi. Chỉ dùng khi caller ĐÃ kiểm tra isOk(),
   * hoặc ở ranh giới mà lỗi thật sự là bug lập trình.
   */
  function unwrap(r, where) {
    if (isOk(r)) return r.value;
    if (isErr(r)) {
      throw new Error('[result] ' + (where || 'unwrap') + ': ' + r.error.kind + ' — ' + r.error.message);
    }
    throw new Error('[result] ' + (where || 'unwrap') + ': không phải Result — ' + JSON.stringify(r));
  }

  /** Biến đổi giá trị, giữ nguyên lỗi. */
  function map(r, fn) {
    return isOk(r) ? ok(fn(r.value)) : r;
  }

  /** Nối chuỗi bước có thể hỏng; dừng ở lỗi đầu tiên. */
  function chain(r, fn) {
    return isOk(r) ? fn(r.value) : r;
  }

  /** Gom nhiều Result; lỗi đầu tiên thắng. Dùng cho validate nhiều trường. */
  function all(results) {
    var out = [];
    for (var i = 0; i < results.length; i++) {
      if (isErr(results[i])) return results[i];
      out.push(results[i].value);
    }
    return ok(out);
  }

  return {
    ERROR_KINDS: ERROR_KINDS,
    ok: ok,
    err: err,
    isOk: isOk,
    isErr: isErr,
    isRetryable: isRetryable,
    unwrap: unwrap,
    map: map,
    chain: chain,
    all: all
  };
});

/* ===== src/layers/store-context/access.js ===== */
/**
 * Authorization — lõi bảo mật.
 *
 * Contract: POS-QUANLY-PERMISSION-CONTRACT-V1.md
 *   §3  ba lớp quyền EXECUTE / REVIEW-APPROVE-CORRECT / MASTER-CONFIGURE
 *   §20 5 vai trò, quyết định = Actor + Store Scope + Command + Authority
 *   §23 ALL_STORES KHÔNG tự động có mutation authority
 *   §24 permission check phải ở Command/Domain — bypass UI vẫn phải DENY
 *   §27 invariant 8 (approval fail-closed), 17 (enforce ở Command/Domain)
 *
 * Gap đang đóng: legacy Reporting có 0% phân quyền đọc — QUANLY dùng 1 tài khoản
 * Firebase dùng chung nên mọi người thấy toàn bộ P&L/COGS/khách hàng
 * (GIEO-REBUILD-HANDOFF-V2.md §4.1). Ở đây quyền đọc bị kiểm tra y như quyền ghi.
 */
GIEO.define('store-context/access', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  /* §3 — ba lớp quyền. POS không phải "ít quyền hơn" QUANLY; hai bên có
     authority khác nhau theo nghiệp vụ (§2). */
  var AUTHORITY = {
    EXECUTE: 'EXECUTE',
    REVIEW_APPROVE_CORRECT: 'REVIEW_APPROVE_CORRECT',
    MASTER_CONFIGURE: 'MASTER_CONFIGURE'
  };

  var SOURCE = { POS: 'POS', QUANLY: 'QUANLY', SYSTEM: 'SYSTEM' };

  /* §20 — 5 vai trò tối thiểu. Vai trò KHÔNG phân cấp tuyến tính: STORE_MANAGER
     giữ EXECUTE mà QUANLY_ADMIN không có, vì admin không đứng quầy bán hàng. */
  var ROLES = {
    POS_OPERATOR: [AUTHORITY.EXECUTE],
    STORE_MANAGER: [AUTHORITY.EXECUTE, AUTHORITY.REVIEW_APPROVE_CORRECT],
    QUANLY_OPERATOR: [AUTHORITY.REVIEW_APPROVE_CORRECT],
    QUANLY_ADMIN: [AUTHORITY.REVIEW_APPROVE_CORRECT, AUTHORITY.MASTER_CONFIGURE],
    SYSTEM_ADMIN: [AUTHORITY.EXECUTE, AUTHORITY.REVIEW_APPROVE_CORRECT, AUTHORITY.MASTER_CONFIGURE]
  };

  /**
   * Sổ đăng ký command. MẶC ĐỊNH ĐÓNG: command chưa đăng ký thì bị từ chối
   * (§27 invariant 8 fail-closed, và quy tắc P4 của read-layer contract).
   * Quên đăng ký là hỏng ồn ào lúc chạy test, không phải lỗ hổng im lặng.
   */
  var registry = Object.create(null);

  /**
   * @param {string} name        tên command, vd 'ApproveLostContainer'
   * @param {object} spec
   *   authority   {string}   lớp quyền tối thiểu cần có
   *   mutates     {boolean}  có đổi business state không (ảnh hưởng luật §23)
   *   sources     {string[]} app nào được gọi; bỏ trống = mọi app
   *   crossStore  {boolean}  có được thao tác nhiều store cùng lúc không (§23)
   */
  function registerCommand(name, spec) {
    if (!name || typeof name !== 'string') throw new Error('[access] registerCommand cần tên');
    if (registry[name]) throw new Error('[access] command đăng ký trùng: "' + name + '"');
    if (!AUTHORITY[spec && spec.authority]) {
      throw new Error('[access] command "' + name + '" cần authority hợp lệ');
    }
    if (typeof spec.mutates !== 'boolean') {
      throw new Error('[access] command "' + name + '" phải khai báo rõ mutates true/false');
    }
    registry[name] = {
      name: name,
      authority: spec.authority,
      mutates: spec.mutates,
      sources: spec.sources ? spec.sources.slice() : null,
      crossStore: !!spec.crossStore
    };
    return registry[name];
  }

  function getCommand(name) { return registry[name] || null; }
  function listCommands() { return Object.keys(registry).sort(); }

  /**
   * Actor.
   * `stores`   — danh sách store được phép GHI. §23: chỉ store trong đây mới mutate được.
   * `allStoresRead` — ALL_STORES theo đúng nghĩa §27 invariant 14: aggregation/READ,
   *                   KHÔNG kéo theo quyền ghi ở store ngoài `stores`.
   */
  function createActor(spec) {
    if (!spec) return R.err('VALIDATION', 'actor cần spec');
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'actor cần actorId hợp lệ');
    if (!ROLES[spec.role]) return R.err('VALIDATION', 'vai trò không hợp lệ: ' + spec.role);
    if (!SOURCE[spec.source]) return R.err('VALIDATION', 'source không hợp lệ: ' + spec.source);
    var stores = spec.stores || [];
    if (!Array.isArray(stores)) return R.err('VALIDATION', 'actor.stores phải là mảng');
    for (var i = 0; i < stores.length; i++) {
      if (!ids.isId(stores[i], 'store')) return R.err('VALIDATION', 'actor.stores có phần tử không phải storeId');
    }
    return R.ok({
      actorId: spec.actorId,
      role: spec.role,
      source: spec.source,
      stores: stores.slice(),
      allStoresRead: !!spec.allStoresRead,
      authorities: ROLES[spec.role].slice()
    });
  }

  function hasAuthority(actor, authority) {
    return !!actor && actor.authorities.indexOf(authority) !== -1;
  }

  function canWriteStore(actor, storeId) {
    return !!actor && actor.stores.indexOf(storeId) !== -1;
  }

  function canReadStore(actor, storeId) {
    return !!actor && (actor.allStoresRead || canWriteStore(actor, storeId));
  }

  /**
   * Quyết định cuối cùng. Gọi từ Command layer, KHÔNG phải từ UI (§24).
   * Trả Result — FORBIDDEN là tình huống nghiệp vụ, không phải exception.
   */
  function authorize(actor, commandName, targetStoreId) {
    if (!actor || !actor.actorId) {
      return R.err('FORBIDDEN', 'không có actor — mọi mutation phải có actorId (invariant #7)');
    }
    var cmd = getCommand(commandName);
    if (!cmd) {
      /* Mặc định đóng. Command mới chưa khai quyền thì chặn, không mở. */
      return R.err('FORBIDDEN', 'command "' + commandName + '" chưa đăng ký quyền — mặc định từ chối', {
        hint: 'gọi access.registerCommand() ở layer commands khi khai báo command'
      });
    }
    if (cmd.sources && cmd.sources.indexOf(actor.source) === -1) {
      return R.err('FORBIDDEN', 'command "' + commandName + '" không gọi được từ ' + actor.source +
        ' (chỉ: ' + cmd.sources.join(', ') + ')');
    }
    if (!hasAuthority(actor, cmd.authority)) {
      return R.err('FORBIDDEN', 'vai trò ' + actor.role + ' thiếu quyền ' + cmd.authority +
        ' cho command "' + commandName + '"');
    }
    if (!ids.isId(targetStoreId, 'store')) {
      return R.err('VALIDATION', 'authorize cần targetStoreId hợp lệ — mọi thao tác phải nêu rõ store');
    }

    if (cmd.mutates) {
      /* §23: ALL_STORES không tự động có mutation authority. Đọc được khắp nơi
         không có nghĩa ghi được khắp nơi. */
      if (!canWriteStore(actor, targetStoreId)) {
        return R.err('FORBIDDEN', 'actor không có quyền ghi tại store ' + targetStoreId +
          (actor.allStoresRead ? ' (ALL_STORES chỉ là phạm vi ĐỌC, không kéo theo quyền ghi)' : ''));
      }
    } else if (!canReadStore(actor, targetStoreId)) {
      return R.err('FORBIDDEN', 'actor không có quyền đọc tại store ' + targetStoreId);
    }

    return R.ok({
      actorId: actor.actorId,
      command: commandName,
      storeId: targetStoreId,
      authority: cmd.authority,
      mutates: cmd.mutates
    });
  }

  /**
   * Mutation nhiều store — §23 đòi targetStoreIds[] + explicit authority +
   * per-store validation. Không có đường tắt "có ALL_STORES nên làm hết".
   */
  function authorizeMany(actor, commandName, targetStoreIds) {
    var cmd = getCommand(commandName);
    if (!cmd) return R.err('FORBIDDEN', 'command "' + commandName + '" chưa đăng ký quyền');
    if (!Array.isArray(targetStoreIds) || targetStoreIds.length === 0) {
      return R.err('VALIDATION', 'authorizeMany cần mảng targetStoreIds không rỗng');
    }
    if (cmd.mutates && !cmd.crossStore && targetStoreIds.length > 1) {
      return R.err('FORBIDDEN', 'command "' + commandName + '" không được khai crossStore');
    }
    var out = [];
    for (var i = 0; i < targetStoreIds.length; i++) {
      var r = authorize(actor, commandName, targetStoreIds[i]);
      if (R.isErr(r)) return r;
      out.push(r.value);
    }
    return R.ok(out);
  }

  /** Chỉ để render UI. KHÔNG BAO GIỜ được dùng thay cho authorize() (§24). */
  function describeForUi(actor, commandName, targetStoreId) {
    return R.isOk(authorize(actor, commandName, targetStoreId));
  }

  return {
    AUTHORITY: AUTHORITY,
    SOURCE: SOURCE,
    ROLES: ROLES,
    registerCommand: registerCommand,
    getCommand: getCommand,
    listCommands: listCommands,
    createActor: createActor,
    hasAuthority: hasAuthority,
    canReadStore: canReadStore,
    canWriteStore: canWriteStore,
    authorize: authorize,
    authorizeMany: authorizeMany,
    describeForUi: describeForUi
  };
});

/* ===== src/layers/store-context/business-day.js ===== */
/**
 * BusinessDay — "đang thao tác ở ngày làm việc nào".
 *
 * Đã xác nhận với chủ quán: **ngày làm việc đóng lại bằng thao tác "chốt ngày"
 * ở QUANLY sau khi kết ca**, không phải bằng một mốc giờ cố định. Vì vậy
 * `businessDate` là TRẠNG THÁI VẬN HÀNH, không phải phép tính từ đồng hồ.
 *
 * Hệ quả thiết kế:
 *   - Không hàm nào được tự suy ra businessDate từ timestamp. Ai cần biết hôm
 *     nay là ngày làm việc nào thì phải ĐỌC ngày đang mở.
 *   - Một đơn bán lúc 0h30 vẫn thuộc ngày làm việc chưa chốt, đúng như quán
 *     thật vận hành.
 *   - `status='CLOSED'` là gate chặn tạo Bill (FEATURE-TREE-V1.md §2 mục [5]).
 *
 * Đây là lý do `clock` chỉ còn `calendarDate()` — ngày trên tờ lịch — và cố ý
 * không có `businessDate()`.
 */
GIEO.define('store-context/business-day', [
  'shared-kernel/ids',
  'shared-kernel/result'
], function (ids, R) {
  'use strict';

  var STATUS = { OPEN: 'OPEN', CLOSED: 'CLOSED' };

  function businessDayId(storeId, dateKey) {
    return ids.deterministicId('shift', ['day', storeId, dateKey]);
  }

  /**
   * Mở ngày làm việc. `dateKey` do người mở chỉ định (thường là ngày lịch hiện
   * tại, nhưng không bắt buộc — quán mở muộn sau nửa đêm vẫn mở đúng ngày cũ).
   */
  function openDay(spec) {
    if (!spec) return R.err('VALIDATION', 'openDay cần spec');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'openDay cần storeId hợp lệ');
    if (!spec.clock || !spec.clock.isDateKey(spec.dateKey)) {
      return R.err('VALIDATION', 'openDay cần dateKey dạng YYYY-MM-DD');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'openDay cần actorId');
    if (typeof spec.at !== 'number') return R.err('VALIDATION', 'openDay cần thời điểm "at"');

    return R.ok({
      businessDayId: businessDayId(spec.storeId, spec.dateKey),
      storeId: spec.storeId,
      dateKey: spec.dateKey,
      status: STATUS.OPEN,
      openedAt: spec.at,
      openedBy: spec.actorId,
      closedAt: null,
      closedBy: null,
      closeOperationId: null
    });
  }

  /**
   * Chốt ngày. Chỉ QUANLY (nút chốt ngày nằm ở QUANLY — xác nhận trực tiếp).
   *
   * `blockers` là các lý do CHẶN đóng ngày do domain khác cung cấp (refill
   * checklist chưa xong, ca chưa kết...). FEATURE-TREE §2 mục [5] gọi đây là
   * `blockingClose`. Domain này không tự biết các lý do đó nên nhận vào, nhưng
   * BẮT BUỘC tôn trọng — không có tham số nào để bỏ qua.
   */
  function closeDay(day, spec) {
    if (!day) return R.err('VALIDATION', 'closeDay cần ngày làm việc');
    if (day.status === STATUS.CLOSED) {
      return R.err('PRECONDITION', 'ngày ' + day.dateKey + ' đã chốt lúc ' + day.closedAt);
    }
    if (!spec || !ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'closeDay cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'closeDay cần operationId');
    if (typeof spec.at !== 'number') return R.err('VALIDATION', 'closeDay cần thời điểm "at"');

    var blockers = spec.blockers || [];
    if (blockers.length) {
      return R.err('PRECONDITION', 'chưa chốt được ngày ' + day.dateKey + ': ' + blockers.join('; '), {
        blockers: blockers.slice()
      });
    }

    return R.ok(Object.assign({}, day, {
      status: STATUS.CLOSED,
      closedAt: spec.at,
      closedBy: spec.actorId,
      closeOperationId: spec.operationId
    }));
  }

  /**
   * Gate: ngày đã chốt thì khoá bán (FEATURE-TREE §2 mục [5]).
   * Mọi command tạo/sửa dữ liệu vận hành phải đi qua đây.
   */
  function assertOperable(day, what) {
    if (!day) {
      return R.err('PRECONDITION', 'chưa mở ngày làm việc — không thực hiện được ' + (what || 'thao tác'));
    }
    if (day.status !== STATUS.OPEN) {
      return R.err('PRECONDITION',
        'ngày làm việc ' + day.dateKey + ' đã chốt — không thực hiện được ' + (what || 'thao tác') +
        '. Muốn sửa số liệu ngày đã chốt phải đi qua correction.');
    }
    return R.ok(day);
  }

  /** Ngày đang mở của 1 store. Nhiều ngày mở cùng lúc là sai trạng thái. */
  function findOpenDay(days, storeId) {
    var open = days.filter(function (d) { return d.storeId === storeId && d.status === STATUS.OPEN; });
    if (open.length === 0) return R.err('NOT_FOUND', 'không có ngày làm việc nào đang mở');
    if (open.length > 1) {
      return R.err('CONFLICT', 'có ' + open.length + ' ngày làm việc cùng mở: ' +
        open.map(function (d) { return d.dateKey; }).join(', ') + ' — phải chốt bớt trước');
    }
    return R.ok(open[0]);
  }

  return {
    STATUS: STATUS,
    businessDayId: businessDayId,
    openDay: openDay,
    closeDay: closeDay,
    assertOperable: assertOperable,
    findOpenDay: findOpenDay
  };
});

/* ===== src/layers/store-context/context.js ===== */
/**
 * StoreContext — "đang thao tác ở store nào, ai thao tác, bằng quyền gì".
 *
 * Mọi command và mọi read đều nhận context này. Không có context = không biết
 * actor = không audit được (POS-QUANLY-PERMISSION-CONTRACT-V1.md §25).
 *
 * Gap đang đóng: legacy KHÔNG lưu actor trên Bill (`soldByActorId`) — ngoại lệ
 * duy nhất trong toàn hệ thống, tức là không trả lời được "ai bán đơn này"
 * (FEATURE-TREE-V1.md §4.7). Bắt buộc actor trong context chặn tận gốc khả năng
 * một mutation đi qua mà không có người chịu trách nhiệm.
 *
 * `businessDate` phải được CẤP VÀO, không tự tính từ đồng hồ: đã xác nhận với
 * chủ quán rằng ngày làm việc đóng bằng thao tác "chốt ngày" ở QUANLY, nên
 * nguồn sự thật là ngày đang mở (store-context/business-day), không phải giờ
 * hiện tại. Tự suy ra ngày từ timestamp là cách đẩy doanh thu sang ngày khác
 * lúc 0h dù ca chưa kết.
 */
GIEO.define('store-context/context', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'shared-kernel/clock',
  'store-context/access',
  'store-context/business-day'
], function (ids, R, clockLib, access, businessDay) {
  'use strict';

  /**
   * @param spec.organizationId, spec.storeId
   * @param spec.actor        kết quả access.createActor()
   * @param spec.source       POS | QUANLY | SYSTEM
   * @param spec.deviceId, spec.appInstanceId   truy vết máy nào gây ra thao tác
   * @param spec.businessDay  ngày làm việc ĐANG MỞ (store-context/business-day)
   * @param spec.clock        tiêm được để test; mặc định clock thật
   * @param spec.featureFlags bật/tắt đường mới trong giai đoạn shadow
   */
  function createContext(spec) {
    if (!spec) return R.err('VALIDATION', 'context cần spec');
    if (!ids.isId(spec.organizationId, 'org')) return R.err('VALIDATION', 'context cần organizationId hợp lệ');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'context cần storeId hợp lệ');
    if (!spec.actor || !ids.isId(spec.actor.actorId, 'actor')) {
      return R.err('VALIDATION', 'context cần actor hợp lệ — mọi mutation phải có actorId');
    }
    if (!access.SOURCE[spec.source]) return R.err('VALIDATION', 'context cần source hợp lệ');
    if (spec.actor.source !== spec.source) {
      return R.err('VALIDATION', 'actor.source (' + spec.actor.source + ') khác context.source (' + spec.source + ')');
    }

    /* Ngày làm việc là trạng thái vận hành, không phải phép tính. Thiếu nó thì
       từ chối tạo context — thà hỏng ồn ào còn hơn ghi nhầm ngày cho số liệu. */
    var day = spec.businessDay;
    if (!day || !day.dateKey) {
      return R.err('VALIDATION',
        'context cần businessDay đang mở — businessDate không được suy ra từ đồng hồ ' +
        '(ngày làm việc chốt bằng thao tác ở QUANLY)');
    }
    if (day.storeId !== spec.storeId) {
      return R.err('VALIDATION', 'businessDay thuộc store khác với context');
    }

    var clock = spec.clock || clockLib.createClock();
    var flags = spec.featureFlags || {};

    var ctx = {
      organizationId: spec.organizationId,
      storeId: spec.storeId,
      actor: spec.actor,
      source: spec.source,
      deviceId: spec.deviceId || null,
      appInstanceId: spec.appInstanceId || null,
      clock: clock,
      businessDay: day,
      businessDate: day.dateKey,
      featureFlags: flags,

      /** Cổng quyền cho command layer. Đường DUY NHẤT để hỏi "được làm không". */
      authorize: function (commandName, targetStoreId) {
        return access.authorize(spec.actor, commandName, targetStoreId || spec.storeId);
      },

      /**
       * Phần audit chung cho mọi mutation (§25). Command bổ sung
       * command/reason/before/calculation/mutation/after/status.
       */
      auditBase: function (operationId) {
        return {
          operationId: operationId,
          actorId: spec.actor.actorId,
          source: spec.source,
          organizationId: spec.organizationId,
          storeId: spec.storeId,
          deviceId: spec.deviceId || null,
          timestamp: clock.now(),
          businessDate: day.dateKey
        };
      },

      /** Gate "ngày đã chốt thì khoá bán" — mọi command vận hành gọi trước khi ghi. */
      assertOperable: function (what) { return businessDay.assertOperable(day, what); },

      flag: function (name) { return !!flags[name]; }
    };

    return R.ok(ctx);
  }

  /**
   * Context hệ thống — cho tiến trình nền (compaction, purge, scheduled job).
   * §26: compaction là system process, POS/QUANLY không tự xoá raw FIFO.
   */
  function createSystemContext(spec) {
    var actorR = access.createActor({
      actorId: (spec && spec.actorId) || ids.deterministicId('actor', ['system']),
      role: 'SYSTEM_ADMIN',
      source: 'SYSTEM',
      stores: [spec && spec.storeId]
    });
    if (R.isErr(actorR)) return actorR;
    return createContext({
      organizationId: spec.organizationId,
      storeId: spec.storeId,
      actor: actorR.value,
      source: 'SYSTEM',
      businessDay: spec.businessDay,
      clock: spec.clock,
      featureFlags: spec.featureFlags
    });
  }

  return {
    createContext: createContext,
    createSystemContext: createSystemContext
  };
});

/**
 * Organization + Store — invariant #10 ("Store là first-class boundary").
 *
 * Đã chốt với chủ hệ thống: legacy 100% single-store (grep không ra storeId nào),
 * giai đoạn này CHỈ CHỪA CHỖ — `storeId` có mặt trong mọi entity/query nhưng chỉ
 * có 1 giá trị thật, và KHÔNG xây aggregation ALL_STORES.
 *
 * Lý do vẫn bắt buộc mang storeId ngay từ đầu thay vì thêm sau: thêm sau nghĩa là
 * sửa mọi query, mọi path, mọi ledger entry đã ghi — và dữ liệu cũ thì không có
 * gì để điền vào. Chừa chỗ rẻ, nhồi vào sau thì không.

  'use strict';

    });
