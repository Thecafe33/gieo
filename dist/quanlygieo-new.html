    bankConfirmations: { kind: RTDB, path: 'bank_confirmations', protected: true }
  };

  /* Path legacy CỐ Ý không migrate — ngoài phạm vi FIFO Core (§3). Liệt kê ra
     để phân biệt "đã cân nhắc rồi bỏ" với "quên mất". */
  var NOT_MIGRATED = [
    'employees_gieogieo', 'work_schedules_gieogieo', 'hr_settings_gieogieo',
    'expenses_gieogieo', 'expense_categories_gieogieo', 'payment_methods_gieogieo',
    'customers', 'rewards', 'alerts_gieogieo',
    'menu_gieogieo', 'menu_togo_gieogieo', 'toppings_gieogieo', 'food_gieogieo',
    'config_history_gieogieo', 'audit_logs_gieogieo', 'finance_gieogieo/current',
    'daily_ops_gieogieo'
  ];

  function get(name) {
    var p = PATHS[name];
    if (!p) throw new Error('[legacy-paths] không có path tên "' + name + '"');
    return p;
  }

  /**
   * Chốt chặn read-only. Gọi ở mọi chỗ định ghi — không có chỗ nào gọi là đúng.
   * Ngoại lệ duy nhất là script migration/cutover trong tools/, chạy ngoài
   * adapter này.
   */
  function assertReadOnly(operation, pathName) {
    return R.err('FORBIDDEN',
      'legacy-firebase-adapter CHỈ ĐỌC — từ chối "' + operation + '" lên "' + pathName + '". ' +
      'Hệ thống cũ vẫn đang chạy production; ghi canonical đi qua persistence-firebase, ' +
      'migration đi qua script riêng ở tools/.');
  }

  function isProtected(name) {
    return !!(PATHS[name] && PATHS[name].protected);
  }

  return {
    RTDB: RTDB,
    FIRESTORE: FIRESTORE,
    PATHS: PATHS,
    NOT_MIGRATED: NOT_MIGRATED,
    get: get,
    assertReadOnly: assertReadOnly,
    isProtected: isProtected
  };
});

/* ===== src/layers/legacy-firebase-adapter/mappers.js ===== */
/**
 * Mapper: schema CŨ → canonical model.
 *
 * Contract: LEGACY-FIREBASE-PATH-MAP-V1.md §1, §4.
 *
 * Nguyên tắc: path canonical KHÔNG copy tên field cũ 1:1. Domain core quyết
 * định field (FIFO-CORE-ARCHITECTURE-V2.md §1), adapter chỉ map.
 *
 * Mapper KHÔNG đoán. Dữ liệu cũ thiếu nghĩa thì đánh dấu `AMBIGUOUS` và trả
 * kèm cờ — invariant #12 ("không đoán legacy semantics khi ambiguous"). Phần
 * lớn giá trị của adapter này nằm ở chỗ nói ra được cái gì KHÔNG biết.
 */
GIEO.define('legacy-firebase-adapter/mappers', [
  'shared-kernel/ids',
  'shared-kernel/result'
], function (ids, R) {
  'use strict';

  var AMBIGUOUS = {
    NO_COST_BASIS: 'NO_COST_BASIS',
    NO_ACTOR: 'NO_ACTOR',
    NO_RECIPE_VERSION: 'NO_RECIPE_VERSION',
    NO_SUPPLIER: 'NO_SUPPLIER',
    NEGATIVE_UNIT_BASE: 'NEGATIVE_UNIT_BASE'
  };

  /* Legacy status → canonical lifecycle (FIFO-CORE-ARCHITECTURE-V2.md §2). */
  var STATUS_MAP = {
    sealed: 'SEALED',
    open: 'OPEN',
    finished: 'PHYSICALLY_FINISHED',
    used_up: 'PHYSICALLY_FINISHED',
    lost: 'LOST',
    voided: 'VOIDED'
  };

  function flag(list, code, detail) {
    list.push({ code: code, detail: detail || null });
  }

  /**
   * Unit — phải xử lý CẢ HAI nguồn và merge đúng như `_ueRecomputeCurrentStock`.
   *
   * `stock_containers_gieogieo` (Firestore) là nguồn thật cho sealed/finished;
   * `active_units_gieogieo` (RTDB) là phản chiếu real-time của unit ĐANG MỞ.
   * Hai nguồn có thể lệch nhau — legacy có biến `_ueRtStale` cho đúng chuyện
   * này. Merge phải nói ra khi lệch, không im lặng chọn một bên.
   *
   * @param spec.container  bản ghi Firestore
   * @param spec.rtUnit     bản ghi RTDB tương ứng (nếu có)
   */
  function mapUnit(spec) {
    var c = spec.container;
    if (!c || !c.code) return R.err('VALIDATION', 'bản ghi container thiếu code');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'mapUnit cần storeId hợp lệ');

    var ambiguous = [];
    var status = STATUS_MAP[c.status] || null;
    if (!status) {
      return R.err('AMBIGUOUS_LEGACY',
        'status legacy không nhận ra: "' + c.status + '" — không đoán, phải rà thủ công',
        { code: c.code });
    }

    /* Legacy KHÔNG lưu giá vốn trên container. Đây là gốc của gap "COGS actual
       chưa từng tồn tại" — Unit migrate sang không có costBasis thật, và phải
       NÓI RA thay vì bịa một con số. */
    var costBasis = null;
    if (typeof c.unitCost === 'number') {
      costBasis = { unitCost: c.unitCost, currency: 'VND', versionId: null, source: 'LEGACY' };
    } else {
      flag(ambiguous, AMBIGUOUS.NO_COST_BASIS,
        'container legacy không lưu giá vốn — COGS actual cho Unit này không tính được');
    }

    if (!c.supplierId && !c.receiveRefId) flag(ambiguous, AMBIGUOUS.NO_SUPPLIER);

    /* Merge 2 nguồn. RTDB thắng cho số dư của unit đang mở, đúng như legacy —
       nhưng lệch thì ghi nhận. */
    var remaining = typeof c.unitBase === 'number' ? c.unitBase : null;
    var rtRemaining = spec.rtUnit && typeof spec.rtUnit.unitBase === 'number'
      ? spec.rtUnit.unitBase : null;
    var drift = null;
    if (rtRemaining !== null && remaining !== null && rtRemaining !== remaining) {
      drift = { firestore: remaining, rtdb: rtRemaining, difference: rtRemaining - remaining };
    }
    if (rtRemaining !== null && (status === 'OPEN' || status === 'CONSUMING')) {
      remaining = rtRemaining;
    }

    /* Nợ FIFO ở legacy là unitBase ÂM, không có field debt. Chuyển thành field
       tường minh (§4) và đánh dấu để rà. */
    var debt = null;
    if (remaining !== null && remaining < 0) {
      debt = {
        amount: -remaining, incurredAt: null, incurredByOperationId: null,
        absorbedByUnitId: null, absorbedAt: null
      };
      flag(ambiguous, AMBIGUOUS.NEGATIVE_UNIT_BASE,
        'legacy biểu diễn nợ bằng số âm, không biết nợ phát sinh lúc nào / bởi thao tác nào');
    }

    return R.ok({
      unit: {
        unitId: ids.deterministicId('unit', ['legacy', c.code]),
        itemId: ids.deterministicId('item', ['legacy', c.itemId || 'unknown']),
        storeId: spec.storeId,
        itemKind: spec.itemKind || 'raw',
        receiptId: c.receiveRefId || null,
        supplierId: c.supplierId || null,
        receivedAt: c.createdAt || null,
        receivedBy: c.createdBy || null,
        initialQty: typeof c.baseQty === 'number' ? c.baseQty : null,
        remainingQty: remaining,
        costBasis: costBasis,
        status: status,
        openedAt: c.openedAt || null,
        openedBy: c.openedBy || null,
        /* Legacy không lưu mốc này — nó chỉ suy diễn tạm thời mỗi lần load. */
        systemExhaustedAt: null,
        finishedAt: c.finishedAt || null,
        finishedBy: c.finishedBy || null,
        finishReason: c.finishReason || null,
        wasteQty: typeof c.wasteBase === 'number' ? c.wasteBase : 0,
        debt: debt,
        lostAt: c.lostAt || null, lostBy: c.lostBy || null, lostReportId: c.lostReportId || null,
        foundAt: null, foundBy: null,
        needsReview: ambiguous.length > 0,
        needsReviewReasons: ambiguous.map(function (a) { return a.code; }),
        physicalReconciliations: (c.notEmptyChecks || []).map(function (n) {
          return {
            operationId: null, at: n.at || null, actorId: n.by || null,
            before: null, actual: n.qty, delta: null,
            method: 'weighing', reason: null
          };
        }),
        operationId: null,
        legacySource: { code: c.code, id: c.id || null }
      },
      ambiguous: ambiguous,
      /* Lệch 2 nguồn là thông tin cho shadow-compare, không phải lỗi map. */
      sourceDrift: drift
    });
  }

  /** Ledger — gộp stock_transactions và prep_transactions, phân biệt bằng domain. */
  function mapLedgerEntry(spec) {
    var t = spec.tx;
    if (!t) return R.err('VALIDATION', 'thiếu bản ghi giao dịch');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'mapLedgerEntry cần storeId');

    var ambiguous = [];
    if (!t.staffEmployeeId && !t.actorId) flag(ambiguous, AMBIGUOUS.NO_ACTOR);

    var unitId = t.containerCode
      ? ids.deterministicId('unit', ['legacy', t.containerCode])
      : null;
    var qtyDelta = typeof t.qtyDelta === 'number' ? t.qtyDelta : (t.qty || 0);

    return R.ok({
      entry: {
        entryId: ids.deterministicId('ledger', ['legacy', t.id || String(t.txId || Math.random())]),
        operationId: t.txId || null,
        domain: spec.domain || 'raw',
        type: (t.type || 'ADJUSTMENT').toUpperCase(),
        itemId: ids.deterministicId('item', ['legacy', t.itemId || 'unknown']),
        storeId: spec.storeId,
        unitId: unitId,
        qtyDelta: qtyDelta,
        /* Quy tắc §5 áp NGAY lúc map — dữ liệu cũ vào canonical cũng phải tuân
           đúng luật, không có ngoại lệ cho dữ liệu migrate. */
        untrackedPendingDelta: unitId ? 0 : qtyDelta,
        costBasisVersionId: null,
        unitCost: typeof t.unitCost === 'number' ? t.unitCost : null,
        businessDate: t.dateKey || null,
        actorId: t.staffEmployeeId || t.actorId || null,
        occurredAt: t.createdAt || null,
        referenceType: t.refType || null,
        referenceId: t.refId || null,
        reason: t.reason || null
      },
      ambiguous: ambiguous
    });
  }

  /**
   * Recipe — legacy KHÔNG có versioning, ghi đè trực tiếp.
   *
   * §4 yêu cầu tự tạo `versionId` giả từ `updatedAt` và đánh dấu
   * `versionSource: 'legacy-inferred'` để phân biệt với version thật tạo sau
   * cutover. Nói rõ: version này KHÔNG chứng minh được công thức tại thời điểm
   * bill cũ là gì — chỉ là ảnh chụp lúc migrate.
   */
  function mapRecipe(spec) {
    var r = spec.recipe;
    if (!r) return R.err('VALIDATION', 'thiếu bản ghi recipe');
    if (!spec.menuRefKey) return R.err('VALIDATION', 'mapRecipe cần menuRefKey');

    var ambiguous = [{
      code: AMBIGUOUS.NO_RECIPE_VERSION,
      detail: 'legacy ghi đè recipe trực tiếp — version này chỉ là ảnh chụp lúc migrate, ' +
        'KHÔNG chứng minh được công thức tại thời điểm các bill cũ'
    }];

    var rows = [];
    Object.keys(r).forEach(function (size) {
      if (!r[size] || typeof r[size] !== 'object') return;
      rows.push({
        size: size,
        components: Object.keys(r[size]).map(function (refId) {
          return { refType: 'item', refId: refId, qty: r[size][refId] };
        })
      });
    });

    return R.ok({
      recipeId: ids.deterministicId('recipe', ['legacy', spec.menuRefKey]),
      versionId: ids.deterministicId('version', ['legacy', spec.menuRefKey, String(r.updatedAt || 0)]),
      versionSource: 'legacy-inferred',
      effectiveFrom: r.updatedAt || null,
      components: rows.reduce(function (acc, x) { acc[x.size] = x.components; return acc; }, {}),
      ambiguous: ambiguous
    });
  }

  /** Bill — giữ nguyên chi tiết, KHÔNG aggregate. */
  function mapBill(spec) {
    var o = spec.order;
    if (!o) return R.err('VALIDATION', 'thiếu bản ghi order');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'mapBill cần storeId');

    var ambiguous = [];
    /* Ngoại lệ duy nhất của toàn hệ thống cũ: Bill không lưu ai bán (§4.7). */
    if (!o.soldBy && !o.staffEmployeeId) {
      flag(ambiguous, AMBIGUOUS.NO_ACTOR,
        'bill legacy không lưu người bán — chỉ có gate "có ai đó đang check-in"');
    }

    var lines = (o.itemsArray || []).map(function (l, i) {
      return {
        billLineId: ids.deterministicId('billLine', ['legacy', spec.billId, String(i)]),
        menuItemId: ids.deterministicId('item', ['legacy', l.id || l.name || 'unknown']),
        name: l.name || null,
        size: l.size || null,
        qty: l.qty || 1,
        /* Giá đã snapshot sẵn trong bill — phần legacy làm ĐÚNG, giữ nguyên. */
        price: typeof l.price === 'number' ? l.price : null,
        isFree: !!l.isFree
      };
    });

    var channelType = o.isAppSale ? 'APP' : (o.isToGo ? 'TO_GO' : 'DINE_IN');
    var total = typeof o.total === 'number' ? o.total : null;
    var feePct = channelType === 'APP' && typeof o.appFeePct === 'number' ? o.appFeePct : 0;
    var channelFee = total === null ? null : total * feePct / 100;

    return R.ok({
      bill: {
        billId: ids.deterministicId('bill', ['legacy', spec.billId]),
        storeId: spec.storeId,
        businessDate: spec.businessDate || null,
        occurredAt: o.createdAt || null,
        soldByActorId: o.soldBy || o.staffEmployeeId || null,
        customerId: o.customerPhone
          ? ids.deterministicId('customer', [o.customerPhone]) : null,
        channel: {
          type: channelType,
          appName: o.appName || null,
          /* appFeePct ĐÃ có trong legacy nhưng chưa bao giờ được đọc — map sang
             để đường ống P&L theo kênh dùng được ngay. */
          feePct: feePct
        },
        lines: lines,
        subtotal: typeof o.subtotal === 'number' ? o.subtotal : null,
        discountTotal: typeof o.discount === 'number' ? o.discount : 0,
        total: total,
        channelFee: channelFee,
        netRevenue: total === null ? null : total - channelFee,
        /* Không tự tính netRevenue nếu thiếu total — thà để null còn hơn số sai. */
        status: 'COMPLETED',
        legacySource: { billId: spec.billId }
      },
      ambiguous: ambiguous
    });
  }

  /** Menu legacy → Catalog canonical. Category/recipe link được đánh dấu là suy ra. */
  function mapMenu(spec) {
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'mapMenu cần storeId');
    var raw = spec.items || {};
    var categories = [];
    var categoryByName = Object.create(null);
    var menuItems = [];
    var ambiguous = [];

    Object.keys(raw).forEach(function (key, index) {
      var item = raw[key] || {};
      if (!item.name) return;
      var categoryName = item.type || 'Khác';
      if (!categoryByName[categoryName]) {
        categoryByName[categoryName] = ids.deterministicId('item', ['legacy-category', categoryName]);
        categories.push({
          categoryId: categoryByName[categoryName], storeId: spec.storeId,
          name: categoryName, displayOrder: categories.length, archived: false,
          versionSource: 'legacy-inferred'
        });
      }
      var prices = {};
      if (typeof item.priceM === 'number') prices.M = item.priceM;
      if (typeof item.priceL === 'number') prices.L = item.priceL;
      if (!Object.keys(prices).length && typeof item.price === 'number') prices.M = item.price;
      var menuItemId = ids.deterministicId('item', ['legacy-menu', key]);
      menuItems.push({
        menuItemId: menuItemId, storeId: spec.storeId, name: item.name,
        categoryId: categoryByName[categoryName], prices: prices,
        recipeId: ids.deterministicId('recipe', ['legacy', (spec.recipePrefix || 'togo:') + key]),
        toppingIds: [], displayOrder: typeof item.displayOrder === 'number' ? item.displayOrder : index,
        color: item.color || null, archived: false, archivedAt: null,
        legacySource: { key: key, channel: spec.channel || 'TO_GO' }
      });
      ambiguous.push({
        code: AMBIGUOUS.NO_RECIPE_VERSION,
        detail: 'recipeId của món ' + key + ' được suy từ key legacy, chưa chứng minh recipe version lịch sử'
      });
    });
    return R.ok({ categories: categories, menuItems: menuItems, ambiguous: ambiguous });
  }

  return {
    AMBIGUOUS: AMBIGUOUS,
    STATUS_MAP: STATUS_MAP,
    mapUnit: mapUnit,
    mapLedgerEntry: mapLedgerEntry,
    mapRecipe: mapRecipe,
    mapBill: mapBill,
    mapMenu: mapMenu
  };
});

/* ===== src/layers/legacy-firebase-adapter/read-port.js ===== */
/** Read port schema cũ. Firebase client được inject; module không có bất kỳ API ghi nào. */
GIEO.define('legacy-firebase-adapter/read-port', [
  'shared-kernel/result',
  'legacy-firebase-adapter/legacy-paths',
  'legacy-firebase-adapter/mappers'
], function (R, paths, mappers) {
  'use strict';

  function createReader(client) {
    client = client || {};

    function call(name, args) {
      if (typeof client[name] !== 'function') {

      spec = spec || {};
      return firestoreQuery(spec.domain === 'prep' ? 'prepTransactions' : 'stockTransactions', {

        if (R.isErr(rows)) return rows;
        var mapped = [];
        var ambiguous = [];
        Object.keys(rows.value || {}).forEach(function (id) {

            domain: spec.domain || 'raw'

      return Promise.all([loadUnit(spec), loadLedger(spec)]).then(function (rows) {

        if (R.isErr(rows[1])) return rows[1];
        return R.ok({
          unit: rows[0].value.unit,
          ledgerEntries: rows[1].value.entries,
          allocations: [],
          ambiguous: (rows[0].value.ambiguous || []).concat(rows[1].value.ambiguous || []),
          sourceDrift: rows[0].value.sourceDrift

      });
    }

    function loadBills(spec) {
      spec = spec || {};
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(spec.businessDate || '');

      return rtdb('orders', Number(m[2]) + '/' + Number(m[3])).then(function (live) {

        }
        return firestoreDoc('ordersArchive', archiveKey).then(function (archived) {
          if (R.isErr(archived)) return archived;
          return R.ok({ source: 'LEGACY_ARCHIVE', orders: (archived.value && archived.value.orders) || {} });

      }).then(function (rows) {
        if (R.isErr(rows)) return rows;
        var bills = [], ambiguous = [];
        Object.keys(rows.value.orders).forEach(function (id) {
          var mapped = mappers.mapBill({

        if (R.isErr(rows)) return rows;
        return mappers.mapMenu({
          items: rows.value || {}, storeId: spec.storeId,

          recipePrefix: source === 'menuTogo' ? 'togo:' : 'dinein:'

      var path = paths.get(source).path;
      try {
        return client.rtdbSubscribe(path, function (items) {
          listener(mappers.mapMenu({
            items: items || {}, storeId: spec.storeId,
            channel: source === 'menuTogo' ? 'TO_GO' : 'DINE_IN',
            recipePrefix: source === 'menuTogo' ? 'togo:' : 'dinein:'
          }));
        }, function (error) {
          listener(R.err('RETRYABLE', 'theo dõi menu legacy thất bại: ' +
            (error && error.message ? error.message : error)));
        });
      } catch (error) {
        listener(R.err('RETRYABLE', 'khởi tạo theo dõi menu thất bại: ' + error.message));
        return function () {};
      }
    }

    return {
      loadUnit: loadUnit,
      loadLedger: loadLedger,
      loadUnitTrace: loadUnitTrace,
      loadBills: loadBills,
      loadMenu: loadMenu,
      watchMenu: watchMenu

/**
 * Ranh giới ghi NGUYÊN TỬ cho MutationPlan.
 *
 * Contract: GIEO-SYSTEM-REBUILD-PLAN.md §2 (data flow chuẩn),
 * FIFO-CORE-ARCHITECTURE-V2.md §7 (idempotency).
 *
 * Một `MutationPlan` mang TẤT CẢ thay đổi của một operation: vật chất (Unit) +
 * ledger + projection + trace + domain record. Ghi hết hoặc không ghi gì.
 *
 * Vì sao điều này quan trọng hơn vẻ ngoài: legacy có những chỗ allocate xong
 * rồi ghi sổ hỏng mà không rollback (bug #21), và những chỗ ghi `currentStock`
 * tách rời khỏi ledger nên hai bên lệch nhau âm thầm. Cả hai biến mất nếu
 * không tồn tại đường ghi từng phần.
 *
 * Module này KHÔNG import Firebase SDK. Nó nhận một `transactionRunner` được
 * tiêm vào — adapter thật cho nó một transaction Firestore, test cho nó bản
 * in-memory. Nhờ vậy domain core không bao giờ chạm SDK (blueprint §2 quy tắc 2).
 */
GIEO.define('persistence-firebase/atomic-commit', [
  'shared-kernel/result',
  'shared-kernel/operation-state',
  'persistence-firebase/canonical-paths'
], function (R, opState, paths) {
  'use strict';

  /**
   * Dịch MutationPlan thành danh sách thao tác ghi có path cụ thể.
   * Tách riêng để kiểm được plan sinh ra đúng những path nào mà không cần ghi thật.
   */
  function planToWrites(plan, ctx) {
    var writes = [];
    var errors = [];

    function add(name, args, data, op) {
      var p = paths.path(name, ctx, args);
      if (R.isErr(p)) { errors.push(p.error.message); return; }
      writes.push({ kind: p.value.kind, path: p.value.path, op: op || 'set', data: data });
    }

    (plan.unitChanges || []).forEach(function (u) {
      add('unit', { unitId: u.unitId }, u);
      /* Live layer chỉ phản chiếu unit đang mở — hũ đã hết thì gỡ khỏi RTDB,
         đúng vai trò "hot layer" của legacy. */
      if (u.status === 'OPEN' || u.status === 'CONSUMING') {
        add('unitLive', { itemId: u.itemId, unitId: u.unitId }, {
          unitBase: u.remainingQty, status: u.status, openedAt: u.openedAt
        });
      } else {
        add('unitLive', { itemId: u.itemId, unitId: u.unitId }, null, 'remove');
      }
    });

    (plan.ledgerEntries || []).forEach(function (e) {
      add('ledger', { entryId: e.entryId || null }, e);
    });

    (plan.domainRecords || []).forEach(function (r) {
      var map = {
        bill: ['billLive', function (x) { return { businessDate: x.businessDate, billId: x.billId }; }],
        billArchive: ['billArchive', function (x) { return { archiveKey: x.archiveKey }; }],
        archiveRegistry: ['archiveRegistry', function (x) { return { businessDate: x.businessDate }; }],
        prepBatch: ['prepBatch', function (x) { return { prepBatchId: x.prepBatchId }; }],
        lostReport: ['lostReport', function (x) { return { reportId: x.lostReportId }; }],
        stockCount: ['stockCount', function (x) { return { countId: x.stockCountId }; }],
        cashSegment: ['shiftSegment', function (x) { return { businessDate: x.businessDate, seq: x.seq }; }],
        expense: ['auditLog', function (x) { return { id: x.expenseId }; }],
        unitSnapshot: ['unitSnapshot', function (x) { return { unitId: x.unitId, revisionNo: x.revisionNo }; }],
        unitSnapshotHead: ['unitSnapshotHead', function (x) { return { unitId: x.unitId }; }],
        monthlySnapshot: ['monthlySnapshot', function (x) { return { period: x.period, revisionNo: x.revisionNo }; }],
        monthlySnapshotHead: ['monthlySnapshotHead', function (x) { return { period: x.period }; }]
      };
      var m = map[r.type];
      if (!m) {
        /* Loại bản ghi chưa khai path là lỗi cấu hình, không phải chuyện bỏ qua
           được — ghi vào hư không là cách dữ liệu biến mất im lặng. */
        errors.push('domainRecord loại "' + r.type + '" chưa khai path canonical');
        return;
      }
      add(m[0], m[1](r.record), r.record);
    });

    (plan.traceChanges || []).forEach(function (t, i) {
      add('traceDependency', { id: (plan.operationId || 'op') + '.' + i }, t);
    });

    /* Purge chỉ nhận path canonical CỤ THỂ từ compaction safety gate. Chặn
       snapshot ở cả domain lẫn adapter để invariant C3 không phụ thuộc một lớp. */
    (plan.rawRemovals || []).forEach(function (r) {
      var prefix = 'orgs/' + ctx.organizationId + '/stores/' + ctx.storeId + '/';
      if (!r || (r.kind !== paths.RTDB && r.kind !== paths.FIRESTORE) ||
          typeof r.path !== 'string' || r.path.indexOf(prefix) !== 0 ||
          /(^|\/)snapshots\//.test(r.path)) {
        errors.push('rawRemoval không phải path canonical an toàn');
        return;
      }
      writes.push({ kind: r.kind, path: r.path, op: 'remove', data: null });
    });

    if (plan.audit) {
      add('auditLog', { id: plan.operationId }, plan.audit);
    }

    if (errors.length) {
      return R.err('VALIDATION', 'không dịch được plan thành path: ' + errors.join('; '), { errors: errors });
    }
    return R.ok(writes);
  }

  /**
   * @param deps.transactionRunner  (fn) => Promise — chạy fn trong 1 transaction
   * @param deps.operationStore     kho operation để claim/hoàn tất
   */
  function createCommitter(deps) {
    deps = deps || {};
    var runner = deps.transactionRunner;
    if (typeof runner !== 'function') {
      throw new Error('[atomic-commit] cần transactionRunner — module này không tự import Firebase SDK');
    }

    /**
     * Ghi cả plan trong một transaction.
     *
     * Bản ghi `operations/{operationId}` được ghi TRONG CÙNG transaction với dữ
     * liệu — nếu tách ra, sẽ có cửa sổ mà dữ liệu đã ghi nhưng operation chưa
     * đánh dấu hoàn tất, và lần chạy lại sẽ ghi đúp.
     */
    function commit(plan, ctx) {
      if (!plan || !plan.operationId) {
        return Promise.resolve(R.err('VALIDATION', 'plan thiếu operationId'));
      }
      var w = planToWrites(plan, ctx);
      if (R.isErr(w)) return Promise.resolve(w);
      var writes = w.value;

      var opPath = paths.path('operation', ctx, { operationId: plan.operationId });
      if (R.isErr(opPath)) return Promise.resolve(opPath);

      writes.push({
        kind: opPath.value.kind,
        path: opPath.value.path,
        op: 'set',
        data: {
          operationId: plan.operationId,
          status: opState.STATES.COMPLETED,
          command: plan.audit ? plan.audit.command : null,
          actorId: plan.audit ? plan.audit.actorId : null,
          storeId: ctx.storeId,
          businessDate: ctx.businessDate,
          completedAt: ctx.clock.now(),
          writeCount: writes.length
        }
      });

      return Promise.resolve()
        .then(function () { return runner(writes); })
        .then(function () {
          return R.ok({
            operationId: plan.operationId,
            writeCount: writes.length,
            paths: writes.map(function (x) { return x.path; })
          });
        })
        .catch(function (e) {
          /* Transaction hỏng = KHÔNG có gì được ghi. Không cần rollback thủ
             công, nhưng phải nói rõ là thử lại được hay cần người xử lý. */
          var retryable = !!(e && e.retryable);
          return R.err(retryable ? 'RETRYABLE' : 'MANUAL_REVIEW',
            'ghi nguyên tử thất bại, KHÔNG có thay đổi nào được ghi: ' +
            (e && e.message ? e.message : e));
        });
    }

    return { commit: commit, planToWrites: planToWrites };
  }

  /**
   * Transaction runner in-memory — cho test và cho chế độ shadow/simulate,
   * đúng giai đoạn READ-ONLY hiện tại (hệ thống cũ vẫn chạy production).
   */
  function createInMemoryRunner(opts) {
    opts = opts || {};
    var store = Object.create(null);
    var committed = [];
    var failNext = 0;

    function runner(writes) {
      if (failNext > 0) {
        failNext -= 1;
        var e = new Error(opts.failMessage || 'transaction hỏng');
        e.retryable = !!opts.failRetryable;
        throw e;
      }
      /* Áp tất cả hoặc không áp gì — dựng bản nháp rồi mới gán. */
      var draft = Object.assign(Object.create(null), store);
      writes.forEach(function (w) {
        if (w.op === 'remove') delete draft[w.path];
        else draft[w.path] = w.data;
      });
      store = draft;
      committed.push(writes);
      return true;
    }

    return {
      runner: runner,
      failOnce: function () { failNext += 1; },
      read: function (path) { return store[path]; },
      keys: function () { return Object.keys(store).sort(); },
      commitCount: function () { return committed.length; }
    };
  }

  return {
    planToWrites: planToWrites,
    createCommitter: createCommitter,
    createInMemoryRunner: createInMemoryRunner
  };
});

    loyaltyLedger: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/loyaltyLedger/' + a.entryId; } },
    loyaltyEffects: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/loyaltyEffects/' + a.billId; } },
    customer: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/customers/' + a.customerId; } },
    alert: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/alerts/' + a.alertId; } },
    auditLog: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/auditLogs/' + a.id; } },
    traceDependency: { kind: FIRESTORE, build: function (ctx, a) { return base(ctx) + '/traceDependencies/' + a.id; } }
  };

  function path(name, ctx, args) {
    var b = BUILDERS[name];
    if (!b) return R.err('VALIDATION', 'không có path canonical tên "' + name + '"');
    var v = validateCtx(ctx);
    if (R.isErr(v)) return v;
    return R.ok({ kind: b.kind, path: b.build(ctx, args || {}) });
  }

  /**
   * Path PROTECTED giữ nguyên tên cũ, KHÔNG nằm dưới namespace orgs/.
   * Tách riêng để không ai vô tình "chuẩn hoá" nó theo mẫu chung.
   */
  var PROTECTED = {
    bankConfirmation: { kind: RTDB, build: function (a) { return 'bank_confirmations/' + a.bankOrderId; } }
  };

  function protectedPath(name, args) {
    var p = PROTECTED[name];
    if (!p) return R.err('VALIDATION', 'không có protected path "' + name + '"');
    return R.ok({ kind: p.kind, path: p.build(args || {}), isProtected: true });
  }

  function listNames() { return Object.keys(BUILDERS).sort(); }

  return {
    RTDB: RTDB,
    FIRESTORE: FIRESTORE,
    path: path,
    protectedPath: protectedPath,
    listNames: listNames
  };
});

/* ===== src/layers/read-layer/gateway.js ===== */
/**
 * Read gateway — CỔNG ĐỌC DUY NHẤT.
 *
 * Contract: UNIFIED-READ-LAYER-CONTRACT-V1.md.
 *
 * Ba invariant nặng nhất được cài vào chính cấu trúc, không phải bằng lời nhắc:
 *
 * R3 — MỘT canonical query, MỘT implementation. Legacy có 2 pipeline doanh thu
 *      độc lập (POS tự tính, QUANLY tự tính) không đảm bảo khớp nhau. Ở đây cả
 *      hai app gọi cùng một hàm, nên không tồn tại khả năng lệch.
 *
 * R5/§5 — PHÂN QUYỀN ĐỌC. Gap đã xác nhận: Reporting legacy có 0% phân quyền —
 *      QUANLY dùng một tài khoản Firebase dùng chung nên mọi người thấy toàn bộ
 *      P&L/COGS/khách hàng. Ở đây mọi API đăng ký quyền, và MẶC ĐỊNH ĐÓNG:
 *      query chưa khai quyền thì bị từ chối.
 *
 * R8/§3 — COGS luôn 2 vế. Cấm tồn tại field tên `cogsActual` chứa theoretical.
 */
GIEO.define('read-layer/gateway', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'store-context/access',
  'read-layer/merge-canonical',
  'fifo-core/projection',
  'traceability/trace',
  'catalog/menu'
], function (ids, R, access, merge, projection, traceLib, menuLib) {
  'use strict';

  /**
   * Đăng ký query đọc. Đi qua CÙNG sổ quyền với command ghi — quyền đọc không
   * phải hạng hai.
   */
  function registerQuery(name, spec) {
    access.registerCommand(name, {
      authority: spec.authority,
      mutates: false,
      sources: spec.sources,
      crossStore: spec.crossStore
    });
    return name;
  }

  var Q = {
    GetUnitTrace: registerQuery('GetUnitTrace', { authority: 'EXECUTE' }),
    GetMenu: registerQuery('GetMenu', { authority: 'EXECUTE' }),
    GetInventoryLevel: registerQuery('GetInventoryLevel', { authority: 'EXECUTE' }),
    GetConsumption: registerQuery('GetConsumption', { authority: 'REVIEW_APPROVE_CORRECT' }),
    /* Dữ liệu nhạy cảm mặc định KHÔNG thuộc tầng EXECUTE (quy tắc P3). */
    GetRevenue: registerQuery('GetRevenue', { authority: 'REVIEW_APPROVE_CORRECT' }),
    GetCOGS: registerQuery('GetCOGS', { authority: 'REVIEW_APPROVE_CORRECT' }),
    GetPnL: registerQuery('GetPnL', { authority: 'MASTER_CONFIGURE' }),
    GetCustomerReport: registerQuery('GetCustomerReport', { authority: 'MASTER_CONFIGURE' })
  };

  /** Cổng chung: quyền + storeId bắt buộc, trước khi chạm dữ liệu. */
  function guard(queryName, ctx, spec) {
    if (!ctx || !ctx.actor) return R.err('FORBIDDEN', 'không có context — mọi read phải biết ai đọc');
    var storeId = (spec && spec.storeId) || ctx.storeId;
    if (!ids.isId(storeId, 'store')) {
      return R.err('VALIDATION', 'mọi query phải nêu rõ storeId (quy tắc P5)');
    }
    var auth = access.authorize(ctx.actor, queryName, storeId);
    if (R.isErr(auth)) return auth;
    return R.ok(storeId);
  }

  /** Vòng đời đầy đủ 1 Unit. */
  function getUnitTrace(ctx, spec) {
    var g = guard(Q.GetUnitTrace, ctx, spec);
    if (R.isErr(g)) return g;
    if (!ids.isId(spec.unitId, 'unit')) return R.err('VALIDATION', 'getUnitTrace cần unitId hợp lệ');

    return merge.resolve({
      snapshot: spec.snapshot,
      computeLive: function () {
        if (!spec.unit) return R.ok(null);
        return traceLib.buildUnitTrace({
          unit: spec.unit,
          ledgerEntries: spec.ledgerEntries || [],
          allocations: spec.allocations || []
        });
      },
      legacy: spec.legacyTrace,
      computedAt: ctx.clock.now()
    });
  }

  /** Tồn kho hiện tại — công thức DUY NHẤT của fifo-core/projection. */
  function getInventoryLevel(ctx, spec) {
    var g = guard(Q.GetInventoryLevel, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      computeLive: function () {
        var r = projection.computeCurrentStock({
          units: spec.units || [],
          untrackedBase: spec.untrackedBase || 0,
          ledgerEntries: spec.ledgerEntries || []
        });
        return R.isErr(r) ? r : R.ok(r.value);
      },
      computedAt: ctx.clock.now()
    });
  }

  /** Catalog canonical; POS chỉ đọc, không bao giờ ghi menu. */
  function getMenu(ctx, spec) {
    var g = guard(Q.GetMenu, ctx, spec);
    if (R.isErr(g)) return g;
    return merge.resolve({
      cache: spec.cache,
      computeLive: function () {
        return menuLib.buildMenuView({
          categories: spec.categories || [], menuItems: spec.menuItems || []
        });
      },
      legacy: spec.legacyMeta ? function () { return R.ok(spec.legacyMeta); } : null,
      computedAt: ctx.clock.now()
    });
  }

  /**
   * Doanh thu — MỘT implementation cho cả POS lẫn QUANLY (R3).
   * Trừ phí sàn để ra doanh thu thuần: đường ống legacy chưa từng nối.
   */
  function getRevenue(ctx, spec) {
    var g = guard(Q.GetRevenue, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      snapshot: spec.snapshot,
      cache: spec.cache,
      computeLive: function () {
        var bills = spec.bills || [];
        var byChannel = {};
        var gross = 0, fees = 0, net = 0, discounts = 0;

        bills.forEach(function (b) {
          gross += b.total;
          fees += b.channelFee || 0;
          net += b.netRevenue;
          discounts += b.discountTotal || 0;
          var k = b.channel ? b.channel.type : 'UNKNOWN';
          if (!byChannel[k]) byChannel[k] = { gross: 0, fees: 0, net: 0, billCount: 0 };
          byChannel[k].gross += b.total;
          byChannel[k].fees += b.channelFee || 0;
          byChannel[k].net += b.netRevenue;
          byChannel[k].billCount += 1;
        });

        return R.ok({
          billCount: bills.length,
          grossRevenue: gross,
          discountTotal: discounts,
          channelFees: fees,
          netRevenue: net,
          /* Tách theo kênh — dữ liệu legacy đã có nhưng P&L chỉ 1 số tổng. */
          byChannel: byChannel
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * COGS — BẮT BUỘC 2 vế (§3, invariant R8).
   *
   * Cộng từ `bill.cogs` đã ghi lúc bán (V4: đọc versionId đã lưu, KHÔNG resolve
   * lại). Bill nào thiếu vế actual thì tổng actual là null — không bù bằng
   * theoretical để tổng trông đẹp.
   */
  function getCOGS(ctx, spec) {
    var g = guard(Q.GetCOGS, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      snapshot: spec.snapshot,
      cache: spec.cache,
      computeLive: function () {
        var bills = spec.bills || [];
        var theoretical = 0;
        var actual = 0;
        var missingActual = [];
        var versionIds = [];

        bills.forEach(function (b) {
          var c = b.cogs;
          if (!c) { missingActual.push({ billId: b.billId, reason: 'NO_COGS' }); return; }
          theoretical += c.cogsTheoretical;
          if (c.cogsActual === null) {
            missingActual.push({ billId: b.billId, reason: c.cogsActualReason || 'UNKNOWN' });
          } else {
            actual += c.cogsActual;
          }
          if (c.basis && c.basis.costBasisVersionIds) {
            versionIds = versionIds.concat(c.basis.costBasisVersionIds);
          }
        });

        var actualComplete = missingActual.length === 0 && bills.length > 0;
        var cogsActual = actualComplete ? actual : null;

        return R.ok({
          cogsTheoretical: theoretical,
          cogsActual: cogsActual,
          cogsActualPartial: actualComplete ? null : actual,
          variance: cogsActual === null ? null : cogsActual - theoretical,
          variancePct: (cogsActual === null || theoretical === 0)
            ? null : ((cogsActual - theoretical) / theoretical) * 100,
          missingActual: missingActual,
          basis: {
            costBasisVersionIds: versionIds.filter(function (v, i, a) { return v && a.indexOf(v) === i; })
          }
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * P&L. Kỳ đã chốt → đọc thẳng snapshot, không tính lại (§3.1 compaction).
   * `frozen` trong meta cho UI biết cột nào là số đóng băng (quy tắc T3).
   */
  function getPnL(ctx, spec) {
    var g = guard(Q.GetPnL, ctx, spec);
    if (R.isErr(g)) return g;

    return merge.resolve({
      snapshot: spec.closing,
      computeLive: function () {
        var rev = spec.revenue;
        var cogs = spec.cogs;
        var exp = spec.expenses;
        if (!rev || !cogs) return R.ok(null);

        var grossProfit = rev.netRevenue - (cogs.cogsActual !== null ? cogs.cogsActual : cogs.cogsTheoretical);
        return R.ok({
          netRevenue: rev.netRevenue,
          cogsTheoretical: cogs.cogsTheoretical,
          cogsActual: cogs.cogsActual,
          /* Nói rõ lãi đang tính theo vế nào — legacy chỉ có 1 số nên không cần
             nói, và cũng vì thế không ai biết nó là số gì. */
          cogsBasisUsed: cogs.cogsActual !== null ? 'ACTUAL' : 'THEORETICAL',
          grossProfit: grossProfit,
          expenses: exp ? exp.total : 0,
          fixedExpenses: exp ? exp.fixed : 0,
          variableExpenses: exp ? exp.variable : 0,
          netProfit: grossProfit - (exp ? exp.total : 0),
          /* Còn khoản ước tính thì lãi này chưa phải số cuối. */
          hasEstimatedExpenses: !!(exp && exp.estimated > 0)
        });
      },
      computedAt: ctx.clock.now()
    });
  }

  /**
   * So sánh 2 kỳ — mỗi cột mang cờ `frozen` riêng (quy tắc T3).
   * Legacy để cả 2 cột tính sống nên so sánh trôi theo thời gian.
   */
  function comparePeriods(ctx, spec) {
    var g = guard(Q.GetPnL, ctx, spec);
    if (R.isErr(g)) return g;
    if (!spec.current || !spec.previous) {
      return R.err('VALIDATION', 'so sánh kỳ cần cả 2 kỳ');
    }
    return R.ok({
      current: { data: spec.current.data, frozen: spec.current.meta.frozen },
      previous: { data: spec.previous.data, frozen: spec.previous.meta.frozen },
      /* Cả 2 cột đều sống thì so sánh này sẽ đổi theo thời gian — nói ra. */
      bothLive: !spec.current.meta.frozen && !spec.previous.meta.frozen
    });
  }

  return {
    QUERIES: Q,
    registerQuery: registerQuery,
    getUnitTrace: getUnitTrace,
    getMenu: getMenu,
    getInventoryLevel: getInventoryLevel,
    getRevenue: getRevenue,
    getCOGS: getCOGS,
    getPnL: getPnL,
    comparePeriods: comparePeriods
  };
});

/* ===== src/layers/read-layer/merge-canonical.js ===== */
/**
 * merge-canonical — NƠI DUY NHẤT biết cả LIVE lẫn COMPACT.
 *
 * Contract: UNIFIED-READ-LAYER-CONTRACT-V1.md §4, invariant R1/R2.
 *
 * Gate của Phase 7: không còn UI nào tự branch `if (còn raw) ... else đọc
 * archive/compact`. Cách duy nhất bảo đảm điều đó là chỉ có đúng một nơi trong
 * toàn hệ thống được phép biết có hai nguồn.
 *
 * Thứ tự resolve (§4.1):
 *   1. SNAPSHOT (đã chốt/compacted)  → đọc thẳng, KHÔNG tính lại
 *   2. CACHE (tính lại được)          → nếu còn hợp lệ
 *   3. LIVE RAW                        → tính từ ledger/unit/bill
 *   4. LEGACY                          → qua adapter, CHỈ ĐỌC
 */
GIEO.define('read-layer/merge-canonical', ['shared-kernel/result'], function (R) {
  'use strict';

  var SOURCE = { SNAPSHOT: 'SNAPSHOT', CACHE: 'CACHE', LIVE: 'LIVE', LEGACY: 'LEGACY' };

  /**
   * Bọc kết quả kèm metadata nguồn.
   *
   * `meta` để CHẨN ĐOÁN và hiển thị cờ — KHÔNG phải để UI branch logic theo
   * nguồn (R1). UI đọc `data`, và `data` giống nhau bất kể đến từ đâu.
   */
  function wrap(data, meta) {
    return R.ok({
      data: data,
      meta: {
        sources: (meta && meta.sources) || [],
        frozen: !!(meta && meta.frozen),
        versionIds: (meta && meta.versionIds) || {},
        ambiguous: (meta && meta.ambiguous) || [],
        computedAt: (meta && meta.computedAt) || null
      }
    });
  }

  /**
   * Chọn nguồn theo đúng thứ tự ưu tiên.
   *
   * @param spec.snapshot  kết quả đã đóng băng (nếu có)
   * @param spec.cache     kết quả cache còn hợp lệ (nếu có)
   * @param spec.computeLive  () => Result  — chỉ gọi khi cần
   * @param spec.legacy    () => Result     — chỉ gọi khi live không có gì
   */
  function resolve(spec) {
    if (spec.snapshot) {
      /* Đã chốt thì ĐỌC THẲNG. "Con số chủ quán đã đọc và đã dùng để ra quyết
         định thì không được đổi sau lưng." */
      var snapshotData = spec.snapshot.canonical || spec.snapshot.values || spec.snapshot;
      return wrap(snapshotData, {
        sources: [SOURCE.SNAPSHOT], frozen: true,
        versionIds: spec.snapshot.versionIds || snapshotData.versionIds || {}, computedAt: spec.computedAt
      });
    }
    if (spec.cache) {
      return wrap(spec.cache, {
        sources: [SOURCE.CACHE], frozen: false, computedAt: spec.computedAt
      });
    }

    if (typeof spec.computeLive === 'function') {
      var live = spec.computeLive();
      if (R.isErr(live)) return live;
      if (live.value !== null && live.value !== undefined) {
        var sources = [SOURCE.LIVE];
        var ambiguous = [];

        /* Dữ liệu cũ không đủ nghĩa: đánh dấu AMBIGUOUS, KHÔNG suy đoán
           (invariant #12). UI/report hiện "cần rà thủ công" thay vì im lặng
           dựng số. */
        if (typeof spec.legacy === 'function') {
          var lg = spec.legacy();
          if (R.isOk(lg) && lg.value) {
            sources.push(SOURCE.LEGACY);
            if (lg.value.ambiguous) ambiguous = ambiguous.concat(lg.value.ambiguous);
          }
        }
        return wrap(live.value, {
          sources: sources, frozen: false, ambiguous: ambiguous, computedAt: spec.computedAt
        });
      }
    }

    if (typeof spec.legacy === 'function') {
      var only = spec.legacy();
      if (R.isErr(only)) return only;
      if (only.value) {
        return wrap(only.value, {
          sources: [SOURCE.LEGACY], frozen: false,
          ambiguous: only.value.ambiguous || [], computedAt: spec.computedAt
        });
      }
    }

    return R.err('NOT_FOUND', 'không có nguồn nào trả được dữ liệu cho truy vấn này');
  }

  /**
   * Cache invalidate THEO PHẠM VI, không xoá sạch (quy tắc K3).
   *
   * Legacy `clearSalesCache()`/`invalidateSalesCache()` xoá TOÀN BỘ cache mọi
   * ngày mỗi khi đổi cấu hình ảnh hưởng giá vốn, rồi tính lại bằng version
   * HIỆN TẠI — chính là instance #2/#3 của lớp lỗi versioning.
   *
   * Ở đây chỉ những ngày bị ảnh hưởng mới bị bỏ, và khi tính lại thì dùng
   * version lịch sử của từng ngày nên kết quả GIỐNG HỆT kết quả cũ.
   */
  function invalidateScope(cacheKeys, spec) {
    var from = spec.fromDateKey;
    var to = spec.toDateKey;
    if (!from || !to) return R.err('VALIDATION', 'invalidate cần phạm vi ngày — cấm xoá sạch cache');

    var kept = [];
    var dropped = [];
    cacheKeys.forEach(function (k) {
      var d = k.dateKey;
      if (d >= from && d <= to && (!spec.storeId || k.storeId === spec.storeId)) dropped.push(k);
      else kept.push(k);
    });
    return R.ok({ kept: kept, dropped: dropped });
  }

  return {
    SOURCE: SOURCE,
    wrap: wrap,
    resolve: resolve,
    invalidateScope: invalidateScope
  };
});

/* ===== src/layers/commands/approval.js ===== */
/**
 * Lệnh duyệt.
 *
 * Nguồn: FIFO-CORE-ARCHITECTURE-V2.md §8, §10b.3, §10b.4;
 *        FIFO-CHAIN-TRACE-STOCK-COUNT-V1.md "FIX BẮT BUỘC".
 *
 * §10b.3 — IDEMPOTENCY ÁP CHO CẢ HÀNH ĐỘNG DUYỆT, không chỉ hành động tạo.
 * Legacy `ApproveStockCount` không kiểm tra status trước khi apply và không có
 * busy-guard, nên double-click hoặc 2 người duyệt cùng lúc cộng đúp variance.
 * Ở đây mọi duyệt đi qua pipeline chung nên có claim + id xác định.
 *
 * §10b.4 — `ApproveLostContainer` LÀ GAP CÓ BẰNG CHỨNG CHẮC CHẮN NHẤT TOÀN BỘ
 * AUDIT, xác nhận ĐỘC LẬP 3 LẦN từ 3 góc khác nhau:
 *   - FIFO audit: grep `approveLostReport` trong quanlygieo.html → 0 kết quả
 *   - Alerts audit: không có nút xử lý nào cho báo mất
 *   - Stock-count chain: route duyệt không tồn tại, khiến container "mất" lặp
 *     lại vô hạn mỗi kỳ kiểm kho
 * Hệ quả ở legacy: Unit KHÔNG BAO GIỜ đạt tới nhánh LOST, dù logic nhánh LOST
 * và logic khôi phục `submitFoundLostContainer` đều đã viết sẵn và đúng — chúng
 * chỉ không bao giờ chạy tới vì thiếu đúng mắt xích này.
 */
GIEO.define('commands/approval', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/unit',
  'fifo-core/reconciliation'
], function (ids, R, pipeline, unitLib, reconciliation) {
  'use strict';

  var COUNT_STATUS = {
    PENDING: 'PENDING',
    APPROVED: 'APPROVED',
    /* Legacy chỉ có `approved` và một con số `failedCount`. Chain-trace yêu cầu
       state này để biết phiếu chưa áp hết và dòng nào còn lại. */
    PARTIALLY_APPLIED: 'PARTIALLY_APPLIED',
    REJECTED: 'REJECTED'
  };

  /**
   * ApproveLostContainer — MẮT XÍCH LEGACY CHƯA TỪNG CÓ.
   *
   * ReportLostContainer (POS) → lostReport PENDING_REVIEW
   *                           → ApproveLostContainer (QUANLY, ở đây)
   *                           → Unit vào nhánh LOST
   *                           → RestoreFoundContainer chạy được khi tìm lại
   */
  var ApproveLostContainer = pipeline.defineCommand({
    name: 'ApproveLostContainer',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['approvelost', input.lostReportId]);
    },

    validate: function (input) {
      if (!input || !input.lostReportId) return R.err('VALIDATION', 'cần lostReportId');
      if (!input.decision || (input.decision !== 'APPROVE' && input.decision !== 'REJECT')) {
        return R.err('VALIDATION', "decision phải là 'APPROVE' hoặc 'REJECT'");
      }
      if (!input.reason) {
        return R.err('VALIDATION', 'duyệt/từ chối báo mất phải có lý do (§25 — approval bắt buộc có reason)');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var report = input.lostReport;
      if (!report) return R.err('NOT_FOUND', 'không tìm thấy phiếu báo mất');
      if (report.status !== 'PENDING_REVIEW') {
        /* Fail-closed: duyệt lại phiếu đã xử lý là no-op có kiểm soát, không
           phải áp lần hai (§27 invariant 8). */
        return R.err('PRECONDITION', 'phiếu báo mất đã được xử lý (' + report.status + ')');
      }

      var opId = ids.deterministicId('operation', ['approvelost', input.lostReportId]);
      var plan = pipeline.emptyPlan();

      if (input.decision === 'REJECT') {
        plan.domainRecords.push({
          type: 'lostReport',
          record: Object.assign({}, report, {
            status: 'REJECTED', reviewedBy: ctx.actor.actorId,
            reviewedAt: ctx.clock.now(), reviewReason: input.reason
          })
        });
        return R.ok(plan);
      }

      var unit = (input.units || []).filter(function (u) { return u.unitId === report.unitId; })[0];
      if (!unit) return R.err('NOT_FOUND', 'không tìm thấy lô ' + report.unitId);

      var lost = unitLib.markLost(unit, {
        at: ctx.clock.now(), actorId: ctx.actor.actorId,
        operationId: opId, lostReportId: input.lostReportId
      });
      if (R.isErr(lost)) return lost;

      plan.unitChanges.push(lost.value);
      plan.domainRecords.push({
        type: 'lostReport',
        record: Object.assign({}, report, {
          status: 'APPROVED', reviewedBy: ctx.actor.actorId,
          reviewedAt: ctx.clock.now(), reviewReason: input.reason
        })
      });
      plan.ledgerEntries.push({
        domain: 'raw', type: 'LOST', itemId: unit.itemId, storeId: ctx.storeId,
        unitId: unit.unitId, qtyDelta: -unit.remainingQty,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'lostReport', referenceId: input.lostReportId, reason: input.reason
      });
      /* Trừ trách nhiệm nhân viên là side-effect, đi qua handler đăng ký riêng. */
      plan.events.push({
        type: 'ContainerFound',
        unitId: unit.unitId, storeId: ctx.storeId, businessDate: ctx.businessDate,
        lostReportId: input.lostReportId, direction: 'LOST_APPROVED'
      });
      plan.projectionRecomputes.push({ itemId: unit.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  /**
   * ApproveStockCount — duyệt phiếu kiểm kê.
   *
   * Bốn yêu cầu của chain-trace:
   *  1. đi qua ĐÚNG đường điều chỉnh của FIFO Engine, không có code path ghi
   *     thẳng currentStock song song như `applyStockTransaction`
   *  2. idempotent (§10b.3)
   *  3. dòng lỗi lưu CHÍNH XÁC dòng nào, không chỉ một con số failedCount
   *  4. có state PARTIALLY_APPLIED thay vì luôn APPROVED
   */
  var ApproveStockCount = pipeline.defineCommand({
    name: 'ApproveStockCount',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['approvecount', input.stockCountId]);
    },

    validate: function (input) {
      if (!input || !input.stockCountId) return R.err('VALIDATION', 'cần stockCountId');
      if (!input.reason) return R.err('VALIDATION', 'duyệt kiểm kê phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var count = input.stockCount;
      if (!count) return R.err('NOT_FOUND', 'không tìm thấy phiếu kiểm kê');
      if (count.status !== COUNT_STATUS.PENDING && count.status !== COUNT_STATUS.PARTIALLY_APPLIED) {
        return R.err('PRECONDITION', 'phiếu kiểm kê đã duyệt (' + count.status + ')');
      }

      var opId = ids.deterministicId('operation', ['approvecount', input.stockCountId]);
      var plan = pipeline.emptyPlan();
      var applied = [];
      var failed = [];

      var unitsById = Object.create(null);
      (input.units || []).forEach(function (u) { unitsById[u.unitId] = u; });

      (count.lines || []).forEach(function (line) {
        /* Dòng đã áp ở lần duyệt trước thì bỏ qua — đây là phần làm cho việc
           duyệt lại phiếu PARTIALLY_APPLIED không cộng đúp. */
        if (line.applied) { applied.push(line.itemId); return; }

        if (line.unitId) {
          var unit = unitsById[line.unitId];
          if (!unit) {
            failed.push({ itemId: line.itemId, unitId: line.unitId, reason: 'không tìm thấy lô' });
            return;
          }
          var rc = reconciliation.physicalReconciliation(unit, {
            actualQty: line.countedQty, at: ctx.clock.now(),
            actorId: ctx.actor.actorId,
            operationId: ids.deterministicId('operation', ['approvecount', input.stockCountId, line.itemId]),
            method: 'stock_count', reason: input.reason
          });
          if (R.isErr(rc)) {
            /* Lưu CHÍNH XÁC dòng nào hỏng và vì sao — legacy chỉ có failedCount. */
            failed.push({ itemId: line.itemId, unitId: line.unitId, reason: rc.error.message });
            return;
          }
          plan.unitChanges.push(rc.value.unit);
          plan.ledgerEntries.push({
            domain: 'raw', type: 'ADJUSTMENT', itemId: line.itemId, storeId: ctx.storeId,
            unitId: line.unitId, qtyDelta: rc.value.delta,
            businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
            occurredAt: ctx.clock.now(),
            referenceType: 'stockCount', referenceId: input.stockCountId, reason: input.reason
          });
        } else {
          plan.ledgerEntries.push({
            domain: 'raw', type: 'ADJUSTMENT', itemId: line.itemId, storeId: ctx.storeId,
            unitId: null, qtyDelta: line.delta,
            businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
            occurredAt: ctx.clock.now(),
            referenceType: 'stockCount', referenceId: input.stockCountId, reason: input.reason
          });
        }
        applied.push(line.itemId);
        plan.projectionRecomputes.push({ itemId: line.itemId, storeId: ctx.storeId });
      });

      plan.domainRecords.push({
        type: 'stockCount',
        record: Object.assign({}, count, {
          /* Còn dòng lỗi thì KHÔNG phải APPROVED — nói đúng trạng thái thật. */
          status: failed.length ? COUNT_STATUS.PARTIALLY_APPLIED : COUNT_STATUS.APPROVED,
          approvedBy: ctx.actor.actorId,
          approvedAt: ctx.clock.now(),
          approveOperationId: opId,
          appliedItemIds: applied,
          failedLines: failed,
          lines: (count.lines || []).map(function (l) {
            return Object.assign({}, l, {
              applied: l.applied || applied.indexOf(l.itemId) !== -1
            });
          })
        })
      });

      if (failed.length) {
        plan.events.push({
          type: 'StockCountPartiallyApplied',
          stockCountId: input.stockCountId, storeId: ctx.storeId,
          businessDate: ctx.businessDate, failedLines: failed
        });
      }

      return R.ok(plan);
    }
  });

  var ApproveExpense = pipeline.defineCommand({
    name: 'ApproveExpense',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],
    operationId: function (input) {
      return ids.deterministicId('operation', ['approveexp', input.expenseId]);
    },
    validate: function (input) {
      if (!input || !ids.isId(input.expenseId, 'expense')) return R.err('VALIDATION', 'cần expenseId hợp lệ');
      if (!input.reason) return R.err('VALIDATION', 'duyệt chi phí phải có lý do');
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var e = input.expense;
      if (!e) return R.err('NOT_FOUND', 'không tìm thấy khoản chi');
      if (e.status !== 'PENDING_APPROVAL') {
        return R.err('PRECONDITION', 'khoản chi không ở trạng thái chờ duyệt (' + e.status + ')');
      }
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({
        type: 'expense',
        record: Object.assign({}, e, {
          status: input.decision === 'REJECT' ? 'REJECTED' : 'ACTUAL',
          approvedBy: ctx.actor.actorId, approvedAt: ctx.clock.now(), approveReason: input.reason
        })
      });
      return R.ok(plan);
    }
  });

  return {
    COUNT_STATUS: COUNT_STATUS,
    ApproveLostContainer: ApproveLostContainer,
    ApproveStockCount: ApproveStockCount,
    ApproveExpense: ApproveExpense
  };
});

/* ===== src/layers/commands/inventory.js ===== */
/**
 * Lệnh kho — waste / nhận hàng / kiểm kê / mất-tìm-thấy.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-RAW-MATERIAL-V1.md, FIFO-CHAIN-TRACE-STOCK-COUNT-V1.md.
 * Gap: FIFO-CORE-ARCHITECTURE-V2.md §10b.2, §8, §9.
 *
 * Thay thế `applyStockTransaction` của QUANLY — §9 yêu cầu KHÔNG giữ bất kỳ hàm
 * nào ghi thẳng Firestore từ phía QUANLY. Ở đây không tồn tại code path nào ghi
 * thẳng `currentStock`: mọi thay đổi vật chất đi qua FIFO Engine, nên điều chỉnh
 * kiểm kê không còn bị lần recompute kế tiếp xoá âm thầm như legacy.
 */
GIEO.define('commands/inventory', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/unit',
  'fifo-core/allocation',
  'fifo-core/reconciliation'
], function (ids, R, pipeline, unitLib, allocation, reconciliation) {
  'use strict';

  /**
   * RecordWaste — hao hụt.
   *
   * §10b.2: legacy `_submitDrinkWasteImpl` xử lý cả prep lẫn nguyên liệu thô
   * trong CÙNG một hàm, nhưng nhánh prep gọi allocate qua FIFO (đúng) còn nhánh
   * nguyên liệu thô ghi thẳng sổ (sai, không allocate). Đây là bằng chứng kỹ
   * thuật đúng ĐÃ tồn tại sẵn, chỉ chưa áp dụng đồng nhất.
   *
   * Invariant ở đây: BẮT BUỘC allocate qua FIFO cho MỌI itemKind — không có
   * nhánh code riêng bỏ qua allocation theo domain.
   */
  var RecordWaste = pipeline.defineCommand({
    name: 'RecordWaste',
    /* §21: "Waste | YES | REVIEW/CORRECT". */
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['waste', input.wasteRef, input.itemId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.itemId, 'item')) return R.err('VALIDATION', 'RecordWaste cần itemId hợp lệ');
      if (typeof input.qty !== 'number' || !(input.qty > 0)) return R.err('VALIDATION', 'qty phải dương');
      if (!input.wasteRef) return R.err('VALIDATION', 'RecordWaste cần wasteRef để id xác định (bug #21)');
      if (!input.reason) return R.err('VALIDATION', 'hao hụt phải có lý do');
      if (input.domain !== 'raw' && input.domain !== 'prep') {
        return R.err('VALIDATION', "domain phải là 'raw' hoặc 'prep' — cả hai đi CÙNG một đường");
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['waste', input.wasteRef, input.itemId]);
      var ws = allocation.createWorkingSet(input.units || []);

      /* Cùng một lời gọi cho raw lẫn prep. Không có nhánh rẽ theo domain. */
      var r = allocation.allocateConsumption(ws, {
        itemId: input.itemId, qty: input.qty, operationId: opId
      });
      if (R.isErr(r)) return r;
      var alloc = r.value;

      if (alloc.shortfallQty > 0 && !input.allowUntracked) {
        return R.err('PRECONDITION',
          'không đủ lô để gánh ' + input.qty + ' hao hụt (thiếu ' + alloc.shortfallQty + ') — ' +
          'ghi thẳng sổ mà không allocate chính là lỗi nhánh nguyên liệu thô của legacy',
          { shortfallQty: alloc.shortfallQty });
      }

      plan.unitChanges = alloc.touchedUnits;
      alloc.allocations.forEach(function (a) {
        plan.ledgerEntries.push({
          domain: input.domain, type: 'WASTE', itemId: a.itemId, storeId: ctx.storeId,
          unitId: a.unitId, qtyDelta: -a.qty, unitCost: a.unitCost,
          costBasisVersionId: a.costBasisVersionId,
          businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: 'waste', referenceId: input.wasteRef, reason: input.reason
        });
      });

      /* Phần không có lô gánh vẫn phải vào sổ, qua đúng cơ chế
         untrackedPendingDelta (entry không có unitId) — không "biến mất". */
      if (alloc.shortfallQty > 0) {
        plan.ledgerEntries.push({
          domain: input.domain, type: 'WASTE', itemId: input.itemId, storeId: ctx.storeId,
          unitId: null, qtyDelta: -alloc.shortfallQty,
          businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: 'waste', referenceId: input.wasteRef,
          reason: input.reason + ' (phần không truy được lô)'
        });
      }

      /* §10b.2 cũng nói: chỉ 1/3 đường ghi waste của legacy có ingredientBreakdown
         dù kỹ thuật đã có sẵn. Ở đây nó luôn có, vì allocation vốn đã trả ra. */
      plan.domainRecords.push({
        type: 'wasteRecord',
        record: {
          wasteRef: input.wasteRef, itemId: input.itemId, qty: input.qty,
          domain: input.domain, reason: input.reason,
          actorId: ctx.actor.actorId, businessDate: ctx.businessDate,
          ingredientBreakdown: alloc.allocations.map(function (a) {
            return { unitId: a.unitId, qty: a.qty, cost: a.cost };
          }),
          wasteCost: alloc.totalCost,
          costComplete: alloc.costComplete
        }
      });

      plan.projectionRecomputes.push({ itemId: input.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  /**
   * AdjustInventory — điều chỉnh tồn, thay `applyStockTransaction` của QUANLY.
   *
   * Legacy ghi thẳng `currentStock` bỏ qua Unit Engine, nên điều chỉnh kiểm kê
   * bị lần tính lại kế tiếp xoá âm thầm. Ở đây điều chỉnh đi qua Unit: hoặc là
   * đối chiếu vật lý trên một Unit cụ thể, hoặc là ledger entry không có unitId
   * (tự cộng `untrackedPendingDelta` theo quy tắc §5).
   */
  var AdjustInventory = pipeline.defineCommand({
    name: 'AdjustInventory',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['adjust', input.adjustRef, input.itemId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.itemId, 'item')) return R.err('VALIDATION', 'cần itemId hợp lệ');
      if (!input.adjustRef) return R.err('VALIDATION', 'cần adjustRef để id xác định');
      if (!input.reason) return R.err('VALIDATION', 'điều chỉnh kho phải có lý do');
      var hasUnit = !!input.unitId;
      if (hasUnit && typeof input.actualQty !== 'number') {
        return R.err('VALIDATION', 'điều chỉnh trên 1 lô cụ thể cần actualQty (số cân được)');
      }
      if (!hasUnit && typeof input.qtyDelta !== 'number') {
        return R.err('VALIDATION', 'điều chỉnh phần không gắn lô cần qtyDelta');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['adjust', input.adjustRef, input.itemId]);

      if (input.unitId) {
        var unit = (input.units || []).filter(function (u) { return u.unitId === input.unitId; })[0];
        if (!unit) return R.err('NOT_FOUND', 'không tìm thấy lô ' + input.unitId);

        /* GHI ĐÈ TUYỆT ĐỐI qua Unit Engine — không cộng delta vào số cache. */
        var rc = reconciliation.physicalReconciliation(unit, {
          actualQty: input.actualQty, at: ctx.clock.now(),
          actorId: ctx.actor.actorId, operationId: opId,
          method: input.method || 'stock_count', reason: input.reason
        });
        if (R.isErr(rc)) return rc;

        plan.unitChanges.push(rc.value.unit);
        plan.ledgerEntries.push({
          domain: input.domain || 'raw', type: 'ADJUSTMENT', itemId: input.itemId,
          storeId: ctx.storeId, unitId: input.unitId,
          qtyDelta: rc.value.delta,
          businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: 'adjustment', referenceId: input.adjustRef, reason: input.reason
        });
        plan.domainRecords.push({ type: 'reconciliationRecord', record: rc.value.record });
      } else {
        plan.ledgerEntries.push({
          domain: input.domain || 'raw', type: 'ADJUSTMENT', itemId: input.itemId,
          storeId: ctx.storeId, unitId: null, qtyDelta: input.qtyDelta,
          businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: 'adjustment', referenceId: input.adjustRef, reason: input.reason
        });
      }

      plan.projectionRecomputes.push({ itemId: input.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  /** ReportLostContainer — POS báo mất. Chỉ tạo phiếu CHỜ DUYỆT. */
  var ReportLostContainer = pipeline.defineCommand({
    name: 'ReportLostContainer',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['lostreport', input.unitId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.unitId, 'unit')) return R.err('VALIDATION', 'cần unitId hợp lệ');
      if (!input.reason) return R.err('VALIDATION', 'báo mất phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({
        type: 'lostReport',
        record: {
          lostReportId: ids.deterministicId('operation', ['lostreport', input.unitId]),
          unitId: input.unitId,
          /* CHỜ DUYỆT — Unit chưa vào nhánh LOST cho tới khi QUANLY duyệt.
             Đây chính là mắt xích legacy thiếu (Bug #12). */
          status: 'PENDING_REVIEW',
          reportedBy: ctx.actor.actorId,
          reportedAt: ctx.clock.now(),
          businessDate: ctx.businessDate,
          reason: input.reason
        }
      });
      plan.events.push({
        type: 'LostContainerReported',
        unitId: input.unitId, storeId: ctx.storeId, businessDate: ctx.businessDate
      });
      return R.ok(plan);
    }
  });

  /**
   * RestoreFoundContainer — tìm lại được.
   *
   * §8: giữ nguyên toàn bộ quyết định nghiệp vụ của legacy
   * (`submitFoundLostContainer`) — Unit "mới nguyên", KHÔNG suy luận lại phần
   * đã dùng trước khi mất. Chỉ thêm `operationId` xuyên suốt (fix Bug #24, nơi
   * bước ADJUSTMENT không có txId).
   */
  var RestoreFoundContainer = pipeline.defineCommand({
    name: 'RestoreFoundContainer',
    /* Ma trận §21: "Found | YES | REVIEW/CORRECT" — POS làm bằng EXECUTE,
       QUANLY làm bằng REVIEW/CORRECT. Cùng một command, hai lối vào hợp lệ. */
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['found', input.unitId]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.unitId, 'unit')) return R.err('VALIDATION', 'cần unitId hợp lệ');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var unit = (input.units || []).filter(function (u) { return u.unitId === input.unitId; })[0];
      if (!unit) return R.err('NOT_FOUND', 'không tìm thấy lô ' + input.unitId);

      var opId = ids.deterministicId('operation', ['found', input.unitId]);
      var r = unitLib.restoreFound(unit, {
        at: ctx.clock.now(), actorId: ctx.actor.actorId, operationId: opId
      });
      if (R.isErr(r)) return r;

      var plan = pipeline.emptyPlan();
      plan.unitChanges.push(r.value);
      plan.ledgerEntries.push({
        domain: 'raw', type: 'FOUND', itemId: unit.itemId, storeId: ctx.storeId,
        unitId: unit.unitId, qtyDelta: r.value.remainingQty,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'found', referenceId: input.unitId,
        reason: 'tìm lại được container đã báo mất'
      });
      /* Hoàn khoản trừ trách nhiệm nhân viên là SIDE-EFFECT, đi qua event. */
      plan.events.push({
        type: 'ContainerFound',
        unitId: unit.unitId, storeId: ctx.storeId, businessDate: ctx.businessDate,
        lostReportId: unit.lostReportId
      });
      plan.projectionRecomputes.push({ itemId: unit.itemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  return {
    RecordWaste: RecordWaste,
    AdjustInventory: AdjustInventory,
    ReportLostContainer: ReportLostContainer,
    RestoreFoundContainer: RestoreFoundContainer
  };
});

/* ===== src/layers/commands/pipeline.js ===== */
/**
 * Command pipeline — đường ghi DUY NHẤT của cả POS lẫn QUANLY.
 *
 * Contract: GIEO-SYSTEM-REBUILD-PLAN.md §2/§12, FIFO-CORE-ARCHITECTURE-V2.md §7.
 *
 *   VALIDATE → AUTHORIZE → READ CANONICAL → CALCULATE → MUTATION PLAN
 *            → IDEMPOTENCY → ENGINE → LEDGER → PROJECTION → AUDIT → VERIFY
 *
 * ────────────────────────────────────────────────────────────────────────
 * IDEMPOTENCY — legacy có 3 lớp bảo vệ ở đường bán hàng chính
 * (`applySalesConsumptionPOS`) nhưng 6 đường khác thiếu ít nhất 1 lớp:
 *   #6  not-empty        — busy-lock đặt SAU await
 *   #13 stock count      — dùng .add() sinh id ngẫu nhiên
 *   #21 BTP waste        — không catch/rollback sau khi đã allocate
 *   #22 start prep batch — thiếu txId cố định
 *   #23 add-on tăng      — thiếu txId cố định
 *   #24 found-lost       — bước ADJUSTMENT không có txId
 *
 * Nguyên nhân gốc: mỗi hàm TỰ CHẾ lớp chống-đúp riêng. Ở đây chỉ có MỘT chỗ
 * implement, và command không có cách nào tự chế lớp khác — nó chỉ mô tả việc
 * cần làm, pipeline lo phần còn lại.
 *
 * §10b.3 bổ sung tường minh: idempotency áp cho MỌI command, kể cả Approval
 * (ApproveStockCount, ApproveLostContainer, ApproveExpense) — legacy để approval
 * không kiểm tra status trước khi apply, nên 2 người duyệt cùng lúc cộng đúp.
 * ────────────────────────────────────────────────────────────────────────
 */
GIEO.define('commands/pipeline', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'shared-kernel/operation-state',
  'store-context/access'
], function (ids, R, opState, access) {
  'use strict';

  var STATES = opState.STATES;

  /**
   * Kho operation. Đây là port — bản in-memory dùng cho test và shadow;
   * persistence-firebase implement bản thật với compare-and-swap.
   */
  function createInMemoryOperationStore() {
    var ops = Object.create(null);
    return {
      get: function (operationId) {
        return R.ok(ops[operationId] || null);
      },
      /** Giành quyền chạy. Trả CONFLICT nếu đã có người giữ. */
      claim: function (record) {
        var existing = ops[record.operationId];
        if (existing) {
          if (existing.status === STATES.COMPLETED) {
            return R.err('CONFLICT', 'operation đã hoàn tất', { existing: existing });
          }
          if (existing.status === STATES.RUNNING) {
            return R.err('CONFLICT', 'operation đang chạy ở nơi khác', { existing: existing });
          }
        }
        ops[record.operationId] = record;
        return R.ok(record);
      },
      update: function (operationId, patch) {
        if (!ops[operationId]) return R.err('NOT_FOUND', 'không có operation ' + operationId);
        ops[operationId] = Object.assign({}, ops[operationId], patch);
        return R.ok(ops[operationId]);
      },
      all: function () { return Object.keys(ops).map(function (k) { return ops[k]; }); }
    };
  }

  /**
   * Khai báo 1 command. Đăng ký quyền LUÔN tại đây, nên không thể có command
   * chạy được mà quên khai quyền (mặc định đóng — access.authorize từ chối
   * command lạ).
   *
   * @param spec.name
   * @param spec.authority, spec.mutates, spec.sources, spec.crossStore  → access
   * @param spec.operationId  (input, ctx) => string  — BẮT BUỘC xác định
   * @param spec.requiresOpenDay  mặc định = mutates
   * @param spec.validate     (input, ctx) => Result
   * @param spec.execute      (input, ctx) => Result<MutationPlan>
   */
  function defineCommand(spec) {
    if (!spec || !spec.name) throw new Error('[pipeline] command cần name');
    if (typeof spec.operationId !== 'function') {
      throw new Error('[pipeline] command "' + spec.name + '" phải khai hàm operationId — ' +
        'id ngẫu nhiên làm sập idempotency (bug #13/#21/#22/#23/#24)');
    }
    if (typeof spec.execute !== 'function') {
      throw new Error('[pipeline] command "' + spec.name + '" cần execute');
    }

    access.registerCommand(spec.name, {
      authority: spec.authority,
      mutates: spec.mutates,
      sources: spec.sources,
      crossStore: spec.crossStore
    });

    return {
      name: spec.name,
      mutates: spec.mutates,
      requiresOpenDay: spec.requiresOpenDay === undefined ? spec.mutates : spec.requiresOpenDay,
      operationId: spec.operationId,
      validate: spec.validate || function () { return R.ok(true); },
      execute: spec.execute
    };
  }

  /**
   * Chạy 1 command qua đủ pipeline.
   *
   * `deps.operationStore` bắt buộc. `deps.commit` là ranh giới ghi nguyên tử —
   * nhận MutationPlan, ghi tất cả hoặc không ghi gì. Không có commit thì chạy ở
   * chế độ DRY-RUN (dùng cho shadow/simulate, đúng giai đoạn READ-ONLY hiện tại).
   */
  function run(command, input, ctx, deps) {
    deps = deps || {};
    var store = deps.operationStore;
    if (!store) return R.err('VALIDATION', 'pipeline cần operationStore');

    /* 1. VALIDATE */
    var v = command.validate(input, ctx);
    if (R.isErr(v)) return v;

    /* 2. AUTHORIZE — ở tầng Command/Domain, không phải UI (invariant #17) */
    var auth = ctx.authorize(command.name, input.storeId || ctx.storeId);
    if (R.isErr(auth)) return auth;

    /* 3. GATE ngày làm việc — ngày đã chốt thì khoá thao tác vận hành */
    if (command.requiresOpenDay) {
      var day = ctx.assertOperable(command.name);
      if (R.isErr(day)) return day;
    }

    /* 4. IDEMPOTENCY — id xác định, không bao giờ ngẫu nhiên */
    var operationId;
    try {
      operationId = command.operationId(input, ctx);
    } catch (e) {
      return R.err('VALIDATION', 'không dựng được operationId: ' + e.message);
    }
    if (!ids.isId(operationId, 'operation')) {
      return R.err('VALIDATION', 'operationId phải là id loại operation, nhận: ' + operationId);
    }

    var prior = store.get(operationId);
    if (R.isErr(prior)) return prior;
    if (prior.value && prior.value.status === STATES.COMPLETED) {
      /* Chạy lại là NO-OP trả kết quả cũ — không phải làm lại. */
      return R.ok({
        operationId: operationId,
        status: STATES.COMPLETED,
        replayed: true,
        result: prior.value.result
      });
    }

    var claim = store.claim({
      operationId: operationId,
      command: command.name,
      status: STATES.RUNNING,
      actorId: ctx.actor.actorId,
      storeId: ctx.storeId,
      businessDate: ctx.businessDate,
      startedAt: ctx.clock.now(),
      result: null
    });
    if (R.isErr(claim)) return claim;

    /* 5. CALCULATE + MUTATION PLAN */
    var planR;
    try {
      planR = command.execute(input, ctx);
    } catch (e) {
      store.update(operationId, { status: STATES.FAILED_MANUAL_REVIEW, error: e.message });
      return R.err('MANUAL_REVIEW', 'command "' + command.name + '" ném lỗi: ' + e.message);
    }
    if (R.isErr(planR)) {
      /* Chưa chạm vào state vật lý nên thất bại ở đây là thử lại được. */
      store.update(operationId, {
        status: R.isRetryable(planR) ? STATES.FAILED_RETRYABLE : STATES.FAILED_MANUAL_REVIEW,
        error: planR.error.message
      });
      return planR;
    }

    var plan = planR.value;
    plan.operationId = operationId;
    /* 6. AUDIT — gắn sẵn, không để command tự nhớ (§25) */
    plan.audit = Object.assign(ctx.auditBase(operationId), {
      command: command.name,
      reason: input.reason || null
    }, plan.audit || {});

    /* 7. COMMIT — ranh giới nguyên tử */
    if (!deps.commit) {
      /* runAndCommit dùng planningOnly: giữ claim ở RUNNING cho tới khi
         transaction thật kết thúc. Nếu đánh COMPLETED tại đây, request thứ hai
         có thể nhận replay giả trong lúc commit đầu vẫn đang pending/hỏng. */
      if (!deps.planningOnly) {
        store.update(operationId, { status: STATES.COMPLETED, result: plan, dryRun: true });
      }
      return R.ok({
        operationId: operationId,
        status: deps.planningOnly ? STATES.RUNNING : STATES.COMPLETED,
        /* Giữ cùng hình dạng với đường commit thật — caller không phải phân biệt
           dry-run hay không để biết đây có phải lần chạy đầu. */
        replayed: false,
        dryRun: true,
        plan: plan
      });
    }

    var committed = deps.commit(plan, ctx);
    if (R.isErr(committed)) {
      /* Ghi hỏng sau khi đã tính toán: KHÔNG nuốt lỗi (invariant #11).
         Rollback nằm TRONG cùng command, không phải bước riêng dễ quên. */
      var rolledBack = null;
      if (deps.rollback) rolledBack = deps.rollback(plan, ctx);
      store.update(operationId, {
        status: R.isRetryable(committed) ? STATES.FAILED_RETRYABLE : STATES.FAILED_MANUAL_REVIEW,
        error: committed.error.message,
        rolledBack: rolledBack ? R.isOk(rolledBack) : false
      });
      return committed;
    }

    store.update(operationId, { status: STATES.COMPLETED, result: committed.value });
    return R.ok({
      operationId: operationId,
      status: STATES.COMPLETED,
      replayed: false,
      plan: plan,
      result: committed.value
    });
  }

  /**
   * Chạy command RỒI GHI THẬT.
   *
   * `run()` ở trên cố ý đồng bộ: nó dựng MutationPlan, và dựng plan là việc
   * thuần tính toán. Nhưng ghi Firebase thì bất đồng bộ. Trộn hai thứ vào một
   * hàm lúc trả Promise lúc trả giá trị là API dễ dùng sai, nên tách hẳn:
   *
   *   run()           → dry-run, đồng bộ, dùng cho shadow/simulate và test
   *   runAndCommit()  → Promise, dùng khi đã có adapter ghi thật
   *
   * Giai đoạn hiện tại hệ thống chạy READ-ONLY nên đường dùng chủ yếu vẫn là
   * run(); runAndCommit() có sẵn để cutover không phải sửa lại pipeline.
   */
  function runAndCommit(command, input, ctx, deps) {
    deps = deps || {};
    if (typeof deps.commit !== 'function') {
      return Promise.resolve(R.err('VALIDATION', 'runAndCommit cần deps.commit'));
    }

    /* Chạy pha dựng plan ở chế độ dry-run để tái dùng nguyên vẹn mọi chốt chặn
       (validate → authorize → gate ngày → idempotency) mà không nhân bản logic. */
    var planned = run(command, input, ctx, {
      operationStore: deps.operationStore,
      planningOnly: true
    });
    if (R.isErr(planned)) return Promise.resolve(planned);
    if (planned.value.replayed) return Promise.resolve(planned.value);

    var plan = planned.value.plan;
    return Promise.resolve()
      .then(function () { return deps.commit(plan, ctx); })
      .then(function (committed) {
        if (R.isErr(committed)) {
          var rolledBack = null;
          if (deps.rollback) rolledBack = deps.rollback(plan, ctx);
          deps.operationStore.update(plan.operationId, {
            status: R.isRetryable(committed) ? STATES.FAILED_RETRYABLE : STATES.FAILED_MANUAL_REVIEW,
            error: committed.error.message,
            rolledBack: rolledBack ? R.isOk(rolledBack) : false
          });
          return committed;
        }
        deps.operationStore.update(plan.operationId, {
          status: STATES.COMPLETED, result: committed.value, dryRun: false
        });
        return R.ok({
          operationId: plan.operationId,
          status: STATES.COMPLETED,
          replayed: false,
          plan: plan,
          result: committed.value
        });
      });
  }

  /**
   * MutationPlan rỗng — command bồi vào. Một plan mang TẤT CẢ thay đổi của một
   * operation (vật chất + ledger + projection + trace), để commit được nguyên tử.
   */
  function emptyPlan() {
    return {
      operationId: null,
      unitChanges: [],
      ledgerEntries: [],
      projectionRecomputes: [],
      traceChanges: [],
      domainRecords: [],
      events: [],
      audit: null
    };
  }

  return {
    createInMemoryOperationStore: createInMemoryOperationStore,
    defineCommand: defineCommand,
    run: run,
    runAndCommit: runAndCommit,
    emptyPlan: emptyPlan
  };
});

/* ===== src/layers/commands/prep.js ===== */
/**
 * Lệnh BTP — nấu mẻ, sửa yield, đối chiếu cuối ca.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-BTP-V1.md.
 *
 * Mẻ BTP nấu xong tạo ra một `StockUnit` do FIFO sở hữu với `itemKind='prep'`,
 * nên BTP đi qua ĐÚNG một engine với nguyên liệu thô — không có đường kho song
 * song. Đây là điều kiện để actual-vs-theoretical áp được cho cả hai.
 *
 * Waste BTP dùng chung `commands/inventory.RecordWaste` (domain 'prep'), nên
 * `ingredientBreakdown` luôn có bất kể trigger từ đâu — đóng đứt chuỗi #2 của
 * chain-trace, nơi legacy có 2 code path ghi cùng `type:WASTE` với field khác
 * nhau và đường phổ biến nhất (hết hạn cuối ca) thì thiếu breakdown.
 */
GIEO.define('commands/prep', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/unit',
  'fifo-core/allocation',
  'recipe-cost-btp/btp',
  'recipe-cost-btp/recipe'
], function (ids, R, pipeline, unitLib, allocation, btpLib, recipeLib) {
  'use strict';

  /**
   * RecordPrepProduction — nấu xong một mẻ.
   *
   * Trừ nguyên liệu thô qua FIFO (nên có giá vốn thật), rồi tạo một Unit BTP
   * mang giá vốn = tổng nguyên liệu / yield thật của chính mẻ đó.
   */
  var RecordPrepProduction = pipeline.defineCommand({
    name: 'RecordPrepProduction',
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
