/**
 * Customer — định danh khách.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-LOYALTY-V1.md §1, §7.
 *
 * Giữ nguyên quyết định nghiệp vụ của legacy: khoá theo SĐT đã chuẩn hoá.
 * Đơn giản, khớp cách quán thật nhận diện khách (đọc số điện thoại tại quầy).
 *
 * Tier là CHỖ NỐI SẴN, không dựng ngay (§7 chain-trace: legacy chưa có tier,
 * chỉ có nhãn phân khúc thuần đọc-báo-cáo, không nối vào công thức tích điểm).
 * `accrualMultiplier` mặc định 1 có mặt ngay từ đầu, nên sau này bật tier lên
 * không phải sửa lại công thức tích điểm — đúng nguyên tắc "chừa vị trí nối
 * vào" của cây tính năng.
 */
GIEO.define('loyalty/customer', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  /**
   * Chuẩn hoá SĐT: 84xxx → 0xxx, bỏ khoảng trắng/dấu.
   * Giữ đúng quy ước legacy để dữ liệu khách cũ khớp được khi migrate.
   */
  function normalizePhone(raw) {
    if (typeof raw !== 'string') return null;
    var d = raw.replace(/[^0-9+]/g, '');
    if (d.indexOf('+84') === 0) d = '0' + d.slice(3);
    else if (d.indexOf('84') === 0 && d.length > 9) d = '0' + d.slice(2);
    if (!/^0\d{8,10}$/.test(d)) return null;
    return d;
  }

  function createCustomer(spec) {
    if (!spec) return R.err('VALIDATION', 'customer cần spec');
    var phone = normalizePhone(spec.phone);
    if (!phone) return R.err('VALIDATION', 'số điện thoại không hợp lệ: ' + spec.phone);
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'customer cần storeId hợp lệ');

    return R.ok({
      /* Id xác định theo SĐT: nhập lại cùng số luôn ra cùng khách, không tạo trùng. */
      customerId: ids.deterministicId('customer', [phone]),
      storeId: spec.storeId,
      phone: phone,
      name: spec.name || null,
      /* Chỗ nối cho tier — chưa dùng, nhưng có sẵn nên bật lên không phải sửa
         công thức tích điểm (§5 luồng chuẩn). */
      tier: spec.tier || 'STANDARD',
      accrualMultiplier: typeof spec.accrualMultiplier === 'number' ? spec.accrualMultiplier : 1,
      createdAt: spec.createdAt || null
    });
  }

  /** Hệ số tích điểm theo hạng. Mặc định 1 — không hạng nào thì không lợi gì. */
  function accrualMultiplierOf(customer) {
    if (!customer) return 1;
    var m = customer.accrualMultiplier;
    return typeof m === 'number' && m > 0 ? m : 1;
  }

  return {
    normalizePhone: normalizePhone,
    createCustomer: createCustomer,
    accrualMultiplierOf: accrualMultiplierOf
  };
});

/* ===== src/layers/loyalty/ledger.js ===== */
/**
 * LoyaltyLedger — SỔ CÁI, không phải field cộng dồn.
 *
 * Đây là phát hiện quan trọng nhất của chuỗi Loyalty
 * (FIFO-CHAIN-TRACE-LOYALTY-V1.md §8, FEATURE-TREE-V1.md §4.15).
 *
 * Nghịch lý của legacy: tích điểm là một trong những chuỗi được làm CẨN THẬN
 * NHẤT toàn hệ thống — idempotent qua marker theo billId, Firestore transaction,
 * hàng đợi retry tự phục hồi — nhưng LƯU TRỮ SAI GỐC:
 * `total_points`/`stamp_count`/`free_drink_available` là field cộng dồn trực
 * tiếp trên `customers/{phone}`, và comment tự gọi đó là "single source of truth".
 *
 * Vì sao nặng hơn cả `untrackedPendingDelta` của FIFO: FIFO còn có
 * `stock_transactions_gieogieo` nên về nguyên tắc dựng lại `currentStock` được.
 * Loyalty thì KHÔNG — `loyalty_bill_effects_gieogieo` chỉ là marker chống trùng
 * theo billId, không phải sổ cái. Nếu số dư trôi (ghi lỗi, sửa tay Firestore,
 * race hiếm ngoài phạm vi marker), KHÔNG CÓ CÁCH NÀO tính lại đúng — chỉ có
 * thể sửa tay mà không kiểm chứng được.
 *
 * Ở đây số dư là KẾT QUẢ CỘNG SỔ, không phải thứ được ghi thẳng. Không có hàm
 * nào set số dư.
 */
GIEO.define('loyalty/ledger', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  var CURRENCY = { POINTS: 'POINTS', STAMPS: 'STAMPS', FREE_DRINKS: 'FREE_DRINKS' };

  var REASON = {
    EARN_SALE: 'EARN_SALE',
    EARN_ADDON: 'EARN_ADDON',
    REDEEM: 'REDEEM',
    CONVERT_STAMPS: 'CONVERT_STAMPS',
    REVERSAL: 'REVERSAL',
    MANUAL_ADJUSTMENT: 'MANUAL_ADJUSTMENT'
  };

  function isCurrency(c) { return Object.prototype.hasOwnProperty.call(CURRENCY, c); }
  function isReason(r) { return Object.prototype.hasOwnProperty.call(REASON, r); }

  /**
   * Một dòng sổ BẤT BIẾN.
   * `entryId` xác định theo (customer, currency, reason, referenceId) nên ghi
   * lại cùng một sự kiện không sinh dòng thứ hai.
   */
  function createEntry(spec) {
    if (!spec) return R.err('VALIDATION', 'ledger entry cần spec');
    if (!ids.isId(spec.customerId, 'customer')) return R.err('VALIDATION', 'cần customerId hợp lệ');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'cần storeId hợp lệ');
    if (!isCurrency(spec.currency)) return R.err('VALIDATION', 'currency không hợp lệ: ' + spec.currency);
    if (!isReason(spec.reason)) return R.err('VALIDATION', 'reason không hợp lệ: ' + spec.reason);
    if (typeof spec.delta !== 'number' || !isFinite(spec.delta) || spec.delta === 0) {
      return R.err('VALIDATION', 'delta phải là số khác 0');
    }
    if (!spec.operationId) return R.err('VALIDATION', 'ledger entry cần operationId');
    if (!spec.referenceId) {
      return R.err('VALIDATION', 'ledger entry cần referenceId (billId/lý do) — dòng sổ không nguồn gốc là dòng không kiểm chứng được');
    }
    if (!spec.businessDate) return R.err('VALIDATION', 'ledger entry cần businessDate');

    return R.ok({
      entryId: spec.entryId || ids.deterministicId('ledger', [
        'loyalty', spec.customerId, spec.currency, spec.reason, spec.referenceId
      ]),
      customerId: spec.customerId,
      storeId: spec.storeId,
      currency: spec.currency,
      delta: spec.delta,
      reason: spec.reason,
      referenceType: spec.referenceType || 'bill',
      referenceId: spec.referenceId,
      operationId: spec.operationId,
      businessDate: spec.businessDate,
      occurredAt: typeof spec.occurredAt === 'number' ? spec.occurredAt : null,
      actorId: spec.actorId || null,
      note: spec.note || null
    });
  }

  /**
   * Số dư = TỔNG SỔ. Không có hàm set số dư ở bất kỳ đâu, nên không tồn tại
   * đường làm số dư trôi khỏi lịch sử.
   */
  function computeBalance(entries, customerId) {
    var bal = { POINTS: 0, STAMPS: 0, FREE_DRINKS: 0 };
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      if (customerId && e.customerId !== customerId) continue;
      bal[e.currency] += e.delta;
    }
    return bal;
  }

  /**
   * Đối chiếu số dư đang hiển thị với số dư dựng lại từ sổ.
   *
   * Legacy không làm được phép này vì không có sổ. Đây là thứ biến "số dư trôi"
   * từ chuyện không phát hiện được thành chuyện phát hiện được.
   */
  function detectDrift(entries, customerId, storedBalance) {
    var rebuilt = computeBalance(entries, customerId);
    var drift = {};
    var clean = true;
    Object.keys(rebuilt).forEach(function (k) {
      var stored = (storedBalance && typeof storedBalance[k] === 'number') ? storedBalance[k] : rebuilt[k];
      if (stored !== rebuilt[k]) {
        clean = false;
        drift[k] = { stored: stored, rebuilt: rebuilt[k], difference: stored - rebuilt[k] };
      }
    });
    return R.ok({ customerId: customerId, rebuilt: rebuilt, clean: clean, drift: drift });
  }

  /**
   * Sửa tay số dư — vẫn phải đi qua sổ, có lý do và người chịu trách nhiệm.
   * Legacy không có màn hình nào để "xử lý tay" dù toast bảo Quản lý xử lý tay;
   * ở đây đường sửa tay tồn tại, nhưng nó là 1 dòng sổ chứ không phải ghi đè.
   */
  function adjust(spec) {
    if (!spec.reasonText) {
      return R.err('VALIDATION', 'sửa tay số dư phải có lý do — sửa không lý do là sửa không kiểm chứng được');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'sửa tay phải có actorId');
    return createEntry({
      customerId: spec.customerId,
      storeId: spec.storeId,
      currency: spec.currency,
      delta: spec.delta,
      reason: REASON.MANUAL_ADJUSTMENT,
      referenceType: 'manual',
      referenceId: spec.operationId,
      operationId: spec.operationId,
      businessDate: spec.businessDate,
      occurredAt: spec.occurredAt,
      actorId: spec.actorId,
      note: spec.reasonText
    });
  }

  return {
    CURRENCY: CURRENCY,
    REASON: REASON,
    createEntry: createEntry,
    computeBalance: computeBalance,
    detectDrift: detectDrift,
    adjust: adjust
  };
});

/* ===== src/layers/hr/employee.js ===== */
/**
 * Employee — domain [0] IDENTITY, gốc của cây tính năng.
 *
 * Cấp `actorId` cho MỌI mutation ở mọi nhánh bên dưới (FEATURE-TREE-V1.md §2).
 *
 * `employeeId` và `actorId` là HAI id khác nhau, cố ý (invariant #4):
 *   - employeeId = hồ sơ nhân sự (lương, ca, hợp đồng)
 *   - actorId    = danh tính thao tác, thứ được ghi vào mọi ledger/audit
 * Tách ra vì thao tác của một người không nên chết theo hồ sơ nhân sự: nhân
 * viên nghỉ việc thì hồ sơ đóng lại, nhưng mọi bill/ledger họ từng ký vẫn phải
 * trỏ về đúng actor đó vĩnh viễn. Gộp 2 id là tự chuốc bài toán "xoá nhân viên
 * làm mồ côi lịch sử".
 */
GIEO.define('hr/employee', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input'
], function (ids, R, VI) {
  'use strict';

  function createEmployee(spec) {
    if (!spec || !spec.name) return R.err('VALIDATION', 'employee cần name');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'employee cần storeId hợp lệ');
    if (spec.role && typeof spec.role !== 'string') return R.err('VALIDATION', 'role phải là chuỗi');

    return R.ok({
      employeeId: spec.employeeId || ids.newId('employee'),
      /* Cấp actorId ngay lúc tạo hồ sơ — không có đường nào tạo được nhân viên
         mà thiếu danh tính thao tác. */
      actorId: spec.actorId || ids.newId('actor'),
      storeId: spec.storeId,
      name: String(spec.name),
      /* FEATURE-TREE §3 mục [0]: thiết kế field role NGAY từ đầu dù legacy chưa
         có phân quyền thật — thêm sau thì dữ liệu cũ không có gì để điền. */
      role: spec.role || 'POS_OPERATOR',
      active: spec.active === undefined ? true : !!spec.active,
      hiredAt: spec.hiredAt || null,
      terminatedAt: spec.terminatedAt || null
    });
  }

  /** Nghỉ việc = đóng hồ sơ, KHÔNG xoá — lịch sử thao tác phải còn trỏ về được. */
  function terminate(employee, at) {
    if (!employee.active) return R.err('PRECONDITION', 'nhân viên đã nghỉ việc');
    if (typeof at !== 'number') return R.err('VALIDATION', 'terminate cần thời điểm');
    var next = Object.assign({}, employee, { active: false, terminatedAt: at });
    return R.ok(next);
  }

  function isEmployedAt(employee, at) {
    if (employee.hiredAt && at < employee.hiredAt) return false;
    if (employee.terminatedAt && at >= employee.terminatedAt) return false;
    return true;
  }

  /**
   * PayTerms đi qua ĐÚNG cơ chế versioning dùng chung, không phải cơ chế riêng
   * của payroll (FIFO-COMPACTION-CONTRACT-V1.md §1 — đây là instance #5 của lớp
   * lỗi đã xác nhận 7 lần).
   */
  function publishPayTerms(registry, spec) {
    if (!spec) return R.err('VALIDATION', 'publishPayTerms cần spec');
    if (!ids.isId(spec.employeeId, 'employee')) return R.err('VALIDATION', 'cần employeeId hợp lệ');

    var t = spec.terms;
    if (!t) return R.err('VALIDATION', 'publishPayTerms cần terms');
    if (typeof t.rate !== 'number' || t.rate < 0) return R.err('VALIDATION', 'terms.rate phải là số không âm');
    if (t.otRate !== undefined && (typeof t.otRate !== 'number' || t.otRate < 0)) {
      return R.err('VALIDATION', 'terms.otRate phải là số không âm');
    }
    if (t.otThreshold !== undefined && (typeof t.otThreshold !== 'number' || t.otThreshold <= 0)) {
      return R.err('VALIDATION', 'terms.otThreshold phải là số dương');
    }

    return registry.publish({
      kind: VI.KINDS.payTerms,
      subjectId: spec.employeeId,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: {
        rate: t.rate,
        otRate: t.otRate === undefined ? t.rate : t.otRate,
        otThreshold: t.otThreshold === undefined ? 8 : t.otThreshold,
        /* Lương cứng: có mặt nhưng công thức trừ theo lịch làm việc còn để ngỏ,
           xem README "Điểm còn treo". Không tự quyết thay chủ quán. */
        fixedMonthlySalary: t.fixedMonthlySalary === undefined ? null : t.fixedMonthlySalary
      }
    });
  }

  /** Resolve PayTerms có hiệu lực tại thời điểm sự kiện — KHÔNG phải hiện tại. */
  function resolvePayTermsAt(registry, employeeId, storeId, at) {
    return registry.resolveAt(VI.KINDS.payTerms, employeeId, storeId, at);
  }

  return {
    createEmployee: createEmployee,
    terminate: terminate,
    isEmployedAt: isEmployedAt,
    publishPayTerms: publishPayTerms,
    resolvePayTermsAt: resolvePayTermsAt
  };
});

 * 1. `payTerms` là WRITE CHẾT (§3). Legacy snapshot payTerms vào employee_shifts
 *    lúc check-in nhưng `computeActualLaborCostByDate` vẫn join bảng nhân viên

  'shared-kernel/ids',
  'shared-kernel/result',
  'compaction/versioned-input',
  'hr/shift',
  'hr/work-schedule'
], function (ids, R, VI, shiftLib, scheduleLib) {
  'use strict';

  /**
   * Tính lương 1 nhân viên cho 1 kỳ.
   *
   * @param spec.registry        VersionedInput registry
   * @param spec.employee
   * @param spec.shifts          ca đã chấm công trong kỳ (mang payTermsRef riêng)
   * @param spec.scheduleDays    lịch đã xếp trong kỳ — BẮT BUỘC nếu có lương cứng
   * @param spec.fromTs, spec.toTs
   */
  function computePayroll(spec) {
    var employee = spec.employee;
    if (!employee || !ids.isId(employee.employeeId, 'employee')) {
      return R.err('VALIDATION', 'computePayroll cần employee hợp lệ');
    }
    if (typeof spec.fromTs !== 'number' || typeof spec.toTs !== 'number') {
      return R.err('VALIDATION', 'computePayroll cần khoảng thời gian');
    }

    var shifts = spec.shifts || [];

    /* ── Lương giờ ────────────────────────────────────────────────────────
       Mỗi ca dùng payTerms ĐÃ SNAPSHOT của chính nó. Không có tham số nào
       cho PayTerms hiện tại, nên không tồn tại đường lặp lại bug §3. */
    var hourly = { hours: 0, amount: 0, lines: [], needsReview: [] };
    for (var i = 0; i < shifts.length; i++) {
      var sh = shifts[i];
      if (sh.employeeId !== employee.employeeId) continue;
      if (sh.status !== shiftLib.STATUS.CLOSED) {
        return R.err('PRECONDITION',
          'ca ngày ' + sh.businessDate + ' chưa check-out — không chốt lương khi còn ca mở');
      }
      var w = shiftLib.computeWage(sh);
      if (R.isErr(w)) return w;
      hourly.hours += w.value.hours;
      hourly.amount += w.value.amount;
      hourly.lines.push({
        businessDate: sh.businessDate,
        hours: w.value.hours,
        normalHours: w.value.normalHours,
        otHours: w.value.otHours,
        amount: w.value.amount,
        payTermsVersionId: w.value.payTermsVersionId,
        needsReview: w.value.needsReview
      });
      if (w.value.needsReview) {
        hourly.needsReview.push({ businessDate: sh.businessDate, reasons: w.value.needsReviewReasons });
      }
    }

    /* ── Lương cứng ───────────────────────────────────────────────────────
       Resolve TỪNG NGÀY (quy tắc V3) — đổi mức lương cứng giữa kỳ không được
       áp một mức cho cả kỳ. */
    var dailyR = spec.registry.resolveDaily(
      VI.KINDS.payTerms, employee.employeeId, employee.storeId, spec.fromTs, spec.toTs
    );
    if (R.isErr(dailyR)) return dailyR;
    var daily = dailyR.value;
    var dayKeys = Object.keys(daily).sort();

    var hasFixed = dayKeys.some(function (k) {
      return typeof daily[k].version.payload.fixedMonthlySalary === 'number';
    });

    var fixed = { amount: 0, scheduledDays: 0, absentDays: 0, excusedDays: 0, lines: [], deductions: [] };

    if (hasFixed) {
      var schedule = spec.scheduleDays;
      if (!Array.isArray(schedule) || schedule.length === 0) {
        /* Đã chốt: lương cứng trừ theo lịch làm việc. Không có lịch thì mọi
           phép trừ đều là đoán — từ chối thay vì đoán. */
        return R.err('PRECONDITION',
          'nhân viên có lương cứng nhưng kỳ này chưa xếp lịch làm việc — ' +
          'không trừ được ngày vắng nếu không biết ngày nào phải đi làm');
      }

      var rec = scheduleLib.reconcile({ scheduleDays: schedule, shifts: shifts });
      if (R.isErr(rec)) return rec;
      var r = rec.value;

      fixed.scheduledDays = r.scheduledDays;
      fixed.absentDays = r.absent.length;
      fixed.excusedDays = r.excusedAbsent.length;
      fixed.deductions = r.absent.slice();

      /* Mỗi ngày trong lịch gánh một phần lương cứng, theo mức có hiệu lực
         ĐÚNG NGÀY ĐÓ. Ngày vắng không phép thì phần đó không được cộng. */
      var perDayByKey = Object.create(null);
      schedule.forEach(function (d) {
        var entry = daily[d.dateKey];
        if (!entry) return;
        var monthly = entry.version.payload.fixedMonthlySalary;
        if (typeof monthly !== 'number') return;
        perDayByKey[d.dateKey] = {
          rate: monthly / r.scheduledDays,
          versionId: entry.version.versionId,
          multipleVersionsInDay: entry.multipleVersionsInDay
        };
      });

      var earnedKeys = r.worked.concat(r.excusedAbsent);
      earnedKeys.forEach(function (k) {
        var p = perDayByKey[k];
        if (!p) return;
        fixed.amount += p.rate;
        fixed.lines.push({
          dateKey: k,
          amount: p.rate,
          payTermsVersionId: p.versionId,
          reason: r.excusedAbsent.indexOf(k) !== -1 ? 'EXCUSED' : 'WORKED'
        });
      });
    }

    return R.ok({
      employeeId: employee.employeeId,
      storeId: employee.storeId,
      fromTs: spec.fromTs,
      toTs: spec.toTs,
      hourly: hourly,
      fixed: fixed,
      total: hourly.amount + fixed.amount,
      /* Ca tự đóng / đã sửa giờ đều chảy lên đây, không bị rơi mất. */
      needsReview: hourly.needsReview.length > 0,
      needsReviewDetail: hourly.needsReview,
      /* Version đã dùng — đọc lại kỳ này không phải resolve lại (V4). */
      payTermsVersionIds: hourly.lines.map(function (l) { return l.payTermsVersionId; })
        .concat(fixed.lines.map(function (l) { return l.payTermsVersionId; }))
        .filter(function (v, i, a) { return v && a.indexOf(v) === i; })
    });
  }

  /**
   * PayrollClosing — snapshot lương tháng BẤT BIẾN.
   *
   * Chưa từng tồn tại ở legacy. Dùng đúng pattern `book_closing`
   * (FIFO-COMPACTION-CONTRACT-V1.md §3): đã chốt thì ĐỌC THẲNG, không tính lại.
   */
  function closePayroll(spec) {
    if (!spec.monthKey || !/^\d{4}-\d{2}$/.test(spec.monthKey)) {
      return R.err('VALIDATION', 'closePayroll cần monthKey dạng YYYY-MM');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'chốt lương cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'chốt lương cần operationId');

    var results = spec.results || [];
    if (results.length === 0) return R.err('VALIDATION', 'không có kết quả lương nào để chốt');

    var unresolved = results.filter(function (r) { return r.needsReview; });
    if (unresolved.length && !spec.acknowledgeReview) {
      /* Chốt lương khi còn ca cần rà là chốt số chưa chắc đúng. Cho phép, nhưng
         phải xác nhận tường minh — không lặng lẽ chốt. */
      return R.err('PRECONDITION',
        unresolved.length + ' nhân viên còn ca cần rà (ca tự đóng hoặc đã sửa giờ) — ' +
        'phải xác nhận trước khi chốt', {
          employees: unresolved.map(function (r) { return r.employeeId; })
        });
    }

    return R.ok({
      payrollClosingId: ids.deterministicId('snapshot', ['payroll', spec.storeId, spec.monthKey]),
      storeId: spec.storeId,
      monthKey: spec.monthKey,
      revisionNo: spec.revisionNo || 1,
      supersedesClosingId: spec.supersedesClosingId || null,
      closedAt: spec.at,
      closedBy: spec.actorId,
      operationId: spec.operationId,
      acknowledgedReview: !!spec.acknowledgeReview,
      /* Đóng băng đủ chi tiết để in phiếu lương và trả lời "số nào đã trả". */
      lines: results.map(function (r) {
        return {
          employeeId: r.employeeId,
          hourlyHours: r.hourly.hours,
          hourlyAmount: r.hourly.amount,
          fixedAmount: r.fixed.amount,
          fixedScheduledDays: r.fixed.scheduledDays,
          fixedAbsentDays: r.fixed.absentDays,
          total: r.total,
          payTermsVersionIds: r.payTermsVersionIds,
          needsReview: r.needsReview
        };
      }),
      total: results.reduce(function (s, r) { return s + r.total; }, 0)
    });
  }

  /**
   * Đọc lương tháng: đã chốt thì đọc thẳng số đóng băng.
   * Đây là thứ làm cho "xem lương tháng 8 hôm nay" và "xem lại sau khi sửa
   * chấm công" ra CÙNG một số.
   */
  function readPayrollForMonth(spec) {
    if (spec.closing) {
      return R.ok({ source: 'CLOSING', frozen: true, data: spec.closing });
    }
    return R.ok({ source: 'LIVE', frozen: false, data: spec.liveResults || [] });
  }

  /**
   * Phát hiện số sống đã trôi khỏi số đã chốt (§3.2 của compaction contract).
   * Không tự sửa snapshot — chỉ báo, để người có quyền quyết định.
   */
  function detectPayrollDrift(closing, liveResults) {
    var byId = Object.create(null);
    (liveResults || []).forEach(function (r) { byId[r.employeeId] = r; });

    var drift = [];
    closing.lines.forEach(function (l) {
      var live = byId[l.employeeId];
      if (!live) {
        drift.push({ employeeId: l.employeeId, reason: 'KHÔNG CÒN DỮ LIỆU SỐNG', frozen: l.total, live: null });
        return;
      }
      if (live.total !== l.total) {
        drift.push({
          employeeId: l.employeeId, reason: 'SỐ SỐNG KHÁC SỐ ĐÃ CHỐT',
          frozen: l.total, live: live.total, difference: live.total - l.total
        });
      }
    });

    return R.ok({ monthKey: closing.monthKey, clean: drift.length === 0, drift: drift });
  }

  return {
    computePayroll: computePayroll,
    closePayroll: closePayroll,
    readPayrollForMonth: readPayrollForMonth,
    detectPayrollDrift: detectPayrollDrift
  };
});

/* ===== src/layers/hr/shift.js ===== */
/**
 * Employee shift — chấm công thật.
 *
 * Chuỗi thật khảo sát từ legacy: FIFO-CHAIN-TRACE-PAYROLL-V1.md.
 * Ba điều phải làm khác legacy:
 *
 * 1. `payTermsRef` là snapshot ĐỌC LẠI ĐƯỢC, không phải trường trang trí.
 *    Legacy ghi `payTerms` vào employee_shifts lúc check-in rồi KHÔNG BAO GIỜ
 *    đọc lại (grep 0 kết quả) — tính lương vẫn join bảng nhân viên hiện tại.
 *    Bug tưởng đã sửa nhưng thực ra chưa. Ở đây computeWage() chỉ nhận
 *    payTermsRef và KHÔNG có đường nào chạm tới Employee hiện tại.
 *
 * 2. Sửa ca phải phát domain event. Legacy sửa ca "hôm nay đang mở" làm tắt
 *    isEmployeeCheckedInToday() → khoá âm thầm 23 điểm requireCheckedIn() ở POS
 *    (kho, BTP, bill, checklist, giao ca). Side-effect chưa từng được tài liệu hoá.
 *
 * 3. Ca tự đóng phải bị gắn cờ. Giờ auto-close là SUY ĐOÁN, không phải giờ thật —
 *    lương không được im lặng tin nó.
 *
 * Layer này là domain thuần: trả về state mới + việc cần làm, không tự ghi.
 */
GIEO.define('hr/shift', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'hr/employee'
], function (ids, R, employeeLib) {
  'use strict';

  var STATUS = { OPEN: 'OPEN', CLOSED: 'CLOSED' };

  /* Quá ngưỡng này thì ca coi như bị treo (quên check-out), không phải làm thật. */
  var DEFAULT_MAX_SHIFT_HOURS = 16;

  var REVIEW = {
    AUTO_CLOSED: 'AUTO_CLOSED',
    REVISED: 'REVISED',
    NEGATIVE_DURATION: 'NEGATIVE_DURATION'
  };

  var HOUR = 3600 * 1000;

  function shiftId(employeeId, businessDate) {
    /* Id xác định: check-in 2 lần cùng ngày phải đụng cùng 1 bản ghi, không tạo
       ca thứ hai (nền của idempotency ở tầng command). */
    return ids.deterministicId('shift', [employeeId, businessDate]);
  }

  /**
   * Check-in. Snapshot PayTerms có hiệu lực TẠI THỜI ĐIỂM check-in.
   * Thiếu PayTerms thì TỪ CHỐI — không check-in bằng lương mặc định rồi tính sau,
   * vì "tính sau" nghĩa là tính bằng lương hiện tại, đúng bug đang phải sửa.
   */
  function checkIn(spec) {
    var employee = spec && spec.employee;
    if (!employee || !ids.isId(employee.employeeId, 'employee')) {
      return R.err('VALIDATION', 'checkIn cần employee hợp lệ');
    }
    if (typeof spec.at !== 'number') return R.err('VALIDATION', 'checkIn cần thời điểm "at"');
    if (!spec.businessDate) return R.err('VALIDATION', 'checkIn cần businessDate');
    if (!employee.active) return R.err('PRECONDITION', 'nhân viên đã nghỉ việc, không check-in được');
    if (!employeeLib.isEmployedAt(employee, spec.at)) {
      return R.err('PRECONDITION', 'thời điểm check-in nằm ngoài thời gian làm việc của nhân viên');
    }
    if (!spec.versionRegistry) return R.err('VALIDATION', 'checkIn cần versionRegistry để snapshot payTerms');

    var termsR = employeeLib.resolvePayTermsAt(
      spec.versionRegistry, employee.employeeId, employee.storeId, spec.at
    );
    if (R.isErr(termsR)) {
      return R.err('PRECONDITION',
        'chưa có PayTerms hiệu lực cho nhân viên tại thời điểm check-in — phải công bố PayTerms trước. ' +
        '(Cho check-in rồi tính lương sau đồng nghĩa tính bằng lương hiện tại, đúng lỗi đang phải sửa.)',
        { employeeId: employee.employeeId, at: spec.at });
    }

    return R.ok({
      shiftId: shiftId(employee.employeeId, spec.businessDate),
      employeeId: employee.employeeId,
      actorId: employee.actorId,
      storeId: employee.storeId,
      businessDate: spec.businessDate,
      checkedInAt: spec.at,
      checkedOutAt: null,
      status: STATUS.OPEN,
      /* Snapshot bắt buộc — V5 của FIFO-COMPACTION-CONTRACT-V1.md §1. */
      payTermsRef: spec.versionRegistry.snapshotRef(termsR.value),
      autoClosed: false,
      needsReview: false,
      needsReviewReasons: [],
      revisions: [],
      operationId: spec.operationId || null
    });
  }

  function checkOut(shift, at) {
    if (shift.status !== STATUS.OPEN) return R.err('PRECONDITION', 'ca không ở trạng thái OPEN');
    if (typeof at !== 'number') return R.err('VALIDATION', 'checkOut cần thời điểm');
    if (at < shift.checkedInAt) {
      return R.err('VALIDATION', 'giờ check-out sớm hơn giờ check-in');
    }
    return R.ok(Object.assign({}, shift, {
      checkedOutAt: at,
      status: STATUS.CLOSED
    }));
  }

  /**
   * Lớp tự đóng ca treo qua ngày.
   *
   * Khác legacy ở chỗ: giờ đóng tự động được GẮN CỜ needsReview. Đây là số suy
   * đoán, và lương thì không được im lặng trả theo số suy đoán — phải có người
   * xác nhận hoặc sửa.
   */
  function autoCloseIfStale(shift, nowTs, opts) {
    opts = opts || {};
    var maxHours = opts.maxShiftHours || DEFAULT_MAX_SHIFT_HOURS;
    if (shift.status !== STATUS.OPEN) return R.ok(shift);

    var elapsed = nowTs - shift.checkedInAt;
    if (elapsed <= maxHours * HOUR) return R.ok(shift);

    var reasons = shift.needsReviewReasons.slice();
    if (reasons.indexOf(REVIEW.AUTO_CLOSED) === -1) reasons.push(REVIEW.AUTO_CLOSED);

    return R.ok(Object.assign({}, shift, {
      checkedOutAt: shift.checkedInAt + maxHours * HOUR,
      status: STATUS.CLOSED,
      autoClosed: true,
      needsReview: true,
      needsReviewReasons: reasons
    }));
  }

  /**
   * Sửa giờ chấm công.
   *
   * Trả về CẢ state mới lẫn danh sách event phải phát. Gọi được mà không phát
   * event là cách legacy âm thầm khoá 23 actor-gate ở POS — nên event nằm ngay
   * trong giá trị trả về, không phải việc caller tự nhớ.
   */
  function reviseShift(shift, changes, spec) {
    if (!spec || !ids.isId(spec.actorId, 'actor')) {
      return R.err('VALIDATION', 'sửa chấm công phải có actorId — legacy thiếu audit ở đúng chỗ này');
    }
    if (!spec.operationId) return R.err('VALIDATION', 'sửa chấm công phải có operationId');
    if (!spec.reason) return R.err('VALIDATION', 'sửa chấm công phải có lý do');
    if (!changes || (changes.checkedInAt === undefined && changes.checkedOutAt === undefined)) {
      return R.err('VALIDATION', 'reviseShift cần ít nhất 1 thay đổi giờ');
    }

    var nextIn = changes.checkedInAt === undefined ? shift.checkedInAt : changes.checkedInAt;
    var nextOut = changes.checkedOutAt === undefined ? shift.checkedOutAt : changes.checkedOutAt;
    if (typeof nextIn !== 'number') return R.err('VALIDATION', 'checkedInAt phải là timestamp');
    if (nextOut !== null && typeof nextOut !== 'number') return R.err('VALIDATION', 'checkedOutAt phải là timestamp hoặc null');
    if (nextOut !== null && nextOut < nextIn) return R.err('VALIDATION', 'giờ ra sớm hơn giờ vào');

    var reasons = shift.needsReviewReasons.slice();
    if (reasons.indexOf(REVIEW.REVISED) === -1) reasons.push(REVIEW.REVISED);

    var next = Object.assign({}, shift, {
      checkedInAt: nextIn,
      checkedOutAt: nextOut,
      status: nextOut === null ? STATUS.OPEN : STATUS.CLOSED,
      needsReview: true,
      needsReviewReasons: reasons,
      /* Append-only: giữ nguyên giá trị trước để trả lời "số nào từng đúng". */
      revisions: shift.revisions.concat([{
        operationId: spec.operationId,
        actorId: spec.actorId,
        at: spec.at || null,
        reason: String(spec.reason),
        before: { checkedInAt: shift.checkedInAt, checkedOutAt: shift.checkedOutAt, status: shift.status },
        after: { checkedInAt: nextIn, checkedOutAt: nextOut }
      }])
    });

    var events = [];
    var wasOpen = shift.status === STATUS.OPEN;
    var nowOpen = next.status === STATUS.OPEN;
    if (spec.isCurrentBusinessDate && wasOpen !== nowOpen) {
      /* Đây là side-effect legacy chưa từng tài liệu hoá. Phát event để mọi
         actor-gate (checklist, ký tên kho/BTP, tạo bill, giao ca) refresh đồng
         bộ, thay vì để nhân viên bị khoá quyền không rõ nguyên nhân. */
      events.push({
        type: 'EmployeeCheckedInStateChanged',
        employeeId: shift.employeeId,
        actorId: shift.actorId,
        storeId: shift.storeId,
        businessDate: shift.businessDate,
        checkedIn: nowOpen,
        causedByOperationId: spec.operationId
      });
    }

    return R.ok({ shift: next, events: events });
  }

  /**
   * Actor-gate: "nhân viên này đã check-in hôm nay chưa".
   * POS gọi ở 23 chỗ. Một hàm duy nhất, không suy diễn lại ở từng chỗ.
   */
  function isCheckedIn(shifts, employeeId, businessDate) {
    for (var i = 0; i < shifts.length; i++) {
      var s = shifts[i];
      if (s.employeeId === employeeId && s.businessDate === businessDate && s.status === STATUS.OPEN) {
        return true;
      }
    }
    return false;
  }

  /** Giờ công thực tế của 1 ca. Ca chưa đóng thì KHÔNG đoán. */
  function workedHours(shift) {
    if (shift.checkedOutAt === null) {
      return R.err('PRECONDITION', 'ca chưa check-out, không tính được giờ công');
    }
    var ms = shift.checkedOutAt - shift.checkedInAt;
    if (ms < 0) return R.err('VALIDATION', 'ca có giờ ra sớm hơn giờ vào');
    return R.ok(ms / HOUR);
  }

  /**
   * Tiền công 1 ca.
   *
   * CHỈ nhận `shift` và đọc `shift.payTermsRef`. Không có tham số nào cho
   * Employee hiện tại, nên KHÔNG CÓ ĐƯỜNG NÀO để lặp lại bug legacy "join bảng
   * nhân viên hiện tại" — chặn bằng chữ ký hàm, không bằng lời nhắc.
   */
  function computeWage(shift) {
    if (!shift.payTermsRef || !shift.payTermsRef.payload) {
      return R.err('PRECONDITION', 'ca thiếu payTermsRef — không được tính lương bằng PayTerms hiện tại');
    }
    var hoursR = workedHours(shift);
    if (R.isErr(hoursR)) return hoursR;

    var hours = hoursR.value;
    var t = shift.payTermsRef.payload;
    var normalHours = Math.min(hours, t.otThreshold);
    var otHours = Math.max(0, hours - t.otThreshold);

    return R.ok({
      hours: hours,
      normalHours: normalHours,
      otHours: otHours,
      amount: normalHours * t.rate + otHours * t.otRate,
      /* V4: kết quả mang theo versionId đã dùng, để đọc lại lịch sử không phải
         resolve lại. */
      payTermsVersionId: shift.payTermsRef.versionId,
      needsReview: shift.needsReview,
      needsReviewReasons: shift.needsReviewReasons.slice()
    });
  }

  return {
    STATUS: STATUS,
    REVIEW: REVIEW,
    DEFAULT_MAX_SHIFT_HOURS: DEFAULT_MAX_SHIFT_HOURS,
    shiftId: shiftId,
    checkIn: checkIn,
    checkOut: checkOut,
    autoCloseIfStale: autoCloseIfStale,
    reviseShift: reviseShift,
    isCheckedIn: isCheckedIn,
    workedHours: workedHours,
    computeWage: computeWage
  };
});

/* ===== src/layers/hr/work-schedule.js ===== */
/**
 * Work schedule — lịch làm việc đã xếp.
 *
 * Ở legacy đây là dữ liệu CHỈ ĐỂ ĐỌC, dùng so sánh đi trễ, không nối vào tính
 * lương (`FIFO-CHAIN-TRACE-PAYROLL-V1.md` §6: lương cứng cộng đều mọi ngày,
 * KHÔNG kiểm tra work_schedules hay có chấm công hay không — nghỉ dài ngày
 * không tự trừ).
 *
 * Chủ quán đã chốt: **lương cứng trừ theo lịch làm việc**. Nên domain này từ
 * optional thành BẮT BUỘC cho payroll — không có lịch thì không biết ngày nào
 * là vắng mặt, và mọi phép trừ đều là đoán.
 */
GIEO.define('hr/work-schedule', ['shared-kernel/ids', 'shared-kernel/result'], function (ids, R) {
  'use strict';

  function scheduleId(employeeId, dateKey) {
    return ids.deterministicId('shift', ['sched', employeeId, dateKey]);
  }

  /** Một ngày được xếp lịch cho một nhân viên. */
  function scheduleDay(spec) {
    if (!ids.isId(spec.employeeId, 'employee')) return R.err('VALIDATION', 'cần employeeId hợp lệ');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'cần storeId hợp lệ');
    if (!spec.clock || !spec.clock.isDateKey(spec.dateKey)) {
      return R.err('VALIDATION', 'cần dateKey dạng YYYY-MM-DD');
    }
    return R.ok({
      scheduleId: scheduleId(spec.employeeId, spec.dateKey),
      employeeId: spec.employeeId,
      storeId: spec.storeId,
      dateKey: spec.dateKey,
      plannedHours: typeof spec.plannedHours === 'number' ? spec.plannedHours : null,
      /* Nghỉ có phép: vẫn nằm trong lịch nhưng KHÔNG bị tính là vắng mặt.
         Legacy không có khái niệm này nên không phân biệt được nghỉ phép với
         nghỉ không báo. */
      excused: !!spec.excused,
      excusedReason: spec.excusedReason || null
    });
  }

  function markExcused(day, reason) {
    if (!reason) return R.err('VALIDATION', 'nghỉ có phép phải ghi lý do');
    return R.ok(Object.assign({}, day, { excused: true, excusedReason: String(reason) }));
  }

  /**
   * Đối chiếu lịch với chấm công thật.
   *
   * Trả 3 nhóm tách bạch, vì chúng dẫn tới 3 xử lý khác nhau:
   *   worked         — có lịch, có đi làm
   *   absent         — có lịch, không đi làm, không phép  → CƠ SỞ TRỪ LƯƠNG CỨNG
   *   excusedAbsent  — có lịch, không đi làm, có phép     → không trừ
   *   unscheduled    — đi làm ngoài lịch                  → không cộng thêm, nhưng phải thấy được
   */
  function reconcile(spec) {
    var days = spec.scheduleDays || [];
    var shifts = spec.shifts || [];

    var workedKeys = Object.create(null);
    shifts.forEach(function (s) { workedKeys[s.businessDate] = true; });

    var scheduledKeys = Object.create(null);
    var worked = [];
    var absent = [];
    var excusedAbsent = [];

    days.forEach(function (d) {
      scheduledKeys[d.dateKey] = true;
      if (workedKeys[d.dateKey]) worked.push(d.dateKey);
      else if (d.excused) excusedAbsent.push(d.dateKey);
      else absent.push(d.dateKey);
    });

    var unscheduled = Object.keys(workedKeys).filter(function (k) { return !scheduledKeys[k]; });

    return R.ok({
      scheduledDays: days.length,
      worked: worked,
      absent: absent,
      excusedAbsent: excusedAbsent,
      unscheduled: unscheduled.sort()
    });
  }

  return {
    scheduleId: scheduleId,
    scheduleDay: scheduleDay,
    markExcused: markExcused,
    reconcile: reconcile
  };
});

/**
 * Config — cấu hình vận hành, đi qua cơ chế versioning DÙNG CHUNG.
 *
 * FEATURE-TREE-V1.md §2 mục [7]: domain này optional với phần còn lại của hệ
 * thống, mọi thứ CÓ DEFAULT — nên không domain nào phải chờ nó mới chạy được.
 * Nhưng khi giá trị được đặt thì nó phải versioned, vì có những cấu hình ảnh
 * hưởng thẳng vào số liệu lịch sử (KPI target là instance #6 của lớp lỗi đã
 * xác nhận 7 lần: `computeKPIs()` resolve target tại NGÀY CUỐI của cả khoảng
 * báo cáo rồi áp cho toàn khoảng).
 *
 * `FINISH_REVIEW_RATIO` nằm ở đây theo đúng xác nhận của chủ quán: cấu hình ở
 * QUANLY, không hard-code. fifo-core nhận nó qua tham số nên vẫn là domain
 * thuần — nó không tự đọc config.
 */
GIEO.define('finance/config', [
  'shared-kernel/result',
  'compaction/versioned-input'
], function (R, VI) {
  'use strict';

  /**
   * Khoá cấu hình và giá trị mặc định.
   *
   * Mặc định có mặt để hệ thống chạy được ngay khi chưa ai cấu hình gì — đúng
   * nguyên tắc "domain này optional với phần còn lại".
   */
  var KEYS = {
    /* Báo hết hũ khi còn > tỉ lệ này thì gắn needsReview (chủ quán chốt: cấu
       hình ở QUANLY). 0.25 là con số legacy từng định dùng nhưng chưa bao giờ
       nối vào code. */
    finishReviewRatio: { default: 0.25, min: 0, max: 1 },
    /* Ngưỡng cảnh báo giá vốn / hao hụt — nền của alert chủ động. */
    cogsPctTarget: { default: null, min: 0, max: 100 },
    wastePctTarget: { default: null, min: 0, max: 100 },
    /* Ngưỡng dung sai khi đối chiếu tồn kho. */
    stockVarianceTolerance: { default: 0, min: 0, max: null },
    /* Số lần đếm tiền tối đa trước khi chốt đoạn ca. */
    maxCashCounts: { default: 3, min: 1, max: 20 }
  };

  function isKey(k) { return Object.prototype.hasOwnProperty.call(KEYS, k); }

  function publishConfig(registry, spec) {
    if (!spec || !isKey(spec.key)) {
      return R.err('VALIDATION', 'khoá cấu hình không hợp lệ: ' + (spec && spec.key));
    }
    var def = KEYS[spec.key];
    if (typeof spec.value !== 'number') {
      return R.err('VALIDATION', 'giá trị cấu hình "' + spec.key + '" phải là số');
    }
    if (def.min !== null && spec.value < def.min) {
      return R.err('VALIDATION', spec.key + ' phải >= ' + def.min);
    }
    if (def.max !== null && spec.value > def.max) {
      return R.err('VALIDATION', spec.key + ' phải <= ' + def.max);
    }

    return registry.publish({
      kind: VI.KINDS.config,
      subjectId: spec.key,
      storeId: spec.storeId,
      effectiveFrom: spec.effectiveFrom,
      publishedBy: spec.publishedBy,
      payload: { key: spec.key, value: spec.value }
    });
  }

  /**
   * Giá trị có hiệu lực TẠI THỜI ĐIỂM SỰ KIỆN, rơi về mặc định nếu chưa ai đặt.
   * Trả kèm `versionId` (null khi dùng mặc định) để nơi ghi kết quả lưu lại được.
   */
  function resolveConfigAt(registry, spec) {
    if (!isKey(spec.key)) return R.err('VALIDATION', 'khoá cấu hình không hợp lệ: ' + spec.key);
    var r = registry.resolveAt(VI.KINDS.config, spec.key, spec.storeId, spec.at);
    if (R.isOk(r)) {
      return R.ok({ key: spec.key, value: r.value.payload.value, versionId: r.value.versionId, isDefault: false });
    }
    return R.ok({ key: spec.key, value: KEYS[spec.key].default, versionId: null, isDefault: true });
  }

  /**
   * KPI target theo TỪNG NGÀY — đóng instance #6.
   *
   * Legacy resolve target tại ngày cuối của cả khoảng báo cáo rồi áp cho toàn
   * khoảng, nên mọi ngày còn lại đều bị so với target sai. Có hàm này thì
   * không còn lý do làm vậy.
   */
  function resolveConfigDaily(registry, spec) {
    if (!isKey(spec.key)) return R.err('VALIDATION', 'khoá cấu hình không hợp lệ: ' + spec.key);
    var r = registry.resolveDaily(VI.KINDS.config, spec.key, spec.storeId, spec.fromTs, spec.toTs);
    if (R.isOk(r)) return r;
    /* Chưa ai đặt giá trị nào trong kỳ: dùng mặc định cho mọi ngày, và NÓI RÕ
       là mặc định thay vì giả vờ có cấu hình. */
    var out = {};
    var clock = spec.clock;
    clock.eachDay(spec.fromTs, spec.toTs).forEach(function (dateKey) {
      out[dateKey] = {
        dateKey: dateKey,
        version: null,
        value: KEYS[spec.key].default,
        isDefault: true,
        multipleVersionsInDay: false
      };
    });
    return R.ok(out);
  }

  return {
    KEYS: KEYS,
    isKey: isKey,
    publishConfig: publishConfig,
    resolveConfigAt: resolveConfigAt,
    resolveConfigDaily: resolveConfigDaily
  };
});

/**
 * Expense — chi phí vận hành.
 *
 * FEATURE-TREE-V1.md §2 mục [7]: hard dep để POS ghi chi phí; phần còn lại của
 * domain optional.
 *
 * Điểm cần đúng ngay từ đầu: chi phí ƯỚC TÍNH và chi phí THẬT phải phân biệt
 * được. Chain-trace P&L cho thấy `chotSoThang()` chỉ cho chốt khi không còn
 * chi phí "ước tính chờ số thật" — tức là khái niệm này ĐÃ tồn tại trong
 * nghiệp vụ thật và là điều kiện chốt sổ, nên nó phải là field tường minh chứ
 * không phải quy ước ngầm trong ghi chú.
 */
GIEO.define('finance/expense', [
  'shared-kernel/ids',
  'shared-kernel/result'
], function (ids, R) {
  'use strict';

  var STATUS = {
    /* Số ước tính, chờ hoá đơn thật — CHẶN chốt sổ tháng. */
    ESTIMATED: 'ESTIMATED',
    ACTUAL: 'ACTUAL',
    PENDING_APPROVAL: 'PENDING_APPROVAL',
    REJECTED: 'REJECTED'
  };

  /* Chi phí cố định phân bổ đều theo tháng vs biến phí theo phát sinh —
     phân biệt vì P&L cần tách 2 loại. */
  var NATURE = { FIXED: 'FIXED', VARIABLE: 'VARIABLE' };

  function createExpense(spec) {
    if (!spec) return R.err('VALIDATION', 'expense cần spec');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'expense cần storeId hợp lệ');
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'expense cần actorId — ai ghi khoản này');
    if (!spec.categoryId) return R.err('VALIDATION', 'expense cần categoryId');
    if (typeof spec.amount !== 'number' || !(spec.amount > 0)) {
      return R.err('VALIDATION', 'số tiền phải dương');
    }
    if (!spec.businessDate) return R.err('VALIDATION', 'expense cần businessDate');
    if (!STATUS[spec.status]) {
      return R.err('VALIDATION',
        'expense phải khai rõ status — ESTIMATED (chờ số thật) hay ACTUAL. ' +
        'Không phân biệt được thì không biết tháng đã đủ điều kiện chốt sổ chưa.');
    }
    if (!NATURE[spec.nature]) return R.err('VALIDATION', "nature phải là FIXED hoặc VARIABLE");
    if (!spec.operationId) return R.err('VALIDATION', 'expense cần operationId');

    return R.ok({
      expenseId: spec.expenseId || ids.newId('expense'),
      storeId: spec.storeId,
      categoryId: spec.categoryId,
      amount: spec.amount,
      nature: spec.nature,
      status: spec.status,
      businessDate: spec.businessDate,
      occurredAt: spec.occurredAt || null,
      actorId: spec.actorId,
      paymentMethodId: spec.paymentMethodId || null,
      note: spec.note || null,
      operationId: spec.operationId,
      revisions: []
    });
  }

  /**
   * Thay số ước tính bằng số thật.
   * Append-only: giữ giá trị cũ để trả lời "trước đây ước bao nhiêu".
   */
  function settleEstimate(expense, spec) {
    if (expense.status !== STATUS.ESTIMATED) {
      return R.err('PRECONDITION', 'chỉ chốt được khoản đang ở trạng thái ước tính');
    }
    if (typeof spec.actualAmount !== 'number' || !(spec.actualAmount > 0)) {
      return R.err('VALIDATION', 'số thật phải dương');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'chốt số thật cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'chốt số thật cần operationId');

    return R.ok(Object.assign({}, expense, {
      amount: spec.actualAmount,
      status: STATUS.ACTUAL,
      revisions: expense.revisions.concat([{
        operationId: spec.operationId,
        actorId: spec.actorId,
        at: spec.at || null,
        from: { amount: expense.amount, status: expense.status },
        to: { amount: spec.actualAmount, status: STATUS.ACTUAL },
        reason: spec.reason || 'có hoá đơn thật'
      }])
    }));
  }

  /**
   * Lý do CHẶN chốt sổ tháng — giữ nguyên điều kiện nghiệp vụ của legacy
   * ("chỉ cho chốt khi tháng đã kết thúc VÀ không còn chi phí ước tính chờ số
   * thật"), nhưng nêu rõ khoản nào thay vì chỉ báo không chốt được.
   */
  function closeBookBlockers(expenses) {
    var blockers = [];
    (expenses || []).forEach(function (e) {
      if (e.status === STATUS.ESTIMATED) {
        blockers.push('khoản "' + e.categoryId + '" (' + e.amount + ') còn là số ước tính, chờ hoá đơn thật');
      }
      if (e.status === STATUS.PENDING_APPROVAL) {
        blockers.push('khoản "' + e.categoryId + '" (' + e.amount + ') chưa được duyệt');
      }
    });
    return blockers;
  }

  /** Tổng theo loại — đầu vào của P&L. */
  function summarize(expenses) {
    var out = { fixed: 0, variable: 0, estimated: 0, actual: 0, total: 0, byCategory: {} };
    (expenses || []).forEach(function (e) {
      if (e.status === STATUS.REJECTED) return;
      if (e.nature === NATURE.FIXED) out.fixed += e.amount; else out.variable += e.amount;
      if (e.status === STATUS.ESTIMATED) out.estimated += e.amount; else out.actual += e.amount;
      out.total += e.amount;
      out.byCategory[e.categoryId] = (out.byCategory[e.categoryId] || 0) + e.amount;
    });
    return out;
  }

  return {
    STATUS: STATUS,
    NATURE: NATURE,
    createExpense: createExpense,
    settleEstimate: settleEstimate,
    closeBookBlockers: closeBookBlockers,
    summarize: summarize
  };
});

    },
    DAY_NOT_CLOSED: {
      severity: SEVERITY.WARNING, audience: AUDIENCE.BOTH,
      resolution: RESOLUTION.AUTO_VERIFIABLE, required: ['dateKey']
    }
  };

  function isType(t) { return Object.prototype.hasOwnProperty.call(TYPES, t); }

  function raise(spec) {
    if (!spec || !isType(spec.type)) {
      return R.err('VALIDATION', 'loại cảnh báo chưa đăng ký: ' + (spec && spec.type) +
        ' — mọi loại phải khai severity/audience/cách đóng, không có khuôn chung');
    }
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'cảnh báo cần storeId hợp lệ');
    if (!spec.businessDate) return R.err('VALIDATION', 'cảnh báo cần businessDate');

    var def = TYPES[spec.type];
    var data = spec.data || {};
    for (var i = 0; i < def.required.length; i++) {
      if (data[def.required[i]] === undefined || data[def.required[i]] === null) {
        return R.err('VALIDATION',
          'cảnh báo ' + spec.type + ' thiếu trường chẩn đoán bắt buộc "' + def.required[i] + '"');
      }
    }

    return R.ok({
      /* Id xác định theo (type, subject): cùng một vấn đề không sinh 20 cảnh báo. */
      alertId: ids.deterministicId('alert', [spec.type, spec.storeId, spec.subjectKey || 'store']),
      type: spec.type,
      storeId: spec.storeId,
      severity: def.severity,
      audience: def.audience,
      resolution: def.resolution,
      status: STATUS.NEW,
      subjectKey: spec.subjectKey || null,
      data: data,
      businessDate: spec.businessDate,
      raisedAt: spec.at || null,
      raisedByOperationId: spec.operationId || null,
      seenAt: null, seenBy: null,
      resolvedAt: null, resolvedBy: null, resolvedReferenceId: null,
      autoClearedAt: null
    });
  }

  /**
   * Xếp hạng — đọc CẢ severity lẫn type.
   *
   * Đây là chỗ legacy sai: chỉ switch theo type nên alert `danger` không nằm
   * trong danh sách cứng bị nuốt vào bucket vàng chung.
   */
  function rank(alerts, spec) {
    spec = spec || {};
    var audience = spec.audience;
    return alerts
      .filter(function (a) {
        if (a.status === STATUS.RESOLVED || a.status === STATUS.AUTO_CLEARED) return false;
        if (!audience) return true;
        return a.audience === audience || a.audience === AUDIENCE.BOTH;
      })
      .slice()
      .sort(function (a, b) {
        var d = SEVERITY_RANK[b.severity] - SEVERITY_RANK[a.severity];
        if (d !== 0) return d;
        /* Cùng mức thì cũ trước — việc tồn lâu không được lùi xuống cuối. */
        if (a.raisedAt !== b.raisedAt) return (a.raisedAt || 0) - (b.raisedAt || 0);
        return a.alertId < b.alertId ? -1 : 1;
      });
  }

  /** Không có loại nào rơi vào bucket "khác" — mọi loại đều có nhà. */
  function bucketize(alerts, spec) {
    var ranked = rank(alerts, spec);
    var out = { DANGER: [], WARNING: [], INFO: [] };
    ranked.forEach(function (a) { out[a.severity].push(a); });
    return out;
  }

  /**
   * "Đã xem" — KHÔNG tắt push.
   * Legacy để "Đã xem" tắt cảnh báo y hệt "Đã xử lý"; ở đây nó chỉ ghi nhận
   * người đã nhìn thấy, vấn đề gốc vẫn còn nên vẫn còn hiện.
   */
  function markSeen(alert, spec) {
    if (alert.status !== STATUS.NEW) return R.ok(alert);
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'markSeen cần actorId');
    return R.ok(Object.assign({}, alert, {
      status: STATUS.SEEN, seenAt: spec.at || null, seenBy: spec.actorId
    }));
  }

  /**
   * "Đã xử lý" — với loại không tự kiểm chứng được thì BẮT BUỘC link tới hành
   * động đã sửa (ReviseState / ReverseTransaction / approval...). Không có link
   * thì đó chỉ là bấm cho khuất mắt.
   */
  function resolve(alert, spec) {
    if (alert.status === STATUS.RESOLVED || alert.status === STATUS.AUTO_CLEARED) {
      return R.err('PRECONDITION', 'cảnh báo đã đóng');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'resolve cần actorId');

    if (alert.resolution === RESOLUTION.AUTO_VERIFIABLE) {
      return R.err('PRECONDITION',
        'loại "' + alert.type + '" tự đóng khi điều kiện thật sự hết — không đóng tay được. ' +
        'Bấm tắt bằng tay là cách bỏ qua vấn đề gốc.');
    }
    if (!spec.referenceId) {
      return R.err('VALIDATION',
        'đóng cảnh báo "' + alert.type + '" phải kèm referenceId trỏ tới hành động đã sửa — ' +
        'không có tham chiếu thì không chứng minh được vấn đề đã được xử lý');
    }

    return R.ok(Object.assign({}, alert, {
      status: STATUS.RESOLVED,
      resolvedAt: spec.at || null,
      resolvedBy: spec.actorId,
      resolvedReferenceId: spec.referenceId
    }));
  }

  /**
   * Quét lại: loại AUTO_VERIFIABLE nào không còn điều kiện thì tự đóng.
   *
   * Đây là pattern của FIFO bell — cơ chế DUY NHẤT của legacy tự xoá đúng khi
   * điều kiện thật sự hết, thay vì chờ người bấm ẩn. Giờ là mặc định.
   *
   * @param spec.stillActiveKeys  danh sách subjectKey còn đang có vấn đề
   */
  function reconcile(alerts, spec) {
    var active = Object.create(null);
    (spec.stillActiveKeys || []).forEach(function (k) { active[k] = true; });

    var cleared = [];
    var next = alerts.map(function (a) {
      if (a.resolution !== RESOLUTION.AUTO_VERIFIABLE) return a;
      if (a.status === STATUS.RESOLVED || a.status === STATUS.AUTO_CLEARED) return a;
      if (active[a.subjectKey]) return a;
      var done = Object.assign({}, a, { status: STATUS.AUTO_CLEARED, autoClearedAt: spec.at || null });
      cleared.push(done);
      return done;
    });

    return R.ok({ alerts: next, cleared: cleared });
  }

  /**
   * Kênh ngoài app (push OS / SMS / Zalo) là CHỖ NỐI SẴN (§6 luồng chuẩn).
   * AlertEngine chỉ phát event; handler bên ngoài đăng ký sau, không phải sửa
   * lại engine.
   */
  function toEvents(alerts) {
    return alerts.map(function (a) {
      return {
        type: 'AlertRaised',
        alertId: a.alertId,
        alertType: a.type,
        severity: a.severity,
        audience: a.audience,
        storeId: a.storeId,
        businessDate: a.businessDate,
        data: a.data
      };
    });
  }

  return {
    SEVERITY: SEVERITY,
    AUDIENCE: AUDIENCE,
    RESOLUTION: RESOLUTION,
    STATUS: STATUS,
    TYPES: TYPES,
    isType: isType,
    raise: raise,
    rank: rank,
    bucketize: bucketize,
    markSeen: markSeen,
    resolve: resolve,
    reconcile: reconcile,
    toEvents: toEvents
  };
});

/* ===== src/layers/protected-adapters/bank-payment.js ===== */
/**
 * BankPaymentAdapter — chuyển khoản VietQR.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §4.
 *
 * Bắt tay MỘT LẦN: webhook (ngoài repo này) ghi vào `bank_confirmations/{orderId}`,
 * client lắng nghe node đó, có bản ghi thì coi là đã thanh toán rồi XOÁ node ngay.
 *
 * ────────────────────────────────────────────────────────────────────────
 * 🔴 RỦI RO ĐÃ BIẾT, GIỮ NGUYÊN CÓ CHỦ ĐÍCH (§4.2)
 *
 * Adapter này KHÔNG đối chiếu số tiền. Nó chỉ kiểm tra bản ghi TỒN TẠI; field
 * `amount` chỉ để hiển thị. Việc đối soát số tiền nằm hoàn toàn ở phía webhook
 * ghi vào `bank_confirmations` — thứ nằm NGOÀI hai file HTML đã audit nên
 * không kiểm chứng được từ đây.
 *
 * Contract quyết định: giữ đúng contract "tin tưởng sự tồn tại của bản ghi tại
 * path one-shot", NHƯNG phải cảnh báo rõ. Nên adapter này:
 *   - không tự thêm đối chiếu phía client (làm vậy là đổi semantics của một
 *     ranh giới protected),
 *   - TRẢ VỀ cờ `amountNotVerifiedClientSide` trên mọi lần xác nhận, để không
 *     ai đọc code này mà tưởng số tiền đã được kiểm.
 *
 * Ai viết lại webhook ở repo/service khác: ĐÂY là chỗ bắt buộc phải validate
 * `addInfo`/số tiền trước khi ghi. Hiện tại đó là một giả định ngầm.
 * ────────────────────────────────────────────────────────────────────────
 *
 * §4.5 — `bankOrderId ≠ operationId`. Mã này chỉ định danh giao dịch NGÂN HÀNG,
 * KHÔNG được dùng làm khoá idempotency cho command nội bộ.
 */
GIEO.define('protected-adapters/bank-payment', ['shared-kernel/result'], function (R) {
  'use strict';

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  /**
   * Sinh mã giao dịch ngân hàng — giữ đúng định dạng legacy `'GG' + ddHHmmss`.
   * Định dạng này có ý nghĩa với người đối soát sao kê, nên không đổi.
   */
  function genBankOrderId(at) {
    var d = new Date(at);
    return 'GG' + pad2(d.getDate()) + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
  }

  function createBankPayment(opts) {
    opts = opts || {};
    var store = opts.confirmationStore;
    if (!store) throw new Error('[bank-payment] cần confirmationStore (RTDB bank_confirmations)');
    var clock = opts.clock;
    if (!clock) throw new Error('[bank-payment] cần clock');

    var active = Object.create(null);

    /** Dựng URL ảnh QR. Tài khoản cố định của quán, cấu hình ở ngoài. */
    function buildQrUrl(spec) {
      if (!opts.bankAccount) return R.err('PRECONDITION', 'chưa cấu hình tài khoản nhận tiền');
      if (typeof spec.amount !== 'number' || !(spec.amount > 0)) {
        return R.err('VALIDATION', 'số tiền phải dương');
      }
      return R.ok({
        bankOrderId: spec.bankOrderId,
        url: opts.qrBaseUrl + '?acc=' + encodeURIComponent(opts.bankAccount)
          + '&amount=' + spec.amount
          + '&addInfo=' + encodeURIComponent(spec.bankOrderId),
        amount: spec.amount
      });
    }

    /**
     * Mở một lượt chờ chuyển khoản.
     *
     * KHÔNG có timeout (§4.3). Legacy không có `setTimeout` nào tự đóng popup,
     * và đó là quyết định nghiệp vụ hợp lý — nhân viên toàn quyền quyết định
     * khi nào huỷ. Không tự ý thêm vào.
     */
    function open(spec) {
      var bankOrderId = spec.bankOrderId || genBankOrderId(clock.now());
      var qr = buildQrUrl({ bankOrderId: bankOrderId, amount: spec.amount });
      if (R.isErr(qr)) return qr;

      var session = {
        bankOrderId: bankOrderId,
        amount: spec.amount,
        qrUrl: qr.value.url,
        openedAt: clock.now(),
        status: 'WAITING',
        /* §4.5 — nói rõ ngay trong dữ liệu để không ai dùng nhầm. */
        notAnOperationId: true
      };
      active[bankOrderId] = session;

      /* Lắng nghe node one-shot. Cả hai đường (webhook và bấm tay) đều đi vào
         cùng một hàm settle. */
      var unsubscribe = store.listen(bankOrderId, function (snapshot) {
        if (!snapshot) return;
        settle(bankOrderId, 'WEBHOOK', snapshot);
      });
      session.unsubscribe = unsubscribe;

      return R.ok(session);
    }

    /**
     * Chốt một lượt. Dùng chung cho webhook lẫn bấm tay — §4.1 nói rõ đường
     * thủ công chạy ĐÚNG callback y hệt đường tự động, không có luồng riêng.
     */
    function settle(bankOrderId, source, snapshot) {
      var session = active[bankOrderId];
      if (!session) return R.err('NOT_FOUND', 'không có lượt chờ nào cho ' + bankOrderId);
      if (session.status !== 'WAITING') {
        /* One-shot: chốt lần hai là no-op có kiểm soát. */
        return R.ok(Object.assign({}, session, { replayed: true }));
      }

      session.status = 'CONFIRMED';
      session.confirmedAt = clock.now();
      session.source = source;
      if (session.unsubscribe) session.unsubscribe();

      /* Xoá node NGAY — bắt tay một lần. */
      store.remove(bankOrderId);
      delete active[bankOrderId];

      if (typeof opts.onConfirmed === 'function') opts.onConfirmed(session);

      return R.ok({
        bankOrderId: bankOrderId,
        source: source,
        amountShown: snapshot && typeof snapshot.amount === 'number' ? snapshot.amount : null,
        expectedAmount: session.amount,
        /* Cờ này luôn true. Đọc code ở đây mà tưởng số tiền đã được kiểm là
           hiểu sai một ranh giới protected — xem ghi chú đầu file. */
        amountNotVerifiedClientSide: true,
        confirmedAt: session.confirmedAt
      });
    }

    /** Nhân viên bấm "ĐÃ CHUYỂN KHOẢN XONG". */
    function confirmManually(bankOrderId) {
      return settle(bankOrderId, 'MANUAL', null);
    }

    /** Nhân viên tự đóng popup. */
    function cancel(bankOrderId) {
      var session = active[bankOrderId];
      if (!session) return R.err('NOT_FOUND', 'không có lượt chờ nào cho ' + bankOrderId);
      if (session.unsubscribe) session.unsubscribe();
      session.status = 'CANCELLED';
      delete active[bankOrderId];
      return R.ok(session);
    }

    function activeCount() { return Object.keys(active).length; }

    return {
      genBankOrderId: genBankOrderId,
      buildQrUrl: buildQrUrl,
      open: open,
      confirmManually: confirmManually,
      cancel: cancel,
      activeCount: activeCount
    };
  }

  return { genBankOrderId: genBankOrderId, createBankPayment: createBankPayment };
});

/* ===== src/layers/protected-adapters/bill-printer.js ===== */
/**
 * BillPrinterAdapter — máy in bill, Bluetooth qua APK.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §1.
 *
 * Ba điều đã chốt, giữ nguyên:
 *   - CHỈ một đường Bluetooth qua `AndroidPrinter.printBillRawBytes`.
 *     KHÔNG mang `XprinterWNN58E`/Web Serial sang (DEAD-FEATURE-PRUNING §4) —
 *     hệ thống mới chỉ chạy trong APK nên không cần nhánh dự phòng cho trình
 *     duyệt thường như legacy.
 *   - In bill KHÔNG BAO GIỜ chặn hay rollback việc trừ kho/ghi bill. Order và
 *     ledger đã chốt TRƯỚC khi in được gọi; in hỏng chỉ báo, không tạo lại đơn,
 *     không hoàn kho (§1.1).
 *   - Máy phải ghép nối Bluetooth trước trong Cài đặt Android; app không tự
 *     pair, chỉ nhớ MAC và tự nối lại lúc khởi động.
 *
 * Một điều PHẢI SỬA: hàng đợi tự phục hồi — xem `protected-adapters/print-queue`.
 *
 * Cửa sổ thời gian cho phép in lại, log chống gian lận, giới hạn hiển thị lịch
 * sử bill KHÔNG nằm ở đây — chúng là business rule, thuộc `packages/commands`
 * (ranh giới §5).
 */
GIEO.define('protected-adapters/bill-printer', [
  'shared-kernel/result',
  'protected-adapters/print-queue'
], function (R, queueLib) {
  'use strict';

  /**
   * @param opts.bridge      native-bridge
   * @param opts.encodeBill  (content) => bytes — rasterize canvas thành byte
   * @param opts.onError
   */
  function createBillPrinter(opts) {
    opts = opts || {};
    var bridge = opts.bridge;
    if (!bridge) throw new Error('[bill-printer] cần bridge');

    /* Queue RIÊNG của máy in bill — tem kẹt giấy không được làm nghẽn in bill. */
    var queue = queueLib.createPrintQueue({ name: 'bill-printer', onError: opts.onError });

    var state = { enabled: true, mac: null, connected: false };

    function setEnabled(v) { state.enabled = !!v; }
    function isEnabled() { return state.enabled; }

    /** Nhớ MAC. Legacy lưu ở `printer_layout_gieogieo.billPrinterMac` (dùng
        chung mọi máy POS trong quán) — adapter chỉ giữ giá trị, nơi lưu là
        việc của tầng persistence. */
    function rememberMac(mac) {
      state.mac = mac || null;
      return R.ok(state.mac);
    }

    function connect(mac) {
      var target = mac || state.mac;
      if (!target) {
        return Promise.resolve(R.err('PRECONDITION',
          'chưa có địa chỉ máy in bill — phải ghép nối Bluetooth trong Cài đặt Android trước'));
      }
      return bridge.connectBluetooth(target).then(function (r) {
        state.connected = R.isOk(r);
        if (R.isOk(r)) state.mac = target;
        return r;
      });
    }

    /** Tự nối lại lúc khởi động bằng MAC đã nhớ. */
    function reconnectOnBoot() {
      if (!state.mac) return Promise.resolve(R.ok({ skipped: 'NO_REMEMBERED_MAC' }));
      return connect(state.mac);
    }

    /**
     * In một bill.
     *
     * LUÔN trả Promise đã resolve — lỗi in là giá trị trả về. Caller (luồng
     * thanh toán) gọi fire-and-forget và KHÔNG được để kết quả ở đây ảnh hưởng
     * tới việc bill đã ghi và kho đã trừ.
     */
    function print(content, label) {
      if (!state.enabled) {
        return Promise.resolve(R.ok({ skipped: 'PRINTER_DISABLED' }));
      }
      return queue.enqueue(function () {
        var bytes = opts.encodeBill ? opts.encodeBill(content) : content;
        return bridge.printBillRawBytes(bytes).then(function (r) {
          if (R.isErr(r)) throw new Error(r.error.message);
          return true;
        });
      }, label || 'bill');
    }

    /**
     * In lại. Về mặt kỹ thuật giống hệt in lần đầu — "in thuần tuý", không có
     * side-effect nào khác (§1.4). Việc có được in lại hay không, và ghi log
     * chống gian lận, là quyết định của tầng command.
     */
    function reprint(content, label) {
      return print(content, label || 'reprint-bill');
    }

    function openCashDrawer() { return bridge.openCashDrawer(); }

    return {
      setEnabled: setEnabled,
      isEnabled: isEnabled,
      rememberMac: rememberMac,
      connect: connect,
      reconnectOnBoot: reconnectOnBoot,
      print: print,
      reprint: reprint,
      openCashDrawer: openCashDrawer,
      drain: queue.drain,
      queueStats: queue.snapshot,
      queueHealthy: queue.isHealthy,
      state: function () { return Object.assign({}, state); }
    };
  }

  return { createBillPrinter: createBillPrinter };
});

/* ===== src/layers/protected-adapters/label-printer.js ===== */
/**
 * LabelPrinterAdapter — máy in tem, LAN/TCP qua APK.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §2.
 *
 * Phức tạp hơn máy in bill nhiều, và ĐỘ PHỨC TẠP ĐÓ LÀ CẦN THIẾT — máy in tem
 * tự đóng socket sau 30-90s nhàn rỗi và chỉ nhận MỘT phiên TCP tại một thời
 * điểm. Ba lớp chống rớt dưới đây mỗi lớp giải quyết một race condition thật
 * đã được vá qua nhiều đợt, không phải dư thừa (§2.5):
 *
 *   1. Nhớ IP cuối (cấp MÁY, không lưu cloud vì IP đổi theo DHCP) → nối lại
 *      ngay trước khi in.
 *   2. Watchdog nền định kỳ — chỉ chạy nếu APK hỗ trợ, phải FEATURE-DETECT.
 *   3. Khoá single-flight chống gọi connect chồng lấp — bắt buộc vì máy chỉ
 *      nhận một phiên.
 *
 * Hai điều KHÔNG được làm:
 *   - KHÔNG thêm đường gửi fallback thứ hai (§2.4). Legacy từng có fallback qua
 *     app trung gian và đã CỐ Ý xoá vì gây văng WebView khi máy in mất kết nối.
 *   - KHÔNG auto-detect giao thức theo model máy (§2.3) — nhân viên chọn tay,
 *     mặc định TSPL.
 */
GIEO.define('protected-adapters/label-printer', [
  'shared-kernel/result',
  'protected-adapters/print-queue'
], function (R, queueLib) {
  'use strict';

  /* TSPL có lệnh SIZE/GAP/OFFSET để máy tự canh tem → khuyến nghị mặc định.
     ESC/POS không có khái niệm khổ tem nên dễ in đè. */
  var ENGINE = { TSPL: 'TSPL', ESCPOS: 'ESCPOS' };

  function createLabelPrinter(opts) {
    opts = opts || {};
    var bridge = opts.bridge;
    if (!bridge) throw new Error('[label-printer] cần bridge');

    /* Queue RIÊNG — độc lập với máy in bill (gate §8). */

/**
 * Hàng đợi in TỰ PHỤC HỒI — đây là BUG THẬT phải sửa, không phải giữ nguyên.
 *
 * Contract: PROTECTED-INFRASTRUCTURE-ADAPTER-CONTRACT-V1.md §1.2, §6.1.
 *
 * ────────────────────────────────────────────────────────────────────────
 * Legacy `POSPrinter._queue = Promise.resolve()`, mọi lệnh in chain kiểu
 *     this._queue = this._queue.then(() => this._doPrint(order));

 * reprint, im lặng không chạy nữa cho tới khi reload app.

 *     var next = _queue.then(fn, fn);   // lỗi lượt trước không chặn lượt sau
 *     _queue = next.catch(function(){});// luôn giữ queue ở trạng thái chạy được
 *

 * nghiệp vụ, nên KHÔNG được "giữ nguyên để tương thích".
 * ────────────────────────────────────────────────────────────────────────
 *
 * Gate §8 đòi bill printer và label printer có queue ĐỘC LẬP — máy in tem kẹt
 * giấy không được làm nghẽn in bill. Nên đây là factory, mỗi adapter tự tạo
 * một instance riêng.
 */

  'use strict';

  /**
   * @param opts.name     tên để báo lỗi cho người đọc
   * @param opts.onError  gọi khi một lượt in hỏng (toast/alert) — KHÔNG chặn lượt sau
   */

    opts = opts || {};
    var name = opts.name || 'printer';
    var chain = Promise.resolve();
    var stats = { queued: 0, done: 0, failed: 0 };

    /**
     * Xếp một lượt in. LUÔN trả Promise<Result> đã resolve — lỗi in là giá trị
     * trả về, không phải exception, vì in hỏng không được làm sập luồng bán hàng.
     */
    function enqueue(job, label) {
      stats.queued += 1;

      var result = chain.then(runJob, runJob);

      /* Mấu chốt: chain kế tiếp LUÔN là một promise đã được nuốt lỗi, nên một
         lượt hỏng không bao giờ đầu độc những lượt sau. */
      chain = result.catch(function () {});
      return result;

      function runJob() {
        return Promise.resolve()
          .then(job)
          .then(function (value) {
            stats.done += 1;
            return R.ok(value === undefined ? true : value);
          })
          .catch(function (e) {
            stats.failed += 1;
            var err = R.err('RETRYABLE',
              '[' + name + '] in hỏng' + (label ? ' (' + label + ')' : '') + ': ' + (e && e.message ? e.message : e));
            if (typeof opts.onError === 'function') {
              /* Handler người dùng hỏng cũng không được làm nghẽn hàng đợi. */
              try { opts.onError(err, label); } catch (ignored) { /* noop */ }
            }
            return err;
          });

    }

    /** Chờ hàng đợi rỗng — dùng cho test và cho lúc tắt app. */
    function drain() {
      return chain.then(function () { return R.ok(Object.assign({}, stats)); });
    }

    function snapshot() { return Object.assign({}, stats); }

     * Hàng đợi có còn chạy được không. Ở legacy câu này luôn là "không" sau
     * lần lỗi đầu tiên; ở đây nó luôn là "có" theo thiết kế, và test chứng minh.
     */
    function isHealthy() {
      return chain instanceof Promise;
    }

    return {
      name: name,
      enqueue: enqueue,
      drain: drain,
      snapshot: snapshot,
      isHealthy: isHealthy
    };
  }

  return { createPrintQueue: createPrintQueue };
});

 * Legacy format chuỗi path rải rác trong nhiều chục chỗ, nên đổi một path là
 * phải đi tìm khắp 50k dòng. Ở đây một hằng số / một path.
 *
 * ADAPTER NÀY CHỈ ĐỌC. Không hàm nào ở đây ghi, và `assertReadOnly()` tồn tại
 * để nếu ai đó thêm đường ghi thì nó hỏng ồn ào chứ không âm thầm ghi vào dữ
 * liệu production đang chạy.
 */
GIEO.define('legacy-firebase-adapter/legacy-paths', ['shared-kernel/result'], function (R) {
  'use strict';

  var RTDB = 'RTDB';
  var FIRESTORE = 'FIRESTORE';

  /** kind: RTDB (dữ liệu nóng) vs FIRESTORE — giữ nguyên phân tầng của legacy. */
  var PATHS = {
    /* ── Unit / FIFO ────────────────────────────────────────────────── */
    activeUnits: { kind: RTDB, path: 'active_units_gieogieo', keyed: 'itemId/containerId' },
    stockContainers: { kind: FIRESTORE, path: 'stock_containers_gieogieo' },
    prepBatches: { kind: FIRESTORE, path: 'prep_batches_gieogieo' },
    stockTransactions: { kind: FIRESTORE, path: 'stock_transactions_gieogieo' },
    prepTransactions: { kind: FIRESTORE, path: 'prep_transactions_gieogieo' },
    inventoryItems: { kind: FIRESTORE, path: 'inventory_items_gieogieo' },
    prepItems: { kind: FIRESTORE, path: 'prep_items_gieogieo' },
    reversalUnitClaims: { kind: FIRESTORE, path: 'reversal_unit_claims_gieogieo' },
    stockCounts: { kind: FIRESTORE, path: 'stock_counts_gieogieo' },
    stockLostReports: { kind: FIRESTORE, path: 'stock_lost_reports_gieogieo' },
    employeeStockDeductions: { kind: FIRESTORE, path: 'employee_stock_deductions_gieogieo' },
    refillRules: { kind: FIRESTORE, path: 'refill_rules_gieogieo' },
    storageLocations: { kind: FIRESTORE, path: 'storage_locations_gieogieo' },
    purchaseOrders: { kind: FIRESTORE, path: 'purchase_orders_gieogieo' },
    receivingRecords: { kind: FIRESTORE, path: 'receiving_records_gieogieo' },

    /* ── Recipe / Cost / BTP ────────────────────────────────────────── */
    recipes: { kind: FIRESTORE, path: 'recipes_gieogieo' },
    toppingRecipes: { kind: FIRESTORE, path: 'topping_recipes_gieogieo' },
    priceHistory: { kind: FIRESTORE, path: 'price_history_gieogieo' },
    cogsTogo: { kind: FIRESTORE, path: 'cogs_gieogieo/togo' },
    prepForecasts: { kind: FIRESTORE, path: 'prep_forecasts_gieogieo' },
    packagingPresets: { kind: FIRESTORE, path: 'packaging_presets_gieogieo' },

    /* ── Bill / Order ───────────────────────────────────────────────── */
    orders: { kind: RTDB, path: 'orders_gieogieo', keyed: 'month/day/billId' },
    ordersArchive: { kind: FIRESTORE, path: 'orders_gieogieo_archive', keyed: 'month_day_year' },
    billCounters: { kind: RTDB, path: 'billCounters_gieogieo' },
    billDeletions: { kind: FIRESTORE, path: 'bill_deletions_gieogieo' },
    sessionDisplay: { kind: RTDB, path: 'session_display_gieogieo' },

    /* ── Snapshot / chốt sổ ─────────────────────────────────────────── */
    dailySalesCache: { kind: FIRESTORE, path: 'daily_sales_cache_gieogieo' },
    dailyClosings: { kind: FIRESTORE, path: 'daily_closings_gieogieo' },
    dailyOpenings: { kind: FIRESTORE, path: 'daily_openings_gieogieo' },
    handoverRecords: { kind: FIRESTORE, path: 'handover_records_gieogieo' },
    shiftSegments: { kind: FIRESTORE, path: 'shift_segments_gieogieo' },
    bookClosings: { kind: FIRESTORE, path: 'book_closings_gieogieo' },

    /* ── Loyalty ────────────────────────────────────────────────────── */
    customers: { kind: FIRESTORE, path: 'customers' },
    loyaltyBillEffects: { kind: FIRESTORE, path: 'loyalty_bill_effects_gieogieo' },
    loyaltyPendingRetry: { kind: FIRESTORE, path: 'loyalty_pending_retry_gieogieo' },
    stampFreeRedemptions: { kind: FIRESTORE, path: 'stamp_free_redemptions_gieogieo' },

    /* ── Khác ───────────────────────────────────────────────────────── */
    employees: { kind: FIRESTORE, path: 'employees_gieogieo' },
    workSchedules: { kind: FIRESTORE, path: 'work_schedules_gieogieo' },
    expenses: { kind: FIRESTORE, path: 'expenses_gieogieo' },
    alerts: { kind: FIRESTORE, path: 'alerts_gieogieo' },
    auditLogs: { kind: FIRESTORE, path: 'audit_logs_gieogieo' },
    configHistory: { kind: FIRESTORE, path: 'config_history_gieogieo' },
    menu: { kind: RTDB, path: 'menu_gieogieo' },
    menuTogo: { kind: RTDB, path: 'menu_togo_gieogieo' },
    toppings: { kind: RTDB, path: 'toppings_gieogieo' },

    /**
     * PROTECTED — GIỮ NGUYÊN PATH, KHÔNG ĐỔI.
     * Webhook ngân hàng nằm ngoài phạm vi rebuild; đổi path là phá webhook đang
     * chạy production (LEGACY-FIREBASE-PATH-MAP-V1.md §2.5).
