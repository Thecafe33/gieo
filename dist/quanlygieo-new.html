      return ids.deterministicId('operation', ['prep', input.batchRef]);
    },

    validate: function (input) {
      if (!input || !input.batchRef) {
        return R.err('VALIDATION', 'RecordPrepProduction cần batchRef để id xác định (bug #22)');
      }
      if (!ids.isId(input.prepItemId, 'prepItem')) return R.err('VALIDATION', 'cần prepItemId hợp lệ');
      if (!ids.isId(input.prepStockItemId, 'item')) {
        return R.err('VALIDATION', 'cần prepStockItemId — BTP là một mặt hàng kho như mọi mặt hàng khác');
      }
      if (typeof input.actualYield !== 'number' || !(input.actualYield > 0)) {
        return R.err('VALIDATION', 'actualYield phải dương');
      }
      if (!input.deps || !input.deps.versionRegistry) {
        return R.err('VALIDATION', 'RecordPrepProduction cần versionRegistry');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['prep', input.batchRef]);
      var reg = input.deps.versionRegistry;

      /* Định mức mẻ resolve theo thời điểm nấu, không phải bản mới nhất. */
      var rv = recipeLib.resolveRecipeAt(reg, {
        recipeId: input.recipeId, storeId: ctx.storeId, at: input.at || ctx.clock.now()
      });
      if (R.isErr(rv)) return rv;
      var rr = recipeLib.toRequirements(rv.value, { size: input.size || 'BATCH', qty: input.batchCount || 1 });
      if (R.isErr(rr)) return rr;

      /* Trừ nguyên liệu thô qua CÙNG engine với bán hàng. */
      var ws = allocation.createWorkingSet(input.deps.units || []);
      var allocR = allocation.allocateMany(ws, rr.value.requirements, { operationId: opId });
      if (R.isErr(allocR)) return allocR;
      var alloc = allocR.value;

      if (alloc.shortfalls.length) {
        return R.err('PRECONDITION',
          'không đủ nguyên liệu để nấu mẻ này', { shortfalls: alloc.shortfalls });
      }

      /* Yield kỳ vọng để tính variance — lấy version có hiệu lực lúc nấu. */
      var expected = null;
      var yieldVersionId = null;
      var yv = btpLib.resolveYieldAt(reg, {
        prepItemId: input.prepItemId, storeId: ctx.storeId, at: input.at || ctx.clock.now()
      });
      if (R.isOk(yv)) {
        expected = yv.value.payload.yieldPerBatch * (input.batchCount || 1);
        yieldVersionId = yv.value.versionId;
      }

      var batchR = btpLib.createBatch({
        prepBatchId: ids.deterministicId('prepBatch', [input.batchRef]),
        prepItemId: input.prepItemId,
        storeId: ctx.storeId,
        actualYield: input.actualYield,
        expectedYield: expected,
        yieldVersionId: yieldVersionId,
        rawCost: alloc.totalCost,
        recipeVersionId: rr.value.recipeVersionId,
        at: input.at || ctx.clock.now(),
        actorId: ctx.actor.actorId,
        businessDate: ctx.businessDate,
        expiresAt: input.expiresAt,
        operationId: opId
      });
      if (R.isErr(batchR)) return batchR;
      var batch = batchR.value;

      /* Sản phẩm của mẻ là một Unit FIFO thật, itemKind='prep'. */
      var outUnitR = unitLib.createUnit({
        unitId: ids.deterministicId('unit', ['prep', input.batchRef]),
        itemId: input.prepStockItemId,
        storeId: ctx.storeId,
        itemKind: 'prep',
        initialQty: input.actualYield,
        costBasis: {
          unitCost: batch.costPerUnit,
          versionId: yieldVersionId,
          source: 'BTP_PRODUCTION'
        },
        receiptId: batch.prepBatchId,
        receivedAt: input.at || ctx.clock.now(),
        receivedBy: ctx.actor.actorId,
        operationId: opId
      });
      if (R.isErr(outUnitR)) return outUnitR;

      plan.unitChanges = alloc.plans.reduce(function (acc, p) {
        return acc.concat(p.touchedUnits);
      }, []).concat([outUnitR.value]);

      alloc.plans.forEach(function (p) {
        p.allocations.forEach(function (a) {
          plan.ledgerEntries.push({
            domain: 'raw', type: 'CONSUMPTION', itemId: a.itemId, storeId: ctx.storeId,
            unitId: a.unitId, qtyDelta: -a.qty, unitCost: a.unitCost,
            costBasisVersionId: a.costBasisVersionId,
            businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
            occurredAt: input.at || ctx.clock.now(),
            referenceType: 'prepBatch', referenceId: batch.prepBatchId
          });
          /* Lineage: mẻ → nguyên liệu → Unit → UnitBase trước/sau. */
          plan.traceChanges.push({
            prepBatchId: batch.prepBatchId, unitId: a.unitId, itemId: a.itemId,
            qty: a.qty, unitBaseBefore: a.unitBaseBefore, unitBaseAfter: a.unitBaseAfter,
            recipeVersionIds: [rr.value.recipeVersionId]
          });
        });
      });

      plan.ledgerEntries.push({
        domain: 'prep', type: 'RECEIVING', itemId: input.prepStockItemId, storeId: ctx.storeId,
        unitId: outUnitR.value.unitId, qtyDelta: input.actualYield,
        unitCost: batch.costPerUnit,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: input.at || ctx.clock.now(),
        referenceType: 'prepBatch', referenceId: batch.prepBatchId
      });

      plan.domainRecords.push({ type: 'prepBatch', record: batch });

      /* Lệch yield nhiều thì báo — legacy có alert này, giữ nguyên. */
      if (batch.yieldVariancePct !== null && Math.abs(batch.yieldVariancePct) > (input.yieldAlertPct || 10)) {
        plan.events.push({
          type: 'PrepYieldMismatch',
          prepBatchId: batch.prepBatchId, prepItemId: input.prepItemId,
          expectedYield: expected, actualYield: input.actualYield,
          variancePct: batch.yieldVariancePct,
          storeId: ctx.storeId, businessDate: ctx.businessDate
        });
      }

      plan.projectionRecomputes.push({ itemId: input.prepStockItemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  /**
   * EditPrepYield — sửa yield mẻ đã nấu.
   *
   * Điểm khác legacy: sửa yield KHÔNG đẩy sang một trung bình động
   * (`prep_items.yieldActualAvg`) mà mọi ngày quá khứ đều đọc. Giá vốn được
   * tính lại cho CHÍNH mẻ này, nên COGS các ngày cũ không trôi.
   */
  var EditPrepYield = pipeline.defineCommand({
    name: 'EditPrepYield',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['yieldedit', input.prepBatchId, String(input.editSeq || 1)]);
    },

    validate: function (input) {
      if (!input || !input.prepBatchId) return R.err('VALIDATION', 'cần prepBatchId');
      if (!input.reason) return R.err('VALIDATION', 'sửa yield phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      if (!input.batch) return R.err('NOT_FOUND', 'không tìm thấy mẻ');
      var opId = ids.deterministicId('operation', ['yieldedit', input.prepBatchId, String(input.editSeq || 1)]);

      var r = btpLib.editYield(input.batch, {
        newYield: input.newYield,
        consumedQty: input.consumedQty,
        reason: input.reason,
        actorId: ctx.actor.actorId,
        at: ctx.clock.now(),
        operationId: opId
      });
      if (R.isErr(r)) return r;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'prepBatch', record: r.value });
      plan.ledgerEntries.push({
        domain: 'prep', type: 'ADJUSTMENT', itemId: input.prepStockItemId, storeId: ctx.storeId,
        unitId: input.prepUnitId || null,
        qtyDelta: r.value.actualYield - input.batch.actualYield,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'prepBatch', referenceId: input.prepBatchId, reason: input.reason
      });
      plan.projectionRecomputes.push({ itemId: input.prepStockItemId, storeId: ctx.storeId });
      return R.ok(plan);
    }
  });

  return {
    RecordPrepProduction: RecordPrepProduction,
    EditPrepYield: EditPrepYield
  };
});

/* ===== src/layers/commands/reversal.js ===== */
/**
 * Reversal / Correction — ĐÚNG 2 PATTERN, thay cho 10 đường rời rạc của legacy.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-REVERSAL-CORRECTION-V1.md.
 *
 * Legacy có 10 cơ chế hoàn/sửa khác nhau về chất lượng dù cùng ý định — chính
 * code legacy tự nhận trong comment rằng "lẽ ra nên dùng chung engine". Kết
 * luận thiết kế: chỉ cần 2 pattern + domain event cho side-effect.
 *
 *   ReverseTransaction — sự kiện ĐÃ TIÊU THỤ kho, giờ hoàn ngược.
 *                        (xoá bill, huỷ mẻ đang nấu, sửa add-on, sửa ledger sai)
 *   ReviseState        — sửa một con số trạng thái đã chốt sai, KHÔNG có ý
 *                        nghĩa tiêu thụ ngược. (yield BTP, giờ công, kiểm kê)
 *
 * SIDE-EFFECT NGOÀI KHO KHÔNG NẰM TRONG 2 PATTERN TRÊN.
 * Bằng chứng từ legacy: xoá bill CỐ Ý không hoàn loyalty (quyết định nghiệp vụ
 * hợp lệ, ghi rõ trong comment/toast), còn ở Found-after-Lost thì logic hoàn
 * deduction đã viết sẵn nhưng tầng tạo deduction chưa từng tồn tại. Hai tình
 * huống khác nhau, cùng một bài học: side-effect phải là handler đăng ký riêng
 * lắng nghe domain event, không phải nhánh if/else trong hàm hoàn chính.
 *
 * Lợi ích cụ thể: chủ quán đổi ý "có hoàn điểm khi huỷ bill không" thì thêm/bớt
 * một handler, không phải sửa lại luồng hoàn.
 */
GIEO.define('commands/reversal', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'fifo-core/allocation',
  'fifo-core/reconciliation'
], function (ids, R, pipeline, allocation, reconciliation) {
  'use strict';

  /**
   * Câu hỏi mà legacy để ngỏ ở MỌI trường hợp đã audit: báo cáo lịch sử đóng
   * băng theo giá trị tại thời điểm phát sinh, hay tính lại theo giá trị mới?
   * Ở đây nó là field BẮT BUỘC — không có mặc định để rơi vào.
   */
  var HISTORICAL_POLICY = {
    /* Số đã công bố giữ nguyên; sửa chỉ ảnh hưởng từ nay về sau. */
    FREEZE: 'FREEZE',
    /* Tính lại lịch sử theo giá trị mới — phải có lý do rõ. */
    RECOMPUTE: 'RECOMPUTE'
  };

  /* Sự kiện domain. Handler đăng ký riêng, không sửa file này khi thêm/bớt. */
  var EVENTS = {
    OrderVoided: 'OrderVoided',
    ContainerFound: 'ContainerFound',
    BatchCancelled: 'BatchCancelled',
    StateRevised: 'StateRevised'
  };

  function createEventBus() {
    var handlers = Object.create(null);
    return {
      on: function (eventType, name, fn) {
        if (!EVENTS[eventType]) throw new Error('[reversal] sự kiện chưa khai: ' + eventType);
        (handlers[eventType] || (handlers[eventType] = [])).push({ name: name, fn: fn });
      },
      /** Trả kết quả TỪNG handler — một handler hỏng không được nuốt im lặng. */
      emit: function (event) {
        var list = handlers[event.type] || [];
        return list.map(function (h) {
          try {
            return { handler: h.name, result: h.fn(event) };
          } catch (e) {
            return { handler: h.name, result: R.err('MANUAL_REVIEW', h.name + ' ném lỗi: ' + e.message) };
          }
        });
      },
      handlersFor: function (eventType) {
        return (handlers[eventType] || []).map(function (h) { return h.name; });
      }
    };
  }

  /**
   * ReverseTransaction — MỘT API cho mọi trường hợp hoàn kho.
   *
   * Hoàn theo phân bổ GỐC, không chạy lại FIFO (fifo-core/reconciliation §3.8).
   * Claim theo doc id xác định nên idempotent tự nhiên, không phải check-then-act.
   */
  var ReverseTransaction = pipeline.defineCommand({
    name: 'ReverseTransaction',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['POS', 'QUANLY'],

    operationId: function (input) {
      return reconciliation.reversalOperationId(input.referenceId, input.domain, input.itemId || 'all');
    },

    validate: function (input) {
      if (!input || !input.referenceId) return R.err('VALIDATION', 'ReverseTransaction cần referenceId');
      if (!input.domain) return R.err('VALIDATION', 'ReverseTransaction cần domain');
      if (!input.reason) {
        return R.err('VALIDATION', 'hoàn giao dịch phải có lý do — hoàn không lý do là hoàn không kiểm chứng được');
      }
      if (!Array.isArray(input.originalAllocations)) {
        return R.err('VALIDATION',
          'ReverseTransaction cần originalAllocations — hoàn là BÙ TRỪ theo phân bổ gốc, ' +
          'không phải chạy lại FIFO để đoán hồi đó đã trừ ở đâu');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = reconciliation.reversalOperationId(input.referenceId, input.domain, input.itemId || 'all');
      var ws = allocation.createWorkingSet(input.units || []);

      var r = reconciliation.reverseAllocations(ws, {
        referenceId: input.referenceId,
        domain: input.domain,
        operationId: opId,
        originalAllocations: input.originalAllocations,
        fallbackQty: input.fallbackQty
      });
      if (R.isErr(r)) return r;
      var rev = r.value;

      plan.unitChanges = rev.touchedUnits;
      rev.reversals.forEach(function (x) {
        plan.ledgerEntries.push({
          domain: input.domain,
          type: 'REVERSAL',
          itemId: x.itemId,
          storeId: ctx.storeId,
          unitId: x.unitId,
          /* Trả lại bằng delta DƯƠNG — giữ nguyên mọi thao tác xảy ra sau đó. */
          qtyDelta: x.qty,
          unitCost: x.unitCost,
          costBasisVersionId: x.costBasisVersionId,
          businessDate: ctx.businessDate,
          actorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now(),
          referenceType: input.referenceType || 'reversal',
          referenceId: input.referenceId,
          reason: input.reason
        });
      });

      if (rev.coverage === 'untracked') {
        /* Dữ liệu legacy không truy được phân bổ gốc. Đánh dấu để rà tay —
           KHÔNG đoán bừa (invariant #12). */
        plan.domainRecords.push({
          type: 'manualReviewTask',
          record: {
            reason: 'AMBIGUOUS_LEGACY',
            referenceId: input.referenceId,
            qty: rev.untrackedQty,
            note: 'không truy được phân bổ gốc — cần rà thủ công trước khi coi là đã hoàn'
          }
        });
      }

      /* Side-effect ĐI QUA EVENT, không phải if/else ở đây. */
      if (input.eventType) {
        if (!EVENTS[input.eventType]) {
          return R.err('VALIDATION', 'sự kiện chưa khai: ' + input.eventType);
        }
        plan.events.push(Object.assign({
          type: input.eventType,
          referenceId: input.referenceId,
          storeId: ctx.storeId,
          businessDate: ctx.businessDate,
          reversedBy: ctx.actor.actorId,
          reason: input.reason
        }, input.eventData || {}));
      }

      plan.projectionRecomputes = rev.reversals.map(function (x) {
        return { itemId: x.itemId, storeId: ctx.storeId };
      });

      return R.ok(plan);
    }
  });

  /**
   * ReviseState — sửa con số đã chốt sai, KHÔNG có ý nghĩa tiêu thụ ngược.
   *
   * Hai thứ bắt buộc mà legacy thiếu ở mọi trường hợp đã audit:
   *   - audit-array giữ giá trị trước (append-only, không ghi đè)
   *   - `historicalPolicy` trả lời rõ đóng băng hay tính lại lịch sử
   */
  var ReviseState = pipeline.defineCommand({
    name: 'ReviseState',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['revise', input.entityType, input.entityId, input.field]);
    },

    validate: function (input) {
      if (!input || !input.entityId) return R.err('VALIDATION', 'ReviseState cần entityId');
      if (!input.entityType) return R.err('VALIDATION', 'ReviseState cần entityType');
      if (!input.field) return R.err('VALIDATION', 'ReviseState cần field');
      if (input.newValue === undefined) return R.err('VALIDATION', 'ReviseState cần newValue');
      if (!input.reason) return R.err('VALIDATION', 'sửa trạng thái phải có lý do');
      if (!HISTORICAL_POLICY[input.historicalPolicy]) {
        return R.err('VALIDATION',
          'ReviseState phải khai historicalPolicy: FREEZE (số đã công bố giữ nguyên) ' +
          'hay RECOMPUTE (tính lại lịch sử). Legacy để ngỏ câu này ở mọi trường hợp, ' +
          'nên không ai biết báo cáo cũ có đổi hay không.');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var opId = ids.deterministicId('operation', ['revise', input.entityType, input.entityId, input.field]);

      plan.domainRecords.push({
        type: 'stateRevision',
        record: {
          entityType: input.entityType,
          entityId: input.entityId,
          field: input.field,
          /* Append-only: giá trị cũ giữ lại để trả lời "số nào từng đúng". */
          before: input.currentValue === undefined ? null : input.currentValue,
          after: input.newValue,
          historicalPolicy: input.historicalPolicy,
          reason: input.reason,
          actorId: ctx.actor.actorId,
          at: ctx.clock.now(),
          operationId: opId
        }
      });

      /* RECOMPUTE mới đụng tới báo cáo cũ; FREEZE thì không. Quyết định này
         hiện ra trong plan, không nằm ngầm trong đầu người bấm nút. */
      if (input.historicalPolicy === HISTORICAL_POLICY.RECOMPUTE && input.affectedScope) {
        plan.projectionRecomputes.push(input.affectedScope);
      }

      plan.events.push({
        type: EVENTS.StateRevised,
        entityType: input.entityType,
        entityId: input.entityId,
        field: input.field,
        historicalPolicy: input.historicalPolicy,
        storeId: ctx.storeId,
        businessDate: ctx.businessDate
      });

      return R.ok(plan);
    }
  });

  /**
   * LedgerCorrection — đóng gap "sửa 1 dòng ledger sai".
   *
   * Ghi dòng ĐẢO + dòng ĐÚNG, `referenceId` trỏ về dòng gốc. KHÔNG update dòng
   * cũ — ledger append-only THẬT, không lặp lại pattern mutate-tại-chỗ của
   * `ctnDaoHaoHutMa` legacy.
   */
  var CorrectLedgerEntry = pipeline.defineCommand({
    name: 'CorrectLedgerEntry',
    authority: 'REVIEW_APPROVE_CORRECT',
    mutates: true,
    sources: ['QUANLY'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['ledgerfix', input.originalEntry.entryId]);
    },

    validate: function (input) {
      if (!input || !input.originalEntry) return R.err('VALIDATION', 'cần dòng ledger gốc');
      if (!input.corrected) return R.err('VALIDATION', 'cần nội dung đúng');
      if (!input.reason) return R.err('VALIDATION', 'sửa ledger phải có lý do');
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      var o = input.originalEntry;

      /* Dòng ĐẢO. */
      plan.ledgerEntries.push({
        domain: o.domain, type: o.type, itemId: o.itemId, storeId: o.storeId,
        unitId: o.unitId, qtyDelta: -o.qtyDelta,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'ledgerCorrection', referenceId: o.entryId,
        reason: 'đảo dòng sai: ' + input.reason
      });

      /* Dòng ĐÚNG. */
      plan.ledgerEntries.push({
        domain: o.domain,
        type: input.corrected.type || o.type,
        itemId: input.corrected.itemId || o.itemId,
        storeId: o.storeId,
        unitId: input.corrected.unitId !== undefined ? input.corrected.unitId : o.unitId,
        qtyDelta: input.corrected.qtyDelta,
        businessDate: ctx.businessDate, actorId: ctx.actor.actorId,
        occurredAt: ctx.clock.now(),
        referenceType: 'ledgerCorrection', referenceId: o.entryId,
        reason: 'thay cho dòng sai: ' + input.reason
      });

      plan.projectionRecomputes.push({ itemId: o.itemId, storeId: o.storeId });
      return R.ok(plan);
    }
  });

  return {
    HISTORICAL_POLICY: HISTORICAL_POLICY,
    EVENTS: EVENTS,
    createEventBus: createEventBus,
    ReverseTransaction: ReverseTransaction,
    ReviseState: ReviseState,
    CorrectLedgerEntry: CorrectLedgerEntry
  };
});

/* ===== src/layers/commands/sales.js ===== */
/**
 * Bán hàng — Bill model + RecordSale.
 *
 * Chuỗi thật: FIFO-CHAIN-TRACE-SALES-COGS-PL-V1.md.
 * Gap: FEATURE-TREE-V1.md §4.7, §4.16; FIFO-CORE-ARCHITECTURE-V2.md §10b.1/§10b.7.
 *
 * Ba field/hành vi mà legacy thiếu, bổ sung ngay từ thiết kế (không thêm sau):
 *
 * 1. `soldByActorId` — NGOẠI LỆ DUY NHẤT của toàn hệ thống cũ. Mọi domain khác
 *    (stock transaction, prep batch, container, expense, cash count, checklist)
 *    đều ghi staffEmployeeId; riêng Bill thì không — chỉ có gate "có ai đó đang
 *    check-in", không biết CHÍNH XÁC ai bán. FEATURE-TREE §4.7 gọi đây là field
 *    còn thiếu quan trọng nhất trong toàn bộ audit tính năng.
 *
 * 2. `channel` (tại quán / mang đi / sàn) là first-class. Legacy ĐÃ ghi
 *    isToGo/isShip/isAppSale/appFeePct trên mỗi bill, nhưng `appFeePct` chỉ
 *    được GHI, KHÔNG BAO GIỜ ĐƯỢC ĐỌC (grep toàn bộ 2 file: đúng 1 kết quả —
 *    chính dòng ghi), và `plChannelFeeForDay()` hard-code return 0. Dữ liệu đã
 *    sẵn sàng, chỉ chưa nối đường ống. Ở đây phí sàn được TRỪ THẬT vào doanh
 *    thu thuần.
 *
 * 3. Addon phải kích hoạt lại Loyalty. Legacy `submitAddon` không gọi
 *    `loyaltyProcessAfterPay()`, nên khách trả thêm tiền mà không được cộng
 *    thêm điểm. Ở đây addon phát event để handler loyalty xử lý — side-effect
 *    là handler đăng ký riêng, không nhét vào lệnh bán.
 */
GIEO.define('commands/sales', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline',
  'catalog/menu',
  'catalog/packaging',
  'recipe-cost-btp/recipe',
  'recipe-cost-btp/cogs',
  'fifo-core/allocation'
], function (ids, R, pipeline, menuLib, packagingLib, recipeLib, cogsLib, allocation) {
  'use strict';

  var CHANNEL = {
    DINE_IN: 'DINE_IN',
    TO_GO: 'TO_GO',
    /* Sàn giao đồ ăn — có phí phần trăm, và phí đó PHẢI được đọc. */
    APP: 'APP'
  };

  function validateChannel(ch) {
    if (!ch || !CHANNEL[ch.type]) return "channel.type phải là DINE_IN | TO_GO | APP";
    if (ch.type === CHANNEL.APP) {
      if (!ch.appName) return 'bán qua sàn phải ghi rõ tên sàn';
      if (typeof ch.feePct !== 'number' || ch.feePct < 0 || ch.feePct > 100) {
        return 'bán qua sàn phải ghi feePct hợp lệ — legacy ghi rồi không bao giờ đọc, ' +
          'nên P&L theo kênh không bao giờ đúng';
      }
    }
    return null;
  }

  /**
   * Dựng Bill từ giỏ hàng.
   *
   * Mỗi dòng mang GIÁ ĐÃ SNAPSHOT (catalog/menu.snapshotPrice) — mẫu ĐÚNG của
   * legacy cần giữ: sửa giá menu sau này không làm trôi số liệu bill lịch sử.
   */
  function buildBill(spec) {
    if (!spec) return R.err('VALIDATION', 'buildBill cần spec');
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'bill cần storeId hợp lệ');
    if (!ids.isId(spec.soldByActorId, 'actor')) {
      return R.err('VALIDATION',
        'bill BẮT BUỘC có soldByActorId — không biết ai bán là ngoại lệ duy nhất của hệ thống cũ (§4.7)');
    }
    if (!spec.businessDate) return R.err('VALIDATION', 'bill cần businessDate');
    if (typeof spec.occurredAt !== 'number') return R.err('VALIDATION', 'bill cần occurredAt');

    var chBad = validateChannel(spec.channel);
    if (chBad) return R.err('VALIDATION', chBad);

    var lines = spec.lines || [];
    if (lines.length === 0) return R.err('VALIDATION', 'bill phải có ít nhất 1 dòng');

    var normalized = [];
    var subtotal = 0;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (!ids.isId(l.menuItemId, 'item')) return R.err('VALIDATION', 'dòng ' + i + ' thiếu menuItemId hợp lệ');
      if (typeof l.price !== 'number') return R.err('VALIDATION', 'dòng ' + i + ' thiếu giá đã snapshot');
      if (typeof l.qty !== 'number' || !(l.qty > 0)) return R.err('VALIDATION', 'dòng ' + i + ' qty phải dương');

      var amount = l.price * l.qty;
      subtotal += amount;
      normalized.push({
        billLineId: ids.deterministicId('billLine', [spec.billId || 'draft', String(i)]),
        menuItemId: l.menuItemId,
        name: l.name || null,
        size: l.size,
        qty: l.qty,
        /* Snapshot, không phải tham chiếu sống. */
        price: l.price,
        amount: amount,
        recipeId: l.recipeId || null,
        toppings: (l.toppings || []).slice()
      });
    }

    var discountTotal = spec.discountTotal || 0;
    var total = Math.max(0, subtotal - discountTotal);

    /* Phí sàn được TRỪ THẬT — đây là đường ống legacy chưa từng nối. */
    var channelFee = spec.channel.type === CHANNEL.APP
      ? total * (spec.channel.feePct / 100)
      : 0;

    return R.ok({
      billId: spec.billId || ids.newId('bill'),
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      occurredAt: spec.occurredAt,
      soldByActorId: spec.soldByActorId,
      customerId: spec.customerId || null,
      channel: {
        type: spec.channel.type,
        appName: spec.channel.appName || null,
        feePct: spec.channel.type === CHANNEL.APP ? spec.channel.feePct : 0
      },
      lines: normalized,
      subtotal: subtotal,
      discountTotal: discountTotal,
      promotionsApplied: (spec.promotionsApplied || []).slice(),
      total: total,
      channelFee: channelFee,
      /* Doanh thu thuần sau phí sàn — con số P&L thật sự cần. */
      netRevenue: total - channelFee,
      payments: (spec.payments || []).slice(),
      status: 'DRAFT'
    });
  }

  /**
   * Yêu cầu vật chất của cả bill: định mức + bao bì + túi.
   *
   * Mọi version dùng ở đây được GHI LẠI trên bill (V4), nên đọc lại lịch sử
   * không phải resolve lại — và không thể trôi theo cấu hình hiện tại.
   */
  function buildRequirements(bill, deps) {
    var registry = deps.versionRegistry;
    var reqs = [];
    var recipeVersionIds = [];
    var packagingVersionIds = [];

    for (var i = 0; i < bill.lines.length; i++) {
      var line = bill.lines[i];
      if (!line.recipeId) {
        return R.err('PRECONDITION',
          'món "' + (line.name || line.menuItemId) + '" chưa khai định mức — ' +
          'không được bán với giá vốn ngầm bằng 0');
      }

      var rv = recipeLib.resolveRecipeAt(registry, {
        recipeId: line.recipeId, storeId: bill.storeId, at: bill.occurredAt
      });
      if (R.isErr(rv)) return rv;

      var rr = recipeLib.toRequirements(rv.value, { size: line.size, qty: line.qty });
      if (R.isErr(rr)) return rr;
      recipeVersionIds.push(rr.value.recipeVersionId);
      reqs = reqs.concat(rr.value.requirements);

      var pv = packagingLib.resolvePackagingAt(registry, {
        menuItemId: line.menuItemId, storeId: bill.storeId, at: bill.occurredAt
      });
      if (R.isOk(pv)) {
        var pr = packagingLib.toRequirements(pv.value, line.qty);
        if (R.isErr(pr)) return pr;
        packagingVersionIds.push(pr.value.packagingVersionId);
        reqs = reqs.concat(pr.value.requirements);

        var cups = bill.lines.reduce(function (s, l) { return s + l.qty; }, 0);
        if (i === 0) {
          var bag = packagingLib.baggingRequirements(pv.value, cups);
          if (R.isOk(bag)) reqs = reqs.concat(bag.value.requirements);
        }
      }
    }

    /* Gộp cùng itemId để FIFO cấp phát 1 lần cho mỗi nguyên liệu. */
    var merged = Object.create(null);
    reqs.forEach(function (r) {
      merged[r.itemId] = (merged[r.itemId] || 0) + r.qty;
    });

    return R.ok({
      requirements: Object.keys(merged).map(function (itemId) {
        return { itemId: itemId, qty: merged[itemId] };
      }),
      detailedRequirements: reqs,
      recipeVersionIds: recipeVersionIds.filter(function (v, i, a) { return a.indexOf(v) === i; }),
      packagingVersionIds: packagingVersionIds.filter(function (v, i, a) { return a.indexOf(v) === i; })
    });
  }

  /** RecordSale — ghi bán hàng, trừ kho qua FIFO, tính CẢ HAI vế COGS. */
  var RecordSale = pipeline.defineCommand({
    name: 'RecordSale',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    /* Id xác định theo billId: bấm thanh toán 2 lần không trừ kho 2 lần. */
    operationId: function (input) {
      return ids.deterministicId('operation', ['sale', input.bill.billId]);
    },

    validate: function (input) {
      if (!input || !input.bill) return R.err('VALIDATION', 'RecordSale cần bill');
      if (!ids.isId(input.bill.soldByActorId, 'actor')) {
        return R.err('VALIDATION', 'bill thiếu soldByActorId');
      }
      if (!input.deps || !input.deps.versionRegistry) {
        return R.err('VALIDATION', 'RecordSale cần versionRegistry');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var bill = input.bill;
      var deps = input.deps;
      var plan = pipeline.emptyPlan();

      /* Actor trên bill phải là người đang thao tác — không nhận hộ người khác. */
      if (bill.soldByActorId !== ctx.actor.actorId) {
        return R.err('FORBIDDEN', 'soldByActorId khác actor đang thao tác');
      }

      var reqR = buildRequirements(bill, deps);
      if (R.isErr(reqR)) return reqR;
      var req = reqR.value;

      /* FIFO cấp phát — 1 WorkingSet cho cả bill, nên các món dùng chung
         nguyên liệu không đọc số dư cũ của nhau. */
      var ws = allocation.createWorkingSet(deps.units || []);
      var allocR = allocation.allocateMany(ws, req.requirements, {
        operationId: ids.deterministicId('operation', ['sale', bill.billId])
      });
      if (R.isErr(allocR)) return allocR;
      var alloc = allocR.value;

      if (alloc.shortfalls.length && !input.allowShortfall) {
        return R.err('PRECONDITION',
          'không đủ nguyên liệu cho ' + alloc.shortfalls.length + ' thành phần — ' +
          'bán tiếp sẽ làm kho âm mà không ai chặn (đúng lỗi legacy)',
          { shortfalls: alloc.shortfalls });
      }

      /* HAI vế COGS — thứ legacy chưa từng có. */
      var cogsR = cogsLib.computeCogs({
        registry: deps.versionRegistry,
        storeId: bill.storeId,
        at: bill.occurredAt,
        requirements: req.requirements,
        allocationPlans: alloc.plans
      });
      if (R.isErr(cogsR)) return cogsR;

      var finalized = Object.assign({}, bill, {
        status: 'COMPLETED',
        recipeVersionIds: req.recipeVersionIds,
        packagingVersionIds: req.packagingVersionIds,
        cogs: cogsR.value
      });

      plan.domainRecords.push({ type: 'bill', record: finalized });
      plan.unitChanges = ws.all().filter(function (u) {
        var before = (deps.units || []).filter(function (o) { return o.unitId === u.unitId; })[0];
        return before && before.remainingQty !== u.remainingQty;
      });

      alloc.plans.forEach(function (p) {
        p.allocations.forEach(function (a) {
          plan.ledgerEntries.push({
            domain: 'raw',
            type: 'CONSUMPTION',
            itemId: a.itemId,
            storeId: bill.storeId,
            unitId: a.unitId,
            qtyDelta: -a.qty,
            unitCost: a.unitCost,
            costBasisVersionId: a.costBasisVersionId,
            businessDate: bill.businessDate,
            actorId: bill.soldByActorId,
            occurredAt: bill.occurredAt,
            referenceType: 'bill',
            referenceId: bill.billId
          });
          /* Lineage đầy đủ: Bill → BillLine → RecipeVersion → Requirement →
             UnitAllocation → UnitBase trước/sau. */
          plan.traceChanges.push({
            billId: bill.billId,
            unitId: a.unitId,
            itemId: a.itemId,
            qty: a.qty,
            unitBaseBefore: a.unitBaseBefore,
            unitBaseAfter: a.unitBaseAfter,
            recipeVersionIds: req.recipeVersionIds,
            costBasisVersionId: a.costBasisVersionId
          });
        });
      });

      plan.projectionRecomputes = req.requirements.map(function (r) {
        return { itemId: r.itemId, storeId: bill.storeId };
      });

      /* Loyalty là handler đăng ký riêng, không nhét vào lệnh bán. */
      if (bill.customerId) {
        plan.events.push({
          type: 'SaleCompleted',
          billId: bill.billId,
          customerId: bill.customerId,
          netRevenue: finalized.netRevenue,
          storeId: bill.storeId,
          businessDate: bill.businessDate
        });
      }

      return R.ok(plan);
    }
  });

  /**
   * RecordAddon — thêm món/topping sau khi bill đã lưu.
   *
   * Legacy cho thêm trong 10 phút (add-only, không sửa/xoá) và trừ kho theo
   * diff đúng — nhưng KHÔNG gọi loyalty, nên khách trả thêm tiền mà không được
   * cộng thêm điểm (§1 chain-trace, §4.16). Ở đây event được phát cho ĐÚNG
   * phần chênh lệch.
   */
  var RecordAddon = pipeline.defineCommand({
    name: 'RecordAddon',
    authority: 'EXECUTE',
    mutates: true,
    sources: ['POS'],

    operationId: function (input) {
      return ids.deterministicId('operation', ['addon', input.billId, input.addonSeq]);
    },

    validate: function (input) {
      if (!input || !ids.isId(input.billId, 'bill')) return R.err('VALIDATION', 'RecordAddon cần billId');
      if (input.addonSeq === undefined || input.addonSeq === null) {
        return R.err('VALIDATION', 'RecordAddon cần addonSeq để id xác định — thiếu nó là bug #23');
      }
      if (typeof input.addedAmount !== 'number' || input.addedAmount <= 0) {
        return R.err('VALIDATION', 'addon phải có số tiền tăng thêm dương');
      }
      return R.ok(true);
    },

    execute: function (input, ctx) {
      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({
        type: 'billAddon',
        record: {
          billId: input.billId,
          addonSeq: input.addonSeq,
          addedAmount: input.addedAmount,
          addedByActorId: ctx.actor.actorId,
          occurredAt: ctx.clock.now()
        }
      });

      if (input.customerId) {
        /* Đúng phần CHÊNH LỆCH, không phải tổng bill. */
        plan.events.push({
          type: 'SaleAmountIncreased',
          billId: input.billId,
          customerId: input.customerId,
          addedAmount: input.addedAmount,
          storeId: ctx.storeId,
          businessDate: ctx.businessDate
        });
      }
      return R.ok(plan);
    }
  });

  return {
    CHANNEL: CHANNEL,
    buildBill: buildBill,
    buildRequirements: buildRequirements,
    RecordSale: RecordSale,
    RecordAddon: RecordAddon
  };
});

/* ===== src/layers/commands/shift.js ===== */
/**
 * Ca / Két tiền — đối soát tiền mặt và giao ca.
 *
 * Nguồn: LEGACY-SNAPSHOT-COMPACTION-AUDIT-V1.md §2.2, FEATURE-TREE-V1.md §2 mục [5].
 *
 * Đây thuộc nhóm "OPERATIONAL RECORD" của FIFO-COMPACTION-CONTRACT-V1.md §0:
 * nó LÀ sự kiện đã xảy ra, được ĐỌC THẲNG chứ không tính lại — khác hẳn cache
 * (tính lại được) và snapshot P&L (đóng băng có chủ đích). Ba khái niệm này
 * legacy đã tách rất có chủ đích và thiết kế mới không gộp lại.
 *
 * QUYẾT ĐỊNH CỦA LEGACY CẦN GIỮ NGUYÊN — sai số KHÔNG cộng dồn giữa các đoạn ca.
 * Khi giao ca giữa ngày, đoạn sau bắt đầu từ số tiền ĐẾM ĐƯỢC THẬT của đoạn
 * trước, không phải từ số tiền LẼ RA PHẢI CÓ. Nhờ vậy sai số của đoạn trước
 * không trôi sang làm bẩn sai số đoạn sau, và mỗi đoạn quy trách nhiệm được cho
 * đúng người trực đoạn đó. Legacy giải thích điều này ngay trong comment; đây
 * là thiết kế đúng, không phải chỗ cần "sửa cho gọn".
 */
GIEO.define('commands/shift', [
  'shared-kernel/ids',
  'shared-kernel/result',
  'commands/pipeline'
], function (ids, R, pipeline) {
  'use strict';

  var STATUS = { OPEN: 'OPEN', CLOSED: 'CLOSED' };

  function segmentId(storeId, businessDate, seq) {
    return ids.deterministicId('shift', ['seg', storeId, businessDate, String(seq)]);
  }

  /**
   * Mở một đoạn ca.
   * @param spec.startCash tiền mặt đầu đoạn — với đoạn > 1 đây phải là số ĐẾM
   *        ĐƯỢC của đoạn trước (xem closeSegment.actualEndCash), không phải số
   *        kỳ vọng.
   */
  function openSegment(spec) {
    if (!ids.isId(spec.storeId, 'store')) return R.err('VALIDATION', 'đoạn ca cần storeId hợp lệ');
    if (!spec.businessDate) return R.err('VALIDATION', 'đoạn ca cần businessDate');
    if (typeof spec.seq !== 'number' || spec.seq < 1) return R.err('VALIDATION', 'seq phải >= 1');
    if (typeof spec.startCash !== 'number' || spec.startCash < 0) {
      return R.err('VALIDATION', 'startCash phải là số không âm');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'đoạn ca cần actorId');

    return R.ok({
      segmentId: segmentId(spec.storeId, spec.businessDate, spec.seq),
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      seq: spec.seq,
      status: STATUS.OPEN,
      startCash: spec.startCash,
      openedAt: spec.at,
      openedBy: spec.actorId,
      /* Nguồn của startCash — để đọc lại biết đoạn này nối từ đâu. */
      startCashSource: spec.seq === 1 ? 'OPENING_FLOAT' : 'PREVIOUS_SEGMENT_ACTUAL',
      counts: [],
      cashSales: 0,
      cashOut: 0,
      expectedEndCash: null,
      actualEndCash: null,
      variance: null,
      closedAt: null,
      closedBy: null
    });
  }

  /** Ghi nhận tiền mặt phát sinh trong đoạn. */
  function recordCashMovement(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (typeof spec.amount !== 'number' || spec.amount <= 0) {
      return R.err('VALIDATION', 'số tiền phải dương — chiều đi vào/ra do "direction" quyết định');
    }
    if (spec.direction !== 'IN' && spec.direction !== 'OUT') {
      return R.err('VALIDATION', "direction phải là 'IN' hoặc 'OUT'");
    }
    var patch = spec.direction === 'IN'
      ? { cashSales: segment.cashSales + spec.amount }
      : { cashOut: segment.cashOut + spec.amount };
    return R.ok(Object.assign({}, segment, patch));
  }

  /**
   * Thêm 1 lần đếm. Legacy cho đếm nhiều lần trước khi chốt — giữ nguyên, và
   * giữ ĐỦ các lần đếm thay vì chỉ lần cuối, vì chênh lệch giữa các lần đếm
   * chính là thông tin cần cho người rà soát.
   */
  function addCount(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (typeof spec.countedCash !== 'number' || spec.countedCash < 0) {
      return R.err('VALIDATION', 'countedCash phải là số không âm');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'lần đếm cần actorId');

    return R.ok(Object.assign({}, segment, {
      counts: segment.counts.concat([{
        seq: segment.counts.length + 1,
        countedCash: spec.countedCash,
        at: spec.at,
        actorId: spec.actorId,
        note: spec.note || null
      }])
    }));
  }

  /**
   * Chốt đoạn ca.
   *
   *   expectedEndCash = startCash + cashSales - cashOut
   *   variance        = actualEndCash - expectedEndCash
   *
   * `actualEndCash` lấy từ lần đếm CUỐI CÙNG — không trung bình các lần đếm,
   * vì đếm lại là để sửa lần trước, không phải để lấy mẫu.
   */
  function closeSegment(segment, spec) {
    if (segment.status !== STATUS.OPEN) return R.err('PRECONDITION', 'đoạn ca đã đóng');
    if (segment.counts.length === 0) {
      return R.err('PRECONDITION', 'phải đếm tiền ít nhất 1 lần trước khi chốt đoạn ca');
    }
    if (!ids.isId(spec.actorId, 'actor')) return R.err('VALIDATION', 'chốt đoạn ca cần actorId');
    if (!spec.operationId) return R.err('VALIDATION', 'chốt đoạn ca cần operationId');

    var actual = segment.counts[segment.counts.length - 1].countedCash;
    var expected = segment.startCash + segment.cashSales - segment.cashOut;

    return R.ok(Object.assign({}, segment, {
      status: STATUS.CLOSED,
      expectedEndCash: expected,
      actualEndCash: actual,
      variance: actual - expected,
      closedAt: spec.at,
      closedBy: spec.actorId,
      operationId: spec.operationId
    }));
  }

  /**
   * Đoạn kế tiếp — ĐÂY LÀ CHỖ QUYẾT ĐỊNH THIẾT KẾ QUAN TRỌNG.
   *
   * Bắt đầu từ `actualEndCash` (đếm được thật), KHÔNG phải `expectedEndCash`.
   * Nếu bắt đầu từ số kỳ vọng thì sai số của đoạn trước sẽ xuất hiện lại trong
   * sai số đoạn sau, và người trực đoạn sau bị quy trách nhiệm cho tiền hụt mà
   * họ không gây ra.
   */
  function nextSegment(closedSegment, spec) {
    if (closedSegment.status !== STATUS.CLOSED) {
      return R.err('PRECONDITION', 'phải chốt đoạn hiện tại trước khi mở đoạn kế');
    }
    return openSegment({
      storeId: closedSegment.storeId,
      businessDate: closedSegment.businessDate,
      seq: closedSegment.seq + 1,
      startCash: closedSegment.actualEndCash,
      actorId: spec.actorId,
      at: spec.at
    });
  }

  /**
   * Tổng hợp cả ngày. Sai số ngày = TỔNG sai số từng đoạn, và luôn nói được
   * đoạn nào của ai lệch bao nhiêu.
   */
  function summarizeDay(segments) {
    var closed = segments.filter(function (s) { return s.status === STATUS.CLOSED; });
    return R.ok({
      segmentCount: segments.length,
      closedCount: closed.length,
      allClosed: closed.length === segments.length && segments.length > 0,
      totalCashSales: segments.reduce(function (s, x) { return s + x.cashSales; }, 0),
      totalCashOut: segments.reduce(function (s, x) { return s + x.cashOut; }, 0),
      totalVariance: closed.reduce(function (s, x) { return s + x.variance; }, 0),
      /* Quy trách nhiệm theo đoạn — thứ mà cộng dồn sai số sẽ làm mất. */
      varianceBySegment: closed.map(function (s) {
        return { seq: s.seq, closedBy: s.closedBy, variance: s.variance };
      })
    });
  }

  /**
   * Lý do CHẶN chốt ngày. FEATURE-TREE §2 mục [5] gọi đây là `blockingClose`.
   * Trả danh sách để `store-context/business-day.closeDay` từ chối kèm lý do
   * cụ thể, thay vì chỉ báo "không chốt được".
   */
  function closeDayBlockers(spec) {
    var blockers = [];
    var segments = spec.segments || [];

    if (segments.length === 0) blockers.push('chưa có đoạn ca nào trong ngày');
    segments.forEach(function (s) {
      if (s.status === STATUS.OPEN) blockers.push('đoạn ca #' + s.seq + ' chưa chốt');
    });
    (spec.openEmployeeShifts || []).forEach(function (sh) {
      blockers.push('ca của nhân viên ' + sh.employeeId + ' chưa check-out');
    });
    (spec.pendingChecklists || []).forEach(function (c) {
      if (c.blocking) blockers.push('checklist "' + c.name + '" chưa hoàn tất');
    });
    return blockers;
  }

  var CloseCashSegment = pipeline.defineCommand({
    name: 'CloseCashSegment',
    /* Nhân viên kết ca, nhưng Quản lý cũng chốt hộ được khi cần. */
    authority: ['EXECUTE', 'REVIEW_APPROVE_CORRECT'],
    mutates: true,
    sources: ['POS', 'QUANLY'],
    operationId: function (input) {
      return ids.deterministicId('operation', [
        'closeseg', input.segment.storeId, input.segment.businessDate, String(input.segment.seq)
      ]);
    },
    validate: function (input) {
      if (!input || !input.segment) return R.err('VALIDATION', 'cần segment');
      return R.ok(true);
    },
    execute: function (input, ctx) {
      var r = closeSegment(input.segment, {
        actorId: ctx.actor.actorId,
        at: ctx.clock.now(),
        operationId: ids.deterministicId('operation', [
          'closeseg', input.segment.storeId, input.segment.businessDate, String(input.segment.seq)
        ])
      });
      if (R.isErr(r)) return r;

      var plan = pipeline.emptyPlan();
      plan.domainRecords.push({ type: 'cashSegment', record: r.value });
      if (r.value.variance !== 0) {
        /* Lệch két là việc cần người biết, không phải con số nằm im trong sổ. */
        plan.events.push({
          type: 'CashVarianceDetected',
          segmentId: r.value.segmentId,
          storeId: r.value.storeId,
          businessDate: r.value.businessDate,
          seq: r.value.seq,
          variance: r.value.variance,
          closedBy: r.value.closedBy
        });
      }
      return R.ok(plan);
    }
  });

  return {
    STATUS: STATUS,
    segmentId: segmentId,
    openSegment: openSegment,
    recordCashMovement: recordCashMovement,
    addCount: addCount,
    closeSegment: closeSegment,
    nextSegment: nextSegment,
    summarizeDay: summarizeDay,
    closeDayBlockers: closeDayBlockers,
    CloseCashSegment: CloseCashSegment
  };
});

/* ===== src/layers/reporting/btp-report.js ===== */
/**
 * Báo cáo BTP theo ngày — {nấu, dùng, huỷ}.
 *
 * Đứt chuỗi #3 của FIFO-CHAIN-TRACE-BTP-V1.md [B5]: `thLichSuBTP` của legacy
 * TÍNH ĐÚNG {nau, dung, huy} theo ngày, nhưng chỉ dùng nội bộ cho dự báo và
 * export AI — KHÔNG BAO GIỜ lên màn hình báo cáo cho chủ quán xem.
 *
 * Cùng dạng lỗi "tính nhưng không bao giờ hiển thị" đã thấy ở `stockoutTargetPct`.
 * Chain-trace nói rõ: dữ liệu đã đúng logic, chỉ cần đưa ra, không cần thuật
 * toán mới.
 */
GIEO.define('reporting/btp-report', ['shared-kernel/result'], function (R) {
  'use strict';

  /**
   * @param spec.batches      mẻ đã nấu trong kỳ
   * @param spec.consumption  ledger CONSUMPTION của mặt hàng BTP
   * @param spec.waste        ledger WASTE của mặt hàng BTP
   */
  function buildDaily(spec) {
    var days = Object.create(null);

    function day(k) {
      if (!days[k]) {
        days[k] = { dateKey: k, nau: 0, nauCost: 0, batchCount: 0, dung: 0, huy: 0, huyCost: 0 };
      }
      return days[k];
    }

    (spec.batches || []).forEach(function (b) {
      if (b.status !== 'PRODUCED') return;
      var d = day(b.businessDate);
      d.nau += b.actualYield;
      d.nauCost += b.rawCost;
      d.batchCount += 1;
    });

    (spec.consumption || []).forEach(function (e) {
      day(e.businessDate).dung += Math.abs(e.qtyDelta);
    });

    (spec.waste || []).forEach(function (e) {
      var d = day(e.businessDate);
      d.huy += Math.abs(e.qtyDelta);
      d.huyCost += Math.abs(e.qtyDelta) * (e.unitCost || 0);
    });

    var rows = Object.keys(days).sort().map(function (k) {
      var d = days[k];
      /* Tỉ lệ huỷ trên lượng nấu — con số chủ quán thật sự cần nhìn. */
      d.huyPct = d.nau > 0 ? (d.huy / d.nau) * 100 : null;
      return d;
    });

    return R.ok({
      rows: rows,
      total: rows.reduce(function (s, d) {
        return {
          nau: s.nau + d.nau, dung: s.dung + d.dung, huy: s.huy + d.huy,
          nauCost: s.nauCost + d.nauCost, huyCost: s.huyCost + d.huyCost,
          batchCount: s.batchCount + d.batchCount
        };
      }, { nau: 0, dung: 0, huy: 0, nauCost: 0, huyCost: 0, batchCount: 0 }),
      computedAt: spec.computedAt || null
    });
  }

  /** Cột cho export CSV — thứ tự ổn định giữa các lần xuất. */
  var COLUMNS = [
    { key: 'dateKey', label: 'Ngày' },
    { key: 'batchCount', label: 'Số mẻ' },
    { key: 'nau', label: 'Nấu' },
    { key: 'dung', label: 'Dùng' },
    { key: 'huy', label: 'Huỷ' },
    { key: 'huyPct', label: 'Tỉ lệ huỷ (%)' },
    { key: 'huyCost', label: 'Giá trị huỷ' }
  ];

  return { buildDaily: buildDaily, COLUMNS: COLUMNS };
});

/* ===== src/layers/reporting/export-payload.js ===== */
/**
 * Export báo cáo ĐÃ ĐỊNH DẠNG.
 *
 * Gap (GIEO-REBUILD-HANDOFF-V2.md §4.2, FIFO-CHAIN-TRACE-REPORTING-V1.md §6):
 * legacy không có export báo cáo nào, chỉ có dump JSON thô. Chain-trace nói rõ
 * đây là 2 việc KHÁC NHAU và không thay thế nhau được:
 *   - export báo cáo (CSV tối thiểu) — cho người đọc, cho kế toán
 *   - trích xuất dữ liệu thô — cho phân tích, vẫn giữ riêng
 *
 * Mọi payload mang `computedAt` (§8) để UI luôn hiển thị được độ mới, và mang
 * nhãn cơ sở giá / cờ đóng băng để người đọc biết con số này là gì.
 */
GIEO.define('reporting/export-payload', ['shared-kernel/result'], function (R) {
  'use strict';

  function esc(v) {

   * CSV từ danh sách bản ghi + cột khai tường minh.
   * Khai cột thay vì suy từ khoá object: thứ tự cột phải ổn định giữa các lần

    if (!Array.isArray(columns) || columns.length === 0) {
      return R.err('VALIDATION', 'export CSV phải khai cột — thứ tự cột suy từ object sẽ đổi giữa các lần');
    }
    var rows = spec.rows || [];
    var out = [columns.map(function (c) { return esc(c.label); }).join(',')];

    rows.forEach(function (r) {
      out.push(columns.map(function (c) {
        var v = typeof c.value === 'function' ? c.value(r) : r[c.key];
        return esc(v);
      }).join(','));
    });

    return R.ok(out.join('\n'));
  }

  /**
   * Bọc 1 báo cáo để xuất ra.
   * `meta` của read-layer được mang theo nguyên vẹn, nên file xuất ra nói được
   * số này đến từ đâu và đã đóng băng chưa.
   */

    if (!spec.title) return R.err('VALIDATION', 'export cần tiêu đề');
    if (!spec.period) return R.err('VALIDATION', 'export cần kỳ báo cáo');

    var meta = spec.meta || {};
    var csv = toCsv({ columns: spec.columns, rows: spec.rows });
    if (R.isErr(csv)) return csv;

    return R.ok({
      title: spec.title,
      period: spec.period,
      storeId: spec.storeId,
      /* §8 — mọi payload mang computedAt, không tuỳ màn hình có hay không. */
      computedAt: meta.computedAt || spec.computedAt || null,
      frozen: !!meta.frozen,
      sources: meta.sources || [],
      /* Cơ sở giá đi kèm số, không nằm ở chú thích cuối trang. */
      valuationBasis: spec.valuationBasis || null,
      ambiguous: meta.ambiguous || [],
      csv: csv.value,
      rowCount: (spec.rows || []).length,
      /* Cảnh báo dán ngay trên file, để người cầm file biết nó chưa chốt. */
      notices: buildNotices(meta, spec)
    });
  }

  function buildNotices(meta, spec) {
    var n = [];
    if (!meta.frozen) n.push('Số liệu chưa đóng băng — có thể đổi nếu dữ liệu gốc thay đổi.');
    if (meta.ambiguous && meta.ambiguous.length) {
      n.push(meta.ambiguous.length + ' mục dữ liệu cũ không đủ nghĩa, cần rà thủ công.');
    }
    if (spec.mixedBasis) n.push('Tổng trộn 2 cơ sở giá — xem nhãn từng dòng.');
    if (spec.hasEstimatedExpenses) n.push('Còn chi phí ước tính chờ hoá đơn thật — lãi chưa phải số cuối.');

   * Trích xuất thô — GIỮ RIÊNG, không phải thay thế cho export báo cáo.
   * Chain-trace §6 nói rõ 2 việc này tách biệt.
   */

    return R.ok({
      kind: 'RAW_EXTRACT',
      purpose: 'phân tích/AI — KHÔNG phải báo cáo cho người đọc',
      storeId: spec.storeId,
      period: spec.period,
      computedAt: spec.computedAt || null,
      data: spec.data || {}
    });
  }

  return { toCsv: toCsv, buildExport: buildExport, rawExtract: rawExtract };
});

/**
 * Định giá tồn kho — dùng `Unit.costBasis` THẬT, không phải giá scalar gần nhất.
 *
 * Gap (GIEO-REBUILD-HANDOFF-V2.md §4.2, FIFO-CHAIN-TRACE-REPORTING-V1.md §4):
 * legacy định giá tồn kho bằng giá gần nhất của mặt hàng, nên tồn gồm nhiều lô
 * giá khác nhau vẫn bị quy về một giá — sai lệch càng lớn khi giá nhập biến động.
 *
 * Điểm thứ hai của §4 cũng quan trọng không kém: khi hiển thị cùng lúc 2 chỉ số
 * dùng 2 CƠ SỞ GIÁ khác nhau (tồn kho hiện tại vs tiêu hao lịch sử), mỗi số
 * phải mang nhãn cơ sở giá của chính nó. Legacy chỉ có chú thích nhỏ, nên người
 * đọc dễ so hai số không cùng gốc. Ở đây `basis` là field của kết quả.
 */
GIEO.define('reporting/inventory-valuation', [
  'shared-kernel/result'
], function (R) {
  'use strict';

  var BASIS = {
    /* Cộng theo giá vốn thật của từng lô còn tồn. */
    FIFO_ACTUAL: 'FIFO_ACTUAL',
    /* Chỉ dùng cho phần tồn KHÔNG có Unit đại diện, vì không có lô để hỏi giá. */
    LATEST_COST: 'LATEST_COST'
  };

  /**
   * Giá trị tồn kho theo từng lô.
   *
   * Phần `untracked` (tồn không có Unit) được tách riêng và ghi rõ nó dùng cơ
   * sở giá khác — gộp vào tổng mà không nói là làm người đọc tưởng cả tổng đều
   * là giá lô thật.
   */
  function valuate(spec) {
    var units = spec.units || [];
    var trackedValue = 0;
    var trackedQty = 0;
    var lines = [];

    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      if (u.status !== 'SEALED' && u.status !== 'OPEN' && u.status !== 'CONSUMING') continue;
      var qty = u.status === 'SEALED' ? u.initialQty : u.remainingQty;
      if (qty <= 0) continue;
      if (!u.costBasis || typeof u.costBasis.unitCost !== 'number') {
        return R.err('PRECONDITION',
          'Unit ' + u.unitId + ' không có costBasis — không định giá được bằng giá lô thật',
          { unitId: u.unitId });
      }
      var value = qty * u.costBasis.unitCost;
      trackedValue += value;
      trackedQty += qty;
      lines.push({
        unitId: u.unitId, itemId: u.itemId, qty: qty,
        unitCost: u.costBasis.unitCost, value: value,
        costBasisVersionId: u.costBasis.versionId
      });
    }

    var untrackedQty = spec.untrackedBase || 0;
    var untrackedValue = null;
    if (untrackedQty > 0) {
      if (typeof spec.latestUnitCost !== 'number') {
        return R.err('NOT_FOUND',
          'có ' + untrackedQty + ' tồn không gắn lô nhưng không biết giá gần nhất để định giá phần đó');
      }
      untrackedValue = untrackedQty * spec.latestUnitCost;
    }

    return R.ok({
      tracked: { qty: trackedQty, value: trackedValue, basis: BASIS.FIFO_ACTUAL, lines: lines },
      untracked: untrackedQty > 0
        ? { qty: untrackedQty, value: untrackedValue, basis: BASIS.LATEST_COST, unitCost: spec.latestUnitCost }
        : null,
      totalQty: trackedQty + untrackedQty,
      totalValue: trackedValue + (untrackedValue || 0),
      /* Tổng trộn 2 cơ sở giá thì phải NÓI RA. */
      mixedBasis: untrackedQty > 0,
      computedAt: spec.computedAt || null
    });
  }

  /**
   * Nhãn cơ sở giá cho UI. §4 yêu cầu nhãn đi kèm từng số, không phải chú
   * thích nhỏ ở cuối màn.
   */
  function describeBasis(basis) {
    return basis === BASIS.FIFO_ACTUAL
      ? 'giá vốn thật của từng lô còn tồn'
      : 'giá nhập gần nhất (phần tồn không gắn lô)';
  }

  return { BASIS: BASIS, valuate: valuate, describeBasis: describeBasis };
});

/**
 * Variance report — actual vs theoretical là CHỈ SỐ CHÍNH.
 *
 * FIFO-CHAIN-TRACE-SALES-COGS-PL-V1.md: "packages/reporting/variance-report
 * phải hiển thị variance giữa 2 con số này làm chỉ số chính".
 *
 * Nguyên lý "Actual ≠ Theoretical" là nguyên lý trung tâm của Master Plan §10
 * nhưng CHƯA TỪNG được lấp cho domain COGS — nguyên liệu thô có đối chiếu
 * SỐ LƯỢNG (`thDoiChieu`), còn TIỀN thì không có gì để đối chiếu, vì chưa từng
 * có vế actual. Báo cáo này là chỗ vế đó cuối cùng được dùng.
 */
GIEO.define('reporting/variance-report', ['shared-kernel/result'], function (R) {
  'use strict';

  var STATUS = { OK: 'OK', OVER: 'OVER', UNDER: 'UNDER', UNKNOWN: 'UNKNOWN' };

  /**
   * @param spec.cogs       kết quả read-layer.getCOGS (đã có 2 vế)
   * @param spec.revenue    để tính tỉ lệ giá vốn
   * @param spec.targetPct  ngưỡng cogsPct của kỳ (resolve theo NGÀY ở tầng trên)
   * @param spec.tolerancePct
   */
  function build(spec) {
    var c = spec.cogs;
    if (!c) return R.err('VALIDATION', 'variance-report cần kết quả COGS');
    var tol = typeof spec.tolerancePct === 'number' ? spec.tolerancePct : 5;

    var status;
    var message;
    if (c.cogsActual === null) {
      /* Không có vế actual thì KHÔNG có variance — nói thẳng, không lấy
         theoretical so với chính nó rồi báo "khớp". */
      status = STATUS.UNKNOWN;
      message = 'chưa đủ dữ liệu lô để tính giá vốn thật' +
        (c.missingActual && c.missingActual.length ? ' (' + c.missingActual.length + ' bill thiếu)' : '');
    } else if (Math.abs(c.variancePct) <= tol) {
      status = STATUS.OK;
      message = 'giá vốn thật khớp định mức trong ngưỡng ' + tol + '%';
    } else {
      status = c.variance > 0 ? STATUS.OVER : STATUS.UNDER;
      message = (c.variance > 0 ? 'tốn hơn' : 'ít hơn') + ' định mức ' +
        Math.abs(c.variancePct).toFixed(1) + '%';
    }

    var netRevenue = spec.revenue ? spec.revenue.netRevenue : null;
    function pct(v) {
      return (v === null || !netRevenue) ? null : (v / netRevenue) * 100;
    }

    var actualPct = pct(c.cogsActual);
    var overTarget = (typeof spec.targetPct === 'number' && actualPct !== null)
      ? actualPct > spec.targetPct
      : null;

    return R.ok({
      cogsTheoretical: c.cogsTheoretical,
      cogsActual: c.cogsActual,
      variance: c.variance,
      variancePct: c.variancePct,
      status: status,
      message: message,
      /* Hai nguyên nhân gốc mà legacy không phân biệt được vì chỉ có 1 số. */
      possibleCauses: status === STATUS.OVER || status === STATUS.UNDER
        ? ['định mức khai sai (dùng nhiều/ít hơn công thức)', 'giá lô nhập lệch giá đang khai']
        : [],
      cogsPctTheoretical: pct(c.cogsTheoretical),
      cogsPctActual: actualPct,
      targetPct: typeof spec.targetPct === 'number' ? spec.targetPct : null,
      overTarget: overTarget,
      missingActual: c.missingActual || []
    });
  }

  /**
   * Vượt ngưỡng thì sinh cảnh báo CHỦ ĐỘNG.
   *
   * Gap §6 chain-trace Sales: `cogsPct` legacy có so sánh thật nhưng chỉ hiện
   * khi người TỰ mở tab Sức khoẻ — không ghi vào alerts, không chặn gì. Ở đây
   * nó phát ra để alerts domain nhận.
   */
  function toAlerts(report, spec) {
    if (!report.overTarget) return [];
    return [{
      type: 'COGS_OVER_TARGET',
      storeId: spec.storeId,
      businessDate: spec.businessDate,
      subjectKey: 'cogs.' + spec.businessDate,
      data: {
        cogsPct: report.cogsPctActual,
        target: report.targetPct,
        dateKey: spec.businessDate
      }
    }];
  }

  return { STATUS: STATUS, build: build, toAlerts: toAlerts };
});

/** Firebase compat/modular bridge chỉ đọc. Nhận handle đã khởi tạo, không chứa config/credential. */
GIEO.define('bootstrap/firebase-read-client', ['shared-kernel/result'], function (R) {
  'use strict';

  function create(spec) {
    spec = spec || {};
    var rtdb = spec.rtdb;
    var firestore = spec.firestore;

    function rtdbGet(path) {
      if (!rtdb || typeof rtdb.ref !== 'function') {
        return Promise.reject(new Error('chưa cấp Firebase RTDB handle'));
      }
      return Promise.resolve(rtdb.ref(path).once('value')).then(function (snap) {
        return snap && typeof snap.val === 'function' ? snap.val() : null;
      });
    }
    function rtdbSubscribe(path, onValue, onError) {
      if (!rtdb || typeof rtdb.ref !== 'function') {
        throw new Error('chưa cấp Firebase RTDB handle');
      }
      var ref = rtdb.ref(path);
      if (!ref || typeof ref.on !== 'function' || typeof ref.off !== 'function') {
        throw new Error('Firebase RTDB handle không hỗ trợ subscription');
      }
      function handle(snapshot) {
        onValue(snapshot && typeof snapshot.val === 'function' ? snapshot.val() : null);
      }
      ref.on('value', handle, onError);
      return function unsubscribe() { ref.off('value', handle); };
    }
    function collection(name) {
      if (!firestore || typeof firestore.collection !== 'function') {
        throw new Error('chưa cấp Firestore handle');
      }
      return firestore.collection(name);
    }
    function firestoreGet(name, id) {
      return Promise.resolve().then(function () { return collection(name).doc(id).get(); })
        .then(function (snap) {
          if (!snap || snap.exists === false) return null;
          return typeof snap.data === 'function' ? snap.data() : null;
        });
    }
    function firestoreQuery(name, query) {
      return Promise.resolve().then(function () {
        var ref = collection(name);
        (query.where || []).forEach(function (w) { ref = ref.where(w.field, w.op, w.value); });
        if (query.orderBy) ref = ref.orderBy(query.orderBy.field, query.orderBy.direction || 'asc');
        if (query.limit) ref = ref.limit(query.limit);
        return ref.get();
      }).then(function (snap) {
        var out = Object.create(null);
        if (snap && typeof snap.forEach === 'function') {
          snap.forEach(function (doc) { out[doc.id] = doc.data(); });
        }
        return out;
      });
    }

    return {
      rtdbGet: rtdbGet,
      rtdbSubscribe: rtdbSubscribe,
      firestoreGet: firestoreGet,
      firestoreQuery: firestoreQuery,
      assertReadOnly: function () { return R.ok(true); }
    };
  }

  return { create: create };
});

/** Composition root duy nhất cho apps: query qua read-layer, mutation qua commands. */
GIEO.define('bootstrap/runtime', [
  'shared-kernel/result',
  'commands/pipeline',
  'commands/sales',
  'commands/inventory',
  'commands/prep',
  'commands/reversal',
  'commands/approval',
  'commands/shift',
  'read-layer/gateway'
], function (R, pipeline, sales, inventory, prep, reversal, approval, shift, reads) {
  'use strict';

  var MODE = { READ_ONLY: 'READ_ONLY', SHADOW: 'SHADOW', WRITE: 'WRITE' };
  var COMMANDS = {
    RecordSale: sales.RecordSale,
    RecordAddon: sales.RecordAddon,
    RecordWaste: inventory.RecordWaste,
    AdjustInventory: inventory.AdjustInventory,
    ReportLostContainer: inventory.ReportLostContainer,
    RestoreFoundContainer: inventory.RestoreFoundContainer,
    RecordPrepProduction: prep.RecordPrepProduction,
    EditPrepYield: prep.EditPrepYield,
    ReverseTransaction: reversal.ReverseTransaction,
    ReviseState: reversal.ReviseState,
    CorrectLedgerEntry: reversal.CorrectLedgerEntry,
    ApproveLostContainer: approval.ApproveLostContainer,
    ApproveStockCount: approval.ApproveStockCount,
    ApproveExpense: approval.ApproveExpense,
    CloseCashSegment: shift.CloseCashSegment
  };
  var QUERIES = {
    GetMenu: reads.getMenu,
    GetUnitTrace: reads.getUnitTrace,
    GetInventoryLevel: reads.getInventoryLevel,
    GetRevenue: reads.getRevenue,
    GetCOGS: reads.getCOGS,
    GetPnL: reads.getPnL,
    ComparePeriods: reads.comparePeriods
  };

  function createRuntime(spec) {
    spec = spec || {};
    var mode = spec.mode || MODE.READ_ONLY;
    if (!MODE[mode]) throw new Error('[bootstrap/runtime] mode không hợp lệ: ' + mode);
    var operationStore = spec.operationStore || pipeline.createInMemoryOperationStore();

    function context() {
      return typeof spec.context === 'function' ? spec.context() : spec.context;
    }
    function query(name, input) {
      var fn = QUERIES[name];
      if (!fn) return Promise.resolve(R.err('NOT_FOUND', 'query chưa đăng ký: ' + name));
      var ctx = context();
      if (!ctx) return Promise.resolve(R.err('NOT_FOUND', 'chưa có StoreContext để đọc dữ liệu'));
      var hydrated = spec.dataSource && typeof spec.dataSource.forQuery === 'function'
        ? spec.dataSource.forQuery(name, input || {})
        : R.ok(input || {});
      return Promise.resolve(hydrated).then(function (resolved) {
        if (R.isErr(resolved)) return resolved;
        return fn(ctx, resolved.value);
      });
    }
    function command(name, input) {
      var cmd = COMMANDS[name];
      if (!cmd) return Promise.resolve(R.err('NOT_FOUND', 'command chưa đăng ký: ' + name));
      if (mode === MODE.READ_ONLY) {
        return Promise.resolve(R.err('FORBIDDEN',
          'Hệ thống mới đang READ_ONLY — production cũ vẫn là sole writer'));
      }
      var ctx = context();
      if (!ctx) return Promise.resolve(R.err('NOT_FOUND', 'chưa có StoreContext để chạy command'));
      var hydrated = spec.dataSource && typeof spec.dataSource.forCommand === 'function'
        ? spec.dataSource.forCommand(name, input || {})
        : R.ok(input || {});
      return Promise.resolve(hydrated).then(function (resolved) {
        if (R.isErr(resolved)) return resolved;
        if (mode === MODE.SHADOW) {
          return pipeline.run(cmd, resolved.value, ctx, { operationStore: operationStore });
        }
        if (typeof spec.commit !== 'function') {
          return R.err('VALIDATION', 'WRITE mode cần atomic commit adapter');
        }
        return pipeline.runAndCommit(cmd, resolved.value, ctx, {
          operationStore: operationStore,
          commit: spec.commit,
          rollback: spec.rollback
        });
      });
    }
    function watch(name, input, listener) {
      if (typeof listener !== 'function') throw new Error('[bootstrap/runtime] watch cần listener');
      var fn = QUERIES[name];
      if (!fn) {
        listener(R.err('NOT_FOUND', 'query chưa đăng ký: ' + name));
        return function () {};
      }
      function resolve(hydrated) {
        if (R.isErr(hydrated)) return listener(hydrated);
        var ctx = context();
        if (!ctx) return listener(R.err('NOT_FOUND', 'chưa có StoreContext để đọc dữ liệu'));
        listener(fn(ctx, hydrated.value));
      }
      if (spec.dataSource && typeof spec.dataSource.watchQuery === 'function') {
        var unsubscribe = spec.dataSource.watchQuery(name, input || {}, resolve);
        if (typeof unsubscribe === 'function') return unsubscribe;
      }
      query(name, input).then(listener);
      return function () {};
    }

    return {
      mode: mode,
      query: query,
      watch: watch,
      command: command,
      device: spec.device || {},
      registeredCommands: function () { return Object.keys(COMMANDS).sort(); },
      registeredQueries: function () { return Object.keys(QUERIES).sort(); }
    };
  }

  return { MODE: MODE, COMMANDS: COMMANDS, QUERIES: QUERIES, createRuntime: createRuntime };
});

/* ===== src/apps/quanly/controller.js ===== */
/** QUANLY controller: drill qua read-layer, sửa/duyệt qua command pipeline. */
GIEO.define('app-quanly/controller', [
  'shared-kernel/result',
  'bootstrap/runtime'
], function (R, bootstrap) {
  'use strict';

  function createController(runtime) {
    runtime = runtime || bootstrap.createRuntime({ mode: bootstrap.MODE.READ_ONLY });
    var state = { mode: runtime.mode, screen: 'OVERVIEW', lastResult: null, lastError: null };
    function snapshot() { return Object.assign({}, state); }
    function navigate(screen) {
      if (['OVERVIEW', 'TRACE', 'APPROVALS', 'REPORTS'].indexOf(screen) === -1) {
        return R.err('VALIDATION', 'màn QUANLY không hợp lệ: ' + screen);
      }
      state.screen = screen;
      return R.ok(snapshot());
    }
    function read(name, input) {
      return Promise.resolve(runtime.query(name, input || {})).then(function (out) {
        if (R.isErr(out)) state.lastError = out.error;
        else state.lastResult = out.value;
        return out;
      });
    }
    function run(name, input) {
      return runtime.command(name, input || {}).then(function (out) {
        if (R.isErr(out)) state.lastError = out.error;
        else state.lastResult = out.value;
        return out;
      });
    }

    return {
      state: snapshot,
      navigate: navigate,
      getUnitTrace: function (input) { return read('GetUnitTrace', input); },
      getRevenue: function (input) { return read('GetRevenue', input); },
      getCOGS: function (input) { return read('GetCOGS', input); },
      getPnL: function (input) { return read('GetPnL', input); },
      approveStockCount: function (input) { return run('ApproveStockCount', input); },
      approveLost: function (input) { return run('ApproveLostContainer', input); },
      approveExpense: function (input) { return run('ApproveExpense', input); },
      adjustInventory: function (input) { return run('AdjustInventory', input); },
      reverseOrder: function (input) { return run('ReverseTransaction', input); }
    };
  }

  return { createController: createController };
});

/* ===== src/apps/quanly/main.js ===== */
/** QUANLY thin client — điều tra qua read-layer, sửa qua commands. */
GIEO.define('app-quanly/main', [
  'shared-kernel/result',
  'bootstrap/runtime',
  'app-quanly/controller'
], function (R, bootstrap, controllerLib) {
  'use strict';

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function start() {
    var el = document.getElementById('app');
    if (!el) return R.err('NOT_FOUND', 'không có #app');
    var runtime = globalThis.GIEO_QUANLY_RUNTIME || bootstrap.createRuntime({ mode: bootstrap.MODE.READ_ONLY });
    var controller = controllerLib.createController(runtime);
    var traceView = { loading: false, error: null, data: null };
    var reportView = { loading: false, error: null, data: null };

    function traceMarkup() {
      if (traceView.loading) return '<div class="empty"><h3>Đang dựng timeline…</h3></div>';
      if (traceView.error) return '<div class="result error"><strong>Không thể truy vết</strong><span>' +
        esc(traceView.error.message) + '</span></div>';
      if (!traceView.data) return '<div class="empty"><div class="empty-icon">⌕</div><h3>Chọn một Unit để điều tra</h3>' +
        '<p>Read Layer tự chọn LIVE hoặc snapshot lịch sử; màn hình không branch theo nguồn.</p></div>';
      return '<div class="trace-grid"><article class="result"><span>Unit</span><strong>' +
        esc(traceView.data.unitId) + '</strong></article><article class="result"><span>Bill</span><strong>' +
        esc((traceView.data.billIds || []).length) + '</strong></article><article class="result"><span>BTP</span><strong>' +
        esc((traceView.data.prepBatchIds || []).length) + '</strong></article></div>';
    }

    function content(screen) {
      if (screen === 'TRACE') {
        return '<section class="panel"><div class="section-head"><div><p class="eyebrow">Truy vết hai chiều</p>' +
          '<h2>Unit → Bill / BTP / Waste</h2></div></div><div class="search-row">' +
          '<form id="ql-unit-search" style="display:contents"><input name="code" aria-label="Mã Unit" ' +
          'placeholder="Nhập hoặc quét mã Unit" required><button>Tra cứu</button></form></div>' +
          traceMarkup() + '</section>';
      }
      if (screen === 'APPROVALS') {
        return '<section class="panel"><div class="section-head"><div><p class="eyebrow">Kiểm soát</p>' +
          '<h2>Việc chờ duyệt</h2></div><span class="status neutral">0 việc</span></div>' +
          '<div class="empty"><div class="empty-icon">✓</div><h3>Chưa có dữ liệu duyệt</h3>' +
          '<p>Kiểm kê, báo mất và chi phí chỉ được thay đổi qua command có audit.</p></div></section>';
      }
      if (screen === 'REPORTS') {
        return '<section class="panel"><div class="section-head"><div><p class="eyebrow">Sổ sách</p>' +
          '<h2>Doanh thu · COGS · P&amp;L</h2></div><button disabled>Xuất báo cáo</button></div>' +
          '<form class="search-row" id="revenue-search"><input type="date" name="date" required>' +
          '<button>Đọc doanh thu</button></form>' +
          (reportView.loading ? '<div class="empty"><h3>Đang đọc báo cáo…</h3></div>' :
            reportView.error ? '<div class="result error"><strong>Không đọc được báo cáo</strong><span>' +
              esc(reportView.error.message) + '</span></div>' :
            '<div class="metric-grid"><article class="metric"><span>Doanh thu thuần</span><strong>' +
              (reportView.data ? Number(reportView.data.netRevenue).toLocaleString('vi-VN') + ' ₫' : '—') +
              '</strong></article><article class="metric"><span>Số đơn</span><strong>' +
              (reportView.data ? esc(reportView.data.billCount) : '—') +
              '</strong></article><article class="metric"><span>Phí kênh</span><strong>' +
              (reportView.data ? Number(reportView.data.channelFees).toLocaleString('vi-VN') + ' ₫' : '—') +
              '</strong></article></div>') + '</section>';
      }
      return '<section class="panel"><div class="section-head"><div><p class="eyebrow">Tổng quan cửa hàng</p>' +
        '<h2>Hôm nay</h2></div><span class="status neutral">Chưa đồng bộ</span></div>' +
        '<div class="metric-grid"><article class="metric"><span>Doanh thu</span><strong>—</strong></article>' +
        '<article class="metric"><span>Cảnh báo</span><strong>—</strong></article>' +
        '<article class="metric"><span>Unit cần rà</span><strong>—</strong></article></div></section>';
    }

    function render() {
      var state = controller.state();
      var readonly = state.mode === bootstrap.MODE.READ_ONLY;
      el.innerHTML = '<div class="app-shell management"><header class="topbar"><div>' +
        '<p class="brand">gieo gieo</p><h1>Quản lý vận hành</h1></div>' +
        '<span class="status ' + (readonly ? 'warning' : 'success') + '">' + esc(state.mode) + '</span></header>' +
        (readonly ? '<div class="notice"><strong>Chế độ chỉ đọc</strong><span>Mọi chỉnh sửa đang bị khóa cho tới shadow/cutover.</span></div>' : '') +
        '<div class="workspace"><aside class="side-nav" aria-label="Điều hướng quản lý">' +
          '<button data-screen="OVERVIEW" class="' + (state.screen === 'OVERVIEW' ? 'active' : '') + '">Tổng quan</button>' +
          '<button data-screen="TRACE" class="' + (state.screen === 'TRACE' ? 'active' : '') + '">Truy vết FIFO</button>' +
          '<button data-screen="APPROVALS" class="' + (state.screen === 'APPROVALS' ? 'active' : '') + '">Duyệt &amp; sửa</button>' +
          '<button data-screen="REPORTS" class="' + (state.screen === 'REPORTS' ? 'active' : '') + '">Báo cáo</button>' +
        '</aside><main>' + content(state.screen) + '</main></div></div>';
      Array.prototype.forEach.call(el.querySelectorAll('[data-screen]'), function (button) {
        button.addEventListener('click', function () {
          controller.navigate(button.getAttribute('data-screen'));
          render();
        });
      });
      var form = el.querySelector('#ql-unit-search');
      if (form) form.addEventListener('submit', function (event) {
        event.preventDefault();
        traceView = { loading: true, error: null, data: null };
        var code = form.elements.code.value;
        render();
        controller.getUnitTrace({ containerCode: code }).then(function (out) {
          traceView = R.isErr(out)
            ? { loading: false, error: out.error, data: null }
            : { loading: false, error: null, data: out.value.data };
          render();
        });
      });
      var revenueForm = el.querySelector('#revenue-search');
      if (revenueForm) revenueForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var date = revenueForm.elements.date.value;
        reportView = { loading: true, error: null, data: null };
        render();
        controller.getRevenue({ businessDate: date }).then(function (out) {
          reportView = R.isErr(out)
            ? { loading: false, error: out.error, data: null }
            : { loading: false, error: null, data: out.value.data };
          render();
        });
      });
    }

    render();
    return R.ok({ mode: runtime.mode });
  }

  return { start: start };
});

/* ===== khởi động ===== */
GIEO.require("app-quanly/main").start();

</script>
</body>
</html>
