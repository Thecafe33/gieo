  <script>
    /*
      FILE POS DUY NHẤT — không Vite, React, import hay file JavaScript đi kèm.

      Khi core FIFO mới đã được đặt vào chính file này, chỉ cần truyền một runtime
      có watch('GetMenu', {}, listener). UI không gọi Firebase trực tiếp cho bán
      hàng/tồn kho và cũng không tự tính FIFO/COGS. Riêng cấu hình Máy in cũ giữ
      node độc lập của nó để không làm thay đổi các cổng APK đã chạy thực tế.
    */
    const DEMO_MENU = [
      { name:'Sữa gạo', items:[
        { id:'gao-nguyen-ban', name:'Sữa gạo nguyên bản', prices:{ M:25000, L:30000 } },
        { id:'gao-la-dua', name:'Sữa gạo lá dứa', prices:{ M:29000, L:35000 } },
        { id:'gao-matcha', name:'Sữa gạo matcha', prices:{ M:35000, L:42000 } }
      ]},
      { name:'Trà', items:[
        { id:'laitac-matong', name:'Lài tắc mật ong', prices:{ L:15000 } },
        { id:'olong-sua', name:'Ô long sữa', prices:{ M:25000, L:30000 } },
        { id:'tra-dao', name:'Trà đào', prices:{ M:25000, L:30000 } }
      ]},
      { name:'Đặc biệt', items:[
        { id:'sua-gao-phu-nam', name:'Sữa gạo Phù Nam', prices:{ M:32000, L:39000 } },
        { id:'choco', name:'Choco latte', prices:{ M:30000, L:36000 } },
        { id:'matcha', name:'Matcha latte', prices:{ M:30000, L:36000 } }
      ]}
    ];
    const COLORS = ['#429a70','#57a6a0','#5685bf','#d58b45','#c56f84','#7770bb','#37948d'];
    const state = { menu: DEMO_MENU, category:'all', cart:[], sheet:null, selected:null, payment:null, cashGiven:0, checkoutMessage:'', split:null, customerPhone:'', customer:null, loyaltyCustomer:null, customerLookup:'idle', customerLookupPhone:'', customerError:'' };
    const $ = id => document.getElementById(id);
    const money = value => Number(value || 0).toLocaleString('vi-VN') + 'đ';
    const menuPrice = value => Math.round(Number(value || 0) / 1000) + 'K';
    const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const subtotal = () => state.cart.reduce((sum, line) => sum + line.price * line.qty, 0);
    const findItem = id => state.menu.flatMap(group => group.items).find(item => item.id === id);
    const cartQty = id => state.cart.filter(line => line.id === id).reduce((n, line) => n + line.qty, 0);
    function report(message) { $('notice').textContent = message; $('notice').style.display = message ? 'block' : 'none'; }
    function visibleGroups() { return state.category === 'all' ? state.menu : state.menu.filter(group => group.name === state.category); }
    function renderCategories() {
      $('categories').innerHTML = '<button class="category ' + (state.category === 'all' ? 'active' : '') + '" data-category="all">TẤT CẢ</button>' + state.menu.map(group =>
        '<button class="category ' + (state.category === group.name ? 'active' : '') + '" data-category="' + esc(group.name) + '">' + esc(group.name) + '</button>').join('');
      document.querySelectorAll('[data-category]').forEach(button => button.onclick = () => { state.category = button.dataset.category; render(); });
    }
    function renderMenu() {
      let index = 0;
      const cards = visibleGroups().flatMap(group => group.items).map(item => {
        const low = Math.min(...Object.values(item.prices)); const quantity = cartQty(item.id); const color = COLORS[index++ % COLORS.length];
        return '<button class="product" style="background:' + color + '" data-product="' + esc(item.id) + '">' +
          (quantity ? '<span class="product-count">' + quantity + '</span>' : '') +
          '<span class="product-name">' + esc(item.name) + '</span><span class="product-price">' + menuPrice(low) + '</span></button>';
      }).join('');
      $('menu').innerHTML = cards || '<div class="empty"><strong>Menu đang trống</strong>Hãy tạo món ở QUANLY trước.</div>';
      document.querySelectorAll('[data-product]').forEach(button => button.onclick = () => choose(findItem(button.dataset.product)));
    }
    function renderFooter() {
      const qty = state.cart.reduce((n, line) => n + line.qty, 0); const has = qty > 0;
      $('cartLabel').textContent = 'TẠM TÍNH · GIỎ HÀNG' + (qty ? ' (' + qty + ')' : ''); $('total').textContent = money(subtotal()); $('pay').disabled = !has;
    }
    function render() { renderCategories(); renderMenu(); renderFooter(); }
    function choose(item) { const sizes = Object.keys(item.prices); sizes.length === 1 ? add(item, sizes[0]) : openSize(item); }
    function add(item, size) {
      const price = Number(item.prices[size]); const current = state.cart.find(line => line.id === item.id && line.size === size);
      if (current) current.qty++; else state.cart.push({ id:item.id, name:item.name, size, price, qty:1 });
      closeSheet(); render();
    }
    const IMPORTANT_ALERTS = [
      { icon:'!', title:'Cảnh báo tồn kho', text:'Sữa gạo nguyên bản đang thấp hơn mức tối thiểu.' },
      { icon:'•', title:'Cần xử lý', text:'Có một tem hàng cần được xác nhận đã hết.' }
    ];

    async function lookupSharedCustomer() {

        }
        state.loyaltyCustomer = data;
        state.customer = { phone, name:data.nickname || data.name || 'Khách hàng', note:data.note || '', myGifts:data.myGifts || {} };
        state.customerLookup = 'found'; renderCheckout();
      } catch (error) {
        if (state.customerLookupPhone !== phone) return;

      }

    }
    function renderCheckout() {

      $('checkoutScreen').innerHTML = '<header class="screen-top"><strong class="screen-title">THANH TOÁN</strong><button class="screen-close" id="backOrder">×</button></header>' +

        '<section class="member-card"><div class="member-row"><div class="member-icon">♙</div><div class="member-info"><label>KHÁCH HÀNG / TÍCH ĐIỂM</label><input id="customerPhone" inputmode="tel" autocomplete="off" placeholder="Nhập SĐT..." value="' + esc(state.customerPhone) + '"></div><button class="member-find" id="findCustomer" ' + (state.customerLookup === 'loading' ? 'disabled' : '') + '>' + (state.customerLookup === 'loading' ? 'Đang tìm' : 'Tìm') + '</button></div>' + renderCustomerResult() + '</section>' +

        '<section class="payment-grid"><button class="checkout-option" id="chooseCash"><div class="payment-icon cash-icon">₫</div><b>Tiền mặt</b></button><button class="checkout-option ' + (isBank ? 'selected' : '') + '" id="chooseBank"><div class="payment-icon bank-icon">⌂</div><b>Chuyển khoản</b></button></section>' +
        '<button class="checkout-full" id="splitBill"><div class="split-icon">⊞</div><div><strong>Tính riêng</strong><span>Tách bill cho từng khách</span></div><i>›</i></button>' +
        '<section class="bank-area ' + (isBank ? 'show' : '') + '"><b>Chờ khách chuyển khoản</b><br>QR và trạng thái thanh toán sẽ do core thanh toán cấp trong bước nối tiếp.</section>' +

      $('splitBill').onclick = openSplit;

    function cashSuggestions(total) {
      const raw = [total, 20000, 50000, 100000, 200000, 500000].map(value => Math.max(value, Math.ceil(total / Math.max(10000, value)) * Math.max(10000, value)));
      return [...new Set(raw)].sort((a, b) => a - b).slice(0, 6);
    }
    function openCash() {
      state.payment = 'cash'; state.cashGiven = subtotal(); $('checkoutScreen').classList.remove('show'); renderCash(); $('cashScreen').classList.add('show');
    }
    function renderCash() {
      const total = subtotal(), given = Number(state.cashGiven || 0), diff = given - total, enough = diff >= 0;
      $('cashScreen').innerHTML = '<header class="screen-top"><strong class="screen-title">TIỀN MẶT</strong><button class="screen-close" id="backCheckout">×</button></header>' +
        '<section class="cash-total"><span class="cash-label">TỔNG HÓA ĐƠN</span><strong>' + money(total) + '</strong></section>' +
        '<section class="cash-card"><h2>KHÁCH ĐƯA (GỢI Ý)</h2><div class="suggestions">' + cashSuggestions(total).map(value => '<button class="' + (given === value ? 'active' : '') + '" data-given="' + value + '">' + money(value) + '</button>').join('') + '</div></section>' +
        '<section class="cash-card"><h2>NHẬP SỐ TIỀN KHÁCH ĐƯA</h2><div class="cash-input"><input id="cashGiven" inputmode="numeric" value="' + (given ? given.toLocaleString('vi-VN') : '') + '"><b>đ</b></div></section>' +
        '<section class="cash-card"><div class="change-card ' + (enough ? '' : 'short') + '"><div><span class="cash-label">' + (enough ? 'TIỀN THỪA' : 'CÒN THIẾU') + '</span><strong>' + money(Math.abs(diff)) + '</strong></div><b style="font-size:28px">' + (enough ? '✓' : '!') + '</b></div></section>' +
        '<button class="confirm-cash" id="confirmCash">XÁC NHẬN THANH TOÁN</button><div class="cash-feedback" id="cashFeedback"></div>';

      $('cashScreen').querySelectorAll('[data-given]').forEach(button => button.onclick = () => { state.cashGiven = Number(button.dataset.given); renderCash(); });

      $('confirmCash').onclick = () => { $('cashFeedback').textContent = 'Nút này sẽ gọi RecordSale của FIFO core khi hợp đồng payment được nối.'; $('cashFeedback').style.display = 'block'; };
    }
    function splitSelectedTotal() { return [...state.split.selected].reduce((sum, index) => sum + state.split.items[index].price, 0); }
    function splitPaidTotal() { return state.split.groups.reduce((sum, group) => sum + group.total, 0); }
    function openSplit() {
      const units = [];
      state.cart.forEach(line => { for (let i = 0; i < line.qty; i++) units.push({ name:line.name, size:line.size, price:line.price, paid:false }); });
      state.split = { items:units, selected:new Set(), groups:[] };
      $('checkoutScreen').classList.remove('show'); renderSplit(); $('splitScreen').classList.add('show');

    function renderSplit() {
      const split = state.split, paid = splitPaidTotal(), remaining = Math.max(0, subtotal() - paid), chosen = splitSelectedTotal();
      $('splitScreen').innerHTML = '<header class="screen-top"><strong class="screen-title">TÍNH RIÊNG</strong><button class="screen-close" id="backFromSplit">×</button></header>' +
        '<section class="split-stats"><article class="split-stat"><span>ĐÃ TÍNH</span><strong>' + money(paid) + '</strong></article><article class="split-stat"><span>CÒN LẠI</span><strong>' + money(remaining) + '</strong></article></section>' +
        '<section class="split-list">' + split.items.map((item, index) => '<button type="button" class="split-row ' + (item.paid ? 'paid' : '') + (split.selected.has(index) ? ' selected' : '') + '" data-split-item="' + index + '"><div class="split-name">' + esc(item.name) + '<small>Size ' + esc(item.size) + (item.paid ? ' · Đã thanh toán' : '') + '</small></div><strong class="split-price">' + money(item.price) + '</strong><i class="split-check">' + (item.paid ? '✓' : (split.selected.has(index) ? '✓' : '')) + '</i></button>').join('') + '</section>' +
        '<footer class="split-bottom"><div class="split-selected"><span>ĐANG CHỌN · ' + split.selected.size + ' MÓN</span><strong>' + money(chosen) + '</strong></div><button class="split-pay split-cash" id="splitCash" ' + (chosen ? '' : 'disabled') + '>TIỀN MẶT</button><button class="split-pay split-bank" id="splitBank" ' + (chosen ? '' : 'disabled') + '>CHUYỂN KHOẢN</button>' +
        (remaining === 0 && split.items.length ? '<button class="split-done" id="finishSplit">Hoàn tất tính riêng</button>' : '') + '</footer>';
      $('backFromSplit').onclick = () => { $('splitScreen').classList.remove('show'); renderCheckout(); $('checkoutScreen').classList.add('show'); };

      $('splitScreen').onclick = event => {

    function openSplitCash() {

      openSheet('<div class="handle"></div><header class="sheet-head"><strong class="sheet-title">Tiền mặt · ' + money(total) + '</strong><button class="close">×</button></header><div class="sheet-label">KHÁCH ĐƯA</div><div class="sizes">' + suggestions.map(value => '<button class="size" data-split-given="' + value + '">' + money(value) + '</button>').join('') + '</div><div style="padding:0 18px 22px"><button class="confirm-cash" id="confirmSplitCash">Xác nhận tiền mặt</button></div>', 'modal');

      $('sheet').querySelectorAll('[data-split-given]').forEach(button => button.onclick = () => { given = Number(button.dataset.splitGiven); $('sheet').querySelectorAll('[data-split-given]').forEach(b => b.style.outline = ''); button.style.outline = '3px solid var(--brand)'; });

    function startSplitBank() {

      /* Hàm này chỉ bọc đúng callback của flow QR/webhook cũ. Khi graft code cũ
         vào file, adapter nhận amount + callback này và không đổi node/endpoint. */
      if (window.GIEO_LEGACY_PAYMENT && typeof window.GIEO_LEGACY_PAYMENT.openSplitTransfer === 'function') {

    renderAlerts(); renderSidebar(); render();

    /* Điểm nối FIFO core, sẽ thay DEMO_MENU bằng read model canonical khi có runtime mới. */
    if (window.GIEO_POS_RUNTIME && typeof window.GIEO_POS_RUNTIME.watch === 'function') {
      window.GIEO_POS_RUNTIME.watch('GetMenu', {}, result => {
        if (result && result.ok && result.value && Array.isArray(result.value.data)) { state.menu = result.value.data.map(group => ({ name:group.category.name, items:group.items.map(item => ({ id:item.menuItemId, name:item.name, prices:item.prices })) })); $('status').classList.add('live'); $('statusText').textContent = 'ĐANG BÁN'; report(''); render(); }
      });
    }

  <script>
    /*
      KHO POS — UI legacy, dữ liệu canonical FIFO.

      Đây là thin client: màn hình không đọc collection kho cũ, không tự tính tồn,
      FIFO hoặc COGS và không dùng AdjustInventory để thay cho nghiệp vụ còn thiếu.
      QUANLY/Core phải phát một read model GetPOSInventoryWorkspace; mọi mutation
      đi qua runtime.command. Contract chưa đăng ký sẽ dừng rõ ràng (fail closed).
    */
    (() => {
      'use strict';
      const WORKSPACE_QUERY = 'GetPOSInventoryWorkspace';
      const PREP_QUOTE_QUERY = 'GetPrepBatchQuote';

        const detail = $history('historyDetail'), quantity = bill.items.reduce((sum, item) => sum + Number(item.qty || item.quantity || 1), 0), groups = bill.splitGroups;
        const body = groups.length ? groups.map(group => '<section class="history-detail-card" style="border:2px solid ' + (group.method === 'TIỀN MẶT' ? '#C22B49' : '#7c3aed') + '"><div style="font-size:13px;font-weight:800;color:' + (group.method === 'TIỀN MẶT' ? '#C22B49' : '#6d28d9') + '">' + escapeHistory(group.method || '—') + '</div><div class="history-detail-sub" style="background:#f7f7f7;color:#666">' + Number(group.items && group.items.length || 0) + ' món · ' + formatMoney(group.total) + (group.bankOrderId ? ' · ' + escapeHistory(group.bankOrderId) : '') + '</div></section>').join('') : '<section class="history-detail-card"><div style="font-size:11px;font-weight:800;color:#999;letter-spacing:.6px">CHI TIẾT MÓN</div>' + bill.items.map((item, index) => '<div class="history-detail-row"><span style="min-width:20px;font-size:17px;font-weight:700">' + (index + 1) + '</span><span class="history-detail-item">' + escapeHistory(item.name || item.title || 'Món') + (Number(item.qty || item.quantity || 1) > 1 ? ' <span style="font-size:13px;color:#E23A5D">×' + Number(item.qty || item.quantity || 1) + '</span>' : '') + '<span class="history-detail-sub">' + escapeHistory(item.size || '—') + ' · ' + formatMoney(item.price) + '</span></span><strong>' + formatMoney(itemPrice(item)) + '</strong></div>').join('') + '</section>';
        detail.innerHTML = '<header class="history-detail-head"><button type="button" class="history-detail-back" id="historyDetailBack">‹ Lịch sử đơn</button><span></span></header><section class="history-detail-card"><div class="history-detail-brand">Gieo Gieo</div><div style="display:flex;align-items:center;gap:6px;margin:4px 0 16px"><i style="width:8px;height:8px;border-radius:50%;background:#C22B49"></i><span style="font-size:12px;font-weight:800;color:#999;letter-spacing:.7px">HÓA ĐƠN ĐIỆN TỬ</span></div>' + (bill.billCode ? '<div style="color:#E23A5D;font-size:14px;font-weight:800;margin-bottom:12px">' + escapeHistory(bill.billCode) + '</div>' : '') + (billBankCodes(bill) ? '<div class="history-detail-sub" style="background:#f5f3ff;color:#6d28d9">🏦 Mã CK: ' + escapeHistory(billBankCodes(bill)) + '</div>' : '') + '</section>' + body + '<section class="history-detail-card"><div style="font-size:11px;font-weight:800;color:#999;letter-spacing:.6px">THÔNG TIN THANH TOÁN</div><div class="history-detail-row"><span>Thời gian</span><strong>' + escapeHistory(bill.time + ' · ' + bill.date) + '</strong></div><div class="history-detail-row"><span>Khách</span><strong>' + escapeHistory(bill.phone || bill.customerName || 'Khách vãng lai') + '</strong></div><div class="history-detail-row"><span>Phương thức</span><strong style="color:#C22B49">' + escapeHistory(bill.method) + '</strong></div></section><section class="history-detail-card"><div style="font-size:11px;font-weight:800;color:#999;letter-spacing:.6px">TỔNG BILL</div><div style="margin-top:6px;color:#111;font-size:44px;font-weight:800;letter-spacing:-1px">' + formatMoney(bill.total) + '</div><div style="margin-top:5px;color:#999">Số lượng: ' + quantity + ' món</div></section><button type="button" class="history-reprint" id="historyReprint">🖨 In lại hóa đơn</button>';
        detail.classList.add('show'); byDetailButtons(bill);
      }
      function byDetailButtons(bill) {
        $history('historyDetailBack').onclick = () => $history('historyDetail').classList.remove('show');
        const reprint = $history('historyReprint'); reprint.disabled = !(window.GIEO_LEGACY_PRINTER && window.GIEO_LEGACY_PRINTER.printBillCanvas);
        reprint.onclick = async () => { if (reprint.disabled) { historyNotice('⚠ Máy in chưa sẵn sàng.'); return; } try { await window.GIEO_LEGACY_PRINTER.printBillCanvas([{ text:'GIEO GIEO', size:26, align:'center', bold:true }, { text:bill.billCode || 'HÓA ĐƠN', size:14, align:'center' }, { type:'divider', style:'dashed' }, ...bill.items.map(item => ({ text:(item.name || item.title || 'Món') + ' ×' + Number(item.qty || item.quantity || 1) + '  ' + formatMoney(itemPrice(item)), size:14 })), { type:'divider' }, { text:'TỔNG: ' + formatMoney(bill.total), size:22, align:'right', bold:true }, { text:bill.method, size:13, align:'right' }]); historyNotice('✅ Đã gửi lệnh in lại'); } catch (error) { historyNotice('❌ Không in được: ' + error.message); } };
      }
      function renderHistoryScreen() {
        $history('historyScreen').innerHTML = '<header class="history-head"><strong>LỊCH SỬ ĐƠN</strong><button type="button" class="history-close" id="historyClose">×</button></header><label class="history-search"><span style="font-size:18px;color:#bbb">⌕</span><input type="search" id="historySearch" autocomplete="off" placeholder="Tìm đơn theo mã bill / SĐT..."></label><section id="historyList"></section><aside class="history-detail" id="historyDetail"></aside>';
        $history('historyClose').onclick = () => { $history('historyScreen').classList.remove('show'); backToOrder(); };
        $history('historySearch').oninput = event => { historyState.query = event.target.value; renderHistoryList(); };
        renderHistoryList();
      }
      function replaceBills(records) { historyState.bills = (Array.isArray(records) ? records : []).map(normaliseBill).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); if ($history('historyScreen').classList.contains('show')) renderHistoryScreen(); }
      function appendBill(record) { const bill = normaliseBill(record); const old = historyState.bills.findIndex(item => item.id === bill.id); if (old >= 0) historyState.bills.splice(old, 1); historyState.bills.unshift(bill); if ($history('historyScreen').classList.contains('show')) renderHistoryScreen(); }
      window.openLegacyHistoryScreen = () => { closeSheet(); $history('checkoutScreen').classList.remove('show'); $history('cashScreen').classList.remove('show'); $history('splitScreen').classList.remove('show'); $history('printerScreen').classList.remove('show'); document.querySelector('.app').style.display = 'none'; document.querySelector('.footer').style.display = 'none'; renderHistoryScreen(); $history('historyScreen').classList.add('show'); };
      window.GIEO_POS_HISTORY = Object.freeze({ replaceBills, appendBill, clear:() => replaceBills([]) });
      window.addEventListener('gieo:history-updated', event => replaceBills(event.detail));
      window.addEventListener('gieo:history-bill', event => appendBill(event.detail));
      if (window.GIEO_FIFO_FIREBASE && window.GIEO_FIFO_FIREBASE.ready()) {
        window.GIEO_FIFO_FIREBASE.whenAuthenticated().then(user => {
          if (user) window.GIEO_FIFO_FIREBASE.watchTodayBills(replaceBills, error => historyNotice('⚠ Không đọc được lịch sử FIFO: ' + (error && error.message || error)));
        });
      }
    })();
  </script>
</body>
</html>
