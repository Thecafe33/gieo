<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gợi ý đặt hàng — mẫu v3 (widget kiểu manage)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* MẪU DUYỆT v3 — số liệu giả. Dáng widget chép từ manage.html (.legacy-revenue, .outlet-widget,
   .widget-*), màu theo quanlygieo (hồng #E23A5D). */
:root{
  --gd:#E23A5D; --gm:#B7284A; --gl:#FDECF0;
  --bg:#F8EFF2; --panel:#FFFFFF; --ink:#17151A; --sub:#6C6873; --line:#E6E3DF;
  --ok:#12855A; --warn:#A8690B; --bad:#D2333F;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;
  background-image:radial-gradient(ellipse at 80% -10%,#fbe1e8 0,transparent 55%)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.mau-note{font-size:12px;color:#6b5512;background:#fff8e1;border:1px dashed #d9b44a;border-radius:14px;padding:8px 12px;margin-bottom:16px}

/* ---- Đầu trang (giống page-head manage) ---- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.page-head .sub{color:var(--sub);font-size:14px;margin-top:4px}
.seg{display:inline-flex;background:#ffffffa6;border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px #0000000a}
.seg button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font:inherit;font-weight:650;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:750;box-shadow:0 1px 3px #0000001a}

/* ---- Widget lớn (theo .legacy-revenue) ---- */
.hero{color:#fff;padding:22px 25px 18px;border-radius:30px;
  background:radial-gradient(ellipse at 10% 0%,#f0607e 0,transparent 60%),linear-gradient(135deg,#E23A5D,#B7284A);
  box-shadow:0 8px 24px -14px #7a1830aa;margin-bottom:22px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:15px;font-weight:750}
.chip-w{font-size:12px;font-weight:750;background:#ffffff26;border-radius:999px;padding:6px 10px;white-space:nowrap}
.total{font-size:56px;letter-spacing:-1.8px;line-height:1.08;font-weight:800;margin-top:6px}
.total span{font-size:22px;margin-left:4px;letter-spacing:0}
.total-sub{font-size:14px;font-weight:600;opacity:.92;margin-top:2px}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:16px 0 10px;background:#ffffff33;gap:2px}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.legend b{font-weight:800}
.tl{margin-top:30px}
.tl-m{display:none;margin-top:14px;font-size:12.5px;font-weight:650;background:#ffffff26;border-radius:16px;padding:9px 12px;line-height:1.6}
.tl-m b{font-weight:800}
.tl-track{position:relative;height:6px;border-radius:99px;background:#ffffff40;margin:22px 6px 6px}
.tl-track>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#fff}
.tl-pt{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#B7284A;border:3px solid #fff}
.tl-pt.on{background:#fff}
.tl-lb{position:absolute;bottom:12px;transform:translateX(-50%);font-size:11.5px;font-weight:700;white-space:nowrap}
.tl-lb.dn{bottom:auto;top:12px;font-weight:600;opacity:.85}
.tl-pt:first-child+.tl-lb,.tl-lb.l{transform:none}
.tl-lb.r{transform:translateX(-100%)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px;padding-top:12px;border-top:1px solid #ffffff38;font-size:12.5px;font-weight:600}
.hero-btns{display:flex;gap:8px}
.hb{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:750;cursor:pointer;white-space:nowrap}
.hb-w{background:#fff;color:var(--gm)} .hb-g{background:#ffffff2e;color:#fff}

/* ---- Tiêu đề nhóm (stores-section-head) ---- */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 14px}
.sec h2{font-size:18px;font-weight:800;letter-spacing:-.4px}
.sec h2 small{font-size:12px;color:var(--gm);margin-left:6px;font-weight:800}
.sec .r{font-size:12.5px;color:var(--sub);font-weight:600}

/* ---- Widget từng NL (theo .outlet-widget) ---- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start;margin-bottom:24px}
.w{container-type:inline-size;position:relative;display:flex;flex-direction:column;min-width:0;padding:22px;border-radius:36px;
  border:1px solid color-mix(in srgb,var(--c) 14%,var(--panel));
  background:radial-gradient(ellipse at 12% 0%,color-mix(in srgb,var(--c) 26%,var(--panel)),transparent 86%),color-mix(in srgb,var(--c) 9%,var(--panel));
  box-shadow:inset 0 1px 0 #ffffff80,0 5px 18px color-mix(in srgb,var(--c) 7%,transparent);overflow:hidden}
.w-head{display:flex;gap:10px;align-items:center;min-height:40px}
.mark{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border-radius:15px;background:var(--c);color:#fff;font-size:17px;font-weight:850;letter-spacing:-.6px}
.w-heading{flex:1;min-width:0}
.w-heading h3{font-size:16px;line-height:1.25;font-weight:800;letter-spacing:-.4px}
.w-heading p{margin-top:3px;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e2{display:inline-grid;place-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap;background:color-mix(in srgb,var(--panel) 70%,transparent)}
.e2.ok{color:var(--ok)} .e2.lr{color:var(--warn)} .e2.cs{color:var(--sub)}
.w-main{margin:16px 0 12px}
.w-label{font-size:13px;font-weight:650;color:var(--sub)}
.w-val{font-size:clamp(30px,12cqw,44px);font-weight:850;line-height:1.2;letter-spacing:-1.6px;color:var(--c);white-space:nowrap}
.w-val span{font-size:17px;letter-spacing:0;margin-left:4px;font-weight:750}
.w-val.zero{color:var(--sub);opacity:.6}
.w-share{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:2px}
.w-share b{color:var(--c);font-weight:800;font-size:13px}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--panel) 72%,transparent);border-radius:999px;padding:5px 11px;margin-bottom:14px}
.pill b{font-weight:800}
.pill.bad b{color:var(--bad)} .pill.ok b{color:var(--ok)} .pill.warn b{color:var(--warn)}
.goal-row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px}
.goal-row strong{font-size:14px;color:var(--c);font-weight:800}
.track{position:relative;height:6px;background:color-mix(in srgb,var(--c) 14%,var(--panel));border-radius:99px;margin-bottom:14px}
.track>i{display:block;height:100%;background:var(--c);border-radius:99px;max-width:100%}
.track>em{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);opacity:.55;border-radius:2px}
.note{font-size:12px;color:var(--sub);background:color-mix(in srgb,var(--panel) 60%,transparent);border:1px solid color-mix(in srgb,var(--c) 14%,transparent);border-radius:16px;padding:9px 11px;margin-bottom:14px;line-height:1.5}
.note b{color:var(--ink)}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;border-top:1px solid color-mix(in srgb,var(--c) 16%,transparent);padding-top:12px}
.metrics span{display:block;font-size:11px;color:var(--sub);white-space:nowrap}
.metrics b{display:block;font-size:13px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}

/* ---- Danh sách «đủ» (theo widget Bill chung) ---- */
.lw{--c:#12855A;padding:20px;border-radius:36px;border:1px solid color-mix(in srgb,var(--c) 14%,var(--panel));
  background:radial-gradient(ellipse at 12% 0%,color-mix(in srgb,var(--c) 18%,var(--panel)),transparent 86%),color-mix(in srgb,var(--c) 7%,var(--panel))}
.lw .w-head{margin-bottom:12px}
.lrow{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--panel) 75%,transparent);border-radius:18px;padding:10px 14px;margin-top:8px}
.lrow .mark{width:34px;height:34px;border-radius:12px;font-size:14px}
.lrow .nm{flex:1;min-width:0;font-weight:750}
.lrow .nm small{display:block;font-weight:500;color:var(--sub);font-size:12px}
.lrow .rt{text-align:right;font-weight:800;color:var(--ok);white-space:nowrap}
.lrow .rt small{display:block;font-weight:600;color:var(--sub);font-size:11.5px}
.hide{display:none}

@media(min-width:761px) and (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  .wrap{padding:14px 16px 50px}
  .page-head h1{font-size:26px}
  .seg{width:100%} .seg button{flex:1}
  .hero{padding:20px 18px 16px;border-radius:28px}
  .total{font-size:42px} .total span{font-size:18px}
  .legend{font-size:12px;gap:4px 12px}
  .hero-foot{flex-direction:column;align-items:stretch}
  .hero-btns .hb{flex:1}
  .grid{grid-template-columns:1fr;gap:16px}
  .w{padding:23px}
  .tl{display:none} .tl-m{display:block}
  .hero-foot{margin-top:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mau-note"><b>Mẫu v3 — số liệu giả</b>, dáng widget theo manage (Tổng quan), màu hồng quanlygieo. Chưa sửa file thật.</div>

  <div class="page-head">
    <div><h1>Đặt hàng</h1><div class="sub">Kho · Gieo GG01</div></div>
    <div class="seg"><button class="on" data-v="week">Đơn thứ Hai</button><button data-v="day">Đặt lẻ hôm nay</button></div>
  </div>

  <section class="hero" id="hero"></section>

  <div class="sec"><h2 id="secTitle"></h2><span class="r" id="secRight"></span></div>
  <div class="grid" id="grid"></div>

  <div class="lw" id="okList"></div>
</div>

<script>
// ===== SỐ LIỆU GIẢ (cùng bộ với mẫu v1 / v2) — giá theo quy cách đặt =====
const ITEMS = [
 {name:'Sữa tươi không đường', mk:'ST', c:'#2B57A8', unit:'ml', use:[7400,5600,5800,5900,6100,6900,7800], sd:850, stock:21000, incoming:0, min:6000, e2:{est:.012,high:.021,state:'trusted'}, pack:{name:'thùng', base:12000, sub:'Thùng 12 hộp 1L', price:330000}},
 {name:'Trà ô long lá', mk:'TO', c:'#12855A', unit:'g', use:[310,240,250,250,260,300,330], sd:40, stock:820, incoming:0, min:300, e2:{est:.018,high:.030,state:'trusted'}, pack:{name:'gói', base:500, sub:'Gói 500 g', price:180000}},
 {name:'Bột kem béo', mk:'BK', c:'#A8690B', unit:'g', use:[560,430,440,450,470,520,600], sd:70, stock:3600, incoming:1000, min:1000, e2:{est:.020,high:.034,state:'learning'}, pack:{name:'bao', base:1000, sub:'Bao 1 kg', price:95000}},
 {name:'Đường nước', mk:'ĐN', c:'#C2410C', unit:'ml', use:[1300,1000,1020,1050,1080,1200,1400], sd:160, stock:4200, incoming:0, min:2000, e2:{est:.010,high:.022,state:'trusted'}, pack:{name:'can', base:5000, sub:'Can 5 L', price:120000}},
 {name:'Ly nhựa 500 ml', mk:'LY', c:'#7554AF', unit:'cái', use:[190,140,145,150,155,175,205], sd:22, stock:1450, incoming:0, min:300, e2:{est:.006,high:.015,state:'trusted'}, pack:{name:'thùng', base:1000, sub:'Thùng 1.000 cái', price:650000}},
 {name:'Trân châu đen', mk:'TC', c:'#E23A5D', unit:'g', use:[1450,1100,1120,1150,1200,1350,1550], sd:190, stock:2600, incoming:0, min:2000, e2:{est:.015,high:.040,state:'cold_start'}, pack:{name:'gói', base:1000, sub:'Gói 1 kg', price:45000}},
 {name:'Siro đào', mk:'SĐ', c:'#DB2777', unit:'ml', use:[110,80,85,85,90,100,120], sd:25, stock:2100, incoming:0, min:500, e2:{est:.012,high:.030,state:'learning'}, pack:{name:'chai', base:750, sub:'Chai 750 ml', price:160000}},
 {name:'Ống hút to', mk:'OH', c:'#0E7490', unit:'cái', use:[150,110,115,118,120,135,160], sd:18, stock:3800, incoming:0, min:500, e2:{est:.005,high:.012,state:'trusted'}, pack:{name:'bịch', base:250, sub:'Bịch 250 cái', price:35000}},
];
const Z90=1.2816, THU=['CN','T2','T3','T4','T5','T6','T7'];
const fmt=(x,d=0)=>Number(x).toLocaleString('vi-VN',{maximumFractionDigits:d});
const q=(v,u)=>u==='ml'&&Math.abs(v)>=1000?fmt(v/1000,1)+' L':u==='g'&&Math.abs(v)>=1000?fmt(v/1000,1)+' kg':fmt(v)+' '+u;
const k=v=>v>=1e6?fmt(v/1e6,2)+'tr':fmt(Math.round(v/1000))+'k';
const demand=(it,days)=>days.reduce((s,d)=>s+it.use[d.dow]*d.frac,0);
const sdOf=(it,days)=>it.sd*Math.sqrt(days.reduce((s,d)=>s+d.frac,0));
const e2Chip=s=>s==='trusted'?'<span class="e2 ok">E2 tin cậy</span>':s==='learning'?'<span class="e2 lr">E2 đang học</span>':'<span class="e2 cs">E2 chưa có số</span>';

// --- Đặt lẻ hôm nay: T5 19/11 15:10, cầm cự tới hàng thứ Hai về (sáng T3 24/11)
const DAY_SEQ=[{dow:4,frac:.4,d:19},{dow:5,frac:1,d:20},{dow:6,frac:1,d:21},{dow:0,frac:1,d:22},{dow:1,frac:1,d:23}];
function calcDay(it){
  const have=it.stock+it.incoming, need0=demand(it,DAY_SEQ)*(1+it.e2.est);
  const safety=Math.max(it.e2.high*demand(it,DAY_SEQ)+Z90*sdOf(it,DAY_SEQ), it.min*.5);
  const raw=Math.max(0,need0+safety-have), packs=Math.ceil(raw/it.pack.base-1e-9);
  let left=have,het=null; DAY_SEQ.forEach(d=>{left-=it.use[d.dow]*d.frac*(1+it.e2.est); if(left<0&&!het)het=d;});
  return {have,dung:need0,safety,need:need0+safety,packs:het?packs:0,het,perDay:need0/4.4};
}
// Tồn tối CN = tồn T5 + hàng đặt lẻ T5 − dùng tới CN 21:40 (để hai màn khớp nhau)
ITEMS.forEach(it=>{const r=calcDay(it); it.le=r.packs;
  it.stockCN=Math.max(0,Math.round(it.stock+it.incoming+it.le*it.pack.base-demand(it,[{dow:4,frac:.4},{dow:5,frac:1},{dow:6,frac:1},{dow:0,frac:.95}])*(1+it.e2.est)));});
// --- Đơn thứ Hai: lập CN 22/11 21:40, đủ tới lần hàng về sau (T3 01/12)
const TOI_VE=[{dow:0,frac:.05},{dow:1,frac:1}], CHU_KY=[2,3,4,5,6,0,1].map(d=>({dow:d,frac:1}));
function calcWeek(it){
  const all=[...TOI_VE,...CHU_KY], dung=demand(it,all);
  const safety=Math.max(it.e2.high*dung+Z90*sdOf(it,all), it.min);
  const raw=Math.max(0,dung+safety-it.stockCN), packs=Math.ceil(raw/it.pack.base-1e-9);
  const perDay=dung/8.05;
  return {have:it.stockCN,dung,safety,need:dung+safety,packs,daysLeft:it.stockCN/(perDay*(1+it.e2.est))};
}

function widget(it,r,mode){
  const pct=Math.round(r.have/r.need*100);
  const pill = mode==='day'
    ? `<div class="pill bad">▼ <b>Hết khoảng ${THU[r.het.dow]} ${r.het.d}/11</b> · trước hàng thứ Hai</div>`
    : (r.daysLeft<1.6?`<div class="pill bad">▼ <b>Còn ~${fmt(r.daysLeft,1)} ngày</b> · hàng về T3 24/11</div>`
                     :`<div class="pill ok">✓ <b>Còn ~${fmt(r.daysLeft,1)} ngày</b> · đủ tới khi hàng về</div>`);
  return `<article class="w" style="--c:${it.c}">
    <div class="w-head"><div class="mark">${it.mk}</div><div class="w-heading"><h3>${it.name}</h3><p>${it.pack.sub}</p></div>${e2Chip(it.e2.state)}</div>
    <div class="w-main"><div class="w-label">${mode==='day'?'Nên đặt lẻ':'Đề xuất đặt'}</div>
      <div class="w-val">${r.packs}<span>${it.pack.name}</span></div>
      <div class="w-share"><span>= ${q(r.packs*it.pack.base,it.unit)}</span><span>≈ <b>${fmt(r.packs*it.pack.price)} đ</b></span></div></div>
    ${pill}
    <div class="goal-row"><span>Tồn so với cần có</span><strong>${pct}%</strong></div>
    <div class="track"><i style="width:${Math.min(100,pct)}%"></i></div>
    <div class="note">Dự trữ <b>${q(r.safety,it.unit)}</b> = hao hụt Engine 2 ${fmt(it.e2.high*100,1)}% + dao động bán${it.e2.state==='cold_start'?' · E2 chưa có số → theo tồn tối thiểu':''}</div>
    <div class="metrics"><div><span>Còn</span><b>${q(r.have,it.unit)}</b></div><div><span>${mode==='day'?'Dùng tới 24/11':'Dùng tới 01/12'}</span><b>${q(r.dung,it.unit)}</b></div><div><span>Cần có</span><b>${q(r.need,it.unit)}</b></div></div>
  </article>`;
}

function hero(mode,list){
  const tong=list.reduce((s,x)=>s+x.r.packs*x.it.pack.price,0);
  const dist=list.map(x=>`<i style="width:${x.r.packs*x.it.pack.price/tong*100}%;background:${x.it.c}"></i>`).join('');
  const leg=list.slice().sort((a,b)=>b.r.packs*b.it.pack.price-a.r.packs*a.it.pack.price)
    .map(x=>`<span><i style="background:${x.it.c}"></i>${x.it.name} <b>${Math.round(x.r.packs*x.it.pack.price/tong*100)}%</b>· ${k(x.r.packs*x.it.pack.price)}</span>`).join('');
  const W = mode==='week';
  // Dòng thời gian: vị trí % trên thanh
  const pts = W ? [[0,'CN 22/11','bây giờ',1],[12,'T2 23/11','đặt hàng',0],[24,'T3 24/11','hàng về',0],[100,'T3 01/12','lần về sau',0]]
               : [[0,'T5 19/11','bây giờ',1],[16,'T6 20/11','hàng lẻ về',0],[100,'T3 24/11','hàng thứ Hai về',0]];
  const tl = pts.map(([p,a,b,on],i)=>`<span class="tl-pt${on?' on':''}" style="left:${p}%"></span><span class="tl-lb${i===0?' l':p===100?' r':''}" style="left:${p}%">${a}</span><span class="tl-lb dn${i===0?' l':p===100?' r':''}" style="left:${p}%">${b}</span>`).join('');
  document.getElementById('hero').innerHTML = `
    <div class="hero-top"><div class="eyebrow">${W?'Đơn thứ Hai 23/11':'Đặt lẻ hôm nay · T5 19/11'}</div><span class="chip-w">Engine 2 · đêm ${W?'21/11':'18/11'}</span></div>
    <div class="total">${fmt(tong)}<span>đ</span></div>
    <div class="total-sub">${list.length} món · ${W?'đủ dùng tới T3 01/12':'đủ cầm cự tới khi hàng thứ Hai về'}</div>
    <div class="dist">${dist}</div>
    <div class="legend">${leg}</div>
    <div class="tl"><div class="tl-track">${tl}</div></div>
    <div class="tl-m">${W?'Đặt <b>T2 23/11</b> → hàng về <b>T3 24/11</b> → đủ tới <b>T3 01/12</b>':'Đặt hôm nay → về <b>T6 20/11</b> → cầm cự tới <b>T3 24/11</b> (hàng thứ Hai về)'}</div>
    <div class="hero-foot"><span>${W?'Lập CN 22/11 21:40 · dùng 28 ngày theo từng thứ':'Cập nhật 15:10 · chỉ món không cầm cự được'}</span>
      <div class="hero-btns"><button class="hb hb-g" onclick="alert('Bản thật: chép danh sách để dán Zalo.')">Chép gửi Zalo</button><button class="hb hb-w" onclick="alert('Bản thật: điền vào form Tạo đơn đặt hàng đang có, sửa số rồi bấm Tạo đơn như mọi khi.')">Tạo đơn</button></div></div>`;
}

function okList(mode,list){
  document.getElementById('okList').innerHTML = `<div class="w-head"><div class="mark">✓</div><div class="w-heading"><h3>${mode==='week'?'Còn đủ, không cần đặt':'Đủ tới hàng thứ Hai'}</h3><p>${list.length} món</p></div></div>`
   + list.map(({it,r})=>`<div class="lrow"><div class="mark" style="background:${it.c}">${it.mk}</div><div class="nm">${it.name}<small>Còn ${q(r.have,it.unit)}</small></div><div class="rt">${mode==='week'?'~'+fmt(r.daysLeft,0)+' ngày':'Đủ'}<small>${mode==='week'?'qua 01/12':'sau 24/11'}</small></div></div>`).join('');
}

function render(mode){
  const all=ITEMS.map(it=>({it,r:mode==='week'?calcWeek(it):calcDay(it)}));
  const can=all.filter(x=>x.r.packs>0).sort((a,b)=>b.r.packs*b.it.pack.price-a.r.packs*a.it.pack.price);
  const du=all.filter(x=>!x.r.packs);
  hero(mode,can);
  secTitle.innerHTML=(mode==='week'?'Cần đặt':'Nên đặt lẻ hôm nay')+`<small>${can.length}</small>`;
  secRight.textContent=mode==='week'?'Làm tròn lên theo quy cách':'Đặt vừa đủ tới thứ Hai — tránh ôm hàng';
  grid.innerHTML=can.map(x=>widget(x.it,x.r,mode)).join('');
  okList(mode,du);
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)); render(b.dataset.v);});
render('week');
</script>
</body>
</html>
