<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gợi ý đặt hàng — mẫu v4 (một widget)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* MẪU DUYỆT v4 — số liệu giả. MỘT widget, dáng theo widget «Bill chung» của manage
   (khung bo 36px nền nhạt theo màu, hàng dạng viên trắng, ô ký hiệu, số tiền màu). Màu hồng quanlygieo. */
:root{--gd:#E23A5D;--gm:#B7284A;--bg:#F8EFF2;--panel:#FFFFFF;--ink:#17151A;--sub:#6C6873;--ok:#12855A;--warn:#A8690B;--bad:#D2333F}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
.mau-note{font-size:12px;color:#6b5512;background:#fff8e1;border:1px dashed #d9b44a;border-radius:14px;padding:8px 12px;margin-bottom:16px}

.wg{--c:var(--gd);padding:20px;border-radius:36px;border:1px solid color-mix(in srgb,var(--c) 14%,var(--panel));
  background:radial-gradient(ellipse at 12% 0%,color-mix(in srgb,var(--c) 20%,var(--panel)),transparent 80%),color-mix(in srgb,var(--c) 7%,var(--panel));
  box-shadow:inset 0 1px 0 #ffffff80,0 5px 18px color-mix(in srgb,var(--c) 8%,transparent)}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border-radius:15px;background:var(--c);color:#fff;font-size:15px;font-weight:850;letter-spacing:-.5px}
.ttl{flex:1;min-width:0}
.ttl h3{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.ttl p{font-size:12.5px;color:var(--sub);margin-top:2px}
.seg{display:inline-flex;background:color-mix(in srgb,var(--panel) 70%,transparent);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font:inherit;font-size:13px;font-weight:650;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--gm);font-weight:800;box-shadow:0 1px 3px #0000001a}

.sum{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 2px 4px}
.sum .lb{font-size:13px;font-weight:650;color:var(--sub)}
.sum .v{font-size:40px;font-weight:850;letter-spacing:-1.5px;line-height:1.15;color:var(--c)}
.sum .v span{font-size:17px;margin-left:3px;letter-spacing:0}
.sum .when{font-size:12.5px;color:var(--sub);text-align:right;line-height:1.6}
.sum .when b{color:var(--ink)}

.row{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--panel) 82%,transparent);border-radius:18px;padding:10px 14px;margin-top:8px;cursor:pointer}
.row:hover{background:var(--panel)}
.row .mark{width:36px;height:36px;border-radius:12px;font-size:13px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:12px;color:var(--sub)}
.tag{font-size:11px;font-weight:750;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-bad{background:#FCE7E9;color:var(--bad)} .t-ok{background:#E2F4EB;color:var(--ok)} .t-mute{background:#EDECE9;color:var(--sub)}
.qty{text-align:right;min-width:86px}
.qty b{display:block;font-size:17px;font-weight:850;color:var(--ic);white-space:nowrap;letter-spacing:-.3px}
.qty small{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap}
.nm small .tg{display:none}
.why{display:none;font-size:12px;color:var(--sub);padding:8px 14px 4px 62px;line-height:1.55}
.why.open{display:block}
.why b{color:var(--ink)}

.okbox{margin-top:12px}
.okbox summary{list-style:none;cursor:pointer;font-size:13px;font-weight:750;color:var(--ok);padding:6px 4px}
.okbox summary::-webkit-details-marker{display:none}
.okbox .row{opacity:.75;cursor:default}

.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--c) 16%,transparent)}
.foot span{font-size:12px;color:var(--sub)}
.btns{display:flex;gap:8px}
.btn{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:750;cursor:pointer;white-space:nowrap}
.b-p{background:var(--c);color:#fff}.b-s{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px #0000001a}

@media(max-width:760px){
  .wg{padding:18px 14px;border-radius:30px}
  .head .seg{width:100%} .seg button{flex:1}
  .sum .v{font-size:34px}
  .sum .when{text-align:left}
  .row{gap:10px;padding:10px 12px}
  .row .tag{display:none}
  .nm small .tg{display:inline}
  .why{padding-left:12px}
  .foot .btns{width:100%} .btn{flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mau-note"><b>Mẫu v4 — số liệu giả.</b> Một widget duy nhất. Bấm vào một hàng để xem cách tính.</div>
  <section class="wg" id="wg"></section>
</div>

<script>
const ITEMS = [
 {name:'Sữa tươi không đường', mk:'ST', c:'#2B57A8', unit:'ml', use:[7400,5600,5800,5900,6100,6900,7800], sd:850, stock:21000, incoming:0, min:6000, e2:{est:.012,high:.021,state:'trusted'}, pack:{name:'thùng', base:12000, sub:'thùng 12 hộp 1L', price:330000}},
 {name:'Trà ô long lá', mk:'TO', c:'#12855A', unit:'g', use:[310,240,250,250,260,300,330], sd:40, stock:820, incoming:0, min:300, e2:{est:.018,high:.030,state:'trusted'}, pack:{name:'gói', base:500, sub:'gói 500 g', price:180000}},
 {name:'Bột kem béo', mk:'BK', c:'#A8690B', unit:'g', use:[560,430,440,450,470,520,600], sd:70, stock:3600, incoming:1000, min:1000, e2:{est:.020,high:.034,state:'learning'}, pack:{name:'bao', base:1000, sub:'bao 1 kg', price:95000}},
 {name:'Đường nước', mk:'ĐN', c:'#C2410C', unit:'ml', use:[1300,1000,1020,1050,1080,1200,1400], sd:160, stock:4200, incoming:0, min:2000, e2:{est:.010,high:.022,state:'trusted'}, pack:{name:'can', base:5000, sub:'can 5 L', price:120000}},
 {name:'Ly nhựa 500 ml', mk:'LY', c:'#7554AF', unit:'cái', use:[190,140,145,150,155,175,205], sd:22, stock:1450, incoming:0, min:300, e2:{est:.006,high:.015,state:'trusted'}, pack:{name:'thùng', base:1000, sub:'thùng 1.000 cái', price:650000}},
 {name:'Trân châu đen', mk:'TC', c:'#E23A5D', unit:'g', use:[1450,1100,1120,1150,1200,1350,1550], sd:190, stock:2600, incoming:0, min:2000, e2:{est:.015,high:.040,state:'cold_start'}, pack:{name:'gói', base:1000, sub:'gói 1 kg', price:45000}},
 {name:'Siro đào', mk:'SĐ', c:'#DB2777', unit:'ml', use:[110,80,85,85,90,100,120], sd:25, stock:2100, incoming:0, min:500, e2:{est:.012,high:.030,state:'learning'}, pack:{name:'chai', base:750, sub:'chai 750 ml', price:160000}},
 {name:'Ống hút to', mk:'OH', c:'#0E7490', unit:'cái', use:[150,110,115,118,120,135,160], sd:18, stock:3800, incoming:0, min:500, e2:{est:.005,high:.012,state:'trusted'}, pack:{name:'bịch', base:250, sub:'bịch 250 cái', price:35000}},
];
const Z90=1.2816, THU=['CN','T2','T3','T4','T5','T6','T7'];
const fmt=(x,d=0)=>Number(x).toLocaleString('vi-VN',{maximumFractionDigits:d});
const q=(v,u)=>u==='ml'&&Math.abs(v)>=1000?fmt(v/1000,1)+' L':u==='g'&&Math.abs(v)>=1000?fmt(v/1000,1)+' kg':fmt(v)+' '+u;
const demand=(it,days)=>days.reduce((s,d)=>s+it.use[d.dow]*d.frac,0);
const sdOf=(it,days)=>it.sd*Math.sqrt(days.reduce((s,d)=>s+d.frac,0));

const DAY_SEQ=[{dow:4,frac:.4,d:19},{dow:5,frac:1,d:20},{dow:6,frac:1,d:21},{dow:0,frac:1,d:22},{dow:1,frac:1,d:23}];
function calcDay(it){
  const have=it.stock+it.incoming, dung=demand(it,DAY_SEQ)*(1+it.e2.est);
  const safety=Math.max(it.e2.high*demand(it,DAY_SEQ)+Z90*sdOf(it,DAY_SEQ), it.min*.5);
  let left=have,het=null; DAY_SEQ.forEach(d=>{left-=it.use[d.dow]*d.frac*(1+it.e2.est); if(left<0&&!het)het=d;});
  const packs=het?Math.ceil(Math.max(0,dung+safety-have)/it.pack.base-1e-9):0;
  return {have,dung,safety,packs,het,days:have/(dung/4.4)};
}
ITEMS.forEach(it=>{const r=calcDay(it); it.stockCN=Math.max(0,Math.round(it.stock+it.incoming+r.packs*it.pack.base-demand(it,[{dow:4,frac:.4},{dow:5,frac:1},{dow:6,frac:1},{dow:0,frac:.95}])*(1+it.e2.est)));});
const ALL_W=[{dow:0,frac:.05},{dow:1,frac:1},...[2,3,4,5,6,0,1].map(d=>({dow:d,frac:1}))];
function calcWeek(it){
  const dung=demand(it,ALL_W), safety=Math.max(it.e2.high*dung+Z90*sdOf(it,ALL_W), it.min);
  const packs=Math.ceil(Math.max(0,dung+safety-it.stockCN)/it.pack.base-1e-9);
  return {have:it.stockCN,dung,safety,packs,days:it.stockCN/(dung/8.05*(1+it.e2.est))};
}

let mode='week';
function render(){
  const W=mode==='week';
  const all=ITEMS.map(it=>({it,r:W?calcWeek(it):calcDay(it)}));
  const can=all.filter(x=>x.r.packs).sort((a,b)=>b.r.packs*b.it.pack.price-a.r.packs*a.it.pack.price);
  const du=all.filter(x=>!x.r.packs);
  const tong=can.reduce((s,x)=>s+x.r.packs*x.it.pack.price,0);
  const status=({it,r})=> W
    ? (r.days<1.6?['t-bad','có thể hết trước khi hàng về']:['t-ok',`còn ~${fmt(r.days,1)} ngày`])
    : ['t-bad',`hết ~${THU[r.het.dow]} ${r.het.d}/11`];
  const e2=s=>s==='trusted'?'':s==='learning'?' · E2 đang học':' · E2 chưa có số';
  const row=(x,i)=>{const {it,r}=x,[tc,tt]=status(x);
    return `<div class="row" style="--ic:${it.c}" onclick="document.getElementById('y${i}').classList.toggle('open')">
      <div class="mark" style="background:${it.c}">${it.mk}</div>
      <div class="nm"><b>${it.name}</b><small>Còn ${q(r.have,it.unit)}<span class="tg"> · ${tt}</span>${e2(it.e2.state)}</small></div>
      <span class="tag ${tc}">${tt}</span>
      <div class="qty"><b>${r.packs} ${it.pack.name}</b><small>≈ ${fmt(r.packs*it.pack.price)} đ</small></div></div>
      <div class="why" id="y${i}">${it.pack.sub} · ${W?'dùng tới 01/12':'dùng tới khi hàng thứ Hai về'} <b>${q(r.dung,it.unit)}</b> + dự trữ <b>${q(r.safety,it.unit)}</b> (hao hụt Engine 2 ${fmt(it.e2.high*100,1)}% + dao động bán${it.e2.state==='cold_start'?', E2 chưa có số → theo tồn tối thiểu':''}) − còn <b>${q(r.have,it.unit)}</b> → làm tròn lên ${r.packs} ${it.pack.name}.</div>`;};
  document.getElementById('wg').innerHTML=`
    <div class="head">
      <div class="mark">ĐH</div>
      <div class="ttl"><h3>${W?'Đơn thứ Hai 23/11':'Đặt lẻ hôm nay · T5 19/11'}</h3><p>${W?'Lập CN 22/11 21:40 · Engine 2 đêm 21/11':'Cập nhật 15:10 · chỉ món không cầm cự được tới hàng thứ Hai'}</p></div>
      <div class="seg"><button class="${W?'on':''}" onclick="mode='week';render()">Đơn thứ Hai</button><button class="${W?'':'on'}" onclick="mode='day';render()">Đặt lẻ hôm nay</button></div>
    </div>
    <div class="sum">
      <div><div class="lb">${can.length} món · dự kiến</div><div class="v">${fmt(tong)}<span>đ</span></div></div>
      <div class="when">${W?'Đặt <b>T2 23/11</b> → về <b>T3 24/11</b><br>đủ dùng tới <b>T3 01/12</b>':'Đặt hôm nay → về <b>T6 20/11</b><br>cầm cự tới <b>T3 24/11</b>'}</div>
    </div>
    ${can.map(row).join('')}
    <details class="okbox"><summary>✓ ${du.length} món ${W?'còn đủ, không cần đặt':'đủ tới hàng thứ Hai'} ›</summary>
      ${du.map(({it,r})=>`<div class="row"><div class="mark" style="background:${it.c}">${it.mk}</div><div class="nm"><b>${it.name}</b><small>Còn ${q(r.have,it.unit)}</small></div><div class="qty"><b style="color:var(--ok)">${W?'~'+fmt(r.days,0)+' ngày':'Đủ'}</b></div></div>`).join('')}
    </details>
    <div class="foot"><span>Dự trữ = hao hụt Engine 2 + dao động bán · làm tròn theo quy cách</span>
      <div class="btns"><button class="btn b-s" onclick="alert('Bản thật: chép danh sách để dán Zalo.')">Chép gửi Zalo</button><button class="btn b-p" onclick="alert('Bản thật: điền vào form Tạo đơn đặt hàng đang có, sửa số rồi bấm Tạo đơn.')">Tạo đơn</button></div></div>`;
}
render();
</script>
</body>
</html>
